<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ASTEROIDS: VOID PROTOCOL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#06060f;overflow:hidden;font-family:'Courier New',monospace;display:flex;align-items:center;justify-content:center;height:100vh}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="/static/games/chiptune.js"></script>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=canvas.width=900,H=canvas.height=700;
let highScore=parseInt(localStorage.getItem('asteroidsVoid_hi'))||0;

// ===== VFX toolkit (visual-only additive layer; gameplay untouched) =====
const VFX={shake:0,sx:0,sy:0,flash:0,flashCol:'255,255,255'};
function vfxShake(m){VFX.shake=Math.max(VFX.shake,Math.min(14,m));}
function vfxFlash(a,col){if(a>=VFX.flash){VFX.flash=Math.min(0.55,a);VFX.flashCol=col||'255,255,255';}}
function vfxUpdate(){
  if(VFX.shake>0.15){VFX.sx=(Math.random()*2-1)*VFX.shake;VFX.sy=(Math.random()*2-1)*VFX.shake;VFX.shake*=0.85;}
  else{VFX.shake=0;VFX.sx=0;VFX.sy=0;}
  VFX.flash*=0.86;if(VFX.flash<0.012)VFX.flash=0;
}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const GLOW_SPR={};
function glowSprite(hue){
  const key=((Math.round(hue/24)*24)%360+360)%360;
  if(GLOW_SPR[key])return GLOW_SPR[key];
  const c=mkCanvas(64,64),g=c.getContext('2d');
  const grad=g.createRadialGradient(32,32,0,32,32,32);
  grad.addColorStop(0,'rgba(255,255,255,0.95)');
  grad.addColorStop(0.16,`hsla(${key},100%,78%,0.85)`);
  grad.addColorStop(0.42,`hsla(${key},95%,58%,0.32)`);
  grad.addColorStop(1,`hsla(${key},90%,50%,0)`);
  g.fillStyle=grad;g.fillRect(0,0,64,64);
  GLOW_SPR[key]=c;return c;
}
function drawGlow(cx2,x,y,r,hue,alpha){
  if(r<=0||alpha<=0)return;
  cx2.globalAlpha=Math.min(1,alpha);
  cx2.drawImage(glowSprite(hue),x-r,y-r,r*2,r*2);
  cx2.globalAlpha=1;
}
function nebulaSprite(h1,h2){
  const c=mkCanvas(256,256),g=c.getContext('2d');
  const grad=g.createRadialGradient(128,128,0,128,128,128);
  grad.addColorStop(0,`hsla(${h1},90%,60%,0.5)`);
  grad.addColorStop(0.45,`hsla(${h2},85%,48%,0.2)`);
  grad.addColorStop(1,'hsla(0,0%,0%,0)');
  g.fillStyle=grad;g.fillRect(0,0,256,256);
  return c;
}
let BG_CACHE=null,OVERLAY_CACHE=null;
const NEBULAS=[];
function buildSpaceLayers(){
  BG_CACHE=mkCanvas(W,H);
  const g=BG_CACHE.getContext('2d');
  const base=g.createLinearGradient(0,0,0,H);
  base.addColorStop(0,'#05030a');base.addColorStop(0.55,'#0a0618');base.addColorStop(1,'#0a0a18');
  g.fillStyle=base;g.fillRect(0,0,W,H);
  const wash=g.createRadialGradient(W*0.5,H*0.42,10,W*0.5,H*0.42,Math.max(W,H)*0.7);
  wash.addColorStop(0,'rgba(60,30,110,0.22)');
  wash.addColorStop(0.6,'rgba(20,25,70,0.12)');
  wash.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=wash;g.fillRect(0,0,W,H);
  g.lineWidth=1;
  for(let r=60;r<Math.max(W,H)*0.75;r+=88){
    g.strokeStyle=(r/88)%2<1?'rgba(127,215,255,0.045)':'rgba(233,200,106,0.035)';
    g.beginPath();g.arc(W*0.5,H*0.46,r,0,Math.PI*2);g.stroke();
  }
  OVERLAY_CACHE=mkCanvas(W,H);
  const o=OVERLAY_CACHE.getContext('2d');
  const v=o.createRadialGradient(W/2,H/2,Math.min(W,H)*0.36,W/2,H/2,Math.max(W,H)*0.74);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(2,1,6,0.5)');
  o.fillStyle=v;o.fillRect(0,0,W,H);
  o.fillStyle='rgba(0,0,0,0.05)';
  for(let y=0;y<H;y+=3)o.fillRect(0,y,W,1);
  NEBULAS.length=0;
  NEBULAS.push({spr:nebulaSprite(265,320),x:W*0.26,y:H*0.32,r:W*0.42,dx:0.018,dy:0.008,ph:0});
  NEBULAS.push({spr:nebulaSprite(192,150),x:W*0.78,y:H*0.7,r:W*0.36,dx:-0.013,dy:-0.007,ph:2.1});
  NEBULAS.push({spr:nebulaSprite(322,25),x:W*0.6,y:H*0.14,r:W*0.28,dx:0.01,dy:0.006,ph:4.2});
}
buildSpaceLayers();
const STARFIELD=[{spd:0.05,n:90},{spd:0.14,n:55},{spd:0.32,n:26}];
STARFIELD.forEach((L,li)=>{
  L.stars=[];
  for(let i=0;i<L.n;i++)L.stars.push({x:Math.random()*W,y:Math.random()*H,s:0.6+li*0.7+Math.random()*0.9,b:Math.random()*6,hue:Math.random()<0.14?[200,48,315][li]:222});
});
function drawSpace(){
  ctx.drawImage(BG_CACHE,0,0);
  ctx.save();ctx.globalCompositeOperation='screen';
  for(const n of NEBULAS){
    n.ph+=0.004;n.x+=n.dx;n.y+=n.dy;
    if(n.x<-n.r)n.x=W+n.r;else if(n.x>W+n.r)n.x=-n.r;
    if(n.y<-n.r)n.y=H+n.r;else if(n.y>H+n.r)n.y=-n.r;
    ctx.globalAlpha=0.16+Math.sin(n.ph)*0.06;
    ctx.drawImage(n.spr,n.x-n.r,n.y-n.r,n.r*2,n.r*2);
  }
  ctx.globalAlpha=1;ctx.restore();
  for(let li=0;li<STARFIELD.length;li++){
    const L=STARFIELD[li];
    for(const s of L.stars){
      s.x-=L.spd;if(s.x<-2)s.x+=W+2;
      s.b+=0.03;
      const tw=0.28+li*0.14+Math.sin(s.b)*0.26;
      ctx.fillStyle=`hsla(${s.hue},80%,84%,${Math.max(0.06,tw)})`;
      ctx.fillRect(s.x,s.y,s.s,s.s);
    }
  }
  const L2=STARFIELD[2];
  for(let i=0;i<L2.stars.length;i+=6){
    const s=L2.stars[i];
    drawGlow(ctx,s.x,s.y,5,s.hue,0.2+Math.sin(s.b)*0.12);
  }
}
function hudPanel(x,y,w,h,stroke){
  ctx.fillStyle='rgba(6,4,14,0.6)';
  ctx.strokeStyle=stroke;ctx.lineWidth=1;
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(x,y,w,h,7);else ctx.rect(x,y,w,h);
  ctx.fill();ctx.stroke();
}
function setSpacing(px){try{ctx.letterSpacing=px+'px';}catch(e){}}
// ===== end VFX toolkit =====

// --- Chiptune audio (guarded; game runs fine if chiptune.js fails to load) ---
const SND_LAST={};
function SND(n){
  try{
    if(!window.Chiptune)return;
    const now=performance.now();
    if(SND_LAST[n]&&now-SND_LAST[n]<70)return;
    SND_LAST[n]=now;
    Chiptune.SFX[n]();
  }catch(e){}
}
let music=null;
function musicStart(){
  try{
    if(window.Chiptune&&!music)music=Chiptune.Music({
      bpm:104,vol:0.4,melType:'square',
      mel:[57,null,60,null,64,null,60,null,57,null,64,null,67,null,64,null],
      bass:[33,33,40,40,36,36,43,43]
    });
  }catch(e){}
}
function musicStop(){try{if(music){music.stop();music=null;}}catch(e){}}

const STATE={MENU:0,PLAY:1,DEAD:2};
let state=STATE.MENU,frameCount=0;
let ship,bullets,asteroids,particles,ufos,ufoTimer,stars,score,lives,level,invincible;

// Stars background now handled by the pre-rendered parallax starfield in drawSpace()

function colorHue(color){
  if(color==='#f44')return 4;
  if(color==='#fd0')return 50;
  if(color==='#f80')return 28;
  if(color==='#0f8')return 150;
  if(color==='#f0f')return 305;
  if(color==='#0ff')return 185;
  return 215;
}

function drawFacetGem(x,y,r,hue,rot=0,alpha=1){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot);
  ctx.globalAlpha=alpha;
  drawGlow(ctx,0,0,r*2.6,hue,0.5*alpha);
  ctx.globalAlpha=alpha;
  const g=ctx.createRadialGradient(-r*0.3,-r*0.35,r*0.1,0,0,r*1.2);
  g.addColorStop(0,'rgba(255,255,255,0.94)');
  g.addColorStop(0.22,`hsla(${hue+60},100%,76%,0.9)`);
  g.addColorStop(0.58,`hsla(${hue},100%,54%,0.78)`);
  g.addColorStop(1,`hsla(${hue+145},100%,34%,0.34)`);
  ctx.fillStyle=g;
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    const rr=i%2?r*0.7:r;
    ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
  }
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle=`hsla(${hue+70},100%,84%,${0.82*alpha})`;
  ctx.lineWidth=Math.max(1,r*0.09);
  ctx.stroke();
  ctx.strokeStyle=`rgba(255,255,255,${0.42*alpha})`;
  ctx.lineWidth=1;
  for(let i=0;i<4;i++){
    const a=i*Math.PI/2+Math.PI/4;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(a)*r*0.9,Math.sin(a)*r*0.9);
    ctx.stroke();
  }
  ctx.restore();
}

function drawCausticField(){
  ctx.save();
  ctx.globalCompositeOperation='screen';
  for(let i=0;i<22;i++){
    const hue=(frameCount*0.8+i*29)%360;
    const x=(i*W/7+Math.sin(frameCount*0.012+i)*100)%W;
    const y=(i*H/8+Math.cos(frameCount*0.01+i)*84)%H;
    const r=105+Math.sin(frameCount*0.015+i)*38;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,`hsla(${hue},100%,58%,0.13)`);
    g.addColorStop(0.45,`hsla(${hue+80},100%,58%,0.045)`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

const keys={};
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  try{if(window.Chiptune)Chiptune.resume();}catch(err){}
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code==='Space'){
    if(state===STATE.MENU){init();state=STATE.PLAY;}
    else if(state===STATE.DEAD){state=STATE.MENU;}
  }
});
document.addEventListener('keyup',e=>keys[e.code]=false);

function init(){
  ship={x:W/2,y:H/2,vx:0,vy:0,angle:0,thrust:false,shootCd:0};
  bullets=[];asteroids=[];particles=[];ufos=[];
  score=0;lives=3;level=1;invincible=120;ufoTimer=600;
  spawnAsteroids(4);
  musicStart();
}

function spawnAsteroids(count){
  for(let i=0;i<count;i++){
    let x,y;
    do{x=Math.random()*W;y=Math.random()*H;}
    while(Math.hypot(x-ship.x,y-ship.y)<150);
    const a=Math.random()*Math.PI*2;
    const sp=0.5+Math.random()*1.5;
    const verts=[];
    const numV=8+Math.floor(Math.random()*5);
    for(let j=0;j<numV;j++){
      const ang=j*Math.PI*2/numV;
      const r=35+Math.random()*15;
      verts.push({x:Math.cos(ang)*r,y:Math.sin(ang)*r});
    }
    asteroids.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,size:3,radius:40,verts,rot:0,rotSpd:(Math.random()-0.5)*0.02});
  }
}

function splitAsteroid(a){
  if(a.size<=1)return;
  for(let i=0;i<2;i++){
    const ang=Math.random()*Math.PI*2;
    const sp=1+Math.random()*2;
    const newSize=a.size-1;
    const r=newSize===2?22:12;
    const verts=[];
    const numV=6+Math.floor(Math.random()*4);
    for(let j=0;j<numV;j++){
      const va=j*Math.PI*2/numV;
      const vr=r-4+Math.random()*8;
      verts.push({x:Math.cos(va)*vr,y:Math.sin(va)*vr});
    }
    asteroids.push({x:a.x,y:a.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,size:newSize,radius:r,verts,rot:0,rotSpd:(Math.random()-0.5)*0.03});
  }
}

function spawnParticles(x,y,color,count,speed){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const sp=Math.random()*(speed||4)+0.5;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color,size:Math.random()*3+1});
  }
  if(particles.length>220)particles.splice(0,particles.length-220);
}

function wrap(obj){
  if(obj.x<-50)obj.x=W+50;if(obj.x>W+50)obj.x=-50;
  if(obj.y<-50)obj.y=H+50;if(obj.y>H+50)obj.y=-50;
}

function update(){
  frameCount++;
  if(state!==STATE.PLAY)return;

  // Ship controls
  if(keys['ArrowLeft'])ship.angle-=0.06;
  if(keys['ArrowRight'])ship.angle+=0.06;
  ship.thrust=!!keys['ArrowUp'];
  if(ship.thrust){
    ship.vx+=Math.cos(ship.angle)*0.12;
    ship.vy+=Math.sin(ship.angle)*0.12;
    if(frameCount%3===0)spawnParticles(
      ship.x-Math.cos(ship.angle)*18,ship.y-Math.sin(ship.angle)*18,
      '#f80',2,2
    );
  }
  // Friction
  ship.vx*=0.995;ship.vy*=0.995;
  // Speed cap
  const spd=Math.hypot(ship.vx,ship.vy);
  if(spd>6){ship.vx*=6/spd;ship.vy*=6/spd;}
  ship.x+=ship.vx;ship.y+=ship.vy;
  wrap(ship);

  // Shooting
  if(ship.shootCd>0)ship.shootCd--;
  if(keys['Space']&&ship.shootCd<=0&&state===STATE.PLAY){
    ship.shootCd=12;
    const bx=ship.x+Math.cos(ship.angle)*18;
    const by=ship.y+Math.sin(ship.angle)*18;
    bullets.push({x:bx,y:by,vx:Math.cos(ship.angle)*8,vy:Math.sin(ship.angle)*8,life:60,owner:'player'});
    SND('shoot');
  }

  // Bullets
  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--;wrap(b);});
  bullets=bullets.filter(b=>b.life>0);

  // Asteroids
  asteroids.forEach(a=>{a.x+=a.vx;a.y+=a.vy;a.rot+=a.rotSpd;wrap(a);});

  // UFO
  ufoTimer--;
  if(ufoTimer<=0&&ufos.length===0){
    const uy=50+Math.random()*(H-100);
    const udir=Math.random()<0.5?1:-1;
    ufos.push({x:udir>0?-30:W+30,y:uy,vx:udir*(1.5+level*0.3),vy:0,hp:2,shootCd:60+Math.floor(Math.random()*60),radius:18});
    ufoTimer=800+Math.floor(Math.random()*400);
  }
  ufos.forEach(u=>{
    u.x+=u.vx;u.y+=Math.sin(frameCount*0.03)*0.5;
    u.shootCd--;
    if(u.shootCd<=0){
      u.shootCd=40+Math.floor(Math.random()*40);
      const ang=Math.atan2(ship.y-u.y,ship.x-u.x)+(Math.random()-0.5)*0.3;
      bullets.push({x:u.x,y:u.y,vx:Math.cos(ang)*4,vy:Math.sin(ang)*4,life:90,owner:'ufo'});
      SND('blip');
    }
  });
  ufos=ufos.filter(u=>u.x>-60&&u.x<W+60);

  // Invincibility
  if(invincible>0)invincible--;

  // Collision: bullets vs asteroids
  for(let bi=bullets.length-1;bi>=0;bi--){
    const b=bullets[bi];if(b.owner!=='player')continue;
    for(let ai=asteroids.length-1;ai>=0;ai--){
      const a=asteroids[ai];
      if(Math.hypot(b.x-a.x,b.y-a.y)<a.radius){
        bullets.splice(bi,1);
        const pts=a.size===3?20:a.size===2?50:100;
        score+=pts;
        spawnParticles(a.x,a.y,['#0ff','#f0f','#fd0'][a.size-1],12+a.size*4,3);
        vfxShake(a.size===3?3.5:a.size===2?2.2:1.2);
        if(a.size===3)vfxFlash(0.1,'127,215,255');
        SND(a.size===3?'explode':'pop');
        splitAsteroid(a);
        asteroids.splice(ai,1);
        break;
      }
    }
  }

  // Collision: bullets vs UFO
  for(let bi=bullets.length-1;bi>=0;bi--){
    const b=bullets[bi];if(b.owner!=='player')continue;
    for(let ui=ufos.length-1;ui>=0;ui--){
      const u=ufos[ui];
      if(Math.hypot(b.x-u.x,b.y-u.y)<u.radius){
        bullets.splice(bi,1);
        u.hp--;
        if(u.hp<=0){
          score+=300;
          spawnParticles(u.x,u.y,'#0f8',20,5);
          vfxShake(4.5);vfxFlash(0.14,'110,255,180');
          ufos.splice(ui,1);
          SND('explode');
        } else {
          SND('hit');
        }
        break;
      }
    }
  }

  // Collision: ship vs asteroids
  if(invincible<=0){
    for(let a of asteroids){
      if(Math.hypot(ship.x-a.x,ship.y-a.y)<a.radius+12){
        die();return;
      }
    }
    for(let u of ufos){
      if(Math.hypot(ship.x-u.x,ship.y-u.y)<u.radius+12){die();return;}
    }
    // UFO bullets hit ship
    for(let b of bullets){
      if(b.owner==='ufo'&&Math.hypot(b.x-ship.x,b.y-ship.y)<14){die();return;}
    }
  }

  // Particles
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=0.02;p.vx*=0.98;p.vy*=0.98;});
  particles=particles.filter(p=>p.life>0);

  // Level complete
  if(asteroids.length===0&&ufos.length===0){
    level++;
    spawnAsteroids(3+level);
    ufoTimer=300;
    vfxFlash(0.16,'233,200,106');
    SND('gate');
  }
}

function die(){
  vfxShake(11);vfxFlash(0.4,'255,45,85');
  spawnParticles(ship.x,ship.y,'#f44',30,5);
  spawnParticles(ship.x,ship.y,'#fd0',20,3);
  lives--;
  if(lives<=0){
    state=STATE.DEAD;
    musicStop();
    SND('death');
    if(score>highScore){highScore=score;localStorage.setItem('asteroidsVoid_hi',highScore);}
  } else {
    SND('hurt');
    ship.x=W/2;ship.y=H/2;ship.vx=0;ship.vy=0;ship.angle=0;
    invincible=180;
  }
}

const shipTrail=[];
function drawShip(){
  // Motion trail (visual only; recorded even while blinking so it stays continuous)
  const spdNow=Math.hypot(ship.vx,ship.vy);
  shipTrail.push({x:ship.x,y:ship.y,a:Math.min(1,spdNow/3.5)});
  if(shipTrail.length>20)shipTrail.shift();
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<shipTrail.length;i++){
    const t=shipTrail[i];
    drawGlow(ctx,t.x,t.y,3+i*0.45,190,t.a*(i/shipTrail.length)*0.4);
  }
  ctx.restore();

  if(invincible>0&&Math.floor(frameCount/4)%2)return;
  ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.angle);

  // Baked-sprite glow halo instead of per-frame shadowBlur
  drawGlow(ctx,0,0,36,188,0.55);

  // Thrust flame (under hull) — gradient tongue + glow
  if(ship.thrust){
    const flen=16+Math.random()*8;
    drawGlow(ctx,-14-flen*0.4,0,12+Math.random()*4,32,0.8);
    const fg=ctx.createLinearGradient(-8,0,-8-flen-8,0);
    fg.addColorStop(0,'rgba(255,255,255,0.95)');
    fg.addColorStop(0.35,'rgba(255,200,90,0.85)');
    fg.addColorStop(1,'rgba(255,80,30,0)');
    ctx.fillStyle=fg;
    ctx.beginPath();ctx.moveTo(-8,5);ctx.lineTo(-8-flen,0);ctx.lineTo(-8,-5);ctx.closePath();ctx.fill();
  }

  // Ship body — gradient hull with layered neon stroke (wide soft + thin bright)
  const hull=ctx.createLinearGradient(-18,-12,22,12);
  hull.addColorStop(0,'rgba(255,255,255,0.6)');
  hull.addColorStop(0.32,'rgba(236,72,153,0.4)');
  hull.addColorStop(0.7,'rgba(127,215,255,0.5)');
  hull.addColorStop(1,'rgba(20,40,70,0.35)');
  ctx.fillStyle=hull;
  ctx.beginPath();
  ctx.moveTo(20,0);ctx.lineTo(-14,12);ctx.lineTo(-8,0);ctx.lineTo(-14,-12);ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='rgba(127,215,255,0.3)';ctx.lineWidth=5;ctx.stroke();
  ctx.strokeStyle='#bffcff';ctx.lineWidth=1.6;ctx.stroke();
  // Rim highlight along leading edge
  ctx.strokeStyle='rgba(255,255,255,0.75)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(-14,-12);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.moveTo(20,0);ctx.lineTo(-8,0);
  ctx.moveTo(-14,12);ctx.lineTo(2,0);ctx.lineTo(-14,-12);
  ctx.stroke();
  drawFacetGem(3,0,5,185,frameCount*0.04,1);
  drawFacetGem(-9,7,3.5,52,-frameCount*0.05,0.9);
  drawFacetGem(-9,-7,3.5,305,frameCount*0.05,0.9);

  ctx.restore();
}

// Cached obsidian gradient per asteroid size (3 sizes → 3 gradients, never rebuilt per frame)
const AST_GRAD={};
function astGrad(size,hue){
  if(AST_GRAD[size])return AST_GRAD[size];
  const R=size===3?40:size===2?22:12;
  const g=ctx.createRadialGradient(-R*0.35,-R*0.4,R*0.12,0,0,R*1.15);
  g.addColorStop(0,`hsla(${hue},75%,62%,0.4)`);
  g.addColorStop(0.5,`hsla(${hue},80%,36%,0.22)`);
  g.addColorStop(1,'rgba(6,3,14,0.7)');
  AST_GRAD[size]=g;return g;
}
function drawAsteroid(a){
  const hue=a.size===3?305:a.size===2?185:50;
  // Baked-sprite halo instead of shadowBlur
  drawGlow(ctx,a.x,a.y,a.radius*1.8,hue,0.35);
  ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rot);
  ctx.fillStyle=astGrad(a.size,hue);

  ctx.beginPath();
  ctx.moveTo(a.verts[0].x,a.verts[0].y);
  for(let i=1;i<a.verts.length;i++)ctx.lineTo(a.verts[i].x,a.verts[i].y);
  ctx.closePath();ctx.fill();
  // Layered neon rim: wide soft under thin hot
  ctx.strokeStyle=`hsla(${hue},100%,60%,0.3)`;ctx.lineWidth=5;ctx.stroke();
  ctx.strokeStyle=`hsla(${hue},100%,78%,0.95)`;ctx.lineWidth=1.6;ctx.stroke();

  // Inner sacred geometry line
  ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=0.7;
  if(a.verts.length>=6){
    ctx.beginPath();
    for(let i=0;i<a.verts.length;i++){
      const j=(i+Math.floor(a.verts.length/3))%a.verts.length;
      ctx.moveTo(a.verts[i].x*0.6,a.verts[i].y*0.6);
      ctx.lineTo(a.verts[j].x*0.6,a.verts[j].y*0.6);
    }
    ctx.stroke();
  }
  for(let i=0;i<Math.min(4,a.size+2);i++){
    const v=a.verts[(i*2)%a.verts.length];
    drawFacetGem(v.x*0.45,v.y*0.45,3+a.size*1.3,hue+i*24,frameCount*0.02+i,0.7);
  }

  ctx.restore();
}

function drawUFO(u){
  drawGlow(ctx,u.x,u.y,34,150,0.5);
  ctx.save();ctx.translate(u.x,u.y);

  // Saucer shape — gradient body + layered neon stroke
  const sg=ctx.createLinearGradient(0,-10,0,10);
  sg.addColorStop(0,'rgba(255,255,255,0.5)');
  sg.addColorStop(0.4,'rgba(0,255,128,0.3)');
  sg.addColorStop(1,'rgba(6,20,16,0.8)');
  ctx.fillStyle=sg;
  ctx.beginPath();ctx.ellipse(0,0,20,8,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(0,255,128,0.35)';ctx.lineWidth=4.5;ctx.stroke();
  ctx.strokeStyle='#8fffc8';ctx.lineWidth=1.5;ctx.stroke();
  // Dome
  ctx.strokeStyle='rgba(190,255,230,0.8)';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.ellipse(0,-4,10,8,0,Math.PI,0);ctx.stroke();
  for(let i=-1;i<=1;i++)drawFacetGem(i*9,0,3.5,145+i*35,frameCount*0.05+i,0.9);
  // Bottom light
  drawGlow(ctx,0,6,8,frameCount%6<3?150:185,0.9);
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(0,6,2,0,Math.PI*2);ctx.fill();

  ctx.restore();
}


function drawNorthstarCanvasBackdrop(cx,w,h,t,accent,accent2,base0,base1,base2,fade){
  cx.save();
  if(fade!==undefined)cx.globalAlpha=fade;
  const sky=cx.createLinearGradient(0,0,w,h);
  sky.addColorStop(0,base0);
  sky.addColorStop(0.48,base1);
  sky.addColorStop(1,base2);
  cx.fillStyle=sky;
  cx.fillRect(0,0,w,h);
  cx.restore();
  cx.save();
  cx.globalCompositeOperation='screen';
  cx.globalAlpha=fade!==undefined?Math.min(0.24,fade*0.7):0.32;
  const glowA=cx.createRadialGradient(w*0.22,h*0.2,4,w*0.22,h*0.2,Math.max(w,h)*0.62);
  glowA.addColorStop(0,accent+'55');
  glowA.addColorStop(0.55,accent+'18');
  glowA.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=glowA;
  cx.fillRect(0,0,w,h);
  const glowB=cx.createRadialGradient(w*0.82,h*0.72,4,w*0.82,h*0.72,Math.max(w,h)*0.58);
  glowB.addColorStop(0,accent2+'50');
  glowB.addColorStop(0.6,accent2+'14');
  glowB.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=glowB;
  cx.fillRect(0,0,w,h);
  cx.lineWidth=1;
  for(let i=0;i<9;i++){
    cx.strokeStyle=i%2?accent+'33':accent2+'2b';
    cx.beginPath();
    const y=(i+1)*h/10+Math.sin(t*1.7+i)*10;
    cx.moveTo(0,y);
    cx.bezierCurveTo(w*0.25,y+Math.sin(t+i)*34,w*0.72,y+Math.cos(t*0.8+i)*30,w,y+Math.sin(t*1.3+i)*8);
    cx.stroke();
  }
  for(let r=42;r<Math.max(w,h);r+=78){
    cx.strokeStyle=(r/78)%2<1?accent+'1f':accent2+'1b';
    cx.beginPath();
    cx.arc(w*0.5,h*0.48,r+Math.sin(t+r)*8,0,Math.PI*2);
    cx.stroke();
  }
  cx.restore();
}

function drawHUD(){
  setSpacing(2.5);
  // Score panel (left)
  hudPanel(12,12,190,46,'rgba(127,215,255,0.35)');
  ctx.textAlign='left';
  ctx.fillStyle='rgba(127,215,255,0.7)';ctx.font='10px "Segoe UI",Arial,sans-serif';
  ctx.fillText('SCORE',24,28);
  ctx.font='600 22px "Segoe UI",Arial,sans-serif';
  ctx.shadowColor='rgba(127,215,255,0.85)';ctx.shadowBlur=12;
  ctx.fillStyle='#eafcff';
  ctx.fillText(String(score),24,51);
  ctx.shadowBlur=0;
  // Level panel (center)
  hudPanel(W/2-70,12,140,32,'rgba(233,200,106,0.35)');
  ctx.textAlign='center';
  ctx.font='600 14px "Segoe UI",Arial,sans-serif';
  ctx.shadowColor='rgba(233,200,106,0.7)';ctx.shadowBlur=8;
  ctx.fillStyle='#e9c86a';
  ctx.fillText('LEVEL '+level,W/2,33);
  ctx.shadowBlur=0;
  // Hi panel (right)
  hudPanel(W-152,12,140,32,'rgba(236,72,153,0.35)');
  ctx.textAlign='right';
  ctx.fillStyle='rgba(255,190,225,0.9)';ctx.font='600 13px "Segoe UI",Arial,sans-serif';
  ctx.fillText('HI '+highScore,W-26,33);
  // Lives ships
  ctx.textAlign='left';
  for(let i=0;i<lives;i++){
    drawGlow(ctx,26+i*26,74,11,188,0.4);
    ctx.save();ctx.translate(26+i*26,74);ctx.rotate(-Math.PI/2);
    ctx.strokeStyle='#9feaff';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-6,5);ctx.lineTo(-3,0);ctx.lineTo(-6,-5);ctx.closePath();ctx.stroke();
    ctx.restore();
  }
  setSpacing(0);
}

function draw(){
  vfxUpdate();
  drawSpace();

  ctx.save();
  ctx.translate(VFX.sx,VFX.sy);
  if(state===STATE.PLAY||(state===STATE.DEAD&&lives<=0)){
    asteroids.forEach(a=>drawAsteroid(a));
    ufos.forEach(u=>drawUFO(u));

    // Bullets — comet streak + glow core
    bullets.forEach(b=>{
      const hue=b.owner==='player'?185:340;
      ctx.strokeStyle=`hsla(${hue},100%,65%,0.25)`;
      ctx.lineWidth=5;
      ctx.beginPath();
      ctx.moveTo(b.x-b.vx*2.2,b.y-b.vy*2.2);
      ctx.lineTo(b.x,b.y);
      ctx.stroke();
      ctx.strokeStyle=`hsla(${hue},100%,78%,0.8)`;
      ctx.lineWidth=1.8;
      ctx.beginPath();
      ctx.moveTo(b.x-b.vx*1.4,b.y-b.vy*1.4);
      ctx.lineTo(b.x,b.y);
      ctx.stroke();
      drawGlow(ctx,b.x,b.y,10,hue,0.75);
      drawFacetGem(b.x,b.y,3.5,hue,frameCount*0.08,1);
    });

    if(lives>0)drawShip();

    // Particles — additive glow pass
    ctx.save();ctx.globalCompositeOperation='lighter';
    particles.forEach(p=>{
      drawGlow(ctx,p.x,p.y,(p.size+2.5)*(0.7+p.life*0.9),colorHue(p.color),p.life);
      if(p.life>0.6){
        ctx.fillStyle=`rgba(255,255,255,${(p.life-0.6)*1.6})`;
        ctx.fillRect(p.x-1,p.y-1,2,2);
      }
    });
    ctx.restore();
  }
  ctx.restore();

  // Impact flash
  if(VFX.flash>0){
    ctx.fillStyle=`rgba(${VFX.flashCol},${VFX.flash})`;
    ctx.fillRect(0,0,W,H);
  }

  if(state===STATE.PLAY||(state===STATE.DEAD&&lives<=0))drawHUD();
  if(state===STATE.MENU)drawMenu();
  if(state===STATE.DEAD)drawDead();

  // CRT finish: vignette + faint scanlines (pre-rendered)
  ctx.drawImage(OVERLAY_CACHE,0,0);
}

function drawMenu(){
  ctx.fillStyle='rgba(3,2,8,0.66)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';

  // Title — slow neon gradient shimmer
  const sh=(frameCount*1.3)%360;
  const tg=ctx.createLinearGradient(W/2-240,0,W/2+240,0);
  tg.addColorStop(0,`hsl(${sh},95%,66%)`);
  tg.addColorStop(0.5,`hsl(${(sh+70)%360},95%,74%)`);
  tg.addColorStop(1,`hsl(${(sh+140)%360},95%,66%)`);
  setSpacing(7);
  ctx.font='800 54px "Segoe UI",Arial,sans-serif';
  ctx.shadowColor=`hsla(${sh},95%,65%,0.75)`;ctx.shadowBlur=28;
  ctx.fillStyle=tg;
  ctx.fillText('ASTEROIDS',W/2,H/2-92);
  ctx.shadowColor='rgba(127,215,255,0.85)';ctx.shadowBlur=16;
  setSpacing(10);
  ctx.font='700 24px "Segoe UI",Arial,sans-serif';ctx.fillStyle='#7fd7ff';
  ctx.fillText('VOID PROTOCOL',W/2,H/2-52);
  ctx.shadowBlur=0;
  setSpacing(0);

  // Decorative spinning geometry
  ctx.strokeStyle='rgba(255,0,255,0.4)';ctx.lineWidth=1;
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3+frameCount*0.01;
    const r=60;
    ctx.beginPath();
    ctx.moveTo(W/2+Math.cos(a)*r,H/2+30+Math.sin(a)*r);
    ctx.lineTo(W/2+Math.cos(a+Math.PI*2/3)*r,H/2+30+Math.sin(a+Math.PI*2/3)*r);
    ctx.lineTo(W/2+Math.cos(a+Math.PI*4/3)*r,H/2+30+Math.sin(a+Math.PI*4/3)*r);
    ctx.closePath();ctx.stroke();
  }

  const pa=0.45+Math.sin(frameCount*0.06)*0.4;
  setSpacing(4);
  ctx.font='600 16px "Segoe UI",Arial,sans-serif';
  ctx.fillStyle=`rgba(233,200,106,${pa})`;
  ctx.shadowColor=`rgba(233,200,106,${pa*0.8})`;ctx.shadowBlur=10;
  ctx.fillText('PRESS SPACE TO START',W/2,H/2+120);
  ctx.shadowBlur=0;
  setSpacing(2);
  ctx.font='11px "Segoe UI",Arial,sans-serif';ctx.fillStyle='rgba(160,170,205,0.65)';
  ctx.fillText('ARROWS: ROTATE / THRUST   |   SPACE: SHOOT',W/2,H/2+150);
  ctx.fillText('THE LOOKING GLASS ARCADE',W/2,H/2+175);
  setSpacing(0);
}

function drawDead(){
  hudPanel(W/2-210,H/2-105,420,260,'rgba(255,45,85,0.4)');
  ctx.textAlign='center';
  setSpacing(6);
  ctx.shadowColor='rgba(255,45,85,0.8)';ctx.shadowBlur=22;
  ctx.font='800 40px "Segoe UI",Arial,sans-serif';ctx.fillStyle='#ff5d7d';
  ctx.fillText('GAME OVER',W/2,H/2-42);
  ctx.shadowBlur=0;
  setSpacing(2);
  ctx.font='600 24px "Segoe UI",Arial,sans-serif';ctx.fillStyle='#e9c86a';
  ctx.shadowColor='rgba(233,200,106,0.6)';ctx.shadowBlur=10;
  ctx.fillText('SCORE  '+score,W/2,H/2+10);
  ctx.shadowBlur=0;
  if(score>=highScore&&score>0){ctx.fillStyle='#7fffc4';ctx.font='600 16px "Segoe UI",Arial,sans-serif';ctx.fillText('NEW HIGH SCORE!',W/2,H/2+40);}
  ctx.font='13px "Segoe UI",Arial,sans-serif';ctx.fillStyle='rgba(170,180,210,0.7)';
  ctx.fillText('HIGH SCORE  '+highScore,W/2,H/2+65);
  const pa=0.45+Math.sin(frameCount*0.06)*0.4;
  ctx.fillStyle=`rgba(127,215,255,${pa})`;ctx.font='600 15px "Segoe UI",Arial,sans-serif';
  setSpacing(3);
  ctx.fillText('PRESS SPACE TO RETRY',W/2,H/2+105);
  setSpacing(0);
}

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
