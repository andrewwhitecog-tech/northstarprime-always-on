<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
  <defs>
    <!-- Terracotta Clay Texture Gradients -->
    <radialGradient id="clayTablet" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="35%" stop-color="#b45309"/>
      <stop offset="70%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <linearGradient id="museumCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="clayDepression" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Museum Display Background (Matte Dark Velvet Plinth) -->
  <rect width="1200" height="1600" fill="#0f172a"/>
  <!-- Velvet Showcase Frame -->
  <rect x="30" y="30" width="1140" height="1540" fill="#090d16" stroke="#334155" stroke-width="4"/>

  <!-- MUSEUM GALLERY HEADER -->
  <g text-anchor="middle" fill="#94a3b8">
    <text x="600" y="90" font-family="'Cinzel', Georgia, serif" font-size="20" letter-spacing="6" font-weight="bold">DEPARTMENT OF NEAR EASTERN ANTIQUITIES &amp; ANCIENT EXTRACTS</text>
    <text x="600" y="125" font-family="'Cinzel', Georgia, serif" font-size="14" letter-spacing="4">ARCHAEOLOGICAL EXCAVATION SERIES • ARTIFACT NO. CDC-10015-UR</text>
    <line x1="100" y1="145" x2="1100" y2="145" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- THE CLAY TABLET (Centerpiece with authentic Neo-Sumerian Cuneiform wedge marks) -->
  <g transform="translate(180, 180)" filter="url(#clayDepression)">
    <!-- Terracotta Clay Slab (Rough Organic Edges with Fractures) -->
    <path d="M 40 0 C 200 -10 640 -10 800 15 C 840 30 850 80 845 150 C 840 280 855 520 840 680 C 830 730 800 760 760 765 C 560 780 200 775 40 760 C 5 750 -5 710 5 660 C 15 500 -5 260 5 120 C 15 60 20 10 40 0 Z" fill="url(#clayTablet)" stroke="#451a03" stroke-width="6"/>

    <!-- Clay Surface Cracks & Patina -->
    <path d="M 120 40 L 160 110 L 150 180 M 720 120 L 680 190 L 710 260 M 340 760 L 370 690 L 350 630" stroke="#291202" stroke-width="3" fill="none" opacity="0.6"/>

    <!-- Horizontal Scribe Registers (Guide Lines) -->
    <g stroke="#291202" stroke-width="2" opacity="0.5">
      <line x1="60" y1="90" x2="780" y2="90"/>
      <line x1="60" y1="170" x2="780" y2="170"/>
      <line x1="60" y1="250" x2="780" y2="250"/>
      <line x1="60" y1="330" x2="780" y2="330"/>
      <line x1="60" y1="410" x2="780" y2="410"/>
      <line x1="60" y1="490" x2="780" y2="490"/>
      <line x1="60" y1="570" x2="780" y2="570"/>
      <line x1="60" y1="650" x2="780" y2="650"/>
    </g>

    <!-- Cuneiform Wedge Inscriptions (Stylus Impressions) -->
    <g fill="#291202">
      <!-- Register 1 Wedges -->
      <path d="M 80 50 L 110 50 L 95 75 Z M 130 45 L 160 60 L 130 75 Z M 180 50 L 210 50 L 195 75 Z M 230 45 L 260 60 L 230 75 Z M 300 50 L 330 50 L 315 75 Z M 360 45 L 390 60 L 360 75 Z M 440 50 L 470 50 L 455 75 Z M 520 45 L 550 60 L 520 75 Z M 620 50 L 650 50 L 635 75 Z M 710 45 L 740 60 L 710 75 Z"/>
      <!-- Register 2 Wedges -->
      <path d="M 85 130 L 115 130 L 100 155 Z M 150 125 L 180 140 L 150 155 Z M 220 130 L 250 130 L 235 155 Z M 310 125 L 340 140 L 310 155 Z M 400 130 L 430 130 L 415 155 Z M 480 125 L 510 140 L 480 155 Z M 560 130 L 590 130 L 575 155 Z M 650 125 L 680 140 L 650 155 Z M 720 130 L 750 130 L 735 155 Z"/>
      <!-- Register 3 Wedges -->
      <path d="M 90 210 L 120 210 L 105 235 Z M 160 205 L 190 220 L 160 235 Z M 240 210 L 270 210 L 255 235 Z M 330 205 L 360 220 L 330 235 Z M 410 210 L 440 210 L 425 235 Z M 500 205 L 530 220 L 500 235 Z M 590 210 L 620 210 L 605 235 Z M 670 205 L 700 220 L 670 235 Z"/>
      <!-- Register 4 Wedges -->
      <path d="M 85 290 L 115 290 L 100 315 Z M 175 285 L 205 300 L 175 315 Z M 260 290 L 290 290 L 275 315 Z M 350 285 L 380 300 L 350 315 Z M 430 290 L 460 290 L 445 315 Z M 520 285 L 550 300 L 520 315 Z M 610 290 L 640 290 L 625 315 Z M 700 285 L 730 300 L 700 315 Z"/>
      <!-- Register 5 Wedges -->
      <path d="M 95 370 L 125 370 L 110 395 Z M 180 365 L 210 380 L 180 395 Z M 270 370 L 300 370 L 285 395 Z M 360 365 L 390 380 L 360 395 Z M 450 370 L 480 370 L 465 395 Z M 540 365 L 570 380 L 540 395 Z M 630 370 L 660 370 L 645 395 Z"/>
      <!-- Register 6 Wedges -->
      <path d="M 85 450 L 115 450 L 100 475 Z M 165 445 L 195 460 L 165 475 Z M 255 450 L 285 450 L 270 475 Z M 345 445 L 375 460 L 345 475 Z M 435 450 L 465 450 L 450 475 Z M 525 445 L 555 460 L 525 475 Z M 615 450 L 645 450 L 630 475 Z M 715 445 L 745 460 L 715 475 Z"/>
      <!-- Register 7 Wedges -->
      <path d="M 90 530 L 120 530 L 105 555 Z M 175 525 L 205 540 L 175 555 Z M 265 530 L 295 530 L 280 555 Z M 355 525 L 385 540 L 355 555 Z M 445 530 L 475 530 L 460 555 Z M 535 525 L 565 540 L 535 555 Z M 625 530 L 655 530 L 640 555 Z"/>
      <!-- Register 8 Wedges -->
      <path d="M 100 610 L 130 610 L 115 635 Z M 190 605 L 220 620 L 190 635 Z M 280 610 L 310 610 L 295 635 Z M 370 605 L 400 620 L 370 635 Z M 460 610 L 490 610 L 475 635 Z M 550 605 L 580 620 L 550 635 Z M 640 610 L 670 610 L 655 635 Z"/>
    </g>

    <!-- Akkadian Seal Stamp Impression at bottom right of tablet -->
    <rect x="620" y="660" width="130" height="90" fill="#78350f" stroke="#291202" stroke-width="2"/>
    <text x="685" y="700" font-family="'Cinzel', serif" font-size="10" font-weight="bold" fill="#fef08a" text-anchor="middle">UR-HALL-BLVD</text>
    <text x="685" y="725" font-family="'Cinzel', serif" font-size="8" fill="#fef08a" text-anchor="middle">OFFICIAL SEAL</text>
  </g>

  <!-- MUSEUM CURATOR TRANSLATION CARD (Bottom Plaque) -->
  <g transform="translate(100, 1020)">
    <rect x="0" y="0" width="1000" height="480" rx="12" fill="url(#museumCard)" stroke="#64748b" stroke-width="3"/>

    <!-- Brass Header Strip -->
    <rect x="0" y="0" width="1000" height="50" rx="12" fill="#1e293b"/>
    <text x="500" y="32" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="bold" fill="#f1f5f9" text-anchor="middle" letter-spacing="4">
      TRANSLATION: COMPLAINT TABLET OF NANNI TO EA-NASIR (c. 1750 BCE)
    </text>

    <!-- Plaque Text Body -->
    <g transform="translate(40, 85)" font-family="'Playfair Display', Georgia, serif" font-size="17" fill="#0f172a">
      <text x="0" y="0" font-style="italic" font-weight="bold">Tell Ea-nasir: Nanni sends the following message:</text>

      <text x="0" y="35">&quot;When you came to my estate, you spoke thus: &apos;I will deliver to you first-press,</text>
      <text x="0" y="65">single-source 90u cold-cure live rosin of exquisite pine and tropical fruit bouquet!&apos;</text>
      <text x="0" y="95">Yet you have departed, and what have you sent to my servants? Dry-sift trim runs</text>
      <text x="0" y="125">pressed at 240 degrees! You have treated my envoys with total contempt through enemy territory!&quot;</text>

      <text x="0" y="175" font-weight="bold">&quot;Take notice that I will not accept any hashish from you that is not dispensary grade.</text>
      <text x="0" y="205" font-weight="bold">Henceforth, I will exercise my right of rejection in my own courtyard at 10015 SW Hall Blvd.</text>
      <text x="0" y="235" font-weight="bold">Bring solventless live rosin only, or pack your inferior jars and depart!&quot;</text>

      <!-- Scholarly Footnote -->
      <line x1="0" y1="270" x2="920" y2="270" stroke="#94a3b8" stroke-width="1"/>
      <text x="0" y="300" font-family="'Montserrat', sans-serif" font-size="13" font-weight="bold" fill="#78350f">
        CURATORIAL NOTE: Demonstrates that even 3,700 years ago, connoisseurs refused distillate and demanded true solventless terpenes.
      </text>
      <text x="0" y="325" font-family="'Courier New', monospace" font-size="12" fill="#64748b">
        Museum Accession: CDC-UR-10015 • Donated by The Twilight Solarium Antiquities Trust
      </text>
    </g>
  </g>

  <!-- Bottom Tagline -->
  <text x="600" y="1560" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="bold" fill="#64748b" text-anchor="middle" letter-spacing="3">
    MEMEFORGE HISTORICAL ACCORD • NORTHSTAR FORGE ENGINES • TIGARD, OR
  </text>
</svg>