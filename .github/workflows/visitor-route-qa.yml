name: NorthStar visitor route checks
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c2c34c8b48babad81b5b78e2c8fa809f7f14c2b2
          sparse-checkout: |
            music
            realm
            .github/hq_audio_review
            static/games
            store
            play
            links
            merch
            chromatic
            stickerforge
            parody-drop
            community
            idc-programming
            tools
            tests
            static/front
            static/cards
            warband/art
          persist-credentials: false
      - run: python -m pip -q install playwright beautifulsoup4 pillow pytest requests
      - name: Check visitor routes
        run: python -m pytest -q tests/test_visitor_destinations.py
      - name: Browser verification
        shell: python
        run: |
          from playwright.sync_api import sync_playwright
          from urllib.parse import urlsplit
          import json,time
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path='/usr/bin/google-chrome',args=['--disable-gpu','--mute-audio'])
              for width,height in [(390,844),(1280,800)]:
                  for path in ['/music/','/realm/']:
                      ctx=browser.new_context(viewport={'width':width,'height':height})
                      page=ctx.new_page()
                      console=[]; errors=[]; assets=[]; failed=[]
                      page.on('console',lambda m:console.append([m.text[:280],m.location.get('url','').split('?')[0]]) if m.type=='error' else None)
                      page.on('pageerror',lambda e:errors.append(str(e)))
                      page.on('response',lambda r: assets.append([r.status,r.url.split('?')[0]]) if r.status>=400 else None)
                      page.on('requestfailed',lambda r:failed.append([r.failure,r.resource_type,r.url.split('?')[0]]) )
                      from bs4 import BeautifulSoup
                      from pathlib import Path
                      if path=='/music/':
                          candidate=BeautifulSoup(Path('music/index.html').read_bytes(),'html.parser')
                          script=next(s for s in candidate.find_all('script') if 'function loadTrack(' in (s.string or ''))
                          def use_candidate(route):
                              current=route.fetch()
                              html=BeautifulSoup(current.body(),'html.parser')
                              target=next(s for s in html.find_all('script') if 'function loadTrack(' in (s.string or ''))
                              target.string=script.string
                              for original,new in zip(html.find_all('audio'),candidate.find_all('audio')): original['preload']=new['preload']
                              route.fulfill(response=current,body=str(html),content_type='text/html; charset=utf-8')
                          page.route('https://northstarprime.net/music/',use_candidate)
                      res=page.goto('https://northstarprime.net'+path,wait_until='load',timeout=45000)
                      page.locator('img').evaluate_all("xs=>xs.forEach(x=>x.loading='eager')")
                      if path=='/music/':
                          page.locator('#hero-play-beats').click()
                          page.wait_for_function("Array.from(document.querySelectorAll('audio')).some(v=>v.currentTime>1)")
                      else:
                          page.wait_for_function("!document.querySelector('#live-status').textContent.includes('Checking')",timeout=12000)
                      page.wait_for_timeout(3000)
                      print('DIAG',json.dumps([width,path,res.status,console,errors,assets,failed]),flush=True)
                      assert res.status==200 and not (console or errors or assets or failed),(path,width,console,errors,assets,failed)
                      if path=='/music/':
                          idx=page.locator('#lounge-tracks-data').evaluate("s=>JSON.parse(s.textContent).findIndex(t=>t.duration===0 && t.src.startsWith('https://assets.'))")
                          btn=page.locator(f'.play-track-btn[data-idx="{idx}"]')
                          btn.click()
                          page.wait_for_function("document.getElementById('lounge-audio-r2').currentTime>0.4")
                          before=page.locator('#time-dur').inner_text()
                          assert before!='--:--' and before!='0:00'
                          btn.click()
                          assert page.locator('#time-dur').inner_text()==before
                          print('REPLAY duration retained',width,before,flush=True)
                      ctx.close()
              browser.close()
