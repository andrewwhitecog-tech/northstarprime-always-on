<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IDG — Arcade SFX Pack</title>
<style>
 body{background:#050510;color:#e8e6f0;font-family:Georgia,serif;padding:2rem;text-align:center}
 h1{color:#2ee6a8;letter-spacing:.25em;font-weight:normal;font-size:1.2rem}
 .s{color:#8a8aa8;font-size:.78rem;letter-spacing:.2em;margin-bottom:2rem;text-transform:uppercase}
 .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;max-width:900px;margin:0 auto}
 .c{background:#101024;border:1px solid #22224a;border-radius:10px;padding:1rem}
 .c h3{color:#f4e3a1;font-size:.95rem;margin-bottom:.2rem}
 .c p{color:#9a96b8;font-size:.72rem;margin-bottom:.6rem;line-height:1.4}
 button{background:#1a1a38;color:#2ee6a8;border:1px solid #2ee6a8;border-radius:99px;padding:.4rem 1.2rem;font-family:Georgia;cursor:pointer;letter-spacing:.1em;font-size:.75rem}
 button:hover{background:#2ee6a8;color:#050510}
 a{color:#8a8aa8;font-size:.66rem}
 footer{color:#4a4668;margin-top:2.5rem;font-size:.72rem;letter-spacing:.2em}
</style></head><body>
<h1>◈ INTERDIMENSIONAL GAMING — SFX PACK</h1>
<p class="s">Locally synthesized · WAV + MP3 · drop into any IDG build</p>
<div class="g" id="g"></div>
<footer>NORTHSTAR PRIME · IDG · ☸ 999</footer>
<script>
 const sfx=[
  ['spacecash_pickup','SpaceCash Pickup','coin/credit collect — B5→E6 blip'],
  ['shard_catch','Emerald Shard Catch','Signal Crown — bright collect ping'],
  ['crown_charge','Crown Charge','Signal Crown — rising energy sweep'],
  ['static_rupture','Red Static Rupture','hazard — noise burst + downsweep'],
  ['rose_chime','Rose Window Pane','Rose Window — glassy bell chime'],
  ['overturn_999','OVERTURN 999','universal — triumphant ascending arpeggio'],
  ['dispatch_blip','Dispatch Blip','Precinct 404 — radio double-beep'],
  ['hex_claim','Hex Claim','OBSIDIAN/Resonance — deep struck tribunal tone']
 ];
 document.getElementById('g').innerHTML=sfx.map(([f,t,d])=>`<div class="c"><h3>${t}</h3><p>${d}</p><button onclick="new Audio('${f}.mp3').play()">▶ play</button><br><br><a href="${f}.wav" download>wav</a> · <a href="${f}.mp3" download>mp3</a></div>`).join('');
</script></body></html>
