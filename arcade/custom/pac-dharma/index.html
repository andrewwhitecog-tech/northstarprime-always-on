<script>
// ============================================================================
// PILGRIM OF TEN GATES : APEX AI EDITION
// System 1 Labyrinth Predator Tactics + AI Director + Purification Parry
// ============================================================================
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');

// --- Procedural Web Audio Synthesizer ---
let audioCtx=null;
function initAudio(){
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC)audioCtx=new AC();
  }
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  try{if(window.Chiptune)Chiptune.resume();}catch(e){}
}

function playSynthSound(type){
  initAudio();
  if(!audioCtx)return;
  const now=audioCtx.currentTime;
  try{
    if(type==='blip'){
      const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
      osc.type='sine';osc.frequency.setValueAtTime(520+Math.random()*60,now);
      g.gain.setValueAtTime(0.08,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.05);
      osc.connect(g);g.connect(audioCtx.destination);osc.start(now);osc.stop(now+0.05);
    }else if(type==='parry'){
      // Crystal purification chime
      [659.25, 880, 1318.5, 1760].forEach((freq,i)=>{
        const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
        osc.type='sine';osc.frequency.setValueAtTime(freq,now+i*0.02);
        g.gain.setValueAtTime(0.2,now+i*0.02);g.gain.exponentialRampToValueAtTime(0.001,now+0.35);
        osc.connect(g);g.connect(audioCtx.destination);osc.start(now+i*0.02);osc.stop(now+0.38);
      });
    }else if(type==='mantra'){
      const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
      osc.type='triangle';osc.frequency.setValueAtTime(240,now);osc.frequency.exponentialRampToValueAtTime(55,now+0.45);
      g.gain.setValueAtTime(0.35,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.48);
      osc.connect(g);g.connect(audioCtx.destination);osc.start(now);osc.stop(now+0.48);
    }else if(type==='powerUp'){
      const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
      osc.type='sawtooth';osc.frequency.setValueAtTime(320,now);osc.frequency.linearRampToValueAtTime(880,now+0.25);
      g.gain.setValueAtTime(0.18,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.26);
      osc.connect(g);g.connect(audioCtx.destination);osc.start(now);osc.stop(now+0.26);
    }else if(type==='coin'){
      const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
      osc.type='sine';osc.frequency.setValueAtTime(987.77,now);osc.frequency.setValueAtTime(1318.5,now+0.08);
      g.gain.setValueAtTime(0.15,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.22);
      osc.connect(g);g.connect(audioCtx.destination);osc.start(now);osc.stop(now+0.22);
    }else if(type==='death'){
      const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
      osc.type='sawtooth';osc.frequency.setValueAtTime(140,now);osc.frequency.exponentialRampToValueAtTime(30,now+0.35);
      g.gain.setValueAtTime(0.3,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.35);
      osc.connect(g);g.connect(audioCtx.destination);osc.start(now);osc.stop(now+0.35);
    }
  }catch(e){}
}

const SND_LAST={};
function SND(n,cd){
  try{
    const now=performance.now();
    if(SND_LAST[n]&&now-SND_LAST[n]<(cd||70))return;
    SND_LAST[n]=now;
    playSynthSound(n);
    if(window.Chiptune&&Chiptune.SFX&&Chiptune.SFX[n])Chiptune.SFX[n]();
  }catch(e){}
}
function SNDRESUME(){initAudio();}

const TILE=28,COLS=21,ROWS=23;
const W=canvas.width=COLS*TILE,H=canvas.height=ROWS*TILE+60;
const PILGRIM_ATLAS='/static/art/games/vorath_overhaul_v01/pilgrim_ten_gates/pilgrim_predator_atlas_v01.webp';
const PILGRIM_ATLAS_FALLBACK='/static/art/games/vorath_overhaul_v01/pilgrim_ten_gates/pilgrim_predator_atlas_v01.png';
const pilgrimAtlas=new Image();
pilgrimAtlas.onerror=()=>{if(pilgrimAtlas.src.endsWith('.webp'))pilgrimAtlas.src=PILGRIM_ATLAS_FALLBACK;};
pilgrimAtlas.src=PILGRIM_ATLAS;

const PREDATOR_CAST=[
  {name:'Margin Hound',col:2,row:0,mode:'chase',hue:188,role:'Interceptor'},
  {name:'Gloss Eater',col:0,row:1,mode:'ambush',hue:145,role:'Flanker'},
  {name:'Redaction Bishop',col:1,row:1,mode:'random',hue:348,role:'Disruptor'},
  {name:'Mirror Argument',col:2,row:1,mode:'patrol',hue:50,role:'Inversion'}
];
let highScore=parseInt(localStorage.getItem('pilgrimTenGates_hi'))||0;

const STATE={MENU:0,PLAY:1,DEAD:2,WIN:3,READY:4};
let state=STATE.MENU,frameCount=0;

// Deterministic sacred-gate labyrinth
function generateGateLabyrinth(seed){
  const m=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  let n=(seed*1664525+1013904223)>>>0;
  const rand=()=>((n=(n*1664525+1013904223)>>>0)/4294967296);
  const stack=[[1,1]];m[1][1]=1;
  while(stack.length){
    const [x,y]=stack[stack.length-1],dirs=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>rand()-.5);
    const next=dirs.find(([dx,dy])=>{const nx=x+dx,ny=y+dy;return nx>0&&nx<COLS-1&&ny>0&&ny<ROWS-1&&m[ny][nx]===0;});
    if(!next){stack.pop();continue;}
    const [dx,dy]=next;m[y+dy/2][x+dx/2]=1;m[y+dy][x+dx]=1;stack.push([x+dx,y+dy]);
  }
  for(let i=0;i<26;i++){
    const x=2+Math.floor(rand()*(COLS-4)),y=2+Math.floor(rand()*(ROWS-4));
    if(m[y][x]===0&&((m[y][x-1]&&m[y][x+1])||(m[y-1][x]&&m[y+1][x])))m[y][x]=1;
  }
  for(let x=0;x<COLS;x++)m[11][x]=1;m[11][0]=3;m[11][COLS-1]=3;
  for(let y=9;y<=13;y++)for(let x=8;x<=12;x++)m[y][x]=4;
  [[1,1],[19,1],[1,21],[19,21]].forEach(([x,y])=>m[y][x]=2);
  m[21][10]=3;m[20][10]=1;m[16][10]=3;m[15][10]=1;m[14][10]=1;m[8][10]=1;m[7][10]=1;
  return m;
}

let maze,player,ghosts,dots,powerTimer,lives,score,level,readyTimer,eatCombo;
let floatingTexts=[];
let freezeFrames=0;
let mantraEnergy=25; // 0..100
let activeMantraWave=null;

const PLAYER_PERIOD=8,GHOST_PERIOD=9,GHOST_SCARED_PERIOD=12;
let dotTotal=0;

// System 1 Labyrinth Director
const labyrinthDirector={
  tension: 10,
  state: 'CONTEMPLATION', // CONTEMPLATION, PREDATOR_FRENZY, DHARMA_AWAKENING, SANCTUARY
  stateTimer: 0,
  decisionLatencyUs: 0.42
};

function cloneMaze(){return generateGateLabyrinth(level||1);}
function countDots(m){let c=0;m.forEach(r=>r.forEach(v=>{if(v===1||v===2)c++;}));return c;}

function addFloatingText(x,y,text,color='#e9c86a',size=13){
  floatingTexts.push({x,y,text,color,size,life:1.0,vy:-1.0});
}

function initGame(){
  maze=cloneMaze();
  dotTotal=countDots(maze);
  dots=dotTotal;
  player={
    x:10,y:16,dx:0,dy:0,nx:0,ny:0,mouth:0,mouthDir:1,
    isPhasing:false,phaseTimer:0,phaseCool:0,parryWindow:0,echoes:[]
  };
  eatCombo=0;
  ghosts=PREDATOR_CAST.map((p,i)=>({
    x:9+i%3,y:10+Math.floor(i/3),dx:0,dy:i?-1:1,
    color:`hsl(${p.hue} 100% 62%)`,mode:p.mode,home:i>0,
    scared:0,homeTimer:i*90,name:p.name,castIndex:i,
    stunnedTimer:0
  }));
  powerTimer=0;
  mantraEnergy=30;
  activeMantraWave=null;
  floatingTexts=[];

  labyrinthDirector.tension=15;
  labyrinthDirector.state='CONTEMPLATION';
  labyrinthDirector.stateTimer=0;
}

function init(){
  score=0;lives=3;level=1;
  initGame();
  readyTimer=90;
  state=STATE.READY;
  SNDRESUME();
}

function canMove(cx,cy,dx,dy){
  const nx=cx+dx,ny=cy+dy;
  if(nx<0||nx>=COLS)return true;
  if(ny<0||ny>=ROWS)return false;
  const tile=maze[ny][nx];
  return tile!==0;
}

function wrapPos(x,y){
  if(x<0)x=COLS-1;if(x>=COLS)x=0;
  return{x,y};
}
function dist(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y);}

// ----------------- COMBAT VERBS -----------------
function triggerPhaseParry(){
  if(player.phaseCool>0||player.isPhasing)return;
  player.isPhasing=true;
  player.phaseTimer=0.20;
  player.parryWindow=0.14;
  player.phaseCool=0.60;

  // Attempt 2-tile phase leap in current heading
  const targetX=player.x+player.dx*2;
  const targetY=player.y+player.dy*2;
  if(targetX>=0&&targetX<COLS&&targetY>=0&&targetY<ROWS&&maze[targetY][targetX]!==0){
    player.x=targetX;player.y=targetY;
  }

  SND('parry');
  addFloatingText(player.x*TILE+TILE/2,player.y*TILE+TILE/2-25,'PHASE STRIDE!','#7df9ff',12);
}

function triggerMantraRing(){
  if(mantraEnergy<50)return;
  mantraEnergy-=50;
  
  activeMantraWave={
    x:player.x*TILE+TILE/2,
    y:player.y*TILE+TILE/2,
    radius:10,maxRadius:180,life:0.4
  };

  freezeFrames=5;
  SND('mantra');

  // Push all ghosts back to home
  ghosts.forEach(g=>{
    g.home=true;g.homeTimer=100;
    g.x=10;g.y=10;
  });

  addFloatingText(player.x*TILE+TILE/2,player.y*TILE+TILE/2-35,'MANTRA MANDALA! CLOISTER PURIFIED','#e9c86a',16);
}

// ----------------- SYSTEM 1 PREDATOR TACTICS -----------------
function getGhostTarget(g){
  const t0=performance.now();
  let target={x:player.x,y:player.y};

  switch(g.mode){
    case'chase':
      target={x:player.x,y:player.y};
      break;
    case'ambush':
      // Predict 4 tiles ahead of player velocity
      target={
        x:clamp(player.x+player.dx*4,1,COLS-2),
        y:clamp(player.y+player.dy*4,1,ROWS-2)
      };
      break;
    case'random':
      target={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};
      break;
    case'patrol':{
      const corners=[{x:1,y:1},{x:COLS-2,y:1},{x:1,y:ROWS-2},{x:COLS-2,y:ROWS-2}];
      target=corners[Math.floor(frameCount/120)%4];
      break;
    }
  }

  const t1=performance.now();
  labyrinthDirector.decisionLatencyUs=Math.max(0.15,(t1-t0)*1000);
  return target;
}

function moveGhost(g){
  if(g.home){
    g.homeTimer--;
    if(g.homeTimer<=0){g.home=false;g.x=10;g.y=8;g.dy=-1;g.dx=0;}
    return;
  }
  if(g.stunnedTimer>0){
    g.stunnedTimer--;
    return;
  }

  const dirs=[{dx:0,dy:-1},{dx:0,dy:1},{dx:-1,dy:0},{dx:1,dy:0}];
  const valid=dirs.filter(d=>{
    if(d.dx===-g.dx&&d.dy===-g.dy)return false;
    return canMove(g.x,g.y,d.dx,d.dy);
  });
  if(valid.length===0){
    g.dx=-g.dx;g.dy=-g.dy;return;
  }

  if(g.scared>0){
    valid.sort((a,b)=>{
      const pa=dist({x:g.x+a.dx,y:g.y+a.dy},player);
      const pb=dist({x:g.x+b.dx,y:g.y+b.dy},player);
      return pb-pa;
    });
  } else {
    const target=getGhostTarget(g);
    valid.sort((a,b)=>{
      const da=dist({x:g.x+a.dx,y:g.y+a.dy},target);
      const db=dist({x:g.x+b.dx,y:g.y+b.dy},target);
      return da-db;
    });
  }

  const pick=(g.mode==='random'&&Math.random()<0.25)?valid[Math.floor(Math.random()*valid.length)]:valid[0];
  g.dx=pick.dx;g.dy=pick.dy;
  g.x+=g.dx;g.y+=g.dy;
  const w=wrapPos(g.x,g.y);g.x=w.x;g.y=w.y;
}

// ----------------- SYSTEM 1 DIRECTOR -----------------
function updateDirector(dt){
  labyrinthDirector.stateTimer+=dt;

  if(powerTimer>0){
    labyrinthDirector.state='DHARMA_AWAKENING';
    labyrinthDirector.tension=90;
  }else if(labyrinthDirector.state==='CONTEMPLATION'){
    labyrinthDirector.tension=Math.min(100,labyrinthDirector.tension+dt*5);
    if(labyrinthDirector.tension>=75||labyrinthDirector.stateTimer>16){
      labyrinthDirector.state='PREDATOR_FRENZY';
      labyrinthDirector.stateTimer=0;
      addFloatingText(W/2,ROWS*TILE/2,'PREDATOR FRENZY!','#ff4fac',16);
    }
  }else if(labyrinthDirector.state==='PREDATOR_FRENZY'){
    labyrinthDirector.tension=Math.min(100,labyrinthDirector.tension+dt*2);
    if(labyrinthDirector.stateTimer>10){
      labyrinthDirector.state='SANCTUARY';
      labyrinthDirector.stateTimer=0;
      addFloatingText(W/2,ROWS*TILE/2,'SANCTUARY RESPITE','#64eaff',14);
    }
  }else if(labyrinthDirector.state==='SANCTUARY'){
    labyrinthDirector.tension=Math.max(10,labyrinthDirector.tension-dt*18);
    if(labyrinthDirector.stateTimer>5){
      labyrinthDirector.state='CONTEMPLATION';
      labyrinthDirector.stateTimer=0;
    }
  }
}

// ----------------- MAIN UPDATE LOOP -----------------
function update(){
  frameCount++;

  if(freezeFrames>0){
    freezeFrames--;
    return;
  }

  if(state===STATE.READY){
    readyTimer--;
    if(readyTimer<=0)state=STATE.PLAY;
    return;
  }
  if(state!==STATE.PLAY)return;
  const dt=1/60;

  updateDirector(dt);

  // Phase & Parry Timers
  if(player.phaseCool>0)player.phaseCool-=dt;
  if(player.phaseTimer>0){
    player.phaseTimer-=dt;
    if(player.phaseTimer<=0)player.isPhasing=false;
  }
  if(player.parryWindow>0)player.parryWindow-=dt;

  // Active Mantra Wave
  if(activeMantraWave){
    activeMantraWave.radius+=280*dt;
    activeMantraWave.life-=dt;
    if(activeMantraWave.life<=0)activeMantraWave=null;
  }

  // Player movement
  player.px=player.x;player.py=player.y;
  if(frameCount%PLAYER_PERIOD===0){
    if(canMove(player.x,player.y,player.nx,player.ny)){
      player.dx=player.nx;player.dy=player.ny;
    }
    if(canMove(player.x,player.y,player.dx,player.dy)){
      player.x+=player.dx;player.y+=player.dy;
      const w=wrapPos(player.x,player.y);player.x=w.x;player.y=w.y;
    }
  }

  // Mouth animation
  player.mouth+=player.mouthDir*0.15;
  if(player.mouth>1||player.mouth<0)player.mouthDir*=-1;

  // Eat dots
  if(player.y>=0&&player.y<ROWS&&player.x>=0&&player.x<COLS){
    const tile=maze[player.y][player.x];
    if(tile===1){
      maze[player.y][player.x]=3;
      score+=10;dots--;
      mantraEnergy=Math.min(100,mantraEnergy+1.5);
      SND('blip',80);
    }
    if(tile===2){
      maze[player.y][player.x]=3;score+=50;dots--;
      mantraEnergy=Math.min(100,mantraEnergy+20);
      SND('powerUp');
      powerTimer=320+level*(-20);if(powerTimer<140)powerTimer=140;
      eatCombo=0;
      ghosts.forEach(g=>{if(!g.home)g.scared=powerTimer;});
      addFloatingText(player.x*TILE+TILE/2,player.y*TILE+TILE/2-25,'GATE AWAKENED!','#ff4fac',15);
    }
  }

  // Power pellet timer
  if(powerTimer>0){
    powerTimer--;
    if(powerTimer<=0)ghosts.forEach(g=>g.scared=0);
  }

  // Move ghosts (Faster in PREDATOR_FRENZY)
  const speedCadence=labyrinthDirector.state==='PREDATOR_FRENZY'?7:(powerTimer>0?GHOST_SCARED_PERIOD:GHOST_PERIOD);
  ghosts.forEach(g=>{
    g.px=g.x;g.py=g.y;
    if(frameCount%speedCadence===0)moveGhost(g);
  });

  // Ghost collision & PURIFICATION PARRY
  for(let g of ghosts){
    if(g.home)continue;
    const sameTile=g.x===player.x&&g.y===player.y;
    const swapped=g.x===player.px&&g.y===player.py&&player.x===g.px&&player.y===g.py;
    
    if(sameTile||swapped){
      // ----------------- PURIFICATION PARRY -----------------
      if(player.isPhasing&&player.parryWindow>0&&g.scared<=0){
        freezeFrames=6;
        SND('parry');
        g.stunnedTimer=120; // 2 seconds stun
        // Throw ghost backward
        g.x=clamp(g.x-player.dx*4,1,COLS-2);
        g.y=clamp(g.y-player.dy*4,1,ROWS-2);
        score+=300;
        mantraEnergy=Math.min(100,mantraEnergy+30);
        addFloatingText(player.x*TILE+TILE/2,player.y*TILE+TILE/2-35,'★ PURIFICATION PARRY! +300','#64eaff',16);
        continue;
      }

      if(g.scared>0){
        // Eat ghost
        eatCombo++;
        const pts=200*eatCombo;
        score+=pts;
        SND('coin');
        g.home=true;g.homeTimer=120;g.scared=0;
        g.x=10;g.y=10;
        addFloatingText(player.x*TILE+TILE/2,player.y*TILE+TILE/2-25,`+${pts} KARMA`,'#e9c86a',14);
      } else if(!player.isPhasing){
        // Die
        lives--;
        if(lives<=0){
          state=STATE.DEAD;
          SND('death');
          if(score>highScore){highScore=score;localStorage.setItem('pilgrimTenGates_hi',highScore);}
        } else {
          SND('death');
          player.x=10;player.y=16;player.dx=0;player.dy=0;player.nx=0;player.ny=0;
          readyTimer=60;state=STATE.READY;
        }
        return;
      }
    }
  }

  // Update floating text
  floatingTexts.forEach(ft=>{ft.y+=ft.vy;ft.life-=dt*1.2;});
  floatingTexts=floatingTexts.filter(ft=>ft.life>0);

  // Check win
  if(dots<=0){
    level++;
    SND('parry');
    initGame();
    readyTimer=90;state=STATE.READY;
    addFloatingText(W/2,ROWS*TILE/2,'GATE INSCRIBED & ADVANCED!','#e9c86a',18);
  }
}

// ----------------- RENDERING -----------------
function drawFacetGem(x,y,r,color,spin=0){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(spin);
  ctx.shadowColor=color;ctx.shadowBlur=r*1.6;
  const grd=ctx.createLinearGradient(-r,-r,r,r);
  grd.addColorStop(0,'#fffdf2');
  grd.addColorStop(0.24,color);
  grd.addColorStop(1,'#080416');
  ctx.fillStyle=grd;
  ctx.strokeStyle='rgba(255,244,216,0.76)';
  ctx.lineWidth=Math.max(1,r*0.08);
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const a=-Math.PI/2+i*Math.PI/4;
    const rr=i%2?r*0.68:r;
    ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
  }
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.restore();
}

function drawWallTile(x,y,tile,c,r){
  const pulse=0.5+Math.sin(frameCount*0.045+c*0.8+r*0.5)*0.5;
  ctx.save();
  const grd=ctx.createLinearGradient(x,y,x+TILE,y+TILE);
  grd.addColorStop(0,'rgba(34,211,238,0.18)');
  grd.addColorStop(0.45,'rgba(17,17,42,0.96)');
  grd.addColorStop(1,'rgba(168,85,247,0.18)');
  ctx.fillStyle=grd;
  ctx.fillRect(x,y,TILE,TILE);
  ctx.strokeStyle=`rgba(34,211,238,${0.24+pulse*0.18})`;
  ctx.lineWidth=1;
  const hasTop=r>0&&maze[r-1][c]!==0;
  const hasBot=r<ROWS-1&&maze[r+1][c]!==0;
  const hasLeft=c>0&&maze[r][c-1]!==0;
  const hasRight=c<COLS-1&&maze[r][c+1]!==0;
  if(hasTop){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+TILE,y);ctx.stroke();}
  if(hasBot){ctx.beginPath();ctx.moveTo(x,y+TILE);ctx.lineTo(x+TILE,y+TILE);ctx.stroke();}
  if(hasLeft){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+TILE);ctx.stroke();}
  if(hasRight){ctx.beginPath();ctx.moveTo(x+TILE,y);ctx.lineTo(x+TILE,y+TILE);ctx.stroke();}
  ctx.restore();
}

function drawMaze(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const tile=maze[r][c];
    const x=c*TILE,y=r*TILE;
    if(tile===0){
      drawWallTile(x,y,tile,c,r);
    } else if(tile===1){
      drawFacetGem(x+TILE/2,y+TILE/2,3.8,'#ffe45c',frameCount*0.05+c);
    } else if(tile===2){
      const s=4+Math.sin(frameCount*0.1)*2;
      drawFacetGem(x+TILE/2,y+TILE/2,s+4,'#ff4fac',frameCount*0.08);
    } else if(tile===4){
      ctx.fillStyle='rgba(255,79,172,0.15)';ctx.fillRect(x,y,TILE,TILE);
      ctx.strokeStyle='rgba(255,244,216,0.16)';ctx.strokeRect(x+0.5,y+0.5,TILE-1,TILE-1);
    }
  }
}

function drawAtlasCell(col,row,x,y,size,rotation=0,flip=false,alpha=1){
  if(!pilgrimAtlas.complete||!pilgrimAtlas.naturalWidth)return false;
  ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.scale(flip?-1:1,1);ctx.globalAlpha=alpha;
  ctx.drawImage(pilgrimAtlas,col*512,row*512,512,512,-size/2,-size/2,size,size);ctx.restore();return true;
}

function drawPlayer(){
  const x=player.x*TILE+TILE/2,y=player.y*TILE+TILE/2,awake=powerTimer>0;
  const flip=player.dx<0,angle=player.dy*.08;

  // Parry Aura
  if(player.parryWindow>0){
    ctx.strokeStyle='rgba(125,249,255,0.85)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(x,y,22+Math.sin(frameCount*0.4)*3,0,Math.PI*2);
    ctx.stroke();
  }

  drawAtlasCell(awake?1:0,0,x,y,awake?64:52,angle,flip,1);
}

function drawGhost(g){
  if(g.home&&g.homeTimer>0)return;
  const x=g.x*TILE+TILE/2,y=g.y*TILE+TILE/2,p=PREDATOR_CAST[g.castIndex];

  // Stunned Aura
  if(g.stunnedTimer>0){
    ctx.strokeStyle='#e9c86a';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(x,y,20,0,Math.PI*2);ctx.stroke();
  }

  if(g.scared>0){
    ctx.save();ctx.filter='saturate(.7) hue-rotate(145deg)';
    drawAtlasCell(p.col,p.row,x,y,42+g.castIndex*3,Math.sin(frameCount*.05)*.12,g.dx<0,.78);
    ctx.restore();
  }else{
    drawAtlasCell(p.col,p.row,x,y,50+g.castIndex*5,Math.sin(frameCount*.035+g.castIndex)*.08,g.dx<0,1);
  }
}

function drawHUD(){
  const y=ROWS*TILE+4;
  ctx.fillStyle='rgba(6,4,14,0.85)';ctx.fillRect(0,ROWS*TILE,W,60);
  ctx.strokeStyle='rgba(233,200,106,0.3)';ctx.strokeRect(0,ROWS*TILE,W,60);

  ctx.fillStyle='#7ffaff';ctx.font='600 13px Segoe UI';ctx.textAlign='left';
  ctx.fillText('FRAGMENTS: '+score,12,y+20);

  // System 1 Director Telemetry
  const dirColor=labyrinthDirector.tension>70?'#ff4fac':(labyrinthDirector.tension>40?'#e9c86a':'#64f0b0');
  ctx.font='10px ui-monospace,monospace';ctx.fillStyle=dirColor;
  ctx.fillText(`DIRECTOR [${labyrinthDirector.state}] ${Math.round(labyrinthDirector.tension)}% · ${labyrinthDirector.decisionLatencyUs.toFixed(3)}µs`,12,y+42);

  ctx.textAlign='center';ctx.fillStyle='#e9c86a';ctx.font='600 13px Segoe UI';
  ctx.fillText('GATE '+level,W/2,y+20);

  // Mantra Energy
  ctx.font='10px ui-monospace,monospace';
  ctx.fillStyle=mantraEnergy>=50?'#e9c86a':'#888';
  ctx.fillText(`MANTRA RING [Q]: ${Math.round(mantraEnergy)}%`,W/2,y+42);

  // Lives / Archive
  ctx.textAlign='right';
  ctx.fillStyle='rgba(210,220,240,.8)';ctx.font='600 12px Segoe UI';
  ctx.fillText('ARCHIVE: '+highScore,W-12,y+20);
  ctx.font='10px ui-monospace,monospace';
  ctx.fillStyle=player.phaseCool<=0?'#7df9ff':'#777';
  ctx.fillText(player.phaseCool<=0?'PARRY READY [SHIFT]':`PARRY CD: ${player.phaseCool.toFixed(1)}s`,W-12,y+42);
}

function draw(){
  ctx.fillStyle='#04020a';ctx.fillRect(0,0,W,H);
  drawMaze();

  if(state===STATE.PLAY||state===STATE.READY){
    drawPlayer();
    ghosts.forEach(g=>drawGhost(g));

    // Active Mantra Wave
    if(activeMantraWave){
      ctx.save();
      ctx.strokeStyle='rgba(233,200,106,0.85)';ctx.lineWidth=3;
      ctx.beginPath();
      ctx.arc(activeMantraWave.x,activeMantraWave.y,activeMantraWave.radius,0,Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }

    // Floating Text
    floatingTexts.forEach(ft=>{
      ctx.save();ctx.globalAlpha=ft.life;
      ctx.font=`bold ${ft.size}px ui-monospace,monospace`;
      ctx.fillStyle=ft.color;ctx.textAlign='center';
      ctx.shadowColor=ft.color;ctx.shadowBlur=8;
      ctx.fillText(ft.text,ft.x,ft.y);
      ctx.restore();
    });

    drawHUD();
  }

  if(state===STATE.READY){
    ctx.textAlign='center';ctx.fillStyle='#fd0';ctx.font='bold 22px Courier New';
    ctx.shadowColor='#fd0';ctx.shadowBlur=14;
    ctx.fillText('THE GATE LISTENS',W/2,ROWS*TILE/2+20);
    ctx.shadowBlur=0;
  }

  if(state===STATE.MENU){
    drawMaze();drawHUD();
    ctx.fillStyle='rgba(6,6,15,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    drawAtlasCell(1,0,W/2,H/2-108,156,0,false,1);
    
    ctx.shadowColor='#e9c86a';ctx.shadowBlur=22;
    ctx.font='900 36px Segoe UI';ctx.fillStyle='#e9c86a';
    ctx.fillText('PILGRIM',W/2,H/2+4);
    ctx.shadowBlur=10;ctx.font='700 18px Segoe UI';ctx.fillStyle='#7ffaff';
    ctx.fillText('O F   T E N   G A T E S : APEX AI',W/2,H/2+34);
    ctx.shadowBlur=0;

    ctx.font='700 14px Segoe UI';ctx.fillStyle='#e9c86a';
    if(Math.sin(frameCount*0.06)>0)ctx.fillText('STRIKE SPACE TO ENTER',W/2,H/2+78);
    ctx.font='11px Segoe UI';ctx.fillStyle='rgba(205,218,236,.75)';
    ctx.fillText('ARROWS: NAVIGATE | SHIFT / C: PHASE STRIDE & PARRY',W/2,H/2+106);
    ctx.fillText('Q: MANTRA MANDALA RING (PURIFIES PREDATORS)',W/2,H/2+128);
    ctx.fillStyle='rgba(142,105,173,.85)';
    ctx.fillText('SYSTEM 1 ADAPTIVE INTERCEPTION & PINCER TACTICS',W/2,H/2+152);
  }

  if(state===STATE.DEAD){
    ctx.fillStyle='rgba(6,6,15,0.85)';ctx.fillRect(0,100,W,300);
    ctx.textAlign='center';
    ctx.shadowColor='#f44';ctx.shadowBlur=20;
    ctx.font='bold 34px Courier New';ctx.fillStyle='#f44';
    ctx.fillText('THE ARGUMENT CLOSES',W/2,200);
    ctx.shadowBlur=0;
    ctx.font='22px Courier New';ctx.fillStyle='#fd0';
    ctx.fillText('FRAGMENTS  '+score,W/2,246);
    if(score>=highScore&&score>0){ctx.fillStyle='#0f8';ctx.font='16px Segoe UI';ctx.fillText('★ NEW ARCHIVE INSCRIPTION ★',W/2,276);}
    ctx.font='13px Courier New';ctx.fillStyle='#888';
    ctx.fillText('ARCHIVE  '+highScore,W/2,304);
    ctx.fillStyle='#0f8';ctx.font='15px Courier New';
    if(Math.sin(frameCount*0.06)>0)ctx.fillText('RETURN TO THE FIRST GATE',W/2,342);
  }
}

// ----------------- CONTROLS & COMPATIBILITY -----------------
score=0;lives=3;level=1;
initGame();

document.addEventListener('keydown',e=>{
  SNDRESUME();
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Shift','KeyQ','KeyC'].includes(e.code))e.preventDefault();
  if(e.code==='Space'){
    if(state===STATE.MENU)init();
    else if(state===STATE.DEAD)state=STATE.MENU;
  }
  if(state===STATE.PLAY||state===STATE.READY){
    if(e.code==='ArrowUp'){player.nx=0;player.ny=-1;}
    if(e.code==='ArrowDown'){player.nx=0;player.ny=1;}
    if(e.code==='ArrowLeft'){player.nx=-1;player.ny=0;}
    if(e.code==='ArrowRight'){player.nx=1;player.ny=0;}
    if(e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='KeyC')triggerPhaseParry();
    if(e.code==='KeyQ')triggerMantraRing();
  }
});

let swipeStart=null;
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();SNDRESUME();swipeStart={x:e.clientX,y:e.clientY};
  if(state===STATE.MENU)init();else if(state===STATE.DEAD)state=STATE.MENU;
});
canvas.addEventListener('pointerup',e=>{
  if(!swipeStart)return;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;swipeStart=null;
  if(Math.hypot(dx,dy)<16)return;
  if(Math.abs(dx)>Math.abs(dy)){player.nx=Math.sign(dx);player.ny=0;}else{player.nx=0;player.ny=Math.sign(dy);}
});

function pilgrimPayload(){
  return {
    title:'Pilgrim of Ten Gates : Apex AI Edition',
    atlas:PILGRIM_ATLAS,atlasReady:!!pilgrimAtlas.naturalWidth,
    state:Object.keys(STATE).find(k=>STATE[k]===state),score,level,lives,dots,powerTimer,
    player:{x:player.x,y:player.y,dx:player.dx,dy:player.dy,nextX:player.nx,nextY:player.ny,form:powerTimer>0?'awakened':'neutral'},
    predatorCast:PREDATOR_CAST.map(p=>p.name),
    predators:ghosts.map(g=>({name:g.name,x:g.x,y:g.y,home:g.home,reversed:g.scared>0})),
    labyrinthDirector:{state:labyrinthDirector.state,tension:Math.round(labyrinthDirector.tension),decisionLatencyUs:labyrinthDirector.decisionLatencyUs}
  };
}
window.pilgrimPayload=pilgrimPayload;
window.__pilgrimDebug={
  payload:pilgrimPayload,
  enterPlay(){init();readyTimer=0;state=STATE.PLAY;return pilgrimPayload();},
  awaken(){powerTimer=300;ghosts.forEach(g=>{g.home=false;g.scared=300;});return pilgrimPayload();},
  triggerParry(){triggerPhaseParry();return true;},
  triggerMantra(){triggerMantraRing();return true;},
  showPredators(){if(state!==STATE.PLAY)this.enterPlay();[[3,3],[17,3],[3,19],[17,19]].forEach(([x,y],i)=>{maze[y][x]=3;ghosts[i].x=x;ghosts[i].y=y;ghosts[i].home=false;ghosts[i].scared=0;});return pilgrimPayload();},
  steer(dx,dy){player.nx=dx;player.ny=dy;return pilgrimPayload();}
};

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
