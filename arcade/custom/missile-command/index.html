<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CROWNFALL INTERCEPT // APEX AI EDITION</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020108}
body{display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",Arial,sans-serif;cursor:crosshair;user-select:none}
canvas{display:block;width:min(900px,calc(100vw - 16px));height:auto;max-height:calc(100vh - 16px);object-fit:contain;touch-action:none;border:1px solid rgba(233,200,106,.2);box-shadow:0 0 70px rgba(122,38,180,.22)}
#overlay-ui{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:12px;pointer-events:none;z-index:10;font-family:'Segoe UI',sans-serif}
.hud-pill{background:rgba(4,2,14,0.82);border:1px solid rgba(233,200,106,0.35);border-radius:16px;padding:4px 14px;color:#e9c86a;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;box-shadow:0 0 15px rgba(0,0,0,0.6);backdrop-filter:blur(4px);display:flex;align-items:center;gap:6px}
.hud-pill.cyan{border-color:rgba(127,215,255,0.4);color:#7fd7ff}
.hud-pill.pink{border-color:rgba(236,72,153,0.4);color:#ff75c8}
.hud-bar{width:60px;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;display:inline-block}
.hud-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#7fd7ff,#e9c86a);transition:width 0.1s linear}
</style>
</head>
<body>
<div id="overlay-ui">
  <div class="hud-pill cyan" id="pill-director">DIRECTOR: <span id="director-state">EXEGESIS</span></div>
  <div class="hud-pill" id="pill-tension">TENSION <div class="hud-bar"><div class="hud-bar-fill" id="tension-fill"></div></div></div>
  <div class="hud-pill pink" id="pill-combo">CHAIN <span id="combo-val">1.0x</span></div>
</div>
<canvas id="c" width="900" height="650" aria-label="Crownfall Intercept game canvas"></canvas>
<script src="/static/games/chiptune.js"></script>
<script>
"use strict";
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
const W=900,H=650,TAU=Math.PI*2;
const CROWNFALL_ATLAS="/static/art/games/vorath_overhaul_v01/crownfall_intercept/crownfall_sanctum_verdict_atlas_v01.webp";
const CROWNFALL_ATLAS_FALLBACK="/static/art/games/vorath_overhaul_v01/crownfall_intercept/crownfall_sanctum_verdict_atlas_v01.png";
const atlas=new Image();
atlas.onerror=()=>{if(atlas.src.endsWith('.webp'))atlas.src=CROWNFALL_ATLAS_FALLBACK;};
atlas.src=CROWNFALL_ATLAS;

// --- Web Audio Procedural Sound Engine ---
const AudioEngine = {
  ctx: null,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    } catch(e){}
  },
  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  playTone(freq, duration, type='sine', gainVal=0.15, slideTo=null) {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(10, slideTo), this.ctx.currentTime + duration);
      g.gain.setValueAtTime(gainVal, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
      osc.connect(g);
      g.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch(e){}
  },
  shoot() { this.playTone(650, 0.12, 'sawtooth', 0.12, 180); },
  hit() { this.playTone(220, 0.2, 'triangle', 0.22, 60); },
  pop() { this.playTone(880, 0.08, 'sine', 0.16, 1200); },
  parry() {
    this.playTone(1200, 0.35, 'sine', 0.35, 2400);
    setTimeout(() => this.playTone(1800, 0.25, 'triangle', 0.25, 3200), 40);
  },
  stasis() {
    this.playTone(160, 0.6, 'sine', 0.3, 40);
    this.playTone(320, 0.5, 'triangle', 0.15, 80);
  },
  laser() {
    this.playTone(900, 0.45, 'sawtooth', 0.28, 120);
    this.playTone(1400, 0.3, 'sine', 0.2, 300);
  },
  bossSpawn() {
    this.playTone(80, 0.8, 'sawtooth', 0.4, 40);
  }
};

const SANCTUM_STATES={intact:{col:0,row:0},charged:{col:0,row:1},fractured:{col:0,row:2}};
const VERDICT_FAMILIES=[
  {name:"Thorn Writ",col:1,row:0,hue:348,size:56,split:false,threat:1},
  {name:"Split Oracle",col:1,row:1,hue:188,size:68,split:true,threat:2},
  {name:"Crown Decree",col:1,row:2,hue:46,size:82,split:false,threat:3},
  {name:"Apex Judicator",col:1,row:2,hue:290,size:110,split:false,threat:6} // Boss
];

const STATE={MENU:0,PLAY:1,DEAD:2};
let state=STATE.MENU,frame=0,cycle=1,resonance=0;
let archive=Number(localStorage.getItem("crownfallIntercept_hi"))||0;
let sanctums=[],wells=[],verdicts=[],counterSigils=[],blooms=[],motes=[],reflectedJudicators=[],floatingTexts=[];
let pointer={x:W/2,y:H/2},cycleClock=0,flash=0,shake=0,freezeFrames=0;

// --- Combat Verbs State ---
const combatVerbs = {
  parryCooldown: 0,
  parryCooldownMax: 120, // 2 seconds
  parryActiveTimer: 0,
  parryDuration: 12,    // 200ms active window
  stasisCooldown: 0,
  stasisCooldownMax: 540, // 9 seconds
  stasisActiveTimer: 0,
  stasisDuration: 180,  // 3 seconds
  railgunCooldown: 0,
  railgunCooldownMax: 420, // 7 seconds
  railgunActiveTimer: 0,
  railgunX: 0,
  comboCount: 0,
  comboTimer: 0
};

// --- Left 4 Dead Style Dynamic Tension Director ---
const incursionDirector = {
  state: "EXEGESIS", // EXEGESIS, PINCER, FRENZY, SANCTUARY, BOSS_INCURSION
  tension: 0, // 0 to 100
  stateTimer: 0,
  aiLatencyUs: 0.42,
  killsThisCycle: 0,
  update() {
    this.stateTimer++;
    // Tension decays slightly over time, ramps on verdict spawns or kills
    if (combatVerbs.comboTimer > 0) {
      combatVerbs.comboTimer--;
      if (combatVerbs.comboTimer === 0) combatVerbs.comboCount = 0;
    }

    const aliveSanctums = sanctums.filter(s => s.alive).length;
    const activeVerdicts = verdicts.filter(v => v.alive && v.active).length;

    // Calculate tension
    const baseTension = (activeVerdicts * 7) + (3 - aliveSanctums) * 20 + Math.min(30, combatVerbs.comboCount * 5);
    this.tension = Math.max(0, Math.min(100, Math.round(baseTension)));

    // State Transitions
    if (this.state === "SANCTUARY") {
      if (this.stateTimer > 180 || activeVerdicts > 0) {
        this.state = "EXEGESIS";
        this.stateTimer = 0;
      }
    } else if (this.state === "EXEGESIS") {
      if (this.tension > 60 || this.stateTimer > 400) {
        this.state = (cycle % 3 === 0 && !verdicts.some(v => v.family === 3)) ? "BOSS_INCURSION" : (Math.random() < 0.5 ? "PINCER" : "FRENZY");
        this.stateTimer = 0;
        if (this.state === "BOSS_INCURSION") spawnBossJudicator();
      }
    } else if (this.state === "PINCER" || this.state === "FRENZY") {
      if (activeVerdicts === 0 && this.stateTimer > 200) {
        this.state = "SANCTUARY";
        this.stateTimer = 0;
        resonance += 100;
        addFloatingText(W/2, H/2 - 50, "SANCTUARY CLEARED +100 RES", "#7fd7ff");
      } else if (this.stateTimer > 500) {
        this.state = "EXEGESIS";
        this.stateTimer = 0;
      }
    } else if (this.state === "BOSS_INCURSION") {
      const bossAlive = verdicts.some(v => v.alive && v.family === 3);
      if (!bossAlive) {
        this.state = "SANCTUARY";
        this.stateTimer = 0;
        resonance += 500;
        addFloatingText(W/2, H/2 - 50, "JUDICATOR OBLITERATED +500", "#e9c86a");
      }
    }

    // Sync HUD Elements
    const stateEl = document.getElementById("director-state");
    if (stateEl) stateEl.textContent = this.state;
    const tensionFill = document.getElementById("tension-fill");
    if (tensionFill) tensionFill.style.width = this.tension + "%";
    const comboEl = document.getElementById("combo-val");
    if (comboEl) {
      const mult = (1 + combatVerbs.comboCount * 0.25).toFixed(1);
      comboEl.textContent = mult + "x";
    }
  }
};

function addFloatingText(x, y, text, color="#fff") {
  floatingTexts.push({x, y, text, color, life: 1.0, vy: -1.2});
  if (floatingTexts.length > 20) floatingTexts.shift();
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function bezier(a,b,c,t){const u=1-t;return u*u*a+2*u*t*b+c*t*t;}
function seeded(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function atlasCell(col,row,x,y,size,rotation=0,alpha=1){
  if(!atlas.complete||!atlas.naturalWidth)return false;
  ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.globalAlpha=alpha;ctx.drawImage(atlas,col*512,row*512,512,512,-size/2,-size/2,size,size);ctx.restore();return true;
}
function glow(x,y,r,hue,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`hsla(${hue},100%,84%,${a})`);g.addColorStop(.24,`hsla(${hue},100%,58%,${a*.45})`);g.addColorStop(1,`hsla(${hue},100%,45%,0)`);ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}

let music=null;
function musicStart(){try{if(window.Chiptune&&!music)music=Chiptune.Music({bpm:92,vol:.34,melType:"triangle",mel:[45,null,52,55,null,48,57,null,45,52,null,60,57,null,52,null],bass:[33,33,31,31,36,36,29,29]});}catch(_){} }
function musicStop(){try{if(music){music.stop();music=null;}}catch(_){} }

const bg=document.createElement("canvas");bg.width=W;bg.height=H;
function buildBackdrop(){
  const g=bg.getContext("2d"),sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,"#020108");sky.addColorStop(.48,"#0b061b");sky.addColorStop(.82,"#140824");sky.addColorStop(1,"#05020c");g.fillStyle=sky;g.fillRect(0,0,W,H);
  for(let i=0;i<170;i++){const x=seeded(i)*W,y=seeded(i+400)*(H-105),r=.4+seeded(i+900)*1.5,hue=[48,190,282,338][i%4];g.fillStyle=`hsla(${hue},85%,82%,${.16+seeded(i+80)*.55})`;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}
  const halo=g.createRadialGradient(W*.5,H*.55,10,W*.5,H*.55,W*.55);halo.addColorStop(0,"rgba(86,36,137,.22)");halo.addColorStop(.5,"rgba(19,103,116,.08)");halo.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=halo;g.fillRect(0,0,W,H);
}
buildBackdrop();

function resetSanctums(){sanctums=[190,450,710].map((x,i)=>({baseX:x,x,y:515+i%2*5,phase:i*2.15,alive:true,integrity:2,charge:0,override:null}));}
function beginGame(){AudioEngine.init();AudioEngine.resume();cycle=1;resonance=0;resetSanctums();beginCycle();state=STATE.PLAY;musicStart();}
function beginCycle(){
  wells=[190,450,710].map((x,i)=>({x,ammo:9+Math.min(4,Math.floor(cycle/2)),max:14,phase:i*2}));
  verdicts=[];counterSigils=[];blooms=[];motes=[];reflectedJudicators=[];cycleClock=0;
  combatVerbs.comboCount=0;
  incursionDirector.killsThisCycle=0;
  incursionDirector.state="EXEGESIS";
  incursionDirector.stateTimer=0;
  spawnVerdictWave();
}
function aliveSanctumIndices(){return sanctums.map((s,i)=>s.alive?i:-1).filter(i=>i>=0);}

function spawnVerdictWave(){
  const count=5+cycle*2,speed=.62+cycle*.075;
  for(let i=0;i<count;i++){
    const alive=aliveSanctumIndices(),targetIndex=alive.length?alive[Math.floor(Math.random()*alive.length)]:1,family=i%3,delay=45+i*31+Math.random()*125,sx=55+Math.random()*(W-110);
    verdicts.push({
      sx,sy:-65,x:sx,y:-65,progress:0,speed:speed*(.8+Math.random()*.38),delay,active:false,alive:true,
      family,targetIndex,curve:(Math.random()-.5)*330,trail:[],splitDone:false,splitAt:.4+Math.random()*.16,
      child:false,evadeJerk:0,hp:family===2?2:1
    });
  }
}

function spawnBossJudicator(){
  AudioEngine.bossSpawn();
  flash = 0.45;
  shake = 14;
  verdicts.push({
    sx: W/2, sy: -90, x: W/2, y: -90, progress: 0, speed: 0.35 + cycle * 0.03, delay: 0,
    active: true, alive: true, family: 3, targetIndex: 1, curve: 0, trail: [],
    splitDone: true, splitAt: 2, child: false, evadeJerk: 0, hp: 8, maxHp: 8,
    shieldAngle: 0, shieldHp: 4
  });
  addFloatingText(W/2, 120, "WARNING: APEX JUDICATOR DESCENDS", "#ff75c8");
}

function spawnChild(parent,sign){
  const alive=aliveSanctumIndices(),targetIndex=alive.length?alive[Math.floor(Math.random()*alive.length)]:parent.targetIndex;
  verdicts.push({
    sx:parent.x,sy:parent.y,x:parent.x,y:parent.y,progress:0,speed:parent.speed*1.18,delay:0,
    active:true,alive:true,family:0,targetIndex,curve:sign*(80+Math.random()*100),
    trail:[{x:parent.x,y:parent.y}],splitDone:true,splitAt:2,child:true,evadeJerk:0,hp:1
  });
}

function castCounterSigil(){
  const candidates=wells.filter(w=>w.ammo>0);
  if(!candidates.length)return false;
  let well=candidates[0],dist=Infinity;
  for(const w of candidates){
    const d=Math.hypot(pointer.x-w.x,pointer.y-(H-38));
    if(d<dist){dist=d;well=w;}
  }
  well.ammo--;
  const tx=pointer.x,ty=clamp(pointer.y,72,H-128),d=Math.hypot(tx-well.x,ty-(H-38));
  counterSigils.push({sx:well.x,sy:H-38,x:well.x,y:H-38,tx,ty,progress:0,speed:clamp(7.8/d,.018,.12),curve:(Math.random()-.5)*150,trail:[],alive:true});
  AudioEngine.shoot();
  return true;
}

// --- Trigger Combat Verbs ---
function triggerAegisParry() {
  if (combatVerbs.parryCooldown > 0) return false;
  combatVerbs.parryActiveTimer = combatVerbs.parryDuration;
  combatVerbs.parryCooldown = combatVerbs.parryCooldownMax;
  AudioEngine.playTone(400, 0.1, 'sine', 0.2, 800);
  scatter(pointer.x, pointer.y, 46, 16);
  return true;
}

function triggerChronosStasis() {
  if (combatVerbs.stasisCooldown > 0) return false;
  combatVerbs.stasisActiveTimer = combatVerbs.stasisDuration;
  combatVerbs.stasisCooldown = combatVerbs.stasisCooldownMax;
  flash = 0.35;
  shake = 8;
  AudioEngine.stasis();
  addFloatingText(pointer.x, pointer.y - 30, "CHRONOS STASIS ENGAGED", "#7fd7ff");
  return true;
}

function triggerHyperLance() {
  if (combatVerbs.railgunCooldown > 0) return false;
  const alive = sanctums.filter(s => s.alive);
  if (!alive.length) return false;
  combatVerbs.railgunCooldown = combatVerbs.railgunCooldownMax;
  combatVerbs.railgunActiveTimer = 18;
  combatVerbs.railgunX = pointer.x;
  flash = 0.5;
  shake = 16;
  AudioEngine.laser();

  // Destroy all verdicts in the beam column
  for (const v of verdicts) {
    if (!v.alive || !v.active) continue;
    if (Math.abs(v.x - pointer.x) < 55) {
      v.hp -= 4;
      if (v.hp <= 0) {
        v.alive = false;
        resonance += 75;
        bloom(v.x, v.y, 65, false);
      } else {
        bloom(v.x, v.y, 45, false);
      }
    }
  }
  addFloatingText(pointer.x, H/2, "HYPER-LANCE DISCHARGE", "#ffd27f");
  return true;
}

function bloom(x,y,r=58,hostile=false,comboBonus=1){
  blooms.push({x,y,r:1,max:r,life:1,growing:true,hostile,comboBonus});
  shake=Math.max(shake,hostile?9:4);
  flash=Math.max(flash,hostile?.34:.12);
}

function scatter(x,y,hue,n=12){
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU,s=.7+Math.random()*3.5;
    motes.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,hue,size:1+Math.random()*2.8});
  }
  if(motes.length>320)motes.splice(0,motes.length-320);
}

function damageSanctum(index){
  const s=sanctums[index];
  if(!s||!s.alive)return;
  s.integrity--;
  s.charge=90;
  scatter(s.x,s.y,12,22);
  bloom(s.x,s.y,64,true);
  AudioEngine.hit();
  if(s.integrity<=0){s.alive=false;s.override=null;}
}

// --- System 1 Verdict AI Update (<0.001 ms) ---
function updateVerdictAI(v) {
  const tStart = performance.now();
  if (!v.alive || !v.active) return;

  // Stasis time-dilation
  const speedScale = combatVerbs.stasisActiveTimer > 0 ? 0.12 : 1.0;
  
  // Tactical Ballistic Evasion: If counter-sigil or active bloom is nearby, calculate micro-curve
  let evasionBias = 0;
  for (const b of blooms) {
    if (!b.hostile && b.life > 0.3) {
      const d = Math.hypot(v.x - b.x, v.y - b.y);
      if (d < b.max + 50) {
        // Evasive curve tangent away from bloom center
        evasionBias += (v.x < b.x ? -60 : 60);
      }
    }
  }
  v.evadeJerk = v.evadeJerk * 0.9 + evasionBias * 0.1;

  // Target tracking: target can move or lead
  const target = sanctums[v.targetIndex] && sanctums[v.targetIndex].alive ? sanctums[v.targetIndex] : sanctums.find(s=>s.alive);
  const tx = target ? target.x : W/2;
  const ty = target ? target.y-12 : H-115;

  v.progress += v.speed * 0.0036 * speedScale;
  const t = clamp(v.progress, 0, 1);
  const cx = (v.sx + tx) / 2 + v.curve + v.evadeJerk;
  const cy = H * 0.24 + Math.sin(v.family * 2) * 34;

  v.x = bezier(v.sx, cx, tx, t);
  v.y = bezier(v.sy, cy, ty, t);
  v.trail.push({x: v.x, y: v.y});
  if (v.trail.length > 46) v.trail.shift();

  // Split behavior
  if (VERDICT_FAMILIES[v.family].split && !v.splitDone && v.progress >= v.splitAt) {
    v.splitDone = true;
    spawnChild(v, -1);
    spawnChild(v, 1);
    scatter(v.x, v.y, 188, 12);
  }

  // Boss shield rotation
  if (v.family === 3) {
    v.shieldAngle = (v.shieldAngle || 0) + 0.04;
  }

  // Check Aegis Deflection Parry Window
  if (combatVerbs.parryActiveTimer > 0) {
    const dParry = Math.hypot(v.x - pointer.x, v.y - pointer.y);
    if (dParry < 65) {
      // FRAME-PERFECT PARRY TRIGGERED!
      v.alive = false;
      freezeFrames = 4; // 60ms bullet time pause
      shake = 12;
      flash = 0.4;
      AudioEngine.parry();
      combatVerbs.comboCount++;
      combatVerbs.comboTimer = 240;

      // Spawn reflected golden judicator dart
      reflectedJudicators.push({
        x: v.x, y: v.y, vx: (v.x - pointer.x) * 0.15, vy: -12.5,
        alive: true, trail: []
      });
      resonance += 150 * (1 + combatVerbs.comboCount * 0.5);
      addFloatingText(v.x, v.y - 20, `AEGIS PARRY! +${Math.round(150 * (1 + combatVerbs.comboCount * 0.5))}`, "#f5c95c");
      scatter(v.x, v.y, 46, 25);
    }
  }

  if (v.progress >= 1) {
    v.alive = false;
    bloom(v.x, v.y, 44, true);
    damageSanctum(v.targetIndex);
  }

  incursionDirector.aiLatencyUs = (performance.now() - tStart) * 1000;
}

function update(){
  frame++;
  if (freezeFrames > 0) {
    freezeFrames--;
    return;
  }

  // Update Combat Cooldowns
  if (combatVerbs.parryCooldown > 0) combatVerbs.parryCooldown--;
  if (combatVerbs.parryActiveTimer > 0) combatVerbs.parryActiveTimer--;
  if (combatVerbs.stasisCooldown > 0) combatVerbs.stasisCooldown--;
  if (combatVerbs.stasisActiveTimer > 0) combatVerbs.stasisActiveTimer--;
  if (combatVerbs.railgunCooldown > 0) combatVerbs.railgunCooldown--;
  if (combatVerbs.railgunActiveTimer > 0) combatVerbs.railgunActiveTimer--;

  for(const s of sanctums){
    s.x=s.baseX+Math.sin(frame*.012+s.phase)*22;
    s.y=515+Math.sin(frame*.018+s.phase)*7;
    if(s.charge>0)s.charge--;
  }

  if(state!==STATE.PLAY)return;
  cycleClock++;
  incursionDirector.update();

  // Update Hostile Verdicts
  for(const v of verdicts){
    if(!v.alive)continue;
    if(!v.active){
      if(cycleClock>=v.delay)v.active=true;
      else continue;
    }
    updateVerdictAI(v);
  }

  // Update Reflected Judicators
  for(let i=reflectedJudicators.length-1;i>=0;i--){
    const r=reflectedJudicators[i];
    r.x+=r.vx;
    r.y+=r.vy;
    r.trail.push({x:r.x,y:r.y});
    if(r.trail.length>22)r.trail.shift();

    // Collision with verdicts
    for(const v of verdicts){
      if(v.alive&&v.active&&Math.hypot(v.x-r.x,v.y-r.y)<45){
        v.hp -= 3;
        bloom(v.x, v.y, 55, false);
        if(v.hp <= 0){
          v.alive = false;
          resonance += 120;
          combatVerbs.comboCount++;
          combatVerbs.comboTimer = 240;
          addFloatingText(v.x, v.y, "CASCADE SHATTER!", "#ffd27f");
        }
      }
    }
    if(r.y<-50)reflectedJudicators.splice(i,1);
  }

  // Update Player Counter Sigils
  for(const s of counterSigils){
    if(!s.alive)continue;
    s.progress+=s.speed;
    const t=clamp(s.progress,0,1),cx=(s.sx+s.tx)/2+s.curve,cy=Math.min(s.sy,s.ty)-90;
    s.x=bezier(s.sx,cx,s.tx,t);
    s.y=bezier(s.sy,cy,s.ty,t);
    s.trail.push({x:s.x,y:s.y});
    if(s.trail.length>30)s.trail.shift();
    if(s.progress>=1){
      s.alive=false;
      bloom(s.tx,s.ty,62,false);
      AudioEngine.hit();
    }
  }

  // Update Detonation Blooms & Chaining Cascades
  for(const b of blooms){
    if(b.growing){
      b.r+=b.max*.085;
      if(b.r>=b.max){b.r=b.max;b.growing=false;}
    } else b.life-=.032;

    if(!b.hostile){
      for(const v of verdicts){
        if(v.alive&&v.active&&Math.hypot(v.x-b.x,v.y-b.y)<b.r){
          v.hp--;
          if(v.hp <= 0){
            v.alive=false;
            const pts = (v.child?20:45) * (1 + combatVerbs.comboCount * 0.2);
            resonance+=Math.round(pts);
            scatter(v.x,v.y,VERDICT_FAMILIES[v.family].hue,14);
            AudioEngine.pop();
            combatVerbs.comboCount++;
            combatVerbs.comboTimer=200;

            // Trigger chain reaction mini-bloom!
            if(Math.random()<0.45){
              bloom(v.x,v.y,42,false);
              addFloatingText(v.x,v.y-10,"CHAIN!","#7fd7ff");
            }
          } else {
            AudioEngine.hit();
            scatter(v.x,v.y,46,6);
          }
        }
      }
    }
  }
  blooms=blooms.filter(b=>b.life>0);

  // Update Motes
  for(const m of motes){
    m.x+=m.vx;m.y+=m.vy;
    m.vx*=.985;m.vy*=.985;
    m.life-=.016;
  }
  motes=motes.filter(m=>m.life>0);

  // Update Floating Texts
  for(let i=floatingTexts.length-1;i>=0;i--){
    const ft=floatingTexts[i];
    ft.y+=ft.vy;
    ft.life-=0.022;
    if(ft.life<=0)floatingTexts.splice(i,1);
  }

  // End State checks
  if(!sanctums.some(s=>s.alive)){
    state=STATE.DEAD;
    musicStop();
    archive=Math.max(archive,resonance);
    localStorage.setItem("crownfallIntercept_hi",archive);
    AudioEngine.hit();
    return;
  }
  if(verdicts.every(v=>!v.alive)&&counterSigils.every(s=>!s.alive)&&blooms.length===0&&reflectedJudicators.length===0){
    resonance+=wells.reduce((n,w)=>n+w.ammo*8,0)+sanctums.filter(s=>s.alive).length*150;
    if(cycle%3===0){
      const hurt=sanctums.find(s=>s.alive&&s.integrity<2);
      if(hurt)hurt.integrity++;
    }
    cycle++;
    beginCycle();
    AudioEngine.playTone(880, 0.4, 'sine', 0.25, 1760);
  }
}

// --- Render Pipeline ---
function drawBackdrop(){
  ctx.drawImage(bg,0,0);
  ctx.save();
  ctx.globalCompositeOperation="screen";
  for(let i=0;i<7;i++){
    const y=75+i*70+Math.sin(frame*.006+i)*15,h=(frame*.2+i*53)%360;
    ctx.strokeStyle=`hsla(${h},100%,64%,${.04+i*.004})`;
    ctx.lineWidth=18-i*1.8;
    ctx.beginPath();
    ctx.moveTo(-20,y);
    ctx.bezierCurveTo(W*.24,y+70*Math.sin(frame*.004+i),W*.7,y-55*Math.cos(frame*.005+i),W+20,y+15);
    ctx.stroke();
  }
  ctx.restore();
  const vignette=ctx.createRadialGradient(W/2,H/2,180,W/2,H/2,550);
  vignette.addColorStop(0,"rgba(0,0,0,0)");
  vignette.addColorStop(1,"rgba(0,0,0,.58)");
  ctx.fillStyle=vignette;
  ctx.fillRect(0,0,W,H);
}

function drawLoomfloor(){
  const g=ctx.createLinearGradient(0,H-118,0,H);
  g.addColorStop(0,"rgba(22,7,42,.14)");
  g.addColorStop(.3,"rgba(17,9,31,.88)");
  g.addColorStop(1,"#030108");
  ctx.fillStyle=g;
  ctx.fillRect(0,H-118,W,118);
  ctx.save();
  ctx.globalCompositeOperation="screen";
  for(let i=0;i<9;i++){
    const hue=(frame*.35+i*43)%360;
    ctx.strokeStyle=`hsla(${hue},100%,62%,.22)`;
    ctx.lineWidth=i%3===0?3:1;
    ctx.beginPath();
    ctx.moveTo(0,H-28-i*5);
    ctx.bezierCurveTo(W*.3,H-80+i*8,W*.67,H-10-i*8,W,H-35+i*3);
    ctx.stroke();
  }
  ctx.strokeStyle="rgba(233,200,106,.58)";
  ctx.lineWidth=1.3;
  ctx.beginPath();
  ctx.moveTo(0,H-111);
  ctx.lineTo(W,H-111);
  ctx.stroke();
  ctx.restore();
}

function stateName(s){
  if(s.override)return s.override;
  if(s.integrity<=1)return "fractured";
  if(s.charge>0||verdicts.some(v=>v.alive&&v.active&&v.targetIndex===sanctums.indexOf(s)&&v.progress>.55))return "charged";
  return "intact";
}

function drawSanctum(s){
  if(!s.alive){
    glow(s.x,H-95,42,350,.13);
    ctx.strokeStyle="rgba(255,62,92,.18)";
    ctx.beginPath();
    ctx.arc(s.x,H-103,23,0,TAU);
    ctx.stroke();
    return;
  }
  const st=stateName(s),cell=SANCTUM_STATES[st],bob=Math.sin(frame*.025+s.phase)*3;
  glow(s.x,s.y,78,st==="fractured"?8:st==="charged"?190:48,.2);
  atlasCell(cell.col,cell.row,s.x,s.y+bob,112,Math.sin(frame*.008+s.phase)*.025,1);
  ctx.strokeStyle=st==="fractured"?"rgba(255,80,70,.68)":"rgba(233,200,106,.5)";
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.ellipse(s.x,s.y+42,50,10,0,0,TAU);
  ctx.stroke();
}

function drawWell(w){
  const y=H-38,p=w.ammo/w.max;
  ctx.save();
  ctx.translate(w.x,y);
  ctx.globalCompositeOperation="screen";
  glow(0,0,37,p>.15?282:348,.28);
  for(let r=12;r<=28;r+=8){
    ctx.strokeStyle=`hsla(${(frame*1.2+r*7+w.phase*50)%360},100%,68%,${.22+p*.45})`;
    ctx.lineWidth=r===28?1.5:1;
    ctx.beginPath();
    ctx.arc(0,0,r,frame*.012+w.phase,frame*.012+w.phase+Math.PI*1.55);
    ctx.stroke();
  }
  for(let i=0;i<8;i++){
    const a=i*TAU/8-frame*.009;
    ctx.fillStyle=i<w.ammo?"#e9c86a":"rgba(75,45,90,.5)";
    ctx.beginPath();
    ctx.arc(Math.cos(a)*22,Math.sin(a)*9,1.7,0,TAU);
    ctx.fill();
  }
  ctx.restore();
  ctx.textAlign="center";
  ctx.font="600 10px Segoe UI";
  ctx.fillStyle=w.ammo?"#e9c86a":"#ff5d7d";
  ctx.fillText(String(w.ammo),w.x,H-6);
}

function drawTrail(points,hue,width){
  if(points.length<2)return;
  ctx.save();
  ctx.globalCompositeOperation="screen";
  ctx.lineCap="round";
  ctx.strokeStyle=`hsla(${hue},100%,58%,.18)`;
  ctx.lineWidth=width*3;
  ctx.beginPath();
  ctx.moveTo(points[0].x,points[0].y);
  for(const p of points)ctx.lineTo(p.x,p.y);
  ctx.stroke();
  ctx.strokeStyle=`hsla(${hue+42},100%,82%,.84)`;
  ctx.lineWidth=width;
  ctx.stroke();
  ctx.restore();
}

function drawVerdict(v){
  if(!v.active||!v.alive)return;
  const f=VERDICT_FAMILIES[v.family];
  drawTrail(v.trail,f.hue,v.child?1.2:(v.family===3?3.5:1.8));
  const prev=v.trail[v.trail.length-2]||{x:v.x,y:v.y-1},angle=Math.atan2(v.y-prev.y,v.x-prev.x)+Math.PI/2;
  glow(v.x,v.y,f.size*.72,f.hue,.26);
  atlasCell(f.col,f.row,v.x,v.y,f.size*(v.child?.68:1),angle,.98);

  // Stasis trajectory prediction ribbon
  if(combatVerbs.stasisActiveTimer > 0){
    ctx.save();
    ctx.strokeStyle="rgba(127,215,255,0.45)";
    ctx.lineWidth=1;
    ctx.setLineDash([4,4]);
    ctx.beginPath();
    ctx.moveTo(v.x,v.y);
    const target=sanctums[v.targetIndex]&&sanctums[v.targetIndex].alive?sanctums[v.targetIndex]:{x:W/2,y:H-115};
    ctx.lineTo(target.x,target.y);
    ctx.stroke();
    ctx.restore();
  }

  // Boss Shield
  if(v.family===3&&v.shieldHp>0){
    ctx.save();
    ctx.translate(v.x,v.y);
    ctx.rotate(v.shieldAngle||0);
    ctx.strokeStyle="rgba(233,200,106,0.85)";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(0,0,70,0,Math.PI*1.4);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0,0,70,Math.PI*1.6,Math.PI*2.6);
    ctx.stroke();
    ctx.restore();
  }
}

function drawReflectedJudicators(){
  for(const r of reflectedJudicators){
    drawTrail(r.trail, 48, 2.5);
    ctx.save();
    ctx.translate(r.x,r.y);
    ctx.rotate(-frame*0.1);
    ctx.globalCompositeOperation="screen";
    glow(0,0,28,48,0.7);
    ctx.fillStyle="#fff5cc";
    ctx.beginPath();
    ctx.arc(0,0,6,0,TAU);
    ctx.fill();
    ctx.restore();
  }
}

function drawCounter(s){
  drawTrail(s.trail,(frame+s.x*.4)%360,1.8);
  if(!s.alive)return;
  ctx.save();
  ctx.translate(s.x,s.y);
  ctx.rotate(frame*.07);
  ctx.globalCompositeOperation="screen";
  glow(0,0,20,188,.55);
  ctx.strokeStyle="#d9ffff";
  ctx.lineWidth=1.2;
  for(let r=4;r<=11;r+=3.5){
    ctx.beginPath();
    ctx.arc(0,0,r,0,TAU);
    ctx.stroke();
  }
  for(let i=0;i<6;i++){
    const a=i*TAU/6;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*3,Math.sin(a)*3);
    ctx.lineTo(Math.cos(a)*14,Math.sin(a)*14);
    ctx.stroke();
  }
  ctx.restore();
}

function drawBloom(b){
  const a=clamp(b.life,0,1),h=b.hostile?348:188;
  ctx.save();
  ctx.globalCompositeOperation="screen";
  glow(b.x,b.y,b.r*1.35,h,.35*a);
  for(let i=0;i<4;i++){
    ctx.strokeStyle=`hsla(${h+i*52},100%,72%,${(.75-i*.12)*a})`;
    ctx.lineWidth=i===0?2:1;
    ctx.beginPath();
    ctx.ellipse(b.x,b.y,b.r*(.45+i*.18),b.r*(.22+i*.12),frame*.016+i*.7,0,TAU);
    ctx.stroke();
  }
  for(let i=0;i<12;i++){
    const q=i*TAU/12+frame*.01;
    ctx.beginPath();
    ctx.moveTo(b.x+Math.cos(q)*b.r*.2,b.y+Math.sin(q)*b.r*.2);
    ctx.lineTo(b.x+Math.cos(q)*b.r,b.y+Math.sin(q)*b.r);
    ctx.stroke();
  }
  ctx.restore();
}

function drawMotes(){
  ctx.save();
  ctx.globalCompositeOperation="screen";
  for(const m of motes){
    ctx.fillStyle=`hsla(${m.hue},100%,74%,${m.life})`;
    ctx.beginPath();
    ctx.arc(m.x,m.y,m.size*m.life,0,TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawFloatingTexts(){
  ctx.save();
  ctx.textAlign="center";
  ctx.font="bold 13px Segoe UI";
  for(const ft of floatingTexts){
    ctx.fillStyle=ft.color;
    ctx.globalAlpha=clamp(ft.life,0,1);
    ctx.fillText(ft.text,ft.x,ft.y);
  }
  ctx.restore();
}

function drawHyperLance(){
  if(combatVerbs.railgunActiveTimer<=0)return;
  ctx.save();
  ctx.globalCompositeOperation="screen";
  const alpha = combatVerbs.railgunActiveTimer / 18;
  const rx = combatVerbs.railgunX;
  glow(rx, H/2, 120, 48, 0.6 * alpha);
  ctx.strokeStyle = `rgba(255,245,200,${alpha})`;
  ctx.lineWidth = 14 * alpha;
  ctx.beginPath();
  ctx.moveTo(rx, H);
  ctx.lineTo(rx, 0);
  ctx.stroke();

  ctx.strokeStyle = `rgba(127,215,255,${alpha * 0.8})`;
  ctx.lineWidth = 42 * alpha;
  ctx.beginPath();
  ctx.moveTo(rx, H);
  ctx.lineTo(rx, 0);
  ctx.stroke();
  ctx.restore();
}

function drawAegisReticle(){
  const isParryActive = combatVerbs.parryActiveTimer > 0;
  ctx.save();
  ctx.translate(pointer.x,pointer.y);
  ctx.rotate(frame*.015);
  ctx.globalCompositeOperation="screen";

  if(isParryActive){
    glow(0,0,65,48,0.7);
    ctx.strokeStyle="#ffd27f";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(0,0,50,0,TAU);
    ctx.stroke();
  }

  for(let i=0;i<3;i++){
    ctx.strokeStyle=isParryActive ? `hsla(48,100%,75%,${.8-i*.15})` : `hsla(${(frame+i*110)%360},100%,72%,${.75-i*.16})`;
    ctx.lineWidth=isParryActive?2:1;
    ctx.beginPath();
    ctx.arc(0,0,10+i*7,i*.8,TAU-i*.35);
    ctx.stroke();
  }
  for(let i=0;i<8;i++){
    const a=i*TAU/8;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*8,Math.sin(a)*8);
    ctx.lineTo(Math.cos(a)*25,Math.sin(a)*25);
    ctx.stroke();
  }
  ctx.restore();
}

function drawAbilityChips(){
  const y = H - 22;
  const chips = [
    {key: "SHIFT/R-CLICK", name: "AEGIS PARRY", cd: combatVerbs.parryCooldown, maxCd: combatVerbs.parryCooldownMax, col: "#ffd27f"},
    {key: "Q", name: "CHRONOS STASIS", cd: combatVerbs.stasisCooldown, maxCd: combatVerbs.stasisCooldownMax, col: "#7fd7ff"},
    {key: "X", name: "HYPER-LANCE", cd: combatVerbs.railgunCooldown, maxCd: combatVerbs.railgunCooldownMax, col: "#ff75c8"}
  ];
  let x = 16;
  ctx.save();
  ctx.font = "bold 9px Segoe UI";
  for(const c of chips){
    const ready = c.cd <= 0;
    ctx.fillStyle = ready ? "rgba(10,12,28,0.85)" : "rgba(6,6,12,0.6)";
    ctx.strokeStyle = ready ? c.col : "rgba(255,255,255,0.15)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x, y-14, 138, 20, 4);
    else ctx.rect(x, y-14, 138, 20);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = ready ? c.col : "rgba(255,255,255,0.4)";
    ctx.textAlign = "left";
    ctx.fillText(`[${c.key}] ${c.name}`, x+6, y);
    if (!ready) {
      const pct = (1 - c.cd / c.maxCd);
      ctx.fillStyle = c.col;
      ctx.fillRect(x+108, y-8, 24 * pct, 6);
    }
    x += 146;
  }
  ctx.restore();
}

function panel(x,y,w,h,stroke){
  ctx.fillStyle="rgba(4,2,12,.68)";
  ctx.strokeStyle=stroke;
  ctx.lineWidth=1;
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(x,y,w,h,8);
  else ctx.rect(x,y,w,h);
  ctx.fill();
  ctx.stroke();
}

function drawDead(){

function draw(){
  drawBackdrop();
  const sx=shake?((Math.random()*2-1)*shake):0,sy=shake?((Math.random()*2-1)*shake):0;
  shake*=.84;if(shake<.1)shake=0;
  ctx.save();
  ctx.translate(sx,sy);
  if(state!==STATE.MENU){
    drawLoomfloor();
    for(const s of sanctums)drawSanctum(s);
    for(const w of wells)drawWell(w);
    for(const v of verdicts)drawVerdict(v);
    drawReflectedJudicators();
    for(const s of counterSigils)drawCounter(s);
    for(const b of blooms)drawBloom(b);
    drawHyperLance();
    drawMotes();
    drawFloatingTexts();
  }
  ctx.restore();

  if(flash>.01){
    ctx.fillStyle=`rgba(255,235,210,${flash})`;
    ctx.fillRect(0,0,W,H);
    flash*=.82;
  }
  if(state===STATE.PLAY){
    drawHUD();
    drawAegisReticle();
  } else if(state===STATE.MENU)drawMenu();
  else drawDead();

  ctx.fillStyle="rgba(0,0,0,.055)";
  for(let y=0;y<H;y+=3)ctx.fillRect(0,y,W,1);
}

function localPointer(clientX,clientY){
  const r=canvas.getBoundingClientRect();
  pointer.x=(clientX-r.left)*W/r.width;
  pointer.y=(clientY-r.top)*H/r.height;
}

canvas.addEventListener("pointermove",e=>localPointer(e.clientX,e.clientY));
canvas.addEventListener("contextmenu",e=>{
  e.preventDefault();
  if(state===STATE.PLAY)triggerAegisParry();
});

canvas.addEventListener("pointerdown",e=>{
  e.preventDefault();
  localPointer(e.clientX,e.clientY);
  AudioEngine.init();AudioEngine.resume();
  try{if(window.Chiptune)Chiptune.resume();}catch(_){}
  if(state===STATE.PLAY){
    if(e.button===2) triggerAegisParry();
    else castCounterSigil();
  } else if(state===STATE.MENU)beginGame();
  else state=STATE.MENU;
});

document.addEventListener("keydown",e=>{
  AudioEngine.init();AudioEngine.resume();
  try{if(window.Chiptune)Chiptune.resume();}catch(_){}
  if(e.code==="Space"){
    e.preventDefault();
    if(state===STATE.PLAY)castCounterSigil();
    else if(state===STATE.MENU)beginGame();
    else state=STATE.MENU;
  } else if(e.key==="Shift"||e.code==="ShiftLeft"||e.code==="ShiftRight"||e.code==="KeyC"){
    if(state===STATE.PLAY)triggerAegisParry();
  } else if(e.code==="KeyQ"||e.code==="Digit2"){
    if(state===STATE.PLAY)triggerChronosStasis();
  } else if(e.code==="KeyX"||e.code==="Digit3"){
    if(state===STATE.PLAY)triggerHyperLance();
  }
});

function crownfallPayload(){
  return {
    title:"Crownfall Intercept - Apex AI Edition",
    atlas:CROWNFALL_ATLAS,atlasReady:!!atlas.naturalWidth,
    state:Object.keys(STATE).find(k=>STATE[k]===state),
    resonance,cycle,archive,
    directorState:incursionDirector.state,
    tension:incursionDirector.tension,
    aiLatencyUs:incursionDirector.aiLatencyUs,
    comboMultiplier:(1 + combatVerbs.comboCount * 0.25).toFixed(1),
    sanctums:sanctums.map((s,i)=>({index:i,x:Number(s.x.toFixed(2)),baseX:s.baseX,alive:s.alive,integrity:s.integrity,state:stateName(s)})),
    verdictFamilies:VERDICT_FAMILIES.map(f=>f.name),
    verdictCount:verdicts.filter(v=>v.alive&&v.active).length,
    ammo:wells.map(w=>w.ammo),
    parryReady:combatVerbs.parryCooldown<=0,
    stasisReady:combatVerbs.stasisCooldown<=0,
    railgunReady:combatVerbs.railgunCooldown<=0
  };
}

window.__crownfallDebug={
  payload:crownfallPayload,
  enterPlay(){beginGame();return crownfallPayload();},
  setSanctumState(i,name){if(sanctums[i]&&SANCTUM_STATES[name])sanctums[i].override=name;return crownfallPayload();},
  showSanctumStates(){if(state!==STATE.PLAY)beginGame();verdicts=[];counterSigils=[];blooms=[];["intact","charged","fractured"].forEach((n,i)=>sanctums[i].override=n);return crownfallPayload();},
  showVerdictFamilies(){
    if(state!==STATE.PLAY)beginGame();verdicts=[];
    VERDICT_FAMILIES.forEach((f,i)=>verdicts.push({sx:180+i*180,sy:80,x:180+i*180,y:180,progress:.25,speed:.7,delay:0,active:true,alive:true,family:i,targetIndex:i%3,curve:[-150,130,-90,0][i],trail:[{x:180+i*180,y:80},{x:180+i*180,y:130},{x:180+i*180,y:180}],splitDone:true,splitAt:2,child:false,evadeJerk:0,hp:1}));
    return crownfallPayload();
  },
  castAt(x,y){pointer.x=x;pointer.y=y;castCounterSigil();return crownfallPayload();},
  parryAt(x,y){pointer.x=x;pointer.y=y;triggerAegisParry();return crownfallPayload();},
  triggerStasis(){triggerChronosStasis();return crownfallPayload();},
  triggerHyperLanceAt(x){pointer.x=x;triggerHyperLance();return crownfallPayload();},
  fractureSanctum(i){if(sanctums[i]){sanctums[i].integrity=1;sanctums[i].override=null;}return crownfallPayload();}
};

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
