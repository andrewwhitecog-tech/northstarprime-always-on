name: TMP IDG checks (PR heads, delete branch after)

# Throwaway branch only. Real-play checks of open IDG pull requests in a muted
# headless Chromium: the Blade Tribunal ladder test, and desktop + phone
# captures of PR 206 and PR 223 heads. Nothing here deploys.
on:
  push:
    branches: [claude/tmp-idg-stall-20261109]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tp206
            ref: 4b80c98531903e36cdbbd1a3f481df66dd630a1d
            cmd: python tool/tmp_capture/text_probe.py --base http://127.0.0.1:8765 --out out/tp206 --slugs precinct-404,vorath-pinball,vorath-signal-crown,chrono-blade-2049,prism-runner-2049,dharma-invaders
          - name: tp234
            ref: f5765faae0a914300a9d15846f4de01f0061875a
            cmd: python tool/tmp_capture/text_probe.py --base http://127.0.0.1:8765 --out out/tp234 --slugs prism-drift
          - name: tp223
            ref: 1914e281025215a243bf382b17379cd74d49a6cb
            cmd: python tool/tmp_capture/text_probe.py --base http://127.0.0.1:8765 --out out/tp223 --slugs vorath-delve
          - name: tp227
            ref: 4606f19519d5ae8bae76451604c5ef751391e378
            cmd: python tool/tmp_capture/text_probe.py --base http://127.0.0.1:8765 --out out/tp227 --slugs vorath-blade-tribunal
          - name: tp233
            ref: 32944c805e40cba2bba4d32e2189ec73b6a2f68c
            cmd: python tool/tmp_capture/text_probe.py --base http://127.0.0.1:8765 --out out/tp233 --slugs the-dark-below
    steps:
      - uses: actions/checkout@v4
        with: { path: tool, show-progress: false, sparse-checkout: tmp_capture }
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: site
          show-progress: false
          sparse-checkout: |
            arcade
            static/games
            static/art/games
            static/vendor
            static/arcade
            static/idg
            static/curated
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Playwright Chromium and Pillow
        run: |
          pip install playwright==1.58.0 pillow
          python -m playwright install --with-deps chromium
      - name: Serve the PR head (8765)
        run: |
          nohup python tool/tmp_capture/serve.py 8765 site >/dev/null 2>&1 &
          sleep 3
      - name: Run ${{ matrix.name }}
        continue-on-error: true
        run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idg-check-${{ matrix.name }}
          path: out
          retention-days: 5
