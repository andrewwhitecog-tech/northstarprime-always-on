<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Hyperspace Portal Radial Glow -->
    <radialGradient id="wormholePortal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#00f0ff"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="65%" stop-color="#ec4899"/>
      <stop offset="85%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Train Interior Metallic Sheen -->
    <linearGradient id="metalWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="trimetYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f0ff" flood-opacity="0.9"/>
    </filter>

    <filter id="portalBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Poster Frame -->
  <rect width="800" height="1000" fill="#090d16"/>
  <rect x="25" y="25" width="750" height="950" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.4"/>
  <rect x="35" y="35" width="730" height="930" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- HEADER / TRANSIT BANNER -->
  <g transform="translate(400, 85)" text-anchor="middle">
    <rect x="-350" y="-35" width="700" height="50" fill="#004f9e" rx="6" stroke="#ffc72c" stroke-width="2"/>
    <text font-family="'Inter', 'Helvetica', sans-serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="3" y="-3">
      TRIQ-MET • CASCADE TRANSIT DIVISION
    </text>
    <text font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#fde047" letter-spacing="1.5" y="24">
      INTERDIMENSIONAL LIGHT RAIL LINE • CAR 420-OR
    </text>
  </g>

  <!-- MAIN TRAIN CAR INTERIOR & WORMHOLE SCENE -->
  <g transform="translate(50, 140)">
    <!-- Car Ceiling & Curved Roof -->
    <path d="M 0 60 Q 350 15 700 60 L 700 650 L 0 650 Z" fill="url(#metalWall)"/>
    
    <!-- Fluorescent Overhead Tube Lights -->
    <rect x="60" y="55" width="240" height="12" fill="#e2e8f0" rx="4" filter="url(#portalBloom)"/>
    <rect x="400" y="55" width="240" height="12" fill="#e2e8f0" rx="4" filter="url(#portalBloom)"/>

    <!-- Automated LED Destination Sign above doors -->
    <rect x="150" y="85" width="400" height="36" fill="#000000" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
    <text font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#f59e0b" x="350" y="108" text-anchor="middle" filter="url(#neonGlow)">
      NEXT STOP: Cascadia Solarium // 5TH DIMENSION
    </text>

    <!-- CENTER AUTOMATIC TRAIN DOORS OPENED TO COSMIC WORMHOLE -->
    <!-- Door Frame Opening -->
    <rect x="150" y="130" width="400" height="480" fill="#000000" stroke="#334155" stroke-width="4"/>

    <!-- WORMHOLE VIEW THROUGH THE DOORS -->
    <g clip-path="url(#doorClip)">
      <clipPath id="doorClip">
        <rect x="152" y="132" width="396" height="476"/>
      </clipPath>

      <!-- Hyperspace Vortex -->
      <rect x="152" y="132" width="396" height="476" fill="url(#wormholePortal)"/>

      <!-- Spiral Starlight Tunnel Rings -->
      <g transform="translate(350, 370)">
        <ellipse cx="0" cy="0" rx="280" ry="180" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="8,12" opacity="0.6"/>
        <ellipse cx="0" cy="0" rx="210" ry="135" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="12,8" opacity="0.7"/>
        <ellipse cx="0" cy="0" rx="140" ry="90" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,6" opacity="0.8"/>
        <ellipse cx="0" cy="0" rx="70" ry="45" fill="none" stroke="#ffffff" stroke-width="2"/>
        <circle cx="0" cy="0" r="15" fill="#ffffff" filter="url(#portalBloom)"/>

        <!-- Swirling Light Rays -->
        <line x1="-300" y1="-200" x2="300" y2="200" stroke="#00f0ff" stroke-width="1" opacity="0.5"/>
        <line x1="-300" y1="200" x2="300" y2="-200" stroke="#ec4899" stroke-width="1" opacity="0.5"/>
        <line x1="0" y1="-200" x2="0" y2="200" stroke="#fde047" stroke-width="1" opacity="0.6"/>

        <!-- Distant Silhouette of Vorath Mothership over Mt. Hood -->
        <polygon points="-40,40 0,20 40,40" fill="#0f172a" opacity="0.8"/>
        <ellipse cx="0" cy="-60" rx="55" ry="14" fill="#0f172a" opacity="0.85"/>
        <circle cx="-30" cy="-60" r="2" fill="#00f0ff"/>
        <circle cx="0" cy="-58" r="3" fill="#fde047"/>
        <circle cx="30" cy="-60" r="2" fill="#00f0ff"/>
      </g>
    </g>

    <!-- Slid-Open Train Sliding Doors on sides -->
    <rect x="95" y="130" width="55" height="480" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="105" y="160" width="35" height="200" fill="#38bdf8" fill-opacity="0.3" stroke="#64748b" stroke-width="1.5"/>
    <line x1="148" y1="130" x2="148" y2="610" stroke="#fde047" stroke-width="4"/>

    <rect x="550" y="130" width="55" height="480" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="560" y="160" width="35" height="200" fill="#38bdf8" fill-opacity="0.3" stroke="#64748b" stroke-width="1.5"/>
    <line x1="552" y1="130" x2="552" y2="610" stroke="#fde047" stroke-width="4"/>

    <!-- Stainless Steel Handrail Center Pole -->
    <rect x="345" y="110" width="10" height="500" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
    <!-- Yellow Grab Rings / Straps -->
    <g fill="none" stroke="url(#trimetYellow)" stroke-width="4">
      <circle cx="260" cy="115" r="14"/>
      <line x1="260" y1="70" x2="260" y2="101"/>
      <circle cx="440" cy="115" r="14"/>
      <line x1="440" y1="70" x2="440" y2="101"/>
    </g>

    <!-- Train Floor with Yellow Safety Strip -->
    <rect x="0" y="590" width="700" height="60" fill="#0f172a"/>
    <rect x="150" y="590" width="400" height="12" fill="#eab308" stroke="#000000" stroke-width="1"/>
    <line x1="150" y1="596" x2="550" y2="596" stroke="#000000" stroke-width="2" stroke-dasharray="10,10"/>

    <!-- PASSENGER ON LEFT SEAT (Portland Psychonaut Commuter) -->
    <g transform="translate(30, 390)">
      <!-- MAX Fabric Seat (Retro blue & orange geometric print) -->
      <rect x="0" y="80" width="110" height="90" rx="8" fill="#1e3a8a" stroke="#004f9e" stroke-width="2"/>
      <circle cx="30" cy="110" r="5" fill="#f97316"/>
      <circle cx="80" cy="130" r="5" fill="#f97316"/>
      <circle cx="50" cy="150" r="5" fill="#f97316"/>

      <!-- Commuter Figure: Knit Beanie, Flannel, Over-Ear Headphones -->
      <!-- Legs & Body -->
      <path d="M 40 100 L 75 100 L 85 180 L 30 180 Z" fill="#374151"/>
      <!-- Plaid Flannel Jacket -->
      <rect x="35" y="30" width="48" height="75" rx="6" fill="#991b1b"/>
      <line x1="45" y1="30" x2="45" y2="105" stroke="#1f2937" stroke-width="2"/>
      <line x1="65" y1="30" x2="65" y2="105" stroke="#1f2937" stroke-width="2"/>
      <line x1="35" y1="65" x2="83" y2="65" stroke="#1f2937" stroke-width="2"/>

      <!-- Head & Beanie -->
      <ellipse cx="60" cy="15" rx="14" ry="18" fill="#f5d0b5"/>
      <path d="M 46 12 Q 60 -8 74 12 Z" fill="#d97706"/>
      <!-- Over-Ear Headphones -->
      <path d="M 44 14 Q 60 -2 76 14" fill="none" stroke="#00f0ff" stroke-width="3.5"/>
      <rect x="42" y="10" width="6" height="12" rx="2" fill="#0f172a" stroke="#00f0ff" stroke-width="1"/>
      <rect x="72" y="10" width="6" height="12" rx="2" fill="#0f172a" stroke="#00f0ff" stroke-width="1"/>

      <!-- NSP APOTHECARY Luxury Shopping Bag on Commuter's Lap -->
      <g transform="translate(62, 75)">
        <rect x="0" y="0" width="42" height="46" rx="3" fill="#064e3b" stroke="#fbbf24" stroke-width="1.5"/>
        <path d="M 12 0 Q 21 -14 30 0" fill="none" stroke="#fbbf24" stroke-width="2"/>
        <!-- Golden Crest on Bag -->
        <circle cx="21" cy="22" r="9" fill="#022c22" stroke="#fbbf24" stroke-width="1"/>
        <text font-family="'Cinzel', serif" font-size="6" font-weight="bold" fill="#fbbf24" x="21" y="24" text-anchor="middle">NSP</text>
      </g>
    </g>

    <!-- Interior Window on Right showing Cascade Pine Silhouette -->
    <g transform="translate(615, 230)">
      <rect x="0" y="0" width="70" height="240" rx="8" fill="#022c22" stroke="#475569" stroke-width="2"/>
      <polygon points="35,30 20,80 50,80" fill="#064e3b"/>
      <polygon points="35,70 15,130 55,130" fill="#064e3b"/>
      <polygon points="35,120 10,190 60,190" fill="#064e3b"/>
    </g>
  </g>

  <!-- MEME BANNER & CAPTION BOX -->
  <g transform="translate(400, 830)" text-anchor="middle">
    <rect x="-350" y="-20" width="700" height="75" fill="#0f172a" stroke="#00f0ff" stroke-width="2" rx="8"/>
    <text font-family="'Inter', sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="1" y="10">
      "THE MOMENT THE MAX LIGHT RAIL SLIPS INTO INTERDIMENSIONAL"
    </text>
    <text font-family="'Inter', sans-serif" font-weight="900" font-size="18" fill="#00f0ff" letter-spacing="1" y="36">
      HYPERSPACE JUST PAST THE BEAVERTON TRANSIT CENTER
    </text>
  </g>

  <!-- TRANSIT ADVISORY SUBFOOTER -->
  <g transform="translate(400, 930)" text-anchor="middle">
    <text font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#94a3b8" letter-spacing="2">
      TRIQ-MET TRANSIT ADVISORY • PLEASE HOLD HANDRAILS AS 3D REALITY DISSOLVES
    </text>
    <text font-family="'Inter', sans-serif" font-size="10" fill="#64748b" y="18">
      Transfer at Cascadia Solarium Corridor for The Twilight Solarium &amp; Terpene Tasting Lounge
    </text>
  </g>
</svg>
