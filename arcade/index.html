<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Play — NorthStar Prime</title>
  <meta name="description" content="The NorthStar Prime Arcade: 54 original playable browser games, logic puzzles, cosmic action cabinets, living terrariums, and retro reimaginings. Free to play in guest mode.">
  <link rel="canonical" href="https://northstarprime.net/arcade/">
  <meta name="theme-color" content="#080c16">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NorthStar Prime">
  <meta property="og:title" content="Play — NorthStar Prime">
  <meta property="og:description" content="54 original playable browser games. Logic puzzles, cosmic action cabinets, living terrariums, and retro reimaginings.">
  <meta property="og:url" content="https://northstarprime.net/arcade/">
  <meta property="og:image" content="https://northstarprime.net/static/brand/nsp_vorath_wallpaper_perf.webp">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/static/customer-experience.css">
  <style>
    :root {
      --void: #050712;
      --gold: #f5c542;
      --cyan: #22d3ee;
      --pink: #ec4899;
      --green: #06d6a0;
      --purple: #a855f7;
      --line: rgba(245, 197, 66, 0.18);
    }
    body {
      background: radial-gradient(ellipse at 50% 10%, rgba(34,211,238,0.12), transparent 45%),
                  radial-gradient(ellipse at 20% 60%, rgba(168,85,247,0.1), transparent 40%),
                  radial-gradient(ellipse at 80% 80%, rgba(245,197,66,0.08), transparent 45%),
                  #050712;
      color: #e2e8f0;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      margin: 0;
      line-height: 1.6;
    }
    .arcade-wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1.5rem 5rem;
    }
    .arcade-hero {
      text-align: center;
      padding: 3rem 1rem 2rem;
    }
    .arcade-hero .eyebrow {
      color: var(--cyan);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }
    .arcade-hero h1 {
      font-size: clamp(2.4rem, 6vw, 4.5rem);
      margin: 0 0 1rem;
      letter-spacing: -1px;
      color: #fff;
      text-transform: uppercase;
    }
    .arcade-hero h1 span {
      background: linear-gradient(90deg, #f5c542, #22d3ee, #ec4899, #06d6a0, #f5c542);
      background-size: 260% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 8s linear infinite;
    }
    @keyframes shimmer { 0% { background-position: 0% center; } 100% { background-position: 260% center; } }
    .arcade-hero p {
      max-width: 820px;
      margin: 0 auto 1.5rem;
      color: #94a3b8;
      font-size: 1.15rem;
    }
    .arcade-toolbar {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      align-items: center;
      margin: 1.5rem 0 3rem;
    }
    .search-box {
      width: min(540px, 100%);
      position: relative;
    }
    .search-box input {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      padding: 0.75rem 1.5rem;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      transition: all 0.25s;
    }
    .search-box input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(34,211,238,0.25);
    }
    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }
    .pill {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      color: #cbd5e1;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pill:hover, .pill.active {
      background: rgba(34,211,238,0.15);
      border-color: var(--cyan);
      color: #fff;
      box-shadow: 0 0 12px rgba(34,211,238,0.2);
    }
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 1.5rem;
    }
    .game-card {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
      position: relative;
    }
    .game-card:hover {
      transform: translateY(-5px);
      border-color: var(--cyan);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 25px rgba(34,211,238,0.12);
    }
    .game-card.highlight {
      border-color: rgba(245,197,66,0.4);
      background: linear-gradient(135deg, rgba(20,28,50,0.85), rgba(15,23,42,0.75));
    }
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
      gap: 0.5rem;
    }
    .game-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      margin: 0;
      line-height: 1.2;
    }
    .game-tag {
      background: rgba(34,211,238,0.12);
      border: 1px solid rgba(34,211,238,0.3);
      color: var(--cyan);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .game-tag.gold {
      background: rgba(245,197,66,0.12);
      border-color: var(--gold);
      color: var(--gold);
    }
    .game-tag.purple {
      background: rgba(168,85,247,0.12);
      border-color: var(--purple);
      color: #c084fc;
    }
    .game-tag.green {
      background: rgba(6,214,160,0.12);
      border-color: var(--green);
      color: var(--green);
    }
    .game-desc {
      font-size: 0.88rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 1.25rem;
      flex-grow: 1;
    }
    .game-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .play-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 1.1rem;
      background: linear-gradient(135deg, rgba(34,211,238,0.2), rgba(34,211,238,0.05));
      border: 1px solid var(--cyan);
      color: #fff;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.2s;
    }
    .play-btn:hover {
      background: var(--cyan);
      color: #050712;
      box-shadow: 0 0 15px rgba(34,211,238,0.4);
    }
    .game-card.highlight .play-btn {
      background: linear-gradient(135deg, rgba(245,197,66,0.3), rgba(245,197,66,0.1));
      border-color: var(--gold);
      color: var(--gold);
    }
    .game-card.highlight .play-btn:hover {
      background: var(--gold);
      color: #050712;
    }
    .lab-footer-callout {
      text-align: center;
      margin: 4.5rem auto 1rem;
      padding: 2rem;
      background: rgba(15, 23, 42, 0.5);
      border: 1px dashed rgba(255,255,255,0.15);
      border-radius: 12px;
      max-width: 680px;
    }
    .lab-footer-callout p {
      margin: 0 0 1rem;
      color: #94a3b8;
    }
    .lab-footer-callout a {
      color: var(--cyan);
      font-weight: 600;
      text-decoration: none;
    }
    .lab-footer-callout a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div id="nsp-hub-root"></div>
<script>
(async () => {
  const n = 12;
  let html = '';
  for (let i = 0; i < n; i++) {
    const r = await fetch('hub.p' + i + '.html', { cache: 'no-store' });
    if (!r.ok) throw new Error('hub chunk ' + i + ' HTTP ' + r.status);
    html += await r.text();
  }
  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  const root = document.getElementById('nsp-hub-root');
  const parent = root.parentNode;
  const scripts = [];
  wrap.querySelectorAll('script').forEach((old) => {
    const s = document.createElement('script');
    if (old.src) s.src = old.src;
    else s.textContent = old.textContent;
    scripts.push(s);
    old.remove();
  });
  while (wrap.firstChild) parent.insertBefore(wrap.firstChild, root);
  root.remove();
  scripts.forEach((s) => parent.appendChild(s));
})().catch((e) => {
  document.body.innerHTML = '<pre style="color:#f66;padding:2rem;font:14px monospace">Arcade hub chunk load failed: ' + e + '</pre>';
});
</script>

</body>
</html>
