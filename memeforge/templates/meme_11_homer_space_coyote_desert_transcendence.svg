<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Psychedelic Twilight Sky Gradient -->
    <linearGradient id="desertSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="25%" stop-color="#2e1065"/>
      <stop offset="55%" stop-color="#701a75"/>
      <stop offset="75%" stop-color="#c026d3"/>
      <stop offset="90%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Spirit Coyote Bioluminescent Gradient -->
    <linearGradient id="coyoteSpirit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#67e8f9"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <radialGradient id="liquidRosinOrb" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>

    <filter id="celestialBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00f0ff" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Canvas Frame -->
  <rect width="800" height="1000" fill="#090514"/>
  <rect x="25" y="25" width="750" height="950" fill="none" stroke="#ea580c" stroke-width="2" opacity="0.4"/>
  <rect x="35" y="35" width="730" height="930" fill="none" stroke="#2e1065" stroke-width="4"/>

  <!-- HEADER -->
  <g transform="translate(400, 85)" text-anchor="middle">
    <text font-family="'Cinzel', serif" font-weight="900" font-size="24" fill="#fbbf24" letter-spacing="4">
      EL VIAJE MISTERIOSO DE NUESTRO HOMER
    </text>
    <line x1="-280" y1="14" x2="280" y2="14" stroke="#c026d3" stroke-width="2"/>
    <text font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#67e8f9" letter-spacing="2" y="32">
      TRANSCENDENTAL DESERT VISION QUEST • 10015 SW HALL BLVD
    </text>
  </g>

  <!-- MAIN PSYCHEDELIC LANDSCAPE -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="680" height="660" fill="url(#desertSky)" stroke="#3b0764" stroke-width="3" rx="10"/>

    <!-- Undulating Aurora Ribbons -->
    <path d="M 0 160 Q 180 80 340 180 T 680 120 L 680 0 L 0 0 Z" fill="#22c55e" fill-opacity="0.25" filter="url(#celestialBloom)"/>
    <path d="M 0 210 Q 220 120 420 230 T 680 180 L 680 0 L 0 0 Z" fill="#06b6d4" fill-opacity="0.25" filter="url(#celestialBloom)"/>

    <!-- Melting Double Celestial Moons -->
    <g transform="translate(540, 110)">
      <circle cx="0" cy="0" r="45" fill="#fef08a" filter="url(#celestialBloom)"/>
      <ellipse cx="25" cy="20" rx="35" ry="30" fill="#f43f5e" fill-opacity="0.7"/>
      <!-- Sun Rays -->
      <line x1="0" y1="-60" x2="0" y2="-80" stroke="#fef08a" stroke-width="3"/>
      <line x1="45" y1="-45" x2="65" y2="-65" stroke="#fef08a" stroke-width="3"/>
      <line x1="60" y1="0" x2="85" y2="0" stroke="#fef08a" stroke-width="3"/>
    </g>

    <!-- Starry Constellations (Beaver Constellation) -->
    <g stroke="#ffffff" stroke-width="1.5" fill="#ffffff">
      <circle cx="120" cy="90" r="3"/><circle cx="160" cy="70" r="2.5"/><circle cx="210" cy="95" r="4"/>
      <circle cx="180" cy="130" r="3"/><circle cx="130" cy="140" r="2.5"/><circle cx="90" cy="115" r="3.5"/>
      <line x1="120" y1="90" x2="160" y2="70" stroke-dasharray="3,3"/>
      <line x1="160" y1="70" x2="210" y2="95" stroke-dasharray="3,3"/>
      <line x1="210" y1="95" x2="180" y2="130" stroke-dasharray="3,3"/>
      <line x1="180" y1="130" x2="130" y2="140" stroke-dasharray="3,3"/>
      <line x1="130" y1="140" x2="90" y2="115" stroke-dasharray="3,3"/>
      <line x1="90" y1="115" x2="120" y2="90" stroke-dasharray="3,3"/>
      <text font-family="'Cinzel', serif" font-size="9" x="150" y="160" fill="#fde047" text-anchor="middle">CASTOR MAJOR</text>
    </g>

    <!-- Distant Geometric Dunes & Pyramids -->
    <!-- Far Mountain Range -->
    <polygon points="0,480 180,320 360,480" fill="#4a044e" opacity="0.8"/>
    <polygon points="260,480 460,280 680,480" fill="#581c87" opacity="0.8"/>
    <!-- Giant Central Stepped Pyramid -->
    <polygon points="340,240 180,490 500,490" fill="#3b0764"/>
    <line x1="340" y1="240" x2="340" y2="490" stroke="#701a75" stroke-width="2"/>
    <!-- Stepped levels -->
    <line x1="300" y1="300" x2="380" y2="300" stroke="#a21caf" stroke-width="3"/>
    <line x1="260" y1="360" x2="420" y2="360" stroke="#a21caf" stroke-width="3"/>
    <line x1="220" y1="420" x2="460" y2="420" stroke="#a21caf" stroke-width="3"/>

    <!-- Rolling Desert Dunes Forefront -->
    <path d="M 0 460 Q 200 420 400 490 T 680 450 L 680 660 L 0 660 Z" fill="#78350f"/>
    <path d="M 0 510 Q 250 470 500 550 T 680 500 L 680 660 L 0 660 Z" fill="#451a03"/>

    <!-- HOMER SIMPSON SEATED IN LOTUS CONTEMPLATION (Right Side) -->
    <g transform="translate(480, 430)">
      <!-- Silhouette in Meditation -->
      <path d="M 45 130 C 20 130 0 150 10 180 C 18 200 80 200 90 180 C 100 150 70 130 45 130 Z" fill="#090514"/>
      <!-- Torso -->
      <ellipse cx="48" cy="110" rx="35" ry="32" fill="#090514"/>
      <!-- Head with 2 Hairs & Muzzle -->
      <ellipse cx="48" cy="65" rx="22" ry="24" fill="#090514"/>
      <ellipse cx="62" cy="74" rx="16" ry="12" fill="#090514"/>
      <!-- Homer's Iconic Hairs -->
      <path d="M 40 42 Q 48 30 54 42" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <path d="M 46 42 Q 54 28 60 42" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <!-- Glowing Third Eye on Forehead -->
      <circle cx="50" cy="58" r="4" fill="#00f0ff" filter="url(#celestialBloom)"/>
    </g>

    <!-- THE SPIRIT COYOTE (Left Dune, Luminous & Howling) -->
    <g transform="translate(100, 360)" filter="url(#intenseGlow)">
      <!-- Coyote Body -->
      <path d="M 30 180 Q 50 130 100 120 Q 140 120 150 160 Q 155 210 130 220 Q 80 220 50 200 Z" fill="url(#coyoteSpirit)"/>
      <!-- Hind Leg & Tail -->
      <path d="M 40 180 Q 15 170 0 210 Q -10 240 20 230 Q 45 220 50 190 Z" fill="url(#coyoteSpirit)"/>
      <!-- Chest & Front Legs -->
      <path d="M 120 160 L 145 230 L 125 230 L 105 180 Z" fill="url(#coyoteSpirit)"/>
      <!-- Arching Neck & Howling Muzzle pointed to stars -->
      <path d="M 100 120 Q 120 80 150 40 L 175 48 Q 155 75 140 100 Q 125 125 100 120 Z" fill="url(#coyoteSpirit)"/>
      <!-- Ears -->
      <polygon points="135,50 148,20 155,45" fill="url(#coyoteSpirit)"/>
      <polygon points="125,58 135,32 142,54" fill="url(#coyoteSpirit)"/>
      <!-- Open Howling Jaw -->
      <path d="M 175 48 L 195 44 L 180 56 Z" fill="url(#coyoteSpirit)"/>
      <!-- Starry Coat Constellation Dots -->
      <circle cx="80" cy="150" r="2.5" fill="#ffffff"/>
      <circle cx="110" cy="140" r="2" fill="#ffffff"/>
      <circle cx="65" cy="175" r="2.5" fill="#ffffff"/>
      <circle cx="120" cy="165" r="2" fill="#ffffff"/>
    </g>

    <!-- FLOATING CELESTIAL LIVE ROSIN ORB BETWEEN THEM -->
    <g transform="translate(340, 450)">
      <!-- Concentric Terpene Soundwaves -->
      <circle cx="0" cy="0" r="75" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.6"/>
      <circle cx="0" cy="0" r="55" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="8,4" opacity="0.8"/>
      
      <!-- Golden Live Rosin Crystal Orb -->
      <circle cx="0" cy="0" r="35" fill="url(#liquidRosinOrb)" filter="url(#celestialBloom)"/>
      <!-- Swirling Terpene Spirals inside Orb -->
      <path d="M -20 -10 Q 0 -30 20 -10 Q 0 10 -15 0" fill="none" stroke="#fef08a" stroke-width="2"/>
      
      <!-- Ascending Terpene Vapor Column to Stars -->
      <path d="M 0 -35 Q -30 -90 10 -150 Q 50 -210 0 -280" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.8" stroke-dasharray="6,6"/>
      <path d="M 0 -35 Q 30 -90 -10 -150 Q -50 -210 0 -280" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.7" stroke-dasharray="4,8"/>
    </g>
  </g>

  <!-- MEME CAPTION RIBBON -->
  <g transform="translate(400, 835)" text-anchor="middle">
    <rect x="-350" y="-22" width="700" height="75" fill="#180c2e" stroke="#fbbf24" stroke-width="2" rx="8"/>
    <text font-family="'Cinzel', serif" font-weight="900" font-size="16" fill="#fef08a" letter-spacing="1.5" y="8">
      "CLARITY IS FOUND NOT IN THE ABSENCE OF SMOKE,
    </text>
    <text font-family="'Cinzel', serif" font-weight="900" font-size="16" fill="#00f0ff" letter-spacing="1.5" y="34">
      BUT IN THE ABSOLUTE PURITY OF THE TERPENE"
    </text>
  </g>

  <!-- SUBFOOTER METRICS & CREDENTIALS -->
  <g transform="translate(400, 930)" text-anchor="middle">
    <text font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#e879f9" letter-spacing="2">
      SOUL MATE PROTOCOL • VORATH STARLIGHT BRIDGE • 10015 SW HALL BLVD
    </text>
    <text font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8" y="18">
      Dedicated to the Space Coyote &amp; Oregon's Single-Source Solventless Connoisseurs
    </text>
  </g>
</svg>
