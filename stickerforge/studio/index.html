<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StickerForge Studio • Interactive Sticker Slap &amp; Customizer | NorthStar Prime</title>
  <meta name="description" content="Design and slap your own custom sticker layouts on laptops, hydroflasks, skateboards, and bumpers with real-time holographic foil lighting and precision vector die-cut borders.">
  <meta name="theme-color" content="#07090e">
  <link rel="canonical" href="https://northstarprime.net/stickerforge/studio/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sticker-studio.css?v=20260922">
  <script src="sticker-studio.js?v=20260922" defer></script>
</head>
<body data-guest-view="true" data-guest-purchase="true" data-membership-required="false">

  <header class="studio-header">
    <div class="brand-group">
      <a href="/" class="brand-title">NORTHSTAR PRIME</a>
      <span class="brand-badge">StickerForge Studio</span>
    </div>
    <nav class="header-nav" aria-label="Creative Forge Navigation">
      <a href="/stickerforge/" class="nav-link">Catalog (425)</a>
      <a href="/tarot/oracle/" class="nav-link">Vorath Oracle</a>
      <a href="/coloring-studio/" class="nav-link">PaintForge</a>
      <a href="/arcade/" class="nav-link">Arcade (51)</a>
      <a href="/contact/" class="nav-link">Contact</a>
    </nav>
  </header>

  <main class="studio-layout">
    <!-- Center / Interactive Canvas Area -->
    <section class="canvas-container" aria-label="Interactive Sticker Canvas">
      <!-- Surface Picker -->
      <div class="surface-bar" role="group" aria-label="Select Surface">
        <button type="button" class="surface-btn active" data-surface="laptop-dark">Laptop (Dark)</button>
        <button type="button" class="surface-btn" data-surface="laptop-silver">Laptop (Silver)</button>
        <button type="button" class="surface-btn" data-surface="hydroflask">Hydroflask</button>
        <button type="button" class="surface-btn" data-surface="skateboard">Skateboard</button>
        <button type="button" class="surface-btn" data-surface="guitar">Electric Guitar</button>
        <button type="button" class="surface-btn" data-surface="flight-case">Roadie Case</button>
        <button type="button" class="surface-btn" data-surface="bumper">Car Bumper</button>
        <button type="button" class="surface-btn" data-surface="artboard">Artboard</button>
      </div>

      <!-- Main Slap Surface -->
      <div id="slapStage" class="slap-stage" data-surface="laptop-dark">
        <!-- Placed stickers injected here dynamically -->
      </div>

      <!-- Action Bar -->
      <div class="canvas-bottom-bar">
        <button type="button" id="autoBombBtn" class="action-pill-btn" style="background: linear-gradient(135deg, var(--gold), var(--pink)); color:#07090e; font-weight:800;" title="Procedurally sticker-bomb the surface">✦ Auto-Slap Bomb</button>
        <button type="button" id="clearSurfaceBtn" class="action-pill-btn" title="Remove all stickers">Clear Surface</button>
        <button type="button" id="downloadPngBtn" class="action-pill-btn" title="Download high-resolution image">Save Setup PNG</button>
        <button type="button" id="orderPackBtn" class="action-pill-btn primary" title="Request this sticker pack">Order My Slap Pack &rarr;</button>
      </div>
    </section>

    <!-- Right Sidebar Controls & Tray -->
    <aside class="studio-sidebar" aria-label="Sticker Tray & Controls">
      <div class="sidebar-tabs" role="tablist">
        <button type="button" class="sidebar-tab active" data-tab="tabTray" role="tab">Sticker Tray</button>
        <button type="button" class="sidebar-tab" data-tab="tabEdit" role="tab">Edit Selected</button>
        <button type="button" class="sidebar-tab" data-tab="tabBadges" role="tab">Custom Badges</button>
      </div>

      <!-- Tab 1: Sticker Tray -->
      <div id="tabTray" class="sidebar-content tab-pane" role="tabpanel">
        <input type="search" id="traySearch" class="search-box" placeholder="Search 450+ stickers..." autocomplete="off">
        <div id="filterPills" class="filter-pills" aria-label="Collections filter"></div>
        <div id="stickerTray" class="sticker-tray-grid"></div>
      </div>

      <!-- Tab 2: Edit Selected Sticker -->
      <div id="tabEdit" class="sidebar-content tab-pane" role="tabpanel" hidden>
        <div class="control-group">
          <label for="stickerSizeSlider" class="control-label">Size (Scale)</label>
          <div class="slider-row">
            <input type="range" id="stickerSizeSlider" min="50" max="400" value="140">
          </div>
        </div>

        <div class="control-group">
          <label for="stickerRotateSlider" class="control-label">Rotation (Degrees)</label>
          <div class="slider-row">
            <input type="range" id="stickerRotateSlider" min="-180" max="180" value="0">
          </div>
        </div>

        <div class="control-group">
          <label for="stickerOpacitySlider" class="control-label">Opacity</label>
          <div class="slider-row">
            <input type="range" id="stickerOpacitySlider" min="10" max="100" value="100">
          </div>
        </div>

        <div class="control-group">
          <span class="control-label">Die-Cut Border Style</span>
          <div class="style-buttons">
            <button type="button" class="style-btn active" data-style="die-cut-white">White Vinyl</button>
            <button type="button" class="style-btn" data-style="die-cut-gold">Gold Foil</button>
            <button type="button" class="style-btn" data-style="die-cut-holographic">Prism Holo</button>
            <button type="button" class="style-btn" data-style="die-cut-none">Clean Cut</button>
          </div>
        </div>

        <div class="control-group">
          <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-size:0.85rem;color:var(--text-main);font-weight:600;">
            <input type="checkbox" id="holoToggle" checked style="accent-color:var(--cyan);width:18px;height:18px;">
            Holographic Foil Shimmer Layer
          </label>
        </div>

        <div class="control-group" style="margin-top:0.5rem;">
          <span class="control-label">Layering &amp; Actions</span>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">
            <button type="button" id="bringFrontBtn" class="style-btn">Bring to Front</button>
            <button type="button" id="sendBackBtn" class="style-btn">Send to Back</button>
            <button type="button" id="duplicateBtn" class="style-btn">Duplicate</button>
            <button type="button" id="deleteBtn" class="style-btn" style="color:#ef4444;border-color:rgba(239,68,68,0.3);">Delete Sticker</button>
          </div>
        </div>
      </div>

      <!-- Tab 3: Custom Text Badges -->
      <div id="tabBadges" class="sidebar-content tab-pane" role="tabpanel" hidden>
        <p style="font-size:0.85rem;color:var(--text-muted);line-height:1.5;">Create personalized die-cut text stickers and slap them directly on your canvas.</p>
        <div class="badge-creator-form">
          <div class="control-group">
            <label for="badgeTextInput" class="control-label">Badge Text</label>
            <input type="text" id="badgeTextInput" class="badge-input" placeholder="e.g. OREGON GROWN" maxlength="24">
          </div>

          <div class="control-group">
            <label for="badgeShapeSelect" class="control-label">Badge Shape</label>
            <select id="badgeShapeSelect" class="search-box">
              <option value="pill">Rounded Pill</option>
              <option value="banner">Ribbon Banner</option>
              <option value="hex">Cyber Hexagon</option>
            </select>
          </div>

          <div class="control-group">
            <label for="badgeColorSelect" class="control-label">Badge Background Color</label>
            <select id="badgeColorSelect" class="search-box">
              <option value="#0f172a">Dark Slate (#0F172A)</option>
              <option value="#1e1b4b">Deep Indigo (#1E1B4B)</option>
              <option value="#78350f">Rich Amber (#78350F)</option>
              <option value="#064e3b">Cascadia Forest (#064E3B)</option>
              <option value="#831843">Magenta Twilight (#831843)</option>
            </select>
          </div>

          <button type="button" id="addTextBadgeBtn" class="action-pill-btn primary" style="justify-content:center;margin-top:0.5rem;">
            + Slap Custom Badge on Canvas
          </button>
        </div>
      </div>
    </aside>
  </main>

</body>
</html>
