name: NorthStar visitor route checks
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d610a653b5bb18facb541466dae4dbf902da59f5
          sparse-checkout: |
            music
            realm
            .github/hq_audio_review
            static/games
            store
            play
            links
            merch
            chromatic
            stickerforge
            parody-drop
            community
            idc-programming
            tools
            tests
            static/front
            static/cards
            warband/art
          persist-credentials: false
      - run: python -m pip -q install playwright beautifulsoup4 pillow pytest requests

      - name: Browser verification
        shell: python
        run: |
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b=p.chromium.launch(executable_path='/usr/bin/google-chrome',args=['--disable-gpu'])
              page=b.new_page()
              page.goto('https://andrewcog.gumroad.com/l/ouklmz',wait_until='domcontentloaded',timeout=45000)
              page.wait_for_timeout(2800)
              print('TIPTEXT',page.locator('body').inner_text()[:1700].replace('\n',' | '))
              print('INPUTS',page.locator('input,select,button').evaluate_all("""xs=>xs.filter(e=>e.checkVisibility()).map(e=>[e.tagName,e.type,e.min,e.placeholder,e.value,(e.innerText||'').slice(0,60)]).slice(0,30)"""))
              b.close()
