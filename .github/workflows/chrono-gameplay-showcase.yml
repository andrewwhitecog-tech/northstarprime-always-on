name: Chrono existing native-audio master
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/scripts/chrono-master-existing-recording.cjs
      - .github/workflows/chrono-gameplay-showcase.yml
permissions:
  contents: read
  actions: read
jobs:
  source-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - run: node --check .github/scripts/chrono-master-existing-recording.cjs
  master:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chrono-gameplay-showcase-42589037599
          run-id: '42589037599'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/chrono-native-original
      - name: Install distribution FFmpeg only
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Produce one measured two-pass native-audio master with unchanged coded video
        env:
          CHRONO_MASTER_INPUT: ${{ runner.temp }}/chrono-native-original
          CHRONO_MASTER_OUT: ${{ runner.temp }}/chrono-native-master
        run: timeout --signal=TERM --kill-after=10s 300s node .github/scripts/chrono-master-existing-recording.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chrono-native-audio-master-${{ github.run_id }}
          path: ${{ runner.temp }}/chrono-native-master/
          retention-days: 14
