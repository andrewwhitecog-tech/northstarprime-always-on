name: Deploy curated NorthStar Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Verify homepage continuity and monitor failure handling
        run: |
          python tools/verify_home_static.py
          python -m unittest discover -s tools -p test_public_availability.py
          python -m unittest discover -s tools -p test_video_storage.py
      - name: Build curated artifact
        run: python tools/build_pages_artifact.py --output "$GITHUB_WORKSPACE/output/pages-artifact"
      - name: Verify independent video storage before publishing links
        run: python tools/verify_video_storage.py --network
      - name: Verify curated artifact
        run: python tools/verify_pages_artifact.py --artifact "$GITHUB_WORKSPACE/output/pages-artifact"
      - name: Verify RenalShield discovery and support bridge
        run: python tools/verify_renalshield_static.py
      - name: Verify VORATH Dreams collection
        run: python tools/verify_vorath_dreams_static.py
      - name: Verify Dream Court collection
        run: python tools/verify_dream_court_static.py
      - name: Verify Signal Refrains anthology
        run: python tools/verify_signal_refrains_static.py
      - name: Verify restored Dream Signal single
        run: python tools/verify_distance_learns_my_name_static.py
      - name: Install media probe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify MIDNIGHT LOOM mature bumper
        run: python tools/verify_midnight_loom_static.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: output/pages-artifact
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
