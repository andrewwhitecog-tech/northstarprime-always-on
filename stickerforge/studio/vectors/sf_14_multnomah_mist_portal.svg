<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Waterfall & Cosmic Wormhole Gradients -->
    <linearGradient id="vortexCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="35%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <radialGradient id="portalCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="85%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#050814"/>
    </radialGradient>

    <linearGradient id="bridgeBasalt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="portalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00f0ff" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#04060e"/>

  <!-- DIE CUT STICKER CONTAINER -->
  <g transform="translate(400, 400)" filter="url(#portalGlow)">
    <!-- White Die-Cut Vinyl Bleed Margin -->
    <circle cx="0" cy="0" r="375" fill="#ffffff"/>
    <circle cx="0" cy="0" r="365" fill="#090d16" stroke="url(#vortexCyan)" stroke-width="8"/>
    <circle cx="0" cy="0" r="350" fill="url(#portalCore)" stroke="#38bdf8" stroke-width="2"/>

    <!-- Concentric Cosmic Frequency Markers -->
    <circle cx="0" cy="0" r="335" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,6"/>
    <circle cx="0" cy="0" r="280" fill="none" stroke="url(#vortexCyan)" stroke-width="1.5" opacity="0.6"/>

    <!-- BASALT GORGE CLIFF WALLS (Left and Right Flanks) -->
    <!-- Left Canyon Wall with Douglas Firs -->
    <path d="M -350 -200 L -180 -180 L -140 -60 L -160 80 L -120 220 L -350 250 Z" fill="url(#bridgeBasalt)" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Left Wall Fir Silhouettes -->
    <polygon points="-240,-220 -220,-260 -200,-220" fill="#064e3b"/>
    <polygon points="-190,-160 -175,-200 -160,-160" fill="#064e3b"/>
    <polygon points="-160,-40 -145,-80 -130,-40" fill="#064e3b"/>

    <!-- Right Canyon Wall with Douglas Firs -->
    <path d="M 350 -200 L 180 -180 L 140 -60 L 160 80 L 120 220 L 350 250 Z" fill="url(#bridgeBasalt)" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Right Wall Fir Silhouettes -->
    <polygon points="240,-220 220,-260 200,-220" fill="#064e3b"/>
    <polygon points="190,-160 175,-200 160,-160" fill="#064e3b"/>
    <polygon points="160,-40 145,-80 130,-40" fill="#064e3b"/>

    <!-- THE SWIRLING VORTEX PORTAL (Center Abyss) -->
    <!-- Logarithmic Spiral Rays -->
    <g stroke="url(#vortexCyan)" stroke-width="3" fill="none" opacity="0.8" stroke-linecap="round">
      <path d="M 0 0 C 40 -30 90 -20 120 20 C 150 70 130 140 70 170 C -10 200 -90 170 -130 100 C -170 20 -130 -80 -50 -130 C 40 -180 150 -160 210 -80"/>
      <path d="M 0 0 C -40 30 -90 20 -120 -20 C -150 -70 -130 -140 -70 -170 C 10 -200 90 -170 130 -100 C 170 -20 130 80 50 130 C -40 180 -150 160 -210 80"/>
    </g>

    <!-- UPPER WATERFALL PLUMMETING INTO PORTAL -->
    <g fill="#ffffff" opacity="0.85">
      <path d="M -30 -260 L 30 -260 L 45 -40 L -45 -40 Z" fill="url(#vortexCyan)" opacity="0.6"/>
      <!-- Foam and Spray Lines -->
      <line x1="-20" y1="-250" x2="-25" y2="-40" stroke="#ffffff" stroke-width="3"/>
      <line x1="0" y1="-250" x2="0" y2="-40" stroke="#ffffff" stroke-width="4"/>
      <line x1="20" y1="-250" x2="25" y2="-40" stroke="#ffffff" stroke-width="3"/>
    </g>

    <!-- THE ICONIC STONE FOOTBRIDGE (Benson / Multnomah Bridge) -->
    <g transform="translate(0, -35)">
      <!-- Classical Stone Arch -->
      <path d="M -150 0 C -100 -55 100 -55 150 0 L 150 25 C 100 -30 -100 -30 -150 25 Z" fill="#64748b" stroke="#1e293b" stroke-width="3"/>
      <!-- Bridge Guard Railing -->
      <path d="M -150 -8 C -100 -62 100 -62 150 -8" fill="none" stroke="#cbd5e1" stroke-width="3"/>
      <!-- Railing Vertical Posts -->
      <line x1="-120" y1="-2" x2="-120" y2="-20" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="-80" y1="-18" x2="-80" y2="-38" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="-40" y1="-30" x2="-40" y2="-50" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="0" y1="-35" x2="0" y2="-55" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="40" y1="-30" x2="40" y2="-50" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="80" y1="-18" x2="80" y2="-38" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="120" y1="-2" x2="120" y2="-20" stroke="#cbd5e1" stroke-width="1.5"/>

      <!-- Tiny Silhouette of Psychonaut standing on Bridge looking into vortex -->
      <circle cx="0" cy="-63" r="4" fill="#fbbf24"/>
      <line x1="0" y1="-59" x2="0" y2="-45" stroke="#fbbf24" stroke-width="2.5"/>
      <path d="M 0 -45 L -4 -35 M 0 -45 L 4 -35" stroke="#fbbf24" stroke-width="2"/>
    </g>

    <!-- LOWER POOL & SPRAY MIST CLOUDS (Cascading into Multidimensional Void) -->
    <g transform="translate(0, 140)">
      <ellipse cx="0" cy="40" rx="140" ry="30" fill="#00dfd8" opacity="0.4" filter="url(#portalGlow)"/>
      <path d="M -90 20 Q -40 -10 0 20 Q 40 -10 90 20" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.7"/>
      <!-- Glowing Starlight Particle Beams bursting from pool -->
      <g stroke="#ffffff" stroke-width="2">
        <line x1="-60" y1="30" x2="-80" y2="-10"/>
        <line x1="-20" y1="40" x2="-30" y2="-20"/>
        <line x1="20" y1="40" x2="30" y2="-20"/>
        <line x1="60" y1="30" x2="80" y2="-10"/>
      </g>
    </g>

    <!-- TYPOGRAPHY ARCS -->
    <path id="cascadeArcTop" d="M -260 0 A 260 260 0 1 1 260 0" fill="none"/>
    <text font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="22" fill="#00f0ff" letter-spacing="5" text-anchor="middle">
      <textPath href="#cascadeArcTop" startOffset="50%">CASCADE MIST VORTEX</textPath>
    </text>

    <path id="cascadeArcBottom" d="M 260 0 A 260 260 0 0 1 -260 0" fill="none"/>
    <text font-family="'Inter', sans-serif" font-weight="900" font-size="15" fill="#f43f5e" letter-spacing="3" text-anchor="middle">
      <textPath href="#cascadeArcBottom" startOffset="50%">MULTNOMAH TO VORATH PRIME • 432 Hz</textPath>
    </text>
  </g>
</svg>
