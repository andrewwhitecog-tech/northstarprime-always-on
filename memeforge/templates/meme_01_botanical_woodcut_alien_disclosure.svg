<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Aged Parchment / Woodblock Ink Style -->
    <linearGradient id="parchmentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5ecd8"/>
      <stop offset="50%" stop-color="#ebd8b5"/>
      <stop offset="100%" stop-color="#deb887"/>
    </linearGradient>

    <!-- Woodcut Cross-Hatch Pattern -->
    <pattern id="woodcutHatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="8" y2="8" stroke="#3d2817" stroke-width="0.75" opacity="0.35"/>
    </pattern>
    <filter id="inkBleed">
      <feDropShadow dx="1" dy="1" stdDeviation="0.5" flood-color="#2a180b" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#parchmentBg)"/>
  <rect width="800" height="1000" fill="url(#woodcutHatch)"/>

  <!-- Antique Woodcut Outer Border -->
  <rect x="35" y="35" width="730" height="930" fill="none" stroke="#2a180b" stroke-width="6"/>
  <rect x="45" y="45" width="710" height="910" fill="none" stroke="#2a180b" stroke-width="1.5"/>
  <rect x="52" y="52" width="696" height="896" fill="none" stroke="#2a180b" stroke-width="0.75" stroke-dasharray="3,3"/>

  <!-- HEADER TITLE (Blackletter / Gothic Latin Style) -->
  <g transform="translate(400, 110)">
    <text font-family="'Cinzel', 'Georgia', serif" font-weight="900" font-size="34" fill="#2a180b" letter-spacing="4" text-anchor="middle">DISCLOSVRE : ANNO DOMINI 1542</text>
    <line x1="-280" y1="18" x2="280" y2="18" stroke="#2a180b" stroke-width="2"/>
    <text font-family="'Georgia', serif" font-style="italic" font-size="14" fill="#4a2e16" text-anchor="middle" y="38">The Celestial Emissary Bestoweth the Cosmic Seed unto the River Beaver</text>
  </g>

  <!-- MAIN WOODCUT ENGRAVING ILLUSTRATION FRAME -->
  <g transform="translate(70, 180)">
    <rect x="0" y="0" width="660" height="620" fill="#fcf6ea" stroke="#2a180b" stroke-width="3"/>

    <!-- Woodcut Sun with Face & Rays in Corner -->
    <circle cx="90" cy="90" r="45" fill="none" stroke="#2a180b" stroke-width="2.5"/>
    <path d="M 75 85 Q 90 95 105 85" stroke="#2a180b" stroke-width="2" fill="none"/>
    <circle cx="80" cy="78" r="3" fill="#2a180b"/>
    <circle cx="100" cy="78" r="3" fill="#2a180b"/>
    <!-- Radiating Woodcut Rays -->
    <path d="M 40 90 L 10 90 M 140 90 L 170 90 M 90 40 L 90 10 M 90 140 L 90 170 M 55 55 L 30 30 M 125 125 L 150 150 M 55 125 L 30 150 M 125 55 L 150 30" stroke="#2a180b" stroke-width="2"/>

    <!-- THE FLYING SAUCER / CELESTIAL CHARIOT -->
    <g transform="translate(380, 120)">
      <!-- Saucer Dome -->
      <ellipse cx="0" cy="0" rx="130" ry="35" fill="#f5ecd8" stroke="#2a180b" stroke-width="4"/>
      <ellipse cx="0" cy="-18" rx="65" ry="32" fill="#f5ecd8" stroke="#2a180b" stroke-width="3"/>
      <!-- Portholes -->
      <circle cx="-60" cy="0" r="6" fill="#2a180b"/>
      <circle cx="-20" cy="5" r="6" fill="#2a180b"/>
      <circle cx="20" cy="5" r="6" fill="#2a180b"/>
      <circle cx="60" cy="0" r="6" fill="#2a180b"/>
      
      <!-- Celestial Light Tractor Beam dropping seeds -->
      <path d="M -50 25 L -160 380 L 160 380 L 50 25 Z" fill="#ebd8b5" fill-opacity="0.4" stroke="#2a180b" stroke-width="1.5" stroke-dasharray="4,4"/>
      <!-- Falling Starlight Seeds -->
      <polygon points="0,90 4,98 12,98 6,104 8,112 0,107 -8,112 -6,104 -12,98 -4,98" fill="#2a180b"/>
      <polygon points="-40,180 -36,188 -28,188 -34,194 -32,202 -40,197 -48,202 -46,194 -52,188 -44,188" fill="#2a180b"/>
      <polygon points="40,240 44,248 52,248 46,254 48,262 40,257 32,262 34,254 28,248 36,248" fill="#2a180b"/>
    </g>

    <!-- MEDIEVAL LANDSCAPE & RIVER VALLEY (Cascadia Hills & River) -->
    <!-- Distant Mountain Peak (Mt. Hood in woodcut lines) -->
    <polygon points="120,320 220,180 320,320" fill="none" stroke="#2a180b" stroke-width="2.5"/>
    <line x1="220" y1="180" x2="220" y2="320" stroke="#2a180b" stroke-width="1.5"/>
    <line x1="190" y1="230" x2="250" y2="230" stroke="#2a180b" stroke-width="1.5"/>

    <!-- River Bank & Beaver Dam -->
    <path d="M 0 520 Q 200 480 400 530 T 660 500" fill="none" stroke="#2a180b" stroke-width="4"/>
    <!-- Interlocking Logs of Dam -->
    <line x1="180" y1="510" x2="320" y2="490" stroke="#2a180b" stroke-width="6"/>
    <line x1="200" y1="530" x2="340" y2="510" stroke="#2a180b" stroke-width="5"/>
    <line x1="230" y1="480" x2="290" y2="540" stroke="#2a180b" stroke-width="4"/>

    <!-- MEDIEVAL BLAZIN' BEAVER on River Bank -->
    <g transform="translate(260, 440)">
      <!-- Beaver Body -->
      <ellipse cx="0" cy="0" rx="45" ry="38" fill="#deb887" stroke="#2a180b" stroke-width="3"/>
      <!-- Tail with Woodcut Hatching -->
      <path d="M -40 10 Q -90 15 -100 40 Q -80 60 -30 30 Z" fill="#c49a6c" stroke="#2a180b" stroke-width="3"/>
      <!-- Beaver Head & Hat -->
      <circle cx="28" cy="-22" r="22" fill="#deb887" stroke="#2a180b" stroke-width="3"/>
      <polygon points="28,-42 12,-25 44,-25" fill="#2a180b"/>
      <rect x="22" y="-12" width="6" height="10" fill="#ea580c" stroke="#2a180b"/>
      <rect x="28" y="-12" width="6" height="10" fill="#ea580c" stroke="#2a180b"/>
      <!-- Hand holding Smoking Pipe -->
      <line x1="38" y1="-8" x2="65" y2="-12" stroke="#2a180b" stroke-width="3"/>
      <circle cx="68" cy="-15" r="5" fill="#2a180b"/>
      <path d="M 72 -20 Q 80 -40 70 -60" stroke="#2a180b" stroke-width="2" fill="none"/>
    </g>

    <!-- MEDIEVAL MONKS / CITIZENS REVERING THE BEAN/SEED -->
    <g transform="translate(540, 460)">
      <!-- Monk 1 -->
      <path d="M -40 60 L -30 -10 L 0 -10 L 10 60 Z" fill="#2a180b"/>
      <circle cx="-15" cy="-22" r="12" fill="#ebd8b5" stroke="#2a180b" stroke-width="2"/>
      <path d="M -15 -32 C -5 -32 -5 -12 -15 -12" fill="#2a180b"/>
      <!-- Praying Hands Raised to Saucer -->
      <line x1="-5" y1="-5" x2="15" y2="-25" stroke="#2a180b" stroke-width="3"/>
    </g>

    <!-- Large Botanical Cannabis Plant Growing from River -->
    <g transform="translate(100, 420)" stroke="#2a180b" stroke-width="2" fill="#4a7c59">
      <path d="M 0 100 L 0 0"/>
      <path d="M 0 0 C -15 -25 0 -60 0 -80 C 0 -60 15 -25 0 0 Z"/>
      <path d="M 0 20 C -25 0 -50 -20 -60 -40 C -45 -35 -20 -10 0 20 Z"/>
      <path d="M 0 20 C 25 0 50 -20 60 -40 C 45 -35 20 -10 0 20 Z"/>
      <path d="M 0 45 C -30 30 -60 15 -75 -5 C -55 -2 -25 15 0 45 Z"/>
      <path d="M 0 45 C 30 30 60 15 75 -5 C 55 -2 25 15 0 45 Z"/>
    </g>
  </g>

  <!-- BOTTOM MEME CAPTION RIBBON -->
  <g transform="translate(400, 875)">
    <rect x="-330" y="-35" width="660" height="70" rx="8" fill="#2a180b"/>
    <text font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#fef08a" text-anchor="middle" letter-spacing="2" y="10">"HISTORIANS CALL THEM ALLIES. WE CALL THEM PLUG."</text>
  </g>
</svg>
