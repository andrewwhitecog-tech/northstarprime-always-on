<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Modern Technical Blueprint Gradients -->
    <linearGradient id="splitDarkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#070a10"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>

    <!-- Coffee Warm Bronze -->
    <linearGradient id="coffeeBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Quartz Dab Cyan/Amber Glow -->
    <linearGradient id="dabCyanAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <filter id="laserRedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ef4444" flood-opacity="0.9"/>
    </filter>

    <filter id="cardShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Dark Slate Background -->
  <rect width="800" height="1000" fill="url(#splitDarkBg)"/>
  <rect x="25" y="25" width="750" height="950" fill="none" stroke="#334155" stroke-width="2"/>
  <rect x="35" y="35" width="730" height="930" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- HEADER -->
  <g transform="translate(400, 85)" text-anchor="middle">
    <text font-family="'Inter', sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="3">
      PACIFIC NORTHWEST RITUAL CONVERGENCE
    </text>
    <line x1="-280" y1="14" x2="280" y2="14" stroke="#fbbf24" stroke-width="2"/>
    <text font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#94a3b8" letter-spacing="2" y="32">
      COMPARATIVE STUDY: THE ARTISAN V60 vs. THE LOW-TEMP QUARTZ DAB
    </text>
  </g>

  <!-- MAIN SPLIT SCREEN COMPARISON CONTAINER -->
  <g transform="translate(50, 140)">
    <!-- LEFT PANEL: THIRD-WAVE POUR-OVER COFFEE CEREMONY -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="340" height="660" rx="10" fill="#0f172a" stroke="#b45309" stroke-width="2"/>
      
      <!-- Panel Header Bar -->
      <path d="M 0 10 Q 0 0 10 0 L 330 0 Q 340 0 340 10 L 340 50 L 0 50 Z" fill="url(#coffeeBronze)"/>
      <text font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#ffffff" x="170" y="32" text-anchor="middle" letter-spacing="1">
        THE 18-STEP V60 CEREMONY
      </text>

      <!-- V60 Ceramic Dripper & Gooseneck Kettle Illustration -->
      <g transform="translate(170, 190)">
        <!-- Glass Carafe Base / Server -->
        <path d="M -45 100 L -30 20 L 30 20 L 45 100 Z" fill="#38bdf8" fill-opacity="0.15" stroke="#94a3b8" stroke-width="2"/>
        <!-- Dark Brewed Coffee Liquid in Server -->
        <path d="M -40 98 L -35 55 Q 0 50 35 55 L 40 98 Z" fill="#451a03"/>

        <!-- Ceramic V60 Cone on Collar -->
        <polygon points="-55,-25 55,-25 0,25" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
        <line x1="-65" y1="-25" x2="65" y2="-25" stroke="#cbd5e1" stroke-width="4"/> <!-- Cone Rim -->
        <!-- Filter Paper & Ground Coffee Bed -->
        <polygon points="-48,-20 48,-20 0,20" fill="#eed9be"/>
        <polygon points="-42,-15 42,-15 0,15" fill="#29180c"/>

        <!-- Copper Gooseneck Kettle Spout pouring delicate stream -->
        <path d="M 120 -80 C 60 -80 30 -50 0 -22" fill="none" stroke="url(#coffeeBronze)" stroke-width="5" stroke-linecap="round"/>
        <!-- 202°F Water Stream into coffee bed -->
        <line x1="0" y1="-22" x2="0" y2="-5" stroke="#38bdf8" stroke-width="2.5"/>

        <!-- Digital Micro-Scale Platform at base -->
        <rect x="-65" y="105" width="130" height="24" rx="3" fill="#020617" stroke="#334155" stroke-width="1.5"/>
        <text font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#f59e0b" x="0" y="121" text-anchor="middle">
          450.0g • 202.4°F
        </text>
      </g>

      <!-- Step-by-Step Ceremony Specs (Left) -->
      <g font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1" transform="translate(20, 360)">
        <text x="0" y="0"><tspan fill="#f59e0b" font-weight="bold">01.</tspan> Bleached Tabbed Filter Paper Rinse</text>
        <text x="0" y="22"><tspan fill="#f59e0b" font-weight="bold">02.</tspan> 28.5g Ethiopian Yirgacheffe (Washed)</text>
        <text x="0" y="44"><tspan fill="#f59e0b" font-weight="bold">03.</tspan> 800-Micron Burrs (Comandante C40)</text>
        <text x="0" y="66"><tspan fill="#f59e0b" font-weight="bold">04.</tspan> 45-Second Degas Bloom Phase (60g)</text>
        <text x="0" y="88"><tspan fill="#f59e0b" font-weight="bold">05.</tspan> Concentric Clockwise Spiral Pours</text>
        <text x="0" y="110"><tspan fill="#f59e0b" font-weight="bold">06.</tspan> 3:15 Target Drawdown to the Second</text>
        <text x="0" y="132"><tspan fill="#f59e0b" font-weight="bold">07.</tspan> Sensory: Jasmine, Bergamot &amp; Peach</text>
        <text x="0" y="154"><tspan fill="#f59e0b" font-weight="bold">08.</tspan> Equipment Total: $740.00</text>
      </g>
    </g>

    <!-- CENTER DIVIDING LINE & OR LOGO -->
    <g transform="translate(350, 0)">
      <line x1="0" y1="0" x2="0" y2="660" stroke="#334155" stroke-width="2" stroke-dasharray="8,8"/>
      <circle cx="0" cy="330" r="24" fill="#020617" stroke="#fbbf24" stroke-width="2"/>
      <text font-family="'Cinzel', serif" font-size="11" font-weight="900" fill="#fbbf24" x="0" y="334" text-anchor="middle">VS</text>
    </g>

    <!-- RIGHT PANEL: LOW-TEMP SOLVENTLESS DAB CEREMONY -->
    <g transform="translate(360, 0)">
      <rect x="0" y="0" width="340" height="660" rx="10" fill="#0f172a" stroke="#00f0ff" stroke-width="2"/>
      
      <!-- Panel Header Bar -->
      <path d="M 0 10 Q 0 0 10 0 L 330 0 Q 340 0 340 10 L 340 50 L 0 50 Z" fill="#0369a1"/>
      <text font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#ffffff" x="170" y="32" text-anchor="middle" letter-spacing="1">
        THE 18-STEP QUARTZ CEREMONY
      </text>

      <!-- Recycler Rig, Quartz Banger & Laser Temp Gun -->
      <g transform="translate(170, 190)">
        <!-- Scientific Borosilicate Recycler Rig -->
        <ellipse cx="0" cy="95" rx="35" ry="10" fill="#00f0ff" fill-opacity="0.2" stroke="#64748b" stroke-width="2"/>
        <path d="M -25 95 L -15 30 L 15 30 L 25 95 Z" fill="#38bdf8" fill-opacity="0.15" stroke="#94a3b8" stroke-width="1.5"/>
        <path d="M 0 30 Q -10 -20 20 -45" fill="none" stroke="#bae6fd" stroke-width="4"/> <!-- Bent Neck -->

        <!-- Quartz Blender Banger Joint -->
        <path d="M 15 50 L 45 50 L 45 10" fill="none" stroke="#94a3b8" stroke-width="3"/>
        <!-- Quartz Bucket with Terp Pearl -->
        <rect x="36" y="-20" width="18" height="30" rx="2" fill="#fef08a" fill-opacity="0.3" stroke="#fbbf24" stroke-width="2"/>
        <circle cx="45" cy="-5" r="4" fill="#f97316"/> <!-- Ruby Terp Pearl -->

        <!-- Directional Carb Cap with Vortex Seal -->
        <path d="M 33 -20 L 57 -20 L 45 -35 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>

        <!-- Laser Temp Gun Sight Beam -->
        <line x1="-70" y1="-60" x2="45" y2="-5" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" filter="url(#laserRedGlow)"/>
        <circle cx="45" cy="-5" r="3" fill="#ef4444" filter="url(#laserRedGlow)"/>

        <!-- Digital Infrared Temp Readout Box -->
        <rect x="-65" y="105" width="130" height="24" rx="3" fill="#020617" stroke="#334155" stroke-width="1.5"/>
        <text font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#00f0ff" x="0" y="121" text-anchor="middle">
          0.12g • 480.2°F
        </text>
      </g>

      <!-- Step-by-Step Ceremony Specs (Right) -->
      <g font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1" transform="translate(20, 360)">
        <text x="0" y="0"><tspan fill="#00f0ff" font-weight="bold">01.</tspan> Clean Borosilicate Water Refresh (Snowmelt)</text>
        <text x="0" y="22"><tspan fill="#00f0ff" font-weight="bold">02.</tspan> 0.12g Void Kush Single-Source Cold Cure</text>
        <text x="0" y="44"><tspan fill="#00f0ff" font-weight="bold">03.</tspan> 73u-120u First-Press Solventless Live Rosin</text>
        <text x="0" y="66"><tspan fill="#00f0ff" font-weight="bold">04.</tspan> 45-Second Cool Down from Torch Glow</text>
        <text x="0" y="88"><tspan fill="#00f0ff" font-weight="bold">05.</tspan> Terpometer Optical Laser Confirmation (480°F)</text>
        <text x="0" y="110"><tspan fill="#00f0ff" font-weight="bold">06.</tspan> Directional Marble Vortex Pearl Spin</text>
        <text x="0" y="132"><tspan fill="#00f0ff" font-weight="bold">07.</tspan> Dual Cotton Swab with 99% Anhydrous ISO</text>
        <text x="0" y="154"><tspan fill="#00f0ff" font-weight="bold">08.</tspan> Equipment Total: $820.00</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM PUNCHLINE MEME BANNER -->
  <g transform="translate(400, 840)" text-anchor="middle">
    <rect x="-355" y="-22" width="710" height="78" fill="#0f172a" stroke="#fbbf24" stroke-width="2" rx="8" filter="url(#cardShadow)"/>
    <text font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#ffffff" letter-spacing="1" y="8">
      "PACIFIC NORTHWEST RITUAL CONVERGENCE: BOTH TAKE 20 MINUTES,"
    </text>
    <text font-family="'Inter', sans-serif" font-weight="900" font-size="15.5" fill="#fbbf24" letter-spacing="1" y="34">
      BOTH REQUIRE $800 IN SCIENTIFIC GLASS, BOTH COMPLAIN ABOUT CITRUS NOTES
    </text>
  </g>

  <!-- SUBFOOTER METRICS & CREDENTIALS -->
  <g transform="translate(400, 935)" text-anchor="middle">
    <text font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#94a3b8" letter-spacing="2">
      TIGARD CONNOISSEUR DIVISION • CDC DISPENSARY • 10015 SW HALL BLVD
    </text>
    <text font-family="'Inter', sans-serif" font-size="10" fill="#64748b" y="18">
      Dedicated to Precision Temperature Control, Artisanal Extraction &amp; Oregon Culture
    </text>
  </g>
</svg>
