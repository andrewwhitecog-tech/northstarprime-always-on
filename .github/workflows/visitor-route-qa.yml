name: NorthStar visitor route checks
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d610a653b5bb18facb541466dae4dbf902da59f5
          sparse-checkout: |
            music
            realm
            .github/hq_audio_review
            static/games
            store
            play
            links
            merch
            chromatic
            stickerforge
            parody-drop
            community
            idc-programming
            tools
            tests
            static/front
            static/cards
            warband/art
          persist-credentials: false
      - run: python -m pip -q install playwright beautifulsoup4 pillow pytest requests

      - name: Browser verification
        shell: python
        run: |
          from playwright.sync_api import sync_playwright
          from urllib.parse import urlsplit
          import requests
          with sync_playwright() as p:
              b=p.chromium.launch(executable_path='/usr/bin/google-chrome',args=['--disable-gpu'])
              for w in [390,1280]:
                  page=b.new_page(viewport={'width':w,'height':840})
                  page.goto('https://northstarprime.net/services/',wait_until='domcontentloaded')
                  page.wait_for_url('**/hire/**',timeout=15000)
                  a=page.locator('a[href^="https://andywhiteconstruction.com"]').first
                  assert a.is_visible()
                  dest=a.get_attribute('href')
                  target=b.new_page(viewport={'width':w,'height':840})
                  r=target.goto(dest,wait_until='domcontentloaded',timeout=30000)
                  assert r.status==200 and 'Andy White Construction' in target.title()
                  contact=target.locator('a[href^="tel:"],a[href^="mailto:"],a[href*="contact" i]').evaluate_all("xs=>xs.filter(a=>a.checkVisibility()).map(a=>[a.textContent.trim().slice(0,55),new URL(a.href).protocol])")
                  print('SERVICE',w,r.status,target.title(),contact[:5],flush=True)
                  assert contact
                  target.close();page.close()
              page=b.new_page()
              for url in ['https://www.andywhiteconstruction.com/','https://www.etsy.com/shop/UncleVorath420']:
                  try:
                      r=page.goto(url,wait_until='domcontentloaded',timeout=25000)
                      print('EXTERNAL',url,r.status,page.url,page.title(),flush=True)
                  except Exception as e:print('EXTERNAL',url,type(e).__name__,str(e)[:120],flush=True)
              b.close()
