name: TMP IDG stall hunt (PR 206, delete branch after)

# Throwaway branch only. Profiles the long frames in Vorath Souls, Prism Runner
# 2049 and Chrono Blade 2049 (PR 206 head vs main) with the V8 sampling
# profiler in a muted headless Chromium. Nothing here deploys.
on:
  push:
    branches: [claude/tmp-idg-stall-20261109]

permissions:
  contents: read

jobs:
  stall:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: tool, show-progress: false, sparse-checkout: tmp_capture }
      - uses: actions/checkout@v4
        with:
          ref: 522eb3c5944a334631b2678debe1613dabb9ecb4
          path: pr
          show-progress: false
          sparse-checkout: |
            arcade/custom/precinct-404
            arcade/custom/dharma-invaders
            static/games
            static/art/games
      - uses: actions/checkout@v4
        with:
          ref: f9888033f6815b5526af5b8359ac53542cfe48fc
          path: main
          show-progress: false
          sparse-checkout: |
            arcade/custom/precinct-404
            arcade/custom/dharma-invaders
            static/games
            static/art/games
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Playwright Chromium
        run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Serve PR head (8766) and main (8765)
        run: |
          nohup python tool/tmp_capture/serve.py 8766 pr >/dev/null 2>&1 &
          nohup python tool/tmp_capture/serve.py 8765 main >/dev/null 2>&1 &
          sleep 3
      - name: Profile PR head 522eb3c5 (twice) and main, Precinct 404 and Commentary Siege
        continue-on-error: true
        run: |
          for r in 1 2; do python tool/tmp_capture/profile_stall.py --base http://127.0.0.1:8766 --slugs precinct-404,dharma-invaders --out out/pr_$r; done
          python tool/tmp_capture/profile_stall.py --base http://127.0.0.1:8765 --slugs precinct-404,dharma-invaders --out out/main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idg-stall
          path: out
          retention-days: 5
