<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Heavy Chrome & Gold Shield Gradients -->
    <linearGradient id="detectiveGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <radialGradient id="trichomeGalaxy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#a855f7"/>
      <stop offset="85%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#fbbf24" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#03050c"/>

  <!-- DIE CUT 7-POINT DETECTIVE STAR BADGE -->
  <g transform="translate(400, 400)" filter="url(#badgeShadow)">
    
    <!-- White Die-Cut Vinyl Bleed Outline -->
    <!-- 7-Point Star Geometry: R_outer = 375, R_inner = 280 -->
    <polygon points="
      0,-375 75,-270 205,-315 210,-185 338,-160 270,-45 365,45 250,110 290,240 160,230 110,355 0,275 -110,355 -160,230 -290,240 -250,110 -365,45 -270,-45 -338,-160 -210,-185 -205,-315 -75,-270
    " fill="#ffffff"/>

    <!-- Gold Foil Shield Base -->
    <polygon points="
      0,-362 72,-260 198,-304 203,-178 326,-154 260,-43 352,43 241,106 280,231 154,222 106,342 0,265 -106,342 -154,222 -280,231 -241,106 -352,43 -260,-43 -326,-154 -203,-178 -198,-304 -72,-260
    " fill="url(#detectiveGold)" stroke="#451a03" stroke-width="4"/>

    <!-- Inner Sunken Dark Blue Steel Medallion -->
    <circle cx="0" cy="0" r="235" fill="#090d16" stroke="url(#detectiveGold)" stroke-width="5"/>
    <circle cx="0" cy="0" r="225" fill="#030712" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,6"/>

    <!-- Magnifying Glass Examining Trichome Galaxy -->
    <g transform="translate(0, -10)">
      
      <!-- Brass Magnifying Lens Bezel & Handle -->
      <g transform="rotate(-35)">
        <line x1="0" y1="120" x2="0" y2="210" stroke="url(#detectiveGold)" stroke-width="14" stroke-linecap="round"/>
        <line x1="0" y1="130" x2="0" y2="200" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="110" fill="none" stroke="url(#detectiveGold)" stroke-width="8"/>
      </g>

      <!-- Lens Interior (The Trichome Head under High Magnification) -->
      <circle cx="0" cy="0" r="102" fill="url(#trichomeGalaxy)"/>
      
      <!-- Glandular Trichome Head & Stalk Silhouette -->
      <path d="M -15 90 L -10 30 C -25 25 -35 5 -35 -15 C -35 -45 0 -65 0 -65 C 0 -65 35 -45 35 -15 C 35 5 25 25 10 30 L 15 90 Z" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="2"/>
      
      <!-- Glandular Head (Amber Gold Core with Galaxy Stars) -->
      <circle cx="0" cy="-15" r="42" fill="#fbbf24" fill-opacity="0.4" stroke="#fef08a" stroke-width="1.5"/>
      <circle cx="0" cy="-15" r="15" fill="#ffffff"/>
      
      <!-- Constellation Stars inside trichome head -->
      <polygon points="0,-35 2,-25 8,-23 2,-21 0,-15 -2,-21 -8,-23 -2,-25" fill="#ffffff"/>
      <polygon points="-20,-10 -18,-5 -12,-4 -18,-3 -20,2 -22,-3 -28,-4 -22,-5" fill="#ffffff"/>
      <polygon points="20,-5 22,0 28,1 22,2 20,7 18,2 12,1 18,0" fill="#ffffff"/>

      <!-- Magnifying Glass Reflection Streak -->
      <path d="M -65 -60 A 90 90 0 0 1 60 -65" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- BANNER OVERLAY: "BUREAU OF ANOMALOUS BOTANY" -->
    <g transform="translate(0, 150)">
      <path d="M -180 -15 L 180 -15 L 195 18 L -195 18 Z" fill="#030712" stroke="url(#detectiveGold)" stroke-width="2.5"/>
      <text font-family="'Cinzel', serif" font-weight="900" font-size="11" fill="url(#detectiveGold)" letter-spacing="3" text-anchor="middle" y="7">BUREAU OF ANOMALOUS BOTANY</text>
    </g>

    <!-- ARCHED TITLES ON BADGE BEZEL -->
    <path id="badgeArcTop" d="M -190 -70 A 200 200 0 0 1 190 -70" fill="none"/>
    <text font-family="'Impact', 'Arial Black', sans-serif" font-size="21" fill="url(#detectiveGold)" letter-spacing="4" text-anchor="middle">
      <textPath href="#badgeArcTop" startOffset="50%">UNCLE VORATH MYSTERIES</textPath>
    </text>

    <!-- Case Number Badge -->
    <rect x="-70" y="-170" width="140" height="26" rx="4" fill="#030712" stroke="url(#detectiveGold)" stroke-width="1.5"/>
    <text x="0" y="-152" font-family="'Courier New', monospace" font-weight="900" font-size="11" fill="#fef08a" text-anchor="middle">CASE NO: 10015-SW</text>

    <text x="0" y="215" font-family="'Courier New', monospace" font-weight="900" font-size="10" fill="#38bdf8" letter-spacing="2" text-anchor="middle">SPECIAL INVESTIGATOR • TIGARD OR</text>
  </g>
</svg>
