<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Alchemical Gold & Glass Gradients -->
    <linearGradient id="amberElixir" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="brassAlembic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <filter id="flaskGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#030712"/>

  <!-- DIE CUT MEDALLION -->
  <g transform="translate(400, 400)" filter="url(#flaskGlow)">
    <circle cx="0" cy="0" r="375" fill="#ffffff"/>
    <circle cx="0" cy="0" r="365" fill="#0b0f19" stroke="url(#brassAlembic)" stroke-width="7"/>
    <circle cx="0" cy="0" r="350" fill="#030712" stroke="#1e293b" stroke-width="2"/>

    <!-- Sacred Geometry Astrological / Alchemical Ring -->
    <circle cx="0" cy="0" r="335" fill="none" stroke="url(#brassAlembic)" stroke-width="1.5" stroke-dasharray="4,8"/>
    <circle cx="0" cy="0" r="260" fill="none" stroke="#334155" stroke-width="1.5"/>

    <!-- THE ALCHEMICAL FRACTIONATION RETORT & CONDENSER COIL -->
    <g transform="translate(0, 10)">
      
      <!-- Brass Tripod Burner Stand -->
      <path d="M -85 180 L -45 100 L 45 100 L 85 180" fill="none" stroke="url(#brassAlembic)" stroke-width="5" stroke-linecap="round"/>
      <line x1="-55" y1="140" x2="55" y2="140" stroke="url(#brassAlembic)" stroke-width="3.5"/>

      <!-- Sacred Alchemical Blue/Violet Flame beneath flask -->
      <g transform="translate(0, 115)">
        <path d="M -15 0 C -20 -25 0 -45 0 -55 C 0 -45 20 -25 15 0 Z" fill="#38bdf8" opacity="0.9"/>
        <path d="M -8 0 C -12 -18 0 -32 0 -40 C 0 -32 12 -18 8 0 Z" fill="#ffffff"/>
      </g>

      <!-- Spherical Boiling Flask (Round-Bottom Borosilicate) -->
      <circle cx="0" cy="25" r="95" fill="#0f172a" stroke="url(#brassAlembic)" stroke-width="4"/>
      <!-- Amber Boiling Terpenes inside flask -->
      <path d="M -90 40 C -85 110 85 110 90 40 Q 0 50 -90 40 Z" fill="url(#amberElixir)" stroke="#fef08a" stroke-width="1.5"/>
      <!-- Boiling Bubbles -->
      <circle cx="-35" cy="65" r="7" fill="#fef08a" opacity="0.8"/>
      <circle cx="20" cy="75" r="9" fill="#fef08a" opacity="0.8"/>
      <circle cx="45" cy="55" r="6" fill="#fef08a" opacity="0.8"/>
      <circle cx="-10" cy="80" r="5" fill="#fef08a" opacity="0.8"/>

      <!-- Vertical Neck & Distillation Column -->
      <rect x="-18" y="-120" width="36" height="60" fill="#0f172a" stroke="url(#brassAlembic)" stroke-width="3"/>
      <!-- Measurement Graduations -->
      <line x1="8" y1="-100" x2="18" y2="-100" stroke="#fef08a" stroke-width="2"/>
      <line x1="8" y1="-85" x2="18" y2="-85" stroke="#fef08a" stroke-width="2"/>
      <line x1="8" y1="-70" x2="18" y2="-70" stroke="#fef08a" stroke-width="2"/>

      <!-- Distillation Head & Angled Vapor Condenser Arm -->
      <path d="M 0 -120 L 0 -145 Q 0 -165 25 -165 L 110 -130 Q 130 -120 130 -95 L 130 -30" fill="none" stroke="url(#brassAlembic)" stroke-width="8" stroke-linecap="round"/>
      
      <!-- Condenser Glass Jacket & Spiral Coil -->
      <rect x="115" y="-100" width="30" height="90" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#38bdf8" stroke-width="2"/>
      <!-- Spiral Vapor Coil inside jacket -->
      <path d="M 120 -80 Q 140 -70 120 -60 Q 140 -50 120 -40 Q 140 -30 120 -20" fill="none" stroke="#fef08a" stroke-width="3"/>

      <!-- Dripping Terpene Rosin Tear Drop from Condenser Spigot -->
      <g transform="translate(130, 0)">
        <path d="M 0 0 C -6 8 -10 18 0 28 C 10 18 6 8 0 0 Z" fill="url(#amberElixir)" stroke="#fef08a" stroke-width="1.5"/>
        <circle cx="-2" cy="18" r="2.5" fill="#ffffff"/>
      </g>

      <!-- Receiving Apothecary Beaker receiving the pure fraction -->
      <g transform="translate(130, 75)">
        <polygon points="-25,-25 25,-25 20,40 -20,40" fill="#0f172a" stroke="url(#brassAlembic)" stroke-width="2.5"/>
        <polygon points="-22,10 22,10 18,38 -18,38" fill="url(#amberElixir)"/>
      </g>

      <!-- Glass Specular Reflection Arcs -->
      <path d="M -70 -10 A 85 85 0 0 1 -15 -50" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      <path d="M -80 15 A 85 85 0 0 0 -50 70" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    </g>

    <!-- ALCHEMICAL FOUR ELEMENTS SYMBOLS IN CORNERS -->
    <g stroke="url(#brassAlembic)" stroke-width="2" fill="none">
      <!-- Fire (Triangle) -->
      <polygon points="-190,-160 -170,-195 -150,-160" transform="translate(0, 0)"/>
      <!-- Water (Inverted Triangle) -->
      <polygon points="-190,195 -170,160 -150,195" transform="translate(0, 0)"/>
      <!-- Air (Triangle with Bar) -->
      <g transform="translate(340, 0)">
        <polygon points="-190,-160 -170,-195 -150,-160"/>
        <line x1="-185" y1="-172" x2="-155" y2="-172"/>
      </g>
      <!-- Earth (Inverted Triangle with Bar) -->
      <g transform="translate(340, 0)">
        <polygon points="-190,195 -170,160 -150,195"/>
        <line x1="-185" y1="183" x2="-155" y2="183"/>
      </g>
    </g>

    <!-- ARCS & TYPOGRAPHY -->
    <path id="flaskArcTop" d="M -260 0 A 260 260 0 1 1 260 0" fill="none"/>
    <text font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="22" fill="url(#brassAlembic)" letter-spacing="5" text-anchor="middle">
      <textPath href="#flaskArcTop" startOffset="50%">SOLVENTLESS APOTHECARY</textPath>
    </text>

    <path id="flaskArcBottom" d="M 260 0 A 260 260 0 0 1 -260 0" fill="none"/>
    <text font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#fbbf24" letter-spacing="4" text-anchor="middle">
      <textPath href="#flaskArcBottom" startOffset="50%">TERPENE FRACTIONATION • 10015 SW HALL</textPath>
    </text>
  </g>
</svg>
