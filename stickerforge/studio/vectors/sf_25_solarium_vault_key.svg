<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="vaultNavy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="antiqueGoldKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="75%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="keyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#010307"/>

  <!-- DIE-CUT ORNATE SHIELD BADGE -->
  <g transform="translate(400, 400)" filter="url(#keyGlow)">
    <!-- White Die-Cut Crest Contour -->
    <path d="M 0 -370 C 220 -370 360 -240 360 -80 C 360 160 200 290 0 370 C -200 290 -360 160 -360 -80 C -360 -240 -220 -370 0 -370 Z" fill="#ffffff"/>
    <path d="M 0 -360 C 210 -360 348 -232 348 -80 C 348 152 192 280 0 358 C -192 280 -348 152 -348 -80 C -348 -232 -210 -360 0 -360 Z" fill="none" stroke="url(#antiqueGoldKey)" stroke-width="5"/>
    <path d="M 0 -346 C 200 -346 332 -224 332 -80 C 332 144 184 268 0 344 C -184 268 -332 144 -332 -80 C -332 -224 -200 -346 0 -346 Z" fill="url(#vaultNavy)" stroke="#334155" stroke-width="2"/>

    <!-- Concentric Heraldic Compass Rose in Background -->
    <g opacity="0.3" stroke="url(#antiqueGoldKey)" stroke-width="1.5" fill="none">
      <circle cx="0" cy="0" r="240"/>
      <circle cx="0" cy="0" r="220" stroke-dasharray="6,6"/>
      <path d="M 0 -240 L 0 240 M -240 0 L 240 0"/>
      <path d="M -170 -170 L 170 170 M -170 170 L 170 -170" stroke-dasharray="4,4"/>
    </g>

    <!-- Master Vault Alchemical Skeleton Key (Centerpiece) -->
    <g transform="rotate(-30)">
      <!-- Key Bow (Ornate Merkaba / Trefoil Head) -->
      <g transform="translate(0, -130)">
        <circle cx="0" cy="0" r="55" fill="none" stroke="url(#antiqueGoldKey)" stroke-width="8"/>
        <!-- Inner Interlocking Circles -->
        <circle cx="-16" cy="-10" r="25" fill="none" stroke="url(#antiqueGoldKey)" stroke-width="4"/>
        <circle cx="16" cy="-10" r="25" fill="none" stroke="url(#antiqueGoldKey)" stroke-width="4"/>
        <circle cx="0" cy="20" r="25" fill="none" stroke="url(#antiqueGoldKey)" stroke-width="4"/>
        <!-- Central Starlight Diamond -->
        <polygon points="0,-12 8,0 0,12 -8,0" fill="#ffffff"/>
      </g>

      <!-- Key Collar & Fluted Stem -->
      <!-- Collar Ring -->
      <rect x="-18" y="-75" width="36" height="12" rx="4" fill="url(#antiqueGoldKey)"/>
      <!-- Main Fluted Shaft -->
      <rect x="-9" y="-63" width="18" height="240" fill="url(#antiqueGoldKey)" stroke="#451a03" stroke-width="1"/>
      <line x1="0" y1="-63" x2="0" y2="177" stroke="#ffffff" stroke-width="2" opacity="0.7"/>

      <!-- Key Terminal Finial -->
      <circle cx="0" cy="182" r="10" fill="url(#antiqueGoldKey)"/>

      <!-- Key Bit (Precision Cut 7-Point Cannabis Leaf Ward) -->
      <g transform="translate(9, 110)">
        <!-- Master Bit Plate -->
        <rect x="0" y="0" width="55" height="50" fill="url(#antiqueGoldKey)" stroke="#451a03" stroke-width="1.5"/>
        <!-- Cut Wards forming 7-pointed serrations -->
        <rect x="15" y="10" width="12" height="20" fill="#020617"/>
        <rect x="35" y="25" width="12" height="25" fill="#020617"/>
        <polygon points="55,0 45,15 55,25 45,35 55,50" fill="#020617"/>
      </g>
    </g>

    <!-- Heraldic Laurels & Ribbon -->
    <text x="0" y="-260" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="bold" fill="url(#antiqueGoldKey)" text-anchor="middle" letter-spacing="5">THE SOLARIUM VAULT KEY</text>
    <text x="0" y="-238" font-family="'Cinzel', Georgia, serif" font-size="10" font-style="italic" fill="#94a3b8" text-anchor="middle" letter-spacing="3">"Veritas per Herbam • Lux in Tenebris"</text>

    <!-- Bottom Badging -->
    <text x="0" y="240" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">10015 SW HALL BLVD</text>
    <text x="0" y="265" font-family="'Montserrat', sans-serif" font-size="10" font-weight="bold" fill="url(#antiqueGoldKey)" text-anchor="middle" letter-spacing="5">MASTER VAULT ACCESS • TIGARD OR</text>
  </g>
</svg>