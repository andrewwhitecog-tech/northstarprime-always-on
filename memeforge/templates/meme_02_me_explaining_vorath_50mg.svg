<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Corkboard Texture -->
    <radialGradient id="corkBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#b47846"/>
      <stop offset="70%" stop-color="#8c582f"/>
      <stop offset="100%" stop-color="#5a371c"/>
    </radialGradient>
    <filter id="pinShadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="#120c06"/>
  <!-- Cork Bulletin Board -->
  <rect x="25" y="25" width="750" height="950" rx="14" fill="url(#corkBg)" stroke="#3e2311" stroke-width="12"/>

  <!-- TOP MEME HEADER -->
  <g transform="translate(400, 85)">
    <rect x="-355" y="-35" width="710" height="70" rx="8" fill="#000000" fill-opacity="0.9" stroke="#ef4444" stroke-width="2"/>
    <text font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="25" fill="#ffffff" text-anchor="middle" letter-spacing="1" y="9">ME EXPLAINING THE VORATH NETWORK AFTER A 50mg GUMMY</text>
  </g>

  <!-- CONSPIRACY POLAROIDS & NOTEPADS PINNED TO BOARD -->
  
  <!-- Note 1: 10015 SW Hall Blvd (Center Hub) -->
  <g transform="translate(400, 380)" filter="url(#pinShadow)">
    <rect x="-130" y="-80" width="260" height="160" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" transform="rotate(-3)"/>
    <circle cx="0" cy="-65" r="8" fill="#ef4444"/> <!-- Red Pushpin -->
    <text font-family="'Courier New', monospace" font-weight="900" font-size="16" fill="#1e293b" text-anchor="middle" y="-25" transform="rotate(-3)">THE TWILIGHT SOLARIUM</text>
    <text font-family="'Courier New', monospace" font-weight="700" font-size="13" fill="#b91c1c" text-anchor="middle" y="0" transform="rotate(-3)">10015 SW HALL BLVD</text>
    <text font-family="'Courier New', monospace" font-size="11" fill="#334155" text-anchor="middle" y="25" transform="rotate(-3)">TIGARD, OREGON</text>
    <text font-family="'Courier New', monospace" font-weight="800" font-size="10" fill="#059669" text-anchor="middle" y="48" transform="rotate(-3)">PORTAL NEXUS CONFIRMED!</text>
  </g>

  <!-- Note 2: Blazin' Beaver (Top Left) -->
  <g transform="translate(180, 220)" filter="url(#pinShadow)">
    <rect x="-110" y="-70" width="220" height="140" fill="#ffffff" stroke="#94a3b8" stroke-width="1" transform="rotate(4)"/>
    <circle cx="0" cy="-55" r="8" fill="#ef4444"/>
    <rect x="-95" y="-45" width="190" height="70" fill="#78350f" opacity="0.8" transform="rotate(4)"/>
    <text font-family="'Impact', sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" y="-5" transform="rotate(4)">CASTOR "BLAZE" FIBER</text>
    <text font-family="'Courier New', monospace" font-size="10" fill="#000000" text-anchor="middle" y="40" transform="rotate(4)">Hydraulic Dam = Dab Rig??</text>
    <text font-family="'Courier New', monospace" font-weight="800" font-size="9" fill="#ef4444" text-anchor="middle" y="55" transform="rotate(4)">WHO SIGNS HIS PAYCHECKS??</text>
  </g>

  <!-- Note 3: Vorath Grey Alien (Top Right) -->
  <g transform="translate(620, 220)" filter="url(#pinShadow)">
    <rect x="-110" y="-75" width="220" height="150" fill="#ffffff" stroke="#94a3b8" stroke-width="1" transform="rotate(-5)"/>
    <circle cx="0" cy="-60" r="8" fill="#ef4444"/>
    <rect x="-95" y="-50" width="190" height="75" fill="#1e1b4b" transform="rotate(-5)"/>
    <text font-family="'Impact', sans-serif" font-size="15" fill="#38bdf8" text-anchor="middle" y="-5" transform="rotate(-5)">EMISSARY VORATH-77</text>
    <text font-family="'Courier New', monospace" font-size="10" fill="#000000" text-anchor="middle" y="45" transform="rotate(-5)">Cosmic Seed Vault Courier</text>
    <text font-family="'Courier New', monospace" font-weight="800" font-size="9" fill="#8b5cf6" text-anchor="middle" y="60" transform="rotate(-5)">TELEPATHIC TERPENE BRIDGE</text>
  </g>

  <!-- Note 4: Boiling Points / Chemical Proof (Bottom Left) -->
  <g transform="translate(180, 580)" filter="url(#pinShadow)">
    <rect x="-120" y="-85" width="240" height="170" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" transform="rotate(-2)"/>
    <circle cx="0" cy="-70" r="8" fill="#ef4444"/>
    <text font-family="'Courier New', monospace" font-weight="900" font-size="14" fill="#0f172a" text-anchor="middle" y="-45" transform="rotate(-2)">TERPENE BOILING POINTS</text>
    <text font-family="'Courier New', monospace" font-size="11" fill="#047857" text-anchor="start" x="-105" y="-20" transform="rotate(-2)">• Myrcene: 334°F (Sleep)</text>
    <text font-family="'Courier New', monospace" font-size="11" fill="#b45309" text-anchor="start" x="-105" y="5" transform="rotate(-2)">• Limonene: 349°F (Euphoria)</text>
    <text font-family="'Courier New', monospace" font-size="11" fill="#7c3aed" text-anchor="start" x="-105" y="30" transform="rotate(-2)">• Linalool: 388°F (Chakras)</text>
    <text font-family="'Courier New', monospace" font-weight="900" font-size="12" fill="#ef4444" text-anchor="start" x="-105" y="60" transform="rotate(-2)">→ 420°F = WORMHOLE OPENS!!</text>
  </g>

  <!-- Note 5: Metrc RFID RFID Tracking (Bottom Right) -->
  <g transform="translate(620, 580)" filter="url(#pinShadow)">
    <rect x="-120" y="-80" width="240" height="160" fill="#fef9c3" stroke="#eab308" stroke-width="1" transform="rotate(3)"/>
    <circle cx="0" cy="-65" r="8" fill="#ef4444"/>
    <text font-family="'Courier New', monospace" font-weight="900" font-size="13" fill="#18181b" text-anchor="middle" y="-35" transform="rotate(3)">METRC UID TRACKING</text>
    <text font-family="'Courier New', monospace" font-size="9.5" fill="#334155" text-anchor="middle" y="-10" transform="rotate(3)">1A40103000021A7000049182</text>
    <text font-family="'Courier New', monospace" font-size="11" fill="#b91c1c" text-anchor="middle" y="20" transform="rotate(3)">IS THE STATE TRACKING</text>
    <text font-family="'Courier New', monospace" font-size="11" fill="#b91c1c" text-anchor="middle" y="38" transform="rotate(3)">GALACTIC SEED SHIPMENTS?!</text>
    <text font-family="'Courier New', monospace" font-weight="800" font-size="10" fill="#0284c7" text-anchor="middle" y="60" transform="rotate(3)">YES. 100% CORROBORATED.</text>
  </g>

  <!-- RED YARN CONSPIRACY STRINGS CONNECTING PINS -->
  <g stroke="#ef4444" stroke-width="3" opacity="0.85" filter="url(#pinShadow)">
    <!-- Beaver -> Solarium -->
    <line x1="180" y1="165" x2="400" y2="315"/>
    <!-- Vorath -> Solarium -->
    <line x1="620" y1="160" x2="400" y2="315"/>
    <!-- Solarium -> Boiling Points -->
    <line x1="400" y1="445" x2="180" y2="510"/>
    <!-- Solarium -> Metrc UID -->
    <line x1="400" y1="445" x2="620" y2="515"/>
    <!-- Beaver -> Vorath direct string -->
    <line x1="180" y1="165" x2="620" y2="160" stroke-dasharray="8,4"/>
    <!-- Boiling Points -> Metrc string -->
    <line x1="180" y1="510" x2="620" y2="515" stroke-dasharray="6,4"/>
  </g>

  <!-- FRANTIC SILHOUETTE (Pepe Silvia / Charlie Day Pose) IN FOREGROUND -->
  <g transform="translate(400, 780)">
    <!-- Wild Hair & Head -->
    <circle cx="0" cy="-60" r="35" fill="#000000"/>
    <path d="M -30 -85 L -50 -115 L -20 -95 L 0 -125 L 20 -95 L 50 -115 L 30 -85 Z" fill="#000000"/>
    <!-- Wide Crazy Glowing White Eyes -->
    <circle cx="-12" cy="-62" r="8" fill="#ffffff"/>
    <circle cx="-10" cy="-62" r="3" fill="#ef4444"/>
    <circle cx="12" cy="-62" r="8" fill="#ffffff"/>
    <circle cx="14" cy="-62" r="3" fill="#ef4444"/>

    <!-- Open Screaming Mouth -->
    <ellipse cx="0" cy="-42" rx="10" ry="12" fill="#ffffff"/>
    <ellipse cx="0" cy="-42" rx="7" ry="9" fill="#000000"/>

    <!-- Cigarette / Joint hanging from hand -->
    <line x1="45" y1="-30" x2="85" y2="-50" stroke="#ffffff" stroke-width="4"/>
    <circle cx="85" cy="-50" r="4" fill="#f97316"/>

    <!-- Frantic Arms pointing to the board -->
    <path d="M -20 -20 L -120 -80 L -180 -140" stroke="#000000" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M 20 -20 L 120 -60 L 190 -120" stroke="#000000" stroke-width="18" stroke-linecap="round" fill="none"/>

    <!-- Disheveled Tie & Shirt -->
    <polygon points="-50,0 50,0 70,160 -70,160" fill="#000000"/>
    <polygon points="0,15 -15,100 0,140 15,100" fill="#ef4444"/>
  </g>

  <!-- BOTTOM FOOTER PUNCHLINE -->
  <g transform="translate(400, 935)">
    <rect x="-355" y="-20" width="710" height="42" rx="6" fill="#000000"/>
    <text font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="22" fill="#fbbf24" text-anchor="middle" y="10">"THERE IS NO CAROL IN HR! THERE IS ONLY BLAZIN' BEAVER!"</text>
  </g>
</svg>
