<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Alpine Dawn & Solarium Glass Gradients -->
    <radialGradient id="solariumDawn" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#fdba74"/>
      <stop offset="55%" stop-color="#f472b6"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0c2340"/>
    </radialGradient>

    <linearGradient id="glacierSnow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="80%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <linearGradient id="cedarArch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a582c"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="dawnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#fbbf24" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#040a12"/>

  <!-- DIE-CUT BADGE CONTAINER -->
  <g transform="translate(400, 400)" filter="url(#dawnGlow)">
    <!-- White Die-Cut Bleed Border -->
    <circle cx="0" cy="0" r="375" fill="#ffffff"/>
    <circle cx="0" cy="0" r="365" fill="none" stroke="url(#goldRim)" stroke-width="6"/>
    <circle cx="0" cy="0" r="352" fill="url(#solariumDawn)" stroke="#0c2340" stroke-width="3"/>

    <!-- Rising Dawn Solarium Sun behind Peak -->
    <circle cx="0" cy="-40" r="85" fill="#ffffff" opacity="0.95"/>
    <circle cx="0" cy="-40" r="105" fill="none" stroke="#fef08a" stroke-width="3" opacity="0.7"/>
    <circle cx="0" cy="-40" r="130" fill="none" stroke="#fdba74" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.5"/>

    <!-- MOUNT HOOD (WY'EAST) GEOMETRIC PEAK SILHOUETTE -->
    <!-- Alpine Mountain Facets (Shadow & Light) -->
    <!-- Far Ridge Base -->
    <polygon points="-280,140 -120,40 0,-110 120,40 280,140 280,240 -280,240" fill="#0f172a"/>

    <!-- Right Shadow Facets (Deep Navy) -->
    <polygon points="0,-110 30,-30 120,40 240,140 0,140" fill="#1e293b"/>
    <polygon points="0,-110 15,-40 60,10 120,40" fill="#334155"/>

    <!-- Left Sunlit Facets (Glacier Snow & Alpenglow) -->
    <polygon points="0,-110 -30,-30 -120,40 -240,140 0,140" fill="url(#glacierSnow)"/>
    <polygon points="0,-110 -15,-50 -60,0 -110,40" fill="#ffffff"/>
    
    <!-- Palmer Glacier Snowfields & Crevasses -->
    <polygon points="-10,-95 -25,-60 -5,-55" fill="#bae6fd"/>
    <polygon points="-25,-55 -55,-15 -20,-10" fill="#bae6fd"/>
    <polygon points="5,-85 20,-50 10,-45" fill="#0f172a"/>
    <polygon points="15,-40 45,0 20,5" fill="#0f172a"/>

    <!-- Timberline Ridge Fir Silhouettes below Summit -->
    <g fill="#022c22">
      <polygon points="-220,120 -205,80 -190,120"/>
      <polygon points="-195,120 -180,75 -165,120"/>
      <polygon points="-170,125 -155,70 -140,125"/>
      <polygon points="-145,130 -130,85 -115,130"/>
      <polygon points="115,130 130,85 145,130"/>
      <polygon points="140,125 155,70 170,125"/>
      <polygon points="165,120 180,75 195,120"/>
      <polygon points="190,120 205,80 220,120"/>
    </g>

    <!-- GREENHOUSE SOLARIUM ARCHITECTURE (Foreground Cathedral Framing) -->
    <!-- Grand Cedar / Bronze Cathedral Arch Framing Mountain -->
    <path d="M -230 240 L -230 -40 Q -230 -250 0 -250 Q 230 -250 230 -40 L 230 240" fill="none" stroke="url(#cedarArch)" stroke-width="16" stroke-linecap="round"/>
    <!-- Inner Arch Bead -->
    <path d="M -218 240 L -218 -40 Q -218 -238 0 -238 Q 218 -238 218 -40 L 218 240" fill="none" stroke="#fbbf24" stroke-width="2"/>

    <!-- Geodesic Glass Muntins & Mullions Grid -->
    <g stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6">
      <line x1="0" y1="-250" x2="0" y2="140"/>
      <line x1="-150" y1="-190" x2="-150" y2="140"/>
      <line x1="150" y1="-190" x2="150" y2="140"/>
      <line x1="-230" y1="-40" x2="230" y2="-40"/>
      <line x1="-220" y1="40" x2="220" y2="40"/>
      <!-- Radiating Sunburst Mullions in Arch Crown -->
      <line x1="0" y1="-250" x2="-80" y2="-120"/>
      <line x1="0" y1="-250" x2="80" y2="-120"/>
    </g>

    <!-- Greenhouse Solarium Living Wall Plants (Foreground Canopy) -->
    <g transform="translate(0, 140)">
      <!-- Solarium Terpene Garden Bed -->
      <rect x="-250" y="0" width="500" height="120" fill="#064e3b" stroke="#042f24" stroke-width="2"/>
      <!-- Monstera & Cannabis Leaf Fan Silhouettes -->
      <!-- Center Symmetrical Cannabis Fan Leaves -->
      <g transform="translate(0, -10)" fill="#10b981" stroke="#064e3b" stroke-width="1">
        <path d="M 0 0 C -15 -35 0 -70 0 -70 C 0 -70 15 -35 0 0 Z"/>
        <path d="M 0 0 C -25 -25 -30 -55 -30 -55 C -30 -55 -10 -25 0 0 Z"/>
        <path d="M 0 0 C 25 -25 30 -55 30 -55 C 30 -55 10 -25 0 0 Z"/>
        <path d="M 0 0 C -30 -10 -55 -25 -55 -25 C -55 -25 -25 -5 0 0 Z"/>
        <path d="M 0 0 C 30 -10 55 -25 55 -25 C 55 -25 25 -5 0 0 Z"/>
      </g>

      <!-- Left Tropical Palm -->
      <g transform="translate(-140, 10)" fill="#059669">
        <path d="M 0 0 C -30 -20 -60 -40 -60 -40 C -60 -40 -25 -10 0 0 Z"/>
        <path d="M 0 0 C -10 -30 -30 -60 -30 -60 C -30 -60 -5 -25 0 0 Z"/>
        <path d="M 0 0 C 15 -30 25 -55 25 -55 C 25 -55 5 -20 0 0 Z"/>
      </g>

      <!-- Right Tropical Palm -->
      <g transform="translate(140, 10)" fill="#059669">
        <path d="M 0 0 C 30 -20 60 -40 60 -40 C 60 -40 25 -10 0 0 Z"/>
        <path d="M 0 0 C 10 -30 30 -60 30 -60 C 30 -60 5 -25 0 0 Z"/>
        <path d="M 0 0 C -15 -30 -25 -55 -25 -55 C -25 -55 -5 -20 0 0 Z"/>
      </g>
    </g>

    <!-- CIRCULAR BORDER TYPOGRAPHY -->
    <path id="hoodTextTop" d="M -310 0 A 310 310 0 1 1 310 0" fill="none"/>
    <path id="hoodTextBottom" d="M 310 0 A 310 310 0 1 1 -310 0" fill="none"/>

    <text font-family="'Cinzel', serif" font-weight="900" font-size="17" fill="url(#goldRim)" letter-spacing="4">
      <textPath href="#hoodTextTop" startOffset="50%" text-anchor="middle">
        MOUNT HOOD SOLARIUM • BIOPHILIC ARCHITECTURE
      </textPath>
    </text>

    <text font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#e0f2fe" letter-spacing="3">
      <textPath href="#hoodTextBottom" startOffset="50%" text-anchor="middle">
        TWILIGHT VISTA • 10015 SW HALL BLVD
      </textPath>
    </text>

    <!-- Star Pips on Lateral Axes -->
    <circle cx="-315" cy="0" r="5" fill="#fbbf24"/>
    <circle cx="315" cy="0" r="5" fill="#fbbf24"/>
  </g>
</svg>
