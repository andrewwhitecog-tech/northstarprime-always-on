name: NorthStar visitor route checks
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - run: python -m pip -q install playwright requests
      - name: Verify deployed showroom controls
        shell: python
        run: |
          import time
          from urllib.parse import urljoin,urlsplit
          import requests
          from playwright.sync_api import sync_playwright
          site = 'https://northstarprime.net/games/flagship-3d-suite/'
          for attempt in range(60):
              response = requests.get(site,params={'release':'410','attempt':attempt},timeout=20)
              if response.ok and "getElementById('cards-dock').before(box)" in response.text:
                  break
              time.sleep(8)
          else: raise AssertionError('production has not served #410')
          with sync_playwright() as p:
              for mode,flags in [('fallback',['--disable-webgl','--disable-gpu']),('software',['--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist'])]:
                  browser=p.chromium.launch(executable_path='/usr/bin/google-chrome',args=flags)
                  for w,h in [(390,844),(1280,720)]:
                      page=browser.new_page(viewport={'width':w,'height':h})
                      page.set_default_timeout(45000)
                      page.goto(site+'?release=410',wait_until='domcontentloaded')
                      cards=page.locator('#cards-dock .game-card')
                      cards.last.wait_for()
                      assert cards.count()==4
                      if mode=='fallback':
                          page.locator('.nsp-webgl-fallback').wait_for()
                      else:
                          assert not page.locator('.nsp-webgl-fallback').count()
                      for card in cards.all():
                          dest=urljoin(page.url,card.locator('a').get_attribute('href'))
                          button=card.get_by_role('button')
                          with page.expect_response(lambda r:r.request.resource_type=='document' and urlsplit(r.url).path==urlsplit(dest).path) as nav:
                              button.click()
                          assert nav.value.status==200,(dest,nav.value.status)
                          assert page.locator('#cabinet-runner').is_visible()
                          assert urljoin(page.url,page.locator('#cabinet-iframe').get_attribute('src'))==dest
                          page.keyboard.press('Escape')
                          page.locator('#cabinet-runner').wait_for(state='hidden')
                      print('LIVE CABINETS',mode,w,'4/4 games opened and exited',flush=True)
                      page.close()
                  browser.close()
