name: NorthStar visitor route checks
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d610a653b5bb18facb541466dae4dbf902da59f5
          sparse-checkout: |
            music
            realm
            .github/hq_audio_review
            static/games
            store
            play
            links
            merch
            chromatic
            stickerforge
            parody-drop
            community
            idc-programming
            tools
            tests
            static/front
            static/cards
            warband/art
          persist-credentials: false
      - run: python -m pip -q install playwright beautifulsoup4 pillow pytest requests

      - name: Browser verification
        shell: python
        run: |
          from pathlib import Path
          from bs4 import BeautifulSoup
          from concurrent.futures import ThreadPoolExecutor
          from urllib.parse import urlsplit,urljoin
          import json,re,requests
          base='https://northstarprime.net'
          routes=['store','links','merch','play','chromatic','stickerforge/comedy-vault','parody-drop','hire','services','community']
          def fetch(url):
              return requests.get(url,timeout=(7,18))
          def locate(route):
              url=base+'/'+route+'/'
              r=fetch(url);r.raise_for_status()
              anchors=[]
              for a in BeautifulSoup(r.content,'html.parser').select('a[href]'):
                  href=urljoin(r.url,a['href']).split('?')[0].rstrip('/')
                  if urlsplit(href).hostname!='andrewcog.gumroad.com' or '/l/' not in href: continue
                  own=a.get_text(' ',strip=True)
                  card=a.find_parent(['article','li'])
                  if not card: card=next((e for e in list(a.parents)[:3] if any('card' in x.lower() for x in e.get('class',[]))),None)
                  label=own
                  if '$' not in own and card and len({x['href'] for x in card.select('a[href*="gumroad.com/l/"]')})==1:
                      label=card.get_text(' ',strip=True)
                  prices=re.findall(r'\$\s*(\d+(?:\.\d{1,2})?)',label)
                  anchors.append({'route':route,'url':href,'anchor':own[:200],'text':label[:400],'prices':prices})
              return anchors
          with ThreadPoolExecutor(max_workers=3) as pool:
              groups=list(pool.map(locate,routes))
          rows=[x for g in groups for x in g]
          def product(url):
              try:
                  r=fetch(url);s=BeautifulSoup(r.content,'html.parser');node=s.select_one('[data-page]');p=json.loads(node['data-page'])['props']['product'] if node else {}
                  return {'http':r.status_code,'title':p.get('name'),'cents':p.get('price_cents'),'currency':p.get('currency_code'),'published':p.get('is_published')}
              except Exception as e: return {'error':str(e)[:100]}
          urls=sorted({r['url'] for r in rows}|{'https://andrewcog.gumroad.com/l/'+slug for slug in ['dkhdpk','hyaeu','ibxfso']})
          with ThreadPoolExecutor(max_workers=5) as pool: data=dict(zip(urls,pool.map(product,urls)))
          
          print('checked',len(data),len(rows),flush=True)
          for r in rows:
              p=data[r['url']]
              if r['prices'] and p.get('cents') is not None and p['cents'] not in [round(float(x)*100) for x in r['prices']]:
                  print('DIFF',r['route'],r['url'].split('/')[-1],p['cents'],str(r['prices'])[:50],r['anchor'][:95],flush=True)
          for u,p in data.items():
              if p.get('published')!=True: print('BLOCK',u,p,flush=True)
          for slug in ['dkhdpk','hyaeu','ibxfso','ouklmz']:
           print('SKU',slug,data['https://andrewcog.gumroad.com/l/'+slug],flush=True)
          
