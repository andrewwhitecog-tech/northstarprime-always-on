<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanRipple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00dfd8"/>
      <stop offset="50%" stop-color="#0070f3"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>

    <radialGradient id="waveCenterDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="80%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <filter id="soundwaveGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00dfd8" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#02040a"/>

  <!-- DIE CUT STICKER BODY -->
  <g transform="translate(400, 400)" filter="url(#soundwaveGlow)">
    <circle cx="0" cy="0" r="375" fill="#ffffff"/>
    <circle cx="0" cy="0" r="365" fill="#000000" stroke="url(#cyanRipple)" stroke-width="8"/>
    <circle cx="0" cy="0" r="350" fill="url(#waveCenterDark)" stroke="#1e293b" stroke-width="2"/>

    <!-- CYMATICS RIPPLE RINGS (Mathematical Acoustic Waveforms) -->
    <g fill="none" stroke="url(#cyanRipple)" opacity="0.65">
      <circle cx="0" cy="0" r="320" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="280" stroke-width="2" stroke-dasharray="8,8"/>
      <circle cx="0" cy="0" r="240" stroke-width="1"/>
      <circle cx="0" cy="0" r="200" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="160" stroke-width="1.5" stroke-dasharray="4,6"/>
      <circle cx="0" cy="0" r="120" stroke-width="3"/>
      <circle cx="0" cy="0" r="80" stroke-width="1.5"/>
    </g>

    <!-- 12-Harmonic Sine Wave Oscillator Overlay -->
    <path d="M -300 0 Q -225 -60 -150 0 T 0 0 T 150 0 T 300 0" fill="none" stroke="#00dfd8" stroke-width="3.5"/>
    <path d="M -300 0 Q -225 60 -150 0 T 0 0 T 150 0 T 300 0" fill="none" stroke="#7928ca" stroke-width="2.5" opacity="0.8"/>

    <!-- Central Tuning Fork & Cannabis Acoustic Node -->
    <g transform="translate(0, -10)">
      <!-- Master Tuning Fork -->
      <path d="M -35 -110 L -35 -10 C -35 35 35 35 35 -10 L 35 -110" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
      <!-- Tuning Fork Stem & Base -->
      <line x1="0" y1="28" x2="0" y2="105" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
      <circle cx="0" cy="115" r="14" fill="#00dfd8"/>

      <!-- Soundwave Vibro-Rings from Tines -->
      <path d="M -55 -100 C -70 -70 -70 -40 -55 -10" fill="none" stroke="#00dfd8" stroke-width="3"/>
      <path d="M 55 -100 C 70 -70 70 -40 55 -10" fill="none" stroke="#00dfd8" stroke-width="3"/>

      <!-- Small 5-Leaf Cannabis Crest suspended between tines -->
      <g transform="translate(0, -35)" fill="#10b981">
        <path d="M 0 0 C -4 -12 -3 -25 0 -30 C 3 -25 4 -12 0 0 Z"/>
        <path d="M 0 0 C -12 -6 -18 -18 -20 -22 C -16 -20 -8 -10 0 0 Z"/>
        <path d="M 0 0 C 12 -6 18 -18 20 -22 C 16 -20 8 -10 0 0 Z"/>
      </g>
    </g>

    <!-- FREQUENCY TYPOGRAPHY -->
    <g transform="translate(0, 185)">
      <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="54" fill="#00dfd8" letter-spacing="4" text-anchor="middle">432 Hz</text>
      <text x="0" y="24" font-family="'Inter', sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="3" text-anchor="middle">NATURAL HARMONIC CONVERGENCE</text>
      <text x="0" y="42" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8" letter-spacing="2" text-anchor="middle">SOLFEGGIO TERPENE RESONANCE</text>
    </g>

    <!-- Top Arch Text -->
    <path id="freqArcTop" d="M -270 0 A 270 270 0 1 1 270 0" fill="none"/>
    <text font-family="'Cinzel', serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="6" text-anchor="middle">
      <textPath href="#freqArcTop" startOffset="50%">ACOUSTIC BOTANICAL MATRIX</textPath>
    </text>
  </g>
</svg>
