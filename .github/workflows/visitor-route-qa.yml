name: Storefront conversion audit
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        width: [390, 1280]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      WIDTH: ${{ matrix.width }}
    steps:
      - run: python -m pip -q install playwright requests beautifulsoup4
      - shell: python
        run: |
          import os,re,json
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright
          origin='https://northstarprime.net'
          width=int(os.environ['WIDTH'])
          with sync_playwright() as pw:
              b=pw.chromium.launch(executable_path='/usr/bin/google-chrome',args=['--disable-gpu'])
              ctx=b.new_context(viewport={'width':width,'height':840})
              page=ctx.new_page()
              page.goto(origin+'/merch/',wait_until='domcontentloaded')
              print('LIVE_ARCHIVE',page.locator('article[data-item]').count(),flush=True)
              page.locator('#bm-tarot-78 .zoom-trigger').click()
              for k in ['Shift+Tab','Tab','Tab','Tab','Tab']:
                  page.keyboard.press(k)
                  print('FOCUS',k,page.evaluate("()=>({id:document.activeElement.id,dialog:!!document.activeElement.closest('[role=dialog]'),name:(document.activeElement.innerText||'').trim().slice(0,50)})"),flush=True)
              page.keyboard.press('Escape')
              page.goto(origin+'/holidays/',wait_until='domcontentloaded')
              nav=page.locator('nav .nav-links a').last
              if nav.count():
                  nav.scroll_into_view_if_needed()
                  print('NAV_RANGE',nav.inner_text(),nav.bounding_box(),flush=True)
              links=page.locator('a[href*="www.zazzle.com/"]').evaluate_all("aa=>Array.from(new Set(aa.map(a=>a.href)))")
              dest=ctx.new_page()
              def restrict(r):
                  host=urlsplit(r.request.url).hostname or ''
                  if host=='www.zazzle.com' and r.request.resource_type=='document':r.continue_()
                  else:r.abort()
              dest.route('**/*',restrict)
              for u in links:
                  try:
                      r=dest.goto(u,wait_until='domcontentloaded',timeout=16000)
                      print('CARD_MARKET',r.status if r else None,u,dest.title()[:110],flush=True)
                  except Exception as e:print('MARKET_READ_LIMIT',u,str(e)[:100],flush=True)
              b.close()
