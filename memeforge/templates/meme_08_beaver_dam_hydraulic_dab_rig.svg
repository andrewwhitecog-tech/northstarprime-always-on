<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="100%" height="100%">
  <defs>
    <!-- Blueprint Cyan Gradient -->
    <linearGradient id="blueprintBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b3b"/>
      <stop offset="50%" stop-color="#041228"/>
      <stop offset="100%" stop-color="#020814"/>
    </linearGradient>

    <!-- Blueprint Grid -->
    <pattern id="bpGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0e326b" stroke-width="0.75"/>
    </pattern>

    <filter id="whiteGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="900" height="700" fill="url(#blueprintBg)"/>
  <rect width="900" height="700" fill="url(#bpGrid)"/>

  <!-- Blueprint Outer Border -->
  <rect x="25" y="25" width="850" height="650" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

  <!-- HEADER BLOCK -->
  <g transform="translate(60, 65)">
    <text font-family="'Courier New', monospace" font-weight="900" font-size="20" fill="#38bdf8" letter-spacing="2">UNITED STATES PATENT OFFICE // APPLICATION #420-BEAVER-RIG</text>
    <text font-family="'Courier New', monospace" font-weight="700" font-size="13" fill="#ffffff" y="22">TITLE: MULTI-CHAMBER HYDRAULIC RECYCLER DAM WITH CEDAR PERCOLATORS</text>
    <text font-family="'Courier New', monospace" font-size="11" fill="#94a3b8" y="40">INVENTOR: Castor "Blaze" Fiber, Master River Architect | ASSIGNEE: The NSP APOTHECARY</text>
  </g>

  <!-- SCHEMATIC DRAWING (Center Cross-Section) -->
  <g transform="translate(450, 360)">
    
    <!-- Water Body (Willamette River Cutaway) -->
    <path d="M -360 120 C -200 80 -100 140 0 110 C 100 80 200 130 360 100 L 360 220 L -360 220 Z" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
    <text x="-280" y="160" font-family="'Courier New', monospace" font-size="11" fill="#38bdf8">RIVER RUNOFF RESERVOIR (COLD WATER FILTRATION)</text>

    <!-- THE CEDAR DAM / GLASS RECYCLER RIG HYBRID BODY -->
    <!-- Main Chamber (Beaver Lodge Cutaway) -->
    <path d="M -180 120 C -190 -80 -100 -180 0 -180 C 100 -180 190 -80 180 120 Z" fill="#0f172a" stroke="#ffffff" stroke-width="3" filter="url(#whiteGlow)"/>
    
    <!-- Interlocking Cedar Logs = Honeycomb Percolator Discs -->
    <g stroke="#ffffff" stroke-width="2" fill="#78350f">
      <!-- Tier 1 Percolator -->
      <line x1="-120" y1="40" x2="120" y2="40" stroke="#38bdf8" stroke-width="4"/>
      <circle cx="-80" cy="40" r="7" fill="#38bdf8"/>
      <circle cx="-40" cy="40" r="7" fill="#38bdf8"/>
      <circle cx="0" cy="40" r="7" fill="#38bdf8"/>
      <circle cx="40" cy="40" r="7" fill="#38bdf8"/>
      <circle cx="80" cy="40" r="7" fill="#38bdf8"/>

      <!-- Tier 2 Honeycomb Diffuser -->
      <line x1="-90" y1="-30" x2="90" y2="-30" stroke="#38bdf8" stroke-width="4"/>
      <circle cx="-60" cy="-30" r="7" fill="#38bdf8"/>
      <circle cx="-20" cy="-30" r="7" fill="#38bdf8"/>
      <circle cx="20" cy="-30" r="7" fill="#38bdf8"/>
      <circle cx="60" cy="-30" r="7" fill="#38bdf8"/>
    </g>

    <!-- Recycler Loop Tubing (Cedar Sluice Arm) -->
    <path d="M 160 80 Q 240 0 140 -120 L 80 -140" fill="none" stroke="#38bdf8" stroke-width="8"/>
    <path d="M -160 80 Q -240 0 -140 -120 L -80 -140" fill="none" stroke="#38bdf8" stroke-width="8"/>

    <!-- QUARTZ BANGER INTAKE (Geothermal Volcanic Chimney) -->
    <g transform="translate(0, -220)">
      <!-- Quartz Neck -->
      <path d="M 0 40 L 0 0 L 80 0 L 80 -60" fill="none" stroke="#ffffff" stroke-width="6"/>
      <!-- Banger Bucket -->
      <rect x="60" y="-110" width="40" height="50" rx="4" fill="#f8fafc" fill-opacity="0.3" stroke="#ffffff" stroke-width="2"/>
      <!-- Glowing Terp Pearl inside banger -->
      <circle cx="80" cy="-75" r="7" fill="#f97316"/>
      <!-- Rosin Dab Drop -->
      <ellipse cx="80" cy="-95" rx="10" ry="6" fill="#fbbf24"/>
      <text x="135" y="-85" font-family="'Courier New', monospace" font-size="11" fill="#fef08a">QUARTZ INTAKE SLUICE</text>
    </g>

    <!-- MOUTHPIECE (Top of Beaver Lodge Smoke Hole) -->
    <g transform="translate(-80, -180)">
      <path d="M 0 0 L -40 -60 L -60 -60" fill="none" stroke="#ffffff" stroke-width="8"/>
      <text x="-240" y="-60" font-family="'Courier New', monospace" font-size="11" fill="#34d399">CHESTNUT MOUTHPIECE</text>
    </g>

    <!-- BUBBLE & VAPOR DYNAMICS (Arrows & Dots) -->
    <g fill="#38bdf8" opacity="0.8">
      <circle cx="-40" cy="15" r="4"/><circle cx="-35" cy="5" r="3"/>
      <circle cx="0" cy="15" r="5"/><circle cx="5" cy="0" r="4"/>
      <circle cx="40" cy="15" r="4"/><circle cx="45" cy="5" r="3"/>
      <!-- Swirling Vapor in dome -->
      <path d="M -40 -80 Q 0 -120 40 -80 Q 0 -50 -40 -80" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
    </g>
  </g>

  <!-- TECHNICAL LEGEND CALLOUTS (Bottom Right) -->
  <g transform="translate(560, 520)">
    <rect x="0" y="0" width="280" height="115" rx="6" fill="#090d16" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="15" y="24" font-family="'Courier New', monospace" font-weight="900" font-size="11" fill="#38bdf8">KEY SPECIFICATIONS:</text>
    <text x="15" y="44" font-family="'Courier New', monospace" font-size="10" fill="#cbd5e1">1. Filtration: 100% Cascade snowmelt</text>
    <text x="15" y="62" font-family="'Courier New', monospace" font-size="10" fill="#cbd5e1">2. Wood Type: Old-growth Oregon Cedar</text>
    <text x="15" y="80" font-family="'Courier New', monospace" font-size="10" fill="#cbd5e1">3. Drag Coefficient: 0.00 (Pure chug)</text>
    <text x="15" y="98" font-family="'Courier New', monospace" font-weight="700" font-size="10" fill="#fbbf24">STATUS: NATURE'S GREATEST RIG</text>
  </g>
</svg>
