name: NorthStar visitor route checks
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f19372e829666279257c0e737ec5f9183dc5953b
          sparse-checkout: |
            store
            play
            links
            merch
            chromatic
            stickerforge
            parody-drop
            community
            idc-programming
            tools
            tests
            static/front
            static/cards
            warband/art
          persist-credentials: false
      - run: python -m pip -q install playwright beautifulsoup4 pillow pytest requests
      - run: python -m pytest -q tests/test_visitor_destinations.py
      - name: Browser verification
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright
          from PIL import Image,ImageDraw
          from io import BytesIO
          import base64,json,os
          base='https://northstarprime.net'
          routes=['store','play','links','merch','chromatic','stickerforge/comedy-vault','parody-drop']
          mode=os.environ.get('VISIT_MODE','preview')
          images=[]
          sam='https://andrewcog.gumroad.com/l/northstar-2026-free-mega-sampler'
          with sync_playwright() as p:
              b=p.chromium.launch(executable_path='/usr/bin/google-chrome',args=['--disable-gpu','--mute-audio'])
              for width in [390,1280]:
                  page=b.new_page(viewport={'width':width,'height':840},reduced_motion='reduce')
                  for path in routes:
                      url=f'{base}/{path}/'
                      if mode=='preview':
                          data=Path(path,'index.html').read_text()
                          page.route(url,lambda r:r.fulfill(status=200,content_type='text/html; charset=utf-8',body=data))
                      resp=page.goto(url,wait_until='domcontentloaded')
                      assert resp.status==200
                      for target in ['/community/',sam]:
                          loc=page.locator('a[href="'+target+'"]:visible').first
                          loc.wait_for(state='visible')
                          loc.evaluate("a=>a.scrollIntoView({block:'center',behavior:'instant'})")
                          loc.focus()
                          rect=loc.bounding_box()
                          assert rect['width']>0 and rect['x']>=-1 and rect['x']+rect['width']<=width+1,(path,width,target,rect)
                          assert loc.inner_text().strip()
                      if width==390:
                          loc.evaluate("a=>a.scrollIntoView({block:'center',behavior:'instant'})")
                          shot=Image.open(BytesIO(page.screenshot(animations='disabled'))).convert('RGB')
                          y=round(rect['y']+rect['height']/2)
                          images.append((path,shot.crop((0,max(0,y-105),390,min(840,y+105)))))
                      print('CTA',path,width,flush=True)
                      if mode=='preview':page.unroute(url)
                  page.close()
              b.close()
          sheet=Image.new('RGB',(780,4*238),'#202020');d=ImageDraw.Draw(sheet)
          for n,(path,im) in enumerate(images):
              x=n%2*390;y=n//2*238;d.text((x+4,y+3),path,fill='white');sheet.paste(im,(x,y+22))
          buf=BytesIO();sheet.save(buf,format='JPEG',quality=65)
          s=base64.b64encode(buf.getvalue()).decode()
          for i in range(0,len(s),3000):print('SHEET '+s[i:i+3000])
