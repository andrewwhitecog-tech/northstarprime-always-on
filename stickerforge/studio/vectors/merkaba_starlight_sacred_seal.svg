<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="starlightPoly" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#818cf8"/>
      <stop offset="60%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="goldMerkaba" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <radialGradient id="deepVoidSpace" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <filter id="merkabaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#818cf8" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#030712"/>

  <!-- DIE-CUT VINYL MEDALLION -->
  <g transform="translate(400, 400)" filter="url(#merkabaGlow)">
    <!-- White Die-Cut Vinyl Bleed Outline -->
    <circle cx="0" cy="0" r="375" fill="#ffffff"/>
    <circle cx="0" cy="0" r="365" fill="none" stroke="url(#starlightPoly)" stroke-width="8"/>
    <circle cx="0" cy="0" r="352" fill="url(#deepVoidSpace)" stroke="url(#goldMerkaba)" stroke-width="3"/>

    <!-- Concentric Star Ring and Degrees Dial -->
    <circle cx="0" cy="0" r="338" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="2,6"/>
    <circle cx="0" cy="0" r="280" fill="none" stroke="url(#goldMerkaba)" stroke-width="2"/>

    <!-- 13 Circles of Fruit of Life (Metatron's Foundation) -->
    <g fill="none" stroke="url(#starlightPoly)" stroke-width="1.2" opacity="0.45">
      <circle cx="0" cy="0" r="70"/>
      <!-- Inner Ring (6 circles) -->
      <circle cx="0" cy="-140" r="70"/>
      <circle cx="121.2" cy="-70" r="70"/>
      <circle cx="121.2" cy="70" r="70"/>
      <circle cx="0" cy="140" r="70"/>
      <circle cx="-121.2" cy="70" r="70"/>
      <circle cx="-121.2" cy="-70" r="70"/>
      <!-- Outer Ring (6 circles) -->
      <circle cx="0" cy="-280" r="70"/>
      <circle cx="242.4" cy="-140" r="70"/>
      <circle cx="242.4" cy="140" r="70"/>
      <circle cx="0" cy="280" r="70"/>
      <circle cx="-242.4" cy="140" r="70"/>
      <circle cx="-242.4" cy="-140" r="70"/>
    </g>

    <!-- 3D INTERLOCKING STAR TETRAHEDRON (MERKABA) -->
    <!-- Upward Pointing Tetrahedron (Sun / Masculine / Electric) -->
    <polygon points="0,-240 207.8,120 -207.8,120" fill="#3b82f6" fill-opacity="0.2" stroke="url(#goldMerkaba)" stroke-width="3.5"/>
    <line x1="0" y1="-240" x2="0" y2="0" stroke="url(#goldMerkaba)" stroke-width="3"/>
    <line x1="207.8" y1="120" x2="0" y2="0" stroke="url(#goldMerkaba)" stroke-width="3"/>
    <line x1="-207.8" y1="120" x2="0" y2="0" stroke="url(#goldMerkaba)" stroke-width="3"/>

    <!-- Downward Pointing Tetrahedron (Earth / Feminine / Magnetic) -->
    <polygon points="0,240 207.8,-120 -207.8,-120" fill="#ec4899" fill-opacity="0.2" stroke="url(#starlightPoly)" stroke-width="3.5"/>
    <line x1="0" y1="240" x2="0" y2="0" stroke="url(#starlightPoly)" stroke-width="3"/>
    <line x1="207.8" y1="-120" x2="0" y2="0" stroke="url(#starlightPoly)" stroke-width="3"/>
    <line x1="-207.8" y1="-120" x2="0" y2="0" stroke="url(#starlightPoly)" stroke-width="3"/>

    <!-- Central Singularity Nexus Core -->
    <circle cx="0" cy="0" r="28" fill="#ffffff" filter="url(#merkabaGlow)"/>
    <circle cx="0" cy="0" r="14" fill="#fbbf24"/>
    
    <!-- 8-Pointed Star Center Flare -->
    <polygon points="0,-45 8,-12 45,0 8,12 0,45 -8,12 -45,0 -8,-12" fill="url(#goldMerkaba)"/>

    <!-- Circular Starlight Ribbon Typography -->
    <path id="merkabaArcTop" d="M -260 0 A 260 260 0 1 1 260 0" fill="none"/>
    <text font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="21" fill="url(#goldMerkaba)" letter-spacing="6" text-anchor="middle">
      <textPath href="#merkabaArcTop" startOffset="50%">SACRED MERKABA STARLIGHT</textPath>
    </text>

    <path id="merkabaArcBottom" d="M 260 0 A 260 260 0 0 1 -260 0" fill="none"/>
    <text font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="url(#starlightPoly)" letter-spacing="4" text-anchor="middle">
      <textPath href="#merkabaArcBottom" startOffset="50%">NORTHSTAR FORGE • FREQUENCY 432 HZ</textPath>
    </text>

    <!-- Edge Starlight Nodes -->
    <circle cx="-300" cy="0" r="6" fill="#38bdf8"/>
    <circle cx="300" cy="0" r="6" fill="#38bdf8"/>
  </g>
</svg>
