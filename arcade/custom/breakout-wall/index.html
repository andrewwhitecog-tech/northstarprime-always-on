<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BREAKOUT: THE WALL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:radial-gradient(circle at 50% 0%,#0a0a18 0%,#05030a 60%,#020108 100%);
  overflow:hidden;font-family:'Courier New',monospace;
  display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;
}
canvas{display:block;border-radius:12px;
  border:1px solid rgba(127,215,255,.28);
  box-shadow:0 0 0 5px rgba(127,215,255,.05),0 0 44px rgba(127,215,255,.16),0 24px 60px rgba(0,0,0,.7),inset 0 0 60px rgba(0,0,0,.4);
}
#title{
  font-size:15px;font-weight:bold;letter-spacing:10px;margin-bottom:10px;text-transform:uppercase;
  background:linear-gradient(100deg,#7fd7ff 0%,#e9c86a 30%,#ec4899 55%,#7fd7ff 80%);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 5s linear infinite;
  filter:drop-shadow(0 0 12px rgba(127,215,255,.45));
}
@keyframes shimmer{0%{background-position:0% 0}100%{background-position:300% 0}}
#hud{display:flex;gap:12px;margin-bottom:12px}
.chip{
  background:rgba(8,8,24,.62);border:1px solid rgba(127,215,255,.30);border-radius:10px;
  padding:6px 18px;text-align:center;backdrop-filter:blur(6px);
  box-shadow:0 0 18px rgba(127,215,255,.10),inset 0 1px 0 rgba(255,255,255,.06);
}
.chip .lbl{color:#5f7d95;font-size:9px;letter-spacing:4px;text-transform:uppercase}
.chip .num{color:#eaf7ff;font-size:20px;font-weight:bold;text-shadow:0 0 12px rgba(127,215,255,.85),0 0 26px rgba(127,215,255,.4)}
.chip.gold{border-color:rgba(233,200,106,.32)}
.chip.gold .num{text-shadow:0 0 12px rgba(233,200,106,.85),0 0 26px rgba(233,200,106,.4)}
.chip.pink{border-color:rgba(236,72,153,.32)}
.chip.pink .num{text-shadow:0 0 12px rgba(236,72,153,.85),0 0 26px rgba(236,72,153,.4)}
#info{color:#4c5468;font-size:11px;margin-top:12px;letter-spacing:2.5px;text-transform:uppercase}
#info b{color:#7fd7ff;font-weight:normal;text-shadow:0 0 8px rgba(127,215,255,.6)}
</style>
</head>
<body>
<div id="title">Breakout &middot; The Wall</div>
<div id="hud">
  <div class="chip"><div class="lbl">Score</div><div class="num" id="score">0</div></div>
  <div class="chip pink"><div class="lbl">Lives</div><div class="num" id="lives">3</div></div>
  <div class="chip gold"><div class="lbl">Level</div><div class="num" id="level">1</div></div>
</div>
<canvas id="c"></canvas>
<div id="info"><b>Mouse</b> or <b>&larr; &rarr;</b> move &nbsp;&middot;&nbsp; <b>Space</b> launch &nbsp;&middot;&nbsp; collect powerups</div>
<script src="/static/games/chiptune.js"></script>
<script>
// --- Chiptune audio helpers (guarded; game runs fine without engine) ---
function SND(n){try{ if(window.Chiptune) Chiptune.SFX[n](); }catch(e){}}
const _sndT={};
function SNDC(n,ms){const now=performance.now();if(_sndT[n]&&now-_sndT[n]<(ms||70))return;_sndT[n]=now;SND(n)}

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=canvas.width=800,H=canvas.height=600;

const BRICK_ROWS=8,BRICK_COLS=12,BRICK_W=60,BRICK_H=18,BRICK_GAP=4;
const PADDLE_W_DEFAULT=100,PADDLE_H=14,BALL_R=6;

let paddle,balls,bricks,powerups,particles,score,lives,level,gameOver,phase,launched;
let paddleW=PADDLE_W_DEFAULT;
let stickyBall=false;

const POWERUP_TYPES=[
  {type:'wide',color:'#5eead4',label:'W',desc:'Wide Paddle'},
  {type:'multi',color:'#ec4899',label:'M',desc:'Multi-Ball'},
  {type:'life',color:'#ff2d55',label:'+',desc:'Extra Life'},
  {type:'fire',color:'#fb923c',label:'F',desc:'Fireball'},
];

const BRICK_COLORS=[
  {hp:1,colors:['#7fd7ff','#1d4f8a']},
  {hp:2,colors:['#5eead4','#0d5c4e']},
  {hp:3,colors:['#e9c86a','#8a6410']},
  {hp:4,colors:['#fb923c','#8a3a12']},
  {hp:5,colors:['#ec4899','#7a1450']},
];

// ============================================================
// SLEEK FX TOOLKIT (visual only — no gameplay impact)
// ============================================================
const FX={shakeT:0,shakeM:0,flashA:0,flashC:'#fff',t:0};
function fxShake(m,d){FX.shakeM=Math.max(FX.shakeM,m);FX.shakeT=Math.max(FX.shakeT,d||10)}
function fxFlash(c,a){FX.flashC=c;FX.flashA=Math.max(FX.flashA,a||0.3)}
function fxUpdate(){
  FX.t+=1/60;
  if(FX.shakeT>0)FX.shakeT--;else FX.shakeM=0;
  FX.flashA=Math.max(0,FX.flashA-0.035);
}

// --- baked spark sprites (per color; glow paid once, not per frame) ---
const _sparkCache={};
function sparkSprite(color){
  if(_sparkCache[color])return _sparkCache[color];
  const c=document.createElement('canvas');c.width=c.height=32;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(16,16,0,16,16,16);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.28,color);
  g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,32,32);
  return _sparkCache[color]=c;
}

// --- baked orb (ball) sprite: hot white core + colored halo ---
function bakeOrb(color,halo){
  const R=BALL_R,PAD=18,S=(R+PAD)*2;
  const c=document.createElement('canvas');c.width=c.height=S;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(S/2,S/2,0,S/2,S/2,R+PAD);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.14,'#ffffff');
  g.addColorStop(0.24,color);
  g.addColorStop(0.42,halo);
  g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;
  x.beginPath();x.arc(S/2,S/2,R+PAD,0,Math.PI*2);x.fill();
  // crisp core edge
  x.fillStyle='rgba(255,255,255,0.95)';
  x.beginPath();x.arc(S/2,S/2,R*0.62,0,Math.PI*2);x.fill();
  return c;
}
const ORB_CYAN=bakeOrb('#7fd7ff','rgba(64,140,255,0.5)');
const ORB_FIRE=bakeOrb('#ffd27f','rgba(255,90,40,0.55)');
const ORB_S=ORB_CYAN.width;

// --- baked brick sprites: beveled gem + baked glow, one per tier ---
function bakeBrick(tier){
  const PAD=12,w=BRICK_W+PAD*2,h=BRICK_H+PAD*2;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');
  const [hi,lo]=BRICK_COLORS[tier].colors;
  const bx=PAD,by=PAD,r=4;
  const rr=(xx,yy,ww,hh,rad)=>{
    x.beginPath();
    if(x.roundRect)x.roundRect(xx,yy,ww,hh,rad);
    else x.rect(xx,yy,ww,hh);
  };
  // glow pass (paid once at bake time)
  x.shadowColor=hi;x.shadowBlur=14;
  x.fillStyle=lo;rr(bx,by,BRICK_W,BRICK_H,r);x.fill();
  x.shadowBlur=0;
  // beveled gem body
  const g=x.createLinearGradient(bx,by,bx,by+BRICK_H);
  g.addColorStop(0,'rgba(255,255,255,0.85)');
  g.addColorStop(0.12,hi);
  g.addColorStop(0.5,lo);
  g.addColorStop(0.88,'rgba(0,0,0,0.55)');
  g.addColorStop(1,'rgba(0,0,0,0.7)');
  x.fillStyle=g;rr(bx,by,BRICK_W,BRICK_H,r);x.fill();
  // glass top highlight
  const hg=x.createLinearGradient(bx,by,bx,by+BRICK_H*0.45);
  hg.addColorStop(0,'rgba(255,255,255,0.55)');
  hg.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=hg;rr(bx+2,by+1.5,BRICK_W-4,BRICK_H*0.42,3);x.fill();
  // 1px neon edge
  x.strokeStyle=hi;x.globalAlpha=0.9;x.lineWidth=1;
  rr(bx+0.5,by+0.5,BRICK_W-1,BRICK_H-1,r);x.stroke();
  x.globalAlpha=1;
  // inner facet line
  x.strokeStyle='rgba(255,255,255,0.25)';x.lineWidth=0.8;
  x.beginPath();x.moveTo(bx+4,by+BRICK_H-4);x.lineTo(bx+BRICK_W-4,by+BRICK_H-4);x.stroke();
  return c;
}
const BRICK_SPRITES=BRICK_COLORS.map((_,i)=>bakeBrick(i));
const BRICK_PAD=12;

// --- baked paddle: metallic bar with energy edge + glow ---
function bakePaddle(){
  const BW=220,PAD=16,w=BW+PAD*2,h=PADDLE_H+PAD*2;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');
  const px=PAD,py=PAD;
  const rr=()=>{x.beginPath();if(x.roundRect)x.roundRect(px,py,BW,PADDLE_H,PADDLE_H/2);else x.rect(px,py,BW,PADDLE_H)};
  x.shadowColor='#7fd7ff';x.shadowBlur=16;
  x.fillStyle='#0b2438';rr();x.fill();
  x.shadowBlur=0;
  // metallic vertical sheen
  const g=x.createLinearGradient(0,py,0,py+PADDLE_H);
  g.addColorStop(0,'#eaf7ff');
  g.addColorStop(0.22,'#7fd7ff');
  g.addColorStop(0.5,'#123a5c');
  g.addColorStop(0.82,'#0a2036');
  g.addColorStop(1,'#245d8a');
  x.fillStyle=g;rr();x.fill();
  // energy edge (top line)
  x.strokeStyle='rgba(255,255,255,0.9)';x.lineWidth=1.4;
  x.beginPath();x.moveTo(px+6,py+2);x.lineTo(px+BW-6,py+2);x.stroke();
  // neon rim
  x.strokeStyle='rgba(127,215,255,0.85)';x.lineWidth=1;
  x.beginPath();if(x.roundRect)x.roundRect(px+0.5,py+0.5,BW-1,PADDLE_H-1,PADDLE_H/2);else x.rect(px+0.5,py+0.5,BW-1,PADDLE_H-1);x.stroke();
  // hot end caps
  for(const ex of [px+7,px+BW-7]){
    const eg=x.createRadialGradient(ex,py+PADDLE_H/2,0,ex,py+PADDLE_H/2,9);
    eg.addColorStop(0,'rgba(255,255,255,0.95)');
    eg.addColorStop(0.4,'rgba(236,72,153,0.8)');
    eg.addColorStop(1,'rgba(236,72,153,0)');
    x.fillStyle=eg;x.beginPath();x.arc(ex,py+PADDLE_H/2,9,0,Math.PI*2);x.fill();
  }
  return {c,BW,PAD};
}
const PADDLE_SPRITE=bakePaddle();

// --- baked powerup gems (diamond + glow + label) ---
function bakePowerup(p){
  const S=48;
  const c=document.createElement('canvas');c.width=c.height=S;
  const x=c.getContext('2d');
  x.translate(S/2,S/2);
  x.shadowColor=p.color;x.shadowBlur=14;
  const g=x.createLinearGradient(0,-12,0,12);
  g.addColorStop(0,'rgba(255,255,255,0.9)');
  g.addColorStop(0.3,p.color);
  g.addColorStop(1,'rgba(0,0,0,0.6)');
  x.fillStyle=g;
  x.beginPath();x.moveTo(0,-12);x.lineTo(12,0);x.lineTo(0,12);x.lineTo(-12,0);x.closePath();x.fill();
  x.shadowBlur=0;
  x.strokeStyle='rgba(255,255,255,0.85)';x.lineWidth=1.2;x.stroke();
  x.fillStyle='#05030a';x.font='bold 11px Courier New';x.textAlign='center';x.textBaseline='middle';
  x.fillText(p.label,0,1);
  return c;
}
const POWERUP_SPRITES={};
for(const p of POWERUP_TYPES)POWERUP_SPRITES[p.type]=bakePowerup(p);

// --- baked layered background: void gradient + nebula ---
function bakeBackground(){
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#05030a');
  g.addColorStop(0.45,'#080618');
  g.addColorStop(1,'#0a0a18');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  // nebula blobs (screen blend, very low alpha)
  x.globalCompositeOperation='screen';
  const blobs=[
    [W*0.18,H*0.22,340,'127,215,255',0.10],
    [W*0.85,H*0.14,300,'236,72,153',0.09],
    [W*0.62,H*0.78,380,'109,40,217',0.10],
    [W*0.12,H*0.86,280,'233,200,106',0.06],
  ];
  for(const [bx,by,br,rgb,a] of blobs){
    const bg=x.createRadialGradient(bx,by,0,bx,by,br);
    bg.addColorStop(0,`rgba(${rgb},${a})`);
    bg.addColorStop(0.6,`rgba(${rgb},${a*0.35})`);
    bg.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=bg;x.fillRect(0,0,W,H);
  }
  // whisper-subtle grid
  x.globalCompositeOperation='source-over';
  x.strokeStyle='rgba(127,215,255,0.035)';x.lineWidth=1;
  for(let gx=0;gx<=W;gx+=40){x.beginPath();x.moveTo(gx+0.5,0);x.lineTo(gx+0.5,H);x.stroke()}
  for(let gy=0;gy<=H;gy+=40){x.beginPath();x.moveTo(0,gy+0.5);x.lineTo(W,gy+0.5);x.stroke()}
  return c;
}
const BG=bakeBackground();

// --- baked star layers (drift for parallax depth) ---
function bakeStars(n,rmin,rmax,alpha){
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');
  for(let i=0;i<n;i++){
    const r=rmin+Math.random()*(rmax-rmin);
    const a=alpha*(0.4+Math.random()*0.6);
    const hue=[['255,255,255'],['127,215,255'],['233,200,106']][Math.floor(Math.random()*3)];
    x.fillStyle=`rgba(${hue},${a})`;
    x.beginPath();x.arc(Math.random()*W,Math.random()*H,r,0,Math.PI*2);x.fill();
  }
  return c;
}
const STARS_FAR=bakeStars(90,0.4,1.0,0.5);
const STARS_NEAR=bakeStars(40,0.8,1.6,0.8);

// --- baked CRT finish: vignette + faint scanlines ---
function bakeCRT(){
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');
  x.fillStyle='rgba(0,0,0,0.05)';
  for(let y=0;y<H;y+=3)x.fillRect(0,y,W,1);
  const v=x.createRadialGradient(W/2,H/2,H*0.42,W/2,H/2,H*0.85);
  v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(1,'rgba(2,1,8,0.55)');
  x.fillStyle=v;x.fillRect(0,0,W,H);
  return c;
}
const CRT=bakeCRT();
// ============================================================

function makeBricks(){
  bricks=[];
  const ox=(W-BRICK_COLS*(BRICK_W+BRICK_GAP))/2;
  for(let r=0;r<BRICK_ROWS;r++){
    const hpBase=Math.min(5,BRICK_ROWS-r+Math.floor(level/2));
    for(let c=0;c<BRICK_COLS;c++){
      // Some bricks are empty for patterns
      if(level>1&&Math.random()<0.1)continue;
      const hp=Math.max(1,hpBase-Math.floor(Math.random()*2));
      bricks.push({x:ox+c*(BRICK_W+BRICK_GAP),y:50+r*(BRICK_H+BRICK_GAP),w:BRICK_W,h:BRICK_H,hp,maxHp:hp});
    }
  }
}

function init(){
  paddle={x:W/2-PADDLE_W_DEFAULT/2,y:H-40};
  paddleW=PADDLE_W_DEFAULT;
  balls=[];powerups=[];particles=[];
  score=0;lives=3;level=1;gameOver=false;phase=0;launched=false;stickyBall=false;
  makeBricks();
  spawnBall();
  updateHUD();
}

function spawnBall(){
  balls.push({x:paddle.x+paddleW/2,y:paddle.y-BALL_R-1,vx:0,vy:0,fire:false,stuck:true});
  launched=false;
}

function launch(){
  for(const b of balls){
    if(b.stuck){
      const angle=-Math.PI/2+(Math.random()-0.5)*0.4;
      b.vx=Math.cos(angle)*5;b.vy=Math.sin(angle)*5;b.stuck=false;launched=true;
      SNDC('shoot',150);
    }
  }
}

function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('lives').textContent=lives;
  document.getElementById('level').textContent=level;
}

let mouseX=W/2;
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouseX=e.clientX-r.left});
const keys={};
document.addEventListener('keydown',e=>{
  try{ if(window.Chiptune) Chiptune.resume(); }catch(e2){}
  keys[e.key]=true;
  if(e.key===' '){e.preventDefault();if(gameOver)init();else launch()}
});
document.addEventListener('keyup',e=>keys[e.key]=false);

function addParticles(x,y,n,color){
  for(let i=0;i<n;i++){
    if(particles.length>=200)particles.shift(); // hard cap (perf budget)
    const a=Math.random()*Math.PI*2,s=Math.random()*3+1;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,alpha:1,color,size:Math.random()*4+2,hue:Math.random()*360,rot:Math.random()*Math.PI});
  }
}

function update(){
  if(gameOver)return;
  phase+=0.03;

  // Paddle movement
  if(keys['ArrowLeft'])paddle.x-=8;
  if(keys['ArrowRight'])paddle.x+=8;
  paddle.x+=(mouseX-paddleW/2-paddle.x)*0.15;
  paddle.x=Math.max(0,Math.min(W-paddleW,paddle.x));

  // Balls
  for(let i=balls.length-1;i>=0;i--){
    const b=balls[i];
    if(b.stuck){b.x=paddle.x+paddleW/2;b.y=paddle.y-BALL_R-1;continue}

    b.x+=b.vx;b.y+=b.vy;

    // Wall bounces
    if(b.x-BALL_R<0){b.x=BALL_R;b.vx*=-1;SNDC('bump')}
    if(b.x+BALL_R>W){b.x=W-BALL_R;b.vx*=-1;SNDC('bump')}
    if(b.y-BALL_R<0){b.y=BALL_R;b.vy*=-1;SNDC('bump')}

    // Bottom - lose ball
    if(b.y>H+BALL_R){
      balls.splice(i,1);
      if(balls.length===0){
        lives--;updateHUD();
        fxFlash('#ff2d55',0.3);fxShake(4,12); // fx only
        if(lives<=0){gameOver=true;SND('death');fxFlash('#ff2d55',0.55);fxShake(7,22)}else{SND('hurt');paddleW=PADDLE_W_DEFAULT;spawnBall()}
      }
      continue;
    }

    // Paddle collision
    if(b.vy>0&&b.y+BALL_R>paddle.y&&b.y+BALL_R<paddle.y+PADDLE_H+5&&b.x>paddle.x-5&&b.x<paddle.x+paddleW+5){
      const rel=(b.x-(paddle.x+paddleW/2))/(paddleW/2);
      const angle=rel*Math.PI/3-Math.PI/2;
      const speed=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
      b.vx=Math.cos(angle)*speed;
      b.vy=Math.sin(angle)*speed;
      if(b.vy>-1)b.vy=-1;
      b.y=paddle.y-BALL_R-1;
      SNDC('blip');
      addParticles(b.x,b.y,5,'#7fd7ff');
    }

    // Brick collision
    for(let j=bricks.length-1;j>=0;j--){
      const br=bricks[j];
      if(b.x+BALL_R>br.x&&b.x-BALL_R<br.x+br.w&&b.y+BALL_R>br.y&&b.y-BALL_R<br.y+br.h){
        br.hp--;
        if(!b.fire){
          // Determine bounce direction
          const overlapLeft=b.x+BALL_R-br.x;
          const overlapRight=br.x+br.w-(b.x-BALL_R);
          const overlapTop=b.y+BALL_R-br.y;
          const overlapBottom=br.y+br.h-(b.y-BALL_R);
          const minOverlap=Math.min(overlapLeft,overlapRight,overlapTop,overlapBottom);
          if(minOverlap===overlapLeft||minOverlap===overlapRight)b.vx*=-1;
          else b.vy*=-1;
        }

        if(br.hp<=0){
          SNDC('pop',50);
          score+=br.maxHp*10*level;
          addParticles(br.x+br.w/2,br.y+br.h/2,8,BRICK_COLORS[Math.min(br.maxHp-1,4)].colors[0]);
          fxShake(2.5,7); // fx only
          // Chance to drop powerup
          if(Math.random()<0.15){
            const ptype=POWERUP_TYPES[Math.floor(Math.random()*POWERUP_TYPES.length)];
            powerups.push({x:br.x+br.w/2,y:br.y+br.h/2,vy:2,...ptype});
          }
          bricks.splice(j,1);
        } else {
          SNDC('hit',60);
          addParticles(b.x,b.y,3,'#fff');
        }
        updateHUD();
        if(!b.fire)break;
      }
    }
  }

  // Powerups
  for(let i=powerups.length-1;i>=0;i--){
    const p=powerups[i];
    p.y+=p.vy;
    if(p.y>H){powerups.splice(i,1);continue}
    if(p.y+10>paddle.y&&p.y<paddle.y+PADDLE_H&&p.x>paddle.x&&p.x<paddle.x+paddleW){
      // Collect
      if(p.type==='wide'){paddleW=Math.min(200,paddleW+30)}
      if(p.type==='multi'){
        const nb=[];
        for(const b of balls){
          if(!b.stuck){
            nb.push({...b,vx:b.vx+1,vy:b.vy-0.5,fire:b.fire});
            nb.push({...b,vx:b.vx-1,vy:b.vy-0.5,fire:b.fire});
          }
        }
        balls.push(...nb);
      }
      if(p.type==='life'){lives++;updateHUD()}
      if(p.type==='fire'){for(const b of balls)b.fire=true;setTimeout(()=>{for(const b of balls)b.fire=false},5000)}
      SND(p.type==='life'?'oneUp':'powerUp');
      addParticles(p.x,p.y,10,p.color);
      fxFlash(p.color,0.18); // fx only
      powerups.splice(i,1);
    }
  }

  // Level clear
  if(bricks.length===0){
    SND('gate');
    fxFlash('#e9c86a',0.45);fxShake(3,10); // fx only
    level++;updateHUD();makeBricks();
    balls=[];paddleW=PADDLE_W_DEFAULT;spawnBall();
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.alpha-=0.025;p.vy+=0.05;
    if(p.alpha<=0)particles.splice(i,1);
  }

  fxUpdate();
}

// ============================================================
// PREMIUM RENDERER
// ============================================================
function draw(){
  ctx.save();
  // screen shake
  if(FX.shakeT>0&&FX.shakeM>0)ctx.translate((Math.random()-0.5)*FX.shakeM*2,(Math.random()-0.5)*FX.shakeM*2);

  // layered void background + drifting starfields
  ctx.drawImage(BG,0,0);
  const off1=(FX.t*6)%H,off2=(FX.t*14)%H;
  ctx.globalAlpha=0.8;
  ctx.drawImage(STARS_FAR,0,off1-H);ctx.drawImage(STARS_FAR,0,off1);
  ctx.drawImage(STARS_NEAR,0,off2-H);ctx.drawImage(STARS_NEAR,0,off2);
  ctx.globalAlpha=1;

  // breathing nebula accent (single cheap gradient)
  ctx.save();
  ctx.globalCompositeOperation='screen';
  const nx=W/2+Math.sin(phase*0.5)*120,ny=H*0.35+Math.cos(phase*0.35)*50;
  const ng=ctx.createRadialGradient(nx,ny,0,nx,ny,320);
  ng.addColorStop(0,'rgba(109,40,217,0.07)');
  ng.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=ng;ctx.fillRect(0,0,W,H);
  ctx.restore();

  // Bricks (baked beveled gem sprites)
  for(const br of bricks){
    const ci=Math.min(br.maxHp-1,4);
    const t=br.hp/br.maxHp;
    ctx.globalAlpha=0.55+t*0.45;
    ctx.drawImage(BRICK_SPRITES[ci],br.x-BRICK_PAD,br.y-BRICK_PAD);
    ctx.globalAlpha=1;
    // HP indicator
    if(br.hp>1){
      ctx.fillStyle='rgba(3,2,10,0.55)';ctx.font='bold 10px Courier New';ctx.textAlign='center';
      ctx.fillText(br.hp,br.x+br.w/2,br.y+br.h/2+3.5);
    }
    // Crack effect for damaged bricks
    if(br.hp<br.maxHp){
      ctx.strokeStyle=`rgba(255,255,255,${0.35*(1-t)})`;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(br.x+br.w*0.3,br.y);ctx.lineTo(br.x+br.w*0.5,br.y+br.h*0.6);ctx.lineTo(br.x+br.w*0.7,br.y+br.h);ctx.stroke();
      ctx.beginPath();ctx.moveTo(br.x+br.w*0.62,br.y+br.h*0.15);ctx.lineTo(br.x+br.w*0.45,br.y+br.h*0.5);ctx.stroke();
    }
  }

  // Paddle (baked metallic sprite, stretched to width + live energy shimmer)
  {
    const ps=PADDLE_SPRITE,k=paddleW/ps.BW;
    ctx.drawImage(ps.c,paddle.x-ps.PAD*k,paddle.y-ps.PAD,(ps.BW+ps.PAD*2)*k,PADDLE_H+ps.PAD*2);
    // energy edge shimmer
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const ex=paddle.x+((phase*90)%(paddleW+40))-20;
    const eg=ctx.createLinearGradient(ex-26,0,ex+26,0);
    eg.addColorStop(0,'rgba(127,215,255,0)');
    eg.addColorStop(0.5,'rgba(200,240,255,0.55)');
    eg.addColorStop(1,'rgba(127,215,255,0)');
    ctx.fillStyle=eg;
    ctx.fillRect(Math.max(paddle.x,ex-26),paddle.y,Math.min(52,paddle.x+paddleW-Math.max(paddle.x,ex-26)),3);
    ctx.restore();
  }

  // Balls: comet trail + baked glow orb
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(const b of balls){
    if(!b.trail)b.trail=[];
    b.trail.push({x:b.x,y:b.y});
    if(b.trail.length>12)b.trail.shift();
    const spr=b.fire?ORB_FIRE:ORB_CYAN;
    if(!b.stuck){
      for(let t=0;t<b.trail.length;t++){
        const tp=b.trail[t],ta=(t/b.trail.length);
        const d=ORB_S*(0.25+ta*0.55);
        ctx.globalAlpha=ta*0.28;
        ctx.drawImage(spr,tp.x-d/2,tp.y-d/2,d,d);
      }
    }
    ctx.globalAlpha=1;
    ctx.drawImage(spr,b.x-ORB_S/2,b.y-ORB_S/2);
  }
  ctx.restore();

  // Powerups (baked gem sprites, spinning)
  for(const p of powerups){
    const spr=POWERUP_SPRITES[p.type];
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(phase*2);
    const pulse=1+Math.sin(phase*6)*0.08;
    ctx.drawImage(spr,-24*pulse,-24*pulse,48*pulse,48*pulse);
    ctx.restore();
  }

  // Particles (additive pass, baked spark sprites)
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.alpha);
    const spr=sparkSprite(p.color);
    const d=p.size*2.6*Math.max(0.2,p.alpha)+3;
    ctx.drawImage(spr,p.x-d/2,p.y-d/2,d,d);
  }
  ctx.restore();
  ctx.globalAlpha=1;

  ctx.restore(); // end shake

  // flash overlay (level up / hit / game over)
  if(FX.flashA>0){
    ctx.globalAlpha=FX.flashA;
    ctx.fillStyle=FX.flashC;
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }

  // CRT finish: vignette + scanlines
  ctx.drawImage(CRT,0,0);

  if(gameOver){
    ctx.fillStyle='rgba(4,2,10,0.78)';ctx.fillRect(0,0,W,H);
    // glass panel
    ctx.fillStyle='rgba(10,8,26,0.72)';
    ctx.strokeStyle='rgba(255,45,85,0.5)';
    ctx.lineWidth=1;
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(W/2-230,H/2-95,460,190,14);else ctx.rect(W/2-230,H/2-95,460,190);
    ctx.fill();ctx.stroke();
    ctx.textAlign='center';
    ctx.fillStyle='#ff2d55';ctx.font='bold 36px Courier New';
    ctx.shadowColor='#ff2d55';ctx.shadowBlur=24;
    ctx.fillText('THE WALL STANDS',W/2,H/2-30);
    ctx.fillStyle='#7fd7ff';ctx.font='20px Courier New';ctx.shadowColor='#7fd7ff';ctx.shadowBlur=14;
    ctx.fillText(`SCORE ${score}  ·  LEVEL ${level}`,W/2,H/2+10);
    ctx.shadowBlur=0;
    const pa=0.45+Math.sin(phase*4)*0.3;
    ctx.fillStyle=`rgba(233,200,106,${pa})`;ctx.font='15px Courier New';
    ctx.fillText('P R E S S   S P A C E   T O   R E B U I L D',W/2,H/2+58);
  } else if(!launched){
    const pa=0.5+Math.sin(phase*4)*0.35;
    ctx.save();
    ctx.textAlign='center';
    ctx.fillStyle=`rgba(127,215,255,${pa})`;
    ctx.shadowColor='#7fd7ff';ctx.shadowBlur=12;
    ctx.font='15px Courier New';
    ctx.fillText('P R E S S   S P A C E   T O   L A U N C H',W/2,H-84);
    ctx.restore();
  }
}

function loop(){update();draw();requestAnimationFrame(loop)}
init();
if(new URLSearchParams(location.search).has('playtest')){
  score=3880;lives=4;level=5;launched=true;gameOver=false;phase=3.4;
  paddle.x=W/2-92;paddleW=184;
  balls=[
    {x:W*0.48,y:H*0.58,vx:4.8,vy:-5.6,fire:true,stuck:false},
    {x:W*0.56,y:H*0.44,vx:-3.8,vy:-4.4,fire:false,stuck:false},
    {x:W*0.37,y:H*0.36,vx:3.2,vy:-3.9,fire:false,stuck:false}
  ];
  powerups=[
    {x:W*0.31,y:H*0.62,vy:1.1,...POWERUP_TYPES[0]},
    {x:W*0.66,y:H*0.52,vy:1.25,...POWERUP_TYPES[1]},
    {x:W*0.78,y:H*0.68,vy:1.0,...POWERUP_TYPES[3]}
  ];
  bricks.forEach((br,i)=>{ if(i%4===0)br.hp=Math.max(1,br.hp-2); if(i%7===0)br.hp=1; });
  for(let i=0;i<56;i++){
    const x=W*0.5+Math.cos(i*0.31)*260*Math.random();
    const y=H*0.42+Math.sin(i*0.47)*160*Math.random();
    addParticles(x,y,1,['#7fd7ff','#ec4899','#e9c86a','#5eead4'][i%4]);
  }
  updateHUD();
}
loop();
</script>
