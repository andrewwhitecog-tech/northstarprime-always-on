<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CROWNFALL INTERCEPT : XBLA TOURNAMENT EDITION 2.0</title>
<style>
:root {
  --x-green: #5dc312;
  --x-dark-green: #2a6808;
  --x-silver: #d9dfde;
  --x-dark: #07090d;
  --x-cyan: #2fe6ff;
  --x-gold: #efc76b;
  --x-crimson: #ff2a5f;
  --x-purple: #c084fc;
  --x-text-glow: rgba(93, 195, 18, 0.45);
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body {
  background: radial-gradient(circle at 50% 10%, #151a24 0%, #07090d 65%, #020305 100%);
  color: #fff;
  font-family: "Segoe UI", "Trebuchet MS", Arial, sans-serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* CRT Scanline Overlay */
.crt-overlay {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.03));
  background-size: 100% 3px, 6px 100%;
  pointer-events: none;
  z-index: 999;
  opacity: 0.65;
  transition: opacity 0.3s;
}
.crt-overlay.disabled { opacity: 0; }

/* Top Bar Header */
header {
  height: 56px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 24px;
  background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 100%);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  z-index: 100;
  flex-shrink: 0;
}
.gamertag-badge {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(0, 0, 0, 0.45);
  padding: 5px 16px 5px 8px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.15);
}
.avatar-orb {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, #5dc312, #2a6808);
  border: 2px solid #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 14px; color: #fff;
}
.gamertag-name { font-size: 13px; font-weight: 700; color: #fff; }
.gamerscore { font-size: 12px; color: #5dc312; font-weight: 800; display: flex; align-items: center; gap: 4px; }
.g-icon {
  background: #5dc312; color: #000;
  width: 13px; height: 13px;
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 900;
}

.ring-of-light {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: #111;
  border: 2px solid #333;
  position: relative;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 14px rgba(93, 195, 18, 0.4);
}
.ring-quadrant {
  position: absolute;
  width: 9px; height: 9px;
  background: #5dc312;
  border-radius: 2px;
  box-shadow: 0 0 8px #5dc312;
}
.quadrant-1 { top: 3px; left: 3px; }
.xbox-nexus-x { font-size: 13px; font-weight: 900; color: #fff; opacity: 0.85; z-index: 2; }

.system-status { display: flex; gap: 12px; align-items: center; font-size: 11px; }
.status-pill {
  background: rgba(0, 0, 0, 0.4);
  padding: 4px 12px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.1);
  color: #d9dfde;
}
.status-pill.active {
  background: rgba(93, 195, 18, 0.15);
  border-color: #5dc312;
  color: #5dc312;
  font-weight: 700;
  box-shadow: 0 0 10px rgba(93, 195, 18, 0.3);
}

.crypto-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(47, 230, 255, 0.12);
  border: 1px solid #2fe6ff;
  color: #2fe6ff;
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  text-decoration: none;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: all 0.2s;
}
.crypto-btn:hover { background: rgba(47, 230, 255, 0.25); box-shadow: 0 0 12px rgba(47, 230, 255, 0.4); }

/* Main Arena Viewport */
#arena-viewport {
  position: relative;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  overflow: hidden;
}
canvas#gameCanvas {
  display: block;
  width: min(900px, calc(100vw - 16px));
  height: auto;
  max-height: calc(100vh - 110px);
  aspect-ratio: 9/6.5;
  object-fit: contain;
  touch-action: none;
  border: 2px solid rgba(239, 199, 107, 0.4);
  border-radius: 8px;
  box-shadow: 0 0 35px rgba(122, 38, 180, 0.25), 0 20px 60px #000;
  background: #020108;
}

/* Controller HUD Footer */
footer.ctrl-hud {
  height: 44px;
  background: rgba(6, 9, 12, 0.9);
  backdrop-filter: blur(8px);
  border-top: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 16px;
  font-size: 11px;
  color: #a5f3fc;
  letter-spacing: 1px;
  z-index: 100;
  flex-shrink: 0;
}
.btn-prompt { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
.btn-icon {
  width: 18px; height: 18px;
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 10px; color: #000;
  box-shadow: 0 0 6px rgba(0,0,0,0.5);
}
.btn-a { background: #5dc312; color: #000; }
.btn-b { background: #ff2a5f; color: #fff; }
.btn-x { background: #2fe6ff; color: #000; }
.btn-y { background: #ffe45c; color: #000; }
.btn-trig { background: #333; color: #fff; border: 1px solid #777; border-radius: 4px; padding: 1px 4px; font-size: 9px; }

/* Achievement Toast Notification */
#achievementToast {
  position: fixed;
  bottom: -90px;
  left: 50%;
  transform: translateX(-50%);
  width: 440px;
  height: 68px;
  background: linear-gradient(90deg, #1b2416 0%, #0d120a 100%);
  border: 2px solid #5dc312;
  border-radius: 34px;
  box-shadow: 0 0 25px rgba(93, 195, 18, 0.6), 0 10px 30px rgba(0,0,0,0.8);
  display: flex;
  align-items: center;
  padding: 0 18px;
  gap: 14px;
  z-index: 1000;
  transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  pointer-events: none;
}
#achievementToast.show { bottom: 60px; }
.achieve-orb {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #88ff3b, #2a6808);
  border: 2px solid #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 18px; color: #fff;
  flex-shrink: 0;
  box-shadow: 0 0 10px #5dc312;
}
.achieve-text { display: flex; flex-direction: column; overflow: hidden; }
.achieve-title { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #5dc312; font-weight: 800; }
.achieve-desc { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; text-overflow: ellipsis; }
.achieve-score { margin-left: auto; font-size: 14px; font-weight: 900; color: #5dc312; display: flex; align-items: center; gap: 4px; }
</style>
</head>
<body>

<div id="crtOverlay" class="crt-overlay"></div>

<header>
  <div class="gamertag-badge">
    <div class="avatar-orb">A</div>
    <div class="gamertag-name">ANDRE COG</div>
    <div class="gamerscore"><span class="g-icon">G</span> <span id="gsTally">126,300</span></div>
  </div>

  <div class="ring-of-light">
    <div class="ring-quadrant quadrant-1"></div>
    <div class="xbox-nexus-x">X</div>
  </div>

  <div class="system-status">
    <span id="ctrlStatusBadge" class="status-pill">[KEYBOARD / MOUSE READY]</span>
    <button id="crtToggleBtn" class="status-pill" style="cursor:pointer; background:rgba(255,255,255,0.06);">[CRT: ON]</button>
    <a href="/crypto?game=crownfall-intercept-xbla&pane=arcade-pane" target="_blank" class="crypto-btn">SpaceCash Attest</a>
  </div>
</header>

<div id="arena-viewport">
  <canvas id="gameCanvas" width="900" height="650"></canvas>
</div>

<footer class="ctrl-hud">
  <span class="btn-prompt"><span class="btn-trig">L-STICK</span> TARGET RETICLE</span>
  <span class="btn-prompt"><span class="btn-icon btn-a">A</span> / <span class="btn-trig">RT</span> LAUNCH SIGIL</span>
  <span class="btn-prompt"><span class="btn-icon btn-x">X</span> / <span class="btn-trig">LB</span> CHRONO PARRY</span>
  <span class="btn-prompt"><span class="btn-icon btn-y">Y</span> / <span class="btn-trig">LT</span> STASIS DILATION</span>
  <span class="btn-prompt"><span class="btn-icon btn-b">B</span> / <span class="btn-trig">RB</span> SOLAR RAILGUN</span>
  <span class="btn-prompt"><span class="btn-trig">BACK</span> CRT SHADER</span>
</footer>

<!-- Achievement Toast -->
<div id="achievementToast">
  <div class="achieve-orb">X</div>
  <div class="achieve-text">
    <span class="achieve-title">Achievement Unlocked</span>
    <span id="achieveName" class="achieve-desc">First Intercept</span>
  </div>
  <div class="achieve-score"><span class="g-icon">G</span> <span id="achievePts">10</span></div>
</div>

<script>
// ============================================================================
// CROWNFALL INTERCEPT : XBLA TOURNAMENT EDITION 2.0
// High-Octane Missile Command AI + Gamepad API + Dual-Rumble Haptics
// 200G Achievement Engine + Web Audio 432Hz Synthesizer + Zero Emojis
// ============================================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let baseGamerscore = 126300;
let earnedGamerscore = 0;
const gsTallyEl = document.getElementById('gsTally');
const ctrlStatusBadge = document.getElementById('ctrlStatusBadge');
const crtOverlay = document.getElementById('crtOverlay');
const crtToggleBtn = document.getElementById('crtToggleBtn');

let crtEnabled = true;
crtToggleBtn.addEventListener('click', () => {
  crtEnabled = !crtEnabled;
  crtOverlay.classList.toggle('disabled', !crtEnabled);
  crtToggleBtn.innerText = crtEnabled ? '[CRT: ON]' : '[CRT: OFF]';
});

// --- 200G Achievement Manifest ---
const ACHIEVEMENTS = [
  { id: 'first_intercept', name: 'First Intercept', desc: 'Intercept your first descending orbital verdict.', points: 10, unlocked: false },
  { id: 'chrono_deflection', name: 'Chrono Deflection', desc: 'Deflect a verdict projectile with the Chrono-Parry reflection field.', points: 25, unlocked: false },
  { id: 'time_dilator', name: 'Time Dilator', desc: 'Freeze at least 4 in-flight warheads simultaneously inside the Stasis field.', points: 30, unlocked: false },
  { id: 'sanctum_defender', name: 'Sanctum Defender', desc: 'Clear Cycle 3 with all three sanctum spires fully intact.', points: 35, unlocked: false },
  { id: 'apex_judicator_slain', name: 'Apex Judicator Slain', desc: 'Obliterate the massive Apex Judicator boss in a single run.', points: 40, unlocked: false },
  { id: 'cosmic_aegis', name: 'Cosmic Aegis', desc: 'Achieve a tournament score of 50,000 resonance points.', points: 60, unlocked: false }
];

function loadAchievements() {
  try {
    const saved = localStorage.getItem('xbla_crownfall_intercept_achievements');
    if (saved) {
      const ids = JSON.parse(saved);
      ACHIEVEMENTS.forEach(a => {
        if (ids.includes(a.id)) {
          a.unlocked = true;
          earnedGamerscore += a.points;
        }
      });
      gsTallyEl.innerText = (baseGamerscore + earnedGamerscore).toLocaleString();
    }
  } catch (e) {}
}
loadAchievements();

function saveAchievements() {
  try {
    const unlockedIds = ACHIEVEMENTS.filter(a => a.unlocked).map(a => a.id);
    localStorage.setItem('xbla_crownfall_intercept_achievements', JSON.stringify(unlockedIds));
  } catch (e) {}
}

function unlockAchievement(id) {
  const ach = ACHIEVEMENTS.find(a => a.id === id);
  if (!ach || ach.unlocked) return;
  ach.unlocked = true;
  earnedGamerscore += ach.points;
  gsTallyEl.innerText = (baseGamerscore + earnedGamerscore).toLocaleString();
  saveAchievements();

  // Play authentic achievement chimes (587.33 Hz -> 880 Hz sine glissando)
  playAchievementChime();
  triggerGamepadRumble(120, 0.35, 0.65);
  setTimeout(() => triggerGamepadRumble(120, 0.45, 0.75), 180);

  // Show Toast
  const toast = document.getElementById('achievementToast');
  document.getElementById('achieveName').innerText = ach.name;
  document.getElementById('achievePts').innerText = ach.points;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 4500);
}

// --- Web Audio Synthesizer (Offline-First) ---
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playAchievementChime() {
  initAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  try {
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc1.type = 'sine'; osc2.type = 'triangle';
    osc1.frequency.setValueAtTime(587.33, now); // D5
    osc1.frequency.exponentialRampToValueAtTime(880.00, now + 0.18); // A5
    osc2.frequency.setValueAtTime(880.00, now + 0.18);
    osc2.frequency.exponentialRampToValueAtTime(1174.66, now + 0.45); // D6
    g.gain.setValueAtTime(0.35, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
    osc1.connect(g); osc2.connect(g); g.connect(audioCtx.destination);
    osc1.start(now); osc1.stop(now + 0.22);
    osc2.start(now + 0.18); osc2.stop(now + 0.7);
  } catch (e) {}
}

function playTone(freq, dur, type = 'sine', gain = 0.15, slide = null) {
  initAudio();
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(10, slide), audioCtx.currentTime + dur);
    g.gain.setValueAtTime(gain, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

// Gamepad API & Dual-Rumble Haptics
let gamepadConnected = false;
let prevGpButtons = {};

window.addEventListener('gamepadconnected', () => {
  gamepadConnected = true;
  ctrlStatusBadge.innerText = '[XBOX 360 CONTROLLER ACTIVE]';
  ctrlStatusBadge.classList.add('active');
  triggerGamepadRumble(150, 0.45, 0.25);
});

window.addEventListener('gamepaddisconnected', () => {
  gamepadConnected = false;
  ctrlStatusBadge.innerText = '[KEYBOARD / MOUSE READY]';
  ctrlStatusBadge.classList.remove('active');
});

function triggerGamepadRumble(durationMs, strongMag, weakMag) {
  try {
    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of gamepads) {
      if (gp && gp.vibrationActuator && gp.vibrationActuator.playEffect) {
        gp.vibrationActuator.playEffect('dual-rumble', {
          startDelay: 0,
          duration: durationMs,
          weakMagnitude: weakMag || 0,
          strongMagnitude: strongMag || 0
        }).catch(() => {});
      }
    }
  } catch (e) {}
}

// Visual FX Engine
const FX = { shake: 0, sx: 0, sy: 0, flash: 0, flashCol: '255,255,255' };
function fxShake(m) { FX.shake = Math.max(FX.shake, Math.min(18, m)); }
function fxFlash(a, col) { if (a >= FX.flash) { FX.flash = Math.min(0.6, a); FX.flashCol = col || '255,255,255'; } }
function fxUpdate() {
  if (FX.shake > 0.15) {
    FX.sx = (Math.random() * 2 - 1) * FX.shake;
    FX.sy = (Math.random() * 2 - 1) * FX.shake;
    FX.shake *= 0.86;
  } else {
    FX.shake = 0; FX.sx = 0; FX.sy = 0;
  }
  FX.flash *= 0.85;
  if (FX.flash < 0.012) FX.flash = 0;
}

// Game State Constants & Variables
const STATE = { MENU: 0, PLAY: 1, DEAD: 2 };
let state = STATE.MENU;
let highScore = parseInt(localStorage.getItem('crownfallIntercept_hi')) || 0;

let sanctums = [], wells = [], verdicts = [], counterSigils = [], blooms = [], floatingTexts = [];
let reticle = { x: W / 2, y: H / 2 };
let cycle = 1, resonance = 0, comboCount = 0;
let parryCooldown = 0, parryActive = 0;
let stasisCooldown = 0, stasisActive = 0;
let railgunCooldown = 0;

function addFloatingText(x, y, text, color = '#efc76b', size = 13) {
  floatingTexts.push({ x, y, text, color, size, life: 1.0, vy: -1.1 });
}

function initGame() {
  sanctums = [
    { x: 190, y: 550, alive: true, integrity: 2 },
    { x: 450, y: 550, alive: true, integrity: 2 },
    { x: 710, y: 550, alive: true, integrity: 2 }
  ];
  wells = [
    { x: 190, y: 580, ammo: 12 },
    { x: 450, y: 580, ammo: 12 },
    { x: 710, y: 580, ammo: 12 }
  ];
  verdicts = [];
  counterSigils = [];
  blooms = [];
  floatingTexts = [];
  reticle = { x: W / 2, y: H / 2 };
  cycle = 1;
  resonance = 0;
  comboCount = 0;
  parryCooldown = 0;
  parryActive = 0;
  stasisCooldown = 0;
  stasisActive = 0;
  railgunCooldown = 0;

  spawnWave();
}

function spawnWave() {
  verdicts = [];
  const count = 6 + cycle * 3;
  const speed = 0.75 + cycle * 0.12;

  for (let i = 0; i < count; i++) {
    const aliveIndices = sanctums.map((s, idx) => s.alive ? idx : -1).filter(idx => idx >= 0);
    const targetIdx = aliveIndices.length ? aliveIndices[Math.floor(Math.random() * aliveIndices.length)] : 1;
    const targetX = sanctums[targetIdx].x;
    const sx = 60 + Math.random() * (W - 120);
    const family = i % 3;

    verdicts.push({
      x: sx, y: -40,
      tx: targetX + (Math.random() - 0.5) * 40, ty: 550,
      vx: (targetX - sx) / (550 / speed) * (0.8 + Math.random() * 0.4),
      vy: speed * (0.8 + Math.random() * 0.4),
      family,
      hp: family === 2 ? 2 : 1,
      alive: true
    });
  }

  // Boss on cycle 3
  if (cycle === 3) {
    verdicts.push({
      x: W / 2, y: -70,
      tx: 450, ty: 550,
      vx: 0, vy: 0.38,
      family: 3, // Boss
      hp: 8, maxHp: 8,
      alive: true
    });
    addFloatingText(W / 2, 100, "WARNING: APEX JUDICATOR DETECTED", "#ff2a5f", 18);
    playTone(80, 0.8, 'sawtooth', 0.4, 40);
    fxShake(12);
  }
}

// Mouse Listeners
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  reticle.x = (e.clientX - rect.left) * (W / rect.width);
  reticle.y = (e.clientY - rect.top) * (H / rect.height);
});

canvas.addEventListener('mousedown', e => {
  initAudio();
  if (state === STATE.MENU) { initGame(); state = STATE.PLAY; return; }
  if (state === STATE.DEAD) { state = STATE.MENU; return; }
  if (state === STATE.PLAY && e.button === 0) {
    launchSigil(reticle.x, reticle.y);
  }
});

// Keyboard Listeners
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  initAudio();
  if (['Space', 'KeyX', 'KeyY', 'KeyB', 'KeyC'].includes(e.code)) e.preventDefault();

  if (e.code === 'Space') {
    if (state === STATE.MENU) { initGame(); state = STATE.PLAY; }
    else if (state === STATE.DEAD) { state = STATE.MENU; }
    else if (state === STATE.PLAY) { launchSigil(reticle.x, reticle.y); }
  }
  if (state === STATE.PLAY) {
    if (e.code === 'KeyX' || e.code === 'KeyC') triggerParry();
    if (e.code === 'KeyY') triggerStasis();
    if (e.code === 'KeyB') triggerRailgun();
  }
});
document.addEventListener('keyup', e => keys[e.code] = false);

// Gamepad Polling
function pollGamepad() {
  const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
  if (!gamepads || !gamepads[0]) return;
  const gp = gamepads[0];

  // Left Stick Analog Reticle Movement
  const ax0 = gp.axes[0] || 0;
  const ax1 = gp.axes[1] || 0;
  if (Math.hypot(ax0, ax1) > 0.15) {
    reticle.x += ax0 * 14;
    reticle.y += ax1 * 14;
    reticle.x = Math.max(20, Math.min(W - 20, reticle.x));
    reticle.y = Math.max(20, Math.min(H - 80, reticle.y));
  }

  // Buttons
  const btnA = gp.buttons[0] && gp.buttons[0].pressed;
  const btnB = gp.buttons[1] && gp.buttons[1].pressed;
  const btnX = gp.buttons[2] && gp.buttons[2].pressed;
  const btnY = gp.buttons[3] && gp.buttons[3].pressed;
  const btnLB = gp.buttons[4] && gp.buttons[4].pressed;
  const btnRB = gp.buttons[5] && gp.buttons[5].pressed;
  const btnLT = (gp.buttons[6] && gp.buttons[6].pressed) || (gp.buttons[6] && gp.buttons[6].value > 0.3);
  const btnRT = (gp.buttons[7] && gp.buttons[7].pressed) || (gp.buttons[7] && gp.buttons[7].value > 0.3);
  const btnStart = gp.buttons[9] && gp.buttons[9].pressed;
  const btnBack = gp.buttons[8] && gp.buttons[8].pressed;

  if (btnStart && !prevGpButtons.start) {
    initAudio();
    if (state === STATE.MENU) { initGame(); state = STATE.PLAY; }
    else if (state === STATE.DEAD) { state = STATE.MENU; }
  }

  if (btnBack && !prevGpButtons.back) {
    crtToggleBtn.click();
  }

  if (state === STATE.PLAY) {
    if ((btnRT || btnA) && !prevGpButtons.rt && !prevGpButtons.a) {
      launchSigil(reticle.x, reticle.y);
    }
    if ((btnX || btnLB) && !prevGpButtons.x && !prevGpButtons.lb) {
      triggerParry();
    }
    if ((btnY || btnLT) && !prevGpButtons.y && !prevGpButtons.lt) {
      triggerStasis();
    }
    if ((btnB || btnRB) && !prevGpButtons.b && !prevGpButtons.rb) {
      triggerRailgun();
    }
  }

  prevGpButtons = { a: btnA, b: btnB, x: btnX, y: btnY, lb: btnLB, rb: btnRB, lt: btnLT, rt: btnRT, start: btnStart, back: btnBack };
}

function launchSigil(tx, ty) {
  // Find nearest well with ammo
  let bestWell = null, minDist = Infinity;
  wells.forEach(w => {
    if (w.ammo > 0) {
      const d = Math.abs(w.x - tx);
      if (d < minDist) { minDist = d; bestWell = w; }
    }
  });

  if (!bestWell) return;
  bestWell.ammo--;

  const sx = bestWell.x, sy = bestWell.y;
  const dist = Math.hypot(tx - sx, ty - sy);
  const spd = 14;
  const dur = dist / spd;

  counterSigils.push({
    x: sx, y: sy,
    tx, ty,
    vx: (tx - sx) / dur, vy: (ty - sy) / dur,
    dur: Math.round(dur),
    life: 0
  });

  playTone(650, 0.1, 'sawtooth', 0.12, 180);
  triggerGamepadRumble(40, 0.08, 0.18);
}

function triggerParry() {
  if (parryCooldown > 0) return;
  parryCooldown = 90;
  parryActive = 20;

  playTone(1200, 0.35, 'sine', 0.35, 2400);
  fxFlash(0.3, '47,230,255');
  fxShake(6);
  triggerGamepadRumble(130, 0.45, 0.6);
  unlockAchievement('chrono_deflection');
  addFloatingText(reticle.x, reticle.y - 20, "CHRONO PARRY ACTIVE", "#2fe6ff", 14);
}

function triggerStasis() {
  if (stasisCooldown > 0) return;
  stasisCooldown = 400;
  stasisActive = 120; // 2 seconds of time dilation

  playTone(160, 0.6, 'sine', 0.3, 40);
  fxShake(8);
  triggerGamepadRumble(250, 0.65, 0.4);

  // Check how many warheads frozen
  let frozenCount = 0;
  verdicts.forEach(v => {
    if (v.alive && v.y > 0 && v.y < 500) frozenCount++;
  });
  if (frozenCount >= 4) unlockAchievement('time_dilator');
  addFloatingText(W / 2, H / 2, "STASIS DILATION INITIATED", "#ffe45c", 16);
}

function triggerRailgun() {
  if (railgunCooldown > 0 || resonance < 200) return;
  railgunCooldown = 320;
  resonance -= 150;

  playTone(900, 0.45, 'sawtooth', 0.28, 120);
  fxShake(14);
  fxFlash(0.5, '255,42,95');
  triggerGamepadRumble(280, 0.85, 0.65);

  // Obliterate all verdicts within 70px vertical column of reticle
  verdicts.forEach(v => {
    if (v.alive && Math.abs(v.x - reticle.x) < 70) {
      v.alive = false;
      blooms.push({ x: v.x, y: v.y, r: 8, maxR: 35, life: 30 });
      resonance += 250;
      if (v.family === 3) unlockAchievement('apex_judicator_slain');
    }
  });
}

// Main Simulation Loop
function update() {
  pollGamepad();
  fxUpdate();

  if (state !== STATE.PLAY) return;

  if (parryCooldown > 0) parryCooldown--;
  if (parryActive > 0) parryActive--;
  if (stasisCooldown > 0) stasisCooldown--;
  if (stasisActive > 0) stasisActive--;
  if (railgunCooldown > 0) railgunCooldown--;

  // Update Counter Sigils
  for (let i = counterSigils.length - 1; i >= 0; i--) {
    const s = counterSigils[i];
    s.x += s.vx;
    s.y += s.vy;
    s.life++;

    if (s.life >= s.dur) {
      counterSigils.splice(i, 1);
      // Spawn detonation bloom
      blooms.push({ x: s.tx, y: s.ty, r: 6, maxR: 45, life: 42 });
      playTone(220, 0.2, 'triangle', 0.2, 60);
      fxShake(3);
      triggerGamepadRumble(50, 0.15, 0.2);
    }
  }

  // Update Blooms
  for (let i = blooms.length - 1; i >= 0; i--) {
    const b = blooms[i];
    b.life--;
    b.r += (b.maxR - b.r) * 0.12;

    // Check collision with incoming verdicts
    for (const v of verdicts) {
      if (v.alive && Math.hypot(v.x - b.x, v.y - b.y) < b.r) {
        v.hp--;
        if (v.hp <= 0) {
          v.alive = false;
          resonance += v.family === 3 ? 1000 : 100 * (1 + comboCount * 0.25);
          comboCount++;
          unlockAchievement('first_intercept');
          if (v.family === 3) unlockAchievement('apex_judicator_slain');
          if (score > highScore) { highScore = score; localStorage.setItem('crownfallIntercept_hi', highScore); }
        }
      }
    }

    if (b.life <= 0) blooms.splice(i, 1);
  }

  // Update Verdicts
  const speedFactor = stasisActive > 0 ? 0.25 : 1.0;
  for (const v of verdicts) {
    if (!v.alive) continue;
    v.x += v.vx * speedFactor;
    v.y += v.vy * speedFactor;

    // Check Chrono Parry Field
    if (parryActive > 0 && Math.hypot(v.x - reticle.x, v.y - reticle.y) < 65) {
      v.vy = -Math.abs(v.vy) * 1.5;
      v.vx *= -1;
      unlockAchievement('chrono_deflection');
      addFloatingText(v.x, v.y, "DEFLECTED!", "#2fe6ff", 14);
      triggerGamepadRumble(80, 0.3, 0.5);
    }

    // Impact Sanctum
    if (v.y >= 540) {
      v.alive = false;
      blooms.push({ x: v.x, y: v.y, r: 10, maxR: 60, life: 45 });
      fxShake(14);
      fxFlash(0.4, '255,42,95');
      triggerGamepadRumble(380, 0.85, 0.7);

      // Damage nearest sanctum
      let targetSanctum = null, minDist = Infinity;
      sanctums.forEach(s => {
        if (s.alive) {
          const d = Math.abs(s.x - v.x);
          if (d < minDist) { minDist = d; targetSanctum = s; }
        }
      });
      if (targetSanctum) {
        targetSanctum.integrity--;
        if (targetSanctum.integrity <= 0) targetSanctum.alive = false;
      }
    }
  }

  // Check Game Over
  if (!sanctums.some(s => s.alive)) {
    state = STATE.DEAD;
    playTone(120, 0.6, 'sawtooth', 0.4, 25);
  }

  // Check Wave Clear
  if (!verdicts.some(v => v.alive)) {
    cycle++;
    addFloatingText(W / 2, H / 2, `CYCLE ${cycle} SURVIVED`, "#5dc312", 22);

    if (cycle > 3 && sanctums.every(s => s.alive)) {
      unlockAchievement('sanctum_defender');
    }

    // Refill ammo
    wells.forEach(w => w.ammo = 12 + Math.min(6, cycle));
    spawnWave();
  }

  if (resonance >= 50000) unlockAchievement('cosmic_aegis');
}

// Render Loop
function draw() {
  ctx.save();
  ctx.translate(FX.sx, FX.sy);

  // Background
  ctx.fillStyle = '#020108';
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  for (let i = 0; i < 50; i++) {
    const sx = (i * 137.5) % W;
    const sy = (i * 93.1) % (H - 120);
    ctx.fillRect(sx, sy, 1.5, 1.5);
  }

  if (state === STATE.MENU) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#efc76b';
    ctx.font = 'bold 36px "Segoe UI", sans-serif';
    ctx.fillText("CROWNFALL INTERCEPT : XBLA 2.0", W / 2, H / 2 - 50);

    ctx.fillStyle = '#5dc312';
    ctx.font = '700 16px "Segoe UI", sans-serif';
    ctx.fillText("XBOX 360 LIVE ARCADE TOURNAMENT EDITION", W / 2, H / 2 - 16);

    ctx.fillStyle = '#d9dfde';
    ctx.font = '14px monospace';
    ctx.fillText("PRESS (A) OR [SPACE] TO COMMENCE INTERCEPT", W / 2, H / 2 + 35);
    ctx.fillText("HIGH RESONANCE: " + highScore.toLocaleString(), W / 2, H / 2 + 75);
    ctx.restore();
    return;
  }

  // Draw Sanctums
  for (const s of sanctums) {
    if (s.alive) {
      ctx.fillStyle = s.integrity === 2 ? '#2fe6ff' : '#ffe45c';
      ctx.fillRect(s.x - 22, s.y, 44, 25);
      ctx.beginPath();
      ctx.moveTo(s.x, s.y - 18);
      ctx.lineTo(s.x - 22, s.y);
      ctx.lineTo(s.x + 22, s.y);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillStyle = '#444';
      ctx.fillRect(s.x - 22, s.y + 12, 44, 13);
    }
  }

  // Draw Wells / Ammo
  for (const w of wells) {
    ctx.fillStyle = '#efc76b';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`AMMO: ${w.ammo}`, w.x, w.y + 16);
  }

  // Draw Counter Sigils (In-Flight Interceptors)
  ctx.strokeStyle = '#2fe6ff';
  ctx.lineWidth = 2;
  for (const s of counterSigils) {
    ctx.beginPath();
    ctx.arc(s.x, s.y, 3, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Draw Blooms (Detonations)
  for (const b of blooms) {
    ctx.fillStyle = 'rgba(255, 207, 64, 0.45)';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }

  // Draw Verdicts (Incoming Warheads)
  for (const v of verdicts) {
    if (!v.alive) continue;
    ctx.strokeStyle = v.family === 3 ? '#ff2a5f' : v.family === 2 ? '#efc76b' : '#c084fc';
    ctx.lineWidth = v.family === 3 ? 4 : 2;
    ctx.beginPath();
    ctx.moveTo(v.x, v.y);
    ctx.lineTo(v.x - v.vx * 6, v.y - v.vy * 6);
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(v.x, v.y, v.family === 3 ? 12 : 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw Reticle
  ctx.strokeStyle = parryActive > 0 ? '#2fe6ff' : '#5dc312';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(reticle.x, reticle.y, 16, 0, Math.PI * 2);
  ctx.moveTo(reticle.x - 22, reticle.y); ctx.lineTo(reticle.x + 22, reticle.y);
  ctx.moveTo(reticle.x, reticle.y - 22); ctx.lineTo(reticle.x, reticle.y + 22);
  ctx.stroke();

  // Draw HUD Overlay
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px "Segoe UI", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`RESONANCE: ${Math.round(resonance).toLocaleString()}`, 20, 30);
  ctx.fillText(`CYCLE: ${cycle}`, 20, 52);

  // Floating Texts
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy;
    ft.life -= 0.02;
    ctx.fillStyle = ft.color;
    ctx.globalAlpha = Math.max(0, ft.life);
    ctx.font = `bold ${ft.size}px "Segoe UI", sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.globalAlpha = 1;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }

  // Flash Screen
  if (FX.flash > 0) {
    ctx.fillStyle = `rgba(${FX.flashCol},${FX.flash})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (state === STATE.DEAD) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff2a5f';
    ctx.font = 'bold 38px "Segoe UI", sans-serif';
    ctx.fillText("SANCTUMS FRACTURED", W / 2, H / 2 - 20);
    ctx.fillStyle = '#fff';
    ctx.font = '15px monospace';
    ctx.fillText("PRESS (A) OR [SPACE] TO RETURN TO DOCK", W / 2, H / 2 + 25);
  }

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
