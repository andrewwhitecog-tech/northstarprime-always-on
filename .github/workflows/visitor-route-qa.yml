name: NorthStar visitor route checks
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d3ac1c4d701089602eedac2c83e5d27a32c6bf87
          sparse-checkout: |
            music
            realm
            .github/hq_audio_review
            static/games
            store
            play
            links
            merch
            chromatic
            stickerforge
            parody-drop
            community
            idc-programming
            tools
            tests
            static/front
            static/cards
            warband/art
          persist-credentials: false
      - run: python -m pip -q install playwright beautifulsoup4 pillow pytest requests
      - name: Run native audio lifecycle with its default pinned fixture
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/audio" --no-save --package-lock=false --ignore-scripts playwright@1.55.1
          "$RUNNER_TEMP/audio/node_modules/.bin/playwright" install --with-deps chromium
          export NSP_PLAYWRIGHT_PATH="$RUNNER_TEMP/audio/node_modules/playwright"
          export NSP_HQ_BASELINE="$GITHUB_WORKSPACE/.github/hq_audio_review/fixtures/hq_audio.baseline.js"
          export NSP_HQ_CANDIDATE="$GITHUB_WORKSPACE/static/games/hq_audio.js"
          export NSP_PLAYTEST_OUT="$RUNNER_TEMP/audio-results"
          node .github/hq_audio_review/native-focus.cjs
          xvfb-run -a node .github/hq_audio_review/hq_audio_lifecycle.cjs
      - name: Browser verification
        shell: python
        run: |
          import json,os,pathlib
          r=json.loads(next(p for p in (pathlib.Path(os.environ['RUNNER_TEMP'])/'audio-results').glob('*.json') if 'fixture' in p.read_text() and '"passed"' in p.read_text()).read_text());assert r['passed'];print('AUDIO PASS',r['fixture']['sha256'])
