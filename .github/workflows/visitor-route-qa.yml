name: NorthStar visitor route checks
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9e1a756f72a457bd8d411708bee3f6720766a3df
          sparse-checkout: |
            arcade/custom
          persist-credentials: false
      - run: python -m pip -q install playwright beautifulsoup4 pillow pytest requests

      - name: Browser verification
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import urljoin,urlsplit
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright
          from concurrent.futures import ThreadPoolExecutor
          import requests
          preview=True
          path='arcade/custom/xbla_blades_dashboard_omniverse.html'
          url='https://northstarprime.net/'+path
          html=Path(path).read_bytes() if preview else requests.get(url,timeout=20).content
          s=BeautifulSoup(html,'html.parser')
          games=s.select('.game-card[data-game]'); held=s.select('.game-card[data-unreleased-game]')
          assert len(games)==7 and len(held)==15
          def status(x):
              target=x.get('data-game') or x['data-unreleased-game']
              result=requests.get(urljoin(url,target),timeout=25)
              assert result.status_code==(200 if x.has_attr('data-game') else 404),(target,result.status_code)
          with ThreadPoolExecutor(max_workers=3) as pool:list(pool.map(status,games+held))
          with sync_playwright() as p:
              b=p.chromium.launch(executable_path='/usr/bin/google-chrome',args=['--disable-gpu','--mute-audio'])
              for w in (390,1280):
                  page=b.new_page(viewport={'width':w,'height':840},reduced_motion='reduce')
                  if preview: page.route(url,lambda route:route.fulfill(content_type='text/html',body=html))
                  page.goto(url,wait_until='domcontentloaded')
                  active=page.locator('.game-card[data-game]')
                  col=active.first.evaluate("e=>getComputedStyle(e.parentElement).gridTemplateColumns.split(' ').length")
                  assert col==(1 if w==390 else 2),(w,col)
                  page.keyboard.press('ArrowDown')
                  assert active.nth(col).evaluate("e=>e.classList.contains('focused')")
                  page.keyboard.press('ArrowUp')
                  assert active.first.evaluate("e=>e.classList.contains('focused')")
                  dest=urljoin(url,active.first.get_attribute('data-game'))
                  with page.expect_response(lambda r:r.url==dest) as nav: page.keyboard.press('Enter')
                  assert nav.value.status==200 and page.locator('#game-modal').evaluate("e=>e.classList.contains('active')")
                  page.get_by_role('button',name='EXIT GAME [B]').click()
                  disabled=page.locator('.game-card[aria-disabled="true"]').first
                  disabled.scroll_into_view_if_needed()
                  assert disabled.locator('.launch-badge').inner_text().strip().casefold()=='unavailable'
                  pos=disabled.bounding_box();page.mouse.click(pos['x']+pos['width']/2,pos['y']+pos['height']/2)
                  assert page.locator('#game-frame').get_attribute('src')=='about:blank'
                  print('CATALOG',w,col,'columns, 7 playable URLs, 15 unavailable records, real keyboard launch',flush=True)
                  page.close()
              b.close()
          
