<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="nebulaIris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#8b5cf6"/>
      <stop offset="85%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </radialGradient>

    <linearGradient id="lotusPetal" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="goldEyeRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="astralBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#04060e"/>

  <!-- DIE-CUT VINYL MEDALLION -->
  <g transform="translate(400, 400)" filter="url(#astralBloom)">
    <circle cx="0" cy="0" r="375" fill="#ffffff"/>
    <circle cx="0" cy="0" r="365" fill="#0a0518" stroke="url(#goldEyeRim)" stroke-width="6"/>

    <!-- Sacred Geometry Rays & Golden Spirals -->
    <g stroke="url(#goldEyeRim)" stroke-width="1.2" opacity="0.4" fill="none">
      <circle cx="0" cy="0" r="330"/>
      <circle cx="0" cy="0" r="260"/>
      <polygon points="0,-330 285.8,165 -285.8,165"/>
      <polygon points="0,330 285.8,-165 -285.8,-165"/>
    </g>

    <!-- UNFOLDING SACRED LOTUS PETALS (Base & Halo) -->
    <g transform="translate(0, 70)">
      <!-- Outer Lower Petals -->
      <path d="M 0 140 C -120 140 -220 50 -200 -30 C -150 40 -80 70 0 140 Z" fill="url(#lotusPetal)" opacity="0.7"/>
      <path d="M 0 140 C 120 140 220 50 200 -30 C 150 40 80 70 0 140 Z" fill="url(#lotusPetal)" opacity="0.7"/>
      <!-- Mid Petals -->
      <path d="M 0 140 C -80 130 -150 -10 -120 -80 C -80 -10 -40 60 0 140 Z" fill="url(#lotusPetal)" opacity="0.85"/>
      <path d="M 0 140 C 80 130 150 -10 120 -80 C 80 -10 40 60 0 140 Z" fill="url(#lotusPetal)" opacity="0.85"/>
      <!-- Center Lower Petal -->
      <path d="M 0 140 C -60 110 -60 0 0 -90 C 60 0 60 110 0 140 Z" fill="url(#lotusPetal)"/>
    </g>

    <!-- THE ALL-SEEING COSMIC EYE -->
    <g transform="translate(0, -20)">
      <!-- Sclera (Almond Eye Outline with Gold Trim) -->
      <path d="M -180 0 C -100 -120 100 -120 180 0 C 100 120 -100 120 -180 0 Z" fill="#0f172a" stroke="url(#goldEyeRim)" stroke-width="6"/>
      <path d="M -165 0 C -90 -100 90 -100 165 0 C 90 100 -90 100 -165 0 Z" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>

      <!-- Nebula Iris -->
      <circle cx="0" cy="0" r="80" fill="url(#nebulaIris)" stroke="url(#goldEyeRim)" stroke-width="3"/>
      
      <!-- Deep Cosmic Pupil (Keyhole into the Void) -->
      <circle cx="0" cy="0" r="32" fill="#000000"/>
      <!-- Constellation Stars inside Pupil -->
      <polygon points="0,-18 4,-6 16,-6 6,2 10,14 0,7 -10,14 -6,2 -16,-6 -4,-6" fill="#ffffff"/>

      <!-- Eyelash Starlight Rays (Ascending Beam of Illumination) -->
      <g stroke="url(#goldEyeRim)" stroke-width="2.5" stroke-linecap="round">
        <line x1="0" y1="-120" x2="0" y2="-190"/>
        <line x1="-50" y1="-115" x2="-80" y2="-180"/>
        <line x1="50" y1="-115" x2="80" y2="-180"/>
        <line x1="-100" y1="-90" x2="-150" y2="-150"/>
        <line x1="100" y1="-90" x2="150" y2="-150"/>
        <line x1="-140" y1="-50" x2="-210" y2="-90"/>
        <line x1="140" y1="-50" x2="210" y2="-90"/>
      </g>
    </g>

    <!-- TYPOGRAPHY ARCS -->
    <path id="astralArcTop" d="M -260 0 A 260 260 0 1 1 260 0" fill="none"/>
    <text font-family="'Cinzel', serif" font-weight="900" font-size="22" fill="url(#goldEyeRim)" letter-spacing="6" text-anchor="middle">
      <textPath href="#astralArcTop" startOffset="50%">PSYCHONAUT ASTRAL GUILD</textPath>
    </text>

    <path id="astralArcBottom" d="M 260 0 A 260 260 0 0 1 -260 0" fill="none"/>
    <text font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#38bdf8" letter-spacing="4" text-anchor="middle">
      <textPath href="#astralArcBottom" startOffset="50%">BEYOND THE VEIL • THIRD EYE VISION</textPath>
    </text>
  </g>
</svg>
