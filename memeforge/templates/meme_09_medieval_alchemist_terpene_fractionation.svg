<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Aged Parchment & Engraving Inks -->
    <linearGradient id="parchmentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f1e1"/>
      <stop offset="50%" stop-color="#ede3cd"/>
      <stop offset="100%" stop-color="#ddceb1"/>
    </linearGradient>

    <linearGradient id="goldFire" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="6" y2="6" stroke="#2c1a0e" stroke-width="0.5" opacity="0.25"/>
    </pattern>

    <filter id="woodcutShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-color="#1e1008" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="url(#parchmentBg)"/>
  <rect width="800" height="1000" fill="url(#fineHatch)"/>

  <!-- Ornate Woodcut Triple Border -->
  <rect x="35" y="35" width="730" height="930" fill="none" stroke="#221108" stroke-width="6"/>
  <rect x="44" y="44" width="712" height="912" fill="none" stroke="#221108" stroke-width="1.5"/>
  <rect x="52" y="52" width="696" height="896" fill="none" stroke="#221108" stroke-width="0.75" stroke-dasharray="4,4"/>

  <!-- Corner Rosettes -->
  <g fill="#221108">
    <circle cx="35" cy="35" r="10"/><circle cx="765" cy="35" r="10"/>
    <circle cx="35" cy="965" r="10"/><circle cx="765" cy="965" r="10"/>
  </g>

  <!-- HEADER SECTION -->
  <g transform="translate(400, 105)" text-anchor="middle">
    <text font-family="'Cinzel', 'Georgia', serif" font-weight="900" font-size="28" fill="#221108" letter-spacing="4">PHILOSOPHIA BOTANICA : FRACTIONATIO</text>
    <line x1="-290" y1="16" x2="290" y2="16" stroke="#221108" stroke-width="2"/>
    <text font-family="'Georgia', serif" font-style="italic" font-size="13" fill="#4a2e16" y="36">Anno Domini 1492 • Spagyric Live Rosin Terpene Isolation at 315°F</text>
  </g>

  <!-- MAIN WOODCUT ENGRAVING ILLUSTRATION -->
  <g transform="translate(68, 170)">
    <rect x="0" y="0" width="664" height="640" fill="#fdfaf4" stroke="#221108" stroke-width="3"/>

    <!-- Celestial Ceiling & Alchemical Arch -->
    <path d="M 0 160 Q 332 0 664 160 L 664 0 L 0 0 Z" fill="#221108"/>
    <!-- Constellations in Arch -->
    <g fill="#fdfaf4" stroke="#fdfaf4" stroke-width="0.5">
      <circle cx="120" cy="50" r="3"/><circle cx="180" cy="70" r="2"/><circle cx="250" cy="40" r="4"/><circle cx="332" cy="30" r="5"/>
      <circle cx="414" cy="40" r="4"/><circle cx="484" cy="70" r="2"/><circle cx="544" cy="50" r="3"/>
      <path d="M 332 60 L 334 75 L 342 67 L 332 85 L 322 67 L 330 75 Z" fill="#f59e0b"/>
      <text font-family="'Cinzel', serif" font-size="12" x="180" y="95" fill="#edd6a4">ORBITA TERPENORVM</text>
      <text font-family="'Cinzel', serif" font-size="12" x="484" y="95" fill="#edd6a4">IGNIS VITALIS</text>
    </g>

    <!-- Lab Table & Athanor Furnace -->
    <!-- Stone Furnace Base -->
    <rect x="220" y="470" width="224" height="150" fill="#ded0b6" stroke="#221108" stroke-width="2.5"/>
    <line x1="220" y1="510" x2="444" y2="510" stroke="#221108" stroke-width="1.5"/>
    <line x1="220" y1="550" x2="444" y2="550" stroke="#221108" stroke-width="1.5"/>
    <line x1="220" y1="590" x2="444" y2="590" stroke="#221108" stroke-width="1.5"/>
    <line x1="270" y1="470" x2="270" y2="510" stroke="#221108" stroke-width="1.5"/>
    <line x1="390" y1="470" x2="390" y2="510" stroke="#221108" stroke-width="1.5"/>
    <line x1="330" y1="510" x2="330" y2="550" stroke="#221108" stroke-width="1.5"/>
    <line x1="270" y1="550" x2="270" y2="590" stroke="#221108" stroke-width="1.5"/>
    <line x1="390" y1="550" x2="390" y2="590" stroke="#221108" stroke-width="1.5"/>

    <!-- Furnace Hearth Arch with Fire -->
    <path d="M 280 620 L 280 540 Q 332 505 384 540 L 384 620 Z" fill="#221108" stroke="#221108" stroke-width="2"/>
    <path d="M 295 620 Q 332 520 332 540 Q 332 520 369 620 Z" fill="url(#goldFire)"/>
    <text font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" x="332" y="612" fill="#221108" text-anchor="middle">315°F</text>

    <!-- The Aludel / Retort Distillation Apparatus -->
    <g transform="translate(332, 450)">
      <!-- Boiling Cucurbit Glass Globe -->
      <ellipse cx="0" cy="-35" rx="55" ry="50" fill="#fdf5d6" fill-opacity="0.8" stroke="#221108" stroke-width="3"/>
      <!-- Boiling Live Rosin Liquid inside -->
      <path d="M -50 -25 Q 0 -15 50 -25 L 45 10 Q 0 18 -45 10 Z" fill="#d97706" opacity="0.85"/>
      <circle cx="-20" cy="-10" r="4" fill="#fef08a" stroke="#221108" stroke-width="1"/>
      <circle cx="15" cy="-5" r="5" fill="#fef08a" stroke="#221108" stroke-width="1"/>
      <circle cx="0" cy="-20" r="3" fill="#fef08a" stroke="#221108" stroke-width="1"/>

      <!-- Alembic Hood & Swan Neck Tube -->
      <path d="M -35 -75 Q 0 -110 35 -75 L 25 -35 L -25 -35 Z" fill="#f8fafc" stroke="#221108" stroke-width="2.5"/>
      <path d="M 0 -100 C 60 -160 160 -120 180 -40 L 175 60" fill="none" stroke="#221108" stroke-width="5"/>
      <path d="M 0 -100 C 60 -160 160 -120 180 -40 L 175 60" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>

      <!-- Condenser Worm / Spiral Coil -->
      <g transform="translate(175, 60)">
        <path d="M 0 0 C 30 10 30 25 0 35 C -30 45 -30 60 0 70 C 30 80 30 95 0 105" fill="none" stroke="#221108" stroke-width="3"/>
        <path d="M -20 105 L 20 105 L 25 150 L -25 150 Z" fill="#fef3c7" stroke="#221108" stroke-width="2.5"/>
        <text font-family="'Cinzel', serif" font-size="10" font-weight="bold" x="0" y="135" fill="#221108" text-anchor="middle">ROSIN</text>
      </g>
    </g>

    <!-- Master Alchemist Figure (Left Side) -->
    <g transform="translate(130, 360)">
      <path d="M 0 60 L -45 260 L 65 260 L 25 60 Z" fill="#2d3748" stroke="#221108" stroke-width="3"/>
      <path d="M -10 120 L 10 120 M 0 110 L 0 135" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="0" cy="180" r="10" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
      <ellipse cx="5" cy="40" rx="18" ry="24" fill="#eed9be" stroke="#221108" stroke-width="2"/>
      <path d="M -8 50 Q 8 85 18 55 Q 5 105 -5 65 Z" fill="#f1f5f9" stroke="#221108" stroke-width="1.5"/>
      <circle cx="16" cy="38" r="2" fill="#221108"/>
      <path d="M 18 35 L 25 43 L 18 46" fill="none" stroke="#221108" stroke-width="1.5"/>
      <polygon points="-18,22 18,12 8,-45" fill="#1a202c" stroke="#221108" stroke-width="2.5"/>
      <ellipse cx="2" cy="18" rx="28" ry="7" fill="#1a202c" stroke="#221108" stroke-width="2"/>
      <path d="M 5 -15 Q 12 -12 8 -5 Q 15 -8 12 -18 Z" fill="#fef08a"/>
      <path d="M 15 80 Q 65 65 105 50" fill="none" stroke="#221108" stroke-width="4"/>
      <polygon points="105,48 125,40 115,55" fill="#f59e0b" stroke="#221108" stroke-width="1.5"/>
    </g>

    <!-- Four Terpene Fraction Vials on Right Shelf -->
    <g transform="translate(560, 260)">
      <rect x="-40" y="0" width="130" height="12" fill="#8d4925" stroke="#221108" stroke-width="2"/>
      <rect x="-40" y="120" width="130" height="12" fill="#8d4925" stroke="#221108" stroke-width="2"/>

      <!-- Top Row: Limonene & Myrcene -->
      <g transform="translate(-15, -45)">
        <rect x="0" y="0" width="22" height="42" rx="4" fill="#fef08a" stroke="#221108" stroke-width="1.5"/>
        <text font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" x="11" y="24" fill="#221108" text-anchor="middle">LIM</text>
        <text font-family="'Cinzel', serif" font-size="7" x="11" y="34" fill="#b45309" text-anchor="middle">FIRE 176°C</text>
      </g>
      <g transform="translate(35, -45)">
        <rect x="0" y="0" width="22" height="42" rx="4" fill="#a7f3d0" stroke="#221108" stroke-width="1.5"/>
        <text font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" x="11" y="24" fill="#221108" text-anchor="middle">MYR</text>
        <text font-family="'Cinzel', serif" font-size="7" x="11" y="34" fill="#047857" text-anchor="middle">EARTH 168°C</text>
      </g>

      <!-- Bottom Row: Pinene & Caryophyllene -->
      <g transform="translate(-15, 75)">
        <rect x="0" y="0" width="22" height="42" rx="4" fill="#bae6fd" stroke="#221108" stroke-width="1.5"/>
        <text font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" x="11" y="24" fill="#221108" text-anchor="middle">PIN</text>
        <text font-family="'Cinzel', serif" font-size="7" x="11" y="34" fill="#0369a1" text-anchor="middle">AIR 156°C</text>
      </g>
      <g transform="translate(35, 75)">
        <rect x="0" y="0" width="22" height="42" rx="4" fill="#fbcfe8" stroke="#221108" stroke-width="1.5"/>
        <text font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" x="11" y="24" fill="#221108" text-anchor="middle">CAR</text>
        <text font-family="'Cinzel', serif" font-size="7" x="11" y="34" fill="#be185d" text-anchor="middle">CB2 119°C</text>
      </g>
    </g>

    <!-- Familiars: Alchemical Raven & Herb Bundle -->
    <g transform="translate(560, 480)">
      <path d="M 10 20 Q 25 0 45 15 Q 60 30 50 55 Q 35 60 25 50 Q 15 55 10 40 Z" fill="#221108"/>
      <polygon points="50,22 65,24 53,30" fill="#f59e0b"/>
      <circle cx="43" cy="18" r="2" fill="#ffffff"/>
      <line x1="-10" y1="52" x2="70" y2="52" stroke="#4a2e16" stroke-width="3"/>
      <path d="M -2 55 L -10 95 L -2 92 L 6 95 L 0 55 Z" fill="#047857" stroke="#221108" stroke-width="1.5"/>
      <text font-family="'Georgia', serif" font-style="italic" font-size="9" x="25" y="70" fill="#4a2e16">Corvus Vorath</text>
    </g>
  </g>

  <!-- BOTTOM PARCHMENT SCROLL / MEME CAPTION -->
  <g transform="translate(400, 850)">
    <path d="M -340 -20 L -310 -40 L 310 -40 L 340 -20 L 310 35 L -310 35 Z" fill="#221108" filter="url(#woodcutShadow)"/>
    <path d="M -330 -16 L -305 -34 L 305 -34 L 330 -16 L 305 30 L -305 30 Z" fill="#fbf7ec" stroke="#221108" stroke-width="1.5"/>
    <text font-family="'Cinzel', 'Georgia', serif" font-weight="900" font-size="15" fill="#221108" text-anchor="middle" y="-6">
      "WHEN THE SPAGYRIC FRACTION HITS 315°F AND THE CELESTIAL
    </text>
    <text font-family="'Cinzel', 'Georgia', serif" font-weight="900" font-size="15" fill="#221108" text-anchor="middle" y="16">
      ESSENCE TRANSMUTES INTO PURE SOLVENTLESS MONOTERPENES"
    </text>
  </g>

  <!-- SUBFOOTER METRICS & LORE -->
  <g transform="translate(400, 930)" text-anchor="middle">
    <text font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#4a2e16" letter-spacing="2">
      CDC DISPENSARY • INTERDIMENSIONAL APOTHECARY • 10015 SW HALL BLVD
    </text>
    <text font-family="'Georgia', serif" font-style="italic" font-size="10" fill="#78350f" y="18">
      Distillatio Spagyrica • Zero Solvent Pressing • Pure Oregon Terpene Alchemy
    </text>
  </g>
</svg>
