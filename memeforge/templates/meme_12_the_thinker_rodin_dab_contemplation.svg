<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Museum Spotlight Gradient -->
    <radialGradient id="museumSpotlight" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2a2e39"/>
      <stop offset="45%" stop-color="#181a20"/>
      <stop offset="85%" stop-color="#0c0d10"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>

    <!-- Patina Bronze Statue Gradients -->
    <linearGradient id="bronzePatina" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="25%" stop-color="#4d7c0f"/>
      <stop offset="55%" stop-color="#b45309"/>
      <stop offset="80%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>

    <linearGradient id="marblePedestal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="titaniumRainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="30%" stop-color="#a855f7"/>
      <stop offset="65%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <filter id="quartzHeatGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f97316" flood-opacity="0.9"/>
    </filter>

    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ef4444" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Museum Wall / Canvas Base -->
  <rect width="800" height="1000" fill="url(#museumSpotlight)"/>
  <rect x="25" y="25" width="750" height="950" fill="none" stroke="#b45309" stroke-width="2" opacity="0.5"/>
  <rect x="35" y="35" width="730" height="930" fill="none" stroke="#181a20" stroke-width="4"/>

  <!-- HEADER -->
  <g transform="translate(400, 85)" text-anchor="middle">
    <text font-family="'Cinzel', serif" font-weight="900" font-size="24" fill="#fef08a" letter-spacing="4">
      MUSEE D'APOTHECARY • LE PENSEUR DU CONNOISSEUR
    </text>
    <line x1="-280" y1="14" x2="280" y2="14" stroke="#b45309" stroke-width="2"/>
    <text font-family="'Inter', sans-serif" font-style="italic" font-size="12" fill="#94a3b8" y="32">
      Auguste Rodin (c. 1904, Re-calibrated for Oregon Live Rosin)
    </text>
  </g>

  <!-- MAIN SCENE: THE STATUE ON PEDESTAL -->
  <g transform="translate(80, 140)">
    <!-- Marble Gallery Floor -->
    <path d="M 0 540 L 640 540 L 640 660 L 0 660 Z" fill="#1e293b"/>
    <!-- Floor Grid Lines / Perspective -->
    <line x1="120" y1="540" x2="40" y2="660" stroke="#0f172a" stroke-width="2"/>
    <line x1="320" y1="540" x2="320" y2="660" stroke="#0f172a" stroke-width="2"/>
    <line x1="520" y1="540" x2="600" y2="660" stroke="#0f172a" stroke-width="2"/>

    <!-- Left Marble Pedestal (The Thinker) -->
    <g transform="translate(60, 360)">
      <!-- Main Plinth Block -->
      <rect x="0" y="50" width="260" height="150" fill="url(#marblePedestal)" stroke="#64748b" stroke-width="2"/>
      <!-- Molding Base & Top -->
      <rect x="-10" y="40" width="280" height="15" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
      <rect x="-15" y="195" width="290" height="15" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
      <!-- Museum Inscription Plaque on Pedestal -->
      <rect x="45" y="85" width="170" height="75" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="3"/>
      <text font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="#fbbf24" x="130" y="112" text-anchor="middle">LE PENSEUR</text>
      <text font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" x="130" y="130" text-anchor="middle">SOLVENTLESS ESSAY</text>
      <text font-family="'Cinzel', serif" font-size="8" fill="#f59e0b" x="130" y="146" text-anchor="middle">NSP APOTHECARY</text>
    </g>

    <!-- Right Marble Pedestal (The Recycler Dab Rig) -->
    <g transform="translate(420, 390)">
      <rect x="0" y="60" width="160" height="110" fill="url(#marblePedestal)" stroke="#64748b" stroke-width="2"/>
      <rect x="-8" y="50" width="176" height="15" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
      <rect x="-12" y="165" width="184" height="15" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    </g>

    <!-- ARTISANAL BOROSILICATE DAB RIG ON RIGHT PEDESTAL -->
    <g transform="translate(500, 310)">
      <!-- Glass Rig Base & Water Reservoir -->
      <ellipse cx="0" cy="120" rx="35" ry="12" fill="#38bdf8" fill-opacity="0.3" stroke="#94a3b8" stroke-width="2"/>
      <path d="M -30 120 L -22 60 Q -20 20 0 15 Q 20 20 22 60 L 30 120 Z" fill="#38bdf8" fill-opacity="0.25" stroke="#cbd5e1" stroke-width="2"/>
      <!-- Recycler Drain Tube -->
      <path d="M -22 80 C -45 80 -45 30 -15 35" fill="none" stroke="#bae6fd" stroke-width="4"/>
      <!-- Bent Neck Mouthpiece -->
      <path d="M 0 15 Q -10 -40 25 -70" fill="none" stroke="#bae6fd" stroke-width="5"/>
      
      <!-- Quartz Banger Joint & Bucket -->
      <path d="M 20 50 L 50 50 L 50 20" fill="none" stroke="#94a3b8" stroke-width="4"/>
      <!-- Quartz Bucket with Heat Glow -->
      <rect x="42" y="-15" width="22" height="35" rx="3" fill="#fef08a" fill-opacity="0.4" stroke="#fbbf24" stroke-width="2" filter="url(#quartzHeatGlow)"/>
      <ellipse cx="53" cy="-15" rx="11" ry="5" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>

      <!-- Digital Temp Laser Sight hitting the quartz banger -->
      <line x1="-80" y1="-80" x2="53" y2="-5" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" filter="url(#laserGlow)"/>
      <circle cx="53" cy="-5" r="4" fill="#ef4444" filter="url(#laserGlow)"/>

      <!-- Digital Temp Gun Floating Display -->
      <g transform="translate(-100, -100)">
        <rect x="-50" y="-18" width="100" height="36" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
        <text font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#ef4444" x="0" y="4" text-anchor="middle">481.4°F</text>
      </g>
    </g>

    <!-- THE THINKER (RODIN) STATUE FIGURE (Center-Left) -->
    <g transform="translate(140, 110)">
      <!-- Shadow of statue -->
      <ellipse cx="60" cy="290" rx="80" ry="18" fill="#020617" opacity="0.6"/>

      <!-- Rock Outcrop Seat -->
      <path d="M -10 260 Q 40 230 110 250 L 130 290 L -25 290 Z" fill="#44403c" stroke="#292524" stroke-width="2"/>

      <!-- Muscular Folded Torso & Back -->
      <!-- Back & Spine -->
      <path d="M 20 120 Q 50 70 80 120 Q 100 170 85 240 L 40 240 Z" fill="url(#bronzePatina)" stroke="#1c1917" stroke-width="3"/>
      <!-- Shoulder & Arm resting on knee -->
      <!-- Right Arm (Bent down, elbow resting on left thigh, hand supporting chin) -->
      <path d="M 75 110 Q 120 140 100 210 Q 80 230 65 170" fill="none" stroke="url(#bronzePatina)" stroke-width="20" stroke-linecap="round"/>
      <path d="M 75 110 Q 120 140 100 210 Q 80 230 65 170" fill="none" stroke="#1c1917" stroke-width="2"/>

      <!-- Hand Under Chin -->
      <circle cx="58" cy="165" r="12" fill="#78350f" stroke="#1c1917" stroke-width="1.5"/>

      <!-- Head Bowed Forward in Contemplation -->
      <ellipse cx="62" cy="135" rx="20" ry="24" fill="url(#bronzePatina)" stroke="#1c1917" stroke-width="2"/>
      <!-- Curly Bronze Hair Texture -->
      <circle cx="55" cy="120" r="8" fill="#4d7c0f"/>
      <circle cx="70" cy="120" r="8" fill="#4d7c0f"/>
      <circle cx="62" cy="115" r="9" fill="#78350f"/>

      <!-- Legs & Knee Position -->
      <path d="M 40 230 Q 80 220 110 225 L 120 280 L 85 285 Z" fill="url(#bronzePatina)" stroke="#1c1917" stroke-width="2.5"/>
      <path d="M 20 240 Q 50 250 65 290 L 40 290 Z" fill="url(#bronzePatina)" stroke="#1c1917" stroke-width="2.5"/>

      <!-- Left Hand (Resting on Right Knee, Holding Titanium Dab Tool) -->
      <!-- Left Arm -->
      <path d="M 30 130 Q 10 180 35 230" fill="none" stroke="url(#bronzePatina)" stroke-width="16" stroke-linecap="round"/>
      <path d="M 30 130 Q 10 180 35 230" fill="none" stroke="#1c1917" stroke-width="2"/>

      <!-- Rainbow Anodized Titanium Dab Tool in Hand -->
      <g transform="translate(45, 220)">
        <line x1="-35" y1="25" x2="160" y2="-20" stroke="url(#titaniumRainbow)" stroke-width="4.5" stroke-linecap="round"/>
        <!-- Scoop / Shovel Tip at end pointing toward rig -->
        <polygon points="160,-20 175,-25 170,-15" fill="#fbbf24" stroke="#78350f" stroke-width="1"/>

        <!-- Massive Faceted Live Rosin Terp Diamond loaded on tool -->
        <polygon points="168,-22 178,-35 186,-25 180,-12 172,-15" fill="#fef08a" stroke="#d97706" stroke-width="1.5" filter="url(#quartzHeatGlow)"/>
        <text font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#fde047" x="195" y="-22">1.2g DIAMOND</text>
      </g>
    </g>

    <!-- Floating Molecular Formulas & Contemplation Clouds -->
    <g fill="#94a3b8" opacity="0.65" font-family="'JetBrains Mono', monospace" font-size="10">
      <text x="180" y="60">Δ9-THCA + 480°F → Δ9-THC + CO2</text>
      <text x="400" y="90">C10H16 (β-Myrcene)</text>
      <text x="350" y="130">C15H24 (β-Caryophyllene)</text>
      <!-- Subtle Swirling Vapor Paths -->
      <path d="M 550 290 Q 520 220 480 180 T 400 120" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.4"/>
    </g>
  </g>

  <!-- BOTTOM CAPTION BOX -->
  <g transform="translate(400, 835)" text-anchor="middle">
    <rect x="-355" y="-22" width="710" height="75" fill="#0f172a" stroke="#f59e0b" stroke-width="2" rx="8"/>
    <text font-family="'Cinzel', serif" font-weight="900" font-size="16" fill="#ffffff" letter-spacing="1.5" y="8">
      "HE HAS BEEN SITTING LIKE THIS FOR 45 MINUTES WAITING
    </text>
    <text font-family="'Cinzel', serif" font-weight="900" font-size="16" fill="#f59e0b" letter-spacing="1.5" y="34">
      FOR THE BANGER TO COOL DOWN TO EXACTLY 480°F"
    </text>
  </g>

  <!-- SUBFOOTER METRICS & CREDENTIALS -->
  <g transform="translate(400, 930)" text-anchor="middle">
    <text font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#cbd5e1" letter-spacing="2">
      PHILOSOPHY OF THE LOW-TEMP CONNOISSEUR • NSP APOTHECARY • Cascadia Solarium
    </text>
    <text font-family="'Inter', sans-serif" font-size="10" fill="#64748b" y="18">
      Dedicated to Patience, Flavor Retention, and Spagyric Solventless Live Rosin
    </text>
  </g>
</svg>
