<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Aged Botanical Lithograph Parchment -->
    <linearGradient id="lithoParchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f0dd"/>
      <stop offset="50%" stop-color="#ece2c6"/>
      <stop offset="100%" stop-color="#dfd2af"/>
    </linearGradient>

    <!-- Trichome Glandular Amber Resins -->
    <radialGradient id="glandularHead" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>

    <pattern id="lithoHatch" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="6" y2="6" stroke="#2a1a0c" stroke-width="0.5" opacity="0.25"/>
    </pattern>

    <filter id="inkDepth">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-color="#1a0f07" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Lithograph Base -->
  <rect width="800" height="1000" fill="url(#lithoParchment)"/>
  <rect width="800" height="1000" fill="url(#lithoHatch)"/>

  <!-- Antique Double Border with Corner Florets -->
  <rect x="35" y="35" width="730" height="930" fill="none" stroke="#221108" stroke-width="5"/>
  <rect x="44" y="44" width="712" height="912" fill="none" stroke="#221108" stroke-width="1.5"/>
  <rect x="52" y="52" width="696" height="896" fill="none" stroke="#221108" stroke-width="0.75" stroke-dasharray="3,3"/>

  <!-- Corner Florets -->
  <g fill="#221108">
    <circle cx="35" cy="35" r="9"/><circle cx="765" cy="35" r="9"/>
    <circle cx="35" cy="965" r="9"/><circle cx="765" cy="965" r="9"/>
  </g>

  <!-- HEADER: ROYAL BOTANICAL SOCIETY LITHOGRAPH TITLE -->
  <g transform="translate(400, 105)" text-anchor="middle">
    <text font-family="'Cinzel', 'Georgia', serif" font-weight="900" font-size="27" fill="#221108" letter-spacing="4">
      HERBARIUM BOTANICUM : DE ANATOMIA TRICHOMATIS
    </text>
    <line x1="-310" y1="16" x2="310" y2="16" stroke="#221108" stroke-width="2"/>
    <text font-family="'Georgia', serif" font-style="italic" font-size="13" fill="#4a2e16" y="36">
      Tabula XLII • Capitate-Stalked Glandular Resin Morphology Under 800x Optical Focus
    </text>
  </g>

  <!-- MAIN BOTANICAL ILLUSTRATION FRAME -->
  <g transform="translate(68, 170)">
    <rect x="0" y="0" width="664" height="640" fill="#fcf8ed" stroke="#221108" stroke-width="3"/>

    <!-- Archival Reference Grid & Dimension Lines -->
    <g stroke="#221108" stroke-width="0.75" stroke-dasharray="2,4" opacity="0.4">
      <line x1="40" y1="0" x2="40" y2="640"/>
      <line x1="624" y1="0" x2="624" y2="640"/>
      <line x1="0" y1="320" x2="664" y2="320"/>
      <circle cx="332" cy="260" r="230" fill="none"/>
    </g>

    <!-- CENTERPIECE: ULTRA-MAGNIFIED CAPITATE-STALKED TRICHOME -->
    <g transform="translate(332, 280)">
      <!-- Calyx Epidermal Base / Plant Tissue Layer -->
      <path d="M -180 240 Q 0 210 180 240 L 180 280 L -180 280 Z" fill="#d1fae5" stroke="#065f46" stroke-width="2.5"/>
      <!-- Epidermal Pavement Cells (Hexagonal tissue grid) -->
      <g stroke="#047857" stroke-width="1.2" fill="none" opacity="0.6">
        <polygon points="-160,250 -140,245 -130,260 -150,270"/>
        <polygon points="-120,248 -100,243 -90,258 -110,268"/>
        <polygon points="-80,245 -60,242 -50,256 -70,266"/>
        <polygon points="60,245 80,242 90,256 70,266"/>
        <polygon points="100,248 120,243 130,258 110,268"/>
        <polygon points="140,250 160,245 170,260 150,270"/>
      </g>

      <!-- Trichome Multicellular Stalk (Ascending Cylinder) -->
      <!-- Stalk Body with Cell Walls -->
      <path d="M -38 230 C -45 150 -55 50 -48 -20 L 48 -20 C 55 50 45 150 38 230 Z" fill="#ecfdf5" stroke="#065f46" stroke-width="3"/>
      <!-- Translucent Internal Vascular Strands -->
      <line x1="-15" y1="230" x2="-20" y2="-20" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3"/>
      <line x1="15" y1="230" x2="20" y2="-20" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3"/>
      <!-- Horizontal Cell Wall Septa -->
      <line x1="-40" y1="180" x2="40" y2="180" stroke="#047857" stroke-width="1.5"/>
      <line x1="-44" y1="120" x2="44" y2="120" stroke="#047857" stroke-width="1.5"/>
      <line x1="-48" y1="50" x2="48" y2="50" stroke="#047857" stroke-width="1.5"/>

      <!-- Basal Disk / Secretory Cell Layer (Disk of 8-16 cells supporting gland head) -->
      <ellipse cx="0" cy="-22" rx="55" ry="16" fill="#10b981" stroke="#064e3b" stroke-width="2"/>
      <g stroke="#064e3b" stroke-width="1">
        <line x1="-40" y1="-22" x2="-40" y2="-12"/>
        <line x1="-20" y1="-22" x2="-20" y2="-10"/>
        <line x1="0" y1="-22" x2="0" y2="-8"/>
        <line x1="20" y1="-22" x2="20" y2="-10"/>
        <line x1="40" y1="-22" x2="40" y2="-12"/>
      </g>

      <!-- Sub-Cuticular Abscission Zone (Where trichome snaps during ice-water hash wash) -->
      <ellipse cx="0" cy="-35" rx="68" ry="14" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4,4"/>
      <text font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#ea580c" x="110" y="-32">ABSCISSION ZONE (73μ-120μ BREAK)</text>
      <line x1="68" y1="-35" x2="105" y2="-35" stroke="#ea580c" stroke-width="1.2"/>

      <!-- THE GLANDULAR TRICHOME HEAD (70-120 Micron Resin Sphere) -->
      <circle cx="0" cy="-140" r="115" fill="url(#glandularHead)" stroke="#221108" stroke-width="4" filter="url(#inkDepth)"/>

      <!-- Outer Cuticle Membrane Ring -->
      <circle cx="0" cy="-140" r="105" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="6,4" opacity="0.8"/>

      <!-- Secretory Cavity with Swirling Terpene Monomers -->
      <g stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.85">
        <path d="M -60 -150 Q -20 -190 30 -160 T 70 -120"/>
        <path d="M -40 -110 Q 10 -150 50 -100"/>
        <circle cx="-35" cy="-170" r="14" fill="#ffffff" fill-opacity="0.3"/>
        <circle cx="45" cy="-130" r="18" fill="#ffffff" fill-opacity="0.35"/>
        <circle cx="0" cy="-80" r="12" fill="#ffffff" fill-opacity="0.25"/>
      </g>

      <!-- Optical Light Reflection Highlight (Curved Crescent) -->
      <path d="M -65 -200 A 90 90 0 0 1 10 -230" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>

    <!-- ANATOMICAL CALLOUT LABELS & ARROWS (Antique Engraving Style) -->
    <g font-family="'Georgia', serif" font-size="11" fill="#221108">
      <!-- Callout I: Cuticle Membrane -->
      <text x="50" y="70" font-weight="bold">I. MEMBRANA CVTICVLA</text>
      <text x="50" y="85" font-style="italic" font-size="9.5" fill="#5c3818">Sub-cuticular pocket holding volatile monoterpenes</text>
      <line x1="165" y1="95" x2="245" y2="120" stroke="#221108" stroke-width="1.2"/>
      <circle cx="245" cy="120" r="2.5" fill="#221108"/>

      <!-- Callout II: Secretory Vesicles -->
      <text x="50" y="150" font-weight="bold">II. CAVITAS SECRETORIA</text>
      <text x="50" y="165" font-style="italic" font-size="9.5" fill="#5c3818">Site of THCA &amp; β-Myrcene enzymatic synthesis</text>
      <line x1="165" y1="175" x2="260" y2="175" stroke="#221108" stroke-width="1.2"/>
      <circle cx="260" cy="175" r="2.5" fill="#221108"/>

      <!-- Callout III: Basal Cells -->
      <text x="50" y="270" font-weight="bold">III. CELLVLAE BASALES</text>
      <text x="50" y="285" font-style="italic" font-size="9.5" fill="#5c3818">16-cell disk nutrient transport barrier</text>
      <line x1="165" y1="280" x2="280" y2="265" stroke="#221108" stroke-width="1.2"/>
      <circle cx="280" cy="265" r="2.5" fill="#221108"/>

      <!-- Right Callout IV: Stalk Epidermis -->
      <text x="470" y="380" font-weight="bold">IV. STIPES CELLVLARIS</text>
      <text x="470" y="395" font-style="italic" font-size="9.5" fill="#5c3818">Multicellular photosynthetic stem (150μ)</text>
      <line x1="465" y1="385" x2="380" y2="395" stroke="#221108" stroke-width="1.2"/>
      <circle cx="380" cy="395" r="2.5" fill="#221108"/>
    </g>

    <!-- Micron Scale Bar in Bottom Right Corner -->
    <g transform="translate(500, 580)">
      <rect x="0" y="0" width="130" height="30" fill="#f5ecd8" stroke="#221108" stroke-width="1"/>
      <line x1="15" y1="15" x2="115" y2="15" stroke="#221108" stroke-width="2"/>
      <line x1="15" y1="8" x2="15" y2="22" stroke="#221108" stroke-width="2"/>
      <line x1="115" y1="8" x2="115" y2="22" stroke="#221108" stroke-width="2"/>
      <line x1="65" y1="11" x2="65" y2="19" stroke="#221108" stroke-width="1.5"/>
      <text font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" x="65" y="26" text-anchor="middle">100 MICRONS</text>
    </g>
  </g>

  <!-- MEME BANNER & SCROLL CAPTION -->
  <g transform="translate(400, 850)">
    <path d="M -345 -20 L -315 -40 L 315 -40 L 345 -20 L 315 35 L -315 35 Z" fill="#221108" filter="url(#inkDepth)"/>
    <path d="M -335 -16 L -310 -34 L 310 -34 L 335 -16 L 310 30 L -310 30 Z" fill="#fdfbf5" stroke="#221108" stroke-width="1.5"/>
    <text font-family="'Cinzel', 'Georgia', serif" font-weight="900" font-size="15" fill="#221108" text-anchor="middle" y="-6">
      "WHEN YOUR BUDTENDER HAS A MASTER'S IN ETHNOBOTANY AND TALKS FOR"
    </text>
    <text font-family="'Cinzel', 'Georgia', serif" font-weight="900" font-size="15" fill="#221108" text-anchor="middle" y="16">
      40 MINUTES ABOUT CAPITATE-STALKED RESIN GLAND MORPHOLOGY"
    </text>
  </g>

  <!-- SUBFOOTER METRICS & CREDENTIALS -->
  <g transform="translate(400, 930)" text-anchor="middle">
    <text font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#4a2e16" letter-spacing="2">
      NSP APOTHECARY • SOLVENTLESS TERPENE LABORATORY • Cascadia Solarium Corridor
    </text>
    <text font-family="'Georgia', serif" font-style="italic" font-size="10" fill="#78350f" y="18">
      Phytocannabinoid Science • 73u-120u First-Wash Extraction Standards • Cascadia, Oregon
    </text>
  </g>
</svg>
