name: Storefront conversion audit
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        width: [390, 1280]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      WIDTH: ${{ matrix.width }}
    steps:
      - run: python -m pip -q install playwright requests beautifulsoup4
      - shell: python
        run: |
          import os,json,time
          from urllib.parse import urlsplit,urlencode
          from playwright.sync_api import sync_playwright
          urls=["https://andrewcog.gumroad.com/l/acid-voxel-halloween-45-pack","https://andrewcog.gumroad.com/l/alsjes","https://andrewcog.gumroad.com/l/ancestor-light","https://andrewcog.gumroad.com/l/anodized-empires-and-anomalies-collector-vault","https://andrewcog.gumroad.com/l/audeok","https://andrewcog.gumroad.com/l/beholders-harvest","https://andrewcog.gumroad.com/l/bioluminescent-oregon-proof-book","https://andrewcog.gumroad.com/l/cascade-yule","https://andrewcog.gumroad.com/l/cbffq","https://andrewcog.gumroad.com/l/chrysalis-metamorphosis-proof-book","https://andrewcog.gumroad.com/l/cihqdr","https://andrewcog.gumroad.com/l/comedy-sticker-mega-bundle-144","https://andrewcog.gumroad.com/l/comedy-sticker-vault-vol1","https://andrewcog.gumroad.com/l/comedy-sticker-vault-vol2","https://andrewcog.gumroad.com/l/comedy-sticker-vault-vol3","https://andrewcog.gumroad.com/l/comedy-sticker-vault-vol4","https://andrewcog.gumroad.com/l/crimson-haze-worldwide-pack","https://andrewcog.gumroad.com/l/doonjn","https://andrewcog.gumroad.com/l/ehzznt","https://andrewcog.gumroad.com/l/feathered-forms-proof-book","https://andrewcog.gumroad.com/l/fsltx","https://andrewcog.gumroad.com/l/fspybs","https://andrewcog.gumroad.com/l/fztoe","https://andrewcog.gumroad.com/l/hfpzxt","https://andrewcog.gumroad.com/l/ispvpe","https://andrewcog.gumroad.com/l/lineage-of-light-advent","https://andrewcog.gumroad.com/l/llkspo","https://andrewcog.gumroad.com/l/mnjog","https://andrewcog.gumroad.com/l/northstar-12pack-watertight-stl-vault","https://andrewcog.gumroad.com/l/northstar-2026-free-mega-sampler","https://andrewcog.gumroad.com/l/northstar-2027-collector-wall-calendar-pdf","https://andrewcog.gumroad.com/l/northstar-7icon-parody-vault","https://andrewcog.gumroad.com/l/northstar-calendar-2027","https://andrewcog.gumroad.com/l/northstar-godot4-6game-core-bundle","https://andrewcog.gumroad.com/l/northstar-godot4-9game-clean-vault","https://andrewcog.gumroad.com/l/northstar-idg-5game-html5-webgl-arcade-pack","https://andrewcog.gumroad.com/l/ouklmz","https://andrewcog.gumroad.com/l/pshjy","https://andrewcog.gumroad.com/l/qbqoqz","https://andrewcog.gumroad.com/l/rajmfn","https://andrewcog.gumroad.com/l/rich-yn-swamp-dynasty-pack","https://andrewcog.gumroad.com/l/rich-yn-vol3-vol4-300dpi-vault","https://andrewcog.gumroad.com/l/rich-yn-y2k-primetime-pack","https://andrewcog.gumroad.com/l/sefgfx","https://andrewcog.gumroad.com/l/structural-color-proof-book","https://andrewcog.gumroad.com/l/uncle-vorath-blazin-beaver-issue-01","https://andrewcog.gumroad.com/l/vdquzp","https://andrewcog.gumroad.com/l/vorath-chromatic-print-canon-sampler12","https://andrewcog.gumroad.com/l/vorath-codex-collector-compendium","https://andrewcog.gumroad.com/l/vorath-colorized-print-canon-proof-pack","https://andrewcog.gumroad.com/l/vorath-santa-4k-wallpaper-suite","https://andrewcog.gumroad.com/l/vorath-twelve-plate-sampler","https://andrewcog.gumroad.com/l/vorathic-sacred-geometry-coloring-book","https://andrewcog.gumroad.com/l/xnvde"]
          width=int(os.environ['WIDTH'])
          totals={}
          with sync_playwright() as pw:
              browser=pw.chromium.launch(executable_path='/usr/bin/google-chrome',args=['--disable-gpu'])
              ctx=browser.new_context(java_script_enabled=False,viewport={'width':width,'height':844},is_mobile=width==390)
              page=ctx.new_page()
              def documents(r):
                  u=urlsplit(r.request.url)
                  official=(u.hostname=='andrewcog.gumroad.com' and u.path.startswith('/l/')) or (u.hostname=='gumroad.com' and u.path=='/checkout')
                  if u.scheme=='https' and r.request.method=='GET' and r.request.resource_type=='document' and official:r.continue_()
                  else:r.abort()
              ctx.route('**/*',documents)
              for path in urls:
                  try:
                      ctx.clear_cookies()
                      resp=page.goto(path,wait_until='domcontentloaded',timeout=20000)
                      assert resp.status==200,('listing HTTP',resp.status)
                      pr=json.loads(page.locator('[data-page]').get_attribute('data-page',timeout=2500))['props']['product']
                      assert pr['is_published'] and not pr['is_compliance_blocked']
                      url='https://gumroad.com/checkout?'+urlencode({'product':pr['permalink'],'quantity':1})
                      resp=page.goto(url,wait_until='domcontentloaded',timeout=20000)
                      assert resp.status==200,('checkout HTTP',resp.status)
                      d=json.loads(page.locator('[data-page]').get_attribute('data-page',timeout=2500))
                      assert d['component']=='Checkout/Show'
                      items=d['props']['checkout']['add_products']
                      assert len(items)==1,('item count',len(items))
                      item=items[0]
                      assert item['quantity']==1 and item['product']['permalink']==pr['permalink'] and item['product']['name']==pr['name'] and item['product']['price_cents']==pr['price_cents'], 'checkout item mismatch'
                      outcome='one matching product'
                  except Exception as e:outcome=str(e).splitlines()[0][:160]
                  print('CART_PRODUCT',path,outcome,flush=True)
                  totals[outcome]=totals.get(outcome,0)+1
                  time.sleep(0.45)
              print('CART_TOTAL',width,totals,flush=True)
              browser.close()
              assert totals=={'one matching product':len(urls)},totals
