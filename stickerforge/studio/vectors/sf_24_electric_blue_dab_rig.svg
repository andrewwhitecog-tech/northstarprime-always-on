<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="electricCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="electricPlasma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="amberDrop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="rigGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00f0ff" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#02040a"/>

  <!-- DIE-CUT CIRCULAR CONTAINER -->
  <g transform="translate(400, 400)" filter="url(#rigGlow)">
    <!-- White Die-Cut Base -->
    <circle cx="0" cy="0" r="375" fill="#ffffff"/>
    <circle cx="0" cy="0" r="365" fill="none" stroke="url(#electricPlasma)" stroke-width="5"/>
    <circle cx="0" cy="0" r="352" fill="url(#electricCore)" stroke="#1e3a8a" stroke-width="2"/>

    <!-- Concentric Neon Ripple Rings -->
    <circle cx="0" cy="0" r="330" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4,8" opacity="0.7"/>
    <circle cx="0" cy="0" r="315" fill="none" stroke="#3b82f6" stroke-width="2"/>

    <!-- Borosilicate Heady Dab Rig Glasswork -->
    <!-- Heavy Beaker Pedestal Foot -->
    <path d="M -110 200 L 110 200 C 90 180 70 150 45 120 L -45 120 C -70 150 -90 180 -110 200 Z" fill="#1e293b" stroke="#00f0ff" stroke-width="3" opacity="0.85"/>
    <!-- Recycler Vortex Water Reservoir Chamber -->
    <circle cx="0" cy="50" r="85" fill="#0f172a" stroke="#00f0ff" stroke-width="3.5" opacity="0.9"/>
    <!-- Internal Water Bubbles & Churning Vortex -->
    <path d="M -50 70 Q 0 10 50 70 Q 0 90 -50 70" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="-25" cy="40" r="6" fill="#38bdf8" opacity="0.8"/>
    <circle cx="30" cy="65" r="8" fill="#38bdf8" opacity="0.7"/>
    <circle cx="5" cy="30" r="4" fill="#ffffff"/>

    <!-- Twin External Borosilicate Recycler Arms (Curved Loops) -->
    <!-- Left Loop -->
    <path d="M -45 120 C -120 100 -140 0 -70 -20 C -40 -30 -10 -20 0 0" fill="none" stroke="url(#electricPlasma)" stroke-width="6"/>
    <path d="M -45 120 C -120 100 -140 0 -70 -20 C -40 -30 -10 -20 0 0" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <!-- Right Loop -->
    <path d="M 45 120 C 120 100 140 0 70 -20 C 40 -30 10 -20 0 0" fill="none" stroke="url(#electricPlasma)" stroke-width="6"/>
    <path d="M 45 120 C 120 100 140 0 70 -20 C 40 -30 10 -20 0 0" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

    <!-- Neck & Mouthpiece Tube (Angled Backwards) -->
    <path d="M 0 -30 C 0 -80 -40 -120 -80 -160 L -65 -175 C -25 -135 15 -90 15 -30 Z" fill="#1e293b" stroke="#00f0ff" stroke-width="3"/>
    <!-- Flared Mouthpiece Collar -->
    <ellipse cx="-72" cy="-168" rx="20" ry="10" fill="url(#electricPlasma)" stroke="#ffffff" stroke-width="2" transform="rotate(45, -72, -168)"/>

    <!-- 14mm Ground Joint & Quartz Banger -->
    <!-- Joint Arm Extending Right -->
    <path d="M 30 20 L 100 20 L 100 -20" fill="none" stroke="#00f0ff" stroke-width="7"/>
    <!-- Quartz Banger Bucket -->
    <rect x="80" y="-80" width="40" height="50" rx="6" fill="#f8fafc" stroke="#38bdf8" stroke-width="2.5" opacity="0.85"/>
    <ellipse cx="100" cy="-80" rx="20" ry="8" fill="#e2e8f0" stroke="#38bdf8" stroke-width="2"/>
    <!-- Golden Live Rosin Vapor Cloud rising from Banger -->
    <path d="M 100 -85 C 80 -120 130 -150 110 -190 C 90 -160 70 -130 90 -95" fill="none" stroke="url(#amberDrop)" stroke-width="4"/>
    <!-- Terp Pearl Droplet inside Banger -->
    <circle cx="100" cy="-45" r="7" fill="url(#amberDrop)"/>

    <!-- Opal Marble Encasement on Back of Reservoir -->
    <circle cx="-55" cy="20" r="14" fill="#ffffff" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="-55" cy="20" r="8" fill="url(#electricPlasma)"/>

    <!-- Lightning / Electric Arc Accents -->
    <path d="M -160 -80 L -130 -60 L -140 -40 L -110 -10" stroke="#00f0ff" stroke-width="2" fill="none"/>
    <path d="M 150 110 L 180 130 L 170 150 L 200 170" stroke="#00f0ff" stroke-width="2" fill="none"/>

    <!-- Typographic Arc Texts -->
    <text x="0" y="-235" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="bold" fill="#00f0ff" text-anchor="middle" letter-spacing="5">PACIFIC HEADY GLASSBLOWERS</text>
    <text x="0" y="-212" font-family="'Montserrat', sans-serif" font-size="10" font-weight="bold" fill="#93c5fd" text-anchor="middle" letter-spacing="4">COLD SNOWMELT RECYCLER • LOCAL 420</text>

    <text x="0" y="240" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">10015 SW HALL BLVD</text>
    <text x="0" y="262" font-family="'Montserrat', sans-serif" font-size="10" font-weight="bold" fill="#00f0ff" text-anchor="middle" letter-spacing="5">SOLVENTLESS RITUAL • TIGARD OR</text>
  </g>
</svg>