<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="neonSynth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <linearGradient id="chromeShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="gridHorizon" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00f0ff" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff007f" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#05050d"/>

  <!-- DIE-CUT VINYL SKULL BADGE -->
  <g transform="translate(400, 400)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="375" fill="#ffffff"/>
    <circle cx="0" cy="0" r="365" fill="#000000" stroke="url(#neonSynth)" stroke-width="8"/>

    <!-- Retro 3D Perspective Synthwave Grid in Lower Half -->
    <g stroke="#ff007f" stroke-width="1.5" opacity="0.6">
      <ellipse cx="0" cy="180" rx="340" ry="120" fill="url(#gridHorizon)" opacity="0.3"/>
      <!-- Perspective Grid Lines -->
      <line x1="-340" y1="200" x2="340" y2="200"/>
      <line x1="-310" y1="240" x2="310" y2="240"/>
      <line x1="-260" y1="280" x2="260" y2="280"/>
      <line x1="-190" y1="320" x2="190" y2="320"/>
      <!-- Radial Lines to vanishing point -->
      <line x1="0" y1="160" x2="-350" y2="320"/>
      <line x1="0" y1="160" x2="-210" y2="340"/>
      <line x1="0" y1="160" x2="-70" y2="350"/>
      <line x1="0" y1="160" x2="70" y2="350"/>
      <line x1="0" y1="160" x2="210" y2="340"/>
      <line x1="0" y1="160" x2="350" y2="320"/>
    </g>

    <!-- Wireframe Neon Sun behind skull -->
    <circle cx="0" cy="-60" r="160" fill="none" stroke="#ff007f" stroke-width="3"/>
    <line x1="-160" y1="-60" x2="160" y2="-60" stroke="#ff007f" stroke-width="3"/>
    <line x1="-150" y1="-20" x2="150" y2="-20" stroke="#ff007f" stroke-width="3"/>
    <line x1="-130" y1="20" x2="130" y2="20" stroke="#ff007f" stroke-width="3"/>

    <!-- LOW-POLY CHROME SKULL -->
    <g transform="translate(0, -30)">
      <!-- Cranium Facets -->
      <polygon points="0,-160 -80,-120 -130,-40 0,-70" fill="url(#chromeShine)" stroke="#00f0ff" stroke-width="2"/>
      <polygon points="0,-160 80,-120 130,-40 0,-70" fill="url(#chromeShine)" stroke="#00f0ff" stroke-width="2"/>
      <polygon points="-130,-40 -120,40 -60,20 0,-70" fill="#334155" stroke="#00f0ff" stroke-width="2"/>
      <polygon points="130,-40 120,40 60,20 0,-70" fill="#334155" stroke="#00f0ff" stroke-width="2"/>
      
      <!-- Forehead Center Facet -->
      <polygon points="0,-160 -40,-90 0,-70 40,-90" fill="#f8fafc" stroke="#00f0ff" stroke-width="2"/>

      <!-- Angular Eye Sockets (Glowing Neon Pink Interior) -->
      <!-- Left Eye -->
      <polygon points="-85,-20 -25,-25 -35,25 -75,20" fill="#ff007f" stroke="#ffffff" stroke-width="2"/>
      <polygon points="-75,-10 -35,-15 -45,15 -68,12" fill="#000000"/>
      <circle cx="-55" cy="0" r="5" fill="#00f0ff"/>

      <!-- Right Eye -->
      <polygon points="85,-20 25,-25 35,25 75,20" fill="#ff007f" stroke="#ffffff" stroke-width="2"/>
      <polygon points="75,-10 35,-15 45,15 68,12" fill="#000000"/>
      <circle cx="55" cy="0" r="5" fill="#00f0ff"/>

      <!-- Inverted Triangle Nasal Cavity -->
      <polygon points="0,5 -18,40 18,40" fill="#ff007f" stroke="#000000" stroke-width="2"/>

      <!-- Zygomatic Arches / Cheekbones -->
      <polygon points="-120,40 -70,55 -55,95 -100,80" fill="url(#chromeShine)" stroke="#00f0ff" stroke-width="2"/>
      <polygon points="120,40 70,55 55,95 100,80" fill="url(#chromeShine)" stroke="#00f0ff" stroke-width="2"/>

      <!-- Upper Maxilla & Teeth Row -->
      <rect x="-45" y="70" width="90" height="25" fill="#0f172a" stroke="#00f0ff" stroke-width="2"/>
      <!-- Individual Chrome Teeth -->
      <line x1="-30" y1="70" x2="-30" y2="95" stroke="#00f0ff" stroke-width="2"/>
      <line x1="-15" y1="70" x2="-15" y2="95" stroke="#00f0ff" stroke-width="2"/>
      <line x1="0" y1="70" x2="0" y2="95" stroke="#00f0ff" stroke-width="2"/>
      <line x1="15" y1="70" x2="15" y2="95" stroke="#00f0ff" stroke-width="2"/>
      <line x1="30" y1="70" x2="30" y2="95" stroke="#00f0ff" stroke-width="2"/>

      <!-- Lower Mandible (Jaw) -->
      <polygon points="-40,110 -25,145 25,145 40,110" fill="url(#chromeShine)" stroke="#00f0ff" stroke-width="2"/>
      <line x1="-20" y1="110" x2="-15" y2="135" stroke="#00f0ff" stroke-width="2"/>
      <line x1="0" y1="110" x2="0" y2="138" stroke="#00f0ff" stroke-width="2"/>
      <line x1="20" y1="110" x2="15" y2="135" stroke="#00f0ff" stroke-width="2"/>

      <!-- Cybernetic Neon Joint / Laser Spliff -->
      <g transform="translate(18, 92) rotate(12)">
        <rect x="0" y="0" width="75" height="12" rx="3" fill="#ffffff" stroke="#ff007f" stroke-width="2"/>
        <rect x="0" y="0" width="18" height="12" rx="2" fill="#00f0ff"/>
        <!-- Emitting Cyber Cherry & Laser Smoke -->
        <circle cx="75" cy="6" r="8" fill="#ff007f"/>
        <circle cx="75" cy="6" r="4" fill="#00f0ff"/>
        <path d="M 80 6 C 105 -15 90 -45 120 -60 C 145 -75 130 -105 160 -120" fill="none" stroke="url(#neonSynth)" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>

    <!-- CYBERPUNK 90s TYPOGRAPHY -->
    <path id="cyberArcTop" d="M -270 0 A 270 270 0 1 1 270 0" fill="none"/>
    <text font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#00f0ff" letter-spacing="6" text-anchor="middle">
      <textPath href="#cyberArcTop" startOffset="50%">CYBERFORGE • 1999</textPath>
    </text>

    <text x="0" y="325" font-family="'Courier New', monospace" font-weight="900" font-size="16" fill="#ff007f" letter-spacing="4" text-anchor="middle">SYSTEM OVERRIDE // 420.EXE</text>
  </g>
</svg>
