<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <!-- Left Rainy Grey Gradient -->
    <linearGradient id="pdxRainBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Right Solarium Golden Emerald Gradient -->
    <linearGradient id="solariumParadiseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Rain Pattern -->
    <pattern id="rainDropPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="10" y1="0" x2="5" y2="15" stroke="#94a3b8" stroke-width="1.2" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1000" height="700" fill="#090d16"/>

  <!-- TOP HEADER -->
  <g transform="translate(500, 65)">
    <rect x="-440" y="-30" width="880" height="60" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <text font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="2" y="10">SEASONAL AFFECTIVE DISORDER HAS MET ITS MAKER</text>
  </g>

  <!-- SPLIT SCREEN PANELS -->

  <!-- LEFT PANEL: OUTSIDE OREGON REALITY (Grey Drizzle) -->
  <g transform="translate(40, 120)">
    <rect x="0" y="0" width="440" height="480" rx="12" fill="url(#pdxRainBg)" stroke="#475569" stroke-width="3"/>
    <rect x="0" y="0" width="440" height="480" rx="12" fill="url(#rainDropPattern)"/>

    <!-- Left Header -->
    <rect x="0" y="0" width="440" height="50" rx="10" fill="#1e293b"/>
    <text x="220" y="32" font-family="'Impact', sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle" letter-spacing="1">OUTSIDE (SW HALL BLVD)</text>

    <!-- Depressed Shivering Figure in Raincoat -->
    <g transform="translate(220, 220)">
      <!-- Cloud pouring rain directly on head -->
      <path d="M -70 -70 C -90 -70 -100 -50 -80 -40 C -100 -20 -70 0 -50 -10 C -30 10 10 10 30 -10 C 50 10 80 -10 60 -40 C 80 -50 70 -70 50 -70 Z" fill="#64748b"/>
      <line x1="-30" y1="-5" x2="-40" y2="35" stroke="#38bdf8" stroke-width="2"/>
      <line x1="0" y1="0" x2="-10" y2="40" stroke="#38bdf8" stroke-width="2"/>
      <line x1="30" y1="-5" x2="20" y2="35" stroke="#38bdf8" stroke-width="2"/>

      <!-- Sad Face in Soggy Hoodie -->
      <circle cx="0" cy="70" r="32" fill="#fde047"/>
      <path d="M -35 45 C -45 10 -20 20 0 20 C 20 20 45 10 35 45 L 30 110 L -30 110 Z" fill="#334155" opacity="0.6"/>
      <!-- Frowning Eyes & Mouth -->
      <line x1="-12" y1="62" x2="-4" y2="66" stroke="#000000" stroke-width="2.5"/>
      <line x1="12" y1="62" x2="4" y2="66" stroke="#000000" stroke-width="2.5"/>
      <path d="M -10 84 Q 0 74 10 84" fill="none" stroke="#000000" stroke-width="2.5"/>
      
      <!-- Soggy Wet Socks Note -->
      <rect x="-140" y="140" width="280" height="70" rx="8" fill="#0f172a" stroke="#ef4444"/>
      <text x="0" y="165" font-family="'Courier New', monospace" font-weight="900" font-size="12" fill="#f87171" text-anchor="middle">• 43°F Relentless Drizzle</text>
      <text x="0" y="182" font-family="'Courier New', monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">• Moss growing on side mirrors</text>
      <text x="0" y="198" font-family="'Courier New', monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">• 0.00% Sunlight detected</text>
    </g>
  </g>

  <!-- RIGHT PANEL: THE TWILIGHT SOLARIUM (Boutique Sanctuary) -->
  <g transform="translate(520, 120)">
    <rect x="0" y="0" width="440" height="480" rx="12" fill="url(#solariumParadiseBg)" stroke="#10b981" stroke-width="3"/>

    <!-- Right Header -->
    <rect x="0" y="0" width="440" height="50" rx="10" fill="#065f46"/>
    <text x="220" y="32" font-family="'Impact', sans-serif" font-size="22" fill="#fef08a" text-anchor="middle" letter-spacing="1">INSIDE THE TWILIGHT SOLARIUM</text>

    <!-- Transcended Smiling Figure under Starlight & Living Wall -->
    <g transform="translate(220, 220)">
      <!-- Golden Starlight Halo -->
      <circle cx="0" cy="65" r="70" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4"/>
      <!-- Radiating Starlight Beams -->
      <polygon points="0,0 8,30 35,35 12,45 15,75 0,55 -15,75 -12,45 -35,35 -8,30" fill="#fef08a"/>

      <!-- Living Wall Fern Backdrop -->
      <path d="M -120 40 Q -80 0 -50 30 Q -20 0 10 30 Q 50 0 80 40" fill="none" stroke="#34d399" stroke-width="4"/>

      <!-- Transcended Glowing Face -->
      <circle cx="0" cy="70" r="32" fill="#fed41d" stroke="#d97706" stroke-width="2"/>
      <!-- High Closed Smiling Eyes -->
      <path d="M -16 64 Q -10 56 -4 64" fill="none" stroke="#000000" stroke-width="2.5"/>
      <path d="M 4 64 Q 10 56 16 64" fill="none" stroke="#000000" stroke-width="2.5"/>
      <path d="M -12 76 Q 0 88 12 76" fill="none" stroke="#000000" stroke-width="2.5"/>

      <!-- Holding Rosin Pod -->
      <rect x="25" y="65" width="10" height="30" rx="3" fill="#fbbf24" stroke="#000000"/>
      <path d="M 30 65 Q 40 40 30 20" fill="none" stroke="#c084fc" stroke-width="2"/>

      <!-- Solarium Perks Box -->
      <rect x="-140" y="140" width="280" height="70" rx="8" fill="#0f172a" stroke="#10b981"/>
      <text x="0" y="165" font-family="'Courier New', monospace" font-weight="900" font-size="12" fill="#34d399" text-anchor="middle">• 72°F Biophilic Living Wall</text>
      <text x="0" y="182" font-family="'Courier New', monospace" font-size="11" fill="#fde047" text-anchor="middle">• 432Hz Sub-bass Soundbath</text>
      <text x="0" y="198" font-family="'Courier New', monospace" font-size="11" fill="#38bdf8" text-anchor="middle">• Cosmic Guava Live Rosin 90u</text>
    </g>
  </g>

  <!-- BOTTOM MEME SUMMARY -->
  <g transform="translate(500, 645)">
    <text font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="20" fill="#fbbf24" text-anchor="middle" letter-spacing="3">
      10015 SW HALL BLVD • WHERE OREGON WINTER GOES TO DIE
    </text>
  </g>
</svg>
