name: NorthStar visitor route checks
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b40c0e4d5fe7f8fdbf4222ebc2e00246d94ad492
          sparse-checkout: |
            music
            realm
            .github/hq_audio_review
            static/games
            store
            play
            links
            merch
            chromatic
            stickerforge
            parody-drop
            community
            idc-programming
            tools
            tests
            static/front
            static/cards
            warband/art
          persist-credentials: false
      - run: python -m pip -q install playwright beautifulsoup4 pillow pytest requests

      - name: Browser verification
        shell: python
        run: |
          import ssl,socket
          from playwright.sync_api import sync_playwright
          for host in ['andywhiteconstruction.com','www.andywhiteconstruction.com']:
              try:
                  with socket.create_connection((host,443),timeout=12) as sock:
                      with ssl.create_default_context().wrap_socket(sock,server_hostname=host) as tls:
                          names=[s for t,s in tls.getpeercert().get('subjectAltName',[]) if t=='DNS']
                          print('TLS',host,'verified',names,flush=True)
              except ssl.SSLCertVerificationError as e:print('TLS',host,'failed',e.verify_message,flush=True)
          with sync_playwright() as p:
              b=p.chromium.launch(executable_path='/usr/bin/google-chrome',args=['--disable-gpu'])
              page=b.new_page()
              r=page.goto('https://www.etsy.com/shop/UncleVorath420',wait_until='domcontentloaded',timeout=30000)
              print('ETSY',r.status,page.url,page.title(),flush=True)
              b.close()
