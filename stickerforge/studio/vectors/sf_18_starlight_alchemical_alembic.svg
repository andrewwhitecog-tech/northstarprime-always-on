<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Alchemical Copper & Liquid Gold Gradients -->
    <radialGradient id="alembicDarkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1017"/>
      <stop offset="60%" stop-color="#12090e"/>
      <stop offset="100%" stop-color="#050204"/>
    </radialGradient>

    <linearGradient id="hammeredCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="30%" stop-color="#ea580c"/>
      <stop offset="65%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <linearGradient id="liquidGoldDew" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="prismaticVapor" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="30%" stop-color="#00f0ff"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="alchemicalBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#040103"/>

  <!-- DIE-CUT STICKER CONTAINER -->
  <g transform="translate(400, 400)" filter="url(#alchemicalBloom)">
    <!-- White Die-Cut Bleed Border -->
    <circle cx="0" cy="0" r="375" fill="#ffffff"/>
    <circle cx="0" cy="0" r="365" fill="none" stroke="url(#hammeredCopper)" stroke-width="6"/>
    <circle cx="0" cy="0" r="352" fill="url(#alembicDarkBg)" stroke="#f59e0b" stroke-width="3"/>

    <!-- Concentric Celestial Coordinate Rings -->
    <circle cx="0" cy="0" r="330" fill="none" stroke="#7c2d12" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.6"/>
    <circle cx="0" cy="0" r="280" fill="none" stroke="#ea580c" stroke-width="1" stroke-dasharray="8,8" opacity="0.4"/>
    <circle cx="0" cy="0" r="210" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="12,6" opacity="0.5"/>

    <!-- Sacred Alchemical Cross & Planetary Glyphs in Background -->
    <g stroke="#f59e0b" stroke-width="1" fill="none" opacity="0.45">
      <line x1="-280" y1="0" x2="280" y2="0"/>
      <line x1="0" y1="-280" x2="0" y2="280"/>
      <!-- Sun symbol -->
      <circle cx="-160" cy="-160" r="16"/>
      <circle cx="-160" cy="-160" r="3" fill="#f59e0b"/>
      <!-- Moon crescent -->
      <path d="M 160 -176 A 16 16 0 0 0 176 -160 A 16 16 0 1 1 160 -176" fill="#f59e0b"/>
      <!-- Mercury Hermetic Staff -->
      <circle cx="-160" cy="160" r="10"/>
      <line x1="-160" y1="170" x2="-160" y2="190"/>
      <line x1="-168" y1="180" x2="-152" y2="180"/>
      <!-- Spagyric Salt Glyph (Circle split horizontally) -->
      <circle cx="160" cy="160" r="12"/>
      <line x1="148" y1="160" x2="172" y2="160"/>
    </g>

    <!-- THE COPPER ALEMBIC RETORT APPARATUS -->
    <g transform="translate(0, 30)">
      <!-- Athanor Flame Stand under Cucurbit -->
      <path d="M -80 180 L -60 120 L 60 120 L 80 180 Z" fill="#2d130a" stroke="#7c2d12" stroke-width="2"/>
      <path d="M -40 180 Q 0 130 40 180 Z" fill="#ea580c" opacity="0.7"/>
      <path d="M -20 180 Q 0 140 20 180 Z" fill="#fef08a"/>

      <!-- Lower Cucurbit Boiler Globe (Translucent Borosilicate Glass) -->
      <ellipse cx="0" cy="60" rx="95" ry="85" fill="#1e1014" stroke="url(#hammeredCopper)" stroke-width="4"/>
      
      <!-- Boiling Live Rosin Trichome Nectar inside -->
      <path d="M -85 70 C -40 120 40 120 85 70 C 80 125 40 140 0 140 C -40 140 -80 125 -85 70 Z" fill="url(#liquidGoldDew)"/>
      <!-- Boiling Trichome Bubbles -->
      <circle cx="-40" cy="85" r="8" fill="#ffffff" opacity="0.8"/>
      <circle cx="-10" cy="105" r="10" fill="#ffffff" opacity="0.7"/>
      <circle cx="35" cy="80" r="7" fill="#ffffff" opacity="0.8"/>
      <circle cx="15" cy="65" r="5" fill="#ffffff" opacity="0.9"/>
      <circle cx="-25" cy="60" r="6" fill="#ffffff" opacity="0.8"/>

      <!-- Hammered Copper Alembic Cap / Helmet (The Moor's Head) -->
      <path d="M -80 -10 C -110 -70 -70 -130 0 -150 C 70 -130 110 -70 80 -10 L 70 5 L -70 5 Z" fill="url(#hammeredCopper)" stroke="#7c2d12" stroke-width="3.5"/>
      <!-- Embossed Filigree on Copper Helmet -->
      <ellipse cx="0" cy="-60" rx="45" ry="25" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="4,4"/>
      <circle cx="0" cy="-60" r="14" fill="#7c2d12" stroke="#f59e0b" stroke-width="1.5"/>
      <polygon points="0,-70 5,-60 12,-60 6,-54 8,-48 0,-52 -8,-48 -6,-54 -12,-60 -5,-60" fill="#fef08a"/>

      <!-- Rising Trichome Vapor ascending into Swan Neck -->
      <path d="M 0 -10 Q 0 -90 0 -150" fill="none" stroke="url(#prismaticVapor)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
      <path d="M 0 -10 Q 0 -90 0 -150" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

      <!-- Swan Neck Condenser Delivery Tube (Curving Right to Downward) -->
      <path d="M 0 -150 C 60 -190 170 -160 190 -80 C 200 -20 190 40 190 80" fill="none" stroke="url(#hammeredCopper)" stroke-width="12" stroke-linecap="round"/>
      <path d="M 0 -150 C 60 -190 170 -160 190 -80 C 200 -20 190 40 190 80" fill="none" stroke="#fde047" stroke-width="3" stroke-dasharray="5,5"/>

      <!-- Crystal Condenser Tube & Spiral Coil -->
      <g transform="translate(190, 80)">
        <!-- Spiral Glass Condenser Worm -->
        <path d="M 0 0 C 25 10 25 25 0 35 C -25 45 -25 60 0 70 C 25 80 25 95 0 105" fill="none" stroke="#00f0ff" stroke-width="4" opacity="0.7"/>

        <!-- Alchemical Receiving Phial / Crystal Tear Drop Vessel -->
        <path d="M -25 110 L 25 110 L 30 150 Q 0 195 -30 150 Z" fill="#00f0ff" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2.5"/>
        <!-- Golden Condensed Terpene Dew Essence inside Phial -->
        <path d="M -20 135 Q 0 130 20 135 L 25 150 Q 0 190 -25 150 Z" fill="url(#liquidGoldDew)"/>

        <!-- Glowing Falling Terpene Droplet -->
        <ellipse cx="0" cy="100" rx="4" ry="7" fill="#ffffff" filter="url(#alchemicalBloom)"/>
      </g>
    </g>

    <!-- Radiating Starlight Dew Drops around the Retort -->
    <g fill="#fef08a" stroke="#ffffff" stroke-width="0.5">
      <circle cx="-130" cy="-50" r="3.5"/><circle cx="-180" cy="-20" r="4.5"/>
      <circle cx="-150" cy="30" r="3"/><circle cx="-210" cy="60" r="4"/>
      <circle cx="100" cy="-140" r="3.5"/><circle cx="140" cy="-110" r="4"/>
    </g>

    <!-- CIRCULAR BORDER TYPOGRAPHY -->
    <path id="alembicTextTop" d="M -310 0 A 310 310 0 1 1 310 0" fill="none"/>
    <path id="alembicTextBottom" d="M 310 0 A 310 310 0 1 1 -310 0" fill="none"/>

    <text font-family="'Cinzel', serif" font-weight="900" font-size="16.5" fill="url(#hammeredCopper)" letter-spacing="4">
      <textPath href="#alembicTextTop" startOffset="50%" text-anchor="middle">
        STARLIGHT ALCHEMICAL ALEMBIC • SPAGYRIC PURITY
      </textPath>
    </text>

    <text font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#f59e0b" letter-spacing="3">
      <textPath href="#alembicTextBottom" startOffset="50%" text-anchor="middle">
        LIVE ROSIN DISTILLATION • 10015 SW HALL BLVD
      </textPath>
    </text>

    <!-- Flank Copper Rivet Pips -->
    <circle cx="-315" cy="0" r="6" fill="#ea580c" stroke="#fef08a" stroke-width="1.5"/>
    <circle cx="315" cy="0" r="6" fill="#ea580c" stroke="#fef08a" stroke-width="1.5"/>
  </g>
</svg>
