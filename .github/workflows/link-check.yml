name: Link check

on:
  pull_request:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Both scans retain their existing report-only policy for unpublished source pages.
# Installer/integrity errors and the existing failIfEmpty condition still fail.
jobs:
  internal:
    name: Internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded report previews preserve findings and UTF-8
        run: python3 -m unittest discover -s .github/link_summary_review -p 'test_*.py' -v
      - name: Install verified Lychee with bounded retries
        id: install
        run: bash .github/scripts/install-lychee.sh
      - name: Prove the actual binary detects valid and missing local targets
        shell: bash
        run: |
          fixture="$(mktemp -d "$RUNNER_TEMP/lychee-proof.XXXXXX")"
          printf '<a href="target.html">target</a>\n' > "$fixture/good.html"
          printf '<p>existing target</p>\n' > "$fixture/target.html"
          printf '<a href="missing.html">missing</a>\n' > "$fixture/bad.html"
          lychee --offline --no-progress --root-dir "$fixture" "$fixture/good.html"
          set +e
          lychee --offline --no-progress --root-dir "$fixture" "$fixture/bad.html"
          missing_exit=$?
          set -e
          printf 'Real missing-target fixture checker exit: %s\n' "$missing_exit"
          test "$missing_exit" -ne 0
      - name: Scan internal links (report only)
        id: scan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p lychee
          set +e
          lychee --mode task --format markdown --output lychee/out.md \
            --offline --no-progress --root-dir "${{ github.workspace }}" \
            --exclude-path node_modules --exclude-path .git \
            './**/*.html'
          checker_exit=$?
          set -e
          printf 'checker_exit_code=%s\n' "$checker_exit" >> "$GITHUB_OUTPUT"
          printf '{"checker_exit_code":%s,"policy":"report-only"}\n' "$checker_exit" > lychee/exit.json
          printf 'Lychee checker exit code: %s (report-only policy)\n' "$checker_exit"
          test -s lychee/out.md
          cat lychee/out.md
          python3 .github/scripts/lychee-summary.py --report lychee/out.md \
            --checker-exit "$checker_exit" >> "$GITHUB_STEP_SUMMARY"
          printf '\n[Full GitHub Actions output](https://github.com/%s/actions/runs/%s?check_suite_focus=true)\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> lychee/out.md
          if grep -E 'Total\s+\|\s+0' lychee/out.md; then
            echo "::error::No links were found (existing failIfEmpty policy)." >&2
            exit 1
          fi
      - name: Retain actual checker report and exit code
        if: always() && steps.scan.outputs.checker_exit_code != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lychee-${{ github.job }}
          path: lychee/
          retention-days: 14

  external:
    name: External links (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install verified Lychee with bounded retries
        id: install
        run: bash .github/scripts/install-lychee.sh
      - name: Scan external links (report only)
        id: scan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p lychee
          set +e
          lychee --mode task --format markdown --output lychee/out.md \
            --no-progress --max-concurrency 8 --timeout 20 --max-retries 2 \
            --root-dir "${{ github.workspace }}" \
            --accept 200..=299,403,429 --scheme https --scheme http \
            --exclude-path node_modules --exclude-path .git \
            './**/*.html' './**/*.md'
          checker_exit=$?
          set -e
          printf 'checker_exit_code=%s\n' "$checker_exit" >> "$GITHUB_OUTPUT"
          printf '{"checker_exit_code":%s,"policy":"report-only"}\n' "$checker_exit" > lychee/exit.json
          printf 'Lychee checker exit code: %s (report-only policy)\n' "$checker_exit"
          test -s lychee/out.md
          cat lychee/out.md
          python3 .github/scripts/lychee-summary.py --report lychee/out.md \
            --checker-exit "$checker_exit" >> "$GITHUB_STEP_SUMMARY"
          printf '\n[Full GitHub Actions output](https://github.com/%s/actions/runs/%s?check_suite_focus=true)\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> lychee/out.md
          if grep -E 'Total\s+\|\s+0' lychee/out.md; then
            echo "::error::No links were found (existing failIfEmpty policy)." >&2
            exit 1
          fi
      - name: Retain actual checker report and exit code
        if: always() && steps.scan.outputs.checker_exit_code != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lychee-${{ github.job }}
          path: lychee/
          retention-days: 14
