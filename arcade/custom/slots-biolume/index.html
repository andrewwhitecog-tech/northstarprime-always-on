<script>
// ============================================================================
// RECORDED HQ AUDIO ENGINE (Zero Oscillators / Zero Synth — Rule 10-16)
// ============================================================================
const AUDIO = (() => {
  const sfxFiles = {
    spin_start: 'audio/spin_start.mp3',
    reel_stop: 'audio/reel_stop.mp3',
    win: 'audio/win.mp3',
    bigwin: 'audio/bigwin.mp3',
    jackpot: 'audio/jackpot.mp3',
    scatter: 'audio/scatter.mp3',
    bet_step: 'audio/bet_step.mp3'
  };
  const pools = {};
  let muted = false;
  let unlocked = false;
  try { muted = localStorage.getItem('nsp_slots_biolume_mute') === '1'; } catch(e){}

  const musicMain = new Audio('../audio/idg_cues/pinball_bed.mp3');
  musicMain.loop = true; musicMain.volume = 0.36;
  const musicBoss = new Audio('../audio/idg_cues/skillshot.mp3');
  musicBoss.loop = true; musicBoss.volume = 0.42;
  let activeMusic = musicMain;

  for (const [k, src] of Object.entries(sfxFiles)) {
    const a = new Audio(src);
    a.preload = 'auto';
    pools[k] = a;
  }

  function syncMuteUI() {
    const btn = document.getElementById('mute-btn');
    if (btn) {
      btn.textContent = muted ? 'MUTE' : 'AUDIO';
      btn.classList.toggle('plaque-ruby', muted);
    }
    musicMain.muted = muted;
    musicBoss.muted = muted;
  }
  setTimeout(syncMuteUI, 0);

  function unlock() {
    if (unlocked) return;
    unlocked = true;
    if (!muted && !document.hidden) activeMusic.play().catch(()=>{});
  }

  function play(key, vol = 0.85) {
    if (muted || document.hidden) return;
    const base = pools[key];
    if (!base) return;
    try {
      const clone = base.cloneNode();
      clone.volume = Math.min(1, Math.max(0, vol));
      clone.play().catch(()=>{});
    } catch(e){}
  }

  function setBossMusic(isBoss) {
    const next = isBoss ? musicBoss : musicMain;
    if (next === activeMusic) return;
    try { activeMusic.pause(); } catch(e){}
    activeMusic = next;
    activeMusic.muted = muted;
    if (unlocked && !muted && !document.hidden) {
      activeMusic.currentTime = 0;
      activeMusic.play().catch(()=>{});
    }
  }

  function toggle() {
    muted = !muted;
    try { localStorage.setItem('nsp_slots_biolume_mute', muted ? '1' : '0'); } catch(e){}
    syncMuteUI();
    if (!muted && unlocked && !document.hidden) activeMusic.play().catch(()=>{});
    else try { activeMusic.pause(); } catch(e){}
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { try { activeMusic.pause(); } catch(e){} }
    else if (unlocked && !muted) { activeMusic.play().catch(()=>{}); }
  });

  return { unlock, play, toggle, setBossMusic };
})();

// ============================================================================

// ============================================================================

const atlasImg = new Image();
atlasImg.src = 'art/biolume_reels_atlas_v03.webp';
let atlasLoaded = false;

const SYMBOLS = [
  { id:'wild',     col:0, row:0, name:'VORATH KRAKEN (WILD)',  weight:3,  pays:[0,0,8,30,120,600], glow:'#f472b6' },
  { id:'lantern',  col:1, row:0, name:'SOLAR BATHYSPHERE',     weight:5,  pays:[0,0,5,18,65,300],  glow:'#fde047' },
  { id:'jelly',    col:2, row:0, name:'SPIRAL MEDUSA',         weight:6,  pays:[0,0,4,12,40,180],  glow:'#c084fc' },

// ============================================================================
// GAME STATE & PERSISTENCE
// ============================================================================
let tokens = 5000, betPerLine = 1, totalBet = 20;
let currentZone = 0, maxUnlockedZone = 0;
let surge = 0;
let freeSpins = 0;
let krakenMaxHp = 2500, krakenHp = 2500, krakenDefeated = false;
let jackpot = 25000;
let heldReels = [false, false, false, false, false];
let nudgeAvailable = false;
let currentSpinIsFree = false, hasPendingSpinFlag = false;
let spinSettlement = null, autoSpinTimer = null;
let spinning = false, autoSpin = false;
let stats = { spins: 0, wins: 0, biggest: 0, bestBank: 5000 };

const reelStrips = Array.from({length: 5}, () => {
  const s = [];
  SYMBOLS.forEach(sym => { for (let i = 0; i < sym.weight; i++) s.push(sym); });
  for (let i = s.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [s[i], s[j]] = [s[j], s[i]];
  }
  return s;
});

let grid = [[],[],[],[],[]];
let reelAnim = [0,0,0,0,0];
let winHighlights = [];
let winningPaylines = [];
let hitStopFrames = 0;
const particles = [];

function randomSym(r) {
  const st = reelStrips[r];
  return st[Math.floor(Math.random() * st.length)];
}

function initGrid() {
  for (let r = 0; r < 5; r++) {
    grid[r] = [randomSym(r), randomSym(r), randomSym(r)];
  }
}

function loadSave() {
  try {
    const raw = localStorage.getItem('nsp_slots_biolume_v2');
    if (raw) {
      const d = JSON.parse(raw);
      tokens = Math.max(400, d.tokens || 5000);
      maxUnlockedZone = d.maxUnlockedZone || 0;
      krakenDefeated = !!d.krakenDefeated;
      jackpot = d.jackpot || 25000;
      if (d.stats) Object.assign(stats, d.stats);
    }
  } catch(e){}
}

function saveState() {
  if (tokens > stats.bestBank) stats.bestBank = tokens;
  for (let i = 1; i < ZONES.length; i++) {
    if (tokens >= ZONES[i].unlockAt && maxUnlockedZone < i) {
      maxUnlockedZone = i;
      AUDIO.play('scatter', 0.95);
      spawnParticles(430, 90, '#4effb5', 32);
    }
  }
  try {
    localStorage.setItem('nsp_slots_biolume_v2', JSON.stringify({
      tokens, maxUnlockedZone, krakenDefeated, jackpot, stats
    }));
  } catch(e){}
  renderZoneRibbon();
}

function renderZoneRibbon() {
  for (let i = 0; i < ZONES.length; i++) {
    const el = document.getElementById('zone-' + i);
    el.classList.toggle('unlocked', i <= maxUnlockedZone);
    el.classList.toggle('active', i === currentZone);
  }
}

function selectZone(idx) {
  AUDIO.unlock();
  if (spinning) return;
  if (idx > maxUnlockedZone) {
    setVerdict(`UNLOCK AT ${ZONES[idx].unlockAt.toLocaleString()} VAULT`);
    return;
  }
  currentZone = idx;
  AUDIO.play('bet_step', 0.8);
  AUDIO.setBossMusic(currentZone === 3);
  renderZoneRibbon();
  setVerdict(`${ZONES[idx].name} · ${ZONES[idx].mult}X`, true);
}

function buildPaytableDrawer() {
  const drawer = document.getElementById('paytable-drawer');
  drawer.innerHTML = '';
  SYMBOLS.forEach(sym => {
    const card = document.createElement('div');
    card.className = 'pt-card';
    const cv = document.createElement('canvas');
    cv.width = 64; cv.height = 64;
    if (atlasLoaded) {
      const ctx = cv.getContext('2d');
      const sw = atlasImg.width / 3, sh = atlasImg.height / 3;
      ctx.drawImage(atlasImg, sym.col * sw, sym.row * sh, sw, sh, 2, 2, 60, 60);
    }
    const meta = document.createElement('div');
    meta.className = 'pt-meta';
    meta.innerHTML = `<strong>${sym.name}</strong><span>5x = ${sym.pays[5]} · 4x = ${sym.pays[4]}</span>`;
    card.appendChild(cv);
    card.appendChild(meta);
    drawer.appendChild(card);
  });
}
atlasImg.onload = () => {
  atlasLoaded = true;
  buildPaytableDrawer();
};

function togglePaytable() {

// ============================================================================
// VORATH HADAL SANCTUARY CANVAS & 5-REEL MATRIX CANVAS (Zero fillText — Rule 30g)
// ============================================================================
const abyssCanvas = document.getElementById('abyss-canvas');
const actx = abyssCanvas.getContext('2d');
const reelsCanvas = document.getElementById('reels-canvas');
const rctx = reelsCanvas.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
abyssCanvas.width = 920 * DPR;
abyssCanvas.height = 172 * DPR;
if (actx && actx.scale) actx.scale(DPR, DPR);
reelsCanvas.width = 860 * DPR;
reelsCanvas.height = 268 * DPR;
if (rctx && rctx.scale) rctx.scale(DPR, DPR);

const spores = Array.from({length: 40}, () => ({
  x: Math.random() * 920,
  y: Math.random() * 172,
  r: 1.4 + Math.random() * 2.8,
  vy: -0.4 - Math.random() * 0.85,
  col: ['#22d3ee','#f472b6','#4effb5','#fde047'][Math.floor(Math.random()*4)]
}));

function spawnParticles(x, y, color, count = 26) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1.5 + Math.random() * 5.5;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 2.5 + Math.random() * 3.5, color, alpha: 1 });
  }
}

function triggerShake() {
  const w = document.getElementById('game-wrap');
  w.classList.remove('shake');
  void w.offsetWidth;
  w.classList.add('shake');
}

function renderLoop(ts) {
  requestAnimationFrame(renderLoop);
  if (!actx || !rctx) return;
  if (hitStopFrames > 0) { hitStopFrames--; return; }
  const t = ts * 0.001;

  const AW = abyssCanvas.clientWidth || 920, AH = abyssCanvas.clientHeight || 172;
  if (abyssCanvas.width !== Math.round(AW * DPR) || abyssCanvas.height !== Math.round(AH * DPR)) {
    abyssCanvas.width = Math.round(AW * DPR);
    abyssCanvas.height = Math.round(AH * DPR);
    actx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  const z = ZONES[currentZone];
  if (abyssBgLoaded) {
    const iw = abyssBgImg.width, ih = abyssBgImg.height;
    const sc = Math.max(AW / iw, AH / ih) * 1.03;
    const dw = iw * sc, dh = ih * sc;
    const dx = (AW - dw) * 0.5 + Math.sin(t * 0.35) * 7;
    const dy = (AH - dh) * 0.42;
    actx.drawImage(abyssBgImg, dx, dy, dw, dh);
  } else {
    const g = actx.createLinearGradient(0, 0, 0, AH);
    g.addColorStop(0, z.sky);
    g.addColorStop(1, z.deep);
    actx.fillStyle = g;
    actx.fillRect(0, 0, AW, AH);
  }

  for (const sp of spores) {
    sp.y += sp.vy;
    sp.x += Math.sin(t + sp.y * 0.03) * 0.4;
    if (sp.y < -10) { sp.y = AH + 10; sp.x = Math.random() * AW; }
    if (sp.x > AW) sp.x = sp.x % AW;
    actx.fillStyle = sp.col;
    actx.beginPath();
    actx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
    actx.fill();
  }

  const cx = AW * 0.5, cy = AH * 0.46;
  const eyeGlow = actx.createRadialGradient(cx, cy, 8, cx, cy, 96);
  eyeGlow.addColorStop(0, currentZone === 3 ? 'rgba(244,114,182,0.38)' : 'rgba(253,224,71,0.24)');
  eyeGlow.addColorStop(1, 'transparent');
  actx.fillStyle = eyeGlow;
  actx.beginPath();
  actx.arc(cx, cy, 96, 0, Math.PI * 2);
  actx.fill();

  const compactA = AW < 560;
  if (atlasLoaded) {
    const sw = atlasImg.width / 3, sh = atlasImg.height / 3;
    const bob = Math.sin(t * 2.4) * 3.5;
    const iconSz = compactA ? 68 : 120;
    const iconY = (AH - iconSz) * 0.5;
    const padX = compactA ? 8 : 38;
    actx.save();
    actx.shadowColor = 'rgba(244,114,182,0.75)';
    actx.shadowBlur = 16;
    actx.drawImage(atlasImg, 0, 0, sw, sh, padX, iconY + bob, iconSz, iconSz);
    actx.shadowColor = 'rgba(78,255,181,0.75)';
    actx.drawImage(atlasImg, 2 * sw, 2 * sh, sw, sh, AW - padX - iconSz, iconY - bob, iconSz, iconSz);
    actx.restore();
  }

  const bw = compactA ? Math.min(180, AW - 165) : 340, bh = compactA ? 8 : 10;
  const bx = cx - bw * 0.5, by = AH - (compactA ? 14 : 18);
  actx.fillStyle = 'rgba(3,8,20,0.85)';
  actx.strokeStyle = '#f5d76e';
  actx.lineWidth = 1.4;
  actx.fillRect(bx, by, bw, bh);
  actx.strokeRect(bx, by, bw, bh);
  const hpPct = krakenDefeated ? 1 : Math.max(0, Math.min(1, krakenHp / krakenMaxHp));
  const barG = actx.createLinearGradient(bx, 0, bx + bw, 0);
  barG.addColorStop(0, krakenDefeated ? '#4effb5' : '#f43f5e');
  barG.addColorStop(0.5, '#f472b6');
  barG.addColorStop(1, '#22d3ee');
  actx.fillStyle = barG;
  actx.fillRect(bx + 1, by + 1, (bw - 2) * hpPct, bh - 2);

  const RW = reelsCanvas.clientWidth || 860, RH = reelsCanvas.clientHeight || 268;
  if (reelsCanvas.width !== Math.round(RW * DPR) || reelsCanvas.height !== Math.round(RH * DPR)) {
    reelsCanvas.width = Math.round(RW * DPR);
    reelsCanvas.height = Math.round(RH * DPR);
    rctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  rctx.fillStyle = '#020714';
  rctx.fillRect(0, 0, RW, RH);

  const colW = RW / 5;
  const rowH = RH / 3;

  for (let r = 0; r < 5; r++) {
    const x0 = r * colW;
    const cg = rctx.createLinearGradient(x0, 0, x0 + colW, 0);
    cg.addColorStop(0, 'rgba(12,22,48,0.95)');
    cg.addColorStop(0.5, heldReels[r] ? 'rgba(88,16,58,0.58)' : 'rgba(4,10,24,0.96)');
    cg.addColorStop(1, 'rgba(12,22,48,0.95)');
    rctx.fillStyle = cg;
    rctx.fillRect(x0 + 3, 3, colW - 6, RH - 6);

    if (reelAnim[r] > 0) {
      reelAnim[r]--;
      if (reelAnim[r] === 0) {
        AUDIO.play('reel_stop', 0.8);
        if (reelAnim.every(v => v === 0)) {
          setTimeout(evaluateSpin, 80);
        }
      }
    }

    for (let row = 0; row < 3; row++) {
      const sym = reelAnim[r] > 0 ? randomSym(r) : grid[r][row];
      const cxCell = x0 + colW * 0.5;
      const cyCell = row * rowH + rowH * 0.5 + (reelAnim[r] > 0 ? ((reelAnim[r] * 18) % rowH) - rowH * 0.3 : 0);

      const hl = winHighlights.find(h => h.reel === r && h.row === row);
      if (hl) {
        const pulse = 36 + Math.sin(t * 10) * 6;
        const hg = rctx.createRadialGradient(cxCell, cyCell, 6, cxCell, cyCell, pulse);
        hg.addColorStop(0, hl.color);
        hg.addColorStop(1, 'transparent');
        rctx.fillStyle = hg;
        rctx.beginPath();
        rctx.arc(cxCell, cyCell, pulse, 0, Math.PI * 2);
        rctx.fill();
      }

      if (atlasLoaded && sym) {
        const sw = atlasImg.width / 3, sh = atlasImg.height / 3;
        const drawSize = Math.min(colW, rowH) - 8;
        rctx.save();
        if (hl) {
          rctx.shadowColor = sym.glow;
          rctx.shadowBlur = 18;
        }
        rctx.drawImage(
          atlasImg,
          sym.col * sw, sym.row * sh, sw, sh,
          cxCell - drawSize * 0.5, cyCell - drawSize * 0.5, drawSize, drawSize
        );
        rctx.restore();
      }
    }

    rctx.strokeStyle = heldReels[r] ? '#f472b6' : 'rgba(245,215,110,0.32)';
    rctx.lineWidth = heldReels[r] ? 2.5 : 1.2;
    rctx.strokeRect(x0 + 3, 3, colW - 6, RH - 6);
  }

  for (const plIdx of winningPaylines) {
    const line = PAYLINES[plIdx];
    rctx.save();
    rctx.strokeStyle = '#fde047';
    rctx.lineWidth = 3.5;
    rctx.shadowColor = '#f472b6';
    rctx.shadowBlur = 14;
    rctx.beginPath();
    for (let r = 0; r < 5; r++) {
      const px = r * colW + colW * 0.5;
      const py = line[r] * rowH + rowH * 0.5;
      if (r === 0) rctx.moveTo(px, py);
      else rctx.lineTo(px, py);
    }
    rctx.stroke();
    rctx.restore();
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.alpha -= 0.022;
    if (p.alpha <= 0) { particles.splice(i, 1); continue; }
    rctx.save();
    rctx.globalAlpha = p.alpha;
    rctx.fillStyle = p.color;
    rctx.beginPath();
    rctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    rctx.fill();
    rctx.restore();
  }
}

// ============================================================================
// GAMEPLAY ACTIONS: SPIN, TACTICAL SEAL, NUDGE & KRAKEN BOSS COMBAT
// ============================================================================
function setVerdict(txt, big = false) {
  const el = document.getElementById('verdict-line');
  el.textContent = txt;
  el.className = big ? 'big' : '';
}

function updateUI() {
  document.getElementById('token-count').textContent = tokens.toLocaleString();
  document.getElementById('bet-amount').textContent = totalBet.toLocaleString();
  document.getElementById('surge-pct').textContent = surge + '%';
  document.getElementById('surge-fill').style.width = surge + '%';
  document.getElementById('jackpot-val').textContent = jackpot.toLocaleString();
  document.getElementById('kraken-hp-val').textContent = krakenDefeated
    ? 'VANQUISHED'
    : `${krakenHp.toLocaleString()} / ${krakenMaxHp.toLocaleString()}`;
  const fsBadge = document.getElementById('freespin-badge');
  fsBadge.style.display = freeSpins > 0 ? '' : 'none';
  document.getElementById('freespin-val').textContent = `${freeSpins}`;

  document.getElementById('stat-spins').textContent = stats.spins;
  document.getElementById('stat-wins').textContent = stats.wins;
  document.getElementById('stat-biggest').textContent = stats.biggest.toLocaleString();
  document.getElementById('stat-best').textContent = stats.bestBank.toLocaleString();

  for (let r = 0; r < 5; r++) {
    const b = document.getElementById('hold-' + r);
    b.classList.toggle('held', heldReels[r]);
  }
  const nb = document.getElementById('nudge-btn');
  nb.disabled = spinning || !nudgeAvailable;
  nb.classList.toggle('plaque-active', !spinning && nudgeAvailable);
}

function toggleHold(r) {
  AUDIO.unlock();
  if (spinning) return;
  if (!heldReels[r] && heldReels.filter(Boolean).length >= 2) {
    setVerdict('MAX 2 REELS SEALED');
    return;
  }
  heldReels[r] = !heldReels[r];
  AUDIO.play('bet_step', 0.8);
  updateUI();
}

function changeBet(dir) {
  AUDIO.unlock();
  if (spinning) return;
  const steps = [1, 2, 5, 10, 25];
  let idx = steps.indexOf(betPerLine);
  idx = Math.max(0, Math.min(steps.length - 1, idx + dir));
  betPerLine = steps[idx];
  totalBet = betPerLine * 20;
  AUDIO.play('bet_step', 0.8);
  updateUI();
}

function toggleAuto() {
  AUDIO.unlock();
  autoSpin = !autoSpin;
  const ab = document.getElementById('auto-btn');
  ab.classList.toggle('plaque-active', autoSpin);
  if (autoSpin && !spinning) spin();
}

function spin() {
  AUDIO.unlock();
  if (spinning) return;
  if (autoSpinTimer) { clearTimeout(autoSpinTimer); autoSpinTimer = null; }

  const isFree = freeSpins > 0;
  currentSpinIsFree = isFree;
  hasPendingSpinFlag = true;
  spinSettlement = null;

  if (!isFree) {
    if (tokens < totalBet) {
      tokens = 1000;
      setVerdict('SANCTUM RESERVE +1,000', true);
    }
    tokens -= totalBet;
    jackpot += Math.max(5, Math.floor(totalBet * 0.1));
  } else {
    freeSpins--;
  }

  spinning = true;
  nudgeAvailable = false;
  winHighlights = [];
  winningPaylines = [];
  stats.spins++;
  surge = Math.min(100, surge + 20);
  AUDIO.play('spin_start', 0.9);
  document.getElementById('spin-btn').disabled = true;

  const overdrive = surge >= 100;
  for (let r = 0; r < 5; r++) {
    if (heldReels[r]) {
      reelAnim[r] = 2;
    } else {
      grid[r] = [randomSym(r), randomSym(r), randomSym(r)];
      reelAnim[r] = 16 + r * 9;
    }
  }

  if (overdrive) {
    surge = 0;
    const wildSym = SYMBOLS[0];
    grid[2] = [wildSym, wildSym, wildSym];
    setVerdict('CHROMA SURGE · EXPANDED KRAKEN WILD', true);
  } else {
    setVerdict('');
  }

  updateUI();
}

function evaluateLine(syms) {
  let base = null;
  for (const s of syms) {
    if (s.id !== 'wild' && s.id !== 'scatter') { base = s; break; }
  }
  if (!base) {
    if (syms.every(s => s.id === 'wild')) return SYMBOLS[0].pays[5];
    return 0;
  }
  let count = 0;
  for (const s of syms) {
    if (s.id === base.id || s.id === 'wild') count++;
    else break;
  }
  return base.pays[count] || 0;
}

function evaluateSpin(isNudge = false) {
  const nudgePass = isNudge === true;
  spinning = false;
  document.getElementById('spin-btn').disabled = false;
  if (!nudgePass) {
    heldReels = [false, false, false, false, false];
    const spinWasFree = hasPendingSpinFlag ? currentSpinIsFree : (freeSpins > 0);
    hasPendingSpinFlag = false;
    nudgeAvailable = true;
    const spinMult = ZONES[currentZone].mult * (spinWasFree ? 2 : 1) * (krakenDefeated ? 1.25 : 1);
    spinSettlement = {
      mult: spinMult,
      baseWins: stats.wins,
      baseBiggest: stats.biggest,
      baseKrakenHp: krakenHp,
      baseKrakenDefeated: krakenDefeated,
      baseJackpot: jackpot,
      totalCredited: 0,
      totalWin: 0,
      addedFs: 0,
      dmg: 0,
      defeatedNow: false
    };
  } else if (!spinSettlement) {
    return;
  }

  let rawWin = 0;
  winHighlights = [];
  winningPaylines = [];

  for (let pl = 0; pl < PAYLINES.length; pl++) {
    const line = PAYLINES[pl];
    const syms = line.map((row, reel) => grid[reel][row]);
    const pay = evaluateLine(syms);
    if (pay > 0) {
      rawWin += pay * betPerLine;
      winningPaylines.push(pl);
      line.forEach((row, reel) => {
        winHighlights.push({ reel, row, color: syms[reel].glow });
      });
    }
  }

  let scatters = 0;
  for (let r = 0; r < 5; r++) {
    for (let row = 0; row < 3; row++) {
      if (grid[r][row].id === 'scatter') {
        scatters++;
        winHighlights.push({ reel: r, row, color: '#4effb5' });
      }
    }
  }
  let addedFs = 0;
  if (scatters >= 3) {
    const scPay = SYMBOLS[8].pays[Math.min(5, scatters)] * totalBet;
    rawWin += scPay;
    addedFs = scatters === 3 ? 6 : scatters === 4 ? 10 : 16;
  }

  const fsDelta = addedFs - spinSettlement.addedFs;
  if (fsDelta !== 0) {
    freeSpins = Math.max(0, freeSpins + fsDelta);
    if (fsDelta > 0) {
      AUDIO.play('scatter', 0.95);
      spawnParticles(430, 95, '#4effb5', 36);
    }
  }

  const mult = spinSettlement.mult;
  const totalWin = Math.floor(rawWin * mult);

  let dmg = 0;
  let defeatedNow = false;
  if (!spinSettlement.baseKrakenDefeated && totalWin > 0) {
    dmg = Math.max(85, Math.min(750, Math.floor(totalWin * 1.5)));
    krakenHp = Math.max(0, spinSettlement.baseKrakenHp - dmg);
    defeatedNow = (krakenHp === 0);
  } else if (!spinSettlement.baseKrakenDefeated) {
    krakenHp = spinSettlement.baseKrakenHp;
  }
  krakenDefeated = spinSettlement.baseKrakenDefeated || defeatedNow;
  jackpot = defeatedNow ? 25000 : spinSettlement.baseJackpot;

  const totalCredited = totalWin + (defeatedNow ? spinSettlement.baseJackpot : 0);
  const creditDelta = totalCredited - spinSettlement.totalCredited;
  tokens += creditDelta;

  stats.wins = spinSettlement.baseWins + (totalWin > 0 ? 1 : 0);
  stats.biggest = Math.max(spinSettlement.baseBiggest, totalWin);

  const newlyDefeated = defeatedNow && !spinSettlement.defeatedNow;

  spinSettlement.totalCredited = totalCredited;
  spinSettlement.totalWin = totalWin;
  spinSettlement.addedFs = addedFs;
  spinSettlement.dmg = dmg;
  spinSettlement.defeatedNow = defeatedNow;

  if (creditDelta > 0) {
    if (newlyDefeated) {
      hitStopFrames = 8;
      triggerShake();
      AUDIO.play('jackpot', 1.0);
      spawnParticles(430, 120, '#fde047', 70);
      setVerdict(`KRAKEN VANQUISHED · +${spinSettlement.baseJackpot.toLocaleString()}`, true);
    } else if (creditDelta >= totalBet * 8) {
      hitStopFrames = 5;
      triggerShake();
      AUDIO.play('bigwin', 0.95);
      setVerdict(nudgePass
        ? `NUDGE SURGE +${creditDelta.toLocaleString()}`
        : `HADAL HARVEST +${totalWin.toLocaleString()}`, true);
    } else {
      AUDIO.play('win', 0.85);
      setVerdict(nudgePass
        ? `NUDGE +${creditDelta.toLocaleString()} · TOTAL +${totalWin.toLocaleString()}`
        : `LOOM HARMONY +${totalWin.toLocaleString()}`);
    }
    spawnParticles(430, 140, '#22d3ee', 34);
  } else if (nudgePass) {
    setVerdict(totalWin > 0 ? `DIVE TOTAL +${totalWin.toLocaleString()}` : '');
  } else {
    setVerdict('');
  }

  saveState();
  updateUI();

  if (autoSpin) {
    if (autoSpinTimer) clearTimeout(autoSpinTimer);
    autoSpinTimer = setTimeout(() => { autoSpinTimer = null; if (autoSpin && !spinning) spin(); }, 950);
  }
}

function nudgeCenterReel() {
  AUDIO.unlock();
  if (spinning || !nudgeAvailable || !spinSettlement) return;
  nudgeAvailable = false;
  grid[2].pop();
  grid[2].unshift(randomSym(2));
  AUDIO.play('reel_stop', 0.9);
  spawnParticles(430, 135, '#f472b6', 18);
  evaluateSpin(true);
}

let touchStartY = null;
reelsCanvas.addEventListener('pointerdown', e => {
  AUDIO.unlock();
  touchStartY = e.clientY;
});
reelsCanvas.addEventListener('pointerup', e => {
  if (touchStartY !== null && e.clientY - touchStartY > 45 && !spinning) {
    touchStartY = null;
    spin();
    return;
  }
  touchStartY = null;
  if (spinning) return;
  const rect = reelsCanvas.getBoundingClientRect();
  const relX = (e.clientX - rect.left) / rect.width;
  const col = Math.min(4, Math.max(0, Math.floor(relX * 5)));
  toggleHold(col);
});

document.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toUpperCase();
  if (k === 'M') { AUDIO.toggle(); return; }
  AUDIO.unlock();
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); spin(); }
  else if (k === 'N') nudgeCenterReel();
  else if (['1','2','3','4','5'].includes(k)) toggleHold(parseInt(k, 10) - 1);
});

document.getElementById('controls-area').classList.add('touch-controls');
reelsCanvas.addEventListener('touchstart', () => { AUDIO.unlock(); }, { passive: true });
let gpPrev = [];
function pollSlotsGamepad() {
  requestAnimationFrame(pollSlotsGamepad);
  if (!navigator.getGamepads) return;
  const pads = navigator.getGamepads();
  const gp = pads && pads[0];
  if (!gp) return;
  const pressed = i => gp.buttons[i] && gp.buttons[i].pressed && !gpPrev[i];
  if (pressed(0)) { AUDIO.unlock(); spin(); }
  if (pressed(1)) nudgeCenterReel();
  if (pressed(2)) toggleHold(0);
  if (pressed(3)) toggleHold(2);
  gpPrev = gp.buttons.map(b => b.pressed);
}
requestAnimationFrame(pollSlotsGamepad);

initGrid();
loadSave();
renderZoneRibbon();
updateUI();
requestAnimationFrame(renderLoop);
</script>
<script src="/static/games/nsp-return.js"></script>
</body>
</html>
