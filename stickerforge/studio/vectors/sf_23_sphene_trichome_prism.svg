<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="voidCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="60%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <!-- Prismatic Spectrum Gradients -->
    <linearGradient id="spectrumRainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="17%" stop-color="#f97316"/>
      <stop offset="33%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="67%" stop-color="#06b6d4"/>
      <stop offset="83%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="goldHolo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="prismGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#a855f7" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#040406"/>

  <!-- DIE-CUT CIRCULAR MEDALLION -->
  <g transform="translate(400, 400)" filter="url(#prismGlow)">
    <!-- White Die-Cut Edge -->
    <circle cx="0" cy="0" r="375" fill="#ffffff"/>
    <circle cx="0" cy="0" r="365" fill="none" stroke="url(#goldHolo)" stroke-width="5"/>
    <circle cx="0" cy="0" r="352" fill="url(#voidCore)" stroke="#3f3f46" stroke-width="2"/>

    <!-- Concentric Guilloche Optical Scale (360 Degree Ticks) -->
    <circle cx="0" cy="0" r="335" fill="none" stroke="#52525b" stroke-width="1.5" stroke-dasharray="2,6"/>
    <circle cx="0" cy="0" r="322" fill="none" stroke="url(#spectrumRainbow)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="310" fill="none" stroke="#3f3f46" stroke-width="1" stroke-dasharray="8,8"/>

    <!-- Incoming Monochromatic Pure White Beam -->
    <polygon points="-310,-140 -20,-30 -30,-15 -310,-115" fill="#ffffff" opacity="0.9"/>
    <circle cx="-310" cy="-128" r="8" fill="#ffffff"/>

    <!-- Crystalline Faceted Trichome Head (Sphene Prism Gem) -->
    <!-- Trichome Glandular Stalk Base -->
    <path d="M -40 210 C -30 110 -15 30 0 20 C 15 30 30 110 40 210 Z" fill="#27272a" stroke="#52525b" stroke-width="2"/>
    <!-- Crystal Facets -->
    <polygon points="0,-160 120,-40 80,100 -80,100 -120,-40" fill="#18181b" stroke="url(#goldHolo)" stroke-width="3"/>
    <!-- Facet Division Lines -->
    <polygon points="0,-160 0,20 -120,-40" fill="#27272a" opacity="0.8" stroke="url(#spectrumRainbow)" stroke-width="1.5"/>
    <polygon points="0,-160 120,-40 0,20" fill="#3f3f46" opacity="0.7" stroke="url(#spectrumRainbow)" stroke-width="1.5"/>
    <polygon points="0,20 80,100 -80,100" fill="#52525b" opacity="0.8" stroke="url(#goldHolo)" stroke-width="1.5"/>
    <polygon points="-120,-40 0,20 -80,100" fill="#27272a" opacity="0.9" stroke="url(#goldHolo)" stroke-width="1.5"/>
    <polygon points="120,-40 0,20 80,100" fill="#3f3f46" opacity="0.9" stroke="url(#goldHolo)" stroke-width="1.5"/>

    <!-- Refracted Cannabinoid Wavelength Beams (Exiting Right) -->
    <!-- Red (THC 700nm) -->
    <polygon points="0,20 120,-40 310,-120 310,-100" fill="#ef4444" opacity="0.75"/>
    <!-- Orange (CBD 620nm) -->
    <polygon points="0,20 120,-40 310,-80 310,-60" fill="#f97316" opacity="0.75"/>
    <!-- Yellow (CBG 580nm) -->
    <polygon points="0,20 120,-40 310,-40 310,-20" fill="#eab308" opacity="0.75"/>
    <!-- Green (CBN 530nm) -->
    <polygon points="0,20 120,-40 310,0 310,20" fill="#22c55e" opacity="0.75"/>
    <!-- Cyan (CBC 490nm) -->
    <polygon points="0,20 120,-40 310,40 310,60" fill="#06b6d4" opacity="0.75"/>
    <!-- Blue (THCV 450nm) -->
    <polygon points="0,20 120,-40 310,80 310,100" fill="#3b82f6" opacity="0.75"/>
    <!-- Violet (CBDV 400nm) -->
    <polygon points="0,20 120,-40 310,120 310,140" fill="#a855f7" opacity="0.75"/>

    <!-- Cannabinoid Wavelength Tags Along Right Rim -->
    <text x="250" y="-95" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#ef4444">Δ9-THC</text>
    <text x="255" y="-55" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#f97316">CBD</text>
    <text x="260" y="-15" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#eab308">CBG</text>
    <text x="260" y="25" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#22c55e">CBN</text>
    <text x="255" y="65" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#06b6d4">CBC</text>
    <text x="250" y="105" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#3b82f6">THCV</text>
    <text x="240" y="145" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#a855f7">CBDV</text>

    <!-- Center Core Flare -->
    <circle cx="0" cy="20" r="16" fill="#ffffff" filter="url(#prismGlow)"/>
    <circle cx="0" cy="20" r="8" fill="#fbbf24"/>

    <!-- Typographic Crest Banners -->
    <text x="0" y="-235" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="bold" fill="url(#goldHolo)" text-anchor="middle" letter-spacing="5">CHROMATIC TRICHOME PRISM</text>
    <text x="0" y="-212" font-family="'Montserrat', sans-serif" font-size="10" font-weight="bold" fill="#a1a1aa" text-anchor="middle" letter-spacing="4">90u SOLVENTLESS SPECTROMETRY</text>

    <text x="0" y="245" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">10015 SW HALL BLVD</text>
    <text x="0" y="268" font-family="'Montserrat', sans-serif" font-size="10" font-weight="bold" fill="url(#goldHolo)" text-anchor="middle" letter-spacing="5">DISPENSARY APOTHECARY • TIGARD OR</text>
  </g>
</svg>