<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="wheelCenterBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <filter id="wheelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#060911"/>

  <!-- DIE-CUT VINYL OUTER CONTAINER -->
  <g transform="translate(400, 400)" filter="url(#wheelShadow)">
    <circle cx="0" cy="0" r="380" fill="#ffffff"/>
    <circle cx="0" cy="0" r="370" fill="#090d16" stroke="#334155" stroke-width="2"/>

    <!-- Outer Calibrated Dial Rim with Tick Marks -->
    <circle cx="0" cy="0" r="360" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="350" fill="none" stroke="#475569" stroke-width="0.8" stroke-dasharray="2,6"/>

    <!-- 6 SECTORS (60 degrees each) -->
    
    <!-- 1. MYRCENE (Top, 0 to 60 deg) -->
    <path d="M 0 0 L 0 -340 A 340 340 0 0 1 294.4 -170 Z" fill="#047857" fill-opacity="0.25" stroke="#10b981" stroke-width="2"/>
    <g transform="rotate(30) translate(0, -240)">
      <text x="0" y="-30" font-family="'Arial Black', sans-serif" font-weight="900" font-size="20" fill="#34d399" text-anchor="middle">MYRCENE</text>
      <text x="0" y="-12" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">Earthy • Herbal</text>
      <text x="0" y="5" font-family="'Inter', sans-serif" font-size="9.5" fill="#a7f3d0" text-anchor="middle">Deep Sedation / 334°F</text>
    </g>

    <!-- 2. LIMONENE (60 to 120 deg) -->
    <path d="M 0 0 L 294.4 -170 A 340 340 0 0 1 294.4 170 Z" fill="#d97706" fill-opacity="0.25" stroke="#f59e0b" stroke-width="2"/>
    <g transform="rotate(90) translate(0, -240)">
      <text x="0" y="-30" font-family="'Arial Black', sans-serif" font-weight="900" font-size="20" fill="#fbbf24" text-anchor="middle">LIMONENE</text>
      <text x="0" y="-12" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">Citrus • Rind</text>
      <text x="0" y="5" font-family="'Inter', sans-serif" font-size="9.5" fill="#fde68a" text-anchor="middle">Uplift &amp; Energy / 349°F</text>
    </g>

    <!-- 3. CARYOPHYLLENE (120 to 180 deg) -->
    <path d="M 0 0 L 294.4 170 A 340 340 0 0 1 0 340 Z" fill="#b91c1c" fill-opacity="0.25" stroke="#ef4444" stroke-width="2"/>
    <g transform="rotate(150) translate(0, -240)">
      <text x="0" y="-30" font-family="'Arial Black', sans-serif" font-weight="900" font-size="18" fill="#f87171" text-anchor="middle">CARYOPHYLLENE</text>
      <text x="0" y="-12" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">Peppery • Spicy</text>
      <text x="0" y="5" font-family="'Inter', sans-serif" font-size="9.5" fill="#fca5a5" text-anchor="middle">CB2 Activator / 266°F</text>
    </g>

    <!-- 4. PINENE (180 to 240 deg) -->
    <path d="M 0 0 L 0 340 A 340 340 0 0 1 -294.4 170 Z" fill="#065f46" fill-opacity="0.3" stroke="#059669" stroke-width="2"/>
    <g transform="rotate(210) translate(0, -240)">
      <text x="0" y="-30" font-family="'Arial Black', sans-serif" font-weight="900" font-size="20" fill="#6ee7b7" text-anchor="middle">α-PINENE</text>
      <text x="0" y="-12" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">Pine • Resinous</text>
      <text x="0" y="5" font-family="'Inter', sans-serif" font-size="9.5" fill="#a7f3d0" text-anchor="middle">Focus &amp; Memory / 311°F</text>
    </g>

    <!-- 5. LINALOOL (240 to 300 deg) -->
    <path d="M 0 0 L -294.4 170 A 340 340 0 0 1 -294.4 -170 Z" fill="#6b21a8" fill-opacity="0.25" stroke="#a855f7" stroke-width="2"/>
    <g transform="rotate(270) translate(0, -240)">
      <text x="0" y="-30" font-family="'Arial Black', sans-serif" font-weight="900" font-size="20" fill="#c084fc" text-anchor="middle">LINALOOL</text>
      <text x="0" y="-12" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">Lavender • Floral</text>
      <text x="0" y="5" font-family="'Inter', sans-serif" font-size="9.5" fill="#e9d5ff" text-anchor="middle">Anti-Anxiety / 388°F</text>
    </g>

    <!-- 6. TERPINOLENE (300 to 360 deg) -->
    <path d="M 0 0 L -294.4 -170 A 340 340 0 0 1 0 -340 Z" fill="#0e7490" fill-opacity="0.25" stroke="#06b6d4" stroke-width="2"/>
    <g transform="rotate(330) translate(0, -240)">
      <text x="0" y="-30" font-family="'Arial Black', sans-serif" font-weight="900" font-size="18" fill="#38bdf8" text-anchor="middle">TERPINOLENE</text>
      <text x="0" y="-12" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">Fruity • Hazy</text>
      <text x="0" y="5" font-family="'Inter', sans-serif" font-size="9.5" fill="#bae6fd" text-anchor="middle">Creativity / 365°F</text>
    </g>

    <!-- Radiating Divider Spokes -->
    <g stroke="#ffffff" stroke-width="2" opacity="0.4">
      <line x1="0" y1="0" x2="0" y2="-340"/>
      <line x1="0" y1="0" x2="294.4" y2="-170"/>
      <line x1="0" y1="0" x2="294.4" y2="170"/>
      <line x1="0" y1="0" x2="0" y2="340"/>
      <line x1="0" y1="0" x2="-294.4" y2="170"/>
      <line x1="0" y1="0" x2="-294.4" y2="-170"/>
    </g>

    <!-- CENTRAL ENTROPY HUB -->
    <circle cx="0" cy="0" r="115" fill="url(#wheelCenterBg)" stroke="#fbbf24" stroke-width="4"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Central Symmetrical Cannabis Leaf with Molecular Lattice -->
    <g fill="#10b981" stroke="#047857" stroke-width="1">
      <path d="M 0 10 C -8 -15 -6 -50 0 -60 C 6 -50 8 -15 0 10 Z"/>
      <path d="M 0 12 C -18 -5 -35 -25 -40 -45 C -32 -42 -15 -20 0 12 Z"/>
      <path d="M 0 12 C 18 -5 35 -25 40 -45 C 32 -42 15 -20 0 12 Z"/>
      <path d="M 0 15 C -25 10 -45 -5 -55 -20 C -45 -18 -22 -2 0 15 Z"/>
      <path d="M 0 15 C 25 10 45 -5 55 -20 C 45 -18 22 -2 0 15 Z"/>
    </g>

    <!-- Core Hub Text -->
    <text x="0" y="32" font-family="'Arial Black', sans-serif" font-weight="900" font-size="12" fill="#fef08a" text-anchor="middle" letter-spacing="2">TERPENE</text>
    <text x="0" y="48" font-family="'Inter', sans-serif" font-weight="800" font-size="9" fill="#38bdf8" text-anchor="middle" letter-spacing="1">WHEEL OF LIFE</text>
    <text x="0" y="62" font-family="'Courier New', monospace" font-size="8" fill="#94a3b8" text-anchor="middle">CDC APOTHECARY</text>

    <!-- Outer Rim Labels -->
    <path id="wheelRimArcTop" d="M -320 0 A 320 320 0 1 1 320 0" fill="none"/>
    <text font-family="'Cinzel', serif" font-weight="800" font-size="13" fill="#ffffff" letter-spacing="3" text-anchor="middle">
      <textPath href="#wheelRimArcTop" startOffset="50%">THE ENTOURAGE EFFECT • PHYTOTHERAPEUTIC HARMONY</textPath>
    </text>
  </g>
</svg>
