<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Forest Loam & Bioluminescent Spore Gradients -->
    <radialGradient id="forestLoam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d1a0f"/>
      <stop offset="60%" stop-color="#190e07"/>
      <stop offset="100%" stop-color="#080402"/>
    </radialGradient>

    <radialGradient id="sporeHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#86efac"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="85%" stop-color="#047857"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <linearGradient id="truffleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="houndFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <filter id="sporeBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#86efac" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#020804"/>

  <!-- DIE-CUT CONTAINER -->
  <g transform="translate(400, 400)" filter="url(#sporeBloom)">
    <!-- White Die-Cut Bleed Border -->
    <circle cx="0" cy="0" r="375" fill="#ffffff"/>
    <circle cx="0" cy="0" r="365" fill="none" stroke="#10b981" stroke-width="6"/>
    <circle cx="0" cy="0" r="352" fill="url(#forestLoam)" stroke="url(#truffleGold)" stroke-width="3"/>

    <!-- Douglas Fir Canopy & Root Network -->
    <!-- Distant Pine Trunks -->
    <rect x="-180" y="-320" width="28" height="240" fill="#1b120c" opacity="0.6"/>
    <rect x="-80" y="-330" width="36" height="250" fill="#2d1c13" opacity="0.8"/>
    <rect x="110" y="-325" width="32" height="245" fill="#1b120c" opacity="0.6"/>
    <rect x="180" y="-330" width="40" height="250" fill="#2d1c13" opacity="0.8"/>

    <!-- Fir Needles & Fern Foliage Arch -->
    <path d="M -260 -180 Q -160 -260 0 -250 Q 160 -260 260 -180" fill="none" stroke="#064e3b" stroke-width="24" stroke-dasharray="8,6" opacity="0.4"/>
    <path d="M -240 -160 Q -140 -230 0 -220 Q 140 -230 240 -160" fill="none" stroke="#047857" stroke-width="16" stroke-dasharray="6,4" opacity="0.6"/>

    <!-- Subterranean Mycelium & Moss Horizon Line -->
    <path d="M -340 120 Q -160 80 0 100 Q 160 120 340 90 L 340 340 L -340 340 Z" fill="#1a0f07"/>
    <!-- Velvet Moss Layer on top of Soil -->
    <path d="M -340 120 Q -160 80 0 100 Q 160 120 340 90" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round"/>
    <path d="M -340 125 Q -160 85 0 105 Q 160 125 340 95" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4"/>

    <!-- Glowing Mycorrhizal Hyphae in Soil -->
    <g stroke="#34d399" stroke-width="1.2" fill="none" opacity="0.7">
      <path d="M -200 130 Q -140 180 -120 250"/>
      <path d="M -160 160 Q -90 190 -70 270"/>
      <path d="M 0 110 Q 30 180 20 260 Q 40 300 30 330"/>
      <path d="M 120 120 Q 150 170 180 230"/>
      <path d="M 160 150 Q 210 200 240 280"/>
    </g>

    <!-- BIOLUMINESCENT SPORE HALO -->
    <circle cx="20" cy="180" r="140" fill="url(#sporeHalo)" opacity="0.75"/>

    <!-- THE GOLDEN OREGON TRUFFLE (Subterranean Focus) -->
    <g transform="translate(20, 200)" filter="url(#sporeBloom)">
      <!-- Truffle Contour / Textured Peridium -->
      <path d="M -45 -10 C -55 -35 -20 -55 15 -50 C 45 -45 65 -20 60 15 C 55 45 25 60 -15 55 C -50 50 -60 20 -45 -10 Z" fill="url(#truffleGold)" stroke="#451a03" stroke-width="3"/>
      <!-- Gleba Marbling Veins inside Truffle -->
      <path d="M -25 -20 Q 0 -35 25 -25 Q 10 0 35 15 Q 0 35 -15 15 Z" fill="none" stroke="#fef08a" stroke-width="2"/>
      <path d="M -35 10 Q -10 15 5 -10" fill="none" stroke="#fef08a" stroke-width="1.5"/>
      <circle cx="-10" cy="-5" r="4" fill="#ffffff"/>
      <circle cx="15" cy="5" r="3" fill="#ffffff"/>

      <!-- Rising Bioluminescent Spores -->
      <g fill="#86efac">
        <circle cx="-30" cy="-70" r="4"/><circle cx="0" cy="-85" r="5"/><circle cx="35" cy="-65" r="3.5"/>
        <circle cx="-15" cy="-110" r="3"/><circle cx="20" cy="-125" r="4.5"/><circle cx="-45" cy="-130" r="2.5"/>
        <circle cx="50" cy="-100" r="3"/>
      </g>
    </g>

    <!-- THE NOBLE TRUFFLE HOUND (Profile, Sniffing the Loam) -->
    <g transform="translate(-80, 20)">
      <!-- Body & Shoulder -->
      <path d="M -150 40 Q -90 -20 -10 -10 Q 50 0 90 40 L 70 100 L -140 100 Z" fill="url(#houndFur)" stroke="#271103" stroke-width="2.5"/>
      
      <!-- Back Leg & Tail Arched in Alert Excitement -->
      <path d="M -140 40 Q -190 20 -210 -40 Q -205 -60 -190 -50 Q -175 -20 -130 20 Z" fill="url(#houndFur)" stroke="#271103" stroke-width="2"/>

      <!-- Front Leg reaching toward Truffle -->
      <path d="M 40 40 L 75 105 L 50 110 L 20 50 Z" fill="url(#houndFur)"/>

      <!-- Muscular Neck angled downward -->
      <path d="M -10 -10 Q 40 -35 80 -15 L 110 30 L 70 50 Z" fill="url(#houndFur)"/>

      <!-- Hound Head & Muzzle Pointed to Spore Horizon -->
      <path d="M 70 -15 Q 110 -35 130 -10 Q 155 10 165 40 Q 140 55 110 40 Q 90 20 70 -15 Z" fill="url(#houndFur)" stroke="#271103" stroke-width="2"/>
      
      <!-- Velvety Hound Ear (Floppy Drop) -->
      <path d="M 85 -18 Q 75 25 90 55 Q 105 45 100 0 Z" fill="#451a03" stroke="#271103" stroke-width="1.5"/>

      <!-- Truffle Hound Dark Moist Nose pointing at earth -->
      <ellipse cx="163" cy="42" rx="7" ry="6" fill="#1c0d02"/>
      <circle cx="165" cy="40" r="2" fill="#ffffff" opacity="0.6"/>

      <!-- Focused Hound Eye -->
      <circle cx="115" cy="0" r="5" fill="#f59e0b" stroke="#000000" stroke-width="1.5"/>
      <circle cx="116" cy="0" r="2.5" fill="#000000"/>
      <circle cx="117" cy="-1" r="1" fill="#ffffff"/>

      <!-- Whiskers & Breath Vapor -->
      <path d="M 168 45 Q 185 50 195 45" fill="none" stroke="#86efac" stroke-width="1.5" stroke-dasharray="2,2"/>
      <path d="M 166 48 Q 180 58 190 55" fill="none" stroke="#86efac" stroke-width="1.5" stroke-dasharray="2,2"/>
    </g>

    <!-- Chanterelle Mushroom Family beside Fir Trunk -->
    <g transform="translate(190, 45)">
      <!-- Golden Trumpet Chanterelles -->
      <path d="M -10 45 L 0 10 Q 15 -10 30 10 L 40 45 Z" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>
      <ellipse cx="15" cy="10" rx="18" ry="7" fill="#fef08a"/>
      <!-- Small Button -->
      <path d="M 30 50 L 35 30 Q 45 20 55 30 L 58 50 Z" fill="#f59e0b"/>
      <ellipse cx="45" cy="30" rx="10" ry="4" fill="#fde047"/>
    </g>

    <!-- CIRCULAR TEXT PATHS -->
    <path id="truffleTextTop" d="M -310 0 A 310 310 0 1 1 310 0" fill="none"/>
    <path id="truffleTextBottom" d="M 310 0 A 310 310 0 1 1 -310 0" fill="none"/>

    <text font-family="'Cinzel', serif" font-weight="900" font-size="17" fill="url(#truffleGold)" letter-spacing="4">
      <textPath href="#truffleTextTop" startOffset="50%" text-anchor="middle">
        OREGON TRUFFLE HUNTER • WILLAMETTE LOAM
      </textPath>
    </text>

    <text font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#86efac" letter-spacing="3">
      <textPath href="#truffleTextBottom" startOffset="50%" text-anchor="middle">
        SUBTERRANEAN GOLD • CDC FORAGE DIVISION
      </textPath>
    </text>

    <!-- Spore Dots on Flanks -->
    <circle cx="-315" cy="0" r="5" fill="#f59e0b"/>
    <circle cx="315" cy="0" r="5" fill="#f59e0b"/>
  </g>
</svg>
