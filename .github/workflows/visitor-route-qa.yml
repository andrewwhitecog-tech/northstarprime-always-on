name: NorthStar visitor route checks
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fdc11dc91fff27509f0f4a3f628555c2a5801d54
          sparse-checkout: |
            join/first-light
            idc-programming
            holidays
            literature/the-null-calendar
          persist-credentials: false
      - run: python -m pip -q install playwright requests
      - name: Verify membership journeys
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import urlsplit,parse_qs,urljoin
          import time,requests
          from playwright.sync_api import sync_playwright
          preview=False
          origin='https://northstarprime.net'
          route='/join/first-light/'
          sources={'/holidays/':1,'/idc-programming/':1,'/literature/the-null-calendar/':2}
          if not preview:
              for attempt in range(60):
                  r=requests.get(origin+route,params={'proof':'membership411','attempt':attempt},timeout=20)
                  if r.ok and 'Ask about membership' in r.text and 'Start Free Trial' not in r.text: break
                  time.sleep(8)
              else: raise AssertionError('Updated flyer page has not reached production')
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path='/usr/bin/google-chrome',args=['--disable-gpu'])
              for width in (390,1280):
                  page=browser.new_page(viewport={'width':width,'height':840})
                  page.set_default_timeout(20000)
                  errors=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  if preview:
                      def source(r):
                          path=urlsplit(r.request.url).path.strip('/')
                          r.fulfill(content_type='text/html',body=Path(path+'/index.html').read_bytes())
                      for path in (route,*sources): page.route(origin+path+'*',source)
                  for path,count in sources.items():
                      page.goto(origin+path,wait_until='domcontentloaded')
                      assert page.locator('a[href="/#tiers"]').count()==0
                      incoming=page.locator('a[href="'+route+'"]')
                      assert incoming.count()==count
                      if width==1280:
                          if path.startswith('/literature/'):
                              page.locator('.nsp-nav-more summary').click()
                          incoming.first.click()
                          page.wait_for_url(origin+route)
                          if path.startswith('/literature/'):
                              page.goto(origin+path,wait_until='domcontentloaded')
                              page.locator('[data-nsp-command-open]').click()
                              page.locator('.nsp-command-head input[type=search]').fill('membership')
                              page.locator('.nsp-command-item[href="'+route+'"]').click()
                              page.wait_for_url(origin+route)
                  for suffix,label in [('', 'First Signal'),('?v=holy-hippies&code=QA-CANARY-411','Holy Hippies'),('?v=unknown&email=qa%40example.invalid','First Signal')]:
                      page.goto(origin+route+suffix,wait_until='domcontentloaded')
                      assert page.locator('#variant-label').text_content()==label,(suffix,page.locator('#variant-label').text_content())
                      assert page.locator('form,input,button[type="submit"]').count()==0
                      assert 'Online enrollment is currently unavailable.' in page.locator('main').inner_text()
                      assert page.locator('a[href="/renalshield/"]').is_visible()
                      link=page.get_by_role('link',name='Ask about membership',exact=True)
                      target=link.get_attribute('href')
                      assert urlsplit(target).path=='/contact/' and 'CANARY' not in target and 'example.invalid' not in target
                      with page.expect_request(lambda req:req.is_navigation_request() and urlsplit(req.url).path=='/contact/') as navigation:
                          link.click()
                      assert not navigation.value.all_headers().get('referer')
                      page.wait_for_function("()=>document.querySelector('#subject-preview')?.textContent==='First Signal membership inquiry'")
                      draft=urlsplit(page.locator('#draft-link').get_attribute('href'))
                      assert draft.scheme=='mailto' and draft.path=='contact@northstarprime.net'
                      assert parse_qs(draft.query)==parse_qs(urlsplit(target).query)
                  print('MEMBERSHIP',width,'four incoming links, three flyer variants, populated draft',flush=True)
                  if errors: print('JS_ERRORS',errors,flush=True)
                  page.close()
              browser.close()
