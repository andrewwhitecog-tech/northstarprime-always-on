<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGraphBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Temperature Flame Gradient -->
    <linearGradient id="tempGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="30%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="neonGlowGraph">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#cyberGraphBg)"/>

  <!-- Chart Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="120" y1="180" x2="720" y2="180"/>
    <line x1="120" y1="280" x2="720" y2="280"/>
    <line x1="120" y1="380" x2="720" y2="380"/>
    <line x1="120" y1="480" x2="720" y2="480"/>
    <line x1="120" y1="580" x2="720" y2="580"/>
    <line x1="120" y1="680" x2="720" y2="680"/>
    <line x1="120" y1="780" x2="720" y2="780"/>
  </g>

  <!-- HEADER -->
  <g transform="translate(400, 80)">
    <text font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="32" fill="#ffffff" text-anchor="middle" letter-spacing="2">"YOU THINK IT'S JUST A PLANT?!"</text>
    <text font-family="'Courier New', monospace" font-weight="700" font-size="16" fill="#f59e0b" text-anchor="middle" y="32">EXPLAINING THE THERMODYNAMIC TERPENE MATRIX</text>
  </g>

  <!-- THE VERTICAL THERMOMETER COLUMN -->
  <g transform="translate(180, 200)">
    <!-- Column Track -->
    <rect x="-25" y="0" width="50" height="600" rx="25" fill="#0f172a" stroke="#334155" stroke-width="4"/>
    <!-- Liquid Fill -->
    <rect x="-18" y="10" width="36" height="580" rx="18" fill="url(#tempGradient)"/>
    <!-- Bulb at Bottom -->
    <circle cx="0" cy="620" r="45" fill="#3b82f6" stroke="#334155" stroke-width="4"/>
    <circle cx="0" cy="620" r="35" fill="#00dfd8"/>
  </g>

  <!-- HORIZONTAL DATA CALLOUTS -->
  <g transform="translate(240, 200)">
    
    <!-- 420°F - THE WORMHOLE -->
    <g transform="translate(0, 40)" filter="url(#neonGlowGraph)">
      <line x1="-30" y1="0" x2="40" y2="0" stroke="#a855f7" stroke-width="3"/>
      <rect x="50" y="-30" width="420" height="60" rx="8" fill="#1e1b4b" stroke="#a855f7" stroke-width="2"/>
      <text x="65" y="-5" font-family="'Impact', sans-serif" font-size="22" fill="#f43f5e">420.0°F • THE VORATH SINGULARITY</text>
      <text x="65" y="18" font-family="'Courier New', monospace" font-size="11" fill="#c084fc">Dimension collapses. You become one with the starlight bridge.</text>
    </g>

    <!-- 388°F - Linalool -->
    <g transform="translate(0, 140)">
      <line x1="-30" y1="0" x2="40" y2="0" stroke="#c084fc" stroke-width="2"/>
      <rect x="50" y="-25" width="420" height="50" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
      <text x="65" y="-3" font-family="'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#e9d5ff">388°F • LINALOOL (LAVENDER)</text>
      <text x="65" y="16" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Chakras align. Anxiety completely erased. Heavy floral aroma.</text>
    </g>

    <!-- 349°F - Limonene -->
    <g transform="translate(0, 240)">
      <line x1="-30" y1="0" x2="40" y2="0" stroke="#f59e0b" stroke-width="2"/>
      <rect x="50" y="-25" width="420" height="50" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="65" y="-3" font-family="'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#fbbf24">349°F • d-LIMONENE (CITRUS)</text>
      <text x="65" y="16" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Euphoria peak. You decide to start 4 new creative companies.</text>
    </g>

    <!-- 334°F - Myrcene -->
    <g transform="translate(0, 340)">
      <line x1="-30" y1="0" x2="40" y2="0" stroke="#10b981" stroke-width="2"/>
      <rect x="50" y="-25" width="420" height="50" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="65" y="-3" font-family="'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#34d399">334°F • β-MYRCENE (EARTHY)</text>
      <text x="65" y="16" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Blood-brain barrier unlocked. You become the couch. Peace achieved.</text>
    </g>

    <!-- 311°F - Pinene -->
    <g transform="translate(0, 440)">
      <line x1="-30" y1="0" x2="40" y2="0" stroke="#059669" stroke-width="2"/>
      <rect x="50" y="-25" width="420" height="50" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
      <text x="65" y="-3" font-family="'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#6ee7b7">311°F • α-PINENE (PINE FOREST)</text>
      <text x="65" y="16" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Laser alertness. You can hear pine needles falling 4 miles away.</text>
    </g>

    <!-- 266°F - Caryophyllene -->
    <g transform="translate(0, 540)">
      <line x1="-30" y1="0" x2="40" y2="0" stroke="#3b82f6" stroke-width="2"/>
      <rect x="50" y="-25" width="420" height="50" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="65" y="-3" font-family="'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#93c5fd">266°F • β-CARYOPHYLLENE (PEPPER)</text>
      <text x="65" y="16" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">CB2 cannabinoid receptor binds directly. Physical tension dissolves.</text>
    </g>
  </g>

  <!-- BOTTOM FOOTER -->
  <g transform="translate(400, 930)">
    <rect x="-350" y="-25" width="700" height="50" rx="8" fill="#0f172a" stroke="#334155"/>
    <text font-family="'Impact', 'Arial Black', sans-serif" font-size="18" fill="#fbbf24" letter-spacing="1" text-anchor="middle" y="7">
      CALIBRATE YOUR VAPORIZER TO 420°F AT THE NSP APOTHECARY
    </text>
  </g>
</svg>
