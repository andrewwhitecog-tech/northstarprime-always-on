<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <!-- Renaissance Fresco Plaster Texture -->
    <linearGradient id="frescoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfcfb8"/>
      <stop offset="50%" stop-color="#cfb99c"/>
      <stop offset="100%" stop-color="#bda080"/>
    </linearGradient>

    <!-- Divine Starlight Flare -->
    <radialGradient id="divineSpark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <filter id="frescoCrackle">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#54381e" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="700" fill="url(#frescoBg)"/>

  <!-- Fresco Outer Ornate Gold Border -->
  <rect x="25" y="25" width="950" height="650" fill="none" stroke="#78350f" stroke-width="8"/>
  <rect x="35" y="35" width="930" height="630" fill="none" stroke="#d97706" stroke-width="2"/>

  <!-- TOP HEADER BANNER -->
  <g transform="translate(500, 75)">
    <text font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="28" fill="#451a03" letter-spacing="4" text-anchor="middle">CREATIO BOTANICA • SISTINE CHAPEL REMIX</text>
    <line x1="-320" y1="15" x2="320" y2="15" stroke="#78350f" stroke-width="2"/>
  </g>

  <!-- MAIN SCENE: THE HAND OF GOD PASSING THE BLUNT TO ADAM -->
  <g transform="translate(500, 360)">
    
    <!-- LEFT SIDE: ADAM (Mortal Realm / Earthly Slumber) -->
    <!-- Adam's Muscular Classical Reclining Arm -->
    <g id="adam-arm" stroke="#54381e" stroke-width="3" fill="#cfab86">
      <!-- Upper Torso Silhouette Reclining on Hill -->
      <path d="M -480 180 Q -380 60 -280 100 Q -240 120 -200 80" fill="#cfab86" stroke="#54381e" stroke-width="3"/>
      <!-- Bicep & Forearm extending toward center -->
      <path d="M -300 90 Q -220 20 -150 -10 Q -100 -20 -60 -20" fill="none" stroke="#54381e" stroke-width="26" stroke-linecap="round"/>
      <path d="M -300 90 Q -220 20 -150 -10 Q -100 -20 -60 -20" fill="none" stroke="#dfbc96" stroke-width="20" stroke-linecap="round"/>
      
      <!-- Adam's Hand & Relaxed Index Finger reaching up -->
      <!-- Palm -->
      <ellipse cx="-45" cy="-20" rx="18" ry="12" fill="#dfbc96" stroke="#54381e" stroke-width="2"/>
      <!-- Curled Fingers -->
      <path d="M -45 -12 Q -35 -5 -40 10" stroke="#54381e" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M -52 -12 Q -45 -2 -48 12" stroke="#54381e" stroke-width="6" stroke-linecap="round" fill="none"/>
      <!-- Extending Index Finger (Ready to receive the blunt) -->
      <path d="M -35 -24 L -15 -22 L 5 -18" stroke="#54381e" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M -35 -24 L -15 -22 L 5 -18" stroke="#dfbc96" stroke-width="5" stroke-linecap="round" fill="none"/>
      <!-- Thumb -->
      <path d="M -40 -30 Q -30 -42 -20 -38" stroke="#54381e" stroke-width="7" stroke-linecap="round" fill="none"/>
    </g>

    <!-- RIGHT SIDE: THE DIVINE MANTLE (Celestial Cloud / Brain Silhouette) -->
    <g id="divine-cloud" fill="#8d3d2a" stroke="#451a03" stroke-width="3" opacity="0.9">
      <!-- Classical Pink/Crimson Celestial Mantle -->
      <path d="M 120 -180 C 220 -240 380 -200 440 -120 C 490 -40 480 80 420 160 C 350 240 220 200 150 140 C 90 80 80 -100 120 -180 Z"/>
      <!-- Internal Folds & Drapery -->
      <path d="M 160 -120 Q 250 -40 320 -10" fill="none" stroke="#fca5a5" stroke-width="3" opacity="0.6"/>
      <path d="M 220 -160 Q 300 -80 380 -20" fill="none" stroke="#fca5a5" stroke-width="3" opacity="0.6"/>
    </g>

    <!-- GOD / THE CREATOR'S ARM & HAND EXTENDING FORWARD -->
    <g id="divine-arm">
      <!-- Powerful Forearm -->
      <path d="M 320 -50 Q 220 -40 140 -25" stroke="#54381e" stroke-width="28" stroke-linecap="round" fill="none"/>
      <path d="M 320 -50 Q 220 -40 140 -25" stroke="#e8cbb0" stroke-width="22" stroke-linecap="round" fill="none"/>
      <!-- Palm -->
      <ellipse cx="120" cy="-22" rx="20" ry="14" fill="#e8cbb0" stroke="#54381e" stroke-width="2"/>
      
      <!-- Creator's Hand holding the Artisanal Beaver Blunt -->
      <!-- Fingers pinching blunt -->
      <path d="M 115 -12 Q 100 -5 95 10" stroke="#54381e" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M 125 -12 Q 110 -2 105 12" stroke="#54381e" stroke-width="7" stroke-linecap="round" fill="none"/>
      <!-- Extending Index Finger gently releasing blunt to Adam -->
      <path d="M 105 -25 L 75 -24 L 45 -22" stroke="#54381e" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M 105 -25 L 75 -24 L 45 -22" stroke="#e8cbb0" stroke-width="5" stroke-linecap="round" fill="none"/>
      <!-- Thumb -->
      <path d="M 100 -32 Q 85 -42 65 -35" stroke="#54381e" stroke-width="7" stroke-linecap="round" fill="none"/>
    </g>

    <!-- THE ARTISANAL BEAVER BLUNT (Suspended between the two fingertips) -->
    <g id="divine-blunt" transform="translate(25, -20) rotate(-5)">
      <!-- Cedar Mouthpiece on Creator side -->
      <rect x="15" y="-6" width="18" height="12" rx="2" fill="#78350f" stroke="#451a03" stroke-width="1.5"/>
      <!-- Cured Organic Hemp Leaf Wrap Body -->
      <rect x="-35" y="-6" width="50" height="12" rx="3" fill="#3f6212" stroke="#1a2e05" stroke-width="1.5"/>
      <!-- Kief-dusted gold flecks -->
      <circle cx="-15" cy="-2" r="1.5" fill="#fef08a"/>
      <circle cx="-5" cy="2" r="1.5" fill="#fef08a"/>
      <circle cx="5" cy="-1" r="1.5" fill="#fef08a"/>
      
      <!-- Glowing Cherry on Adam's side -->
      <circle cx="-35" cy="0" r="6" fill="#ea580c"/>
      <circle cx="-35" cy="0" r="3" fill="#fef08a"/>

      <!-- DIVINE SPARKS & SACRED TERPENE SMOKE -->
      <circle cx="-35" cy="0" r="35" fill="url(#divineSpark)" opacity="0.8"/>
      <!-- Aromatic smoke curl linking Adam's finger -->
      <path d="M -35 0 C -55 -20 -40 -50 -60 -70 C -80 -90 -65 -120 -90 -140" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- Angels in background passing lighter and grinder -->
    <g transform="translate(320, -110)" opacity="0.7">
      <circle cx="0" cy="0" r="14" fill="#deb887" stroke="#54381e"/>
      <path d="M -5 10 Q 0 30 15 40" stroke="#54381e" stroke-width="3" fill="none"/>
      <!-- Golden Bic Lighter held by cherub -->
      <rect x="15" y="30" width="10" height="22" rx="2" fill="#fbbf24" stroke="#000000"/>
      <circle cx="20" cy="28" r="4" fill="#f97316"/>
    </g>
  </g>

  <!-- BOTTOM FRESCO INSCRIPTION BANNER -->
  <g transform="translate(500, 615)">
    <rect x="-440" y="-25" width="880" height="50" rx="8" fill="#2a180b"/>
    <text font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="20" fill="#fef08a" letter-spacing="3" text-anchor="middle" y="7">
      "AND ON THE SEVENTH DAY, HE SAID: PUFF PUFF PASS, ADAM."
    </text>
  </g>
</svg>
