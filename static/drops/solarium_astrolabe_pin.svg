<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Heavy Enamel Pin Drop Shadow -->
    <filter id="pin-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- 24K Polished Gold Gradient -->
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C2" />
      <stop offset="20%" stop-color="#E5B942" />
      <stop offset="45%" stop-color="#A6781E" />
      <stop offset="70%" stop-color="#FCE588" />
      <stop offset="85%" stop-color="#D9A832" />
      <stop offset="100%" stop-color="#8C5C10" />
    </linearGradient>

    <!-- Deep Bevel Gold Shadow -->
    <linearGradient id="gold-bevel" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#734B0B" />
      <stop offset="40%" stop-color="#B88A28" />
      <stop offset="100%" stop-color="#FFE885" />
    </linearGradient>

    <!-- Midnight Blue Glass Enamel Radial -->
    <radialGradient id="enamel-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#122A4A" />
      <stop offset="70%" stop-color="#071324" />
      <stop offset="100%" stop-color="#030812" />
    </radialGradient>

    <!-- Opal Gemstone Refraction Gradient -->
    <radialGradient id="opal-glow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#88F3FF" />
      <stop offset="55%" stop-color="#4E8FFF" />
      <stop offset="80%" stop-color="#9C52FF" />
      <stop offset="100%" stop-color="#1C2E66" />
    </radialGradient>
  </defs>

  <!-- Enamel Pin Assembly with Shadow -->
  <g filter="url(#pin-shadow)">
    <!-- 1. Outer Polished Gold Base Plate -->
    <circle cx="400" cy="400" r="360" fill="url(#gold-bevel)" />
    <circle cx="400" cy="400" r="350" fill="url(#gold-bright)" />
    
    <!-- 2. Outer Beaded Filigree Ring -->
    <circle cx="400" cy="400" r="332" fill="#734B0B" />
    <circle cx="400" cy="400" r="328" fill="url(#gold-bright)" />

    <!-- 3. Midnight Blue Hard Enamel Dial Face -->
    <circle cx="400" cy="400" r="320" fill="url(#enamel-blue)" />

    <!-- Astrolabe Coordinate Latitude Rings -->
    <circle cx="400" cy="400" r="290" fill="none" stroke="url(#gold-bright)" stroke-width="2" opacity="0.7" />
    <circle cx="400" cy="400" r="245" fill="none" stroke="url(#gold-bright)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
    <circle cx="400" cy="400" r="195" fill="none" stroke="url(#gold-bright)" stroke-width="2" opacity="0.75" />
    <circle cx="400" cy="400" r="140" fill="none" stroke="url(#gold-bright)" stroke-width="1.5" opacity="0.6" />

    <!-- Astronomical Degree Tick Marks (24 divisions) -->
    <g stroke="url(#gold-bright)" stroke-width="2.5" opacity="0.85">
      <line x1="400" y1="85" x2="400" y2="105" />
      <line x1="400" y1="695" x2="400" y2="715" />
      <line x1="85" y1="400" x2="105" y2="400" />
      <line x1="695" y1="400" x2="715" y2="400" />
      
      <!-- 45-degree ticks -->
      <line x1="177" y1="177" x2="191" y2="191" />
      <line x1="623" y1="177" x2="609" y2="191" />
      <line x1="177" y1="623" x2="191" y2="609" />
      <line x1="623" y1="623" x2="609" y2="609" />

      <!-- 30-degree ticks -->
      <line x1="250" y1="140" x2="260" y2="157" />
      <line x1="550" y1="140" x2="540" y2="157" />
      <line x1="250" y1="660" x2="260" y2="643" />
      <line x1="550" y1="660" x2="540" y2="643" />
      
      <line x1="140" y1="250" x2="157" y2="260" />
      <line x1="140" y1="550" x2="157" y2="540" />
      <line x1="660" y1="250" x2="643" y2="260" />
      <line x1="660" y1="550" x2="643" y2="540" />
    </g>

    <!-- Celestial Constellation Dots (Hard Enamel recessed gold stars) -->
    <g fill="#FFE885">
      <circle cx="330" cy="220" r="3.5" />
      <circle cx="360" cy="190" r="2.5" />
      <circle cx="460" cy="210" r="3" />
      <circle cx="500" cy="250" r="4" />
      <circle cx="270" cy="330" r="2.5" />
      <circle cx="280" cy="480" r="3.5" />
      <circle cx="490" cy="490" r="3" />
      <circle cx="440" cy="560" r="4" />
      <circle cx="340" cy="580" r="2.5" />
    </g>

    <!-- 4. The 8-Pointed Celestial Master Compass Star (Gold Cloisonné Wire) -->
    <!-- Major North/South/East/West Points (faceted light/shadow) -->
    <!-- North Point -->
    <polygon points="400,105 382,340 400,350" fill="url(#gold-bright)" />
    <polygon points="400,105 418,340 400,350" fill="url(#gold-bevel)" />
    <!-- South Point -->
    <polygon points="400,695 382,460 400,450" fill="url(#gold-bevel)" />
    <polygon points="400,695 418,460 400,450" fill="url(#gold-bright)" />
    <!-- East Point -->
    <polygon points="695,400 460,382 450,400" fill="url(#gold-bright)" />
    <polygon points="695,400 460,418 450,400" fill="url(#gold-bevel)" />
    <!-- West Point -->
    <polygon points="105,400 340,382 350,400" fill="url(#gold-bevel)" />
    <polygon points="105,400 340,418 350,400" fill="url(#gold-bright)" />

    <!-- Intermediate Points (NE, NW, SE, SW - slightly shorter) -->
    <!-- NE Point -->
    <polygon points="590,210 445,365 435,380" fill="url(#gold-bright)" />
    <polygon points="590,210 465,345 435,380" fill="url(#gold-bevel)" />
    <!-- NW Point -->
    <polygon points="210,210 335,345 365,380" fill="url(#gold-bevel)" />
    <polygon points="210,210 355,365 365,380" fill="url(#gold-bright)" />
    <!-- SE Point -->
    <polygon points="590,590 465,455 435,420" fill="url(#gold-bright)" />
    <polygon points="590,590 445,435 435,420" fill="url(#gold-bevel)" />
    <!-- SW Point -->
    <polygon points="210,590 355,435 365,420" fill="url(#gold-bevel)" />
    <polygon points="210,590 335,455 365,420" fill="url(#gold-bright)" />

    <!-- 5. Center Cabochon Bezel & Opal Gemstone -->
    <!-- Heavy Gold Bezel Setting -->
    <circle cx="400" cy="400" r="82" fill="url(#gold-bevel)" />
    <circle cx="400" cy="400" r="76" fill="url(#gold-bright)" />
    <circle cx="400" cy="400" r="68" fill="#5E3A06" />

    <!-- Iridescent Synthetic Fire Opal Gemstone -->
    <circle cx="400" cy="400" r="64" fill="url(#opal-glow)" />

    <!-- Opal Shimmer & Specular Flare -->
    <ellipse cx="380" cy="378" rx="28" ry="16" fill="#FFFFFF" opacity="0.65" transform="rotate(-30 380 378)" />
    <ellipse cx="420" cy="425" rx="18" ry="10" fill="#FFE28A" opacity="0.4" transform="rotate(20 420 425)" />

    <!-- Solarium 432 Hz Core Runic Glyphs on Outer Ring -->
    <text font-family="'Georgia', serif" font-size="16" font-weight="bold" fill="url(#gold-bright)" letter-spacing="4">
      <textPath href="#astrolabe-top-path" startOffset="50%" text-anchor="middle">
        SOLARIUM OBSERVATORY • 432 HZ
      </textPath>
    </text>
    <path id="astrolabe-top-path" d="M 120,400 A 280,280 0 1,1 680,400" fill="none" />
  </g>
</svg>
