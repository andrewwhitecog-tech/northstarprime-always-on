<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Forest Night & Pine Woodcuts -->
    <linearGradient id="forestCanopy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="woodcutGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="woodcutShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#020806"/>

  <!-- DIE CUT MEDALLION -->
  <g transform="translate(400, 400)" filter="url(#woodcutShadow)">
    <circle cx="0" cy="0" r="375" fill="#ffffff"/>
    <circle cx="0" cy="0" r="365" fill="#141e15" stroke="url(#woodcutGold)" stroke-width="7"/>
    <circle cx="0" cy="0" r="350" fill="url(#forestCanopy)" stroke="#065f46" stroke-width="2"/>

    <!-- Concentric Douglas Fir Twig Border -->
    <circle cx="0" cy="0" r="335" fill="none" stroke="url(#woodcutGold)" stroke-width="2" stroke-dasharray="6,6"/>

    <!-- BACKGROUND: Cascadia Old-Growth Forest & Mt. Hood Peak -->
    <g opacity="0.45" stroke="#10b981" stroke-width="1.5" fill="none">
      <!-- Distant Mountain Peak -->
      <polygon points="0,-180 110,-40 -110,-40" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <line x1="0" y1="-180" x2="0" y2="-40"/>
      <!-- Symmetrical Old-Growth Conifers -->
      <polygon points="-160,-120 -185,-50 -135,-50"/>
      <polygon points="-160,-60 -195,10 -125,10"/>
      <polygon points="160,-120 185,-50 135,-50"/>
      <polygon points="160,-60 195,10 125,10"/>
      <polygon points="-240,-80 -270,-10 -210,-10"/>
      <polygon points="240,-80 270,-10 210,-10"/>
    </g>

    <!-- THE FALLEN MOSSY CEDAR LOG SEAT -->
    <g transform="translate(0, 150)">
      <path d="M -260 20 Q 0 40 260 20 L 260 90 Q 0 110 -260 90 Z" fill="#451a03" stroke="#1c0b02" stroke-width="4"/>
      <!-- Cedar Tree Rings on left end -->
      <ellipse cx="-260" cy="55" rx="15" ry="35" fill="#78350f" stroke="#1c0b02" stroke-width="2.5"/>
      <!-- Moss patches on log -->
      <path d="M -180 22 Q -150 10 -120 23" stroke="#10b981" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M 60 26 Q 100 12 140 26" stroke="#10b981" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M -40 28 Q 0 16 40 28" stroke="#10b981" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- LEFT FIGURE: KWI-KWIT (SASQUATCH OF TILLAMOOK) -->
    <g transform="translate(-110, 40)">
      <!-- Massive Furry Body & Shoulders -->
      <path d="M -90 140 C -110 50 -80 -70 -20 -90 C 40 -90 70 -50 70 140 Z" fill="#291508" stroke="#0f0703" stroke-width="3"/>
      <!-- Massive Forearm resting on knee -->
      <path d="M -60 10 Q -30 60 20 60" stroke="#3d210d" stroke-width="22" stroke-linecap="round" fill="none"/>
      
      <!-- Sasquatch Head & Furry Brow -->
      <circle cx="-10" cy="-110" r="42" fill="#291508" stroke="#0f0703" stroke-width="2"/>
      <ellipse cx="-10" cy="-105" rx="30" ry="24" fill="#3d210d"/>
      <!-- Kind, Wise, Relaxed Eyes -->
      <ellipse cx="-22" cy="-112" rx="6" ry="4" fill="#fef08a"/>
      <circle cx="-21" cy="-112" r="2" fill="#000000"/>
      <ellipse cx="2" cy="-112" rx="6" ry="4" fill="#fef08a"/>
      <circle cx="3" cy="-112" r="2" fill="#000000"/>
      <!-- Peaceful Smile -->
      <path d="M -18 -92 Q -10 -84 -2 -92" fill="none" stroke="#0f0703" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Broad Nose -->
      <ellipse cx="-10" cy="-100" rx="10" ry="6" fill="#1c0b02"/>
    </g>

    <!-- RIGHT FIGURE: CASTOR "BLAZE" FIBER (BLAZIN' BEAVER) -->
    <g transform="translate(120, 75)">
      <!-- Body & Buffalo Plaid Flannel -->
      <path d="M -55 105 C -55 40 -35 0 10 0 C 55 0 75 40 75 105 Z" fill="#b91c1c" stroke="#18181b" stroke-width="2.5"/>
      <!-- Plaid Cross Stripes -->
      <line x1="-50" y1="35" x2="70" y2="35" stroke="#18181b" stroke-width="6"/>
      <line x1="-50" y1="70" x2="70" y2="70" stroke="#18181b" stroke-width="6"/>
      <line x1="10" y1="0" x2="10" y2="105" stroke="#18181b" stroke-width="6"/>

      <!-- Beaver Tail resting off back of log -->
      <path d="M 60 70 Q 120 75 135 110 Q 110 135 70 105 Z" fill="#54250e" stroke="#18181b" stroke-width="2"/>

      <!-- Head & Beanie -->
      <circle cx="10" cy="-25" r="28" fill="#8d4925" stroke="#18181b" stroke-width="2"/>
      <path d="M -15 -35 C -15 -65 35 -65 35 -35 Z" fill="#15803d" stroke="#052e16" stroke-width="2"/> <!-- Pine Beanie -->
      <rect x="-18" y="-38" width="56" height="10" rx="3" fill="#166534"/>

      <!-- Beaver Incisors & Cheeks -->
      <ellipse cx="5" cy="-15" rx="18" ry="12" fill="#a16207"/>
      <rect x="0" y="-8" width="5" height="10" fill="#ea580c"/>
      <rect x="6" y="-8" width="5" height="10" fill="#ea580c"/>
      <!-- Stoned Happy Eyes -->
      <path d="M -8 -28 Q -2 -34 4 -28" fill="none" stroke="#18181b" stroke-width="2"/>
      <path d="M 12 -28 Q 18 -34 24 -28" fill="none" stroke="#18181b" stroke-width="2"/>
    </g>

    <!-- SHARED HAND-CARVED CEDAR PIPE IN CENTER -->
    <g transform="translate(0, 80)">
      <!-- Long Stem Pipe passed between Sasquatch and Beaver -->
      <path d="M -60 20 L 40 20 L 45 -5 L 65 -5 L 60 25 Q -10 32 -60 22 Z" fill="#78350f" stroke="#18181b" stroke-width="2.5"/>
      <circle cx="55" cy="-2" r="5" fill="#ea580c"/>
      <circle cx="55" cy="-2" r="2.5" fill="#fef08a"/>

      <!-- Fragrant Aromatic Smoke Spiral ascending into canopy -->
      <path d="M 55 -10 C 65 -50 30 -90 50 -130 C 70 -170 30 -210 50 -250" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <!-- Starlight Spores in smoke -->
      <polygon points="50,-150 53,-158 61,-160 53,-162 50,-170 47,-162 39,-160 47,-158" fill="#fef08a"/>
      <polygon points="35,-190 37,-195 42,-196 37,-197 35,-202 33,-197 28,-196 33,-195" fill="#34d399"/>
    </g>

    <!-- ARCHED TYPOGRAPHY -->
    <path id="sasquatchArcTop" d="M -260 0 A 260 260 0 1 1 260 0" fill="none"/>
    <text font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="22" fill="url(#woodcutGold)" letter-spacing="5" text-anchor="middle">
      <textPath href="#sasquatchArcTop" startOffset="50%">PEACE IN THE OLD GROWTH</textPath>
    </text>

    <path id="sasquatchArcBottom" d="M 260 0 A 260 260 0 0 1 -260 0" fill="none"/>
    <text font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#10b981" letter-spacing="4" text-anchor="middle">
      <textPath href="#sasquatchArcBottom" startOffset="50%">BLAZIN' BEAVER &amp; KWI-KWIT • TILLAMOOK TO TIGARD</textPath>
    </text>
  </g>
</svg>
