name: Storefront conversion audit
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        width: [390, 1280]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      WIDTH: ${{ matrix.width }}
    steps:
      - name: Wait for deployed physical inquiry links
        shell: python
        run: |
          import time,urllib.request
          for attempt in range(45):
              try:
                  with urllib.request.urlopen('https://northstarprime.net/rich-yn/?check=inquiries-'+str(attempt),timeout=10) as response:
                      if response.read().count(b'RICH%20YN%20availability')==7:break
              except OSError:pass
              time.sleep(12)
          else:raise RuntimeError('The release is still missing seven item-specific links')
      - run: python -m pip -q install playwright requests beautifulsoup4
      - shell: python
        run: |
          import os,re
          from pathlib import Path
          from urllib.parse import urlsplit,parse_qs
          from playwright.sync_api import sync_playwright,expect
          width=int(os.environ['WIDTH'])
          url='https://northstarprime.net/rich-yn/'
          with sync_playwright() as pw:
              b=pw.chromium.launch(executable_path='/usr/bin/google-chrome',args=['--disable-gpu'])
              p=b.new_page(viewport={'width':width,'height':844},is_mobile=(width==390),has_touch=(width==390))
              def visit():p.goto(url,wait_until='domcontentloaded')
              visit()
              cards=p.locator('article').filter(has_text='Printful NorthStar POD')
              assert cards.count()==7
              subjects=set()
              for i in range(7):
                  c=cards.nth(i)
                  link=c.get_by_role('link',name=re.compile('Ask about this'))
                  title=c.locator('h3').inner_text().split(' — ')[0]
                  dest=parse_qs(urlsplit(link.get_attribute('href')).query)
                  assert title.split()[0] in dest['subject'][0],title
                  link.click()
                  expect(p.locator('#subject-preview')).to_have_text(dest['subject'][0])
                  expect(p.locator('#message-preview')).to_have_text(dest['body'][0])
                  mail=urlsplit(p.locator('#draft-link').get_attribute('href'))
                  assert mail.scheme=='mailto' and mail.path=='contact@northstarprime.net'
                  assert parse_qs(mail.query)==dest
                  assert 'shipping' in dest['body'][0] and 'availability' in dest['body'][0]
                  subjects.add(dest['subject'][0])
                  visit()
              assert len(subjects)==7
              print('PASS all seven distinct physical inquiries at',width,flush=True)
              b.close()

  gumroad-cart:
    strategy:
      fail-fast: false
      matrix:
        width: [390, 1280]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      WIDTH: ${{ matrix.width }}
    steps:
      - run: python -m pip -q install playwright requests beautifulsoup4
      - shell: python
        run: |
          import os,json
          from urllib.parse import urlsplit,parse_qs
          from playwright.sync_api import sync_playwright,expect
          width=int(os.environ['WIDTH'])
          with sync_playwright() as pw:
              b=pw.chromium.launch(executable_path='/usr/bin/google-chrome',args=['--disable-gpu'])
              opts={'viewport':{'width':width,'height':844},'is_mobile':width==390,'has_touch':width==390}
              ctx=b.new_context(**opts)
              page=ctx.new_page()
              page.goto('https://northstarprime.net/merch/',wait_until='domcontentloaded')
              card=page.locator('#bm-tarot-78')
              with page.expect_popup() as opened:card.locator('.button.primary').click()
              listing=opened.value
              buy=listing.get_by_role('link',name='I want this!',exact=True).first
              expect(buy).to_be_visible(timeout=18000)
              href=buy.get_attribute('href')
              u=urlsplit(href)
              assert u.scheme=='https' and u.hostname=='gumroad.com' and u.path=='/checkout'
              assert parse_qs(u.query)['product']==['pshjy']
              review=b.new_context(java_script_enabled=False,**opts)
              def document_only(r):
                  if r.request.method=='GET' and r.request.url==href and r.request.resource_type=='document':r.continue_()
                  else:r.abort()
              review.route('**/*',document_only)
              doc=review.new_page()
              response=doc.goto(href,wait_until='domcontentloaded')
              assert response.status==200,response.status
              result=json.loads(doc.locator('[data-page]').get_attribute('data-page'))
              assert result['component']=='Checkout/Show',result['component']
              def values(x,key):
                  if isinstance(x,list):
                      for v in x:yield from values(v,key)
                  elif isinstance(x,dict):
                      if key in x:yield x[key]
                      for v in x.values():yield from values(v,key)
              props=result['props']
              assert 'VORATH Tarot — full 78-card digital deck' in list(values(props,'name'))
              assert 'pshjy' in list(values(props,'permalink'))
              assert 1200 in list(values(props,'price_cents')) and 1 in list(values(props,'quantity'))
              print('PASS live merch to published deck to official checkout with one $12 deck',width,flush=True)
              b.close()
