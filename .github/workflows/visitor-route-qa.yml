name: NorthStar visitor route checks
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f6fb46bc38c76bdaae827837de8ea93725c6905f
          sparse-checkout: |
            music
            realm
            .github/hq_audio_review
            static/games
            store
            play
            links
            merch
            chromatic
            stickerforge
            parody-drop
            community
            idc-programming
            tools
            tests
            static/front
            static/cards
            warband/art
          persist-credentials: false
      - run: python -m pip -q install playwright beautifulsoup4 pillow pytest requests
      - run: git sparse-checkout add arcade/custom/kosher-lines arcade/custom/crib-recovered-assets static/vendor/three static/fonts && node --test tests/kosher-*.test.mjs
      - name: Browser verification
        shell: python
        run: |
          import re,sys,json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from bs4 import BeautifulSoup
          import requests
          sys.path.insert(0,'tools')
          import build_pages_artifact as build
          roots=['arcade/custom/kosher-lines','arcade/custom/crib-recovered-assets']
          included=[rel for _,rel in build.iter_source_files()]
          for root in roots:
              assert any(p.is_file() for p in Path(root).rglob('*'))
              assert not any(p.is_relative_to(root) for p in included)
          print('MAIN Pages exclusions verified')
          products={'northstar-7icon-parody-vault':2400,'northstar-12pack-watertight-stl-vault':2900,'northstar-idg-5game-html5-webgl-arcade-pack':900,'northstar-godot4-6game-core-bundle':1200,'northstar-godot4-9game-clean-vault':1500,'anodized-empires-and-anomalies-collector-vault':1900}
          with sync_playwright() as p:
              b=p.chromium.launch(executable_path='/usr/bin/google-chrome',args=['--disable-gpu'])
              for slug,cents in products.items():
                  page=b.new_page(viewport={'width':390,'height':840})
                  r=page.goto('https://andrewcog.gumroad.com/l/'+slug,wait_until='domcontentloaded')
                  assert r.status==200
                  details=json.loads(page.locator('[data-page]').get_attribute('data-page'))['props']['product']
                  assert details['is_published'] and details['price_cents']==cents and details['currency_code']=='usd'
                  control=page.get_by_text(re.compile(r'^(I want this!|Buy now|Add to cart|Buy this)$',re.I)).first
                  try:
                      control.wait_for(state='visible',timeout=15000)
                  except Exception:
                      print('VISIBLE CONTROLS',page.locator('button:visible,a:visible,[role=button]:visible').all_inner_texts()[:35],flush=True)
                      raise
                  assert control.is_enabled()
                  print('WAVE6',slug,cents,control.inner_text(),flush=True)
                  page.close()
              b.close()
