<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="parkWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="30%" stop-color="#270e02"/>
      <stop offset="70%" stop-color="#3b1504"/>
      <stop offset="100%" stop-color="#1c0b02"/>
    </linearGradient>

    <!-- Woodgrain Texture Pattern -->
    <pattern id="woodGrain" width="200" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="5" x2="200" y2="5" stroke="#1f0a02" stroke-width="2" opacity="0.4"/>
      <line x1="0" y1="12" x2="200" y2="12" stroke="#5c2609" stroke-width="1.5" opacity="0.3"/>
      <line x1="0" y1="18" x2="200" y2="18" stroke="#1f0a02" stroke-width="1" opacity="0.4"/>
    </pattern>

    <!-- USFS Carved Yellow Lettering Shadow -->
    <filter id="carvedLetter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#0f0501" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="-1" stdDeviation="1" flood-color="#fef08a" flood-opacity="0.3"/>
    </filter>

    <filter id="signDieCutShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#04080c"/>

  <!-- DIE-CUT VINYL SHIELD CONTAINER -->
  <g transform="translate(400, 300)" filter="url(#signDieCutShadow)">
    
    <!-- Die-Cut White Vinyl Margin (Chamfered Rectangular Sign) -->
    <path d="M -360 -240 L 360 -240 Q 380 -240 380 -220 L 380 220 Q 380 240 360 240 L -360 240 Q -380 240 -380 220 L -380 -220 Q -380 -240 -360 -240 Z" fill="#ffffff"/>
    
    <!-- Rustic Wood Signboard Body -->
    <path d="M -345 -225 L 345 -225 Q 365 -225 365 -205 L 365 205 Q 365 225 345 225 L -345 225 Q -365 225 -365 205 L -365 -205 Q -365 -225 -345 -225 Z" fill="url(#parkWood)" stroke="#1a0801" stroke-width="5"/>
    <path d="M -345 -225 L 345 -225 Q 365 -225 365 -205 L 365 205 Q 365 225 345 225 L -345 225 Q -365 225 -365 205 L -365 -205 Q -365 -225 -345 -225 Z" fill="url(#woodGrain)"/>

    <!-- Routed Yellow Groove Inner Border -->
    <path d="M -325 -205 L 325 -205 Q 345 -205 345 -185 L 345 185 Q 345 205 325 205 L -325 205 Q -345 205 -345 185 L -345 -185 Q -345 -205 -325 -205 Z" fill="none" stroke="#facc15" stroke-width="4" filter="url(#carvedLetter)"/>

    <!-- Top Badge Header: USFS & State Parks Style -->
    <g transform="translate(0, -155)">
      <!-- Trapezoidal Wood Shield Header -->
      <path d="M -220 -20 L 220 -20 L 190 20 L -190 20 Z" fill="#2d1204" stroke="#facc15" stroke-width="2"/>
      <text x="0" y="7" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="19" fill="#fef08a" text-anchor="middle" letter-spacing="4" filter="url(#carvedLetter)">OREGON BOTANICAL RESERVE</text>
    </g>

    <!-- Mt. Hood Silhouette & Douglas Fir Backdrop -->
    <g opacity="0.3" fill="#15803d">
      <!-- Mountain Peak -->
      <polygon points="0,-110 90,-40 -90,-40" fill="#f8fafc" opacity="0.5"/>
      <!-- Douglas Firs -->
      <polygon points="-240,-30 -225,-80 -210,-30"/>
      <polygon points="-180,-30 -165,-90 -150,-30"/>
      <polygon points="-120,-30 -105,-75 -90,-30"/>
      <polygon points="120,-30 105,-75 90,-30"/>
      <polygon points="180,-30 165,-90 150,-30"/>
      <polygon points="240,-30 225,-80 210,-30"/>
    </g>

    <!-- MAIN CARVED STATEMENT -->
    <g transform="translate(0, 15)">
      <text x="0" y="-35" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#fef08a" text-anchor="middle" letter-spacing="5" filter="url(#carvedLetter)">PLEASE KEEP</text>
      <text x="0" y="35" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="70" fill="#facc15" text-anchor="middle" letter-spacing="6" filter="url(#carvedLetter)">ON THE GRASS</text>
      
      <!-- Underline Carved Flourish with Cannabis Fan Leaf -->
      <line x1="-240" y1="65" x2="-35" y2="65" stroke="#facc15" stroke-width="4" filter="url(#carvedLetter)"/>
      <line x1="35" y1="65" x2="240" y2="65" stroke="#facc15" stroke-width="4" filter="url(#carvedLetter)"/>
      
      <!-- Center 5-Leaf Cannabis Icon -->
      <g transform="translate(0, 65)" fill="#facc15" filter="url(#carvedLetter)">
        <path d="M 0 0 C -4 -10 -3 -22 0 -26 C 3 -22 4 -10 0 0 Z"/>
        <path d="M 0 0 C -10 -5 -18 -15 -20 -20 C -16 -18 -8 -8 0 0 Z"/>
        <path d="M 0 0 C 10 -5 18 -15 20 -20 C 16 -18 8 -8 0 0 Z"/>
        <path d="M 0 0 C -12 2 -22 -2 -25 -6 C -20 -5 -10 0 0 0 Z"/>
        <path d="M 0 0 C 12 2 22 -2 25 -6 C 20 -5 10 0 0 0 Z"/>
      </g>
    </g>

    <!-- Bottom Ranger District Notice -->
    <g transform="translate(0, 165)">
      <text x="0" y="0" font-family="'Arial Black', sans-serif" font-weight="800" font-size="14" fill="#fef08a" text-anchor="middle" letter-spacing="3" filter="url(#carvedLetter)">TIGARD RANGER DISTRICT • 10015 SW HALL BLVD</text>
      <text x="0" y="20" font-family="'Inter', sans-serif" font-weight="700" font-size="10.5" fill="#fde047" text-anchor="middle" letter-spacing="1.5">SANCTIONED BY THE CHIEF HYDRAULIC BEAVER</text>
    </g>

    <!-- Brass Mounting Screws in 4 corners -->
    <circle cx="-330" cy="-190" r="7" fill="#78350f" stroke="#facc15" stroke-width="2"/>
    <line x1="-334" y1="-190" x2="-326" y2="-190" stroke="#000000" stroke-width="2"/>
    <circle cx="330" cy="-190" r="7" fill="#78350f" stroke="#facc15" stroke-width="2"/>
    <line x1="326" y1="-190" x2="334" y2="-190" stroke="#000000" stroke-width="2"/>
    <circle cx="-330" cy="190" r="7" fill="#78350f" stroke="#facc15" stroke-width="2"/>
    <line x1="-334" y1="190" x2="-326" y2="190" stroke="#000000" stroke-width="2"/>
    <circle cx="330" cy="190" r="7" fill="#78350f" stroke="#facc15" stroke-width="2"/>
    <line x1="326" y1="190" x2="334" y2="190" stroke="#000000" stroke-width="2"/>
  </g>
</svg>
