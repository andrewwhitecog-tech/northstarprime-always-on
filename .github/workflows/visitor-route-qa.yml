name: NorthStar visitor route checks
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 837ea7dc5e49cb126a92e9ef9d8d407e7f5b46ed
          sparse-checkout: |
            music
            realm
            .github/hq_audio_review
            static/games
            store
            play
            links
            merch
            chromatic
            stickerforge
            parody-drop
            community
            idc-programming
            tools
            tests
            static/front
            static/cards
            warband/art
          persist-credentials: false
      - run: python -m pip -q install playwright beautifulsoup4 pillow pytest requests

      - name: Browser verification
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import urlsplit
          import json
          import requests
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright
          url='https://andrewcog.gumroad.com/l/ouklmz'
          r=requests.get(url,timeout=20)
          r.raise_for_status()
          product=json.loads(BeautifulSoup(r.content,'html.parser').select_one('[data-page]')['data-page'])['props']['product']
          assert product['is_published'] and product['price_cents']==0 and product['currency_code']=='usd'
          with sync_playwright() as p:
              b=p.chromium.launch(executable_path='/usr/bin/google-chrome',args=['--disable-gpu'])
              for route,width in [('store',1280),('links',390)]:
                  page=b.new_page(viewport={'width':width,'height':850})
                  site='https://northstarprime.net/'+route+'/'
                  page.route(site,lambda r:r.fulfill(content_type='text/html',body=Path(route+'/index.html').read_bytes()))
                  page.goto(site,wait_until='domcontentloaded')
                  link=page.get_by_role('link',name='Leave a tip',exact=False)
                  assert link.count()==1 and link.is_visible() and link.get_attribute('href').split('?')[0]==url
                  print('TIP',route,width,product['price_cents'],link.inner_text(),flush=True)
                  page.close()
              b.close()
