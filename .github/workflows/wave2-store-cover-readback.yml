name: Wave 2 storefront cover readback
on:
  push:
    branches: [qa/wave2-store-cover-readback]
permissions:
  contents: read
jobs:
  covers:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            store
            holidays
            links
            rich-yn
            comics
            tests/test_wave8_gumroad_vaults_wire_20261125.py
            static/front
            static/front-door.css
      - run: |
          python -m pip install 'playwright==1.55.0' 'pytest==8.4.2'
          python -m playwright install --with-deps chromium
      - name: Check the Wave 8 product records against the project regression test
        run: python -m pytest -q tests/test_wave8_gumroad_vaults_wire_20261125.py -k covers_copy_and_jsonld
      - name: Inspect the real store and holiday cards
        shell: python
        run: |
          from pathlib import Path
          import json, functools, http.server, threading
          from playwright.sync_api import sync_playwright
          products = [["/static/front/store/anodized-empires-collector-vault-cover.webp","https://andrewcog.gumroad.com/l/anodized-empires-and-anomalies-collector-vault"],["/static/front/store/northstar-12pack-watertight-stl-vault-cover.webp","https://andrewcog.gumroad.com/l/northstar-12pack-watertight-stl-vault"],["/static/front/store/northstar-2026-free-mega-sampler-cover.webp","https://andrewcog.gumroad.com/l/northstar-2026-free-mega-sampler"],["/static/front/store/northstar-godot4-6game-core-bundle-cover.webp","https://andrewcog.gumroad.com/l/northstar-godot4-6game-core-bundle"],["/static/front/store/northstar-godot4-9game-clean-vault-cover.webp","https://andrewcog.gumroad.com/l/northstar-godot4-9game-clean-vault"],["/static/front/store/northstar-idg-5game-html5-arcade-cover.webp","https://andrewcog.gumroad.com/l/northstar-idg-5game-html5-webgl-arcade-pack"]]
          eye = ["/static/front/nsp_signal_eye_v15.webp","https://andrewcog.gumroad.com/"]
          out = Path("screens")
          out.mkdir()
          handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory=".")
          with http.server.ThreadingHTTPServer(("127.0.0.1",0),handler) as srv, sync_playwright() as pw:
              threading.Thread(target=srv.serve_forever,daemon=True).start()
              browser=pw.chromium.launch()
              try:
                  for width in (390,768,1280):
                      page=browser.new_page(viewport={"width":width,"height":900}, device_scale_factor=1)
                      try:
                          for route in ("store","holidays"):
                              page.goto(f"http://127.0.0.1:{srv.server_port}/{route}/",wait_until="domcontentloaded")
                              for src,url in (products+[eye] if route=="store" else [products[2]]):
                                  item=page.locator(f'a[href="{url}"] img[src="{src}"]') if route=="store" else page.locator(f'article:has(a[href="{url}"]) img[src="{src}"]')
                                  assert item.count()==1,(route,src,item.count())
                                  item.scroll_into_view_if_needed()
                                  result=item.evaluate("""async im => { await im.decode();const r=im.getBoundingClientRect();return {natural:[im.naturalWidth,im.naturalHeight],width:r.width,height:r.height,left:r.left,right:r.right,fit:getComputedStyle(im).objectFit,alt:im.alt};}""")
                                  print(json.dumps([width,route,src,result]),flush=True)
                                  assert result["natural"]==([720,720] if src==eye[0] else [1280,720])
                                  assert result["width"]>70 and result["height"]>40 and result["left"]>=-1 and result["right"]<=width+1
                                  assert result["fit"]=="contain" or abs(result["width"]/result["height"] - result["natural"][0]/result["natural"][1])<0.04,(src,result)
                                  card=item.locator("xpath=ancestor::*[self::article or self::a][1]")
                                  cta=card if route=="store" else card.locator(f'a[href="{url}"]')
                                  cta.click(trial=True,timeout=5000)
                                  print("CTA reachable",width,route,url,flush=True)
                                  card.screenshot(path=out/f"{route}-{width}-{Path(src).stem}.png",timeout=15000,animations="disabled")
                      finally:
                          page.close()
              finally:
                  browser.close()
                  srv.shutdown()
          print("PASS 24 buyer-facing cover placements, decoded dimensions, destinations and crop geometry")
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 1d41c7a050b2bdcd32b8b1db3cc636089d9e70cc
          path: prism-source
          sparse-checkout: |
            arcade/custom/prism-drift
            static/games
            warband/art
      - name: Measure the mobile race panel from AG's combined revision
        shell: python
        run: |
          from functools import partial
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          from threading import Thread
          from playwright.sync_api import sync_playwright
          import json
          with ThreadingHTTPServer(("127.0.0.1",0),partial(SimpleHTTPRequestHandler,directory="prism-source")) as s, sync_playwright() as pw:
              Thread(target=s.serve_forever,daemon=True).start()
              browser=pw.chromium.launch()
              try:
                  page=browser.new_page(viewport={"width":390,"height":844},device_scale_factor=1,is_mobile=True,has_touch=True)
                  page.goto(f"http://127.0.0.1:{s.server_port}/arcade/custom/prism-drift/")
                  frame="""() => {const get=id=>document.getElementById(id); const r=id=>{const e=get(id),b=e.getBoundingClientRect();return [b.y,b.height,b.bottom,e.clientHeight,e.scrollHeight]};return {stage:r('stageWrap'),panel:r('overlay'),title:r('overlayTitle'),copy:r('overlayText'),button:r('overlayBtn'),view:[innerWidth,innerHeight,document.documentElement.scrollHeight],controls:[...document.querySelectorAll('.controls button,.controls select')].map(e=>Math.round(e.getBoundingClientRect().height))}}"""
                  print("ORIGINAL",json.dumps(page.evaluate(frame)),flush=True)
                  for css in [".race-message{align-content:start}",".race-message{gap:2px;padding-block:0}.race-message-copy{gap:2px}",".race-message{block-size:180px;gap:2px;padding-block:0}.race-message-copy{gap:2px}",".race-message{grid-template-columns:minmax(0,1fr) auto;gap:6px}.race-message #overlayBtn{max-width:100px;white-space:normal}",".race-message{block-size:auto;min-height:160px;align-content:start}.race-message-copy{gap:2px}.race-message #overlayBtn{min-height:40px}"]:
                      style=page.add_style_tag(content="@media(max-width:720px){"+css+"}")
                      print("CANDIDATE",css,json.dumps(page.evaluate(frame)),flush=True)
                      style.evaluate("e=>e.remove()")
              finally:
                  browser.close()
                  s.shutdown()
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storefront-cover-readback
          path: screens/
          retention-days: 5
