name: NorthStar visitor route checks
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 29e643411005fcb54ba825b7af5e1ec0d9165331
          sparse-checkout: |
            arcade/custom/kosher-lines
            arcade/custom/crib-recovered-assets
            static/vendor/three
            static/fonts
            music
            realm
            .github/hq_audio_review
            static/games
            store
            play
            links
            merch
            chromatic
            stickerforge
            parody-drop
            community
            idc-programming
            tools
            tests
            static/front
            static/cards
            warband/art
          persist-credentials: false
      - run: python -m pip -q install playwright beautifulsoup4 pillow pytest requests

      - name: Browser verification
        shell: python
        run: |
          from playwright.sync_api import sync_playwright
          import http.server,threading
          server=http.server.ThreadingHTTPServer(('127.0.0.1',0),http.server.SimpleHTTPRequestHandler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          with sync_playwright() as p:
              b=p.chromium.launch(executable_path='/usr/bin/google-chrome',args=['--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              page=b.new_page(viewport={'width':390,'height':844},is_mobile=True,has_touch=True,device_scale_factor=1)
              page.goto(f'http://127.0.0.1:{server.server_port}/arcade/custom/kosher-lines/?mode=rival')
              page.wait_for_function('window.__KOSHER_LINES__?.snapshot().action?.enabled',timeout=90000)
              target=page.locator('summary',has_text='Your deck & graphics')
              target.evaluate("e=>e.scrollIntoView({block:'center',behavior:'instant'})")
              print('LAYOUT',target.evaluate("""e=>{let r=e.getBoundingClientRect(),v=visualViewport;return [innerWidth,document.documentElement.scrollWidth,v.width,v.scale,v.offsetTop,scrollY,r.toJSON(),document.elementFromPoint(r.x+r.width/2,r.y+r.height/2)?.outerHTML.slice(0,100),Array.from(document.querySelectorAll('body *')).map(x=>[x.tagName,x.className,x.getBoundingClientRect().right]).filter(x=>x[2]>395).slice(0,18)]}"""),flush=True)
              target.tap(timeout=5000)
              assert target.evaluate('e=>e.parentElement.open')
              print('TOUCH deck opened',flush=True)
              b.close()
          server.shutdown()
