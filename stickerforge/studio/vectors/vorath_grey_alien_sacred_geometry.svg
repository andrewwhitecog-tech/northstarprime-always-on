<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Cosmic & Holographic Gradients -->
    <linearGradient id="alienSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <radialGradient id="amethystGaze" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="30%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#090514"/>
    </radialGradient>

    <linearGradient id="merkabaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="cosmicVoid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="holoFoilAlien" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="25%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="75%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <filter id="alienDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="800" fill="#040711"/>

  <!-- DIE-CUT STICKER BODY -->
  <g transform="translate(400, 400)" filter="url(#alienDropShadow)">
    
    <!-- Outer Die-Cut White Base Margin -->
    <circle cx="0" cy="0" r="375" fill="#ffffff"/>
    <circle cx="0" cy="0" r="365" fill="none" stroke="url(#holoFoilAlien)" stroke-width="8"/>
    <circle cx="0" cy="0" r="352" fill="url(#cosmicVoid)" stroke="url(#merkabaGold)" stroke-width="4"/>

    <!-- SACRED GEOMETRY BACKGROUND (Merkaba & Metatron's Cube) -->
    <g stroke="url(#merkabaGold)" stroke-width="1.5" fill="none" opacity="0.45">
      <!-- Metatron Rings -->
      <circle cx="0" cy="0" r="310"/>
      <circle cx="0" cy="0" r="220"/>
      <circle cx="0" cy="0" r="140"/>

      <!-- 12-Point Star Grid -->
      <polygon points="0,-310 268.4,155 -268.4,155"/>
      <polygon points="0,310 268.4,-155 -268.4,-155"/>
      <polygon points="-310,0 155,268.4 155,-268.4"/>
      <polygon points="310,0 -155,268.4 -155,-268.4"/>

      <!-- Golden Ratio Concentric Squares -->
      <rect x="-155" y="-155" width="310" height="310" stroke-width="1"/>
      <rect x="-110" y="-110" width="220" height="220" transform="rotate(45)" stroke-width="1"/>
    </g>

    <!-- Radiating Starlight Aura Flares -->
    <g stroke="url(#holoFoilAlien)" stroke-width="2" opacity="0.6">
      <line x1="0" y1="-340" x2="0" y2="-240"/>
      <line x1="240" y1="-240" x2="170" y2="-170"/>
      <line x1="340" y1="0" x2="240" y2="0"/>
      <line x1="240" y1="240" x2="170" y2="170"/>
      <line x1="0" y1="340" x2="0" y2="240"/>
      <line x1="-240" y1="240" x2="-170" y2="170"/>
      <line x1="-340" y1="0" x2="-240" y2="0"/>
      <line x1="-240" y1="-240" x2="-170" y2="-170"/>
    </g>

    <!-- VORATH THE GREY (Alien Emissary Figure) -->
    <g id="vorath-bust" transform="translate(0, 30)">
      
      <!-- Flowing Celestial Void Robe Shoulders -->
      <path d="M -160 220 C -140 130 -80 120 0 120 C 80 120 140 130 160 220 Z" fill="#0f172a" stroke="#8b5cf6" stroke-width="3"/>
      <path d="M -110 220 C -70 140 -20 130 0 130 C 20 130 70 140 110 220 Z" fill="#1e1b4b" stroke="url(#holoFoilAlien)" stroke-width="1.5"/>

      <!-- Graceful Slender Neck -->
      <path d="M -30 140 L -25 50 L 25 50 L 30 140 Z" fill="url(#alienSkin)"/>
      <line x1="-25" y1="80" x2="25" y2="80" stroke="#64748b" stroke-width="1" opacity="0.5"/>

      <!-- Iconic Inverted Teardrop Cranium -->
      <path d="M -105 -70 C -120 -180 120 -180 105 -70 C 95 -10 35 60 0 65 C -35 60 -95 -10 -105 -70 Z" fill="url(#alienSkin)" stroke="#1e293b" stroke-width="3"/>
      <!-- Iridescent Violet Cranial Glow Highlight -->
      <path d="M -60 -150 C 0 -170 60 -150 75 -120 C 30 -140 -30 -140 -60 -150 Z" fill="#c084fc" opacity="0.6"/>

      <!-- Large Almond-Shaped Cosmic Amethyst Eyes -->
      <!-- Left Eye -->
      <g transform="translate(-48, -40) rotate(-15)">
        <path d="M -45 0 C -25 -26 25 -26 45 0 C 25 26 -25 26 -45 0 Z" fill="url(#amethystGaze)" stroke="#090514" stroke-width="2.5"/>
        <!-- Star Reflection in Eye -->
        <polygon points="10,-6 13,-12 19,-14 13,-16 10,-22 7,-16 1,-14 7,-12" fill="#ffffff"/>
        <circle cx="-15" cy="5" r="3" fill="#ffffff" opacity="0.7"/>
        <circle cx="20" cy="3" r="2" fill="#38bdf8"/>
      </g>

      <!-- Right Eye -->
      <g transform="translate(48, -40) rotate(15)">
        <path d="M -45 0 C -25 -26 25 -26 45 0 C 25 26 -25 26 -45 0 Z" fill="url(#amethystGaze)" stroke="#090514" stroke-width="2.5"/>
        <!-- Star Reflection in Eye -->
        <polygon points="-10,-6 -7,-12 -1,-14 -7,-16 -10,-22 -13,-16 -19,-14 -13,-12" fill="#ffffff"/>
        <circle cx="15" cy="5" r="3" fill="#ffffff" opacity="0.7"/>
        <circle cx="-20" cy="3" r="2" fill="#38bdf8"/>
      </g>

      <!-- Subtle Serene Facial Features -->
      <!-- Twin Tiny Nostril Pits -->
      <circle cx="-5" cy="18" r="2" fill="#334155"/>
      <circle cx="5" cy="18" r="2" fill="#334155"/>
      <!-- Calm Telepathic Mouth Slit -->
      <path d="M -14 38 Q 0 42 14 38" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- Third Eye Pineal Chakra Point -->
      <circle cx="0" cy="-90" r="7" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5"/>
      <polygon points="0,-115 5,-98 22,-90 5,-82 0,-65 -5,-82 -22,-90 -5,-98" fill="none" stroke="#fef08a" stroke-width="1"/>

      <!-- Celestial Preroll / Cosmic Joint held telepathically -->
      <g transform="translate(65, 45) rotate(-25)">
        <rect x="0" y="0" width="60" height="10" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
        <rect x="0" y="0" width="12" height="10" rx="2" fill="#b45309"/>
        <!-- Glowing Astral Cherry -->
        <circle cx="60" cy="5" r="6" fill="#f97316"/>
        <circle cx="60" cy="5" r="3" fill="#fef08a"/>
        <!-- Smoke plume turning into cosmic helix -->
        <path d="M 64 5 C 80 -10 70 -30 90 -45 C 110 -60 95 -80 120 -100" fill="none" stroke="url(#holoFoilAlien)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
      </g>
    </g>

    <!-- BORDER ARCS & TEXT -->
    <path id="alienArcTop" d="M -260 0 A 260 260 0 1 1 260 0" fill="none"/>
    <text font-family="'Cinzel', 'Courier New', monospace" font-weight="900" font-size="22" fill="url(#merkabaGold)" letter-spacing="5" text-anchor="middle">
      <textPath href="#alienArcTop" startOffset="50%">INTERGALACTIC SEED VAULT</textPath>
    </text>

    <path id="alienArcBottom" d="M 260 0 A 260 260 0 0 1 -260 0" fill="none"/>
    <text font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="url(#holoFoilAlien)" letter-spacing="4" text-anchor="middle">
      <textPath href="#alienArcBottom" startOffset="50%">EMISSARY VORATH-77 • 10015 SW HALL</textPath>
    </text>

    <!-- Starlight Dots -->
    <circle cx="-290" cy="0" r="5" fill="#38bdf8"/>
    <circle cx="290" cy="0" r="5" fill="#38bdf8"/>
  </g>
</svg>
