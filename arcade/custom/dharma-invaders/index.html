<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>COMMENTARY SIEGE : APEX AI EDITION</title>
<style>
:root{color-scheme:dark;--gold:#f0cc75;--ivory:#fff5da;--cyan:#64eaff;--red:#ff426f;--ink:#05030b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#020106}
body{display:grid;place-items:center;font-family:Georgia,"Times New Roman",serif;color:var(--ivory);touch-action:none}
#shell{
  position:relative;
  width:min(100vw,106.667vh);
  height:min(100vh,93.75vw);
  max-width:960px;
  max-height:900px;
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:8px;
  padding:10px;
  background:radial-gradient(circle at 50% 18%,rgba(111,49,142,.25),transparent 48%);
  overflow:hidden;
}
#c{
  display:block;
  width:100%;
  height:100%;
  min-height:0;
  border:1px solid rgba(240,204,117,.4);
  border-radius:12px;
  background:#05030b;
  box-shadow:0 0 34px rgba(100,234,255,.14),0 0 90px rgba(255,66,111,.08),inset 0 0 40px #000;
}
#mast{display:flex;align-items:end;justify-content:space-between;gap:12px;padding:1px 6px;text-transform:uppercase}
#brand{font:700 clamp(12px,2vw,18px)/1 Georgia,serif;letter-spacing:.34em;color:var(--gold);text-shadow:0 0 16px rgba(240,204,117,.6)}
#folio{font:600 clamp(9px,1.4vw,12px)/1.2 ui-monospace,monospace;letter-spacing:.16em;color:var(--cyan);text-align:right}
#controls{display:flex;justify-content:center;gap:8px;min-height:36px;font:600 10px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:#d8caaf}
.key{display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid rgba(240,204,117,.28);border-radius:999px;background:rgba(9,6,18,.8)}
.sig{color:var(--gold);font-weight:700}
#start{position:absolute;inset:0;z-index:4;border:0;background:transparent;color:transparent;cursor:pointer}
#start.hidden{display:none}
@media(max-width:600px){#shell{padding:6px;gap:5px}#controls{gap:4px}.key{padding:6px 8px;font-size:9px}#brand{letter-spacing:.2em}}
</style>
</head>
<body>
<main id="shell" aria-label="Commentary Siege game cabinet">
  <header id="mast">
    <div id="brand">Commentary Siege <span style="font-size:10px;color:var(--cyan);letter-spacing:1px;font-family:ui-monospace,monospace">· APEX AI</span></div>
    <div id="folio">Folio <span id="waveRead">I</span> · Thread <span id="chainRead">0</span></div>
  </header>
  <canvas id="c" width="800" height="720" aria-label="Tribunal balcony defense playfield"></canvas>
  <footer id="controls">
    <div class="key"><span class="sig">← →</span> move</div>
    <div class="key"><span class="sig">space</span> annotate</div>
    <div class="key"><span class="sig">shift / c</span> ward parry</div>
    <div class="key"><span class="sig">q</span> excision beam</div>
    <div class="key"><span class="sig">touch</span> move + cast</div>
  </footer>
  <button id="start" aria-label="Open the margin and begin"></button>
</main>
<script src="/static/games/chiptune.js"></script>
<script>
"use strict";
// ============================================================================
// COMMENTARY SIEGE : APEX AI EDITION
// System 1 Fast Neural Tactical AI + Margin Director + Ward Deflection Parry
// ============================================================================
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d',{alpha:false});
const W=800,H=720,TAU=Math.PI*2;
const COMMENTARY_ATLAS='/static/art/games/vorath_overhaul_v01/commentary_siege/commentary_sentinel_redaction_atlas_v01.webp';
const COMMENTARY_ATLAS_FALLBACK='/static/art/games/vorath_overhaul_v01/commentary_siege/commentary_sentinel_redaction_atlas_v01.png';

const atlas=new Image();
let atlasReady=false,atlasError=false;
atlas.onload=()=>atlasReady=true;
atlas.onerror=()=>{if(atlas.src.endsWith('.webp'))atlas.src=COMMENTARY_ATLAS_FALLBACK;else atlasError=true;};
atlas.src=COMMENTARY_ATLAS;

// --- Procedural Web Audio Engine ---
let audioCtx=null;
function initAudio(){
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC)audioCtx=new AC();
  }
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  try{window.Chiptune?.resume();}catch(e){}
}
function sfx(name){
  initAudio();
  if(!audioCtx)return;
  const now=audioCtx.currentTime;
  try{
    if(name==='shoot'){
      const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
      osc.type='triangle';osc.frequency.setValueAtTime(620,now);osc.frequency.exponentialRampToValueAtTime(140,now+0.1);
      g.gain.setValueAtTime(0.14,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.1);
      osc.connect(g);g.connect(audioCtx.destination);osc.start(now);osc.stop(now+0.1);
    }else if(name==='parry'){
      [523.25, 783.99, 1046.5].forEach((freq,i)=>{
        const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
        osc.type='sine';osc.frequency.setValueAtTime(freq,now+i*0.02);
        g.gain.setValueAtTime(0.2,now+i*0.02);g.gain.exponentialRampToValueAtTime(0.001,now+0.35);
        osc.connect(g);g.connect(audioCtx.destination);osc.start(now+i*0.02);osc.stop(now+0.38);
      });
    }else if(name==='beam'){
      const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
      osc.type='sawtooth';osc.frequency.setValueAtTime(880,now);osc.frequency.linearRampToValueAtTime(220,now+0.25);
      g.gain.setValueAtTime(0.25,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.28);
      osc.connect(g);g.connect(audioCtx.destination);osc.start(now);osc.stop(now+0.28);
    }else if(name==='explode'||name==='death'){
      const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
      osc.type='sawtooth';osc.frequency.setValueAtTime(140,now);osc.frequency.exponentialRampToValueAtTime(30,now+0.35);
      g.gain.setValueAtTime(0.35,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.35);
      osc.connect(g);g.connect(audioCtx.destination);osc.start(now);osc.stop(now+0.35);
    }else if(name==='tick'){
      const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
      osc.type='square';osc.frequency.setValueAtTime(800,now);
      g.gain.setValueAtTime(0.06,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.03);
      osc.connect(g);g.connect(audioCtx.destination);osc.start(now);osc.stop(now+0.03);
    }
    window.Chiptune?.SFX?.[name]?.();
  }catch(_){}
}

const FORM_NAMES=['Ink Moth','Clause Leech','Margin Eater','Tribunal Eraser'];
const ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
const keys=new Set();
let pointerX=null,pointerFire=false,last=performance.now(),time=0,state='menu';
let folio=1,annotations=0,chain=0,bestChain=0,integrity=3,shake=0,flash=0,interlude=0;
let sentinel,bolts,reflectedBolts,redactions,inkDrops,wards,particles,stars,floatingTexts;
let freezeFrames=0;
let beamEnergy=30; // 0..100
let activeBeam=null;

// System 1 Margin Director
const marginDirector={
  tension: 10,
  state: 'EXEGESIS_BUILD', // EXEGESIS_BUILD, HERESY_SURGE, SANCTUARY, TRIBUNAL_CODA
  stateTimer: 0,
  decisionLatencyUs: 0.68,
  surgeTimer: 0
};

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const hit=(a,b,r)=>Math.hypot(a.x-b.x,a.y-b.y)<r;

function atlasSprite(cell,x,y,w,h=w,alpha=1){
  if(!atlasReady)return false;
  const sx=(cell%3)*512,sy=Math.floor(cell/3)*512;
  ctx.save();ctx.globalAlpha=alpha;ctx.drawImage(atlas,sx,sy,512,512,x-w/2,y-h/2,w,h);ctx.restore();return true;
}
function makeStars(){stars=Array.from({length:90},(_,i)=>({x:Math.random()*W,y:Math.random()*H,z:rand(.25,1),h:(i*43)%360}));}
function makeWards(){wards=[160,400,640].map((x,i)=>({x,y:545,hp:6,max:6,phase:i*2.1,hit:0,parryFlash:0}));}

function addFloatingText(x,y,text,color='#f0cc75',size=13){
  floatingTexts.push({x,y,text,color,size,life:1.0,vy:-1.0});
}

function reset(full=true){
  sentinel={
    x:400,y:650,vx:0,cool:0,charge:0,invuln:0,
    dashTimer:0,dashCool:0,dashDir:0,parryWindow:0,isDashing:false,
    echoes:[]
  };
  bolts=[];reflectedBolts=[];inkDrops=[];particles=[];redactions=[];floatingTexts=[];
  makeWards();
  beamEnergy=35;
  activeBeam=null;
  marginDirector.tension=15;
  marginDirector.state='EXEGESIS_BUILD';
  marginDirector.stateTimer=0;

  if(full){folio=1;annotations=0;chain=0;bestChain=0;integrity=3;}
  spawnFolio();state='playing';document.querySelector('#start').classList.add('hidden');syncHud();
}

function spawnFolio(){
  redactions=[];inkDrops=[];const count=Math.min(22,9+folio*2),scripts=['pendulum','drift','hook','stutter'];
  for(let i=0;i<count;i++){
    const row=Math.floor(i/6),slot=i%6,phi=(i*.61803398875%1)*TAU,type=(i+row+folio)%3;
    const baseX=80+slot*128+(row%2?42:-18)+(i%3-1)*9;
    const hp=1+Math.floor(folio/4)+(type===2?1:0);
    redactions.push({
      x:baseX,y:88+row*76+Math.sin(phi)*16,baseX,baseY:88+row*76,
      type,name:FORM_NAMES[type],script:scripts[(i*3+folio+row)%scripts.length],
      phase:phi,age:rand(0,2),hp,maxHp:hp,amp:22+((i*17)%42),freq:.55+((i*13)%9)*.08,
      descent:8+folio*1.8+row*.7,shoot:rand(.7,2.8),alive:true,hit:0,diving:false,diveProgress:0
    });
  }
  if(folio%3===0){
    redactions.push({
      x:400,y:74,baseX:400,baseY:74,type:3,name:FORM_NAMES[3],
      script:'edict',phase:0,age:0,hp:14+folio*3,maxHp:14+folio*3,
      amp:180,freq:.24,descent:3+folio*.45,shoot:.5,alive:true,hit:0,boss:true,diving:false,diveProgress:0
    });
    marginDirector.state='TRIBUNAL_CODA';
    marginDirector.tension=95;
    addFloatingText(400,180,'TRIBUNAL ERASER MANIFESTS!','#f0cc75',18);
  }
  syncHud();
}

function syncHud(){
  document.querySelector('#waveRead').textContent=ROMAN[(folio-1)%ROMAN.length]||String(folio);
  document.querySelector('#chainRead').textContent=chain;
}

// ----------------- COMBAT VERBS -----------------
function cast(){
  if(state==='menu'||state==='lost'){reset(true);sfx('gate');return;}
  if(state!=='playing'||sentinel.cool>0)return;
  bolts.push({x:sentinel.x,y:sentinel.y-43,vy:-680,life:1.25,damage:1});
  sentinel.cool=.15;sentinel.charge=.15;sfx('shoot');
}

function triggerDashParry(){
  if(sentinel.dashCool>0||sentinel.isDashing)return;
  sentinel.isDashing=true;
  sentinel.dashTimer=0.20;
  sentinel.parryWindow=0.14;
  sentinel.dashCool=0.60;
  
  let dir=0;
  if(keys.has('ArrowRight')||keys.has('d'))dir=1;
  else if(keys.has('ArrowLeft')||keys.has('a'))dir=-1;
  else dir=sentinel.vx!==0?Math.sign(sentinel.vx):1;
  sentinel.dashDir=dir;
  
  sfx('parry');
  burst(sentinel.x,sentinel.y,'#f0cc75',12);
  addFloatingText(sentinel.x,sentinel.y-35,'WARD PARRY ROLL','#64eaff',12);
}

function triggerExcisionBeam(){
  if(beamEnergy<50)return;
  beamEnergy-=50;
  activeBeam={x:sentinel.x,life:0.35,width:28};
  freezeFrames=5;
  shake=12;
  sfx('beam');

  // Obliterate all redactions in this vertical column
  let hitCount=0;
  for(const e of redactions){
    if(e.alive&&Math.abs(e.x-sentinel.x)<48){
      e.hp-=6;
      e.hit=0.2;
      hitCount++;
      burst(e.x,e.y,'#f0cc75',16);
      if(e.hp<=0)eraseEnemy(e);
    }
  }
  addFloatingText(sentinel.x,sentinel.y-60,`EXCISION BEAM! [${hitCount} STRUCK]`,'#f0cc75',17);
}

function burst(x,y,color,count=12){
  for(let i=0;i<count;i++){
    const a=Math.random()*TAU,sp=rand(60,260);
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(.35,.85),color,size:rand(1,4)});
  }
  if(particles.length>280)particles.splice(0,particles.length-280);
}

function eraseEnemy(e){
  e.alive=false;
  const pts=e.boss?950:(e.type+1)*80+chain*6;
  annotations+=pts;
  chain++;
  bestChain=Math.max(bestChain,chain);
  beamEnergy=Math.min(100,beamEnergy+(e.boss?40:10));
  
  burst(e.x,e.y,e.boss?'#fff1aa':['#ff4baf','#45f4c6','#ff5d69'][e.type],e.boss?36:14);
  shake=Math.max(shake,e.boss?16:6);
  sfx(e.boss?'explode':'explode');
  addFloatingText(e.x,e.y,`+${pts}`,e.boss?'#fff1aa':'#64eaff',13);
  syncHud();
}

function damageWard(w){
  w.hp--;w.hit=.2;chain=0;
  burst(w.x,w.y-10,'#f0cc75',8);
  shake=Math.max(shake,3);sfx('hurt');syncHud();
}

function restoreWard(w){
  if(w.hp<w.max){
    w.hp++;
    w.parryFlash=0.35;
    burst(w.x,w.y-10,'#64eaff',15);
    addFloatingText(w.x,w.y-25,'WARD HP RESTORED!','#64eaff',13);
  }
}

function breach(){
  integrity--;chain=0;shake=15;flash=.35;sfx(integrity<=0?'death':'hurt');syncHud();
  if(integrity<=0){state='lost';document.querySelector('#start').classList.remove('hidden');}
}

// ----------------- SYSTEM 1 MARGIN DIRECTOR -----------------
function updateDirector(dt){
  const t0=performance.now();
  marginDirector.stateTimer+=dt;

  const isBossActive=redactions.some(e=>e.alive&&e.boss);

  if(isBossActive){
    marginDirector.state='TRIBUNAL_CODA';
    marginDirector.tension=Math.min(100,marginDirector.tension+dt*5);
  }else if(marginDirector.state==='EXEGESIS_BUILD'){
    marginDirector.tension=Math.min(100,marginDirector.tension+dt*6+chain*1.2);
    if(marginDirector.tension>=75||marginDirector.stateTimer>14){
      marginDirector.state='HERESY_SURGE';
      marginDirector.stateTimer=0;
      shake=8;
      addFloatingText(400,160,'DIRECTOR: HERESY SURGE!','#ff426f',18);
    }
  }else if(marginDirector.state==='HERESY_SURGE'){
    marginDirector.tension=Math.min(100,marginDirector.tension+dt*3);
    const aliveCount=redactions.filter(e=>e.alive).length;
    if(marginDirector.stateTimer>9||aliveCount<=4){
      marginDirector.state='SANCTUARY';
      marginDirector.stateTimer=0;
      // Sanctuary bonus: restore 1 HP to lowest ward
      const damaged=wards.filter(w=>w.hp<w.max);
      if(damaged.length)restoreWard(damaged[0]);
      addFloatingText(400,160,'DIRECTOR: SANCTUARY WINDOW','#f0cc75',15);
    }
  }else if(marginDirector.state==='SANCTUARY'){
    marginDirector.tension=Math.max(15,marginDirector.tension-dt*18);
    if(marginDirector.stateTimer>5){
      marginDirector.state='EXEGESIS_BUILD';
      marginDirector.stateTimer=0;
    }
  }

  const t1=performance.now();
  marginDirector.decisionLatencyUs=Math.max(0.2,(t1-t0)*1000);
}

function updateEnemy(e,dt){
  e.age+=dt;e.hit=Math.max(0,e.hit-dt);e.shoot-=dt;
  const p=e.age*e.freq+e.phase;
  
  if(e.script==='pendulum')e.x=e.baseX+Math.sin(p)*e.amp;
  else if(e.script==='drift')e.x=e.baseX+Math.sin(p*.72)*e.amp+Math.sin(p*2.3)*11;
  else if(e.script==='hook')e.x=e.baseX+Math.sign(Math.sin(p))*Math.pow(Math.abs(Math.sin(p)),.45)*e.amp;
  else if(e.script==='stutter')e.x=e.baseX+Math.sin(Math.floor(p*3)/3)*e.amp+Math.cos(p*1.7)*8;
  else e.x=e.baseX+Math.sin(p)*e.amp+Math.sin(p*.37)*55;
  
  e.y=e.baseY+e.age*e.descent+Math.sin(p*1.4)*8;

  // Surge dives during HERESY_SURGE
  if(marginDirector.state==='HERESY_SURGE'&&!e.boss&&Math.random()<0.003){
    e.diving=true;
  }
  if(e.diving)e.y+=dt*65;

  if(e.shoot<=0&&e.y>80){
    const dropType=e.boss?3:e.type;
    const vyBase=150+folio*12+(e.boss?80:0)+(marginDirector.state==='HERESY_SURGE'?40:0);
    inkDrops.push({
      x:e.x,y:e.y+20,vy:vyBase,
      vx:e.boss?rand(-65,65):Math.sin(p)*18,
      type:dropType
    });
    e.shoot=rand(e.boss?.45:1.2,e.boss?.85:2.8)/Math.min(1.7,1+folio*.04);
  }
  if(e.y>610){e.alive=false;breach();}
}

function update(dt){
  if(freezeFrames>0){freezeFrames--;return;}

  time+=dt;
  shake=Math.max(0,shake-dt*32);
  flash=Math.max(0,flash-dt);
  sentinel.cool=Math.max(0,sentinel.cool-dt);
  sentinel.charge=Math.max(0,sentinel.charge-dt);
  sentinel.invuln=Math.max(0,sentinel.invuln-dt);
  if(sentinel.dashCool>0)sentinel.dashCool-=dt;
  if(sentinel.dashTimer>0){
    sentinel.dashTimer-=dt;
    sentinel.x+=sentinel.dashDir*12;
    if(sentinel.dashTimer<=0)sentinel.isDashing=false;
  }
  if(sentinel.parryWindow>0)sentinel.parryWindow-=dt;

  for(const w of wards){
    w.hit=Math.max(0,w.hit-dt);
    if(w.parryFlash)w.parryFlash=Math.max(0,w.parryFlash-dt);
  }

  // Active Beam Duration
  if(activeBeam){
    activeBeam.life-=dt;
    if(activeBeam.life<=0)activeBeam=null;
  }

  if(state!=='playing'){
    if(state==='interlude'){
      interlude-=dt;
      if(interlude<=0){folio++;spawnFolio();state='playing';}
    }
    return;
  }

  // Update Margin Director
  updateDirector(dt);

  // Player controls
  let dir=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0);
  if(pointerX!==null){const delta=pointerX-sentinel.x;dir=Math.abs(delta)>8?Math.sign(delta):0;}
  const target=dir*420;
  sentinel.vx+=(target-sentinel.vx)*Math.min(1,dt*12);
  if(!sentinel.isDashing)sentinel.x=clamp(sentinel.x+sentinel.vx*dt,42,W-42);

  // Dash Echoes
  if(sentinel.isDashing&&Math.floor(time*60)%2===0){
    sentinel.echoes.push({x:sentinel.x,y:sentinel.y,alpha:0.6});
  }
  sentinel.echoes.forEach(ec=>ec.alpha-=0.09);
  sentinel.echoes=sentinel.echoes.filter(ec=>ec.alpha>0);

  if((keys.has(' ')||pointerFire)&&sentinel.cool<=0)cast();

  // Move bolts
  for(const b of bolts){b.y+=b.vy*dt;b.life-=dt;}
  bolts=bolts.filter(b=>b.life>0&&b.y>-30);

  // Move Reflected Parry Bolts (streak upward rapidly)
  for(const b of reflectedBolts){b.y+=b.vy*dt;b.life-=dt;}
  reflectedBolts=reflectedBolts.filter(b=>b.life>0&&b.y>-30);

  // Update enemies
  for(const e of redactions)if(e.alive)updateEnemy(e,dt);

  // Check bolt collision with enemies
  function checkBolts(bList,isReflected=false){
    for(let bi=bList.length-1;bi>=0;bi--){
      const b=bList[bi];
      for(const e of redactions){
        if(e.alive&&hit(b,e,e.boss?48:32)){
          e.hp-=(isReflected?3:1);
          e.hit=.14;
          if(!isReflected)b.life=0;
          if(e.hp<=0)eraseEnemy(e);
          else{sfx('tick');burst(b.x,b.y,'#fff0a8',5);}
          break;
        }
      }
    }
  }
  checkBolts(bolts,false);
  checkBolts(reflectedBolts,true);
  bolts=bolts.filter(b=>b.life>0);

  // Move ink drops
  for(const d of inkDrops){d.x+=d.vx*dt;d.y+=d.vy*dt;}

  // ----------------- WARD / DASH REFLECT PARRY -----------------
  for(let i=inkDrops.length-1;i>=0;i--){
    const d=inkDrops[i];
    let consumed=false;

    // Check Parry window
    if(sentinel.isDashing&&sentinel.parryWindow>0&&Math.hypot(d.x-sentinel.x,d.y-sentinel.y)<38){
      // PARRIED!
      consumed=true;
      freezeFrames=4;
      shake=8;
      sfx('parry');
      reflectedBolts.push({x:sentinel.x,y:sentinel.y-30,vy:-750,life:1.2});
      annotations+=250;
      chain++;
      beamEnergy=Math.min(100,beamEnergy+25);
      
      // Nearest ward gets restored
      let nearestW=null,minDist=Infinity;
      for(const w of wards){
        const dist=Math.hypot(w.x-sentinel.x,w.y-sentinel.y);
        if(dist<minDist){minDist=dist;nearestW=w;}
      }
      if(nearestW)restoreWard(nearestW);

      addFloatingText(sentinel.x,sentinel.y-40,'★ SEAL REFLECT PARRY! +250','#64eaff',15);
      burst(sentinel.x,sentinel.y,'#64eaff',16);
    }

    // Ward collision
    if(!consumed){
      for(const w of wards){
        if(w.hp>0&&Math.abs(d.x-w.x)<68&&Math.abs(d.y-w.y)<34){
          damageWard(w);consumed=true;break;
        }
      }
    }

    // Player collision
    if(!consumed&&!sentinel.isDashing&&sentinel.invuln<=0&&Math.abs(d.x-sentinel.x)<34&&Math.abs(d.y-sentinel.y)<34){
      sentinel.invuln=1.2;consumed=true;breach();
    }

    if(consumed||d.y>H+20)inkDrops.splice(i,1);
  }

  // Interlude trigger
  if(redactions.length&&redactions.every(e=>!e.alive)){
    state='interlude';interlude=1.8;annotations+=300*folio;sfx('gate');
  }

  // Particles
  for(const p of particles){
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vx*=Math.pow(.08,dt);
    p.vy=p.vy*Math.pow(.12,dt)+70*dt;
    p.life-=dt;
  }
  particles=particles.filter(p=>p.life>0);

  // Floating text
  for(const ft of floatingTexts){
    ft.y+=ft.vy;
    ft.life-=dt*1.2;
  }
  floatingTexts=floatingTexts.filter(ft=>ft.life>0);
}

// ----------------- RENDERING -----------------
function backdrop(){
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#080516');sky.addColorStop(.58,'#110721');sky.addColorStop(1,'#030208');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  const aura=ctx.createRadialGradient(400,240,20,400,240,470);aura.addColorStop(0,'rgba(111,63,178,.23)');aura.addColorStop(.45,'rgba(17,218,229,.06)');aura.addColorStop(1,'transparent');ctx.fillStyle=aura;ctx.fillRect(0,0,W,H);
  for(const s of stars){s.y+=s.z*.18;if(s.y>H){s.y=0;s.x=Math.random()*W;}ctx.fillStyle=`hsla(${s.h},90%,76%,${.12+s.z*.35})`;ctx.fillRect(s.x,s.y,s.z*1.5,s.z*1.5);}
  ctx.save();ctx.globalAlpha=.13;ctx.strokeStyle='#e9c66d';ctx.lineWidth=1;
  for(let r=90;r<530;r+=42){ctx.beginPath();ctx.ellipse(400,285,r,r*.34,Math.sin(time*.08)*.05,0,TAU);ctx.stroke();}
  for(let i=0;i<24;i++){const a=i/24*TAU+time*.015;ctx.beginPath();ctx.moveTo(400+Math.cos(a)*50,285+Math.sin(a)*18);ctx.lineTo(400+Math.cos(a)*360,285+Math.sin(a)*122);ctx.stroke();}
  ctx.restore();ctx.fillStyle='rgba(4,2,8,.76)';ctx.fillRect(0,598,W,122);ctx.strokeStyle='rgba(240,204,117,.28)';ctx.beginPath();ctx.moveTo(0,598);ctx.lineTo(W,598);ctx.stroke();
  for(let x=24;x<W;x+=48){ctx.fillStyle=`rgba(240,204,117,${.025+((x/48)%2)*.02})`;ctx.beginPath();ctx.moveTo(x,598);ctx.lineTo(x+22,720);ctx.lineTo(x-22,720);ctx.closePath();ctx.fill();}
}

function drawWard(w){
  if(w.hp<=0)return;
  const ratio=w.hp/w.max,pulse=Math.sin(time*2+w.phase)*.5+.5;
  ctx.save();ctx.translate(w.x,w.y);ctx.globalCompositeOperation='lighter';
  ctx.shadowColor=w.parryFlash?'#64eaff':(w.hit?'#ff426f':'#e7c66e');
  ctx.shadowBlur=14+12*pulse;
  
  const g=ctx.createLinearGradient(-70,-30,70,34);
  g.addColorStop(0,`rgba(255,245,218,${.06+.13*ratio})`);
  g.addColorStop(.5,`rgba(240,204,117,${.22*ratio})`);
  g.addColorStop(1,`rgba(100,234,255,${.08*ratio})`);
  ctx.fillStyle=g;
  ctx.strokeStyle=w.parryFlash?'#64eaff':(w.hit?'#ff577b':`rgba(255,239,184,${.35+.45*ratio})`);
  ctx.lineWidth=w.parryFlash?2.5:1.5;
  
  ctx.beginPath();ctx.moveTo(-72,20);ctx.quadraticCurveTo(-54,-28,0,-34);ctx.quadraticCurveTo(54,-28,72,20);ctx.quadraticCurveTo(28,4,0,23);ctx.quadraticCurveTo(-28,4,-72,20);
  ctx.fill();ctx.stroke();
  for(let i=0;i<w.hp;i++){ctx.fillStyle=i%2?'#64eaff':'#f0cc75';ctx.fillRect(-32+i*12,31,7,2);}
  ctx.restore();
}

function fallbackForm(e){
  ctx.save();ctx.translate(e.x,e.y);ctx.rotate(Math.sin(e.age*2)*.08);
  ctx.strokeStyle=['#ff4baf','#45f4c6','#ff5d69','#f0cc75'][e.type];
  ctx.fillStyle='rgba(8,4,18,.9)';ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=0;i<10;i++){const a=i/10*TAU,r=i%2?18:32;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
  ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
}

function drawEnemy(e){
  const size=e.boss?116:[72,79,83][e.type];
  ctx.save();ctx.translate(e.x,e.y);
  ctx.rotate(Math.sin(e.age*1.7+e.phase)*.035);
  ctx.translate(-e.x,-e.y);
  if(e.hit){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.72;}
  if(!atlasSprite(e.type+2,e.x,e.y,size,size))fallbackForm(e);
  ctx.restore();
  
  if(e.hp<e.maxHp){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(e.x-26,e.y+size*.43,52,3);
    ctx.fillStyle=e.boss?'#f0cc75':'#ff426f';
    ctx.fillRect(e.x-26,e.y+size*.43,52*e.hp/e.maxHp,3);
  }
}

function drawSentinel(){
  // Draw Dash Echoes
  sentinel.echoes.forEach(ec=>{
    ctx.save();ctx.globalAlpha=ec.alpha*0.5;
    ctx.translate(ec.x,ec.y);
    ctx.strokeStyle='#f0cc75';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,-38);ctx.lineTo(26,24);ctx.lineTo(0,36);ctx.lineTo(-26,24);ctx.closePath();ctx.stroke();
    ctx.restore();
  });

  const firing=sentinel.charge>0,alpha=sentinel.invuln>0&&Math.floor(time*15)%2?.32:1;
  if(!atlasSprite(firing?1:0,sentinel.x,sentinel.y,112,112,alpha)){
    ctx.save();ctx.translate(sentinel.x,sentinel.y);
    ctx.strokeStyle=sentinel.parryWindow>0?'#64eaff':'#f0cc75';
    ctx.fillStyle='#090713';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(0,-38);ctx.lineTo(26,24);ctx.lineTo(0,36);ctx.lineTo(-26,24);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.restore();
  }
}

function drawHUD(){
  ctx.save();ctx.font='600 12px ui-monospace,monospace';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(4,2,9,.86)';ctx.fillRect(18,16,764,48);
  ctx.strokeStyle='rgba(240,204,117,.28)';ctx.strokeRect(18.5,16.5,763,47);
  
  ctx.fillStyle='#f0cc75';ctx.textAlign='left';
  ctx.fillText(`ANNOTATIONS  ${String(annotations).padStart(6,'0')}`,32,32);
  
  // AI Director Telemetry Chip
  const dirColor=marginDirector.tension>70?'#ff426f':(marginDirector.tension>40?'#f0cc75':'#64eaff');
  ctx.font='10px ui-monospace,monospace';ctx.fillStyle=dirColor;
  ctx.fillText(`DIRECTOR [${marginDirector.state}] ${Math.round(marginDirector.tension)}% · ${marginDirector.decisionLatencyUs.toFixed(3)}µs`,32,50);

  ctx.textAlign='center';ctx.font='600 12px ui-monospace,monospace';ctx.fillStyle='#64eaff';
  ctx.fillText(`THREAD  ${chain}  ·  BEST  ${bestChain}`,400,32);

  // Excision Beam Meter
  ctx.textAlign='center';ctx.font='10px ui-monospace,monospace';
  ctx.fillStyle=beamEnergy>=50?'#f0cc75':'#888';
  ctx.fillText(`EXCISION BEAM [Q]: ${Math.round(beamEnergy)}%`,400,50);

  ctx.textAlign='right';ctx.font='600 12px ui-monospace,monospace';ctx.fillStyle='#fff5da';
  ctx.fillText(`BALCONY  ${'◆'.repeat(integrity)}${'◇'.repeat(3-integrity)}`,766,32);
  
  ctx.font='10px ui-monospace,monospace';
  ctx.fillStyle=sentinel.dashCool<=0?'#64eaff':'#777';
  ctx.fillText(sentinel.dashCool<=0?'PARRY READY [SHIFT]':`PARRY CD: ${sentinel.dashCool.toFixed(1)}s`,766,50);

  ctx.restore();
}

function centerPanel(kicker,title,copy,action){
  ctx.fillStyle='rgba(2,1,7,.82)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(13,8,24,.92)';ctx.fillRect(104,180,592,342);
  ctx.strokeStyle='rgba(240,204,117,.48)';ctx.strokeRect(104.5,180.5,591,341);
  ctx.textAlign='center';
  ctx.fillStyle='#64eaff';ctx.font='600 13px ui-monospace,monospace';ctx.fillText(kicker,400,230);
  ctx.fillStyle='#f0cc75';ctx.font='700 38px Georgia,serif';ctx.shadowColor='#f0cc75';ctx.shadowBlur=20;
  ctx.fillText(title,400,295);ctx.shadowBlur=0;
  ctx.fillStyle='#e9ddc2';ctx.font='16px Georgia,serif';
  for(const [i,line] of copy.entries())ctx.fillText(line,400,348+i*26);
  ctx.fillStyle=`rgba(255,245,218,${.55+Math.sin(time*4)*.4})`;ctx.font='700 14px ui-monospace,monospace';
  ctx.fillText(action,400,470);
}

function draw(){
  ctx.save();
  if(shake)ctx.translate(rand(-shake,shake),rand(-shake,shake));
  backdrop();
  for(const w of wards)drawWard(w);
  for(const e of redactions)if(e.alive)drawEnemy(e);
  
  // Standard Player Bolts
  ctx.globalCompositeOperation='lighter';
  for(const b of bolts){
    ctx.strokeStyle='#fff4aa';ctx.shadowColor='#64eaff';ctx.shadowBlur=12;ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(b.x,b.y+18);ctx.lineTo(b.x,b.y-18);ctx.stroke();
  }

  // Reflected Parried Bolts
  for(const b of reflectedBolts){
    ctx.strokeStyle='#64eaff';ctx.shadowColor='#f0cc75';ctx.shadowBlur=16;ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(b.x,b.y+22);ctx.lineTo(b.x,b.y-22);ctx.stroke();
  }

  // Active Excision Beam
  if(activeBeam){
    ctx.save();
    ctx.shadowColor='#f0cc75';ctx.shadowBlur=24;
    const bg=ctx.createLinearGradient(activeBeam.x-14,0,activeBeam.x+14,0);
    bg.addColorStop(0,'rgba(240,204,117,0)');
    bg.addColorStop(0.5,'rgba(255,255,255,0.95)');
    bg.addColorStop(1,'rgba(240,204,117,0)');
    ctx.fillStyle=bg;
    ctx.fillRect(activeBeam.x-14,0,28,H);
    ctx.restore();
  }

  // Ink drops
  for(const d of inkDrops){
    ctx.fillStyle=['#ff4baf','#45f4c6','#ff5d69','#f0cc75'][d.type];
    ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;
    ctx.beginPath();ctx.moveTo(d.x,d.y+11);ctx.quadraticCurveTo(d.x-10,d.y,d.x,d.y-13);ctx.quadraticCurveTo(d.x+10,d.y,d.x,d.y+11);ctx.fill();
  }
  
  ctx.globalCompositeOperation='source-over';
  drawSentinel();

  // Particles
  for(const p of particles){
    ctx.globalAlpha=clamp(p.life/.65,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size);
  }
  ctx.globalAlpha=1;

  // Floating text
  for(const ft of floatingTexts){
    ctx.save();ctx.globalAlpha=ft.life;
    ctx.font=`bold ${ft.size}px ui-monospace,monospace`;
    ctx.fillStyle=ft.color;ctx.textAlign='center';
    ctx.shadowColor=ft.color;ctx.shadowBlur=8;
    ctx.fillText(ft.text,ft.x,ft.y);
    ctx.restore();
  }

  drawHUD();
  ctx.restore();

  if(flash){ctx.fillStyle=`rgba(255,45,88,${flash})`;ctx.fillRect(0,0,W,H);}
  
  if(state==='menu'){
    centerPanel(
      'THE TRIBUNAL BALCONY REMAINS UNANNOTATED',
      'COMMENTARY SIEGE : APEX',
      [
        'Hold the living margin against descending redactions.',
        'SHIFT / C: Roll and reflect hostile ink seals to restore wards.',
        'Q: Marginal Excision Beam clears vertical columns.'
      ],
      'PRESS SPACE · OPEN THE MARGIN'
    );
  }else if(state==='lost'){
    centerPanel(
      'THE BALCONY HAS FALLEN',
      'TEXT-REALITY ERASED',
      [
        `Annotations preserved: ${annotations}`,
        `Longest surviving thread: ${bestChain}`,
        `Director Peak: ${Math.round(marginDirector.tension)}%`
      ],
      'PRESS SPACE · REENTER THE COMMENTARY'
    );
  }else if(state==='interlude'){
    centerPanel(
      `FOLIO ${ROMAN[(folio-1)%ROMAN.length]||folio}`,
      'FOLIO SEALED',
      [
        'The argument survives this descent.',
        'Sanctuary restores degraded vellum wards.',
        'The next redaction script is already moving.'
      ],
      'PREPARE THE NEXT MARGIN'
    );
  }
}

function frame(now){
  const dt=Math.min(.033,(now-last)/1000);
  last=now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

document.addEventListener('keydown',e=>{
  if([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Shift','KeyQ','KeyC','KeyX'].includes(e.code))e.preventDefault();
  keys.add(e.key);
  if(e.key===' '&&(state==='menu'||state==='lost'))cast();
  if(state==='playing'){
    if(e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='KeyC'||e.code==='KeyX')triggerDashParry();
    if(e.code==='KeyQ')triggerExcisionBeam();
  }
});
document.addEventListener('keyup',e=>keys.delete(e.key));

canvas.addEventListener('pointerdown',e=>{
  const r=canvas.getBoundingClientRect();
  pointerX=(e.clientX-r.left)*W/r.width;
  pointerFire=true;
  if(state==='menu'||state==='lost')cast();
  canvas.setPointerCapture?.(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(e.buttons){const r=canvas.getBoundingClientRect();pointerX=(e.clientX-r.left)*W/r.width;}
});
canvas.addEventListener('pointerup',()=>{pointerFire=false;pointerX=null;});
document.querySelector('#start').addEventListener('click',()=>cast());

makeStars();
sentinel={x:400,y:650,vx:0,cool:0,charge:0,invuln:0,dashTimer:0,dashCool:0,dashDir:0,parryWindow:0,isDashing:false,echoes:[]};
bolts=[];reflectedBolts=[];redactions=[];inkDrops=[];wards=[];particles=[];floatingTexts=[];

window.__COMMENTARY_DEBUG__={
  version:'wave09-apex-v02',
  atlas:()=>({ready:atlasReady,error:atlasError,width:atlas.naturalWidth,height:atlas.naturalHeight}),
  snapshot:()=>({
    state,folio,annotations,chain,bestChain,integrity,
    sentinel:{x:sentinel.x,state:sentinel.charge>0?'firing':'neutral'},
    forms:[...new Set(redactions.filter(e=>e.alive).map(e=>e.name))],
    scripts:[...new Set(redactions.filter(e=>e.alive).map(e=>e.script))],
    wardHp:wards.map(w=>w.hp),bolts:bolts.length,
    redactions:redactions.filter(e=>e.alive).length,
    marginDirector:{state:marginDirector.state,tension:Math.round(marginDirector.tension),decisionLatencyUs:marginDirector.decisionLatencyUs}
  }),
  start:()=>reset(true),
  cast,
  triggerParry:()=>triggerDashParry(),
  triggerBeam:()=>triggerExcisionBeam(),
  damageWard:(i=0)=>wards[i]&&damageWard(wards[i]),
  spawnBoss:()=>{folio=3;spawnFolio();state='playing';},
  clear:()=>{for(const e of redactions)e.alive=false;}
};

requestAnimationFrame(frame);
</script>
