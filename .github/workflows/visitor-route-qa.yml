name: Storefront conversion audit
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        width: [390, 1280]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      WIDTH: ${{ matrix.width }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5adae786b25258dd8916cea327a6ee2576d0d7b6
          path: merch
          sparse-checkout: merch
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 791fac000dce6cc6c06ea2dec6f913b562a24c14
          path: holidays
          sparse-checkout: holidays
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9d04b7cf82d4507951b2c3536977bc478cf02b08
          path: rich-yn
          sparse-checkout: rich-yn
          persist-credentials: false
      - run: python -m pip -q install playwright requests beautifulsoup4
      - shell: python
        run: |
          import json,os,re
          from pathlib import Path
          from urllib.parse import urlsplit,parse_qs
          from playwright.sync_api import sync_playwright
          width=int(os.environ['WIDTH'])
          origin='https://northstarprime.net'
          routes=['merch','rich-yn','holidays']
          with sync_playwright() as pw:
              browser=pw.chromium.launch(executable_path='/usr/bin/google-chrome',args=['--disable-gpu'])
              ctx=browser.new_context(viewport={'width':width,'height':840},reduced_motion='reduce')
              page=ctx.new_page()
              page.set_default_timeout(16000)
              for route in routes:
                  file=Path(route,route,'index.html')
                  if file.is_file():
                      def serve(r):
                          name=urlsplit(r.request.url).path.strip('/')
                          r.fulfill(content_type='text/html; charset=utf-8',body=Path(name,name,'index.html').read_bytes())
                      ctx.route(origin+'/'+route+'/',serve)
              def visit(rt):
                  assert page.goto(origin+'/'+rt+'/',wait_until='domcontentloaded').ok
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
              for label,keyword in [('Ask about a custom print','sizes'),('Request a drop alert','next RICH YN')]:
                  visit('rich-yn')
                  a=page.get_by_role('link',name=label,exact=True)
                  expected=parse_qs(urlsplit(a.get_attribute('href')).query)
                  a.click()
                  mail=urlsplit(page.locator('#draft-link').get_attribute('href'))
                  assert mail.scheme=='mailto' and mail.path=='contact@northstarprime.net'
                  q=parse_qs(mail.query)
                  assert q==expected and keyword in q['body'][0],q
              print('PASS distinct print and drop alert drafts',width,flush=True)
              visit('holidays')
              assert page.locator('#idr-dock,#idr-toggle').count()==0
              page.get_by_role('link',name='Listen to Interdimensional Radio',exact=True).click()
              assert page.url.endswith('/idr/#idr-station-player')
              assert page.locator('#idr-station-audio').is_visible()
              tracks=page.locator('.track-row button')
              print('Station track buttons',tracks.count(),flush=True)
              assert tracks.count()>0
              tracks.first.click()
              page.wait_for_function("document.querySelector('#idr-station-audio').currentTime>0",timeout=35000)
              print('PASS station plays after holiday click',width,flush=True)
              visit('merch')
              card=page.locator('#bm-tarot-78')
              url='https://andrewcog.gumroad.com/l/pshjy'
              for idx in (0,1):
                  btn=card.locator('a').nth(idx)
                  assert btn.get_attribute('href')==[url,'/tarot/'][idx]
              ld=' '.join(page.locator('script[type="application/ld+json"]').all_text_contents())
              def walk(node):
                  if isinstance(node,dict):
                      if node.get('sku')=='NSP-TAROT-78':yield node
                      for value in node.values():yield from walk(value)
                  if isinstance(node,list):
                      for value in node:yield from walk(value)
              assert [p['offers']['url'] for p in walk(json.loads(ld))]==[url]
              card.locator('.zoom-trigger').click()
              assert page.locator('#lb-cta1').get_attribute('href')==url
              assert page.locator('#lb-cta2').get_attribute('href')=='/tarot/'
              if width==390:
                  page.locator('#lb-cta1').click()
                  dest=page
              else:
                  page.locator('#lb-close').click()
                  with page.expect_popup() as new:card.locator('a').first.click()
                  dest=new.value
              dest.wait_for_url(url+'*')
              pr=json.loads(dest.locator('[data-page]').get_attribute('data-page'))['props']['product']
              assert pr['is_published'] and pr['price_cents']==1200 and '78-card' in pr['name']
              print('PASS Tarot buy link, provider listing, price and offer',width,flush=True)
              dest.wait_for_timeout(2200)
              print('Gumroad visitor controls',dest.locator('button:visible,a[href]:visible,[role=button]:visible').all_inner_texts()[-30:],flush=True)
              print('Gumroad listing status text',dest.locator('body').inner_text()[-1200:],flush=True)
              visit('merch')
              card.locator('a').nth(1).click()
              assert page.url.rstrip('/').endswith('/tarot')
              print('PASS free reader',width,flush=True)
              browser.close()
