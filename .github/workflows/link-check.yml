name: Link check

on:
  pull_request:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal:
    name: Internal links (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress --root-dir ${{ github.workspace }}
            --exclude-path node_modules --exclude-path .git
            './**/*.html'
          fail: true
          jobSummary: true

  external:
    name: External links (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 8 --timeout 20 --max-retries 2
            --accept 200..=299,403,429 --scheme https --scheme http
            --exclude-path node_modules --exclude-path .git
            './**/*.html' './**/*.md'
          fail: false
          jobSummary: true
