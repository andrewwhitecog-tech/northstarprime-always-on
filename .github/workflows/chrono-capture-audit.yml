name: Audit retained failed Chrono recording
on:
  pull_request:
    paths:
      - .github/scripts/chrono-audit-existing-recording.cjs
      - .github/workflows/chrono-capture-audit.yml
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chrono-gameplay-showcase-42584376589
          run-id: '42584376589'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/chrono-failed-original
      - name: Install free existing distribution media tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Inspect actual existing packets, frames and sound without recording
        env:
          CHRONO_AUDIT_INPUT: ${{ runner.temp }}/chrono-failed-original
          CHRONO_AUDIT_OUT: ${{ runner.temp }}/chrono-failed-audit
        run: node .github/scripts/chrono-audit-existing-recording.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chrono-failed-source-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/chrono-failed-audit/
          retention-days: 14
