<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Cascadia Heritage Gradients -->
    <radialGradient id="cascadiaCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="55%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#01140e"/>
    </radialGradient>

    <linearGradient id="cascadiaTricolor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#0369a1"/>
      <stop offset="35.1%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f8fafc"/>
      <stop offset="65.1%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <linearGradient id="goldHoloSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="sealRadiance" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#010805"/>

  <!-- DIE-CUT SEAL CONTAINER -->
  <g transform="translate(400, 400)" filter="url(#sealRadiance)">
    <!-- White Die-Cut Bleed Border -->
    <circle cx="0" cy="0" r="375" fill="#ffffff"/>
    <circle cx="0" cy="0" r="365" fill="none" stroke="url(#goldHoloSeal)" stroke-width="6"/>
    <circle cx="0" cy="0" r="352" fill="url(#cascadiaCore)" stroke="#10b981" stroke-width="2.5"/>

    <!-- Outer Guilloché Scalloped Coin Ring (72 Teeth) -->
    <circle cx="0" cy="0" r="338" fill="none" stroke="url(#goldHoloSeal)" stroke-width="2" stroke-dasharray="6,8"/>
    <circle cx="0" cy="0" r="328" fill="none" stroke="#047857" stroke-width="1.5"/>

    <!-- Inner Textured Ring with Hexagonal Terpene Molecules -->
    <circle cx="0" cy="0" r="230" fill="none" stroke="url(#goldHoloSeal)" stroke-width="2"/>
    <circle cx="0" cy="0" r="222" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Cascadia Tri-Color Arch Ring Segments -->
    <g opacity="0.35">
      <circle cx="0" cy="0" r="215" fill="none" stroke="#0284c7" stroke-width="8" stroke-dasharray="120,400"/>
      <circle cx="0" cy="0" r="215" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="120,400" transform="rotate(120)"/>
      <circle cx="0" cy="0" r="215" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="120,400" transform="rotate(240)"/>
    </g>

    <!-- HERITAGE BOTANICAL LAUREL WREATH -->
    <!-- Left Laurel (Douglas Fir & Cannabis Fan Leaves) -->
    <g fill="#10b981" stroke="#064e3b" stroke-width="1" transform="scale(-1, 1)">
      <path d="M 170 120 C 180 80 190 30 185 -20 C 180 -70 160 -120 120 -160" fill="none" stroke="url(#goldHoloSeal)" stroke-width="3"/>
      <!-- Leaves along arc -->
      <path d="M 120 -160 Q 145 -180 135 -200 Q 115 -180 120 -160 Z"/>
      <path d="M 140 -120 Q 170 -135 170 -155 Q 145 -140 140 -120 Z"/>
      <path d="M 160 -70 Q 195 -80 200 -105 Q 170 -95 160 -70 Z"/>
      <path d="M 175 -20 Q 210 -25 218 -50 Q 185 -45 175 -20 Z"/>
      <path d="M 180 35 Q 215 35 220 10 Q 190 15 180 35 Z"/>
      <path d="M 175 90 Q 205 95 210 70 Q 180 75 175 90 Z"/>
      <path d="M 160 140 Q 185 150 190 125 Q 165 130 160 140 Z"/>
    </g>

    <!-- Right Laurel -->
    <g fill="#10b981" stroke="#064e3b" stroke-width="1">
      <path d="M 170 120 C 180 80 190 30 185 -20 C 180 -70 160 -120 120 -160" fill="none" stroke="url(#goldHoloSeal)" stroke-width="3"/>
      <path d="M 120 -160 Q 145 -180 135 -200 Q 115 -180 120 -160 Z"/>
      <path d="M 140 -120 Q 170 -135 170 -155 Q 145 -140 140 -120 Z"/>
      <path d="M 160 -70 Q 195 -80 200 -105 Q 170 -95 160 -70 Z"/>
      <path d="M 175 -20 Q 210 -25 218 -50 Q 185 -45 175 -20 Z"/>
      <path d="M 180 35 Q 215 35 220 10 Q 190 15 180 35 Z"/>
      <path d="M 175 90 Q 205 95 210 70 Q 180 75 175 90 Z"/>
      <path d="M 160 140 Q 185 150 190 125 Q 165 130 160 140 Z"/>
    </g>

    <!-- CENTERPIECE: THE SACRED CASCADIA DOUGLAS FIR WITH MOLECULAR ROOT NETWORK -->
    <g transform="translate(0, -10)">
      <!-- Radiating Starlight Aura behind Tree -->
      <circle cx="0" cy="-30" r="100" fill="#ffffff" opacity="0.08"/>

      <!-- Sacred Fir Tree Foliage (Cascading Stepped Boughs) -->
      <!-- Tier 1 (Apex) -->
      <polygon points="0,-160 -25,-120 25,-120" fill="#ffffff" stroke="url(#goldHoloSeal)" stroke-width="1.5"/>
      <polygon points="0,-160 -20,-122 0,-135 20,-122" fill="#e0f2fe"/>

      <!-- Tier 2 -->
      <polygon points="0,-130 -45,-85 45,-85" fill="#38bdf8" stroke="url(#goldHoloSeal)" stroke-width="1.5"/>
      <polygon points="0,-130 -38,-87 0,-102 38,-87" fill="#0284c7"/>

      <!-- Tier 3 -->
      <polygon points="0,-95 -70,-45 70,-45" fill="#34d399" stroke="url(#goldHoloSeal)" stroke-width="1.5"/>
      <polygon points="0,-95 -60,-47 0,-65 60,-47" fill="#10b981"/>

      <!-- Tier 4 (Base Boughs) -->
      <polygon points="0,-55 -95,5 95,5" fill="#059669" stroke="url(#goldHoloSeal)" stroke-width="1.5"/>
      <polygon points="0,-55 -82,3 0,-20 82,3" fill="#047857"/>

      <!-- Tier 5 (Lowest Giant Boughs) -->
      <polygon points="0,-10 -115,65 115,65" fill="#047857" stroke="url(#goldHoloSeal)" stroke-width="2"/>
      <polygon points="0,-10 -100,63 0,35 100,63" fill="#064e3b"/>

      <!-- Sturdy Cedar Trunk -->
      <rect x="-14" y="65" width="28" height="55" fill="#78350f" stroke="url(#goldHoloSeal)" stroke-width="1.5"/>

      <!-- INTERTWINED MOLECULAR HEXAGONAL ROOTS (Cannabinoid & Terpene Chemistry) -->
      <g stroke="url(#goldHoloSeal)" stroke-width="2" fill="none" transform="translate(0, 120)">
        <!-- Central Benzene / Resorcinol Hexagon -->
        <polygon points="0,0 22,12 22,38 0,50 -22,38 -22,12" fill="#022c22"/>
        <circle cx="0" cy="25" r="8" fill="none" stroke="#10b981" stroke-width="1.5"/>

        <!-- Left Terpene Ring Link -->
        <polygon points="-44,25 -22,38 -22,64 -44,76 -66,64 -66,38" fill="#022c22"/>
        <!-- Right Terpene Ring Link -->
        <polygon points="44,25 66,38 66,64 44,76 22,64 22,38" fill="#022c22"/>

        <!-- Molecular Branch Nodes (Dots) -->
        <circle cx="0" cy="0" r="3.5" fill="#fef08a"/>
        <circle cx="22" cy="12" r="3.5" fill="#fef08a"/>
        <circle cx="-22" cy="12" r="3.5" fill="#fef08a"/>
        <circle cx="0" cy="50" r="3.5" fill="#fef08a"/>
        <circle cx="-44" cy="76" r="3" fill="#38bdf8"/>
        <circle cx="44" cy="76" r="3" fill="#38bdf8"/>
      </g>
    </g>

    <!-- ESTABLISHED BANNER (2026) -->
    <g transform="translate(0, -185)" text-anchor="middle">
      <rect x="-70" y="-12" width="140" height="24" rx="4" fill="#022c22" stroke="url(#goldHoloSeal)" stroke-width="1.5"/>
      <text font-family="'Cinzel', serif" font-weight="900" font-size="11" fill="url(#goldHoloSeal)" letter-spacing="3" y="4">EST. 2026</text>
    </g>

    <!-- CIRCULAR BORDER TYPOGRAPHY (OUTER & INNER BANNERS) -->
    <path id="cascadiaTextTop" d="M -280 0 A 280 280 0 1 1 280 0" fill="none"/>
    <path id="cascadiaTextBottom" d="M 280 0 A 280 280 0 1 1 -280 0" fill="none"/>

    <text font-family="'Cinzel', serif" font-weight="900" font-size="16.5" fill="url(#goldHoloSeal)" letter-spacing="4">
      <textPath href="#cascadiaTextTop" startOffset="50%" text-anchor="middle">
        SOVEREIGN ECOLOGY • PURE TERPENES
      </textPath>
    </text>

    <text font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12.5" fill="#67e8f9" letter-spacing="3">
      <textPath href="#cascadiaTextBottom" startOffset="50%" text-anchor="middle">
        CASCADIA 2026 • 10015 SW HALL BLVD
      </textPath>
    </text>

    <!-- Lateral Hexagonal Studs -->
    <polygon points="-280,-6 -274,-3 -274,3 -280,6 -286,3 -286,-3" fill="#fbbf24"/>
    <polygon points="280,-6 286,-3 286,3 280,6 274,3 274,-3" fill="#fbbf24"/>
  </g>
</svg>
