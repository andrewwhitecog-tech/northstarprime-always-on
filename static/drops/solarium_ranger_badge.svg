<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter for Die-Cut Vinyl Sticker -->
    <filter id="sticker-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    
    <!-- Metallic Gold Foil Gradient -->
    <linearGradient id="gold-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC86E" />
      <stop offset="25%" stop-color="#C6922C" />
      <stop offset="50%" stop-color="#FFF2B2" />
      <stop offset="75%" stop-color="#D4A036" />
      <stop offset="100%" stop-color="#996816" />
    </linearGradient>

    <!-- Deep Forest Green Radial -->
    <radialGradient id="forest-bg" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#0D2619" />
      <stop offset="100%" stop-color="#05120B" />
    </radialGradient>

    <!-- Twilight Sky Gradient -->
    <linearGradient id="twilight-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142C3D" />
      <stop offset="50%" stop-color="#245063" />
      <stop offset="85%" stop-color="#D97746" />
      <stop offset="100%" stop-color="#F2A65A" />
    </linearGradient>

    <!-- Curved Text Paths -->
    <!-- Top Arc (Clockwise over the top) -->
    <path id="top-text-path" d="M 140,400 A 260,260 0 1,1 660,400" fill="none" />
    <!-- Bottom Arc (Left to right along bottom, letters upright pointing inward) -->
    <path id="bottom-text-path" d="M 160,400 A 240,240 0 0,0 640,400" fill="none" />
  </defs>

  <!-- Base Group with Sticker Shadow -->
  <g filter="url(#sticker-shadow)">
    <!-- 1. Die-Cut White Vinyl Outer Border -->
    <circle cx="400" cy="400" r="375" fill="#FFFFFF" />
    
    <!-- 2. Outer Embossed Gold Ring -->
    <circle cx="400" cy="400" r="355" fill="url(#gold-foil)" />
    <circle cx="400" cy="400" r="348" fill="#0D2619" />
    
    <!-- 3. Forest Green Typographic Bezel -->
    <circle cx="400" cy="400" r="342" fill="url(#forest-bg)" />
    
    <!-- Inner Gold Ring Framing Center Stage -->
    <circle cx="400" cy="400" r="236" fill="url(#gold-foil)" />
    
    <!-- 4. Center Vignette (Twilight Sky) -->
    <circle cx="400" cy="400" r="230" fill="url(#twilight-sky)" />

    <!-- Center Stage Clip Mask -->
    <g clip-path="url(#center-clip)">
      <clipPath id="center-clip">
        <circle cx="400" cy="400" r="230" />
      </clipPath>

      <!-- Cascades Mountain Silhouette (Mount Hood) -->
      <!-- Left shaded face -->
      <polygon points="400,230 250,470 400,470" fill="#1C3847" />
      <!-- Right lit face -->
      <polygon points="400,230 400,470 540,470" fill="#2E5569" />
      <!-- Left Snow Cap -->
      <polygon points="400,230 360,290 380,310 400,300" fill="#EBF4F6" />
      <!-- Right Snow Cap -->
      <polygon points="400,230 400,300 425,320 445,290" fill="#FFFFFF" />

      <!-- Secondary Ridge (Mount Jefferson) -->
      <polygon points="260,320 160,470 320,470" fill="#152B36" />
      <polygon points="260,320 235,360 255,370 285,360" fill="#EBF4F6" />

      <!-- Golden Sun / 432 Hz Solarium Dawn Disc -->
      <circle cx="400" cy="370" r="55" fill="#FFE27A" opacity="0.9" />
      <circle cx="400" cy="370" r="45" fill="#FFC83B" />

      <!-- Cascadia Evergreen Pines (Left Flank) -->
      <path d="M 230,350 L 255,395 L 245,395 L 265,435 L 250,435 L 275,475 L 185,475 L 210,435 L 195,435 L 215,395 L 205,395 Z" fill="#0A1D13" />
      <path d="M 275,370 L 295,410 L 285,410 L 305,445 L 295,445 L 315,475 L 235,475 L 255,445 L 245,445 L 265,410 L 255,410 Z" fill="#0E2B1D" />

      <!-- Cascadia Evergreen Pines (Right Flank) -->
      <path d="M 570,350 L 595,395 L 585,395 L 605,435 L 590,435 L 615,475 L 525,475 L 550,435 L 535,435 L 555,395 L 545,395 Z" fill="#0A1D13" />
      <path d="M 525,370 L 545,410 L 535,410 L 555,445 L 545,445 L 565,475 L 485,475 L 505,445 L 495,445 L 515,410 L 505,410 Z" fill="#0E2B1D" />

      <!-- Bottom Grass / Meadow Sill -->
      <path d="M 170,460 Q 400,430 630,460 L 630,630 L 170,630 Z" fill="#091A11" />

      <!-- Sovereign Beaver Silhouette with Aviator Goggles -->
      <!-- Body & Shoulders -->
      <path d="M 320,580 Q 320,470 400,460 Q 480,470 480,580 Z" fill="#8A5A36" />
      <path d="M 335,580 Q 340,490 400,480 Q 460,490 465,580 Z" fill="#A67347" />
      <!-- Scout Necktie / Neckerchief -->
      <polygon points="400,530 380,495 420,495" fill="#D4A036" stroke="#0D2619" stroke-width="3" />
      <circle cx="400" cy="510" r="7" fill="#0D2619" />
      <!-- Head -->
      <ellipse cx="400" cy="450" rx="60" ry="50" fill="#8A5A36" />
      <!-- Cheeks & Muzzle -->
      <ellipse cx="400" cy="465" rx="42" ry="28" fill="#C99B72" />
      <!-- Nose & Smile -->
      <polygon points="400,455 388,446 412,446" fill="#1A120B" />
      <path d="M 390,466 Q 400,474 410,466" stroke="#1A120B" stroke-width="4" fill="none" stroke-linecap="round" />
      <!-- Signature Beaver Incisor Teeth -->
      <rect x="394" y="468" width="6" height="9" fill="#FFFFFF" rx="1" />
      <rect x="402" y="468" width="6" height="9" fill="#FFFFFF" rx="1" />
      <!-- Ears -->
      <circle cx="350" cy="415" r="16" fill="#6B4223" />
      <circle cx="350" cy="415" r="9" fill="#C99B72" />
      <circle cx="450" cy="415" r="16" fill="#6B4223" />
      <circle cx="450" cy="415" r="9" fill="#C99B72" />
      <!-- Pilot / Scout Aviator Cap & Goggles -->
      <path d="M 345,425 Q 400,395 455,425 Q 465,438 450,442 Q 400,430 350,442 Z" fill="#0D2619" />
      <!-- Brass Goggle Frames -->
      <ellipse cx="375" cy="432" rx="20" ry="15" fill="#2E1C0C" stroke="#D4A036" stroke-width="5" />
      <ellipse cx="375" cy="432" rx="15" ry="11" fill="#7CD6ED" opacity="0.85" />
      <ellipse cx="425" cy="432" rx="20" ry="15" fill="#2E1C0C" stroke="#D4A036" stroke-width="5" />
      <ellipse cx="425" cy="432" rx="15" ry="11" fill="#7CD6ED" opacity="0.85" />
      <!-- Goggle Bridge -->
      <rect x="393" y="430" width="14" height="4" fill="#D4A036" rx="2" />
      <!-- Lens Reflections -->
      <path d="M 368,426 L 378,436" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <path d="M 418,426 L 428,436" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- 5. Flawless Vector Typography -->
    <!-- Top Arc: SOLARIUM CANOPY PATROL -->
    <text font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="url(#gold-foil)" letter-spacing="5">
      <textPath href="#top-text-path" startOffset="50%" text-anchor="middle">
        SOLARIUM CANOPY PATROL
      </textPath>
    </text>

    <!-- Bottom Arc: PACIFIC NORTHWEST • EST. 2024 -->
    <text font-family="'Arial', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" letter-spacing="4">
      <textPath href="#bottom-text-path" startOffset="50%" text-anchor="middle">
        PACIFIC NORTHWEST • EST. 2024
      </textPath>
    </text>

    <!-- Flanking Gold Stars on Horizontal Axis -->
    <!-- Left 5-point Star -->
    <g transform="translate(130, 400) scale(1.2)">
      <polygon points="0,-12 3.5,-3.7 11.4,-3.7 5,1.4 7.4,9.7 0,4.6 -7.4,9.7 -5,1.4 -11.4,-3.7 -3.5,-3.7" fill="url(#gold-foil)" />
    </g>
    <!-- Right 5-point Star -->
    <g transform="translate(670, 400) scale(1.2)">
      <polygon points="0,-12 3.5,-3.7 11.4,-3.7 5,1.4 7.4,9.7 0,4.6 -7.4,9.7 -5,1.4 -11.4,-3.7 -3.5,-3.7" fill="url(#gold-foil)" />
    </g>

  </g>
</svg>
