<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Holographic Rainbow Foil Gradient -->
    <linearGradient id="holoRainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0080"/>
      <stop offset="20%" stop-color="#7928ca"/>
      <stop offset="40%" stop-color="#0070f3"/>
      <stop offset="60%" stop-color="#00dfd8"/>
      <stop offset="80%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>

    <linearGradient id="furChestnut" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d4925"/>
      <stop offset="100%" stop-color="#54250e"/>
    </linearGradient>

    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Die-cut Outline Filter -->
    <filter id="stickerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00dfd8" flood-opacity="0.3"/>
    </filter>

    <!-- Plaid Pattern -->
    <pattern id="buffaloPlaid" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#b91c1c"/>
      <rect x="0" y="0" width="12" height="12" fill="#18181b"/>
      <rect x="12" y="12" width="12" height="12" fill="#18181b"/>
      <rect x="12" y="0" width="12" height="12" fill="#7f1d1d" opacity="0.6"/>
      <rect x="0" y="12" width="12" height="12" fill="#7f1d1d" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="800" height="800" fill="#070a12"/>

  <!-- DIE CUT STICKER CONTAINER (White + Holographic Edge Border) -->
  <g transform="translate(400, 400)" filter="url(#stickerShadow)">
    
    <!-- Outer Die-Cut White Vinyl Margin (8mm Bleed) -->
    <circle cx="0" cy="0" r="375" fill="#ffffff"/>
    <!-- Holographic Rainbow Foil Ring -->
    <circle cx="0" cy="0" r="365" fill="none" stroke="url(#holoRainbow)" stroke-width="10"/>
    
    <!-- Main Crest Background Circle -->
    <circle cx="0" cy="0" r="350" fill="#0f172a" stroke="url(#goldTrim)" stroke-width="6"/>

    <!-- Concentric Decorative Rings -->
    <circle cx="0" cy="0" r="335" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"/>
    <circle cx="0" cy="0" r="260" fill="#1e293b" stroke="url(#holoRainbow)" stroke-width="3"/>

    <!-- Douglas Fir & Cannabis Laurel Wreath -->
    <g fill="#10b981" stroke="#047857" stroke-width="1.5">
      <!-- Left Leaves -->
      <path d="M -230 40 C -260 -20 -240 -110 -180 -160 C -190 -120 -190 -60 -210 20 Z" fill="#059669"/>
      <path d="M -220 -30 C -250 -60 -260 -120 -210 -150 C -215 -110 -205 -70 -200 -30 Z" fill="#10b981"/>
      <path d="M -180 -120 C -210 -160 -190 -210 -140 -230 C -150 -190 -150 -150 -160 -110 Z" fill="#34d399"/>
      <!-- Right Leaves -->
      <path d="M 230 40 C 260 -20 240 -110 180 -160 C 190 -120 190 -60 210 20 Z" fill="#059669"/>
      <path d="M 220 -30 C 250 -60 260 -120 210 -150 C 215 -110 205 -70 200 -30 Z" fill="#10b981"/>
      <path d="M 180 -120 C 210 -160 190 -210 140 -230 C 150 -190 150 -150 160 -110 Z" fill="#34d399"/>
    </g>

    <!-- Crossed Whittling Knives in Background -->
    <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round">
      <!-- Left Knife -->
      <line x1="-160" y1="140" x2="160" y2="-140"/>
      <polygon points="160,-140 185,-165 155,-155" fill="#cbd5e1" stroke="none"/>
      <rect x="-180" y="130" width="40" height="18" rx="4" fill="#78350f" transform="rotate(-41 -160 140)"/>
      <!-- Right Knife -->
      <line x1="160" y1="140" x2="-160" y2="-140"/>
      <polygon points="-160,-140 -185,-165 -155,-155" fill="#cbd5e1" stroke="none"/>
      <rect x="140" y="130" width="40" height="18" rx="4" fill="#78350f" transform="rotate(41 160 140)"/>
    </g>

    <!-- BLAZIN' BEAVER HEAD & BUST -->
    <g id="blaze-character" transform="translate(0, 15)">
      <!-- Shoulders & Flannel Shirt -->
      <path d="M -140 160 C -120 70 -60 60 0 60 C 60 60 120 70 140 160 Z" fill="url(#buffaloPlaid)" stroke="#18181b" stroke-width="4"/>
      <!-- Flannel Collar -->
      <polygon points="0,95 -45,65 -15,120" fill="#991b1b" stroke="#18181b" stroke-width="2"/>
      <polygon points="0,95 45,65 15,120" fill="#991b1b" stroke="#18181b" stroke-width="2"/>

      <!-- Beaver Ears -->
      <ellipse cx="-85" cy="-90" rx="28" ry="24" fill="#54250e" stroke="#18181b" stroke-width="3"/>
      <ellipse cx="-85" cy="-90" rx="16" ry="14" fill="#78350f"/>
      <ellipse cx="85" cy="-90" rx="28" ry="24" fill="#54250e" stroke="#18181b" stroke-width="3"/>
      <ellipse cx="85" cy="-90" rx="16" ry="14" fill="#78350f"/>

      <!-- Dark Pine Green Beanie -->
      <path d="M -85 -85 C -85 -165 85 -165 85 -85 C 85 -65 -85 -65 -85 -85 Z" fill="#14532d" stroke="#052e16" stroke-width="4"/>
      <!-- Beanie Ribbed Brim -->
      <rect x="-92" y="-90" width="184" height="30" rx="8" fill="#166534" stroke="#052e16" stroke-width="3"/>
      <!-- Beanie Pom-Pom / Starlight Emblem -->
      <circle cx="0" cy="-165" r="16" fill="#15803d" stroke="#052e16" stroke-width="2"/>
      <circle cx="0" cy="-75" r="8" fill="url(#goldTrim)"/>

      <!-- Beaver Head & Cheeks -->
      <path d="M -85 -55 C -115 0 -105 75 0 75 C 105 75 115 0 85 -55 C 65 -75 -65 -75 -85 -55 Z" fill="url(#furChestnut)" stroke="#18181b" stroke-width="4"/>

      <!-- Muzzle / Snout -->
      <ellipse cx="0" cy="18" rx="60" ry="42" fill="#a16207" stroke="#451a03" stroke-width="3"/>

      <!-- Black Leathery Nose -->
      <polygon points="0,0 -22,-14 22,-14" rx="4" fill="#18181b"/>
      <ellipse cx="0" cy="-10" rx="18" ry="12" fill="#18181b"/>

      <!-- Orange Enamel Teeth (True Beaver Chisel Incisors) -->
      <rect x="-18" y="38" width="16" height="28" rx="3" fill="#ea580c" stroke="#18181b" stroke-width="2"/>
      <rect x="2" y="38" width="16" height="28" rx="3" fill="#ea580c" stroke="#18181b" stroke-width="2"/>
      <line x1="0" y1="38" x2="0" y2="66" stroke="#18181b" stroke-width="2"/>

      <!-- Friendly Eyes with High-Stoned Warmth -->
      <!-- Left Eye -->
      <ellipse cx="-45" cy="-28" rx="14" ry="10" fill="#fef08a" stroke="#18181b" stroke-width="2"/>
      <ellipse cx="-43" cy="-28" rx="7" ry="7" fill="#854d0e"/>
      <circle cx="-41" cy="-30" r="2.5" fill="#ffffff"/>
      <!-- Relaxed Eyelid -->
      <path d="M -60 -34 Q -45 -22 -30 -34 Z" fill="#54250e"/>

      <!-- Right Eye -->
      <ellipse cx="45" cy="-28" rx="14" ry="10" fill="#fef08a" stroke="#18181b" stroke-width="2"/>
      <ellipse cx="43" cy="-28" rx="7" ry="7" fill="#854d0e"/>
      <circle cx="45" cy="-30" r="2.5" fill="#ffffff"/>
      <!-- Relaxed Eyelid -->
      <path d="M 30 -34 Q 45 -22 60 -34 Z" fill="#54250e"/>

      <!-- Whiskers -->
      <line x1="-35" y1="12" x2="-80" y2="5" stroke="#18181b" stroke-width="2"/>
      <line x1="-35" y1="20" x2="-85" y2="24" stroke="#18181b" stroke-width="2"/>
      <line x1="35" y1="12" x2="80" y2="5" stroke="#18181b" stroke-width="2"/>
      <line x1="35" y1="20" x2="85" y2="24" stroke="#18181b" stroke-width="2"/>

      <!-- Hand-Carved Cedar Pipe -->
      <path d="M 22 36 Q 60 48 90 40 L 95 15 L 115 15 L 110 50 Q 60 62 18 42 Z" fill="#78350f" stroke="#18181b" stroke-width="2.5"/>
      <ellipse cx="102" cy="18" rx="12" ry="5" fill="#451a03"/>
      <!-- Glowing Cherry in Pipe -->
      <circle cx="102" cy="18" r="6" fill="#f97316"/>
      <circle cx="102" cy="18" r="3" fill="#fef08a"/>

      <!-- Aromatic Smoke Spiral with Starlight Stars -->
      <path d="M 102 10 C 105 -20 135 -40 120 -70 C 100 -100 140 -120 125 -150" fill="none" stroke="url(#holoRainbow)" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
      <polygon points="135,-80 138,-86 144,-88 138,-90 135,-96 132,-90 126,-88 132,-86" fill="#fef08a"/>
      <polygon points="110,-125 112,-130 117,-132 112,-134 110,-139 108,-134 103,-132 108,-130" fill="#00dfd8"/>
    </g>

    <!-- BOTTOM CREST BANNER -->
    <g transform="translate(0, 245)">
      <!-- Banner Ribbon Wings -->
      <path d="M -310 15 L -260 -15 L -260 45 L -310 75 Z" fill="#991b1b" stroke="#18181b" stroke-width="3"/>
      <path d="M 310 15 L 260 -15 L 260 45 L 310 75 Z" fill="#991b1b" stroke="#18181b" stroke-width="3"/>

      <!-- Main Banner Body -->
      <path d="M -270 -20 L 270 -20 L 290 45 L -290 45 Z" fill="#b91c1c" stroke="#18181b" stroke-width="3.5"/>
      <path d="M -260 -12 L 260 -12 L 278 37 L -278 37 Z" fill="#7f1d1d"/>

      <!-- Banner Text -->
      <text x="0" y="24" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#fef08a" stroke="#18181b" stroke-width="1.5" text-anchor="middle" letter-spacing="4">BLAZIN' BEAVER</text>
    </g>

    <!-- Top & Bottom Arced Badging -->
    <path id="archTopSticker" d="M -250 -70 A 260 260 0 0 1 250 -70" fill="none"/>
    <text font-family="'Cinzel', 'Arial Black', sans-serif" font-weight="900" font-size="20" fill="url(#goldTrim)" letter-spacing="6" text-anchor="middle">
      <textPath href="#archTopSticker" startOffset="50%">PACIFIC NORTHWEST BOTANICALS</textPath>
    </text>

    <text x="0" y="325" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="4" text-anchor="middle">KEEP ON THE GRASS • EST. OREGON</text>

  </g>
</svg>
