const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=canvas.width=900,H=canvas.height=700;
let highScore=parseInt(localStorage.getItem('ossuaryOrbit_hi'))||0;

const ORBIT_ATLAS=new Image();
let ORBIT_ATLAS_READY=false;
ORBIT_ATLAS.onload=()=>{ORBIT_ATLAS_READY=true;};
ORBIT_ATLAS.src='/static/art/games/vorath_overhaul_v01/ossuary_orbit/ossuary_orbit_atlas_v01.png';

// --- Procedural Web Audio Synthesizer (Offline-First) ---
let audioCtx=null;
function initAudio(){
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC)audioCtx=new AC();
  }
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  try{if(window.Chiptune)Chiptune.resume();}catch(e){}
}

function playSynthSound(type){
  initAudio();
  if(!audioCtx)return;
  const now=audioCtx.currentTime;
  try{
    if(type==='shoot'){
      const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
      osc.type='sawtooth';osc.frequency.setValueAtTime(740,now);osc.frequency.exponentialRampToValueAtTime(120,now+0.08);
      g.gain.setValueAtTime(0.12,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.08);
      osc.connect(g);g.connect(audioCtx.destination);osc.start(now);osc.stop(now+0.08);
    }else if(type==='parry'){
      // Radiant crystal chime
      [587.33, 880, 1174.66, 1760].forEach((freq,i)=>{
        const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
        osc.type='sine';osc.frequency.setValueAtTime(freq,now+i*0.02);
        g.gain.setValueAtTime(0.22,now+i*0.02);g.gain.exponentialRampToValueAtTime(0.001,now+0.35+i*0.05);
        osc.connect(g);g.connect(audioCtx.destination);osc.start(now+i*0.02);osc.stop(now+0.4+i*0.05);
      });
    }else if(type==='vortex'){
      const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
      osc.type='triangle';osc.frequency.setValueAtTime(220,now);osc.frequency.exponentialRampToValueAtTime(45,now+0.45);
      g.gain.setValueAtTime(0.35,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.5);
      osc.connect(g);g.connect(audioCtx.destination);osc.start(now);osc.stop(now+0.5);
    }else if(type==='lance'){
      const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
      osc.type='square';osc.frequency.setValueAtTime(1200,now);osc.frequency.linearRampToValueAtTime(300,now+0.25);
      g.gain.setValueAtTime(0.2,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.28);
      osc.connect(g);g.connect(audioCtx.destination);osc.start(now);osc.stop(now+0.28);
    }else if(type==='explode'){
      const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
      osc.type='sawtooth';osc.frequency.setValueAtTime(130,now);osc.frequency.exponentialRampToValueAtTime(25,now+0.3);
      g.gain.setValueAtTime(0.32,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.32);
      osc.connect(g);g.connect(audioCtx.destination);osc.start(now);osc.stop(now+0.32);
    }else if(type==='pop'){
      const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
      osc.type='triangle';osc.frequency.setValueAtTime(440,now);osc.frequency.exponentialRampToValueAtTime(110,now+0.09);
      g.gain.setValueAtTime(0.15,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.09);
      osc.connect(g);g.connect(audioCtx.destination);osc.start(now);osc.stop(now+0.09);
    }
  }catch(e){}
}

const SND_LAST={};
function SND(n){
  try{
    const now=performance.now();
    if(SND_LAST[n]&&now-SND_LAST[n]<65)return;
    SND_LAST[n]=now;
    playSynthSound(n);
    if(window.Chiptune&&Chiptune.SFX&&Chiptune.SFX[n])Chiptune.SFX[n]();
  }catch(e){}
}

// ===== VFX Toolkit =====
const VFX={shake:0,sx:0,sy:0,flash:0,flashCol:'255,255,255'};
function vfxShake(m){VFX.shake=Math.max(VFX.shake,Math.min(18,m));}
function vfxFlash(a,col){if(a>=VFX.flash){VFX.flash=Math.min(0.6,a);VFX.flashCol=col||'255,255,255';}}
function vfxUpdate(){
  if(VFX.shake>0.15){VFX.sx=(Math.random()*2-1)*VFX.shake;VFX.sy=(Math.random()*2-1)*VFX.shake;VFX.shake*=0.86;}
  else{VFX.shake=0;VFX.sx=0;VFX.sy=0;}
  VFX.flash*=0.85;if(VFX.flash<0.012)VFX.flash=0;
}

function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const GLOW_SPR={};
function glowSprite(hue){
  const key=((Math.round(hue/24)*24)%360+360)%360;
  if(GLOW_SPR[key])return GLOW_SPR[key];
  const c=mkCanvas(64,64),g=c.getContext('2d');
  const grad=g.createRadialGradient(32,32,0,32,32,32);
  grad.addColorStop(0,'rgba(255,255,255,0.95)');
  grad.addColorStop(0.16,`hsla(${key},100%,78%,0.85)`);
  grad.addColorStop(0.42,`hsla(${key},95%,58%,0.32)`);
  grad.addColorStop(1,`hsla(${key},90%,50%,0)`);
  g.fillStyle=grad;g.fillRect(0,0,64,64);
  GLOW_SPR[key]=c;return c;
}
function drawGlow(cx2,x,y,r,hue,alpha){
  if(r<=0||alpha<=0)return;
  cx2.globalAlpha=Math.min(1,alpha);
  cx2.drawImage(glowSprite(hue),x-r,y-r,r*2,r*2);
  cx2.globalAlpha=1;
}

function nebulaSprite(h1,h2){
  const c=mkCanvas(256,256),g=c.getContext('2d');
  const grad=g.createRadialGradient(128,128,0,128,128,128);
  grad.addColorStop(0,`hsla(${h1},90%,60%,0.5)`);
  grad.addColorStop(0.45,`hsla(${h2},85%,48%,0.2)`);
  grad.addColorStop(1,'hsla(0,0%,0%,0)');
  g.fillStyle=grad;g.fillRect(0,0,256,256);
  return c;
}

let BG_CACHE=null,OVERLAY_CACHE=null;
const NEBULAS=[];
function buildSpaceLayers(){
  BG_CACHE=mkCanvas(W,H);
  const g=BG_CACHE.getContext('2d');
  const base=g.createLinearGradient(0,0,0,H);
  base.addColorStop(0,'#05030a');base.addColorStop(0.55,'#0a0618');base.addColorStop(1,'#0a0a18');
  g.fillStyle=base;g.fillRect(0,0,W,H);
  const wash=g.createRadialGradient(W*0.5,H*0.42,10,W*0.5,H*0.42,Math.max(W,H)*0.7);
  wash.addColorStop(0,'rgba(60,30,110,0.22)');
  wash.addColorStop(0.6,'rgba(20,25,70,0.12)');
  wash.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=wash;g.fillRect(0,0,W,H);
  g.lineWidth=1;
  for(let r=60;r<Math.max(W,H)*0.75;r+=88){
    g.strokeStyle=(r/88)%2<1?'rgba(127,215,255,0.045)':'rgba(233,200,106,0.035)';
    g.beginPath();g.arc(W*0.5,H*0.46,r,0,Math.PI*2);g.stroke();
  }
  OVERLAY_CACHE=mkCanvas(W,H);
  const o=OVERLAY_CACHE.getContext('2d');
  const v=o.createRadialGradient(W/2,H/2,Math.min(W,H)*0.36,W/2,H/2,Math.max(W,H)*0.74);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(2,1,6,0.5)');
  o.fillStyle=v;o.fillRect(0,0,W,H);
  o.fillStyle='rgba(0,0,0,0.05)';
  for(let y=0;y<H;y+=3)o.fillRect(0,y,W,1);
  NEBULAS.length=0;
  NEBULAS.push({spr:nebulaSprite(265,320),x:W*0.26,y:H*0.32,r:W*0.42,dx:0.018,dy:0.008,ph:0});
  NEBULAS.push({spr:nebulaSprite(192,150),x:W*0.78,y:H*0.7,r:W*0.36,dx:-0.013,dy:-0.007,ph:2.1});
  NEBULAS.push({spr:nebulaSprite(322,25),x:W*0.6,y:H*0.14,r:W*0.28,dx:0.01,dy:0.006,ph:4.2});
}
buildSpaceLayers();

const STARFIELD=[{spd:0.05,n:90},{spd:0.14,n:55},{spd:0.32,n:26}];
STARFIELD.forEach((L,li)=>{
  L.stars=[];
  for(let i=0;i<L.n;i++)L.stars.push({x:Math.random()*W,y:Math.random()*H,s:0.6+li*0.7+Math.random()*0.9,b:Math.random()*6,hue:Math.random()<0.14?[200,48,315][li]:222});
});

function drawSpace(){
  ctx.drawImage(BG_CACHE,0,0);
  ctx.save();ctx.globalCompositeOperation='screen';
  for(const n of NEBULAS){
    n.ph+=0.004;n.x+=n.dx;n.y+=n.dy;
    if(n.x<-n.r)n.x=W+n.r;else if(n.x>W+n.r)n.x=-n.r;
    if(n.y<-n.r)n.y=H+n.r;else if(n.y>H+n.r)n.y=-n.r;
    ctx.globalAlpha=0.16+Math.sin(n.ph)*0.06;
    ctx.drawImage(n.spr,n.x-n.r,n.y-n.r,n.r*2,n.r*2);
  }
  ctx.globalAlpha=1;ctx.restore();
  for(let li=0;li<STARFIELD.length;li++){
    const L=STARFIELD[li];
    for(const s of L.stars){
      s.x-=L.spd;if(s.x<-2)s.x+=W+2;
      s.b+=0.03;
      const tw=0.28+li*0.14+Math.sin(s.b)*0.26;
      ctx.fillStyle=`hsla(${s.hue},80%,84%,${Math.max(0.06,tw)})`;
      ctx.fillRect(s.x,s.y,s.s,s.s);
    }
  }
}

function hudPanel(x,y,w,h,stroke){
  ctx.fillStyle='rgba(6,4,14,0.65)';
  ctx.strokeStyle=stroke;ctx.lineWidth=1;
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(x,y,w,h,7);else ctx.rect(x,y,w,h);
  ctx.fill();ctx.stroke();
}
function setSpacing(px){try{ctx.letterSpacing=px+'px';}catch(e){}}

const STATE={MENU:0,PLAY:1,DEAD:2};
let state=STATE.MENU,frameCount=0;

// Game State Variables
let ship,bullets,reflectedBullets,asteroids,particles,ufos,floatingTexts;
let ufoTimer,score,lives,level,invincible;
let debugShipVisualState=null;

// Modern Mechanics & System 1 AI Director
let freezeFrames=0;
let singularityEnergy=25; // 0..100
let activeSingularity=null;
let activeLaserLance=null;

const orbitDirector={
  tension: 10,
  state: 'STEADY_ORBIT', // STEADY_ORBIT, GRAVITY_ANOMALY, VOID_INCURSION, CALM_RESONANCE
  stateTimer: 0,
  killStreak: 0,
  decisionLatencyUs: 0.48
};

function addFloatingText(x,y,text,color='#e9c86a',size=13){
  floatingTexts.push({x,y,text,color,size,life:1.0,vy:-1.1});
}

function colorHue(color){
  if(color==='#f44')return 4;
  if(color==='#fd0')return 50;
  if(color==='#f80')return 28;
  if(color==='#0f8')return 150;
  if(color==='#f0f')return 305;
  if(color==='#0ff')return 185;
  return 215;
}

function drawFacetGem(x,y,r,hue,rot=0,alpha=1){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot);
  ctx.globalAlpha=alpha;
  drawGlow(ctx,0,0,r*2.6,hue,0.5*alpha);
  ctx.globalAlpha=alpha;
  const g=ctx.createRadialGradient(-r*0.3,-r*0.35,r*0.1,0,0,r*1.2);
  g.addColorStop(0,'rgba(255,255,255,0.94)');
  g.addColorStop(0.22,`hsla(${hue+60},100%,76%,0.9)`);
  g.addColorStop(0.58,`hsla(${hue},100%,54%,0.78)`);
  g.addColorStop(1,`hsla(${hue+145},100%,34%,0.34)`);
  ctx.fillStyle=g;
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    const rr=i%2?r*0.7:r;
    ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
  }
  ctx.closePath();ctx.fill();
  ctx.strokeStyle=`hsla(${hue+70},100%,84%,${0.82*alpha})`;
  ctx.lineWidth=Math.max(1,r*0.09);
  ctx.stroke();
  ctx.restore();
}

const keys={};
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  initAudio();
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight','KeyQ','KeyX','KeyC'].includes(e.code))e.preventDefault();
  
  if(e.code==='Space'){
    if(state===STATE.MENU){init();state=STATE.PLAY;}
    else if(state===STATE.DEAD){state=STATE.MENU;}
  }
  if(state===STATE.PLAY){
    if(e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='KeyC')triggerPhaseParry();
    if(e.code==='KeyQ')triggerGravitonVortex();
    if(e.code==='KeyX')triggerLaserLance();
  }
});
document.addEventListener('keyup',e=>keys[e.code]=false);

function init(){
  ship={
    x:W/2,y:H/2,vx:0,vy:0,angle:0,thrust:false,shootCd:0,hitTimer:0,
    isPhasing:false,phaseTimer:0,phaseCool:0,parryWindow:0,echoes:[]
  };
  bullets=[];
  reflectedBullets=[];
  asteroids=[];
  particles=[];
  ufos=[];
  floatingTexts=[];
  score=0;
  lives=3;
  level=1;
  invincible=120;
  ufoTimer=500;
  singularityEnergy=30;
  activeSingularity=null;
  activeLaserLance=null;

  orbitDirector.tension=15;
  orbitDirector.state='STEADY_ORBIT';
  orbitDirector.stateTimer=0;
  orbitDirector.killStreak=0;

  spawnAsteroids(4);
}

function spawnAsteroids(count){
  for(let i=0;i<count;i++){
    let x,y;
    do{x=Math.random()*W;y=Math.random()*H;}
    while(Math.hypot(x-ship.x,y-ship.y)<160);
    const a=Math.random()*Math.PI*2;
    const sp=0.6+Math.random()*1.4;
    const verts=[];
    const numV=8+Math.floor(Math.random()*5);
    for(let j=0;j<numV;j++){
      const ang=j*Math.PI*2/numV;
      const r=35+Math.random()*15;
      verts.push({x:Math.cos(ang)*r,y:Math.sin(ang)*r});
    }
    asteroids.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,size:3,radius:40,verts,rot:0,rotSpd:(Math.random()-0.5)*0.02});
  }
}

function splitAsteroid(a){
  if(a.size<=1)return;
  for(let i=0;i<2;i++){
    const ang=Math.random()*Math.PI*2;
    const sp=1.2+Math.random()*2.2;
    const newSize=a.size-1;
    const r=newSize===2?22:12;
    const verts=[];
    const numV=6+Math.floor(Math.random()*4);
    for(let j=0;j<numV;j++){
      const va=j*Math.PI*2/numV;
      const vr=r-4+Math.random()*8;
      verts.push({x:Math.cos(va)*vr,y:Math.sin(va)*vr});
    }
    asteroids.push({x:a.x,y:a.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,size:newSize,radius:r,verts,rot:0,rotSpd:(Math.random()-0.5)*0.03});
  }
}

function spawnParticles(x,y,color,count,speed){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const sp=Math.random()*(speed||4)+0.6;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color,size:Math.random()*3.2+1.2});
  }
  if(particles.length>240)particles.splice(0,particles.length-240);
}

function wrap(obj){
  if(obj.x<-50)obj.x=W+50;if(obj.x>W+50)obj.x=-50;
  if(obj.y<-50)obj.y=H+50;if(obj.y>H+50)obj.y=-50;
}

// ----------------- COMBAT VERBS -----------------
function triggerPhaseParry(){
  if(ship.phaseCool>0||ship.isPhasing)return;
  ship.isPhasing=true;
  ship.phaseTimer=0.22;
  ship.parryWindow=0.14;
  ship.phaseCool=0.65;
  
  // Impulse boost in heading
  ship.vx+=Math.cos(ship.angle)*4.5;
  ship.vy+=Math.sin(ship.angle)*4.5;
  
  SND('parry');
  vfxShake(3);
  spawnParticles(ship.x,ship.y,'#7df9ff',15,4);
  addFloatingText(ship.x,ship.y-30,'PHASE SHIFT!','#38bdf8',13);
}

function triggerGravitonVortex(){
  if(singularityEnergy<50)return;
  singularityEnergy-=50;
  
  activeSingularity={
    x:ship.x+Math.cos(ship.angle)*120,
    y:ship.y+Math.sin(ship.angle)*120,
    life:3.5,
    radius:160
  };
  
  freezeFrames=5;
  vfxShake(10);
  vfxFlash(0.2,'127,215,255');
  SND('vortex');
  addFloatingText(activeSingularity.x,activeSingularity.y-40,'GRAVITON VORTEX ANCHOR!','#00ffcc',16);
}

function triggerLaserLance(){
  if(singularityEnergy<35)return;
  singularityEnergy-=35;
  
  const endX=ship.x+Math.cos(ship.angle)*W;
  const endY=ship.y+Math.sin(ship.angle)*H;
  activeLaserLance={
    sx:ship.x,sy:ship.y,tx:endX,ty:endY,
    angle:ship.angle,life:0.25
  };
  
  freezeFrames=4;
  vfxShake(8);
  SND('lance');
  
  // Pierce clean through asteroids along trajectory line
  let hitCount=0;
  for(let ai=asteroids.length-1;ai>=0;ai--){
    const a=asteroids[ai];
    const dx=a.x-ship.x,dy=a.y-ship.y;
    const proj=dx*Math.cos(ship.angle)+dy*Math.sin(ship.angle);
    if(proj>0){
      const perpDist=Math.abs(-dx*Math.sin(ship.angle)+dy*Math.cos(ship.angle));
      if(perpDist<a.radius+16){
        score+=a.size*50;
        hitCount++;
        spawnParticles(a.x,a.y,'#ff4fac',16,4);
        splitAsteroid(a);
        asteroids.splice(ai,1);
      }
    }
  }
  addFloatingText(ship.x,ship.y-35,`LASER LANCE! [${hitCount} PIERCED]`,'#f43f5e',16);
}

// ----------------- SYSTEM 1 AI ENGINE -----------------
function updateSystem1Director(dt){
  const t0=performance.now();
  orbitDirector.stateTimer+=dt;

  if(orbitDirector.state==='STEADY_ORBIT'){
    orbitDirector.tension=Math.min(100,orbitDirector.tension+dt*6+orbitDirector.killStreak*1.5);
    if(orbitDirector.tension>=72||orbitDirector.stateTimer>15){
      orbitDirector.state='VOID_INCURSION';
      orbitDirector.stateTimer=0;
      vfxShake(7);
      addFloatingText(W/2,H/2-80,'DIRECTOR: VOID INCURSION!','#ff4fac',18);
      // Spawn tactical hunter immediately
      spawnHunter();
    }
  }else if(orbitDirector.state==='VOID_INCURSION'){
    orbitDirector.tension=Math.min(100,orbitDirector.tension+dt*3);
    if(orbitDirector.stateTimer>9||(ufos.length===0&&asteroids.length<5)){
      orbitDirector.state='CALM_RESONANCE';
      orbitDirector.stateTimer=0;
      addFloatingText(W/2,H/2-80,'DIRECTOR: CALM RESONANCE','#e9c86a',14);
    }
  }else if(orbitDirector.state==='CALM_RESONANCE'){
    orbitDirector.tension=Math.max(10,orbitDirector.tension-dt*18);
    if(orbitDirector.stateTimer>5){
      orbitDirector.state='STEADY_ORBIT';
      orbitDirector.stateTimer=0;
      orbitDirector.killStreak=0;
    }
  }

  const t1=performance.now();
  orbitDirector.decisionLatencyUs=Math.max(0.18,(t1-t0)*1000);
}

function spawnHunter(){
  const uy=60+Math.random()*(H-120);
  const udir=Math.random()<0.5?1:-1;
  ufos.push({
    x:udir>0?-30:W+30,y:uy,
    vx:udir*(2.0+level*0.35),vy:0,
    hp:3+Math.floor(level/2),
    shootCd:45+Math.floor(Math.random()*45),
    radius:20,
    tactics:'INTERCEPT',
    shield:true
  });
}

// ----------------- MAIN UPDATE LOOP -----------------
function update(){
  frameCount++;

  if(freezeFrames>0){
    freezeFrames--;
    return;
  }

  if(state!==STATE.PLAY)return;
  const dt=1/60;

  // System 1 AI Director
  updateSystem1Director(dt);

  // Active Laser Lance Decay
  if(activeLaserLance){
    activeLaserLance.life-=dt;
    if(activeLaserLance.life<=0)activeLaserLance=null;
  }

  // Active Graviton Singularity Vortex
  if(activeSingularity){
    activeSingularity.life-=dt;
    // Pull nearby asteroids into vortex core
    asteroids.forEach(a=>{
      const dx=activeSingularity.x-a.x,dy=activeSingularity.y-a.y;
      const dist=Math.hypot(dx,dy);
      if(dist<activeSingularity.radius+80){
        const pull=220/(dist+40);
        a.vx+=dx/dist*pull*dt;
        a.vy+=dy/dist*pull*dt;
        // Collision inside singularity core
        if(dist<28){
          score+=120;
          spawnParticles(a.x,a.y,'#00ffcc',12,3);
          splitAsteroid(a);
          asteroids=asteroids.filter(item=>item!==a);
        }
      }
    });
    if(activeSingularity.life<=0)activeSingularity=null;
  }

  // Ship controls
  if(ship.hitTimer>0)ship.hitTimer--;
  if(ship.phaseCool>0)ship.phaseCool-=dt;
  if(ship.phaseTimer>0){
    ship.phaseTimer-=dt;
    if(ship.phaseTimer<=0)ship.isPhasing=false;
  }
  if(ship.parryWindow>0)ship.parryWindow-=dt;

  if(keys['ArrowLeft'])ship.angle-=0.065;
  if(keys['ArrowRight'])ship.angle+=0.065;
  ship.thrust=!!keys['ArrowUp'];
  if(ship.thrust){
    ship.vx+=Math.cos(ship.angle)*0.14;
    ship.vy+=Math.sin(ship.angle)*0.14;
    if(frameCount%3===0)spawnParticles(
      ship.x-Math.cos(ship.angle)*18,ship.y-Math.sin(ship.angle)*18,
      '#f80',2,2
    );
  }

  // Friction & speed cap
  ship.vx*=0.994;ship.vy*=0.994;
  const spd=Math.hypot(ship.vx,ship.vy);
  if(spd>7){ship.vx*=7/spd;ship.vy*=7/spd;}
  ship.x+=ship.vx;ship.y+=ship.vy;
  wrap(ship);

  // Dash Echoes
  if(ship.isPhasing&&frameCount%2===0){
    ship.echoes.push({x:ship.x,y:ship.y,angle:ship.angle,alpha:0.65});
  }
  ship.echoes.forEach(ec=>ec.alpha-=0.08);
  ship.echoes=ship.echoes.filter(ec=>ec.alpha>0);

  // Shooting
  if(ship.shootCd>0)ship.shootCd--;
  if(keys['Space']&&ship.shootCd<=0){
    ship.shootCd=10;
    const bx=ship.x+Math.cos(ship.angle)*18;
    const by=ship.y+Math.sin(ship.angle)*18;
    bullets.push({x:bx,y:by,vx:Math.cos(ship.angle)*9,vy:Math.sin(ship.angle)*9,life:65,owner:'player',damage:1});
    SND('shoot');
  }

  // Move Bullets
  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--;wrap(b);});
  bullets=bullets.filter(b=>b.life>0);

  // Move Reflected Parry Bullets
  reflectedBullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--;wrap(b);});
  reflectedBullets=reflectedBullets.filter(b=>b.life>0);

  // Move Asteroids
  asteroids.forEach(a=>{a.x+=a.vx;a.y+=a.vy;a.rot+=a.rotSpd;wrap(a);});

  // UFOs / System 1 Void Hunters
  ufoTimer--;
  if(ufoTimer<=0&&ufos.length===0){
    spawnHunter();
    ufoTimer=650+Math.floor(Math.random()*350);
  }

  ufos.forEach(u=>{
    u.x+=u.vx;u.y+=Math.sin(frameCount*0.04)*0.8;
    u.shootCd--;
    if(u.shootCd<=0){
      u.shootCd=35+Math.floor(Math.random()*35);
      // Lead targeting
      const dist=Math.hypot(ship.x-u.x,ship.y-u.y);
      const leadTime=dist/4.5;
      const leadX=ship.x+ship.vx*leadTime;
      const leadY=ship.y+ship.vy*leadTime;
      const ang=Math.atan2(leadY-u.y,leadX-u.x);
      bullets.push({x:u.x,y:u.y,vx:Math.cos(ang)*4.5,vy:Math.sin(ang)*4.5,life:95,owner:'ufo'});
      SND('pop');
    }
  });
  ufos=ufos.filter(u=>u.x>-60&&u.x<W+60);

  // Invincibility
  if(invincible>0)invincible--;

  // ----------------- REFLECTIVE PHASE PARRY -----------------
  if(ship.isPhasing&&ship.parryWindow>0){
    for(let bi=bullets.length-1;bi>=0;bi--){
      const b=bullets[bi];
      if(b.owner==='ufo'&&Math.hypot(b.x-ship.x,b.y-ship.y)<38){
        bullets.splice(bi,1);
        freezeFrames=4;
        vfxShake(8);
        vfxFlash(0.18,'127,215,255');
        SND('parry');

        const reflectAng=Math.atan2(b.y-ship.y,b.x-ship.x);
        reflectedBullets.push({
          x:ship.x,y:ship.y,
          vx:Math.cos(reflectAng)*12,
          vy:Math.sin(reflectAng)*12,
          life:70,damage:3
        });
        
        score+=200;
        singularityEnergy=Math.min(100,singularityEnergy+25);
        addFloatingText(ship.x,ship.y-35,'★ ORBITAL DEFLECTION PARRY! +200','#7df9ff',15);
        spawnParticles(ship.x,ship.y,'#7df9ff',18,5);
      }
    }
  }

  // ----------------- BULLETS VS ASTEROIDS -----------------
  function checkBulletAsteroidHits(bList,isReflected=false){
    for(let bi=bList.length-1;bi>=0;bi--){
      const b=bList[bi];
      if(!isReflected&&b.owner!=='player')continue;
      for(let ai=asteroids.length-1;ai>=0;ai--){
        const a=asteroids[ai];
        if(Math.hypot(b.x-a.x,b.y-a.y)<a.radius){
          if(!isReflected)bList.splice(bi,1);
          const pts=(a.size===3?30:a.size===2?60:120)*(isReflected?2:1);
          score+=pts;
          singularityEnergy=Math.min(100,singularityEnergy+(a.size===3?15:6));
          orbitDirector.killStreak++;
          
          spawnParticles(a.x,a.y,['#0ff','#f0f','#fd0'][a.size-1],14+a.size*4,3.5);
          vfxShake(a.size===3?4.5:a.size===2?2.8:1.5);
          if(a.size===3)vfxFlash(0.12,'127,215,255');
          SND(a.size===3?'explode':'pop');
          
          addFloatingText(a.x,a.y,`+${pts}`,['#0ff','#f0f','#fd0'][a.size-1],12);
          splitAsteroid(a);
          asteroids.splice(ai,1);
          break;
        }
      }
    }
  }
  checkBulletAsteroidHits(bullets,false);
  checkBulletAsteroidHits(reflectedBullets,true);

  // ----------------- BULLETS VS UFOS -----------------
  function checkBulletUfoHits(bList,isReflected=false){
    for(let bi=bList.length-1;bi>=0;bi--){
      const b=bList[bi];
      if(!isReflected&&b.owner!=='player')continue;
      for(let ui=ufos.length-1;ui>=0;ui--){
        const u=ufos[ui];
        if(Math.hypot(b.x-u.x,b.y-u.y)<u.radius){
          if(!isReflected)bList.splice(bi,1);
          u.hp-=(isReflected?3:1);
          if(u.hp<=0){
            score+=450;
            singularityEnergy=Math.min(100,singularityEnergy+30);
            orbitDirector.killStreak+=2;
            spawnParticles(u.x,u.y,'#0f8',25,5);
            vfxShake(6.5);vfxFlash(0.18,'110,255,180');
            ufos.splice(ui,1);
            SND('explode');
            addFloatingText(u.x,u.y,'+450 HUNTER DESTROYED!','#0f8',15);
          }else{
            SND('pop');
            spawnParticles(b.x,b.y,'#e9c86a',8,2);
          }
          break;
        }
      }
    }
  }
  checkBulletUfoHits(bullets,false);
  checkBulletUfoHits(reflectedBullets,true);

  // ----------------- SHIP COLLISIONS -----------------
  if(invincible<=0&&!ship.isPhasing){
    for(let a of asteroids){
      if(Math.hypot(ship.x-a.x,ship.y-a.y)<a.radius+12){
        die();return;
      }
    }
    for(let u of ufos){
      if(Math.hypot(ship.x-u.x,ship.y-u.y)<u.radius+14){die();return;}
    }
    for(let b of bullets){
      if(b.owner==='ufo'&&Math.hypot(b.x-ship.x,b.y-ship.y)<15){die();return;}
    }
  }

  // Update Particles
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=0.02;p.vx*=0.98;p.vy*=0.98;});
  particles=particles.filter(p=>p.life>0);

  // Update Floating Texts
  floatingTexts.forEach(ft=>{ft.y+=ft.vy;ft.life-=dt*1.2;});
  floatingTexts=floatingTexts.filter(ft=>ft.life>0);

  // Level complete
  if(asteroids.length===0&&ufos.length===0){
    level++;
    spawnAsteroids(3+level);
    ufoTimer=300;
    vfxFlash(0.18,'233,200,106');
    SND('parry');
    addFloatingText(W/2,H/2,'ORBIT SECTOR CLEARED!','#e9c86a',20);
  }
}

function die(){
  freezeFrames=8;
  vfxShake(14);vfxFlash(0.42,'255,45,85');
  spawnParticles(ship.x,ship.y,'#f44',35,6);
  spawnParticles(ship.x,ship.y,'#fd0',25,4);
  lives--;
  SND('explode');
  if(lives<=0){
    state=STATE.DEAD;
    if(score>highScore){highScore=score;localStorage.setItem('ossuaryOrbit_hi',highScore);}
  } else {
    ship.x=W/2;ship.y=H/2;ship.vx=0;ship.vy=0;ship.angle=0;ship.hitTimer=34;
    invincible=180;
  }
}

// ----------------- RENDERING -----------------
const shipTrail=[];
function drawShip(){
  // Motion trail
  const spdNow=Math.hypot(ship.vx,ship.vy);
  shipTrail.push({x:ship.x,y:ship.y,a:Math.min(1,spdNow/3.5)});
  if(shipTrail.length>20)shipTrail.shift();
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<shipTrail.length;i++){
    const t=shipTrail[i];
    drawGlow(ctx,t.x,t.y,3+i*0.45,190,t.a*(i/shipTrail.length)*0.4);
  }
  ctx.restore();

  // Phase Shift After-Images
  ship.echoes.forEach(echo=>{
    ctx.save();ctx.globalAlpha=echo.alpha*0.6;
    ctx.translate(echo.x,echo.y);ctx.rotate(echo.angle);
    ctx.strokeStyle='#7df9ff';ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(20,0);ctx.lineTo(-14,12);ctx.lineTo(-8,0);ctx.lineTo(-14,-12);ctx.closePath();
    ctx.stroke();
    ctx.restore();
  });

  if(invincible>0&&ship.hitTimer<=0&&Math.floor(frameCount/4)%2)return;
  ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.angle);

  // Parry Aura
  if(ship.parryWindow>0){
    ctx.strokeStyle='rgba(125,249,255,0.85)';
    ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.arc(0,0,26+Math.sin(frameCount*0.4)*4,0,Math.PI*2);
    ctx.stroke();
  }

  drawGlow(ctx,0,0,36,188,0.55);

  // Thrust flame
  if(ship.thrust){
    const flen=16+Math.random()*8;
    drawGlow(ctx,-14-flen*0.4,0,12+Math.random()*4,32,0.8);
    const fg=ctx.createLinearGradient(-8,0,-8-flen-8,0);
    fg.addColorStop(0,'rgba(255,255,255,0.95)');
    fg.addColorStop(0.35,'rgba(255,200,90,0.85)');
    fg.addColorStop(1,'rgba(255,80,30,0)');
    ctx.fillStyle=fg;
    ctx.beginPath();ctx.moveTo(-8,5);ctx.lineTo(-8-flen,0);ctx.lineTo(-8,-5);ctx.closePath();ctx.fill();
  }

  if(ORBIT_ATLAS_READY){
    const row=debugShipVisualState===null?(ship.hitTimer>0?2:(ship.thrust?1:0)):debugShipVisualState;
    const pulse=ship.hitTimer>0?1.08:(1+Math.sin(frameCount*0.08)*0.025);
    ctx.globalAlpha=ship.hitTimer>0?0.94:1;
    ctx.drawImage(ORBIT_ATLAS,0,row*512,512,512,-39*pulse,-39*pulse,78*pulse,78*pulse);
    ctx.globalAlpha=1;
    ctx.restore();
    return;
  }

  // Ship hull
  const hull=ctx.createLinearGradient(-18,-12,22,12);
  hull.addColorStop(0,'rgba(255,255,255,0.6)');
  hull.addColorStop(0.32,'rgba(236,72,153,0.4)');
  hull.addColorStop(0.7,'rgba(127,215,255,0.5)');
  hull.addColorStop(1,'rgba(20,40,70,0.35)');
  ctx.fillStyle=hull;
  ctx.beginPath();
  ctx.moveTo(20,0);ctx.lineTo(-14,12);ctx.lineTo(-8,0);ctx.lineTo(-14,-12);ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='rgba(127,215,255,0.3)';ctx.lineWidth=5;ctx.stroke();
  ctx.strokeStyle='#bffcff';ctx.lineWidth=1.6;ctx.stroke();

  ctx.restore();
}

const AST_GRAD={};
function astGrad(size,hue){
  if(AST_GRAD[size])return AST_GRAD[size];
  const R=size===3?40:size===2?22:12;
  const g=ctx.createRadialGradient(-R*0.35,-R*0.4,R*0.12,0,0,R*1.15);
  g.addColorStop(0,`hsla(${hue},75%,62%,0.4)`);
  g.addColorStop(0.5,`hsla(${hue},80%,36%,0.22)`);
  g.addColorStop(1,'rgba(6,3,14,0.7)');
  AST_GRAD[size]=g;return g;
}

function drawAsteroid(a){
  const hue=a.size===3?305:a.size===2?185:50;
  drawGlow(ctx,a.x,a.y,a.radius*1.8,hue,0.35);
  ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rot);
  if(ORBIT_ATLAS_READY){
    const row=a.size===3?0:(a.size===2?1:2);
    const d=a.radius*2.65;
    ctx.drawImage(ORBIT_ATLAS,512,row*512,512,512,-d/2,-d/2,d,d);
    ctx.restore();
    return;
  }
  ctx.fillStyle=astGrad(a.size,hue);
  ctx.beginPath();
  ctx.moveTo(a.verts[0].x,a.verts[0].y);
  for(let i=1;i<a.verts.length;i++)ctx.lineTo(a.verts[i].x,a.verts[i].y);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle=`hsla(${hue},100%,60%,0.3)`;ctx.lineWidth=5;ctx.stroke();
  ctx.strokeStyle=`hsla(${hue},100%,78%,0.95)`;ctx.lineWidth=1.6;ctx.stroke();
  ctx.restore();
}

function drawUFO(u){
  drawGlow(ctx,u.x,u.y,38,44,0.5);
  ctx.save();ctx.translate(u.x,u.y);
  ctx.rotate(frameCount*0.02*Math.sign(u.vx));
  ctx.strokeStyle='rgba(233,200,106,0.9)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,19,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='rgba(127,215,255,0.75)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.stroke();
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3;
    ctx.beginPath();ctx.moveTo(Math.cos(a)*12,Math.sin(a)*12);ctx.lineTo(Math.cos(a)*25,Math.sin(a)*25);ctx.stroke();
    drawFacetGem(Math.cos(a)*24,Math.sin(a)*24,2.8,42+i*48,-frameCount*0.03+i,0.86);
  }
  drawFacetGem(0,0,8,315,frameCount*0.035,1);
  ctx.restore();
}

function drawHUD(){
  setSpacing(2.5);
  // Score panel (left)
  hudPanel(12,12,210,48,'rgba(127,215,255,0.35)');
  ctx.textAlign='left';
  ctx.fillStyle='rgba(127,215,255,0.7)';ctx.font='10px "Segoe UI",Arial,sans-serif';
  ctx.fillText('VERDICTS',24,27);
  ctx.font='600 20px "Segoe UI",Arial,sans-serif';
  ctx.fillStyle='#eafcff';
  ctx.fillText(String(score),24,49);

  // System 1 Orbit Director Telemetry (Center-Left)
  const dirColor=orbitDirector.tension>70?'#ff4fac':(orbitDirector.tension>40?'#e9c86a':'#64f0b0');
  hudPanel(W/2-110,12,220,48,'rgba(233,200,106,0.35)');
  ctx.textAlign='center';
  ctx.font='600 12px "Segoe UI",Arial,sans-serif';
  ctx.fillStyle='#e9c86a';
  ctx.fillText(`ORBIT SECTOR ${level}`,W/2,27);
  ctx.font='10px ui-monospace,monospace';ctx.fillStyle=dirColor;
  ctx.fillText(`DIRECTOR [${orbitDirector.state}] ${Math.round(orbitDirector.tension)}% · ${orbitDirector.decisionLatencyUs.toFixed(3)}µs`,W/2,48);

  // Singularity Energy (Right)
  hudPanel(W-190,12,178,48,'rgba(236,72,153,0.35)');
  ctx.textAlign='right';
  ctx.fillStyle=singularityEnergy>=50?'#00ffcc':'#aaa';
  ctx.font='600 11px ui-monospace,monospace';
  ctx.fillText(`VORTEX [Q]: ${Math.round(singularityEnergy)}%`,W-24,27);
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(W-176,36,150,4);
  ctx.fillStyle='#00ffcc';ctx.fillRect(W-176,36,150*(singularityEnergy/100),4);

  // Lives
  ctx.textAlign='left';
  for(let i=0;i<lives;i++){
    drawGlow(ctx,26+i*29,78,12,48,0.38);
    if(ORBIT_ATLAS_READY)ctx.drawImage(ORBIT_ATLAS,0,0,512,512,13+i*29,65,26,26);
    else{
      ctx.save();ctx.translate(26+i*29,78);ctx.strokeStyle='#e9c86a';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(0,0,8,-Math.PI*0.72,Math.PI*0.72);ctx.stroke();ctx.restore();
    }
  }

  // Parry Status
  ctx.textAlign='right';ctx.font='11px ui-monospace,monospace';
  ctx.fillStyle=ship.phaseCool<=0?'#7df9ff':'#777';
  ctx.fillText(ship.phaseCool<=0?'PARRY READY [SHIFT]':`PARRY CD: ${ship.phaseCool.toFixed(1)}s`,W-20,H-22);
  setSpacing(0);
}

function draw(){
  vfxUpdate();
  drawSpace();

  ctx.save();
  ctx.translate(VFX.sx,VFX.sy);
  if(state===STATE.PLAY||(state===STATE.DEAD&&lives<=0)){
    asteroids.forEach(a=>drawAsteroid(a));
    ufos.forEach(u=>drawUFO(u));

    // Active Graviton Vortex Rendering
    if(activeSingularity){
      ctx.save();
      const pulse=Math.sin(frameCount*0.2)*8;
      const gv=ctx.createRadialGradient(activeSingularity.x,activeSingularity.y,2,activeSingularity.x,activeSingularity.y,activeSingularity.radius+pulse);
      gv.addColorStop(0,'rgba(0,255,204,0.85)');
      gv.addColorStop(0.35,'rgba(34,211,238,0.4)');
      gv.addColorStop(0.7,'rgba(168,85,247,0.2)');
      gv.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gv;
      ctx.beginPath();ctx.arc(activeSingularity.x,activeSingularity.y,activeSingularity.radius+pulse,0,Math.PI*2);ctx.fill();
      drawFacetGem(activeSingularity.x,activeSingularity.y,16,180,frameCount*0.1,1);
      ctx.restore();
    }

    // Active Laser Lance Rendering
    if(activeLaserLance){
      ctx.save();
      ctx.strokeStyle='rgba(244,63,94,0.9)';ctx.lineWidth=6;
      ctx.shadowColor='#f43f5e';ctx.shadowBlur=24;
      ctx.beginPath();ctx.moveTo(activeLaserLance.sx,activeLaserLance.sy);ctx.lineTo(activeLaserLance.tx,activeLaserLance.ty);ctx.stroke();
      ctx.strokeStyle='#fff';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(activeLaserLance.sx,activeLaserLance.sy);ctx.lineTo(activeLaserLance.tx,activeLaserLance.ty);ctx.stroke();
      ctx.restore();
    }

    // Player & Enemy Bullets
    bullets.forEach(b=>{
      const hue=b.owner==='player'?185:340;
      ctx.strokeStyle=`hsla(${hue},100%,78%,0.8)`;ctx.lineWidth=1.8;
      ctx.beginPath();ctx.moveTo(b.x-b.vx*1.4,b.y-b.vy*1.4);ctx.lineTo(b.x,b.y);ctx.stroke();
      drawGlow(ctx,b.x,b.y,10,hue,0.75);
    });

    // Reflected Parry Bullets (Radiant Prism Lances)
    reflectedBullets.forEach(b=>{
      ctx.strokeStyle='#7df9ff';ctx.lineWidth=2.8;
      ctx.beginPath();ctx.moveTo(b.x-b.vx*2.0,b.y-b.vy*2.0);ctx.lineTo(b.x,b.y);ctx.stroke();
      drawGlow(ctx,b.x,b.y,14,180,0.9);
    });

    if(lives>0)drawShip();

    // Particles
    ctx.save();ctx.globalCompositeOperation='lighter';
    particles.forEach(p=>{
      drawGlow(ctx,p.x,p.y,(p.size+2.5)*(0.7+p.life*0.9),colorHue(p.color),p.life);
    });
    ctx.restore();

    // Floating Text
    floatingTexts.forEach(ft=>{
      ctx.save();ctx.globalAlpha=ft.life;
      ctx.font=`bold ${ft.size}px ui-monospace,monospace`;
      ctx.fillStyle=ft.color;ctx.textAlign='center';
      ctx.shadowColor=ft.color;ctx.shadowBlur=8;
      ctx.fillText(ft.text,ft.x,ft.y);
      ctx.restore();
    });
  }
  ctx.restore();

  // Impact flash
  if(VFX.flash>0){
    ctx.fillStyle=`rgba(${VFX.flashCol},${VFX.flash})`;
    ctx.fillRect(0,0,W,H);
  }

  if(state===STATE.PLAY||(state===STATE.DEAD&&lives<=0))drawHUD();
  if(state===STATE.MENU)drawMenu();
  if(state===STATE.DEAD)drawDead();

  ctx.drawImage(OVERLAY_CACHE,0,0);
}

function drawMenu(){
  ctx.fillStyle='rgba(3,2,8,0.75)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';

  setSpacing(7);
  ctx.font='800 50px "Segoe UI",Arial,sans-serif';
  ctx.shadowColor='#e9c86a';ctx.shadowBlur=24;
  ctx.fillStyle='#e9c86a';
  ctx.fillText('OSSUARY',W/2,H/2-95);
  ctx.font='700 24px "Segoe UI",Arial,sans-serif';
  ctx.fillStyle='#7df9ff';
  ctx.fillText('ORBIT : APEX AI',W/2,H/2-55);
  ctx.shadowBlur=0;
  setSpacing(0);

  const pa=0.45+Math.sin(frameCount*0.06)*0.4;
  setSpacing(4);
  ctx.font='600 16px "Segoe UI",Arial,sans-serif';
  ctx.fillStyle=`rgba(233,200,106,${pa})`;
  ctx.fillText('PRESS SPACE TO COMMENCE RUN',W/2,H/2+90);
  setSpacing(1);
  ctx.font='11px ui-monospace,monospace';ctx.fillStyle='rgba(160,170,205,0.7)';
  ctx.fillText('ARROWS: TURN / THRUST  |  SPACE: CANNON',W/2,H/2+120);
  ctx.fillText('SHIFT / C: PHASE SHIFT & REFLECTIVE PARRY',W/2,H/2+140);
  ctx.fillText('Q: GRAVITON SINGULARITY VORTEX  |  X: LASER LANCE',W/2,H/2+160);
  ctx.fillText('SYSTEM 1 VOID HUNTERS & REAL-TIME DIRECTOR PACING',W/2,H/2+185);
  setSpacing(0);
}

function drawDead(){
  hudPanel(W/2-210,H/2-115,420,270,'rgba(255,45,85,0.4)');
  ctx.textAlign='center';
  setSpacing(5);
  ctx.shadowColor='rgba(255,45,85,0.8)';ctx.shadowBlur=22;
  ctx.font='800 36px "Segoe UI",Arial,sans-serif';ctx.fillStyle='#ff5d7d';
  ctx.fillText('SKIFF DISPERSED',W/2,H/2-48);
  ctx.shadowBlur=0;
  setSpacing(2);
  ctx.font='600 22px "Segoe UI",Arial,sans-serif';ctx.fillStyle='#e9c86a';
  ctx.fillText('VERDICTS  '+score,W/2,H/2+4);
  
  if(score>=highScore&&score>0){
    ctx.fillStyle='#7fffc4';ctx.font='600 15px "Segoe UI",Arial,sans-serif';
    ctx.fillText('★ NEW ARCHIVE RECORD ★',W/2,H/2+32);
  }
  ctx.font='12px "Segoe UI",Arial,sans-serif';ctx.fillStyle='rgba(170,180,210,0.7)';
  ctx.fillText('ALL-TIME ARCHIVE: '+highScore,W/2,H/2+56);
  ctx.fillText(`DIRECTOR PEAK TENSION: ${Math.round(orbitDirector.tension)}%`,W/2,H/2+78);

  const pa=0.45+Math.sin(frameCount*0.06)*0.4;
  ctx.fillStyle=`rgba(127,215,255,${pa})`;ctx.font='600 15px "Segoe UI",Arial,sans-serif';
  setSpacing(3);
  ctx.fillText('PRESS SPACE TO REENTER THE ORBIT',W/2,H/2+116);
  setSpacing(0);
}

// ----------------- COMPATIBILITY & DEBUG APIS -----------------
function ossuaryOrbitPayload(){
  const runtimeState=debugShipVisualState===null
    ? (ship ? (ship.hitTimer>0?2:(ship.thrust?1:0)) : 0)
    : debugShipVisualState;
  return {
    title:'Ossuary Orbit : Apex AI Edition',
    state,
    frame:frameCount,
    atlas:'/static/art/games/vorath_overhaul_v01/ossuary_orbit/ossuary_orbit_atlas_v01.png',
    atlas_ready:ORBIT_ATLAS_READY,
    ship_visual_state:runtimeState,
    ship_visual_name:['idle','thrust','hit'][runtimeState]||'unknown',
    debris_families:(asteroids||[]).map(a=>a.size===3?'crown_ossuary':(a.size===2?'chained_witness':'split_oracle')),
    ship_pose:ship?{x:ship.x,y:ship.y,angle:ship.angle,vx:ship.vx,vy:ship.vy}:null,
    bullet_count:(bullets||[]).filter(b=>b.owner==='player').length,
    score:score||0,
    lives:lives||0,
    level:level||0,
    orbitDirector:{
      state:orbitDirector.state,
      tension:Math.round(orbitDirector.tension),
      decisionLatencyUs:orbitDirector.decisionLatencyUs
    }
  };
}
window.ossuaryOrbitPayload=ossuaryOrbitPayload;
window.__ossuaryOrbitDebug={
  payload:ossuaryOrbitPayload,
  triggerParry:()=>triggerPhaseParry(),
  triggerVortex:()=>triggerGravitonVortex(),
  setShipVisualState(value){
    if(!ship)init();
    state=STATE.PLAY;invincible=0;
    debugShipVisualState=Math.max(0,Math.min(2,Number(value)||0));
    return ossuaryOrbitPayload();
  },
  clearShipVisualState(){debugShipVisualState=null;return ossuaryOrbitPayload();},
  setDebrisFamilies(){
    if(!ship)init();
    state=STATE.PLAY;invincible=0;ufos=[];bullets=[];
    const make=(x,y,size)=>({x,y,vx:0,vy:0,size,radius:size===3?40:(size===2?22:12),verts:[{x:1,y:0},{x:0,y:1},{x:-1,y:0},{x:0,y:-1}],rot:0,rotSpd:0});
    asteroids=[make(190,180,3),make(700,230,2),make(690,530,1)];
    return ossuaryOrbitPayload();
  }
};

let lastAttestScore = -1;
function loop(){
  update();
  draw();
  if(typeof score !== 'undefined' && score !== lastAttestScore){
    lastAttestScore = score;
    const btn = document.getElementById('attestCryptoBtn');
    if(btn) btn.href = '/crypto?game=ossuary-orbit&score=' + score + '&pane=arcade-pane';
  }
  requestAnimationFrame(loop);
}
loop();
try { window.GLFX && GLFX.attach(canvas, {bloom:0.7, threshold:0.55, scanlines:0.06, aberration:0.0018, vignette:0.32}); } catch(e){}
</script>
