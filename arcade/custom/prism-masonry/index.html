<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PRISM MASONRY</title>
<style>
:root{color-scheme:dark;--gold:#efcb72;--cyan:#68efff;--mag:#ff5dcc;--ink:#02030a}*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#02030a}body{display:grid;place-items:center;color:#fff4d8;font-family:Georgia,serif;touch-action:none}#shell{width:min(100vw,1080px);height:min(100vh,820px);display:grid;grid-template-rows:minmax(0,1fr) auto;padding:8px;gap:6px;background:radial-gradient(circle at 50% 15%,rgba(94,48,166,.22),transparent 50%)}#c{display:block;width:100%;height:100%;min-height:0;border:1px solid rgba(239,203,114,.38);border-radius:14px;background:#03030a;box-shadow:0 0 40px rgba(104,239,255,.12),inset 0 0 50px #000}#touch{display:flex;justify-content:center;gap:6px}.key{min-width:54px;padding:9px 14px;border:1px solid rgba(239,203,114,.28);border-radius:999px;background:#0b0718;color:var(--gold);font:900 12px ui-monospace,monospace}.legend{align-self:center;color:#8290a8;font:700 10px ui-monospace,monospace;letter-spacing:.08em}@media(max-width:620px){#shell{padding:4px}.legend{display:none}.key{padding:8px 10px;min-width:48px}}
</style></head><body><main id="shell"><canvas id="c" width="960" height="720" aria-label="Prism Masonry aurora reactor"></canvas><div id="touch"><button class="key" data-a="left">←</button><button class="key" data-a="rotate">↻</button><button class="key" data-a="right">→</button><button class="key" data-a="drop">◆</button><span class="legend">ARROWS ALIGN · UP ROTATES · DOWN ACCELERATES · SPACE PULSE-SEALS</span></div></main>
<script src="/static/games/chiptune.js"></script><script>
"use strict";
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d'),W=960,H=720,COLS=12,ROWS=18,CELL=34,BX=276,BY=54,TAU=Math.PI*2;
const PRISM_RELIQUARIES=[
 {name:'Aurora Spine',cells:[[0,0],[1,0],[1,1],[1,2],[2,2],[2,3]],h:188},
 {name:'Crown Lattice',cells:[[0,0],[1,0],[2,0],[0,1],[2,1],[1,2]],h:42},
 {name:'Split Lens',cells:[[0,0],[1,0],[2,0],[2,1],[3,1],[3,2]],h:314},
 {name:'Verdict Cradle',cells:[[0,0],[2,0],[0,1],[1,1],[2,1],[1,2]],h:145},
 {name:'Signal Crozier',cells:[[0,0],[0,1],[0,2],[1,2],[2,2],[2,3]],h:265},
 {name:'Sixfold Eye',cells:[[1,0],[0,1],[1,1],[2,1],[1,2],[1,3]],h:23},
 {name:'Mirror Stair',cells:[[0,0],[1,0],[1,1],[2,1],[2,2],[3,2]],h:92},
 {name:'Gate Anchor',cells:[[0,0],[1,0],[2,0],[1,1],[1,2],[2,2]],h:220}
];
const HAZARD_NAMES=['Phase Shutter','Null Scar','Polarity Crown'];
const GRAVITIES=[{dx:0,dy:1,name:'DESCENT'},{dx:1,dy:0,name:'EAST FLUX'},{dx:0,dy:1,name:'DESCENT'},{dx:-1,dy:0,name:'WEST FLUX'}];
const keys=new Set();let board,current,next,hazards=[],gravityIndex=0,flux=0,strata=0,cycle=1,stability=100,locks=0,state='menu',time=0,last=performance.now(),fall=0,shake=0,flash=0,particles=[];
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function sfx(n){try{window.Chiptune?.resume();window.Chiptune?.SFX?.[n]?.()}catch(_){}}
function clone(f){return{name:f.name,cells:f.cells.map(p=>[...p]),h:f.h,x:0,y:0,rot:0};}
function randomForm(){return clone(PRISM_RELIQUARIES[Math.floor(Math.random()*PRISM_RELIQUARIES.length)]);}
function gravity(){return GRAVITIES[gravityIndex%GRAVITIES.length];}
function spawn(p=randomForm()){const g=gravity();if(g.dx===0){p.x=4;p.y=-4}else if(g.dx>0){p.x=-5;p.y=6}else{p.x=COLS+2;p.y=6}return p;}
function reset(){board=Array.from({length:ROWS},()=>Array(COLS).fill(null));gravityIndex=0;flux=0;strata=0;cycle=1;stability=100;locks=0;particles=[];hazards=[];seedHazards();current=spawn();next=randomForm();state='playing';fall=0;sfx('gate');}
function hazardAt(x,y){return hazards.find(h=>h.x===x&&h.y===y);}
function blocksHazard(h){return h&&(h.type==='Null Scar'||(h.type==='Phase Shutter'&&Math.floor(time*1.7)%2===0));}
function valid(p,cells=p.cells,x=p.x,y=p.y){const g=gravity();return cells.every(([cx,cy])=>{const gx=x+cx,gy=y+cy;if(g.dx===0){if(gx<0||gx>=COLS||gy>=ROWS)return false;if(gy<0)return true}else{if(gy<0||gy>=ROWS)return false;if((g.dx>0&&gx<0)||(g.dx<0&&gx>=COLS))return true;if(gx<0||gx>=COLS)return false}return !board[gy][gx]&&!blocksHazard(hazardAt(gx,gy));});}
function normalize(cells){const mx=Math.min(...cells.map(p=>p[0])),my=Math.min(...cells.map(p=>p[1]));return cells.map(([x,y])=>[x-mx,y-my]);}
function rotate(){if(state!=='playing')return false;const r=normalize(current.cells.map(([x,y])=>[-y,x]));for(const [kx,ky] of [[0,0],[-1,0],[1,0],[0,-1],[0,1],[-2,0],[2,0]])if(valid(current,r,current.x+kx,current.y+ky)){current.cells=r;current.x+=kx;current.y+=ky;current.rot=(current.rot+1)%4;sfx('tick');return true}return false;}
function transverse(dir){if(state!=='playing')return false;const g=gravity(),nx=current.x+(g.dx===0?dir:0),ny=current.y+(g.dx!==0?dir:0);if(valid(current,current.cells,nx,ny)){current.x=nx;current.y=ny;sfx('tick');return true}return false;}
function step(){const g=gravity(),nx=current.x+g.dx,ny=current.y+g.dy;if(valid(current,current.cells,nx,ny)){current.x=nx;current.y=ny;return true}seal();return false;}
function hardDrop(){if(state==='menu'||state==='lost'){reset();return}if(state!=='playing')return;let d=0;while(stepPreview()){current.x+=gravity().dx;current.y+=gravity().dy;d++}flux+=d*2;seal();shake=6;sfx('shoot');}
function stepPreview(){const g=gravity();return valid(current,current.cells,current.x+g.dx,current.y+g.dy);}
function burst(x,y,h,n=8){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=rand(50,200);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.35,.9),h});}if(particles.length>300)particles.splice(0,particles.length-300);}
function seedHazards(){hazards=[];const types=[...HAZARD_NAMES];for(let i=0;i<5;i++){let x,y;do{x=2+Math.floor(Math.random()*(COLS-4));y=3+Math.floor(Math.random()*(ROWS-6));}while(hazardAt(x,y));hazards.push({x,y,type:types[i%3],phase:rand(0,TAU)});}}
function seal(){
  let polarity=0;for(const [cx,cy] of current.cells){const x=current.x+cx,y=current.y+cy;if(x<0||x>=COLS||y<0||y>=ROWS){stability=0;state='lost';sfx('death');return;}board[y][x]={h:current.h,phase:rand(0,TAU)};if(hazards.some(z=>z.type==='Polarity Crown'&&Math.abs(z.x-x)+Math.abs(z.y-y)<=1))polarity++;burst(BX+(x+.5)*CELL,BY+(y+.5)*CELL,current.h,3);}
  locks++;flux+=35;stability=clamp(stability-(polarity?polarity*4:1),0,100);const cleared=stabilizeBands();if(!cleared&&locks%3===0)stability=clamp(stability-3,0,100);if(stability<=0){state='lost';sfx('death');return;}if(locks%4===0)shiftGravity();current=spawn(next);next=randomForm();if(!valid(current)){state='lost';sfx('death');}
}
function stabilizeBands(){const g=gravity(),bands=[];if(g.dx===0){for(let y=0;y<ROWS;y++)if(board[y].every(Boolean))bands.push(y);for(const y of bands){for(let x=0;x<COLS;x++)burst(BX+(x+.5)*CELL,BY+(y+.5)*CELL,board[y][x].h,8);board.splice(y,1);board.unshift(Array(COLS).fill(null));}}else{for(let x=0;x<COLS;x++)if(board.every(r=>r[x]))bands.push(x);for(const x of bands)for(let y=0;y<ROWS;y++){burst(BX+(x+.5)*CELL,BY+(y+.5)*CELL,board[y][x].h,7);board[y].splice(x,1);board[y].splice(g.dx>0?0:COLS-1,0,null);}}
  if(bands.length){strata+=bands.length;flux+=bands.length*650;stability=clamp(stability+bands.length*16,0,100);flash=.3;shake=13;sfx('gate');}cycle=1+Math.floor(locks/4);return bands.length;}
function shiftGravity(){gravityIndex=(gravityIndex+1)%GRAVITIES.length;seedHazards();flash=.24;shake=9;sfx('gate');}
function update(dt){time+=dt;flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt*30);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=40*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(state!=='playing')return;fall+=dt*(keys.has('ArrowDown')?7:1);const interval=Math.max(.1,.72-cycle*.045);while(fall>=interval){fall-=interval;step();if(state!=='playing')break;}}
function crystal(b,x,y,size=CELL-3,alpha=1){const px=BX+x*CELL+1.5,py=BY+y*CELL+1.5;ctx.save();ctx.globalAlpha=alpha;ctx.shadowColor=`hsl(${b.h} 100% 66%)`;ctx.shadowBlur=9;const g=ctx.createLinearGradient(px,py,px+size,py+size);g.addColorStop(0,'#fff8dc');g.addColorStop(.23,`hsl(${b.h} 95% 65%)`);g.addColorStop(.72,`hsl(${b.h} 76% 28%)`);g.addColorStop(1,'#05020a');ctx.fillStyle=g;ctx.strokeStyle='rgba(255,241,195,.74)';ctx.beginPath();ctx.moveTo(px+size*.5,py);ctx.lineTo(px+size,py+size*.3);ctx.lineTo(px+size*.82,py+size);ctx.lineTo(px+size*.18,py+size);ctx.lineTo(px,py+size*.3);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.moveTo(px+size*.5,py);ctx.lineTo(px+size*.5,py+size);ctx.moveTo(px,py+size*.3);ctx.lineTo(px+size*.82,py+size);ctx.stroke();ctx.restore();}
function backdrop(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#080516');g.addColorStop(.6,'#100720');g.addColorStop(1,'#02030a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(BX+COLS*CELL/2,BY+ROWS*CELL/2);ctx.strokeStyle='rgba(239,203,114,.085)';for(let r=60;r<430;r+=30){ctx.beginPath();ctx.ellipse(0,0,r,r*.78,time*.01,0,TAU);ctx.stroke()}for(let i=0;i<28;i++){const a=i/28*TAU-time*.012;ctx.beginPath();ctx.moveTo(Math.cos(a)*45,Math.sin(a)*45);ctx.lineTo(Math.cos(a)*430,Math.sin(a)*360);ctx.stroke()}ctx.restore();ctx.fillStyle='rgba(3,2,9,.88)';ctx.fillRect(BX-8,BY-8,COLS*CELL+16,ROWS*CELL+16);ctx.strokeStyle='rgba(239,203,114,.48)';ctx.strokeRect(BX-7.5,BY-7.5,COLS*CELL+15,ROWS*CELL+15);}
function drawHazard(h){const x=BX+(h.x+.5)*CELL,y=BY+(h.y+.5)*CELL,p=.6+Math.sin(time*4+h.phase)*.35;ctx.save();ctx.translate(x,y);if(h.type==='Phase Shutter'){ctx.strokeStyle=`rgba(104,239,255,${p})`;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-13,-13);ctx.lineTo(13,13);ctx.moveTo(13,-13);ctx.lineTo(-13,13);ctx.stroke()}else if(h.type==='Null Scar'){ctx.fillStyle='rgba(0,0,0,.9)';ctx.strokeStyle=`rgba(255,93,204,${p})`;ctx.beginPath();ctx.arc(0,0,12,0,TAU);ctx.fill();ctx.stroke()}else{ctx.rotate(time);ctx.strokeStyle=`rgba(239,203,114,${p})`;ctx.beginPath();for(let i=0;i<8;i++){const a=i/8*TAU,r=i%2?5:14;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.stroke()}ctx.restore();}
function drawPiece(p,ghost=false){for(const [x,y] of p.cells){const gx=p.x+x,gy=p.y+y;if(gx>=0&&gx<COLS&&gy>=0&&gy<ROWS)crystal({h:p.h},gx,gy,CELL-3,ghost?.16:1)}}
function drawHud(){ctx.save();ctx.font='700 12px ui-monospace,monospace';ctx.fillStyle='#efcb72';ctx.fillText('PRISM MASONRY',34,52);ctx.fillStyle='#71819e';ctx.fillText('AURORA REACTOR',34,73);const rows=[['FLUX',String(flux).padStart(6,'0')],['STRATA',strata],['CYCLE',cycle],['GRAVITY',gravity().name],['STABILITY',`${stability}%`]];rows.forEach(([a,b],i)=>{const y=140+i*64;ctx.fillStyle='#71819e';ctx.fillText(a,35,y);ctx.fillStyle=i===4&&stability<30?'#ff5577':i===3?'#68efff':'#fff4d8';ctx.font='700 21px ui-monospace,monospace';ctx.fillText(b,35,y+25);ctx.font='700 12px ui-monospace,monospace'});ctx.fillStyle='#71819e';ctx.fillText('APPROACHING',735,140);ctx.fillStyle='#fff4d8';ctx.fillText(next?.name||'—',735,163);ctx.fillStyle='#71819e';ctx.fillText('CHAMBER HAZARDS',735,235);HAZARD_NAMES.forEach((n,i)=>{ctx.fillStyle=['#68efff','#ff5dcc','#efcb72'][i];ctx.fillText(n.toUpperCase(),735,263+i*28)});ctx.fillStyle='#71819e';ctx.fillText('SHIFT AFTER',735,382);ctx.fillStyle='#fff4d8';ctx.font='700 22px ui-monospace,monospace';ctx.fillText(`${4-locks%4} SEALS`,735,410);ctx.restore();}
function panel(kicker,title,copy,action){ctx.fillStyle='rgba(2,1,7,.82)';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(13,8,25,.94)';ctx.fillRect(145,205,670,320);ctx.strokeStyle='rgba(239,203,114,.5)';ctx.strokeRect(145.5,205.5,669,319);ctx.textAlign='center';ctx.fillStyle='#68efff';ctx.font='700 12px ui-monospace,monospace';ctx.fillText(kicker,480,252);ctx.fillStyle='#efcb72';ctx.font='700 46px Georgia';ctx.shadowColor='#efcb72';ctx.shadowBlur=18;ctx.fillText(title,480,323);ctx.shadowBlur=0;ctx.fillStyle='#ddd4c1';ctx.font='17px Georgia';copy.forEach((l,i)=>ctx.fillText(l,480,382+i*30));ctx.fillStyle='#68efff';ctx.font='700 13px ui-monospace,monospace';ctx.fillText(action,480,475);ctx.textAlign='left';}
function draw(){ctx.save();if(shake)ctx.translate(rand(-shake,shake),rand(-shake,shake));backdrop();if(board)for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(board[y][x])crystal(board[y][x],x,y);for(const h of hazards)drawHazard(h);if(current&&state==='playing'){const ghost={...current,x:current.x,y:current.y,cells:current.cells};while(valid(ghost,ghost.cells,ghost.x+gravity().dx,ghost.y+gravity().dy)){ghost.x+=gravity().dx;ghost.y+=gravity().dy}drawPiece(ghost,true);drawPiece(current)}for(const p of particles){ctx.globalAlpha=clamp(p.life/.6,0,1);ctx.fillStyle=`hsl(${p.h} 100% 70%)`;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;drawHud();ctx.restore();if(flash){ctx.fillStyle=`rgba(255,244,205,${flash})`;ctx.fillRect(0,0,W,H)}if(state==='menu')panel('THE REACTOR AWAITS A STABLE CAUSALITY','PRISM MASONRY',['Set sixfold reliquaries against shifting aurora gravity.','Phase, null, and polarity hazards rewrite the chamber.'],'PRESS SPACE · IGNITE THE REACTOR');if(state==='lost')panel('REACTOR COHERENCE LOST','THE PRISM UNWEAVES',[`Flux archived: ${flux}`,`Stable strata: ${strata}`],'PRESS SPACE · RESEED THE CHAMBER');}
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}
document.addEventListener('keydown',e=>{if([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();keys.add(e.key);if(e.repeat&&e.key==='ArrowUp')return;if(e.key==='ArrowLeft')transverse(-1);else if(e.key==='ArrowRight')transverse(1);else if(e.key==='ArrowUp')rotate();else if(e.key===' ')hardDrop()});document.addEventListener('keyup',e=>keys.delete(e.key));for(const b of document.querySelectorAll('.key'))b.addEventListener('pointerdown',e=>{e.preventDefault();const a=b.dataset.a;if(a==='left')transverse(-1);else if(a==='right')transverse(1);else if(a==='rotate')rotate();else hardDrop()});
window.__PRISM_MASONRY_DEBUG__={version:'wave11-v01',payload:()=>({state,cols:COLS,rows:ROWS,forms:PRISM_RELIQUARIES.map(f=>({name:f.name,cells:f.cells.length})),hazards:HAZARD_NAMES,gravity:gravity().name,gravityIndex,flux,strata,cycle,stability,locks,current:current&&{name:current.name,x:current.x,y:current.y,rot:current.rot,cells:current.cells.length}}),start:reset,move:transverse,rotate,hardDrop,forceShift:()=>{shiftGravity();current=spawn();return gravity().name},sealBand:()=>{if(!board)reset();if(gravity().dx===0)for(let x=0;x<COLS;x++)board[ROWS-1][x]={h:x*29};else for(let y=0;y<ROWS;y++)board[y][gravity().dx>0?COLS-1:0]={h:y*19};stabilizeBands();}};
board=Array.from({length:ROWS},()=>Array(COLS).fill(null));requestAnimationFrame(frame);
</script></body></html>
