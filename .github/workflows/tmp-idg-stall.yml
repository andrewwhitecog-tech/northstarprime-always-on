name: TMP IDG checks (PR heads, delete branch after)

# Throwaway branch only. Real-play checks of open IDG pull requests in a muted
# headless Chromium: the Blade Tribunal ladder test, and desktop + phone
# captures of PR 206 and PR 223 heads. Nothing here deploys.
on:
  push:
    branches: [claude/tmp-idg-stall-20261109]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: live-bt
            ref: ef6898a4b58658750e8c403771e9fa1af365fd5c
            cmd: python tool/tmp_capture/bt_ladder_test.py --base https://northstarprime.net --out out/live-bt
    steps:
      - uses: actions/checkout@v4
        with: { path: tool, show-progress: false, sparse-checkout: tmp_capture }
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: site
          show-progress: false
          sparse-checkout: |
            arcade
            static/games
            static/art/games
            static/vendor
            static/arcade
            static/idg
            static/curated
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Playwright Chromium and Pillow
        run: |
          pip install playwright==1.58.0 pillow
          python -m playwright install --with-deps chromium
      - name: Serve the PR head (8765)
        run: |
          nohup python tool/tmp_capture/serve.py 8765 site >/dev/null 2>&1 &
          sleep 3
      - name: Run ${{ matrix.name }}
        continue-on-error: true
        run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idg-check-${{ matrix.name }}
          path: out
          retention-days: 5
