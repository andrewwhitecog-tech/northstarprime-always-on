name: NorthStar visitor route checks
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 645bbf5760a5eae0a1cd4312976099c246a4eea6
          sparse-checkout: |
            arcade/custom/northstar-chrono-defender
          persist-credentials: false
      - run: python -m pip -q install playwright beautifulsoup4 pillow pytest requests
      - name: Run real Chrono mechanics and live CDP journeys
        env:
          NSP_PLAYWRIGHT_PATH: ${{ runner.temp }}/chrono/node_modules/playwright
          NSP_PLAYTEST_OUT: ${{ runner.temp }}/chrono-live
        run: |
          node --test arcade/custom/northstar-chrono-defender/tests/controls.test.cjs arcade/custom/northstar-chrono-defender/tests/contact-fairness.test.cjs arcade/custom/northstar-chrono-defender/tests/weapon_atlas.test.cjs
          npm install --prefix "$RUNNER_TEMP/chrono" --no-save --package-lock=false --ignore-scripts playwright@1.55.1
          "$RUNNER_TEMP/chrono/node_modules/.bin/playwright" install chromium
          node arcade/custom/northstar-chrono-defender/tests/live_visual_smoke.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chrono-cdp
          path: ${{ runner.temp }}/chrono-live
          retention-days: 7
      - name: Browser verification
        shell: python
        run: |
          print('Chrono production CDP completed')
