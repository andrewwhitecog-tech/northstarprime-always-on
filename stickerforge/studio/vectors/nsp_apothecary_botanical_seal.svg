<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="brassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <radialGradient id="apothecaryEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="70%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#01140f"/>
    </radialGradient>
    <filter id="apothecaryShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#04080c"/>

  <!-- DIE CUT BASE -->
  <g transform="translate(400, 400)" filter="url(#apothecaryShadow)">
    <circle cx="0" cy="0" r="375" fill="#ffffff"/>
    <circle cx="0" cy="0" r="365" fill="#01140f" stroke="url(#brassGold)" stroke-width="6"/>
    <circle cx="0" cy="0" r="350" fill="url(#apothecaryEmerald)" stroke="url(#brassGold)" stroke-width="2"/>

    <!-- Fine Guilloche Notches -->
    <circle cx="0" cy="0" r="338" fill="none" stroke="url(#brassGold)" stroke-width="3" stroke-dasharray="4,8"/>
    <circle cx="0" cy="0" r="255" fill="none" stroke="url(#brassGold)" stroke-width="2"/>

    <!-- Central Alchemical Mortar & Pestle with Botanical Elements -->
    <g transform="translate(0, 20)">
      <!-- Mortar Bowl -->
      <path d="M -90 40 C -85 110 85 110 90 40 L 105 15 L -105 15 Z" fill="#0f172a" stroke="url(#brassGold)" stroke-width="4"/>
      <ellipse cx="0" cy="15" rx="105" ry="25" fill="#1e293b" stroke="url(#brassGold)" stroke-width="3"/>
      <!-- Glowing Elixir inside mortar -->
      <ellipse cx="0" cy="20" rx="90" ry="18" fill="#10b981" opacity="0.6"/>

      <!-- Pestle Tool resting at angle -->
      <rect x="-15" y="-110" width="30" height="130" rx="12" fill="#78350f" stroke="url(#brassGold)" stroke-width="3" transform="rotate(28)"/>
      <ellipse cx="38" cy="22" rx="18" ry="12" fill="url(#brassGold)" transform="rotate(28)"/>

      <!-- Symmetrical Botanical Elements rising from mortar -->
      <g fill="#34d399" stroke="#065f46" stroke-width="1.5">
        <path d="M 0 -20 C -12 -50 -8 -120 0 -140 C 8 -120 12 -50 0 -20 Z"/>
        <path d="M 0 -15 C -25 -35 -50 -85 -55 -110 C -45 -105 -20 -70 0 -15 Z"/>
        <path d="M 0 -15 C 25 -35 50 -85 55 -110 C 45 -105 20 -70 0 -15 Z"/>
        <path d="M 0 -5 C -30 -15 -65 -45 -75 -65 C -60 -60 -25 -35 0 -5 Z"/>
        <path d="M 0 -5 C 30 -15 65 -45 75 -65 C 60 -60 25 -35 0 -5 Z"/>
      </g>

      <!-- Twin Cones flanking the bowl -->
      <g fill="#92400e" stroke="url(#brassGold)" stroke-width="1">
        <ellipse cx="-130" cy="35" rx="20" ry="32" transform="rotate(-20 -130 35)"/>
        <ellipse cx="130" cy="35" rx="20" ry="32" transform="rotate(20 130 35)"/>
      </g>
    </g>

    <!-- TOP & BOTTOM CURVED TEXT PATHS -->
    <path id="apothTopArc" d="M -255 0 A 255 255 0 1 1 255 0" fill="none"/>
    <text font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="22" fill="url(#brassGold)" letter-spacing="5" text-anchor="middle">
      <textPath href="#apothTopArc" startOffset="50%">NORTHSTAR BOTANICAL APOTHECARY</textPath>
    </text>

    <path id="apothBottomArc" d="M 255 0 A 255 255 0 0 1 -255 0" fill="none"/>
    <text font-family="'Cinzel', Georgia, serif" font-weight="800" font-size="16" fill="url(#brassGold)" letter-spacing="4" text-anchor="middle">
      <textPath href="#apothBottomArc" startOffset="50%">SOLARIUM HERMETIC ARTS • EST. 2026</textPath>
    </text>

    <!-- Star Badges on Left and Right -->
    <g transform="translate(-290, 0)">
      <polygon points="0,-12 3,-4 11,-4 5,2 7,10 0,5 -7,10 -5,2 -11,-4 -3,-4" fill="url(#brassGold)"/>
    </g>
    <g transform="translate(290, 0)">
      <polygon points="0,-12 3,-4 11,-4 5,2 7,10 0,5 -7,10 -5,2 -11,-4 -3,-4" fill="url(#brassGold)"/>
    </g>
  </g>
</svg>
