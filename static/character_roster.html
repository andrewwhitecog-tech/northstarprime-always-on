<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NorthStar Arcade — Character Roster</title>
<style>
  :root{--gold:#e9c86a;--paper:#f3ecd8;--dim:#a49db4;--line:rgba(233,200,106,.22)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(circle at 50% -10%,#1a0f2e,#07040d 60%) fixed,#07040d;color:var(--paper);
    font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh;padding:0 0 80px}
  header{text-align:center;padding:54px 20px 30px;position:relative}
  .kicker{letter-spacing:6px;font-size:12px;color:var(--gold);text-transform:uppercase;font-weight:700}
  h1{font-size:clamp(36px,7vw,74px);letter-spacing:2px;margin:10px 0 6px;font-weight:900;
    background:linear-gradient(90deg,#ff2d55,#e9c86a,#8fe388,#7fd7ff,#c9a0ff,#ff2d55);background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 7s linear infinite}
  @keyframes sh{to{background-position:300% 0}}
  header p{color:var(--dim);font-size:15px;max-width:640px;margin:0 auto}
  #count{color:var(--gold);font-weight:800}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;max-width:1400px;margin:20px auto 0;padding:0 24px}
  .card{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;
    background:linear-gradient(180deg,#120a20,#07040d);aspect-ratio:3/4;display:flex;flex-direction:column;
    transition:.18s;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .card:hover{transform:translateY(-6px);border-color:#7fd7ff;box-shadow:0 0 32px rgba(127,215,255,.22)}
  .card .imgwrap{flex:1;position:relative;overflow:hidden;background:#05030a}
  .card img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 0 14px rgba(127,215,255,.14))}
  .card .meta{padding:12px 14px 14px;border-top:1px solid var(--line);background:rgba(7,4,13,.85)}
  .card .name{font-size:17px;font-weight:800;letter-spacing:.4px}
  .card .game{font-size:12px;color:#7fd7ff;letter-spacing:1px;text-transform:uppercase;margin-top:3px}
  .card::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 30%,transparent 55%,rgba(0,0,0,.55));z-index:1}
  .card .imgwrap, .card .meta{position:relative;z-index:2}
  footer{text-align:center;color:var(--dim);font-size:12px;margin-top:44px;letter-spacing:1px}
  .err{text-align:center;color:#ff6b8a;padding:40px}
  .section-title{max-width:1400px;margin:44px auto 4px;padding:0 26px;font-size:13px;letter-spacing:4px;
    text-transform:uppercase;color:var(--gold);font-weight:800;display:flex;align-items:center;gap:14px}
  .section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(233,200,106,.4),transparent)}
  .section-title .n{color:#7fd7ff;font-weight:600}
  .card .type{position:absolute;top:8px;right:8px;z-index:3;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
    padding:3px 7px;border-radius:20px;background:rgba(7,4,13,.8);border:1px solid var(--line);color:var(--dim)}
</style>
</head>
<body>
<header>
  <div class="kicker">NorthStar Prime · Interdimensional Gaming</div>
  <h1>Character Roster</h1>
  <p>The cast of the NorthStar Arcade — <span id="count">…</span> original AI-generated champions, shadows, and oracles across the games.</p>
</header>
<div class="grid" id="grid"></div>
<footer>All characters are original NSP AI-generated art · VORATH aesthetic</footer>
<script>
(async () => {
  const grid = document.getElementById("grid");
  try {
    const res = await fetch("/static/games/roster/roster.json", {cache:"no-store"});
    const roster = await res.json();
    document.getElementById("count").textContent = roster.length;
    const SECTIONS = [
      ["character","Champions & Characters"],
      ["enemy","Enemies · Monsters · Aliens"],
      ["vehicle","Vehicles · Ships · Drones"],
      ["item","Items · Weapons · Relics"],
      ["environment","Environments · Realms"],
    ];
    for (const [type, label] of SECTIONS){
      const items = roster.filter(c => (c.type||"character") === type);
      if (!items.length) continue;
      const h = document.createElement("div"); h.className = "section-title";
      h.innerHTML = label + ' <span class="n">' + items.length + '</span>';
      grid.parentNode.insertBefore(h, grid.nextSibling ? null : null); // appended in order below
      document.body.insertBefore(h, document.querySelector("footer"));
      const g = document.createElement("div"); g.className = "grid";
      for (const c of items){
        const card = document.createElement("div"); card.className = "card";
        card.innerHTML = `<div class="type">${c.type||"character"}</div>`
          + `<div class="imgwrap"><img src="${c.img}" alt="${c.name}"></div>`
          + `<div class="meta"><div class="name">${c.name}</div><div class="game">${c.game}</div></div>`;
        g.appendChild(card);
      }
      document.body.insertBefore(g, document.querySelector("footer"));
    }
    grid.remove(); // remove the original empty grid
  } catch(e){
    grid.innerHTML = '<div class="err">Could not load roster.json — '+e.message+'</div>';
  }
})();
</script>
</body>
</html>
