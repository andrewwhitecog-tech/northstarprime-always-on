<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
  <defs>
    <!-- Aged Newsprint Texture Gradient -->
    <linearGradient id="agedParchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf8e2"/>
      <stop offset="50%" stop-color="#f7eed0"/>
      <stop offset="100%" stop-color="#eee2be"/>
    </linearGradient>
    <linearGradient id="agedInk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <filter id="woodcutShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#78350f" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Vintage Parchment Paper -->
  <rect width="1200" height="1600" fill="url(#agedParchment)"/>

  <!-- Ornate Victorian Triple Border with Corner Rosettes -->
  <rect x="40" y="40" width="1120" height="1520" fill="none" stroke="#292524" stroke-width="8"/>
  <rect x="56" y="56" width="1088" height="1488" fill="none" stroke="#78350f" stroke-width="2"/>
  <rect x="66" y="66" width="1068" height="1468" fill="none" stroke="#292524" stroke-width="4"/>

  <!-- Corner Filigree Ornaments -->
  <g fill="#292524">
    <!-- Top Left -->
    <polygon points="66,66 120,66 66,120"/>
    <!-- Top Right -->
    <polygon points="1134,66 1080,66 1134,120"/>
    <!-- Bottom Left -->
    <polygon points="66,1534 120,1534 66,1480"/>
    <!-- Bottom Right -->
    <polygon points="1134,1534 1080,1534 1134,1480"/>
  </g>

  <!-- MASTHEAD HEADER -->
  <g text-anchor="middle" fill="#292524">
    <text x="600" y="130" font-family="'Cinzel', Georgia, serif" font-size="20" letter-spacing="8" font-weight="bold">ESTABLISHED IN THE OREGON TERRITORY • 1888</text>
    <line x1="120" y1="150" x2="1080" y2="150" stroke="#292524" stroke-width="2"/>
    <line x1="120" y1="156" x2="1080" y2="156" stroke="#292524" stroke-width="1"/>

    <!-- GRAND HEADLINE -->
    <text x="600" y="230" font-family="'Cinzel Decorative', 'Playfair Display', Georgia, serif" font-size="52" font-weight="900" letter-spacing="4">DR. VORATH&apos;S</text>
    <text x="600" y="295" font-family="'Cinzel Decorative', 'Playfair Display', Georgia, serif" font-size="44" font-weight="bold" fill="#78350f" letter-spacing="3">CELEBRATED TERPENE TONIC</text>
    <text x="600" y="340" font-family="'Cinzel', Georgia, serif" font-size="24" font-weight="600" letter-spacing="6">&amp; ASTRAL NERVINE ELIXIR</text>

    <line x1="200" y1="365" x2="1000" y2="365" stroke="#78350f" stroke-width="3"/>
  </g>

  <!-- CENTER SPLIT: ENGRAVED BOTTLE (LEFT) + THERAPEUTIC CLAIMS (RIGHT) -->
  <g transform="translate(100, 390)">
    <!-- LEFT: Engraved Woodcut Bottle Illustration -->
    <g transform="translate(120, 40)" filter="url(#woodcutShadow)">
      <!-- Amber Glass Bottle Body -->
      <path d="M 60 140 L 60 60 C 60 30 85 20 85 0 L 135 0 C 135 20 160 30 160 60 L 160 140 C 200 170 220 220 220 290 L 220 540 C 220 570 195 590 165 590 L 55 590 C 25 590 0 570 0 540 L 0 290 C 0 220 20 170 60 140 Z" fill="#92400e" stroke="#292524" stroke-width="6"/>
      <!-- Bottle Cork -->
      <rect x="85" y="-35" width="50" height="35" fill="#78350f" stroke="#292524" stroke-width="3"/>

      <!-- Embossed Bottle Label -->
      <rect x="25" y="240" width="170" height="280" fill="#fdf8e2" stroke="#292524" stroke-width="3"/>
      <rect x="33" y="248" width="154" height="264" fill="none" stroke="#78350f" stroke-width="1.5" stroke-dasharray="4,4"/>

      <!-- Label Inscription -->
      <text x="110" y="280" font-family="'Cinzel', serif" font-size="14" font-weight="bold" fill="#292524" text-anchor="middle">SOLVENTLESS</text>
      <text x="110" y="300" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#78350f" text-anchor="middle">LIVE ROSIN</text>
      <!-- Engraved Leaf on Bottle -->
      <circle cx="110" cy="350" r="30" fill="none" stroke="#292524" stroke-width="2"/>
      <path d="M 110 325 C 95 340 100 360 110 375 C 120 360 125 340 110 325 Z" fill="#15803d"/>
      <text x="110" y="415" font-family="'Cinzel', serif" font-size="13" font-weight="bold" fill="#292524" text-anchor="middle">31.2% THC</text>
      <text x="110" y="435" font-family="'Cinzel', serif" font-size="10" fill="#292524" text-anchor="middle">4.82% TERPS</text>
      <text x="110" y="475" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#78350f" text-anchor="middle">10015 SW HALL</text>
    </g>

    <!-- RIGHT: Newspaper Column of Medical & Spiritual Benefits -->
    <g transform="translate(420, 20)">
      <text x="0" y="40" font-family="'Cinzel', Georgia, serif" font-size="22" font-weight="bold" fill="#78350f" letter-spacing="2">A SOVEREIGN SPECIFIC FOR:</text>

      <!-- Bulleted Malady List -->
      <g font-family="Georgia, serif" font-size="18" fill="#292524">
        <text x="0" y="85">✦  Existential Dread &amp; Cosmic Over-Contemplation</text>
        <text x="0" y="125">✦  Sluggish Bile, Spleen-Fog &amp; Portland Drizzle Ennui</text>
        <text x="0" y="165">✦  Failure to Ascend the 5th Astral Octave</text>
        <text x="0" y="205">✦  Deficiency of β-Caryophyllene &amp; Limonene</text>
        <text x="0" y="245">✦  Lethargy Resulting from Uninspired Dispensaries</text>
        <text x="0" y="285">✦  Temporal Friction While Traversing Highway 217</text>
      </g>

      <line x1="0" y1="320" x2="520" y2="320" stroke="#78350f" stroke-width="2"/>

      <!-- Historical Testimonial Block -->
      <rect x="0" y="340" width="540" height="220" fill="#f5ecd2" stroke="#292524" stroke-width="2"/>
      <text x="20" y="375" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="15" fill="#292524">
        &quot;Three spoonfuls of Dr. Vorath&apos;s Solventless Nectar
      </text>
      <text x="20" y="400" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="15" fill="#292524">
        completely eradicated my melancholic disposition.
      </text>
      <text x="20" y="425" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="15" fill="#292524">
        My astral double has never felt more robust!&quot;
      </text>
      <text x="20" y="465" font-family="'Cinzel', serif" font-size="14" font-weight="bold" fill="#78350f">
        — The Hon. Castor &quot;Blaze&quot; Fiber, Willamette Valley
      </text>
      <text x="20" y="525" font-family="'Courier New', monospace" font-size="12" fill="#57534e">
        PRICE: 2 Bits or 1 Troy Ounce Clean Trim
      </text>
    </g>
  </g>

  <!-- WARNING & DIRECTIONS LOWER PANEL -->
  <g transform="translate(100, 1070)">
    <rect x="0" y="0" width="1000" height="200" fill="#f5ecd2" stroke="#292524" stroke-width="3"/>
    <text x="500" y="45" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="bold" fill="#78350f" text-anchor="middle" letter-spacing="4">DIRECTIONS FOR ADMINISTRATION:</text>
    <text x="500" y="85" font-family="Georgia, serif" font-size="17" fill="#292524" text-anchor="middle">
      Vaporize at precisely 480° Fahrenheit on clean quartz crystal, or place two drops beneath tongue.
    </text>
    <text x="500" y="115" font-family="Georgia, serif" font-size="17" fill="#292524" text-anchor="middle">
      Do not attempt to operate steam locomotives, horse carriages, or ungrounded interdimensional gateways.
    </text>
    <text x="500" y="155" font-family="'Cinzel', Georgia, serif" font-size="14" font-style="italic" fill="#78350f" text-anchor="middle">
      Compounded Exclusively at The Twilight Solarium Laboratory • 10015 SW Hall Blvd, Tigard, OR
    </text>
  </g>

  <!-- PUNCHLINE FOOTER BANNER -->
  <g transform="translate(100, 1310)">
    <rect x="0" y="0" width="1000" height="150" fill="#292524"/>
    <text x="500" y="60" font-family="'Cinzel Decorative', 'Playfair Display', Georgia, serif" font-size="28" font-weight="bold" fill="#fdf8e2" text-anchor="middle" letter-spacing="4">
      WHEN YOUR GRANDFATHER&apos;S REMEDY
    </text>
    <text x="500" y="105" font-family="'Cinzel Decorative', 'Playfair Display', Georgia, serif" font-size="24" font-weight="bold" fill="#f59e0b" text-anchor="middle" letter-spacing="3">
      WAS JUST UNREGULATED 90u HASH ROSIN
    </text>
  </g>

  <!-- Bottom Coordinates -->
  <text x="600" y="1500" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle" letter-spacing="3">
    ARCHIVAL FOLIO M-16 • CDC APOTHECARY HISTORICAL ARCHIVES • OREGON DIVISION
  </text>
</svg>