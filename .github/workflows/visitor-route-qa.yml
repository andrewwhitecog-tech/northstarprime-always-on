name: NorthStar visitor route checks
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 633b98f5c79960a6e28a6b44db1162a943ae0f57
          sparse-checkout: |
            music
            realm
            .github/hq_audio_review
            static/games
            games
            brick-alchemy
            rich-yn
            unc-v
            hire
            arcade
            store
            play
            links
            merch
            chromatic
            stickerforge
            parody-drop
            community
            idc-programming
            tools
            tests
            static/front
            static/cards
            warband/art
          persist-credentials: false
      - run: python -m pip -q install playwright beautifulsoup4 pillow pytest requests
      - name: Run existing store and link assertions
        run: python -m pytest -q tests/test_alwayson_store_links_nov22_flagships_20261122.py -k 'not overflow and not forced_colors'
      - name: Browser verification
        shell: python
        run: |
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from bs4 import BeautifulSoup
          import requests
          url='https://northstarprime.net/store/'
          with sync_playwright() as p:
              b=p.chromium.launch(executable_path='/usr/bin/google-chrome',args=['--disable-gpu'])
              for w in (390,1280):
                  page=b.new_page(viewport={'width':w,'height':844})
                  page.route(url,lambda r:r.fulfill(content_type='text/html',body=Path('store/index.html').read_bytes()))
                  page.goto(url,wait_until='domcontentloaded')
                  link=page.get_by_role('navigation',name='Store links').get_by_role('link',name='Arcade',exact=True)
                  link.scroll_into_view_if_needed()
                  pos=link.bounding_box()
                  assert link.is_visible() and 0<=pos['x']<=w-pos['width']+1
                  with page.expect_navigation(wait_until='domcontentloaded') as nav: link.click()
                  assert nav.value.status==200 and page.url=='https://northstarprime.net/arcade/'
                  print('ARCADE',w,nav.value.status,page.title(),flush=True)
                  page.close()
              b.close()
