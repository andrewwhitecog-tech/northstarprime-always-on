<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
  <defs>
    <!-- Phosphor CRT Screen Glow -->
    <radialGradient id="crtScreenGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="60%" stop-color="#021a0d"/>
      <stop offset="100%" stop-color="#010a04"/>
    </radialGradient>
    <filter id="phosphorBleed" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#22c55e" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- CRT Monitor Bezel (Vintage Beige Plastic Frame) -->
  <rect width="1200" height="1600" fill="#2d2b28"/>
  <!-- Bezel Shadow & Inset -->
  <rect x="40" y="40" width="1120" height="1520" rx="30" fill="#1c1917" stroke="#44403c" stroke-width="12"/>

  <!-- Curved Phosphor CRT Screen Glass -->
  <rect x="80" y="80" width="1040" height="1440" rx="20" fill="url(#crtScreenGlow)" stroke="#15803d" stroke-width="4"/>

  <!-- CRT Scanlines (Simulated with repeating lines) -->
  <g opacity="0.12" stroke="#4ade80" stroke-width="1">
    <line x1="80" y1="120" x2="1120" y2="120"/><line x1="80" y1="160" x2="1120" y2="160"/>
    <line x1="80" y1="200" x2="1120" y2="200"/><line x1="80" y1="240" x2="1120" y2="240"/>
    <line x1="80" y1="280" x2="1120" y2="280"/><line x1="80" y1="320" x2="1120" y2="320"/>
    <line x1="80" y1="360" x2="1120" y2="360"/><line x1="80" y1="400" x2="1120" y2="400"/>
    <line x1="80" y1="440" x2="1120" y2="440"/><line x1="80" y1="480" x2="1120" y2="480"/>
    <line x1="80" y1="520" x2="1120" y2="520"/><line x1="80" y1="560" x2="1120" y2="560"/>
    <line x1="80" y1="600" x2="1120" y2="600"/><line x1="80" y1="640" x2="1120" y2="640"/>
    <line x1="80" y1="680" x2="1120" y2="680"/><line x1="80" y1="720" x2="1120" y2="720"/>
    <line x1="80" y1="760" x2="1120" y2="760"/><line x1="80" y1="800" x2="1120" y2="800"/>
    <line x1="80" y1="840" x2="1120" y2="840"/><line x1="80" y1="880" x2="1120" y2="880"/>
    <line x1="80" y1="920" x2="1120" y2="920"/><line x1="80" y1="960" x2="1120" y2="960"/>
    <line x1="80" y1="1000" x2="1120" y2="1000"/><line x1="80" y1="1040" x2="1120" y2="1040"/>
    <line x1="80" y1="1080" x2="1120" y2="1080"/><line x1="80" y1="1120" x2="1120" y2="1120"/>
    <line x1="80" y1="1160" x2="1120" y2="1160"/><line x1="80" y1="1200" x2="1120" y2="1200"/>
    <line x1="80" y1="1240" x2="1120" y2="1240"/><line x1="80" y1="1280" x2="1120" y2="1280"/>
    <line x1="80" y1="1320" x2="1120" y2="1320"/><line x1="80" y1="1360" x2="1120" y2="1360"/>
    <line x1="80" y1="1400" x2="1120" y2="1400"/><line x1="80" y1="1440" x2="1120" y2="1440"/>
  </g>

  <!-- SCREEN TERMINAL CONTENT (Green Phosphor Text & 8-Bit Pixel Art) -->
  <g font-family="'Courier New', monospace" fill="#4ade80" filter="url(#phosphorBleed)">
    <!-- Header -->
    <text x="600" y="160" font-size="28" font-weight="bold" text-anchor="middle" letter-spacing="4">THE OREGON TRAIL: DISPENSARY EXPEDITION</text>
    <text x="600" y="195" font-size="18" text-anchor="middle" fill="#22c55e">APPLE II GREEN PHOSPHOR EMULATION • 1848 / 2026</text>
    <line x1="120" y1="220" x2="1080" y2="220" stroke="#22c55e" stroke-width="3"/>

    <!-- 8-Bit Pixelated Covered Wagon Approaching Solarium -->
    <g transform="translate(360, 260)">
      <!-- Pixel Oxen (Left) -->
      <rect x="0" y="60" width="80" height="40" fill="#4ade80"/>
      <rect x="15" y="100" width="10" height="30" fill="#4ade80"/>
      <rect x="55" y="100" width="10" height="30" fill="#4ade80"/>
      <rect x="70" y="45" width="25" height="25" fill="#4ade80"/>
      <!-- Oxen Horns -->
      <rect x="85" y="30" width="10" height="15" fill="#4ade80"/>

      <!-- Hitching Pole -->
      <line x1="80" y1="80" x2="150" y2="80" stroke="#4ade80" stroke-width="4"/>

      <!-- Covered Wagon Body -->
      <rect x="150" y="50" width="160" height="50" fill="#15803d"/>
      <!-- Canvas Hood -->
      <path d="M 140 50 C 140 -20 320 -20 320 50 Z" fill="#4ade80"/>
      <!-- Wagon Wheels -->
      <circle cx="180" cy="115" r="25" fill="none" stroke="#4ade80" stroke-width="6"/>
      <circle cx="290" cy="115" r="25" fill="none" stroke="#4ade80" stroke-width="6"/>
      <!-- Giant Dab Rig Mounted on Wagon -->
      <path d="M 230 40 L 230 -10 L 250 -10 L 250 10 L 270 10" fill="none" stroke="#86efac" stroke-width="4"/>
      <circle cx="270" cy="10" r="8" fill="#86efac"/>
    </g>

    <!-- Expedition Telemetry Dashboard -->
    <g transform="translate(140, 460)" font-size="20">
      <text x="0" y="30">DATE: October 14, 1848</text>
      <text x="500" y="30">LOCATION: Cascadia Solarium Corridor</text>

      <text x="0" y="70">WEATHER: Classic Cascadia Drizzle</text>
      <text x="500" y="70">HEALTH: Elevated (31.2% THC)</text>

      <text x="0" y="110">PACE: Cosmic Gliding</text>
      <text x="500" y="110">TERPENES: 4.82% β-Myrcene</text>

      <text x="0" y="150">RATIONS: 12 Artisanal Beaver Blunts</text>
      <text x="500" y="150">CARGO: 100g Single-Source Cold Cure</text>
    </g>

    <line x1="120" y1="660" x2="1080" y2="660" stroke="#22c55e" stroke-width="2"/>

    <!-- River Crossing Prompt Encounter -->
    <g transform="translate(140, 710)" font-size="22">
      <text x="0" y="30" font-weight="bold" fill="#86efac">You have reached the Willamette River Crossing at Cascadia Solarium Corridor.</text>
      <text x="0" y="65">The water is 6.2 feet deep. The current is turbulent.</text>
      <text x="0" y="100">You must choose an action to reach The Twilight Solarium:</text>

      <!-- Numbered Options -->
      <g transform="translate(40, 160)" font-size="20" fill="#4ade80">
        <text x="0" y="0">1. Attempt to ford the river with the wagon.</text>
        <text x="0" y="45">2. Caulk the wagon and float it across.</text>
        <text x="0" y="90">3. Wait for the TriMet MAX Light Rail interdimensional ferry.</text>
        <text x="0" y="135" fill="#86efac" font-weight="bold">4. Take a low-temp solventless dab and levitate across.</text>
      </g>

      <text x="0" y="360" font-weight="bold">What is your choice? [ 4 ]</text>
    </g>

    <!-- RESULT DIALOG BOX -->
    <g transform="translate(140, 1140)">
      <rect x="0" y="0" width="920" height="230" fill="#021a0d" stroke="#4ade80" stroke-width="4"/>
      <text x="30" y="45" font-size="20" font-weight="bold" fill="#86efac">EXPEDITION RESULT:</text>
      <text x="30" y="85" font-size="19">You inhaled 90u Void Kush live rosin vapor at precisely 480°F.</text>
      <text x="30" y="120" font-size="19">Your wagon ascended into the 5th dimension above Highway 217.</text>
      <text x="30" y="155" font-size="19">The oxen experienced ego death, but arrived safely at Cascadia Solarium Corridor.</text>
      <text x="30" y="195" font-size="18" fill="#86efac" font-weight="bold">★ ALL SOLVENTLESS ROSIN ARRIVED IN PRISTINE COLD-CURE CONDITION! ★</text>
    </g>

    <!-- Bottom Blinking Cursor -->
    <text x="600" y="1450" font-size="18" text-anchor="middle" fill="#86efac">
      PRESS [SPACEBAR] TO ENTER THE TWILIGHT SOLARIUM _
    </text>
  </g>
</svg>