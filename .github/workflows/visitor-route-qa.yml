name: NorthStar visitor route checks
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 199755ed277ff6bccd06c550b50a553ba0ab0df3
          sparse-checkout: |
            music
            realm
            .github/hq_audio_review
            static/games
            store
            play
            links
            merch
            chromatic
            stickerforge
            parody-drop
            community
            idc-programming
            tools
            tests
            static/front
            static/cards
            warband/art
          persist-credentials: false
      - run: python -m pip -q install playwright beautifulsoup4 pillow pytest requests

      - name: Browser verification
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import urlsplit,parse_qs
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright
          import json,requests
          preview=True
          origin='https://northstarprime.net'
          store=origin+'/merch/'
          dest='/3d-prints/#wb-reveler-75'
          if preview: html=Path('merch/index.html').read_text(encoding='utf-8')
          else:
              res=requests.get(store,timeout=20)
              res.raise_for_status()
              html=res.text
          doc=BeautifulSoup(html,'html.parser')
          spec=BeautifulSoup(requests.get(origin+'/3d-prints/',timeout=20).content,'html.parser')
          cards=doc.select('article[data-item]')
          lookbook=[a for card in cards for a in card.select('a[href^="/3d-prints/#"]')]
          assert len(lookbook)==6
          for a in lookbook: assert spec.find(id=urlsplit(a['href']).fragment) is not None,a['href']
          assert dest in json.dumps(json.loads(doc.select_one('script[type="application/ld+json"]').string))
          with sync_playwright() as p:
              b=p.chromium.launch(executable_path='/usr/bin/google-chrome',args=['--disable-gpu'])
              for width,modal in [(390,True),(1280,False)]:
                  page=b.new_page(viewport={'width':width,'height':840},reduced_motion='reduce')
                  if preview: page.route(store,lambda r:r.fulfill(content_type='text/html',body=html))
                  page.goto(store,wait_until='domcontentloaded')
                  card=page.locator('[id="3dp-warband-reveler"]')
                  if modal:
                      card.locator('.zoom-trigger').click()
                      link=page.locator('#lb-cta1')
                  else: link=card.locator('a[href^="/3d-prints/#"]')
                  assert link.get_attribute('href')==dest
                  link.click()
                  page.wait_for_url(origin+dest)
                  model=page.locator(':target')
                  assert model.count()==1 and model.is_visible()
                  assert 'Vorath Reveler' in model.inner_text()
                  assert model.evaluate("e=>e.getBoundingClientRect().top < innerHeight && e.getBoundingClientRect().bottom>0")
                  quote=model.locator('a[href^="/contact/?"]')
                  query=parse_qs(urlsplit(quote.get_attribute('href')).query)
                  assert 'WB-MINI-01' in query['subject'][0]
                  quote.click()
                  page.wait_for_function("() => document.querySelector('#subject-preview')?.textContent?.includes('WB-MINI-01')")
                  draft=urlsplit(page.locator('#draft-link').get_attribute('href'))
                  assert draft.scheme=='mailto' and draft.path=='contact@northstarprime.net'
                  assert 'WB-MINI-01' in parse_qs(draft.query)['subject'][0]
                  print('REVELER',width,'modal' if modal else 'card','model specs to populated quote passed',flush=True)
                  page.close()
              b.close()
