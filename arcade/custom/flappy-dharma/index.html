// living background: seedance motion plate (portrait), falls back to procedural sky
const PLATE_MOTION_SRC='/static/games/imagegen_quality_pass_20260625/sky_dragon_dharma_plate_motion.mp4';
const platePrefersStill=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const motionPlate=document.createElement('video');
let motionPlateReady=false;
if(!platePrefersStill){
  motionPlate.muted=true;motionPlate.loop=true;motionPlate.playsInline=true;motionPlate.preload='auto';
  motionPlate.src=PLATE_MOTION_SRC;
  const startMotionPlate=()=>{if(motionPlateReady)return;motionPlate.play().then(()=>{motionPlateReady=true;}).catch(()=>{});};
  motionPlate.addEventListener('canplaythrough',startMotionPlate,{once:true});
  motionPlate.addEventListener('error',()=>{motionPlateReady=false;});
  window.addEventListener('keydown',startMotionPlate,{once:true});
  window.addEventListener('pointerdown',startMotionPlate,{once:true});
}
function drawMotionPlate(){
  if(!(motionPlateReady&&motionPlate.readyState>=2&&!motionPlate.paused))return;
  const vw=motionPlate.videoWidth,vh=motionPlate.videoHeight;
  if(!vw||!vh)return;
  const scale=Math.max(W/vw,H/vh),dw=vw*scale,dh=vh*scale;
  ctx.save();ctx.globalAlpha=0.85;
  ctx.drawImage(motionPlate,(W-dw)/2,(H-dh)/2,dw,dh);
  ctx.globalAlpha=1;
  const veil=ctx.createLinearGradient(0,0,0,H);
  veil.addColorStop(0,'rgba(6,6,15,0.42)');
  veil.addColorStop(0.3,'rgba(6,6,15,0.10)');
  veil.addColorStop(0.7,'rgba(6,6,15,0.10)');
  veil.addColorStop(1,'rgba(6,6,15,0.38)');
  ctx.fillStyle=veil;ctx.fillRect(0,0,W,H);
  ctx.restore();
}

// sampled SFX layer (ElevenLabs dharma set) — procedural tones remain the fallback
const SFX_CUES={};
['flap','boost','flame','collect','split','medal','fail'].forEach(name=>{
  const clip=new Audio('/static/games/sfx/dharma_'+name+'.mp3');
  clip.preload='auto';SFX_CUES[name]=clip;
});
function playSfxSample(name,volume=0.4){
  const base=SFX_CUES[name];
  if(!base||base.readyState<2)return false;
  const inst=base.cloneNode();inst.volume=volume;
  const attempt=inst.play();if(attempt&&attempt.catch)attempt.catch(()=>{});
  return true;
}

flapDragonImg.onload=()=>{flapDragonReady=true;};flapDragonImg.onerror=()=>{flapDragonReady=false;};
flapDragonImg.src='/static/games/roster/flap_dragon.png';

flapBgImg.onload=()=>{flapBgReady=true;};flapBgImg.onerror=()=>{flapBgReady=false;};

// Shared chiptune layer — additive over the existing sampled/procedural cues; never throws

function chip(fn){try{if(window.Chiptune&&Chiptune.SFX&&Chiptune.SFX[fn])Chiptune.SFX[fn]();}catch(e){}}
function chipResume(){try{if(window.Chiptune&&Chiptune.resume)Chiptune.resume();}catch(e){}}
function startChiptuneMusic(){
  try{

  }catch(e){}
}
function stopChiptuneMusic(){try{if(chiptuneMusic&&chiptuneMusic.stop)chiptuneMusic.stop();}catch(e){}chiptuneStarted=false;chiptuneMusic=null;}

// juice: short DOM screen-shake, self-decaying (independent of game loop)
let _shakeMag=0,_shakeRAF=0;
function triggerScreenShake(mag=6){
  _shakeMag=Math.min(16,Math.max(_shakeMag,mag));
  if(_shakeRAF)return;
  const step=()=>{
    if(_shakeMag<=0.4){canvas.style.transform='';_shakeRAF=0;return;}
    const dx=(Math.random()*2-1)*_shakeMag,dy=(Math.random()*2-1)*_shakeMag;
    canvas.style.transform='translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px)';
    _shakeMag*=0.86;
    _shakeRAF=requestAnimationFrame(step);
  };
  _shakeRAF=requestAnimationFrame(step);
}

const IS_PLAYTEST=new URLSearchParams(location.search).has('playtest');

for(let i=0;i<120;i++)bgStars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.5,b:Math.random()*Math.PI*2});

const SPEEDWAY_TARGETS={rings:8,gates:8,crystals:8,drones:8};

const PORTAL_WAKE_MAX=180;

const SPEEDWAY_SECTORS={

function currentRouteTier(){
  let tier=ROUTE_TIERS[0];
  for(const candidate of ROUTE_TIERS)if(score>=candidate.score)tier=candidate;
  return tier;
}

function routeTierProgress(){
  const tier=currentRouteTier();
  const next=ROUTE_TIERS[ROUTE_TIERS.indexOf(tier)+1]||null;
  return {tier,next,remaining:next?Math.max(0,next.score-score):0};
}

function setAnnouncer(text,color='#0ff'){
  announcer={text,color,ttl:120};
}

function ensureAudio(){
  if(!audioEnabled)return null;
  const AudioClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioClass)return null;
  if(!audioCtx)audioCtx=new AudioClass();
  if(audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}

function playTone(freq=440,duration=0.08,type='sine',gain=0.045,delay=0){
  const ctx=ensureAudio();
  if(!ctx)return false;
  const osc=ctx.createOscillator(),amp=ctx.createGain();
  const start=ctx.currentTime+delay;
  osc.type=type;osc.frequency.setValueAtTime(freq,start);
  amp.gain.setValueAtTime(0.0001,start);
  amp.gain.exponentialRampToValueAtTime(gain,start+0.012);
  amp.gain.exponentialRampToValueAtTime(0.0001,start+duration);
  osc.connect(amp);amp.connect(ctx.destination);osc.start(start);osc.stop(start+duration+0.025);audioEvents++;return true;
}

function playCue(name){
  if(audioEnabled&&CHIP_CUE_MAP[name])chip(CHIP_CUE_MAP[name]);
  if(playSfxSample(name,name==='flap'?0.3:0.45)){audioEvents++;return true;}
  if(name==='flap')return playTone(520,0.05,'triangle',0.025);
  if(name==='boost'){playTone(220,0.12,'sawtooth',0.035);return playTone(660,0.08,'triangle',0.028,0.035);}
  if(name==='flame'){playTone(120,0.11,'sawtooth',0.045);return playTone(480,0.06,'square',0.025,0.025);}
  if(name==='collect'){playTone(740,0.07,'triangle',0.026);return playTone(980,0.06,'triangle',0.02,0.045);}
  if(name==='split'){playTone(660,0.08,'sine',0.026);playTone(880,0.08,'sine',0.024,0.055);return playTone(1180,0.1,'sine',0.022,0.11);}
  if(name==='medal'){playTone(523,0.1,'triangle',0.03);playTone(659,0.1,'triangle',0.03,0.08);return playTone(784,0.16,'triangle',0.035,0.16);}
  if(name==='fail')return playTone(150,0.18,'sawtooth',0.035);
  return false;
}

}

function triggerSpeedFx(power=20,color='#0ff',count=6){
  speedFxLevel=Math.min(100,(speedFxLevel||0)+power);
  cameraShake=Math.min(9,(cameraShake||0)+power/14);
  for(let i=0;i<count;i++)speedStreaks.push({x:W+Math.random()*80,y:Math.random()*H,len:55+Math.random()*95,v:8+power*0.12+Math.random()*6,life:0.45+Math.random()*0.5,color});
  saveBestSpeedFxLevel();
}

function updateSpeedFx(){
  speedFxLevel=Math.max(0,(speedFxLevel||0)-1.6);
  cameraShake=Math.max(0,(cameraShake||0)*0.86-0.05);
  speedStreaks=(speedStreaks||[]).map(streak=>({...streak,x:streak.x-streak.v,life:streak.life-0.045})).filter(streak=>streak.life>0&&streak.x>-streak.len-80);
}

function drawSpeedFx(){
  if(!(speedStreaks&&speedStreaks.length))return;
  ctx.save();ctx.globalCompositeOperation='screen';ctx.lineWidth=2;
  for(const streak of speedStreaks){
    ctx.globalAlpha=Math.max(0,Math.min(0.72,streak.life));ctx.strokeStyle=streak.color;ctx.shadowColor=streak.color;ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(streak.x,streak.y);ctx.lineTo(streak.x-streak.len,streak.y+streak.len*0.08);ctx.stroke();
  }
  ctx.restore();
}

function rollBankSnapshot(){
  const cue=turnCueSnapshot();
  const expected=cue.direction.includes('climb')?-1:cue.direction.includes('dive')?1:0;
  const aligned=!!(rollHold&&expected&&rollHold===expected&&cue.urgency!=='clear');
  return {roll:rollHold<0?'left':rollHold>0?'right':'center',expected:expected<0?'left':expected>0?'right':'center',aligned,cue:cue.cue,urgency:cue.urgency,ticks:rollBankTicks||0};
}

function bankedTurnSnapshot(){
  const corridor=routeCorridor||routeCorridorSnapshot();
  const roll=rollBankSnapshot();
  const steeringTowardLine=!!(bird&&corridor&&corridor.active&&Math.abs(corridor.delta)>16&&Math.sign(corridor.delta)===Math.sign(bird.vy));
  return {turns:bankedTurns,chain:bankedChain,best_chain:bestBankedChain,steering_toward_line:steeringTowardLine,roll_bank:roll,ready:(steeringTowardLine||roll.aligned)&&routeFlow>=25&&Math.abs(corridor.delta)<=ROUTE_CORRIDOR_WIDTH*1.85};
}

function routeCoachCue(){

  const plan=SPEEDWAY_SECTORS[lock.kind]||activeSectorPlan();
  let cue='HOLD LINE';
  if(bird.y<plan.minY)cue='DIVE TO '+plan.name.toUpperCase();
  else if(bird.y>plan.maxY)cue='CLIMB TO '+plan.name.toUpperCase();
  else if(lock.kind==='drones'&&lock.distance<260)cue='INTERCEPT HEAD-ON';
  else if(lock.dy<-42)cue='CLIMB';
  else if(lock.dy>42)cue='DIVE';
  else if(lock.distance>300)cue='SET UP '+SPEEDWAY_LABELS[lock.kind].toUpperCase();
  else if(lock.locked)cue='COMMIT';
  const landmark=nextLandmark();
  return {cue,kind:lock.kind,sector:plan.name,tactic:plan.tactic,landmark:landmark.label,band:[plan.minY,plan.maxY],dy:lock.dy,distance:lock.distance,locked:lock.locked};

function updatePaceDelta(kind=activeSpeedwayKind()){
  const current=routeSplits&&routeSplits[kind];
  const best=bestRouteSplits&&bestRouteSplits[kind];
  if(!current||!best){paceDelta={kind,delta:null,ahead:false,behind:false};return paceDelta;}
  const delta=Number((current.time_left-best.time_left).toFixed(1));
  paceDelta={kind,delta,ahead:delta>0,behind:delta<0};
  return paceDelta;
}

function paceDeltaLabel(){
  if(!paceDelta||paceDelta.delta===null)return '--';
  return (paceDelta.delta>=0?'+':'')+paceDelta.delta.toFixed(1)+'s';
}

function splitGhostRivalSnapshot(kind=activeSpeedwayKind()){
  const best=bestRouteSplits&&bestRouteSplits[kind];
  const current=routeSplits&&routeSplits[kind];
  const currentTime=current?current.time_left:Number((timeLeft||0).toFixed(1));
  if(!best)return {kind,label:SPEEDWAY_LABELS[kind]||'Clear',best_time_left:null,current_time_left:currentTime,delta:null,ahead:false,behind:false,pressure:'no-ghost',streak:splitGhostStreak||0,best_streak:bestSplitGhostStreak||0};
  const delta=Number((currentTime-best.time_left).toFixed(1));
  const pressure=delta>=3?'ahead':delta>=0?'tight':delta>-3?'chasing':'behind';
  return {kind,label:SPEEDWAY_LABELS[kind]||'Clear',best_time_left:best.time_left,current_time_left:currentTime,delta,ahead:delta>=0,behind:delta<0,pressure,streak:splitGhostStreak||0,best_streak:bestSplitGhostStreak||0};
}

function updateSplitGhostRival(kind=activeSpeedwayKind()){
  splitGhostRival=splitGhostRivalSnapshot(kind);
  return splitGhostRival;
}

function splitGhostLabel(){
  const ghost=splitGhostRival||splitGhostRivalSnapshot();
  if(!ghost||ghost.delta===null)return 'NO GHOST';
  return (ghost.delta>=0?'+':'')+ghost.delta.toFixed(1)+'s '+ghost.pressure.toUpperCase();
}

function splitComparison(kind){
  const current=routeSplits&&routeSplits[kind];
  const best=bestRouteSplits&&bestRouteSplits[kind];
  if(!current)return 'pending';
  if(!best)return current.time_left.toFixed(1)+'s';
  const delta=Number((current.time_left-best.time_left).toFixed(1));
  return current.time_left.toFixed(1)+'s '+(delta>=0?'+':'')+delta.toFixed(1);
}

// Sacred geometry helpers
function drawOctagon(x,y,r,rot){
  ctx.beginPath();
  for(let i=0;i<8;i++){const a=i*Math.PI/4+rot;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}
  ctx.closePath();
}

function drawTriangle(x,y,size,rot){
  ctx.beginPath();
  for(let i=0;i<3;i++){const a=i*Math.PI*2/3+rot;ctx.lineTo(x+Math.cos(a)*size,y+Math.sin(a)*size);}
  ctx.closePath();
}

function drawFacetGem(x,y,r,hue,rot=0,alpha=1){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot);
  ctx.globalAlpha=alpha;
  ctx.shadowColor=`hsla(${hue},100%,70%,${alpha})`;
  ctx.shadowBlur=20*r/10;
  const g=ctx.createRadialGradient(-r*0.3,-r*0.35,r*0.1,0,0,r*1.2);
  g.addColorStop(0,'rgba(255,255,255,0.94)');
  g.addColorStop(0.22,`hsla(${hue+60},100%,76%,0.9)`);
  g.addColorStop(0.58,`hsla(${hue},100%,54%,0.78)`);
  g.addColorStop(1,`hsla(${hue+145},100%,34%,0.34)`);
  ctx.fillStyle=g;
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    const rr=i%2?r*0.7:r;
    ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
  }
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle=`hsla(${hue+70},100%,84%,${0.82*alpha})`;
  ctx.lineWidth=Math.max(1,r*0.09);
  ctx.stroke();
  ctx.strokeStyle=`rgba(255,255,255,${0.42*alpha})`;
  ctx.lineWidth=1;
  for(let i=0;i<4;i++){
    const a=i*Math.PI/2+Math.PI/4;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(a)*r*0.9,Math.sin(a)*r*0.9);
    ctx.stroke();
  }
  ctx.restore();
}

function drawCausticSky(){
  ctx.save();
  ctx.globalCompositeOperation='screen';
  for(let i=0;i<18;i++){
    const hue=(frameCount*0.9+i*34)%360;
    const x=(i*W/5+Math.sin(frameCount*0.012+i)*65)%W;
    const y=(i*H/8+Math.cos(frameCount*0.01+i)*90)%H;
    const r=70+Math.sin(frameCount*0.018+i)*28;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,`hsla(${hue},100%,58%,0.15)`);
    g.addColorStop(0.45,`hsla(${hue+80},100%,58%,0.045)`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawSacredPillar(x,gapY,gapH){
  // Top pillar
  const topH=gapY;
  const botY=gapY+gapH;
  const botH=H-botY;
  const pw=70;

  // Draw interlocking triangles pattern
  const triSize=20;
  const colors=['#0ff','#f0f','#fd0','#0f8'];

  // Top and bottom crystal bodies
  const topG=ctx.createLinearGradient(x,0,x+pw,0);
  topG.addColorStop(0,'rgba(0,255,255,0.08)');
  topG.addColorStop(0.45,'rgba(255,255,255,0.18)');
  topG.addColorStop(1,'rgba(255,0,255,0.08)');
  ctx.fillStyle=topG;
  ctx.beginPath();
  ctx.moveTo(x+6,0);ctx.lineTo(x+pw-6,0);ctx.lineTo(x+pw,gapY-18);ctx.lineTo(x+pw/2,gapY+8);ctx.lineTo(x,gapY-18);ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='rgba(0,255,255,0.45)';ctx.lineWidth=2;ctx.stroke();

  const botG=ctx.createLinearGradient(x,botY,x+pw,H);
  botG.addColorStop(0,'rgba(255,0,255,0.1)');
  botG.addColorStop(0.45,'rgba(255,255,255,0.16)');
  botG.addColorStop(1,'rgba(0,255,128,0.08)');
  ctx.fillStyle=botG;
  ctx.beginPath();
  ctx.moveTo(x+pw/2,botY-8);ctx.lineTo(x+pw,botY+18);ctx.lineTo(x+pw-6,H);ctx.lineTo(x+6,H);ctx.lineTo(x,botY+18);ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='rgba(255,0,255,0.45)';ctx.lineWidth=2;ctx.stroke();

  // Triangle decorations on top pillar
  for(let ty=triSize;ty<topH;ty+=triSize*1.8){
    const col=colors[Math.floor(ty/triSize)%colors.length];
    ctx.strokeStyle=col;ctx.lineWidth=1;
    ctx.globalAlpha=0.5;
    drawTriangle(x+pw/2,ty,triSize*0.7,0);ctx.stroke();
    drawTriangle(x+pw/2,ty,triSize*0.7,Math.PI);ctx.stroke();
    drawFacetGem(x+pw/2,ty,7,(ty*2+frameCount)%360,frameCount*0.02+ty,0.55);
    ctx.globalAlpha=1;
  }

  // Triangle decorations on bottom pillar
  for(let ty=botY+triSize;ty<H;ty+=triSize*1.8){
    const col=colors[Math.floor(ty/triSize)%colors.length];
    ctx.strokeStyle=col;ctx.lineWidth=1;
    ctx.globalAlpha=0.5;
    drawTriangle(x+pw/2,ty,triSize*0.7,0);ctx.stroke();
    drawTriangle(x+pw/2,ty,triSize*0.7,Math.PI);ctx.stroke();
    drawFacetGem(x+pw/2,ty,7,(ty*2+180+frameCount)%360,-frameCount*0.02+ty,0.55);
    ctx.globalAlpha=1;
  }

  // Glowing edges at gap
  const glow=ctx.createLinearGradient(x,gapY-20,x,gapY+5);
  glow.addColorStop(0,'transparent');glow.addColorStop(1,'rgba(0,255,255,0.6)');
  ctx.fillStyle=glow;ctx.fillRect(x,gapY-20,pw,25);

  const glow2=ctx.createLinearGradient(x,botY-5,x,botY+20);
  glow2.addColorStop(0,'rgba(255,0,255,0.6)');glow2.addColorStop(1,'transparent');
  ctx.fillStyle=glow2;ctx.fillRect(x,botY-5,pw,25);
}

function spawnPipe(){
  const minGap=145,maxGap=195;
  const gap=maxGap-Math.min(score*1.4,maxGap-minGap);
  const gapY=Math.max(70,Math.min(H-gap-85,nextCourseY('gates')-gap*0.5));
  pipes.push({x:W+10,gapY,gapH:gap,scored:false});
}

function spawnRing(){
  const y=nextCourseY('rings');
  rings.push({x:W+40,y,r:24,hit:false});
}

function spawnCrystal(){
  const y=nextCourseY('crystals');
  crystals.push({x:W+50,y,r:17,hit:false});
}

function spawnDrone(){
  const y=nextCourseY('drones');
  drones.push({x:W+70,y,r:18,hit:false,wobble:(courseIndex.drones%8)*0.7});
}

function collectCrystal(c){
  if(c.hit)return;
  c.hit=true;charge=Math.min(100,charge+12);markSpeedwayTarget('crystals',3);evaluateMissions();spawnParticles(c.x,c.y,'#0ff',12);playCue('collect');
}

function destroyDrone(d){
  if(d.hit)return;
  const headOn=activeSpeedwayKind()==='drones'&&d.x>bird.x&&d.x-bird.x<210&&Math.abs(d.y-bird.y)<76;
  d.hit=true;charge=Math.min(100,charge+20);markSpeedwayTarget('drones',5);
  if(headOn){headOnHits++;score+=2;if(!timeAttackMode)timeLeft=Math.min(99,timeLeft+1);addHitLabel(timeAttackMode?'HEAD-ON INTERCEPT +2':'HEAD-ON INTERCEPT +1s',d.x,d.y-22,'#0f8');playCue('split');}
  evaluateMissions();spawnParticles(d.x,d.y,'#f0f',18);playCue('collect');
}

function collectRing(r){
  if(r.hit)return;
  r.hit=true;combo++;bestCombo=Math.max(bestCombo,combo);missionStatus.ringsCollected++;charge=Math.min(100,charge+18);
  score+=Math.max(1,combo);
  markSpeedwayTarget('rings',0);
  if(combo>1)setAnnouncer('RING COMBO x'+combo,'#fd0');
  refreshRouteTier();
  evaluateMissions();
  spawnParticles(r.x,r.y,'#fd0',16);playCue('collect');
}

function exportFlightReceipt(){
  if(state===STATE.DEAD)recordFlightLogEntry('receipt-export');
  lastReceipt=flightReceiptPayload();
  localStorage.setItem('skyDragonDharmaLastReceipt',JSON.stringify(lastReceipt));
  const blob=new Blob([JSON.stringify(lastReceipt,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='sky-dragon-dharma-flight-receipt.json';a.click();URL.revokeObjectURL(a.href);

function spawnParticles(x,y,color,count){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const sp=Math.random()*4+1;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color,size:Math.random()*3+1});
  }
}

function update(){
  frameCount++;

  if(state!==STATE.PLAY)return;
  if(paused){if(announcer)announcer.ttl=Math.max(0,announcer.ttl-1);return;}
  runAssistPilot();
  if(IS_PLAYTEST){
    state=STATE.PLAY;
    bird.vy=Math.sin(frameCount*0.04)*0.85;
    bird.y=H*0.42+Math.sin(frameCount*0.035)*34;
    bird.rot=Math.sin(frameCount*0.045)*0.22;
    bird.trail.push({x:bird.x-Math.sin(frameCount*0.03)*8,y:bird.y,life:1});
    if(bird.trail.length>22)bird.trail.shift();
    bird.trail.forEach(t=>t.life=Math.max(0.24,t.life-0.035));
    pipes.forEach((p,i)=>{p.x+=Math.sin(frameCount*0.018+i)*0.18;});
    rings.forEach((r,i)=>{r.x+=Math.sin(frameCount*0.02+i)*0.4;r.y+=Math.cos(frameCount*0.025+i)*0.3;});
    crystals.forEach((c,i)=>{c.x+=Math.sin(frameCount*0.018+i)*0.25;c.y+=Math.cos(frameCount*0.02+i)*0.25;});
    drones.forEach((d,i)=>{d.x+=Math.sin(frameCount*0.016+i)*0.3;d.y+=Math.cos(frameCount*0.018+i)*0.35;});
    if(frameCount%9===0)spawnParticles(bird.x-18,bird.y+Math.sin(frameCount)*9,['#0ff','#fd0','#f0f'][frameCount%3],1);
    flameBursts.forEach(f=>f.life--);flameBursts=flameBursts.filter(f=>f.life>0);
    hitLabels.forEach(l=>{l.y-=0.35;l.life-=0.015;});hitLabels=hitLabels.filter(l=>l.life>0);
    updateTargetLock();
    updateRouteCorridor();
    updateSplitGhostRival();
    updateSectorTransition();
    updatePortalWake();
    if(announcer)announcer.ttl=Math.max(0,announcer.ttl-1);
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=0.018;p.vy+=0.025;});
    particles=particles.filter(p=>p.life>0);
    return;
  }

  timeLeft=Math.max(0,timeLeft-1/60);
  if(timeLeft<=0){die('timeout');return;}
  updateSpeedChain();
  updateSectorTransition();

  // Speed increases with score
  refreshRouteTier();
  speedMult=routeTier.wind+score*0.012+(routeFlow/100)*0.18+(diveSurge/100)*0.12;
  const spd=baseSpeed*speedMult+(bird.boost>0?1.4+(routeFlow/100)*0.42:0);
  ringTimer+=spd;crystalTimer+=spd;droneTimer+=spd;
  if(frameCount%240===0)spawnWindLane();
  if(frameCount%210===0)spawnSpeedRing();
  if(frameCount%360===0&&activeSpeedwayKind()!=='complete'&&(sectorPortals||[]).filter(portal=>!portal.hit).length<1)spawnSectorPortal();
  if(ringTimer>155){ringTimer=0;spawnRing();}
  if(crystalTimer>125){crystalTimer=0;spawnCrystal();}
  if(droneTimer>265){droneTimer=0;spawnDrone();}
  charge=Math.min(100,charge+0.045+(routeFlow/100)*0.09);
  if(bird.boost>0)bird.boost--;
  if((bird.boost>0||routeFlow>=80||diveSurge>=70)&&frameCount%8===0)triggerSpeedFx(5,routeFlow>=80?'#0ff':'#fd0',2);
  updateSpeedFx();
  for(const lane of windLanes){lane.x-=spd*1.16;if(!lane.hit&&Math.abs(lane.x-bird.x)<32&&Math.abs(lane.y-bird.y)<lane.width)collectWindLane(lane);}
  windLanes=windLanes.filter(lane=>lane.x>-90&&!lane.hit);
  for(const ring of speedRings){ring.x-=spd*1.28;if(!ring.hit&&Math.abs(ring.x-bird.x)<38&&Math.abs(ring.y-bird.y)<ring.r)collectSpeedRing(ring);}
  speedRings=speedRings.filter(ring=>ring.x>-90&&!ring.hit);
  for(const portal of sectorPortals){portal.x-=spd*1.12;if(!portal.hit&&Math.abs(portal.x-bird.x)<48&&Math.abs(portal.y-bird.y)<portal.r*1.15)collectSectorPortal(portal);}
  sectorPortals=sectorPortals.filter(portal=>portal.x>-120&&!portal.hit);
  flameBursts.forEach(f=>f.life--);flameBursts=flameBursts.filter(f=>f.life>0);
  hitLabels.forEach(l=>{l.y-=0.7;l.life-=0.025;});hitLabels=hitLabels.filter(l=>l.life>0);
  updateTargetLock();
  updateRouteCorridor();
  updateSplitGhostRival();
  updateDiveSurge();
  updatePortalWake();
  updateAltitudeBand();

  // Bird physics
  if(flap){bird.vy=-7.5;flap=false;spawnParticles(bird.x,bird.y+10,'#0ff',5);}
  bird.vy+=diveHold?0.72:(bird.glide?0.18:0.38);// gravity / glide / dive
  bird.y+=bird.vy;
  updateBankedTurn();
  bird.rot=Math.min(bird.vy*3+(bankedChain>0?Math.sign((routeCorridor&&routeCorridor.delta)||0)*10:0),80)*Math.PI/180;

  // Trail
  bird.trail.push({x:bird.x,y:bird.y,life:1,glide:bird.glide});
  if(bird.trail.length>15)bird.trail.shift();
  bird.trail.forEach(t=>t.life-=0.07);

  // Pipe spawning
  pipeTimer+=spd;
  if(pipeTimer>200){pipeTimer=0;spawnPipe();}

  // Move rings
  for(let r of rings){
    r.x-=spd*1.08;
    const dx=bird.x-r.x,dy=bird.y-r.y;
    if(!r.hit&&Math.hypot(dx,dy)<r.r+16)collectRing(r);
  }
  rings=rings.filter(r=>r.x>-60&&!r.hit);

  for(let c of crystals){
    c.x-=spd*1.03;
    const dx=bird.x-c.x,dy=bird.y-c.y;
    if(!c.hit&&Math.hypot(dx,dy)<c.r+15)collectCrystal(c);
  }
  crystals=crystals.filter(c=>c.x>-60&&!c.hit);

  for(let d of drones){
    d.x-=spd*1.18;d.y+=Math.sin(frameCount*0.045+d.wobble)*0.85;
    const dx=bird.x-d.x,dy=bird.y-d.y;
    if(!d.hit&&Math.hypot(dx,dy)<d.r+15){
      if(bird.boost>0)destroyDrone(d);
      else {combo=0;die('drone-collision');return;}
    }
  }
  drones=drones.filter(d=>d.x>-70&&!d.hit);

  // Move pipes
  for(let p of pipes){
    p.x-=spd;
    if(!p.scored&&p.x+70<bird.x){p.scored=true;
      const nearEdge=Math.min(Math.abs(bird.y-p.gapY),Math.abs(bird.y-(p.gapY+p.gapH)));
      if(nearEdge<28){
        nearMisses++;score+=2;charge=Math.min(100,charge+8);setAnnouncer('NEAR MISS +2','#0ff');evaluateMissions();
      }else score++;
      markSpeedwayTarget('gates',0);
      refreshRouteTier();
      evaluateMissions();
      spawnParticles(bird.x,bird.y,'#fd0',8);
    }
  }
  pipes=pipes.filter(p=>p.x>-80);

  // Collision detection
  const br=14;// bird radius
  // Floor/ceiling
  if(bird.y<br||bird.y>H-br){combo=0;die();return;}

  // Pipes
  for(let p of pipes){
    if(bird.x+br>p.x&&bird.x-br<p.x+70){
      if(bird.y-br<p.gapY||bird.y+br>p.gapY+p.gapH){combo=0;die();return;}
    }
  }

  // Particles
  if(announcer)announcer.ttl=Math.max(0,announcer.ttl-1);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=0.025;p.vy+=0.05;});
  particles=particles.filter(p=>p.life>0);
}

function die(reason='crash'){
  state=STATE.DEAD;
  chip('explode');chip('death');stopChiptuneMusic();triggerScreenShake(9);
  spawnParticles(bird.x,bird.y,'#f44',25);
  spawnParticles(bird.x,bird.y,'#fd0',15);
  evaluateMissions();
  if(score>highScore){highScore=score;localStorage.setItem('flappyDharma_hi',highScore);}
  recordFlightLogEntry(reason);
}

function draw(){
  // Background
  ctx.fillStyle='#06060f';ctx.fillRect(0,0,W,H);
  if(flapBgReady){ // AI sky base (opaque, cover-fit); motion plate overlays it when ready
    const bw=flapBgImg.width,bh=flapBgImg.height,sc=Math.max(W/bw,H/bh);
    const dw=bw*sc,dh=bh*sc;
    ctx.save();ctx.globalAlpha=0.9;ctx.drawImage(flapBgImg,(W-dw)/2,(H-dh)/2,dw,dh);
    ctx.fillStyle='rgba(6,6,15,0.34)';ctx.fillRect(0,0,W,H);ctx.restore();
  }
  drawMotionPlate();
  drawCausticSky();
  if(cameraShake>0){ctx.save();ctx.globalAlpha=Math.min(0.18,cameraShake/40);ctx.fillStyle='#0ff';ctx.fillRect(0,0,W,H);ctx.restore();}

  // Stars
  bgStars.forEach(s=>{
    s.b+=0.03;
    const bright=0.3+Math.sin(s.b)*0.3;
    ctx.fillStyle=`rgba(200,220,255,${bright})`;
    ctx.fillRect(s.x,s.y,s.s,s.s);
  });

  // Subtle grid
  ctx.strokeStyle='rgba(0,255,255,0.04)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  drawSpeedFx();
  drawRouteLandmarks();
  drawRouteCorridor();
  drawGhostRouteRibbon();
  drawDepthGates();
  drawTurnCues();
  drawRouteGuide();
  drawRouteCompass();
  drawSpeedChainGauge();
  drawSectorTransition();
  drawSectorPortals();
  drawPortalWake();
  drawCourseMap();

  for(const lane of windLanes){
    ctx.save();ctx.globalAlpha=lane.hit?0.12:0.38;ctx.strokeStyle='#0ff';ctx.fillStyle='rgba(0,255,255,.08)';ctx.shadowColor='#0ff';ctx.shadowBlur=18;ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(lane.x,lane.y,lane.width*0.9,lane.width*1.35,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.font='bold 10px Courier New';ctx.textAlign='center';ctx.fillStyle='#0ff';ctx.fillText('WIND',lane.x,lane.y-38);ctx.restore();
  }

  for(const ring of speedRings){
    ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=ring.hit?0.14:0.72;ctx.strokeStyle='#fd0';ctx.fillStyle='rgba(245,197,66,.06)';ctx.shadowColor='#fd0';ctx.shadowBlur=22;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(ring.x,ring.y,ring.r+Math.sin(frameCount*0.16)*3,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.arc(ring.x,ring.y,ring.r*0.52,0,Math.PI*2);ctx.stroke();
    ctx.font='bold 10px Courier New';ctx.textAlign='center';ctx.fillStyle='#fd0';ctx.fillText('TURBO',ring.x,ring.y-ring.r-10);ctx.restore();
  }

  // Rings
  for(let r of rings){
    ctx.save();ctx.globalCompositeOperation='screen';
    ctx.strokeStyle=r.hit?'rgba(0,255,128,.25)':'rgba(245,197,66,.78)';ctx.lineWidth=4;
    ctx.shadowColor='#fd0';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();
    drawFacetGem(r.x,r.y,6,(frameCount*2+r.x)%360,frameCount*0.04,0.9);ctx.restore();
  }

  for(let c of crystals){
    drawFacetGem(c.x,c.y,c.r,185+frameCount%90,frameCount*0.06,0.92);
  }

  for(let f of flameBursts){
    ctx.save();ctx.globalAlpha=Math.max(0,f.life/12);ctx.fillStyle='rgba(255,124,24,.32)';ctx.shadowColor='#f60';ctx.shadowBlur=18;
    ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x+120,f.y-45);ctx.lineTo(f.x+120,f.y+45);ctx.closePath();ctx.fill();ctx.restore();
  }

  for(let d of drones){
    ctx.save();ctx.globalAlpha=0.9;ctx.strokeStyle='#f0f';ctx.lineWidth=3;ctx.shadowColor='#f0f';ctx.shadowBlur=14;
    drawTriangle(d.x,d.y,d.r+8,frameCount*0.05+d.wobble);ctx.stroke();
    drawFacetGem(d.x,d.y,6,305,frameCount*0.09,0.95);ctx.restore();
  }

  // Pipes
  for(let p of pipes)drawSacredPillar(p.x,p.gapY,p.gapH);

  // Bird trail
  if(bird.trail){
    bird.trail.forEach((t,i)=>{
      if(t.life<=0)return;
      drawFacetGem(t.x,t.y,5+i*0.45,185+i*12,frameCount*0.05+i,t.life*0.48);
    });
  }

  // Bird - AI dragon sprite (juiced) with full procedural DHARMA octagon fallback
  ctx.save();
  // idle bob when gliding calmly; squash/stretch from vertical velocity
  const _vy=Math.max(-9,Math.min(9,bird.vy||0));
  const _bob=Math.abs(_vy)<1.2?Math.sin(frameCount*0.16)*1.6:0;
  ctx.translate(bird.x,bird.y+_bob);
  ctx.rotate(bird.rot+(rollHold||0)*0.16);

  // Outer glow (kept for both modes)
  const grd=ctx.createRadialGradient(0,0,5,0,0,30);
  grd.addColorStop(0,'rgba(0,255,255,0.4)');grd.addColorStop(1,'transparent');
  ctx.fillStyle=grd;ctx.fillRect(-30,-30,60,60);

  if(flapDragonReady){
    // sprite path: squash/stretch, hit-flash on boost, flap pulse
    const sw=68,sh=sw*(flapDragonImg.height/flapDragonImg.width||0.82);
    const stretch=Math.max(-0.14,Math.min(0.14,_vy*0.018));
    const pulse=1+Math.sin(frameCount*0.3)*0.03;
    ctx.save();
    ctx.scale((1-stretch)*pulse,(1+stretch)*pulse);
    ctx.drawImage(flapDragonImg,-sw/2,-sh/2,sw,sh);
    if((bird.boost||0)>0){ // boost hit-flash (additive)
      ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.min(0.6,(bird.boost||0)/24);
      ctx.drawImage(flapDragonImg,-sw/2,-sh/2,sw,sh);
    }
    ctx.restore();
  } else {
    // Procedural fallback (original holographic dragon) — never removed
    ctx.fillStyle='rgba(255,255,255,0.22)';
    ctx.strokeStyle='rgba(255,255,255,0.58)';
    ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(-10,-4);ctx.lineTo(-28,-14);ctx.lineTo(-18,2);ctx.lineTo(-28,15);ctx.lineTo(-8,8);ctx.stroke();
    ctx.beginPath();ctx.moveTo(10,-4);ctx.lineTo(28,-14);ctx.lineTo(18,2);ctx.lineTo(28,15);ctx.lineTo(8,8);ctx.stroke();
    drawFacetGem(0,0,17,185,frameCount*0.03,1);
    ctx.fillStyle='#06060f';
    drawOctagon(0,0,10,frameCount*0.03+Math.PI/8);ctx.fill();
    ctx.strokeStyle='#fd0';ctx.lineWidth=1.5;
    drawOctagon(0,0,6,frameCount*0.05);ctx.stroke();
    drawFacetGem(6,-7,4,52,frameCount*0.08,1);
    drawFacetGem(7,7,4,315,-frameCount*0.08,1);
  }

  ctx.restore();

  for(let l of hitLabels){
    ctx.save();ctx.globalAlpha=Math.max(0,l.life);ctx.font='bold 13px Courier New';ctx.textAlign='center';ctx.fillStyle=l.color;ctx.shadowColor=l.color;ctx.shadowBlur=10;ctx.fillText(l.text,l.x,l.y);ctx.restore();
  }

  // Particles
  for(let p of particles){
    const hue=p.color==='#f44'?5:p.color==='#fd0'?50:p.color==='#0ff'?185:305;
    drawFacetGem(p.x,p.y,p.size+2,hue,frameCount*0.08+p.x,p.life);
  }

  // HUD
  if(state===STATE.PLAY||state===STATE.DEAD){
    ctx.fillStyle='#fff';ctx.font='bold 36px Courier New';ctx.textAlign='center';
    ctx.shadowColor='#0ff';ctx.shadowBlur=15;
    ctx.fillText(score,W/2,60);
    ctx.shadowBlur=0;

    ctx.font='14px Courier New';ctx.fillStyle='#888';
    ctx.fillText('HI: '+highScore,W/2,85);
    ctx.textAlign='right';ctx.fillStyle=timeLeft<8?'#f44':'#fd0';ctx.fillText((timeAttackMode?'ATTACK ':'TIME ')+Math.ceil(timeLeft),W-20,34);
    speedwaySnapshot().forEach((target,i)=>{ctx.fillStyle=target.id===activeSpeedwayKind()?'#fd0':target.complete?'#0f8':'#888';ctx.fillText((target.id===activeSpeedwayKind()?'> ':'')+target.label.toUpperCase()+' '+target.count+'/'+target.target,W-20,56+i*18);});
    const medal=speedwayMedal();
    ctx.fillStyle=medal.color;ctx.fillText('MEDAL '+medal.label.toUpperCase(),W-20,136);
    ctx.fillStyle='#0ff';ctx.fillText('ORDER x'+routeStreak+'  CHAIN x'+(speedChain||0),W-20,154);
    ctx.fillStyle='#888';ctx.fillText('SPLITS '+Object.keys(routeSplits||{}).length+'https://app.northstarprime.net/4',W-20,172);
    ctx.fillStyle=timeAttackMode?'#0f8':'#555';ctx.fillText(timeAttackMode?'TIME ATTACK '+timeAttackElapsed().toFixed(1)+'s':'T TIME ATTACK',W-20,208);
    ctx.fillStyle=paceDelta&&paceDelta.ahead?'#0f8':paceDelta&&paceDelta.behind?'#f66':'#888';ctx.fillText('PACE '+paceDeltaLabel(),W-20,190);
    const corridor=routeCorridor||routeCorridorSnapshot();ctx.fillStyle=corridor.inside?'#0f8':'#f66';ctx.fillText('LINE '+corridorScore+' / '+bestCorridorScore,W-20,226);
    const flow=routeFlowSnapshot();ctx.fillStyle=flow.flow>=80?'#0ff':flow.flow>=45?'#0f8':'#555';ctx.fillText('FLOW '+flow.flow+' / '+flow.best,W-20,244);
    ctx.fillStyle=apexChain>0?'#fd0':'#555';ctx.fillText('APEX x'+apexChain+' / '+bestApexChain,W-20,262);
    const cp=checkpointSnapshot();ctx.fillStyle=cp.score>=bestCheckpointScore&&cp.score>0?'#0ff':'#555';ctx.fillText('CHECK '+cp.score+' / '+cp.best_score,W-20,280);
    ctx.fillStyle=bankedChain>0?'#0ff':'#555';ctx.fillText((rollHold<0?'ROLL ◄ ':rollHold>0?'ROLL ► ':'BANK ')+bankedChain+' / '+bestBankedChain,W-20,298);
    ctx.fillStyle=windLaneHits>0?'#0ff':'#555';ctx.fillText('WIND '+windLaneHits+' / '+bestWindLaneHits,W-20,316);
    ctx.fillStyle=speedRingChain>0?'#fd0':'#555';ctx.fillText('TURBO x'+speedRingChain+' / '+bestSpeedRingChain,W-20,352);
    ctx.fillStyle=sectorPortalHits>0?'#0ff':'#555';ctx.fillText('PORTALS '+sectorPortalHits+' / '+bestSectorPortalHits,W-20,374);
    ctx.fillStyle=portalWakeScore>0?'#0ff':'#555';ctx.fillText('WAKE '+portalWakeScore+' / '+bestPortalWakeScore,W-20,396);
    const speedFx=speedFxSnapshot();ctx.fillStyle=speedFx.level>=45?'#0ff':'#555';ctx.fillText('SPEED FX '+speedFx.level+' / '+speedFx.best_level,W-20,388);
    const dive=diveSurgeSnapshot();ctx.fillStyle=dive.active?'#0ff':'#555';ctx.fillText('DIVE '+dive.surges+' / '+dive.best_surges,W-20,370);
    const ghost=splitGhostRival||splitGhostRivalSnapshot();ctx.fillStyle=ghost&&ghost.ahead?'#0f8':ghost&&ghost.behind?'#f66':'#555';ctx.fillText('GHOST x'+splitGhostStreak+' / '+bestSplitGhostStreak,W-20,334);
    ctx.textAlign='left';ctx.fillStyle='#0f8';ctx.fillText('COMBO x'+combo,20,34);
    ctx.fillStyle='#fd0';ctx.fillText('CHARGE '+Math.round(charge)+'%',20,56);
    ctx.fillStyle='#f60';ctx.fillText('F FLAME '+flameShots,20,188);
    ctx.fillStyle=targetLock&&targetLock.locked?'#0f8':'#555';ctx.fillText(targetLock&&targetLock.locked?'TARGET LOCK':'LOCK '+Math.round(((targetLock&&targetLock.strength)||0)*100)+'%',20,210);
    ctx.fillStyle=audioEnabled?'#0f8':'#555';ctx.fillText(audioEnabled?'AUDIO ON':'MUTED',20,232);
    const sector=activeSectorPlan();
    ctx.fillStyle=sector.color;ctx.fillText('SECTOR '+sector.name.toUpperCase(),20,254);
    ctx.fillStyle=routeCoach&&routeCoach.cue==='INTERCEPT HEAD-ON'?'#0f8':'#fd0';ctx.fillText('COACH '+((routeCoach&&routeCoach.cue)||'FIND ROUTE'),20,276);
    ctx.fillStyle='#aaa';ctx.fillText('LANDMARK '+((routeCoach&&routeCoach.landmark)||'NONE'),20,320);
    ctx.fillStyle='#888';ctx.fillText('HEAD-ON '+headOnHits+'  MISTAKES '+routeMistakes,20,298);
    const discipline=routeDiscipline();ctx.fillStyle=discipline.grade==='S'?'#fd0':discipline.grade==='A'?'#0f8':'#888';ctx.fillText('DISCIPLINE '+discipline.grade+' '+discipline.score,20,342);
    const alt=altitudeBandSnapshot();ctx.fillStyle=alt.inside?'#fd0':'#555';ctx.fillText('ALT BAND '+alt.holds+' / '+alt.best_holds,20,386);
    ctx.fillStyle=bird.glide?'#0ff':'#666';ctx.fillText(bird.glide?'GLIDE':'SHIFT GLIDE',20,78);
    ctx.fillStyle=diveHold?'#0ff':'#555';ctx.fillText(diveHold?'DIVE SURGE':'S/DOWN DIVE',20,364);
    ctx.fillStyle=routeTier.color;ctx.fillText(routeTier.name.toUpperCase(),20,100);
    ctx.fillStyle='#888';ctx.fillText('NEAR MISS '+nearMisses,20,122);
    ctx.fillStyle=assistMode?'#0f8':'#555';ctx.fillText(assistMode?'ASSIST ON':'A ASSIST',20,144);
    const activeMission=missionSnapshot().find(m=>!m.complete)||missionSnapshot()[missionSnapshot().length-1];
    ctx.fillStyle=activeMission&&activeMission.complete?'#fd0':'#aaa';ctx.fillText('MISSION '+(activeMission?activeMission.label.toUpperCase():'CLEAR'),20,166);
    ctx.textAlign='center';
    if(announcer&&announcer.ttl>0){
      ctx.font='bold 18px Courier New';ctx.fillStyle=announcer.color;ctx.shadowColor=announcer.color;ctx.shadowBlur=14;
      ctx.fillText(announcer.text,W/2,122);ctx.shadowBlur=0;
    }
    if(paused){
      ctx.fillStyle='rgba(6,6,15,0.62)';ctx.fillRect(0,0,W,H);
      ctx.font='bold 34px Courier New';ctx.fillStyle='#fd0';ctx.shadowColor='#fd0';ctx.shadowBlur=20;
      ctx.fillText('PAUSED',W/2,H/2-18);ctx.shadowBlur=0;
      ctx.font='14px Courier New';ctx.fillStyle='#0ff';ctx.fillText('P RESUME · R RESTART · O EXPORT',W/2,H/2+20);
    }
  }

  // Menu screen
  if(state===STATE.MENU){
    drawMenuScreen();
  }

  // Game over screen
  if(state===STATE.DEAD){
    drawDeadScreen();
  }
}

function drawMenuScreen(){
  ctx.fillStyle='rgba(6,6,15,0.7)';ctx.fillRect(0,0,W,H);

  ctx.textAlign='center';
  ctx.shadowColor='#0ff';ctx.shadowBlur=20;

  // Title
  ctx.font='bold 42px Courier New';ctx.fillStyle='#0ff';
  ctx.fillText('SKY DRAGON',W/2,H/2-100);
  ctx.font='bold 52px Courier New';ctx.fillStyle='#fd0';
  ctx.shadowColor='#fd0';
  ctx.fillText('DHARMA',W/2,H/2-50);

  // Decorative octagon
  ctx.shadowBlur=30;ctx.shadowColor='#0ff';
  ctx.strokeStyle='#0ff';ctx.lineWidth=2;
  drawOctagon(W/2,H/2+30,50,frameCount*0.02);ctx.stroke();
  ctx.strokeStyle='#fd0';ctx.lineWidth=1;
  drawOctagon(W/2,H/2+30,35,frameCount*-0.03);ctx.stroke();

  ctx.shadowBlur=0;
  ctx.font='16px Courier New';ctx.fillStyle='#0f8';
  const blink=Math.sin(frameCount*0.06)>0;
  if(blink)ctx.fillText('PRESS SPACE TO START',W/2,H/2+120);

  // concise start-screen legend (fits the 640px canvas; full feature set surfaces in-run)
  ctx.font='11px Courier New';ctx.fillStyle='#8ad';
  ctx.fillText('30s SPEEDWAY - clear 8 rings, gates, crystals & drones',W/2,H/2+152);
  ctx.fillStyle='#888';
  ctx.fillText('SPACE flap  ·  SHIFT glide  ·  Z boost  ·  F flame',W/2,H/2+178);
  ctx.fillText('Q/E roll  ·  S/down dive  ·  A assist  ·  T time attack',W/2,H/2+198);
  ctx.fillText('P pause  ·  M mute  ·  R restart  ·  O export receipt',W/2,H/2+218);
  ctx.fillStyle='#556';
  ctx.fillText('route: rings > gates > crystals > drones - hold the line',W/2,H/2+244);
}

function drawSpeedwayReportCard(){
  const report=speedwayReportCard();
  ctx.save();
  ctx.textAlign='left';ctx.font='bold 12px Courier New';ctx.fillStyle=report.medal_color;ctx.shadowColor=report.medal_color;ctx.shadowBlur=10;
  ctx.fillText('SPEEDWAY REPORT · '+report.medal.toUpperCase()+' · PACE '+report.pace_delta,32,H/2+118);
  ctx.shadowBlur=0;ctx.font='11px Courier New';
  report.splits.forEach((split,i)=>{
    const y=H/2+136+i*14;
    const complete=!!split.current;
    ctx.fillStyle=complete?'#0f8':'#666';
    ctx.fillText(split.label.toUpperCase().padEnd(8,' ')+' '+split.comparison,32,y);
  });
  ctx.textAlign='right';ctx.fillStyle='#888';
  ctx.fillText('BEST SPLIT GHOST SAVED LOCALLY · RIVAL '+splitGhostLabel(),W-32,H/2+188);
  ctx.restore();
}

function drawDeadScreen(){
  ctx.fillStyle='rgba(6,6,15,0.75)';ctx.fillRect(0,H/2-120,W,240);

  ctx.textAlign='center';
  ctx.shadowColor='#f44';ctx.shadowBlur=20;
  ctx.font='bold 40px Courier New';ctx.fillStyle='#f44';
  ctx.fillText(runComplete?'ALL-IN-ONE CLEAR':'GAME OVER',W/2,H/2-50);

  ctx.shadowBlur=0;
  ctx.font='24px Courier New';ctx.fillStyle='#fd0';
  ctx.fillText('SCORE: '+score,W/2,H/2);

  if(score>=highScore&&score>0){
    ctx.fillStyle='#0f8';ctx.font='18px Courier New';
    ctx.fillText('NEW HIGH SCORE!',W/2,H/2+30);
  }

  ctx.font='14px Courier New';ctx.fillStyle='#888';
  ctx.fillText('HIGH SCORE: '+highScore+'   BEST COMBO: '+bestCombo,W/2,H/2+55);
  ctx.fillText('ROUTE: '+routeTier.name+'   TIME: '+Math.ceil(timeLeft)+'s',W/2,H/2+75);
  ctx.fillText('BADGES THIS RUN: '+(runBadges.length?runBadges.map(b=>b.label).join(', '):'NONE'),W/2,H/2+95);
  drawSpeedwayReportCard();
  const leaders=flightLogSnapshot();
  ctx.fillStyle='#0ff';ctx.fillText('LOCAL FLIGHT LOG',W/2,H/2+118);
  ctx.fillStyle='#888';ctx.font='12px Courier New';
  leaders.slice(0,3).forEach((entry,i)=>ctx.fillText((i+1)+'. '+entry.score+' pts · '+entry.route_tier+' · combo '+entry.best_combo,W/2,H/2+138+i*16));

  ctx.font='16px Courier New';ctx.fillStyle='#0f8';
  const blink=Math.sin(frameCount*0.06)>0;
  if(blink)ctx.fillText('PRESS SPACE TO RETRY',W/2,H/2+195);
}

function loop(){
  update();draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
