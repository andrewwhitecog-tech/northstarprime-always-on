name: Storefront conversion audit
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        width: [390]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      WIDTH: ${{ matrix.width }}
    steps:
      - run: python -m pip -q install playwright requests beautifulsoup4
      - shell: python
        run: |
          import os,collections
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              b=pw.chromium.launch(executable_path='/usr/bin/google-chrome',args=['--disable-gpu'])
              p=b.new_page()
              denied=collections.Counter()
              def readonly(r):
                  u=urlsplit(r.request.url)
                  official_static=u.hostname=='assets.gumroad.com' and u.path.startswith('/vite/assets/')
                  product=u.hostname=='andrewcog.gumroad.com' and u.path=='/l/pshjy' and r.request.resource_type=='document'
                  if r.request.method=='GET' and (official_static or product):r.continue_()
                  else:
                      denied[(u.hostname,r.request.resource_type,u.path.split('/')[1][:50] if '/' in u.path else '')]+=1
                      r.abort()
              p.route('**/*',readonly)
              p.on('pageerror',lambda e:print('JS',str(e)[:250],flush=True))
              p.goto('https://andrewcog.gumroad.com/l/pshjy',wait_until='domcontentloaded')
              try:p.get_by_text('I want this!',exact=True).first.wait_for(timeout=7000)
              except Exception:pass
              print('VISIBILITY',p.locator('body').inner_text()[-160:],flush=True)
              print('RESOURCE_CATEGORIES',[(str(k),v) for k,v in denied.items()][:40],flush=True)
              b.close()
