<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="skyIndigo" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="beaconBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="coastalTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="coastalRadiance" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#14b8a6" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#010409"/>

  <!-- DIE-CUT ARCHED OVAL BADGE -->
  <g transform="translate(400, 400)" filter="url(#coastalRadiance)">
    <!-- White Die-Cut Border -->
    <rect x="-350" y="-360" width="700" height="720" rx="200" fill="#ffffff"/>
    <rect x="-340" y="-350" width="680" height="700" rx="190" fill="none" stroke="url(#goldRim)" stroke-width="5"/>
    <rect x="-328" y="-338" width="656" height="676" rx="178" fill="url(#skyIndigo)" stroke="#0f766e" stroke-width="2"/>

    <!-- Concentric Dash Ring -->
    <rect x="-310" y="-320" width="620" height="640" rx="160" fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6"/>

    <!-- Starlight Celestial Constellations in Sky -->
    <g fill="#ffffff" opacity="0.7">
      <circle cx="-180" cy="-240" r="2"/>
      <circle cx="-120" cy="-270" r="1.5"/>
      <circle cx="-50" cy="-230" r="2.5"/>
      <circle cx="60" cy="-260" r="1.5"/>
      <circle cx="150" cy="-220" r="2"/>
      <circle cx="210" cy="-250" r="1.5"/>
    </g>

    <!-- Haystack Rock Monolith Silhouette -->
    <path d="M -180 140 C -170 30 -140 -50 -100 -80 C -60 -110 -20 -100 10 -60 C 40 -20 80 50 110 140 Z" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
    <!-- The Needles Sea Stacks -->
    <path d="M 130 140 C 140 90 155 70 165 90 C 175 110 185 130 190 140 Z" fill="#090d16"/>
    <path d="M -210 140 C -200 100 -190 85 -180 100 C -170 115 -165 130 -160 140 Z" fill="#090d16"/>

    <!-- Twilight Solarium Lighthouse Lantern (Top of Haystack Rock) -->
    <g transform="translate(-40, -90)">
      <!-- Beacon Cupola -->
      <path d="M -15 0 L 15 0 L 10 -20 L -10 -20 Z" fill="url(#goldRim)"/>
      <circle cx="0" cy="-10" r="8" fill="#ffffff"/>
      <!-- Radiating Light Beams -->
      <polygon points="0,-10 320,-220 340,-160" fill="url(#beaconBeam)"/>
      <polygon points="0,-10 -300,-200 -320,-140" fill="url(#beaconBeam)" opacity="0.6"/>
      <!-- Diamond Star Halo -->
      <path d="M 0 -25 L 5 -10 L 20 -10 L 8 -2 L 12 12 L 0 4 L -12 12 L -8 -2 L -20 -10 L -5 -10 Z" fill="#fef08a"/>
    </g>

    <!-- Pacific Mist / Low Coastal Fog Banks (Layered Fluid Waves) -->
    <g opacity="0.65">
      <!-- Fog Layer 1 -->
      <path d="M -320 80 C -220 40 -120 110 0 70 C 120 30 220 100 320 60 L 320 180 L -320 180 Z" fill="#14b8a6" opacity="0.25"/>
      <!-- Fog Layer 2 (Crest Waves) -->
      <path d="M -320 120 C -200 80 -80 140 40 100 C 160 60 260 130 320 110 L 320 220 L -320 220 Z" fill="#0f766e" opacity="0.4"/>
      <!-- Pacific Ocean Deep Swell -->
      <path d="M -320 160 C -180 130 -40 180 80 150 C 200 120 280 170 320 160 L 320 260 L -320 260 Z" fill="#042f2e"/>
    </g>

    <!-- Coastal Sitka Spruce Pine Boughs Framing Sides -->
    <!-- Left Pines -->
    <g fill="#022c22" stroke="#064e3b" stroke-width="1.5">
      <path d="M -310 -60 L -250 -30 L -270 -10 L -230 20 L -260 35 L -220 70 L -260 85 L -200 130 L -310 130 Z"/>
    </g>
    <!-- Right Pines -->
    <g fill="#022c22" stroke="#064e3b" stroke-width="1.5" transform="scale(-1, 1)">
      <path d="M -310 -60 L -250 -30 L -270 -10 L -230 20 L -260 35 L -220 70 L -260 85 L -200 130 L -310 130 Z"/>
    </g>

    <!-- Heraldic Banner Header -->
    <rect x="-240" y="-300" width="480" height="42" rx="10" fill="#020617" stroke="url(#goldRim)" stroke-width="2"/>
    <text x="0" y="-273" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="bold" fill="url(#goldRim)" text-anchor="middle" letter-spacing="5">PACIFIC COASTAL FOG</text>

    <!-- Subtitle Banner & Location -->
    <text x="0" y="215" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">THE TWILIGHT SOLARIUM</text>
    <text x="0" y="240" font-family="'Montserrat', sans-serif" font-size="10" font-weight="bold" fill="url(#coastalTeal)" text-anchor="middle" letter-spacing="5">10015 SW HALL BLVD • TIGARD, OREGON</text>
    <text x="0" y="260" font-family="'Cinzel', Georgia, serif" font-size="9" font-style="italic" fill="#94a3b8" text-anchor="middle" letter-spacing="2">Pure Willamette Botanicals • Sovereign Terpenes</text>
  </g>
</svg>