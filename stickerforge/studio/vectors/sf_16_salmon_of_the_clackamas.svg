<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Iridescent Salmon Scales & River Gradients -->
    <radialGradient id="riverDepth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e3a53"/>
      <stop offset="65%" stop-color="#062131"/>
      <stop offset="100%" stop-color="#020d14"/>
    </radialGradient>

    <linearGradient id="salmonRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="35%" stop-color="#e11d48"/>
      <stop offset="70%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>

    <linearGradient id="silverFlash" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="holographicShimmer" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#03080e"/>

  <!-- DIE-CUT STICKER CONTAINER -->
  <g transform="translate(400, 400)" filter="url(#holographicShimmer)">
    <!-- White Die-Cut Bleed Margin -->
    <circle cx="0" cy="0" r="375" fill="#ffffff"/>
    <circle cx="0" cy="0" r="365" fill="none" stroke="url(#silverFlash)" stroke-width="6"/>
    <circle cx="0" cy="0" r="352" fill="url(#riverDepth)" stroke="url(#goldRing)" stroke-width="3"/>

    <!-- Sacred Hydro-Cymatic Water Rings -->
    <circle cx="0" cy="40" r="280" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="4,8" opacity="0.4"/>
    <circle cx="0" cy="40" r="220" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.5"/>
    <circle cx="0" cy="40" r="160" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6"/>
    <circle cx="0" cy="40" r="100" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>

    <!-- Clackamas River Gorge Whitewater Splash Cascades -->
    <path d="M -180 180 Q -100 80 0 120 Q 100 80 180 180 Q 80 240 0 200 Q -80 240 -180 180 Z" fill="#0284c7" fill-opacity="0.3"/>
    <path d="M -140 210 Q 0 160 140 210 Q 0 270 -140 210 Z" fill="#38bdf8" fill-opacity="0.25"/>

    <!-- Sacred Geometric Ripple Flower behind leaping Salmon -->
    <g stroke="url(#silverFlash)" stroke-width="1" fill="none" opacity="0.55" transform="translate(0, -20)">
      <polygon points="0,-160 113,-113 160,0 113,113 0,160 -113,113 -160,0 -113,-113"/>
      <polygon points="0,-130 92,-92 130,0 92,92 0,130 -92,92 -130,0 -92,-92"/>
      <line x1="-160" y1="0" x2="160" y2="0"/>
      <line x1="0" y1="-160" x2="0" y2="160"/>
    </g>

    <!-- THE LEAPING CLACKAMAS SALMON (Ascending Arc) -->
    <g transform="translate(10, -20) rotate(-22)">
      <!-- Dorsal Fin -->
      <path d="M 20 -110 Q 45 -160 70 -120 Q 55 -100 35 -90 Z" fill="url(#salmonRuby)" stroke="#ffffff" stroke-width="1.5"/>

      <!-- Adipose Fin & Tail Peduncle -->
      <path d="M -60 -40 Q -85 -70 -105 -50 Q -95 -30 -75 -25 Z" fill="url(#salmonRuby)"/>

      <!-- Caudal / Tail Fin (Broad, powerful sweep with ray lines) -->
      <path d="M -120 -15 C -170 -60 -210 -70 -230 -40 C -190 -10 -180 20 -230 50 C -210 80 -170 70 -120 25 Z" fill="url(#salmonRuby)" stroke="url(#silverFlash)" stroke-width="2"/>
      <!-- Tail Rays -->
      <line x1="-130" y1="-5" x2="-210" y2="-45" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
      <line x1="-130" y1="0" x2="-200" y2="0" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
      <line x1="-130" y1="5" x2="-210" y2="45" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>

      <!-- Main Muscular Torso & Belly -->
      <path d="M -130 5 C -90 60 20 80 110 50 C 180 25 210 -20 215 -50 C 180 -95 110 -115 10 -95 C -60 -75 -110 -30 -130 5 Z" fill="url(#salmonRuby)" stroke="url(#silverFlash)" stroke-width="3"/>

      <!-- Silver & Emerald Underbelly Sheen -->
      <path d="M -110 10 C -70 50 20 65 100 40 C 150 20 180 -10 190 -35 C 130 -10 40 10 -40 0 C -80 -5 -100 5 -110 10 Z" fill="url(#silverFlash)" opacity="0.85"/>

      <!-- Hooked Kype / Spawning Jaws -->
      <path d="M 215 -50 C 235 -55 255 -40 250 -30 C 230 -25 215 -35 205 -40 Z" fill="#be123c"/>
      <path d="M 210 -25 C 230 -15 240 5 230 10 C 215 5 205 -15 200 -20 Z" fill="#9f1239"/>

      <!-- Intense Eye & Iris -->
      <circle cx="185" cy="-60" r="10" fill="#fef08a" stroke="#000000" stroke-width="2"/>
      <circle cx="187" cy="-60" r="5" fill="#020617"/>
      <circle cx="189" cy="-62" r="2" fill="#ffffff"/>

      <!-- Pectoral & Pelvic Fins -->
      <path d="M 120 25 Q 160 80 180 75 Q 160 45 135 20 Z" fill="url(#salmonRuby)" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M -10 45 Q 10 90 30 85 Q 20 60 5 40 Z" fill="url(#salmonRuby)" stroke="#ffffff" stroke-width="1.2"/>

      <!-- Sacred Geometry Trichome Drops splashing from scales -->
      <g fill="#00f0ff" stroke="#ffffff" stroke-width="0.75">
        <circle cx="60" cy="-65" r="4"/><circle cx="85" cy="-55" r="5"/><circle cx="35" cy="-45" r="3"/>
        <circle cx="110" cy="-35" r="4"/><circle cx="10" cy="-25" r="4"/><circle cx="60" cy="-15" r="5"/>
        <circle cx="140" cy="-20" r="3.5"/><circle cx="-25" cy="-10" r="3.5"/>
      </g>
    </g>

    <!-- Droplets & Bioluminescent Bubbles of River Dew -->
    <g fill="#38bdf8" filter="url(#holographicShimmer)">
      <circle cx="180" cy="-140" r="7" fill="#ffffff"/><circle cx="210" cy="-110" r="5"/>
      <circle cx="-160" cy="-120" r="6"/><circle cx="-190" cy="-90" r="4"/>
      <circle cx="140" cy="-200" r="4"/><circle cx="-120" cy="-180" r="5"/>
      <!-- Floating Trichome heads -->
      <polygon points="175,-160 180,-150 170,-150" fill="#fbbf24"/>
      <polygon points="-145,-140 -140,-130 -150,-130" fill="#fbbf24"/>
    </g>

    <!-- CIRCULAR TYPOGRAPHY BANNER RING -->
    <path id="salmonTextPathTop" d="M -310 0 A 310 310 0 1 1 310 0" fill="none"/>
    <path id="salmonTextPathBottom" d="M 310 0 A 310 310 0 1 1 -310 0" fill="none"/>

    <text font-family="'Cinzel', serif" font-weight="900" font-size="18" fill="url(#goldRing)" letter-spacing="4">
      <textPath href="#salmonTextPathTop" startOffset="50%" text-anchor="middle">
        SALMON OF THE CLACKAMAS • SOLSTICE RUN
      </textPath>
    </text>

    <text font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#38bdf8" letter-spacing="3">
      <textPath href="#salmonTextPathBottom" startOffset="50%" text-anchor="middle">
        SOVEREIGN RIVER WATERS • 10015 SW HALL BLVD
      </textPath>
    </text>

    <!-- Compass Starlight Pips -->
    <circle cx="-315" cy="0" r="5" fill="#f43f5e"/>
    <circle cx="315" cy="0" r="5" fill="#f43f5e"/>
  </g>
</svg>
