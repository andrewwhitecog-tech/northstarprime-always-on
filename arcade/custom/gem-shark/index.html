<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>GEM SHARK — NorthStar Arcade</title>
<style>
html,body{margin:0;height:100%;background:#02060e;overflow:hidden;font-family:Consolas,monospace}
#hud{position:fixed;top:10px;left:14px;z-index:10;color:#7ff3d4;font:700 14px/1.6 Consolas,monospace;letter-spacing:2px;text-shadow:0 0 12px rgba(55,242,200,.6);pointer-events:none}
#hud b{color:#fff}
#msg{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(1,4,10,.72);backdrop-filter:blur(3px)}
#msg .card{text-align:center;color:#e8f6f2;max-width:520px;padding:2rem;border:1px solid rgba(55,242,200,.35);border-radius:16px;background:linear-gradient(160deg,rgba(3,12,20,.95),rgba(10,4,20,.95));box-shadow:0 0 60px rgba(55,242,200,.15)}
#msg h1{margin:0 0 .5rem;font-size:2.2rem;letter-spacing:6px;background:linear-gradient(90deg,#ff5f6d,#ffc371,#7ff3d4,#22d3ee,#a78bfa,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
#msg p{color:rgba(220,236,232,.75);line-height:1.6;font-size:.85rem;letter-spacing:1px}
#msg button{margin-top:1rem;appearance:none;border:1px solid rgba(55,242,200,.5);border-radius:999px;background:rgba(55,242,200,.12);color:#7ff3d4;font:700 .8rem/1 Consolas,monospace;letter-spacing:3px;text-transform:uppercase;padding:.9rem 1.6rem;cursor:pointer}
#msg button:hover{background:rgba(55,242,200,.25);color:#fff}
#load{color:#7ff3d4;font-size:.75rem;letter-spacing:2px;margin-top:.8rem}
.hidden{display:none!important}
#popups{position:fixed;inset:0;z-index:9;pointer-events:none;overflow:hidden}
.pop{position:absolute;color:#ffe27a;font:700 15px Consolas,monospace;text-shadow:0 0 10px rgba(255,226,122,.8);animation:popfly 1.1s ease-out forwards}
@keyframes popfly{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-56px)}}
</style>
</head>
<body>
<div id="hud"></div>
<div id="popups"></div>
<div id="msg">
  <div class="card">
    <h1>GEM SHARK</h1>
    <p>You are a jewel-scaled koi in deep water. Eat fish <b>smaller</b> than you to grow. Fish bigger than you will eat <b>you</b>. The abyssal angler cannot be eaten &mdash; but nip its tail for a bounty.</p>
    <p>WASD / arrows to swim &middot; hold to accelerate &middot; touch-drag on mobile</p>
    <div id="load">loading gem fish&hellip;</div>
    <button id="startBtn" class="hidden" type="button">Dive In</button>
  </div>
</div>
<script type="importmap">
{"imports": {"three": "/static/vendor/three/0.160.0/build/three.module.js", "three/addons/": "/static/vendor/three/0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const hud = document.getElementById('hud');
const msg = document.getElementById('msg');
const loadEl = document.getElementById('load');
const startBtn = document.getElementById('startBtn');
const popups = document.getElementById('popups');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03101e);
scene.fog = new THREE.FogExp2(0x03101e, 0.008);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0, 21);

scene.add(new THREE.AmbientLight(0xffffff, 1.05));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(6, 12, 24); scene.add(sun);
const rim = new THREE.DirectionalLight(0x88bbff, 0.9); rim.position.set(-8, -6, 14); scene.add(rim);
const glow = new THREE.PointLight(0x37f2c8, 0.7, 60); glow.position.set(0, -8, 6); scene.add(glow);

// playfield half-extents in world units at z=0
function fieldSize() {
  const h = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
  return { x: h * camera.aspect, y: h };
}

// bubbles
const bubN = 240, bubPos = new Float32Array(bubN * 3);
for (let i = 0; i < bubN; i++) {
  bubPos[i*3] = (Math.random()-0.5)*70; bubPos[i*3+1] = (Math.random()-0.5)*40; bubPos[i*3+2] = -6 + Math.random()*8;
}
const bubGeo = new THREE.BufferGeometry();
bubGeo.setAttribute('position', new THREE.BufferAttribute(bubPos, 3));
scene.add(new THREE.Points(bubGeo, new THREE.PointsMaterial({ color: 0x9fd8e8, size: 0.14, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false })));

// gem particle burst pool
const burstN = 260, burstPos = new Float32Array(burstN * 3), burstVel = new Float32Array(burstN * 3), burstLife = new Float32Array(burstN);
const burstGeo = new THREE.BufferGeometry();
burstGeo.setAttribute('position', new THREE.BufferAttribute(burstPos, 3));
const burstMat = new THREE.PointsMaterial({ color: 0xffd166, size: 0.32, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
scene.add(new THREE.Points(burstGeo, burstMat));
let burstIdx = 0;
function burst(x, y, color) {
  burstMat.color.set(color);
  for (let k = 0; k < 22; k++) {
    const i = burstIdx = (burstIdx + 1) % burstN;
    burstPos[i*3] = x; burstPos[i*3+1] = y; burstPos[i*3+2] = 1;
    const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 6;
    burstVel[i*3] = Math.cos(a)*s; burstVel[i*3+1] = Math.sin(a)*s; burstVel[i*3+2] = 0;
    burstLife[i] = 0.9;
  }
}

// audio (synth, starts on user gesture)
let ac = null;
function blip(freq, dur, type, vol) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.06, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + (dur || 0.12));
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + (dur || 0.12) + 0.02);
}
const sfx = {
  chomp() { blip(210, 0.10, 'square', 0.07); setTimeout(() => blip(140, 0.08, 'square', 0.05), 45); },
  grow() { blip(420, 0.16, 'triangle', 0.07); setTimeout(() => blip(640, 0.18, 'triangle', 0.06), 90); },
  hurt() { blip(90, 0.5, 'sawtooth', 0.09); },
  nip() { blip(880, 0.09, 'square', 0.06); setTimeout(() => blip(1320, 0.12, 'square', 0.05), 60); },
};

// models
const loader = new GLTFLoader();
let koiProto = null, anglerProto = null;
function normalize(root, len) {
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const s = len / Math.max(size.x, size.y, size.z);
  root.scale.setScalar(s);
  const b2 = new THREE.Box3().setFromObject(root);
  root.position.sub(b2.getCenter(new THREE.Vector3()));
  const wrap = new THREE.Group();
  wrap.add(root);
  return wrap;
}
function tintClone(proto, hex) {
  const c = proto.clone(true);
  c.traverse(n => {
    if (n.isMesh) {
      n.material = n.material.clone();
      if (hex != null) { n.material.color = new THREE.Color(hex); }
    }
  });
  return c;
}

let loaded = 0;
function tally() {
  loaded++;
  loadEl.textContent = 'loading gem fish… ' + loaded + 'https://app.northstarprime.net/2';
  if (loaded >= 2) { loadEl.classList.add('hidden'); startBtn.classList.remove('hidden'); }
}
loader.load('/static/games/models/gemfish_koi_v2.glb', g => { koiProto = normalize(g.scene, 3); tally(); }, undefined, () => { loadEl.textContent = 'koi failed to load — refresh?'; });
loader.load('/static/games/models/abyss_anglerfish.glb', g => { anglerProto = normalize(g.scene, 3); tally(); }, undefined, () => { loadEl.textContent = 'angler failed to load — refresh?'; });

// game state
const NPC_TINTS = [null, 0xff8fb3, 0x8fd7ff, 0xb9ff8f, 0xffd98f, 0xc9a2ff, 0x8fffe1];
let player = null, angler = null, npcs = [];
let score = 0, lives = 3, level = 1, playerLen = 3.0, eaten = 0;
let running = false, invuln = 0, anglerFlee = 0;
const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
let touch = null;
addEventListener('touchstart', e => { touch = e.touches[0]; }, { passive: true });
addEventListener('touchmove', e => { touch = e.touches[0]; }, { passive: true });
addEventListener('touchend', () => { touch = null; }, { passive: true });

function popup(x3, y3, text) {
  const v = new THREE.Vector3(x3, y3, 0).project(camera);
  const el = document.createElement('div');
  el.className = 'pop';
  el.style.left = ((v.x * 0.5 + 0.5) * innerWidth) + 'px';
  el.style.top = ((-v.y * 0.5 + 0.5) * innerHeight) + 'px';
  el.textContent = text;
  popups.appendChild(el);
  setTimeout(() => el.remove(), 1150);
}

function spawnNpc() {
  const f = fieldSize();
  // sizes scale around the player: mostly edible, some threats
  const threat = Math.random() < Math.min(0.24 + level * 0.05, 0.5);
  const len = threat ? playerLen * (1.25 + Math.random() * 0.7) : playerLen * (0.35 + Math.random() * 0.5);
  const tint = NPC_TINTS[(Math.random() * NPC_TINTS.length) | 0];
  const mesh = tintClone(koiProto, tint);
  mesh.scale.multiplyScalar(len / 3);
  const dir = Math.random() < 0.5 ? 1 : -1;
  mesh.position.set(-dir * (f.x + len), (Math.random() - 0.5) * (f.y * 1.7), 0);
  mesh.rotation.y = dir > 0 ? Math.PI / 2 : -Math.PI / 2;
  mesh.userData = { dir, len, speed: (1.6 + Math.random() * 1.6 + level * 0.25) * (threat ? 0.8 : 1), wob: Math.random() * 9 };
  scene.add(mesh); npcs.push(mesh);
}

function reset(full) {
  npcs.forEach(n => scene.remove(n)); npcs = [];
  if (full) { score = 0; lives = 3; level = 1; playerLen = 3.0; eaten = 0; }
  if (player) { player.position.set(0, 0, 0); player.scale.setScalar(playerLen / 3); }
  invuln = 2.5;
}

startBtn.addEventListener('click', () => {
  if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); }
  if (!player) {
    player = tintClone(koiProto, null);
    player.rotation.y = Math.PI / 2;
    scene.add(player);
    angler = tintClone(anglerProto, null);
    angler.scale.multiplyScalar(2.2);
    angler.position.set(-40, 6, 0);
    angler.userData = { t: Math.random() * 20 };
    scene.add(angler);
  }
  reset(true);
  msg.classList.add('hidden');
  running = true;
});

function gameOver() {
  running = false;
  const best = Math.max(score, +(localStorage.getItem('gemshark_best') || 0));
  localStorage.setItem('gemshark_best', best);
  msg.querySelector('h1').textContent = 'EATEN';
  msg.querySelector('p').innerHTML = 'Final score <b>' + score + '</b> &middot; best <b>' + best + '</b> &middot; grew to <b>' + playerLen.toFixed(1) + '</b> gems long.<br>The reef keeps what it kills.';
  startBtn.textContent = 'Dive Again';
  msg.classList.remove('hidden');
}

let shake = 0;
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  const f = fieldSize();

  // bubbles rise
  const bp = bubGeo.attributes.position;
  for (let i = 0; i < bubN; i++) {
    let y = bp.getY(i) + dt * (0.6 + (i % 5) * 0.14);
    if (y > f.y + 4) y = -f.y - 4;
    bp.setY(i, y);
  }
  bp.needsUpdate = true;

  // burst particles
  const bpos = burstGeo.attributes.position;
  for (let i = 0; i < burstN; i++) {
    if (burstLife[i] > 0) {
      burstLife[i] -= dt;
      burstPos[i*3] += burstVel[i*3] * dt;
      burstPos[i*3+1] += burstVel[i*3+1] * dt;
      burstVel[i*3+1] -= dt * 4;
    } else { burstPos[i*3+2] = -999; }
  }
  bpos.needsUpdate = true;

  if (running && player) {
    // input
    let vx = 0, vy = 0;
    if (keys['a'] || keys['arrowleft']) vx -= 1;
    if (keys['d'] || keys['arrowright']) vx += 1;
    if (keys['w'] || keys['arrowup']) vy += 1;
    if (keys['s'] || keys['arrowdown']) vy -= 1;
    if (touch) {
      const tx = (touch.clientX / innerWidth) * 2 - 1, ty = -(touch.clientY / innerHeight) * 2 + 1;
      const wx = tx * f.x, wy = ty * f.y;
      const dx = wx - player.position.x, dy = wy - player.position.y;
      const d = Math.hypot(dx, dy);
      if (d > 0.4) { vx = dx / d; vy = dy / d; }
    }
    const speed = 9 + playerLen * 0.6;
    player.position.x = THREE.MathUtils.clamp(player.position.x + vx * speed * dt, -f.x + 1, f.x - 1);
    player.position.y = THREE.MathUtils.clamp(player.position.y + vy * speed * dt, -f.y + 1, f.y - 1);
    if (vx) player.rotation.y = vx > 0 ? Math.PI / 2 : -Math.PI / 2;
    player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, vy * 0.35 * (player.rotation.y > 0 ? 1 : -1), 0.12);
    player.position.z = 0;
    if (invuln > 0) {
      invuln -= dt;
      player.visible = Math.floor(t * 10) % 2 === 0;
    } else player.visible = true;

    // npc management
    const targetCount = 6 + Math.min(level, 6);
    if (npcs.length < targetCount && Math.random() < dt * 2.2) spawnNpc();
    for (let i = npcs.length - 1; i >= 0; i--) {
      const n = npcs[i], u = n.userData;
      n.position.x += u.dir * u.speed * dt;
      n.position.y += Math.sin(t * 1.7 + u.wob) * dt * 0.8;
      if (Math.abs(n.position.x) > f.x + u.len + 3) { scene.remove(n); npcs.splice(i, 1); continue; }
      // collision with player
      const d = n.position.distanceTo(player.position);
      const reach = (u.len + playerLen) * 0.42;
      if (d < reach) {
        if (u.len <= playerLen * 0.85) {
          scene.remove(n); npcs.splice(i, 1);
          eaten++; score += Math.round(u.len * 25) * level;
          playerLen = Math.min(playerLen * 1.045, 7);
          player.scale.setScalar(playerLen / 3);
          burst(n.position.x, n.position.y, 0xffd166);
          popup(n.position.x, n.position.y, '+' + Math.round(u.len * 25) * level);
          sfx.chomp();
          if (eaten % 10 === 0) { level++; sfx.grow(); popup(player.position.x, player.position.y + 2, 'LEVEL ' + level); }
        } else if (u.len >= playerLen * 1.15 && invuln <= 0) {
          lives--; sfx.hurt(); shake = 0.5;
          burst(player.position.x, player.position.y, 0xff4d6d);
          if (lives <= 0) { gameOver(); } else { invuln = 2.5; playerLen = Math.max(2.6, playerLen * 0.88); player.scale.setScalar(playerLen / 3); }
        }
      }
    }

    // angler predator: slow pursuit, occasional lunge; tail-nip bounty
    if (angler) {
      const au = angler.userData;
      au.t += dt;
      if (anglerFlee > 0) {
        anglerFlee -= dt;
        angler.position.x += (angler.position.x > player.position.x ? 1 : -1) * 8 * dt;
      } else {
        const dx = player.position.x - angler.position.x, dy = player.position.y - angler.position.y;
        const d = Math.hypot(dx, dy) || 1;
        const chase = 2.2 + level * 0.28 + (Math.sin(au.t * 0.7) > 0.82 ? 5 : 0);
        angler.position.x += (dx / d) * chase * dt;
        angler.position.y += (dy / d) * chase * dt * 0.75;
        angler.rotation.y = dx > 0 ? Math.PI / 2 : -Math.PI / 2;
        // caught the player
        if (d < (playerLen + 6.6) * 0.4 && invuln <= 0) {
          // tail nip check: player behind the angler's facing
          const behind = (angler.rotation.y > 0 && player.position.x < angler.position.x - 1.2) || (angler.rotation.y < 0 && player.position.x > angler.position.x + 1.2);
          if (behind) {
            score += 150 * level; anglerFlee = 2.2; sfx.nip();
            burst(angler.position.x, angler.position.y, 0x37f2c8);
            popup(angler.position.x, angler.position.y, 'TAIL NIP +' + 150 * level);
          } else {
            lives--; sfx.hurt(); shake = 0.7;
            burst(player.position.x, player.position.y, 0xff4d6d);
            if (lives <= 0) { gameOver(); } else { invuln = 3; angler.position.set(-f.x - 12, 8, 0); }
          }
        }
      }
      angler.position.y = THREE.MathUtils.clamp(angler.position.y, -f.y + 2, f.y - 2);
      angler.position.z = 0;
    }

    hud.innerHTML = 'GEM SHARK &middot; score <b>' + score + '</b> &middot; lives <b>' + '&#x1F48E;'.repeat(Math.max(lives, 0)) + '</b> &middot; size <b>' + playerLen.toFixed(1) + '</b> &middot; level <b>' + level + '</b>';
  }

  if (shake > 0) {
    shake -= dt;
    camera.position.x = (Math.random() - 0.5) * shake * 1.6;
    camera.position.y = (Math.random() - 0.5) * shake * 1.6;
  } else { camera.position.x = 0; camera.position.y = 0; }

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
