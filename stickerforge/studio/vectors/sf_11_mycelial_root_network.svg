<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Bioluminescent Mycelium Gradients -->
    <radialGradient id="mycelialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="60%" stop-color="#061a14"/>
      <stop offset="100%" stop-color="#010806"/>
    </radialGradient>

    <linearGradient id="hyphaeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="25%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#00dfd8"/>
      <stop offset="75%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="goldCapRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="mycoBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00dfd8" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#020806"/>

  <!-- DIE CUT STICKER CONTAINER -->
  <g transform="translate(400, 400)" filter="url(#mycoBloom)">
    <!-- White Die Cut Bleed Margin -->
    <circle cx="0" cy="0" r="375" fill="#ffffff"/>
    <circle cx="0" cy="0" r="365" fill="none" stroke="url(#hyphaeGlow)" stroke-width="8"/>
    <circle cx="0" cy="0" r="352" fill="url(#mycelialGlow)" stroke="url(#goldCapRim)" stroke-width="3"/>

    <!-- Concentric Spore Rings & Dial -->
    <circle cx="0" cy="0" r="335" fill="none" stroke="#065f46" stroke-width="1.5" stroke-dasharray="3,6"/>
    <circle cx="0" cy="0" r="270" fill="none" stroke="url(#goldCapRim)" stroke-width="1.8"/>

    <!-- SACRED MYCELIAL HYPHAE WEB (Neural Root Topology) -->
    <g stroke="url(#hyphaeGlow)" stroke-width="2" fill="none" opacity="0.85" stroke-linecap="round">
      <!-- Primary Dendritic Trunk Lines radiating from center -->
      <path d="M 0 0 Q -40 -80 -120 -120 Q -180 -150 -240 -180"/>
      <path d="M -120 -120 Q -100 -180 -140 -240"/>
      <path d="M -120 -120 Q -180 -100 -250 -110"/>

      <path d="M 0 0 Q 40 -80 120 -120 Q 180 -150 240 -180"/>
      <path d="M 120 -120 Q 100 -180 140 -240"/>
      <path d="M 120 -120 Q 180 -100 250 -110"/>

      <path d="M 0 0 Q -80 20 -150 60 Q -210 100 -260 160"/>
      <path d="M -150 60 Q -160 130 -220 190"/>
      <path d="M -150 60 Q -120 120 -160 210"/>

      <path d="M 0 0 Q 80 20 150 60 Q 210 100 260 160"/>
      <path d="M 150 60 Q 160 130 220 190"/>
      <path d="M 150 60 Q 120 120 160 210"/>

      <path d="M 0 0 Q 0 90 0 180 Q -40 240 -80 280"/>
      <path d="M 0 180 Q 40 240 80 280"/>
      <path d="M 0 0 Q 0 -90 0 -180 Q -30 -230 -60 -270"/>
      <path d="M 0 -180 Q 30 -230 60 -270"/>

      <!-- Cross-Connecting Synaptic Bridges (Anastomosis) -->
      <path d="M -100 -180 Q 0 -150 100 -180" stroke-width="1.2" stroke-dasharray="2,4"/>
      <path d="M -180 -100 Q -150 0 -180 100" stroke-width="1.2" stroke-dasharray="2,4"/>
      <path d="M 180 -100 Q 150 0 180 100" stroke-width="1.2" stroke-dasharray="2,4"/>
      <path d="M -120 120 Q 0 150 120 120" stroke-width="1.2" stroke-dasharray="2,4"/>
    </g>

    <!-- Bioluminescent Spore Nodes (Synaptic Terminal Dots) -->
    <g fill="#00dfd8" filter="url(#mycoBloom)">
      <circle cx="-240" cy="-180" r="5"/><circle cx="240" cy="-180" r="5"/>
      <circle cx="-140" cy="-240" r="4"/><circle cx="140" cy="-240" r="4"/>
      <circle cx="-250" cy="-110" r="4"/><circle cx="250" cy="-110" r="4"/>
      <circle cx="-260" cy="160" r="5"/><circle cx="260" cy="160" r="5"/>
      <circle cx="-220" cy="190" r="4"/><circle cx="220" cy="190" r="4"/>
      <circle cx="-80" cy="280" r="5"/><circle cx="80" cy="280" r="5"/>
      <circle cx="-60" cy="-270" r="4"/><circle cx="60" cy="-270" r="4"/>
    </g>

    <!-- CENTRAL TRINITY: Ancient Old-Growth Cedar Stump & Sacred Mushrooms -->
    <g transform="translate(0, 15)">
      <!-- Gnarled Ancient Cedar Stump Base -->
      <path d="M -65 60 C -80 30 -60 0 -50 -30 C -30 -40 30 -40 50 -30 C 60 0 80 30 65 60 Z" fill="#2d1b0e" stroke="#160c06" stroke-width="3"/>
      <!-- Growth Rings on Stump Top -->
      <ellipse cx="0" cy="-30" rx="50" ry="18" fill="#543319" stroke="#784723" stroke-width="2"/>
      <ellipse cx="0" cy="-30" rx="35" ry="12" fill="none" stroke="#784723" stroke-width="1.5"/>
      <ellipse cx="0" cy="-30" rx="20" ry="7" fill="none" stroke="#784723" stroke-width="1"/>
      <circle cx="0" cy="-30" r="4" fill="#fbbf24"/>

      <!-- Pair of Sacred Psilocybe / Fungal Caps rising from stump -->
      <!-- Left Stipe & Cap -->
      <path d="M -20 -30 Q -35 -70 -25 -110" fill="none" stroke="#f1f5f9" stroke-width="5" stroke-linecap="round"/>
      <path d="M -55 -110 C -55 -145 5 -145 5 -110 Q -25 -95 -55 -110 Z" fill="#b45309" stroke="url(#goldCapRim)" stroke-width="2.5"/>
      <circle cx="-25" cy="-125" r="4" fill="#fbbf24"/>
      <circle cx="-40" cy="-115" r="2.5" fill="#fef08a"/>
      <circle cx="-10" cy="-115" r="2.5" fill="#fef08a"/>

      <!-- Right Tall Golden Cap -->
      <path d="M 15 -30 Q 30 -80 20 -130" fill="none" stroke="#f1f5f9" stroke-width="6" stroke-linecap="round"/>
      <path d="M -15 -130 C -15 -175 55 -175 55 -130 Q 20 -115 -15 -130 Z" fill="#d97706" stroke="url(#goldCapRim)" stroke-width="2.5"/>
      <circle cx="20" cy="-150" r="5" fill="#fef08a"/>
      <circle cx="5" cy="-135" r="3" fill="#fef08a"/>
      <circle cx="35" cy="-135" r="3" fill="#fef08a"/>

      <!-- Glowing Spore Cloud rising from gills -->
      <g fill="#34d399" opacity="0.8">
        <circle cx="20" cy="-185" r="2"/><circle cx="10" cy="-195" r="3"/><circle cx="30" cy="-198" r="2"/>
        <circle cx="20" cy="-210" r="2.5"/><circle cx="5" cy="-215" r="1.5"/><circle cx="25" cy="-225" r="2"/>
      </g>
    </g>

    <!-- ARCHED TYPOGRAPHY -->
    <path id="mycoArcTop" d="M -260 0 A 260 260 0 1 1 260 0" fill="none"/>
    <text font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="21" fill="url(#goldCapRim)" letter-spacing="5" text-anchor="middle">
      <textPath href="#mycoArcTop" startOffset="50%">MYCELIAL NEURAL NETWORK</textPath>
    </text>

    <path id="mycoArcBottom" d="M 260 0 A 260 260 0 0 1 -260 0" fill="none"/>
    <text font-family="'Inter', sans-serif" font-weight="900" font-size="15" fill="#00dfd8" letter-spacing="3" text-anchor="middle">
      <textPath href="#mycoArcBottom" startOffset="50%">DEEPER THAN ROOTS • WILLAMETTE VALLEY</textPath>
    </text>

    <!-- Edge Spore Pips -->
    <circle cx="-290" cy="0" r="5" fill="#fbbf24"/>
    <circle cx="290" cy="0" r="5" fill="#fbbf24"/>
  </g>
</svg>
