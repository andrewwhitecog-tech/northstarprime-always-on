<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Government Manila Folder / Aged Paper Background -->
    <linearGradient id="manilaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5ede0"/>
      <stop offset="60%" stop-color="#e8dcbe"/>
      <stop offset="100%" stop-color="#d8c59d"/>
    </linearGradient>

    <!-- Red Ink Stamp Filter -->
    <filter id="stampDistress">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#7f1d1d" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#manilaBg)"/>

  <!-- Document Paper Sheet Margin -->
  <rect x="40" y="40" width="720" height="920" fill="#fdfbf7" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- TOP SECRET HEADER WATERMARK -->
  <g transform="translate(400, 85)">
    <text font-family="'Courier New', monospace" font-weight="900" font-size="22" fill="#ef4444" letter-spacing="4" text-anchor="middle">TOP SECRET // MAJESTIC-12 // EYES ONLY</text>
    <line x1="-300" y1="12" x2="300" y2="12" stroke="#ef4444" stroke-width="2"/>
    <text font-family="'Courier New', monospace" font-size="10" fill="#64748b" text-anchor="middle" y="28">NATIONAL ARCHIVES DECLASSIFICATION CASE FILE NO: OR-420-VORATH-77</text>
  </g>

  <!-- RED RUBBER DECLASSIFIED STAMP (Angled) -->
  <g transform="translate(620, 160) rotate(-14)" filter="url(#stampDistress)">
    <rect x="-110" y="-35" width="220" height="70" rx="6" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="8,2"/>
    <text font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="22" fill="#dc2626" letter-spacing="2" text-anchor="middle" y="-6">DECLASSIFIED</text>
    <text font-family="'Courier New', monospace" font-weight="800" font-size="11" fill="#dc2626" text-anchor="middle" y="16">AUTH: EXECUTIVE ORDER 420</text>
  </g>

  <!-- MEMORANDUM DETAILS BLOCK -->
  <g transform="translate(80, 160)" font-family="'Courier New', monospace" font-size="13" fill="#0f172a">
    <text y="0"><tspan font-weight="900">DATE:</tspan> SEPTEMBER 14, 2026</text>
    <text y="22"><tspan font-weight="900">TO:</tspan> SPECIAL AGENT IN CHARGE, PORTLAND FIELD OFFICE</text>
    <text y="44"><tspan font-weight="900">FROM:</tspan> DIVISION OF EXTRATERRESTRIAL BOTANICAL SURVEILLANCE</text>
    <text y="66"><tspan font-weight="900">SUBJECT:</tspan> ANOMALOUS TERPENE EMISSIONS AT CASCADIA BASIN</text>
    <line x1="0" y1="80" x2="640" y2="80" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- BODY REPORT WITH HEAVY REDACTIONS -->
  <g transform="translate(80, 280)" font-family="'Courier New', monospace" font-size="13" fill="#1e293b" line-height="1.6">
    
    <!-- Paragraph 1 -->
    <text y="0">1. On 08/19/2026, satellite spectral sensors detected massive concentrations</text>
    <text y="22">of monoterpenes radiating from the facility designated as <tspan font-weight="900">"THE TWILIGHT SOLARIUM"</tspan></text>
    <text y="44">located along the Pacific Northwest Solarium corridor, Oregon.</text>
    
    <!-- Redaction Bar 1 -->
    <rect x="0" y="58" width="520" height="18" fill="#000000"/>
    <text x="530" y="72">confirmed.</text>

    <!-- Redaction Bar 2 -->
    <rect x="0" y="80" width="640" height="18" fill="#000000"/>
    
    <!-- Paragraph 2 -->
    <text y="125">2. Surveillance team dispatched to perimeter. Operatives report sighting a</text>
    <text y="147"><tspan font-weight="900">large, semi-aquatic rodent (suspected Castor canadensis)</tspan> wearing a heavy-duty</text>
    <text y="169">red buffalo plaid flannel shirt, expertly operating a 20-ton hydraulic</text>
    <text y="191">solventless hash rosin press behind reinforced cedarwood walls.</text>

    <!-- Redaction Bar 3 -->
    <rect x="0" y="205" width="420" height="18" fill="#000000"/>
    <text x="430" y="219">and smelled of guava.</text>

    <!-- Paragraph 3 -->
    <text y="260">3. A secondary entity, approximately 7 feet in height with pearlescent grey skin</text>
    <text y="282">and luminous amethyst ocular organs, was observed telepathically communicating</text>
    <text y="304">with retail customers over an illuminated bridge vibrating at exactly <tspan font-weight="900">432 Hz</tspan>.</text>

    <!-- Redaction Bar 4 -->
    <rect x="0" y="318" width="640" height="18" fill="#000000"/>
    <rect x="0" y="340" width="380" height="18" fill="#000000"/>

    <!-- Paragraph 4 (Punchline) -->
    <text y="395">4. FIELD AGENT CONCLUSION &amp; RECOMMENDATION:</text>
    <text y="420" fill="#b91c1c" font-weight="900">"Tactical raid is strictly contraindicated. Both undercover agents</text>
    <text y="442" fill="#b91c1c" font-weight="900">consumed one artisanal pre-roll and have refused to leave the Solarium</text>
    <text y="464" fill="#b91c1c" font-weight="900">living wall lounge. They describe the Void Kush as 'indescribably sublime'.</text>
    <text y="486" fill="#b91c1c" font-weight="900">Requesting agency budget authorization to purchase two more ounces."</text>
  </g>

  <!-- OFFICIAL FINGERPRINT & SIGNATURE BLOCK -->
  <g transform="translate(100, 830)">
    <!-- Fingerprint smudge -->
    <ellipse cx="60" cy="40" rx="25" ry="35" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="2,3" opacity="0.5"/>
    <text x="60" y="90" font-family="'Courier New', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">BIOMETRIC EVIDENCE</text>

    <!-- Signature line -->
    <path d="M 380 40 Q 420 10 460 35 Q 500 55 540 25 T 600 45" fill="none" stroke="#1e3a8a" stroke-width="2.5"/>
    <line x1="360" y1="50" x2="620" y2="50" stroke="#000000" stroke-width="1.5"/>
    <text x="490" y="68" font-family="'Courier New', monospace" font-weight="700" font-size="11" fill="#0f172a" text-anchor="middle">SPECIAL INVESTIGATOR FOX M.</text>
    <text x="490" y="84" font-family="'Courier New', monospace" font-size="9" fill="#64748b" text-anchor="middle">SPECIAL PHYTOSANITARY PHENOMENA UNIT</text>
  </g>

  <!-- BOTTOM FOOTER WARNING -->
  <g transform="translate(400, 955)">
    <text font-family="'Courier New', monospace" font-weight="900" font-size="12" fill="#ef4444" letter-spacing="3" text-anchor="middle">TOP SECRET // DECLASSIFIED UNDER FREEDOM OF INFORMATION ACT</text>
  </g>
</svg>
