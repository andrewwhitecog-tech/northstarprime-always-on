<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="federationGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="holoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00dfd8"/>
      <stop offset="25%" stop-color="#7928ca"/>
      <stop offset="50%" stop-color="#ff0080"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#00dfd8"/>
    </linearGradient>

    <radialGradient id="credentialPlate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <filter id="fedShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#03050c"/>

  <!-- DIE-CUT OCTAGONAL CREDENTIAL -->
  <g transform="translate(400, 400)" filter="url(#fedShadow)">
    <!-- White Die-Cut Vinyl Bleed Outline (Octagon) -->
    <polygon points="-155,-375 155,-375 375,-155 375,155 155,375 -155,375 -375,155 -375,-155" fill="#ffffff"/>
    
    <!-- Holographic Rainbow Foil Bezel -->
    <polygon points="-150,-365 150,-365 365,-150 365,150 150,365 -150,365 -365,150 -365,-150" fill="none" stroke="url(#holoBorder)" stroke-width="8"/>

    <!-- Dark Metal Plaque Body -->
    <polygon points="-142,-350 142,-350 350,-142 350,142 142,350 -142,350 -350,142 -350,-142" fill="url(#credentialPlate)" stroke="url(#federationGold)" stroke-width="3"/>

    <!-- Security Microprint Ring -->
    <circle cx="0" cy="0" r="310" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,6"/>
    <circle cx="0" cy="0" r="230" fill="none" stroke="url(#federationGold)" stroke-width="2"/>

    <!-- TOP HEADER -->
    <g transform="translate(0, -260)">
      <text x="0" y="0" font-family="'Cinzel', 'Arial Black', sans-serif" font-weight="900" font-size="21" fill="url(#federationGold)" letter-spacing="4" text-anchor="middle">GALACTIC FEDERATION</text>
      <text x="0" y="22" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#38bdf8" letter-spacing="3" text-anchor="middle">DEPARTMENT OF EXTRATERRESTRIAL BOTANY</text>
    </g>

    <!-- CENTRAL EMBLEM: Interstellar Compass, Vorath Star & Cannabis Colas -->
    <g transform="translate(0, -15)">
      <!-- Alien Glyphs / Runes Ring -->
      <circle cx="0" cy="0" r="170" fill="none" stroke="url(#federationGold)" stroke-width="1.5" stroke-dasharray="10,12"/>
      
      <!-- 8-Point Compass Star -->
      <polygon points="0,-160 14,-35 35,-14 160,0 35,14 14,35 0,160 -14,35 -35,14 -160,0 -35,-14 -14,-35" fill="none" stroke="url(#federationGold)" stroke-width="2.5"/>

      <!-- Golden Cannabis Leaf Cluster -->
      <g fill="#10b981" stroke="url(#federationGold)" stroke-width="1.5">
        <path d="M 0 30 C -12 -5 -10 -70 0 -85 C 10 -70 12 -5 0 30 Z"/>
        <path d="M 0 35 C -25 5 -55 -25 -65 -50 C -52 -48 -20 -15 0 35 Z"/>
        <path d="M 0 35 C 25 5 55 -25 65 -50 C 52 -48 20 -15 0 35 Z"/>
        <path d="M 0 40 C -35 25 -75 10 -85 -10 C -70 -8 -30 15 0 40 Z"/>
        <path d="M 0 40 C 35 25 75 10 85 -10 C 70 -8 30 15 0 40 Z"/>
      </g>

      <!-- Center Holographic Seed Capsule -->
      <circle cx="0" cy="20" r="16" fill="url(#holoBorder)"/>
      <circle cx="0" cy="20" r="8" fill="#ffffff"/>
    </g>

    <!-- CREDENTIAL LICENSE METRICS (Lower Block) -->
    <g transform="translate(0, 160)">
      <rect x="-240" y="0" width="480" height="120" rx="8" fill="#090d16" stroke="url(#federationGold)" stroke-width="1.5"/>

      <text x="-210" y="28" font-family="'Courier New', monospace" font-weight="700" font-size="12" fill="#94a3b8">LICENSE NO: <tspan fill="#fef08a">GF-77-OR-420-CDC</tspan></text>
      <text x="-210" y="52" font-family="'Courier New', monospace" font-weight="700" font-size="12" fill="#94a3b8">SECTOR: <tspan fill="#38bdf8">07-CASCADE (TERRA/SOL)</tspan></text>
      <text x="-210" y="76" font-family="'Courier New', monospace" font-weight="700" font-size="12" fill="#94a3b8">FACILITY: <tspan fill="#f8fafc">10015 SW HALL BLVD</tspan></text>
      <text x="-210" y="100" font-family="'Courier New', monospace" font-weight="700" font-size="12" fill="#94a3b8">CLASS: <tspan fill="#34d399">GRADE-A COSMIC BOTANICAL</tspan></text>

      <!-- Official Interstellar Security Seal Stamp -->
      <circle cx="170" cy="60" r="42" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,4"/>
      <text x="170" y="54" font-family="'Impact', sans-serif" font-weight="900" font-size="13" fill="#ef4444" text-anchor="middle">APPROVED</text>
      <text x="170" y="72" font-family="'Courier New', monospace" font-size="8" fill="#ef4444" text-anchor="middle">VORATH-77</text>
    </g>

    <!-- Bottom Status Text -->
    <text x="0" y="325" font-family="'Inter', sans-serif" font-weight="900" font-size="12" fill="#64748b" letter-spacing="3" text-anchor="middle">INTERSTELLAR COMMERCE VALIDATED • MULTI-REALM</text>
  </g>
</svg>
