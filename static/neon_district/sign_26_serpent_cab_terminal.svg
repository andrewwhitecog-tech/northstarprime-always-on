  <g filter="url(#soft)" opacity="0.72"><path d="M180 870 C420 760 620 755 800 830 C980 755 1180 760 1420 870" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="8"/><path d="M255 270 L1345 270" stroke="#ffffff" stroke-opacity="0.10" stroke-width="5"/></g>
  <g filter="url(#glow)">
    <text x="800" y="520" text-anchor="middle" font-family="Space Grotesk, Arial Black, sans-serif" font-size="126" font-weight="900" letter-spacing="8" fill="none" stroke="url(#tube)" stroke-width="8">SERPENT CAB</text>
