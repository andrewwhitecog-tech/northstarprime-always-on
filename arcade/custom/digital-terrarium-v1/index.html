<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Terrarium // Blindsight Edition</title>
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#000;overflow:hidden;font-family:'Courier New',monospace;cursor:none;}canvas{display:block;}#hud{position:fixed;top:0;left:0;width:100%;padding:10px 20px;color:#1a3a2a;font-size:11px;z-index:10;pointer-events:none;display:flex;justify-content:space-between;opacity:0.7;}#hud.active{color:#2a8a5a;opacity:1;}#hud span{display:inline-block;min-width:120px;}#cursor{position:fixed;width:20px;height:20px;border:1px solid rgba(40,180,120,0.3);border-radius:50%;pointer-events:none;z-index:100;transform:translate(-50%,-50%);transition:border-color 0.3s;}#cursor.near{border-color:rgba(200,60,60,0.6);box-shadow:0 0 10px rgba(200,60,60,0.2);}#info{position:fixed;bottom:20px;left:20px;color:#1a4a3a;font-size:10px;z-index:10;pointer-events:none;max-width:300px;line-height:1.6;opacity:0;transition:opacity 0.5s;}#info.visible{opacity:0.8;}#depth-gauge{position:fixed;right:20px;top:50%;transform:translateY(-50%);width:3px;height:200px;background:rgba(20,60,40,0.3);z-index:10;}#depth-marker{width:9px;height:2px;background:#2a8a5a;position:absolute;left:-3px;transition:top 0.5s;}#classification{position:fixed;bottom:20px;right:20px;color:#1a3a2a;font-size:9px;z-index:10;pointer-events:none;text-align:right;opacity:0.5;}#boot{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:1000;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#1a4a3a;font-size:12px;transition:opacity 1s;}#boot.done{opacity:0;pointer-events:none;}#boot div{margin:4px 0;opacity:0;}.nsp-return{position:fixed;z-index:10050;top:10px;left:10px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}.nsp-return a{pointer-events:auto;min-height:40px;padding:0 12px;display:inline-grid;place-items:center;border-radius:5px;text-decoration:none;font:800 10px/1 Inter,Segoe UI,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(102,247,237,.45);background:linear-gradient(145deg,rgba(3,7,16,.92),rgba(10,8,24,.8));color:#66f7ed;backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,.35)}.nsp-return a:hover{border-color:#f7ce66;color:#f7ce66}.nsp-return a.secondary{border-color:rgba(148,163,184,.35);color:#94a3b8;font-weight:700}.nsp-return a.secondary:hover{border-color:#66f7ed;color:#66f7ed}</style>
</head>
<body>
<nav class="nsp-return" aria-label="Return navigation"><a href="/digital-terrarium/">&larr; Terrarium hub</a><a class="secondary" href="/arcade/">Arcade</a></nav>
<div id="boot"></div>
<div id="hud">
  <span id="pop">POP: 0</span>
  <span id="gen">GEN: 0</span>
  <span id="biomass">BIOMASS: 0.00</span>
  <span id="entropy">ENTROPY: 0.00</span>
  <span id="epoch">EPOCH: 0</span>
</div>
<div id="cursor"></div>
<div id="info"></div>
<div id="depth-gauge"><div id="depth-marker"></div></div>
<div id="classification">
  THESEUS DEEP-FIELD OBSERVATORY<br>
  CLASSIFICATION: WATTS-7 BIOME<br>
  STATUS: MONITORING
</div>
<canvas id="c"></canvas>
<script src="game.min.js"></script>
</body>
</html>
