<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- CRT Curved Screen & Scanline Grid -->
    <linearGradient id="crtGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1b3d"/>
      <stop offset="50%" stop-color="#050d1e"/>
      <stop offset="100%" stop-color="#02050b"/>
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000000" stroke-width="1.5" opacity="0.45"/>
    </pattern>

    <filter id="pixelGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7928ca" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#000000"/>

  <!-- CRT Monitor Bezel & Curved Screen -->
  <rect x="20" y="20" width="760" height="560" rx="45" fill="url(#crtGlass)" stroke="#334155" stroke-width="12"/>
  <rect x="25" y="25" width="750" height="550" rx="40" fill="url(#scanlines)"/>

  <!-- CRT Screen Glare Arc -->
  <path d="M 50 50 Q 400 30 750 50 Q 720 120 700 130 Q 400 100 80 130 Z" fill="#ffffff" opacity="0.06"/>

  <!-- 16-BIT RETRO GAME LOADING SCREEN CONTENT -->
  <g transform="translate(400, 80)">
    <!-- Game Logo Header -->
    <text font-family="'Courier New', monospace" font-weight="900" font-size="34" fill="#00f0ff" text-anchor="middle" letter-spacing="4" filter="url(#pixelGlow)">CONSCIOUSNESS v4.20</text>
    <text font-family="'Courier New', monospace" font-weight="700" font-size="14" fill="#fed41d" text-anchor="middle" letter-spacing="2" y="30">PSYCHONAUT ADVENTURE SYSTEM • Cascadia Solarium Corridor</text>
  </g>

  <!-- PIXEL ART BLAZIN' BEAVER & VORATH ALIEN AVATARS (Center Box) -->
  <g transform="translate(180, 220)">
    <!-- Memory Card Slot 1 Box -->
    <rect x="-120" y="-80" width="240" height="150" rx="8" fill="#090d16" stroke="#00f0ff" stroke-width="2"/>
    <text x="0" y="-55" font-family="'Courier New', monospace" font-weight="900" font-size="12" fill="#fed41d" text-anchor="middle">[SLOT 1: OREGON TERPS]</text>
    
    <!-- 16-Bit Pixel Beaver Head -->
    <rect x="-24" y="-36" width="48" height="48" fill="#854d0e"/>
    <!-- Red Flannel Shoulders -->
    <rect x="-36" y="12" width="72" height="24" fill="#b91c1c"/>
    <rect x="-12" y="12" width="24" height="24" fill="#18181b"/>
    <!-- Orange Teeth -->
    <rect x="-8" y="-4" width="7" height="12" fill="#ea580c"/>
    <rect x="1" y="-4" width="7" height="12" fill="#ea580c"/>
    <!-- Eyes -->
    <rect x="-18" y="-24" width="8" height="8" fill="#fef08a"/>
    <rect x="10" y="-24" width="8" height="8" fill="#fef08a"/>
    <!-- Pipe -->
    <rect x="18" y="-6" width="22" height="6" fill="#78350f"/>
    <rect x="36" y="-16" width="8" height="12" fill="#ea580c"/>

    <text x="0" y="55" font-family="'Courier New', monospace" font-size="11" fill="#34d399" text-anchor="middle">LEVEL 99 HYDRAULICS</text>
  </g>

  <g transform="translate(620, 220)">
    <!-- Memory Card Slot 2 Box -->
    <rect x="-120" y="-80" width="240" height="150" rx="8" fill="#090d16" stroke="#c084fc" stroke-width="2"/>
    <text x="0" y="-55" font-family="'Courier New', monospace" font-weight="900" font-size="12" fill="#fed41d" text-anchor="middle">[SLOT 2: VORATH SEED]</text>
    
    <!-- 16-Bit Pixel Grey Alien Head -->
    <polygon points="0,-40 -28,-10 -15,18 15,18 28,-10" fill="#94a3b8"/>
    <!-- Amethyst Pixel Eyes -->
    <polygon points="-20,-12 -8,-12 -4,-4 -16,-4" fill="#a855f7"/>
    <polygon points="20,-12 8,-12 4,-4 16,-4" fill="#a855f7"/>
    <!-- Merkaba Halo -->
    <circle cx="0" cy="-10" r="32" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="3,3"/>

    <text x="0" y="55" font-family="'Courier New', monospace" font-size="11" fill="#c084fc" text-anchor="middle">ASTRAL FREQUENCY: 432Hz</text>
  </g>

  <!-- PROGRESS LOADING BAR (Center) -->
  <g transform="translate(400, 365)">
    <text font-family="'Courier New', monospace" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" y="-12">LOADING TERPENE RECEPTORS... 77%</text>
    
    <!-- Outer Bar Container -->
    <rect x="-280" y="0" width="560" height="28" rx="6" fill="#090d16" stroke="#00f0ff" stroke-width="2"/>
    <!-- Progress Fill (Segmented 16-bit blocks) -->
    <g fill="#00f0ff">
      <rect x="-274" y="5" width="28" height="18"/>
      <rect x="-242" y="5" width="28" height="18"/>
      <rect x="-210" y="5" width="28" height="18"/>
      <rect x="-178" y="5" width="28" height="18"/>
      <rect x="-146" y="5" width="28" height="18"/>
      <rect x="-114" y="5" width="28" height="18"/>
      <rect x="-82" y="5" width="28" height="18"/>
      <rect x="-50" y="5" width="28" height="18"/>
      <rect x="-18" y="5" width="28" height="18"/>
      <rect x="14" y="5" width="28" height="18"/>
      <rect x="46" y="5" width="28" height="18"/>
      <rect x="78" y="5" width="28" height="18"/>
      <rect x="110" y="5" width="28" height="18"/>
    </g>
  </g>

  <!-- RETRO GAMEPLAY HINT BOX (Bottom) -->
  <g transform="translate(400, 465)">
    <rect x="-340" y="-35" width="680" height="70" rx="8" fill="#090d16" stroke="#fed41d" stroke-width="1.5"/>
    <text font-family="'Courier New', monospace" font-weight="900" font-size="12" fill="#fed41d" text-anchor="middle" y="-12">★ PRO-TIP FOR ASTRAL EXPLORERS ★</text>
    <text font-family="'Courier New', monospace" font-size="11" fill="#cbd5e1" text-anchor="middle" y="8">β-Myrcene increases blood-brain barrier permeability.</text>
    <text font-family="'Courier New', monospace" font-size="11" fill="#38bdf8" text-anchor="middle" y="24">Drink artesian Oregon spring water to avoid the cottonmouth debuff.</text>
  </g>

  <!-- BLINKING "PRESS START" -->
  <text x="400" y="545" font-family="'Courier New', monospace" font-weight="900" font-size="15" fill="#f43f5e" text-anchor="middle" letter-spacing="3">PRESS START TO RE-ENTER REALITY</text>
</svg>
