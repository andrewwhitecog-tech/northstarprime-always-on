name: Storefront conversion audit
on:
  push:
    branches: [qa/visitor-release-20261127]
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        width: [390, 1280]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      WIDTH: ${{ matrix.width }}
    steps:
      - run: python -m pip -q install playwright requests beautifulsoup4
      - shell: python
        run: |
          import os
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright
          width=int(os.environ['WIDTH'])
          with sync_playwright() as pw:
              b=pw.chromium.launch(executable_path='/usr/bin/google-chrome',args=['--disable-gpu'])
              ctx=b.new_context(viewport={'width':width,'height':840},is_mobile=(width==390),has_touch=(width==390))
              p=ctx.new_page()
              def accessible_resources(r):
                  h=urlsplit(r.request.url).hostname or ''
                  if r.request.method in ('GET','HEAD') and (h in ['andrewcog.gumroad.com','gumroad.com','assets.gumroad.com','assets.gumroad.net','public-files.gumroad.com','static-2.gumroad.com','static.gumroad.com']) and not any(x in r.request.url.lower() for x in ('telemetry','/tracking','analytics')):
                      r.continue_()
                  else:r.abort()
              ctx.route('**/*',accessible_resources)
              p.goto('https://andrewcog.gumroad.com/l/pshjy',wait_until='domcontentloaded')
              buy=p.get_by_text('I want this!',exact=True).first
              buy.wait_for(state='visible',timeout=18000)
              print('BILLING_ENTRY',buy.evaluate("e=>[e.tagName,e.closest('a')?.href,e.getAttribute('type')]"),flush=True)
              buy.click()
              p.wait_for_timeout(1800)
              print('CART_STATUS',p.url.split('?')[0],p.locator('h1,h2,h3').all_inner_texts()[:10],p.locator('input[type=email]').count(),flush=True)
              txt=p.locator('body').inner_text()
              print('CART_REVIEW',('VORATH Tarot' in txt),('$12' in txt),('Checkout' in txt or 'checkout' in p.url),flush=True)
              assert '/checkout' in p.url and 'VORATH Tarot' in txt and '$12' in txt
              b.close()
