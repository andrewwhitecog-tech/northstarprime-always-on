<script>
// ============================================================================
// RECORDED HQ AUDIO ENGINE (Zero Oscillators / Zero Synth — Rule 10-16)
// ============================================================================
// ElevenLabs SFX + Suno Tracks Register:
// - spin_start: audio/spin_start.mp3 (ElevenLabs abyssal hydro-lever pull)
// - reel_stop:  audio/reel_stop.mp3  (ElevenLabs crystal reef lock click)
// - win:        audio/win.mp3        (ElevenLabs biolume chime)
// - bigwin:     audio/bigwin.mp3     (ElevenLabs deep treasure cascade)
// - jackpot:    audio/jackpot.mp3    (ElevenLabs mythic Kraken surge fanfare)
// - scatter:    audio/scatter.mp3    (ElevenLabs Eye of the Deep portal pulse)
// - bet_step:   audio/bet_step.mp3   (ElevenLabs token step)
// - music_main: /arcade/custom/audio/idg_cues/pinball_bed.mp3 (Suno biolume synthwave)
// - music_boss: /arcade/custom/audio/idg_cues/skillshot.mp3   (Suno Kraken boss)
const AUDIO = (() => {
  const sfxFiles = {
    spin_start: 'audio/spin_start.mp3',
    reel_stop: 'audio/reel_stop.mp3',
    win: 'audio/win.mp3',
    bigwin: 'audio/bigwin.mp3',
    jackpot: 'audio/jackpot.mp3',
    scatter: 'audio/scatter.mp3',
    bet_step: 'audio/bet_step.mp3'
  };
  const pools = {};
  let muted = false;
  let unlocked = false;
  try { muted = localStorage.getItem('nsp_slots_biolume_mute') === '1'; } catch(e){}

  const musicMain = new Audio('/arcade/custom/audio/idg_cues/pinball_bed.mp3');
  musicMain.loop = true; musicMain.volume = 0.36;
  const musicBoss = new Audio('/arcade/custom/audio/idg_cues/skillshot.mp3');
  musicBoss.loop = true; musicBoss.volume = 0.42;
  let activeMusic = musicMain;

  for (const [k, src] of Object.entries(sfxFiles)) {
    const a = new Audio(src);
    a.preload = 'auto';
    pools[k] = a;
  }

  function syncMuteUI() {
    const btn = document.getElementById('mute-btn');
    if (btn) btn.textContent = muted ? 'SOUND: OFF' : 'SOUND: ON';
    musicMain.muted = muted;
    musicBoss.muted = muted;
  }
  setTimeout(syncMuteUI, 0);

  function unlock() {
    if (unlocked) return;
    unlocked = true;
    if (!muted && !document.hidden) activeMusic.play().catch(()=>{});
  }

  function play(key, vol = 0.85) {
    if (muted || document.hidden) return;
    const base = pools[key];
    if (!base) return;
    try {
      const clone = base.cloneNode();
      clone.volume = Math.min(1, Math.max(0, vol));
      clone.play().catch(()=>{});
    } catch(e){}
  }

  function setBossMusic(isBoss) {
    const next = isBoss ? musicBoss : musicMain;
    if (next === activeMusic) return;
    try { activeMusic.pause(); } catch(e){}
    activeMusic = next;
    activeMusic.muted = muted;
    if (unlocked && !muted && !document.hidden) {
      activeMusic.currentTime = 0;
      activeMusic.play().catch(()=>{});
    }
  }

  function toggle() {
    muted = !muted;
    try { localStorage.setItem('nsp_slots_biolume_mute', muted ? '1' : '0'); } catch(e){}
    syncMuteUI();
    if (!muted && unlocked && !document.hidden) activeMusic.play().catch(()=>{});
    else try { activeMusic.pause(); } catch(e){}
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { try { activeMusic.pause(); } catch(e){} }
    else if (unlocked && !muted) { activeMusic.play().catch(()=>{}); }
  });

  return { unlock, play, toggle, setBossMusic };
})();

// ============================================================================

atlasImg.src = 'art/biolume_reels_atlas_v01.png';

  { id:'wave',     col:0, row:2, name:'TIDAL CREST',           weight:11, pays:[0,0,0,3,8,35],     glow:'#60a5fa' },
  { id:'sigil',    col:1, row:2, name:'NORTHSTAR SIGIL',       weight:12, pays:[0,0,0,2,6,25],     glow:'#a78bfa' },
  { id:'scatter',  col:2, row:2, name:'EYE OF THE DEEP',       weight:4,  pays:[0,0,0,6,25,120],   glow:'#4effb5' }

  { id:1, name:'II. TWILIGHT TRENCH (1.5KM)',unlockAt:6500,  mult:1.25,sky:'#081534', deep:'#030716' },

let tokens = 5000, betPerLine = 1, totalBet = 20;

let surge = 0; // 0..100 Biolume Surge meter
let freeSpins = 0;
let krakenMaxHp = 2500, krakenHp = 2500, krakenDefeated = false;
let jackpot = 25000;
let heldReels = [false, false, false, false, false];
let nudgeAvailable = true;
let spinning = false, autoSpin = false;

// 5 reels x 3 rows grid + per-reel animation state
const reelStrips = Array.from({length: 5}, () => {
  const s = [];
  SYMBOLS.forEach(sym => { for (let i = 0; i < sym.weight; i++) s.push(sym); });
  for (let i = s.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [s[i], s[j]] = [s[j], s[i]];
  }
  return s;
});

let grid = [[],[],[],[],[]];
let reelAnim = [0,0,0,0,0]; // remaining spin frames per reel
let winHighlights = []; // [{reel, row, color}]
let winningPaylines = [];
let hitStopFrames = 0;
const particles = [];
const floatingTexts = [];

function randomSym(r) {
  const st = reelStrips[r];
  return st[Math.floor(Math.random() * st.length)];
}

function initGrid() {
  for (let r = 0; r < 5; r++) {
    grid[r] = [randomSym(r), randomSym(r), randomSym(r)];
  }
}

function loadSave() {
  try {
    const raw = localStorage.getItem('nsp_slots_biolume_v2');
    if (raw) {
      const d = JSON.parse(raw);
      tokens = Math.max(400, d.tokens || 5000);
      maxUnlockedZone = d.maxUnlockedZone || 0;
      krakenDefeated = !!d.krakenDefeated;
      jackpot = d.jackpot || 25000;
      if (d.stats) Object.assign(stats, d.stats);
    }
  } catch(e){}
}

function saveState() {
  if (tokens > stats.bestBank) stats.bestBank = tokens;
  for (let i = 1; i < ZONES.length; i++) {
    if (tokens >= ZONES[i].unlockAt && maxUnlockedZone < i) {
      maxUnlockedZone = i;
      AUDIO.play('scatter', 0.95);
      spawnFloating(`UNLOCKED ${ZONES[i].name}!`, '#4effb5', 430, 80);
    }
  }
  try {
    localStorage.setItem('nsp_slots_biolume_v2', JSON.stringify({
      tokens, maxUnlockedZone, krakenDefeated, jackpot, stats
    }));
  } catch(e){}
  renderZoneRibbon();
}

function renderZoneRibbon() {
  for (let i = 0; i < ZONES.length; i++) {
    const el = document.getElementById('zone-' + i);
    el.classList.toggle('unlocked', i <= maxUnlockedZone);
    el.classList.toggle('active', i === currentZone);
  }
}

function selectZone(idx) {
  AUDIO.unlock();
  if (spinning) return;
  if (idx > maxUnlockedZone) {
    setVerdict(`REACH ${ZONES[idx].unlockAt.toLocaleString()} TOKENS TO DIVE TO ${ZONES[idx].name}`);
    return;
  }
  currentZone = idx;
  AUDIO.play('bet_step', 0.8);
  AUDIO.setBossMusic(currentZone === 3);
  renderZoneRibbon();
  setVerdict(`ENTERED ${ZONES[idx].name} — PAYOUT MULTIPLIER ${ZONES[idx].mult}x`, true);
}

// BUILD PAINTED PAYTABLE DRAWER (Canvas Sprites from Atlas)

function buildPaytableDrawer() {
  const drawer = document.getElementById('paytable-drawer');
  drawer.innerHTML = '';
  SYMBOLS.forEach(sym => {
    const card = document.createElement('div');
    card.className = 'pt-card';
    const cv = document.createElement('canvas');
    cv.width = 64; cv.height = 64;
    if (atlasLoaded) {
      const ctx = cv.getContext('2d');
      const sw = atlasImg.width / 3, sh = atlasImg.height / 3;
      ctx.drawImage(atlasImg, sym.col * sw, sym.row * sh, sw, sh, 2, 2, 60, 60);
    }
    const meta = document.createElement('div');
    meta.className = 'pt-meta';
    meta.innerHTML = `<strong>${sym.name}</strong><span>5x = ${sym.pays[5]} | 4x = ${sym.pays[4]}</span>`;
    card.appendChild(cv);
    card.appendChild(meta);
    drawer.appendChild(card);
  });
}
atlasImg.onload = () => {
  atlasLoaded = true;
  buildPaytableDrawer();
};

function togglePaytable() {
  AUDIO.unlock();
  AUDIO.play('bet_step', 0.75);
  document.getElementById('paytable-drawer').classList.toggle('open');
}

// ============================================================================
// ABYSSAL HEADER CANVAS & 5-REEL MATRIX CANVAS (60FPS + HiDPI devicePixelRatio)
// ============================================================================
const abyssCanvas = document.getElementById('abyss-canvas');
const actx = abyssCanvas.getContext('2d');
const reelsCanvas = document.getElementById('reels-canvas');
const rctx = reelsCanvas.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
abyssCanvas.width = 920 * DPR;
abyssCanvas.height = 175 * DPR;
actx.scale(DPR, DPR);
reelsCanvas.width = 860 * DPR;
reelsCanvas.height = 270 * DPR;
rctx.scale(DPR, DPR);

const spores = Array.from({length: 42}, () => ({
  x: Math.random() * 920,
  y: Math.random() * 175,
  r: 1.5 + Math.random() * 3,
  vy: -0.4 - Math.random() * 0.9,
  col: ['#22d3ee','#f472b6','#4effb5','#fde047'][Math.floor(Math.random()*4)]
}));

function spawnParticles(x, y, color, count = 26) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1.5 + Math.random() * 5.5;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 2.5 + Math.random() * 3.5, color, alpha: 1 });
  }
}

function spawnFloating(text, color = '#fde047', x = 430, y = 135) {
  floatingTexts.push({ text, color, x, y, vy: -1.1, alpha: 1 });
}

function triggerShake() {
  const w = document.getElementById('game-wrap');
  w.classList.remove('shake');
  void w.offsetWidth;
  w.classList.add('shake');
}

function renderLoop(ts) {
  requestAnimationFrame(renderLoop);
  if (hitStopFrames > 0) { hitStopFrames--; return; }
  const t = ts * 0.001;

  // --- 1. Render Abyssal Parallax Header & Kraken Boss ---
  const AW = 920, AH = 175;
  const z = ZONES[currentZone];
  const g = actx.createLinearGradient(0, 0, 0, AH);
  g.addColorStop(0, z.sky);
  g.addColorStop(1, z.deep);
  actx.fillStyle = g;
  actx.fillRect(0, 0, AW, AH);

  // Volumetric god-rays from surface / Eye portal
  for (let i = 0; i < 5; i++) {
    const rx = 140 + i * 160 + Math.sin(t * 0.7 + i) * 24;
    const rg = actx.createLinearGradient(rx, 0, rx + 40, AH);
    rg.addColorStop(0, 'rgba(103,232,249,0.14)');
    rg.addColorStop(1, 'transparent');
    actx.fillStyle = rg;
    actx.beginPath();
    actx.moveTo(rx - 30, 0);
    actx.lineTo(rx + 30, 0);
    actx.lineTo(rx + 90, AH);
    actx.lineTo(rx - 90, AH);
    actx.closePath();
    actx.fill();
  }

  // Bioluminescent drifting spores
  for (const sp of spores) {
    sp.y += sp.vy;
    sp.x += Math.sin(t + sp.y * 0.03) * 0.4;
    if (sp.y < -10) { sp.y = AH + 10; sp.x = Math.random() * AW; }
    actx.fillStyle = sp.col;
    actx.beginPath();
    actx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
    actx.fill();
  }

  // Central Eye of the Deep / Kraken Boss Emblem (Rule 29)
  const cx = AW * 0.5, cy = AH * 0.52;
  const eyeGlow = actx.createRadialGradient(cx, cy, 10, cx, cy, 110);
  eyeGlow.addColorStop(0, currentZone === 3 ? 'rgba(244,114,182,0.45)' : 'rgba(34,211,238,0.32)');
  eyeGlow.addColorStop(1, 'transparent');
  actx.fillStyle = eyeGlow;
  actx.beginPath();
  actx.arc(cx, cy, 110, 0, Math.PI * 2);
  actx.fill();

  if (atlasLoaded) {
    const sw = atlasImg.width / 3, sh = atlasImg.height / 3;
    // Draw Kraken (0,0) on left & Eye of the Deep (2,2) on right
    const bob = Math.sin(t * 2.5) * 4;
    actx.drawImage(atlasImg, 0, 0, sw, sh, 45, 18 + bob, 138, 138);
    actx.drawImage(atlasImg, 2 * sw, 2 * sh, sw, sh, AW - 183, 18 - bob, 138, 138);
  }

  // Diegetic Gold/Biolume Jackpot & Boss Bar in Header
  actx.save();
  actx.textAlign = 'center';
  actx.font = '800 14px Cinzel, serif';
  actx.fillStyle = '#67e8f9';
  actx.fillText(currentZone === 3 ? 'ABYSSAL KRAKEN BOSS LAIR // GRAND JACKPOT' : `${z.name} // PROGRESSIVE ABYSSAL JACKPOT`, cx, 32);

  actx.font = '900 36px Cinzel, serif';
  actx.fillStyle = '#fde047';
  actx.shadowColor = 'rgba(244,114,182,0.85)';
  actx.shadowBlur = 18;
  actx.fillText(jackpot.toLocaleString() + ' TOKENS', cx, 74);

  // Kraken Boss Health Bar (always visible so player sees boss progress, supercharged in Zone 4)
  const bw = 380, bh = 14, bx = cx - bw / 2, by = 96;
  actx.fillStyle = 'rgba(2,8,18,0.85)';
  actx.strokeStyle = '#67e8f9';
  actx.lineWidth = 1.5;
  actx.strokeRect(bx, by, bw, bh);
  actx.fillRect(bx, by, bw, bh);
  const hpPct = Math.max(0, Math.min(1, krakenHp / krakenMaxHp));
  const barG = actx.createLinearGradient(bx, 0, bx + bw, 0);
  barG.addColorStop(0, '#f43f5e');
  barG.addColorStop(0.5, '#f472b6');
  barG.addColorStop(1, '#22d3ee');
  actx.fillStyle = barG;
  actx.fillRect(bx + 1, by + 1, (bw - 2) * hpPct, bh - 2);

  actx.font = '800 13px Cinzel, serif';
  actx.fillStyle = '#fff';
  actx.shadowBlur = 6;
  const phaseTxt = krakenDefeated
    ? 'ABYSSAL KRAKEN VANQUISHED // 2X WILDS UNLOCKED!'
    : (krakenHp <= krakenMaxHp * 0.5
        ? `KRAKEN PHASE II: SINGULARITY EYE (${krakenHp}/${krakenMaxHp} HP)`
        : `KRAKEN PHASE I: TENTACLE GRIP (${krakenHp}/${krakenMaxHp} HP)`);
  actx.fillText(phaseTxt, cx, by + 32);

  if (freeSpins > 0) {
    actx.fillStyle = '#4effb5';
    actx.font = '900 15px Cinzel, serif';
    actx.fillText(`FREE SPINS ACTIVE: ${freeSpins} REMAINING (2X PAYOUTS)`, cx, by + 54);
  }
  actx.restore();

  // --- 2. Render 5x3 Bioluminescent Reels Canvas ---
  const RW = 860, RH = 270;
  rctx.fillStyle = '#020814';
  rctx.fillRect(0, 0, RW, RH);

  const colW = RW / 5;
  const rowH = RH / 3;

  for (let r = 0; r < 5; r++) {
    const x0 = r * colW;
    // Column backing
    const cg = rctx.createLinearGradient(x0, 0, x0 + colW, 0);
    cg.addColorStop(0, 'rgba(6,24,44,0.95)');
    cg.addColorStop(0.5, heldReels[r] ? 'rgba(80,14,52,0.55)' : 'rgba(2,10,22,0.95)');
    cg.addColorStop(1, 'rgba(6,24,44,0.95)');
    rctx.fillStyle = cg;
    rctx.fillRect(x0 + 3, 3, colW - 6, RH - 6);

    // Reel spinning or locked symbols
    if (reelAnim[r] > 0) {
      reelAnim[r]--;
      if (reelAnim[r] === 0) {
        AUDIO.play('reel_stop', 0.8);
        if (reelAnim.every(v => v === 0)) {
          setTimeout(evaluateSpin, 80);
        }
      }
    }

    for (let row = 0; row < 3; row++) {
      const sym = reelAnim[r] > 0 ? randomSym(r) : grid[r][row];
      const cxCell = x0 + colW * 0.5;
      const cyCell = row * rowH + rowH * 0.5 + (reelAnim[r] > 0 ? ((reelAnim[r] * 18) % rowH) - rowH * 0.3 : 0);

      // Highlight aura if winning cell
      const hl = winHighlights.find(h => h.reel === r && h.row === row);
      if (hl) {
        const pulse = 36 + Math.sin(t * 10) * 6;
        const hg = rctx.createRadialGradient(cxCell, cyCell, 6, cxCell, cyCell, pulse);
        hg.addColorStop(0, hl.color);
        hg.addColorStop(1, 'transparent');
        rctx.fillStyle = hg;
        rctx.beginPath();
        rctx.arc(cxCell, cyCell, pulse, 0, Math.PI * 2);
        rctx.fill();
      }

      if (atlasLoaded && sym) {
        const sw = atlasImg.width / 3, sh = atlasImg.height / 3;
        const drawSize = Math.min(colW, rowH) - 10;
        rctx.save();
        if (hl) {
          rctx.shadowColor = sym.glow;
          rctx.shadowBlur = 18;
        }
        rctx.drawImage(
          atlasImg,
          sym.col * sw, sym.row * sh, sw, sh,
          cxCell - drawSize * 0.5, cyCell - drawSize * 0.5, drawSize, drawSize
        );
        rctx.restore();
      }
    }

    // Column divider & Hold frame
    rctx.strokeStyle = heldReels[r] ? '#f472b6' : 'rgba(103,232,249,0.28)';
    rctx.lineWidth = heldReels[r] ? 2.5 : 1.2;
    rctx.strokeRect(x0 + 3, 3, colW - 6, RH - 6);
  }

  // Winning payline laser beams
  for (const plIdx of winningPaylines) {
    const line = PAYLINES[plIdx];
    rctx.save();
    rctx.strokeStyle = '#fde047';
    rctx.lineWidth = 3.5;
    rctx.shadowColor = '#f472b6';
    rctx.shadowBlur = 14;
    rctx.beginPath();
    for (let r = 0; r < 5; r++) {
      const px = r * colW + colW * 0.5;
      const py = line[r] * rowH + rowH * 0.5;
      if (r === 0) rctx.moveTo(px, py);
      else rctx.lineTo(px, py);
    }
    rctx.stroke();
    rctx.restore();
  }

  // Particles & Floating Numbers over Reels
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.alpha -= 0.022;
    if (p.alpha <= 0) { particles.splice(i, 1); continue; }
    rctx.save();
    rctx.globalAlpha = p.alpha;
    rctx.fillStyle = p.color;
    rctx.beginPath();
    rctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    rctx.fill();
    rctx.restore();
  }

  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy; ft.alpha -= 0.016;
    if (ft.alpha <= 0) { floatingTexts.splice(i, 1); continue; }
    rctx.save();
    rctx.globalAlpha = ft.alpha;
    rctx.font = '900 24px Cinzel, serif';
    rctx.fillStyle = ft.color;
    rctx.textAlign = 'center';
    rctx.shadowColor = '#000';
    rctx.shadowBlur = 8;
    rctx.fillText(ft.text, ft.x, ft.y);
    rctx.restore();
  }
}

// ============================================================================
// GAMEPLAY ACTIONS: SPIN, TACTICAL HOLD, NUDGE & KRAKEN BOSS COMBAT
// ============================================================================
function setVerdict(txt, big = false) {
  const el = document.getElementById('verdict-line');
  el.textContent = txt;
  el.className = big ? 'big' : '';
}

function updateUI() {
  document.getElementById('token-count').textContent = tokens.toLocaleString();
  document.getElementById('bet-amount').textContent = totalBet.toLocaleString();
  document.getElementById('surge-pct').textContent = surge + '%';
  document.getElementById('surge-fill').style.width = surge + '%';
  document.getElementById('stat-spins').textContent = stats.spins;
  document.getElementById('stat-wins').textContent = stats.wins;
  document.getElementById('stat-biggest').textContent = stats.biggest.toLocaleString();
  document.getElementById('stat-best').textContent = stats.bestBank.toLocaleString();

  for (let r = 0; r < 5; r++) {
    const b = document.getElementById('hold-' + r);
    b.classList.toggle('held', heldReels[r]);
    b.textContent = heldReels[r] ? `LOCKED [${r+1}]` : `HOLD [${r+1}]`;
  }
  document.getElementById('nudge-btn').disabled = spinning || !nudgeAvailable;
}

function toggleHold(r) {
  AUDIO.unlock();
  if (spinning) return;
  if (!heldReels[r] && heldReels.filter(Boolean).length >= 2) {
    setVerdict('MAX 2 REELS CAN BE LOCKED PER SPIN');
    return;
  }
  heldReels[r] = !heldReels[r];
  AUDIO.play('bet_step', 0.8);
  updateUI();
}

function changeBet(dir) {
  AUDIO.unlock();
  if (spinning) return;
  const steps = [1, 2, 5, 10, 25];
  let idx = steps.indexOf(betPerLine);
  idx = Math.max(0, Math.min(steps.length - 1, idx + dir));
  betPerLine = steps[idx];
  totalBet = betPerLine * 20;
  AUDIO.play('bet_step', 0.8);
  updateUI();
}

function toggleAuto() {
  AUDIO.unlock();
  autoSpin = !autoSpin;
  document.getElementById('auto-btn').textContent = 'AUTO: ' + (autoSpin ? 'ON' : 'OFF');
  if (autoSpin && !spinning) spin();
}

function spin() {
  AUDIO.unlock();
  if (spinning) return;

  if (freeSpins <= 0) {
    if (tokens < totalBet) {
      tokens = 1000;
      setVerdict('ABYSSAL RESERVE RECHARGED (+1,000 TOKENS)', true);
    }
    tokens -= totalBet;
    jackpot += Math.max(5, Math.floor(totalBet * 0.1));
  } else {
    freeSpins--;
  }

  spinning = true;
  nudgeAvailable = true;
  winHighlights = [];
  winningPaylines = [];
  stats.spins++;
  surge = Math.min(100, surge + 20);
  AUDIO.play('spin_start', 0.9);
  document.getElementById('spin-btn').disabled = true;

  // Roll new symbols for non-held reels
  const overdrive = surge >= 100;
  for (let r = 0; r < 5; r++) {
    if (heldReels[r]) {
      reelAnim[r] = 2;
    } else {
      grid[r] = [randomSym(r), randomSym(r), randomSym(r)];
      reelAnim[r] = 16 + r * 9;
    }
  }

  // Biolume Overdrive guarantees an Expanding Kraken Wild on center reel!
  if (overdrive) {
    surge = 0;
    const wildSym = SYMBOLS[0];
    grid[2] = [wildSym, wildSym, wildSym];
    setVerdict('BIOLUME OVERDRIVE UNLEASHED! CENTER REEL EXPANDED KRAKEN WILD!', true);
  } else {
    setVerdict('DIVING INTO THE BIOLUME TRENCH...');
  }

  updateUI();
}

function evaluateLine(syms) {
  let base = null;
  for (const s of syms) {
    if (s.id !== 'wild' && s.id !== 'scatter') { base = s; break; }
  }
  if (!base) {
    if (syms.every(s => s.id === 'wild')) return SYMBOLS[0].pays[5];
    return 0;
  }
  let count = 0;
  for (const s of syms) {
    if (s.id === base.id || s.id === 'wild') count++;
    else break;
  }
  return base.pays[count] || 0;
}

function evaluateSpin() {
  spinning = false;
  document.getElementById('spin-btn').disabled = false;
  // Release holds after one locked spin so player can re-choose
  heldReels = [false, false, false, false, false];

  let rawWin = 0;
  winHighlights = [];
  winningPaylines = [];

  for (let pl = 0; pl < PAYLINES.length; pl++) {
    const line = PAYLINES[pl];
    const syms = line.map((row, reel) => grid[reel][row]);
    const pay = evaluateLine(syms);
    if (pay > 0) {
      rawWin += pay * betPerLine;
      winningPaylines.push(pl);
      line.forEach((row, reel) => {
        winHighlights.push({ reel, row, color: syms[reel].glow });
      });
    }
  }

  // Check Eye of the Deep Scatters anywhere on the 5x3 grid
  let scatters = 0;
  for (let r = 0; r < 5; r++) {
    for (let row = 0; row < 3; row++) {
      if (grid[r][row].id === 'scatter') {
        scatters++;
        winHighlights.push({ reel: r, row, color: '#4effb5' });
      }
    }
  }
  if (scatters >= 3) {
    const scPay = SYMBOLS[8].pays[Math.min(5, scatters)] * totalBet;
    rawWin += scPay;
    const addedFs = scatters === 3 ? 6 : scatters === 4 ? 10 : 16;
    freeSpins += addedFs;
    AUDIO.play('scatter', 0.95);
    spawnFloating(`EYE OF THE DEEP! +${addedFs} FREE SPINS!`, '#4effb5', 430, 95);
  }

  const mult = ZONES[currentZone].mult * (freeSpins > 0 ? 2 : 1) * (krakenDefeated ? 1.25 : 1);
  const totalWin = Math.floor(rawWin * mult);

  if (totalWin > 0) {
    tokens += totalWin;
    stats.wins++;
    if (totalWin > stats.biggest) stats.biggest = totalWin;

    // Damage the Abyssal Kraken Boss on every winning spin!
    if (!krakenDefeated) {
      const dmg = Math.max(85, Math.min(750, Math.floor(totalWin * 1.5)));
      krakenHp = Math.max(0, krakenHp - dmg);
      spawnFloating(`-${dmg} KRAKEN HP!`, '#f472b6', 430, 55);
      if (krakenHp === 0) {
        krakenDefeated = true;
        tokens += jackpot;
        hitStopFrames = 8;
        triggerShake();
        AUDIO.play('jackpot', 1.0);
        spawnParticles(430, 120, '#fde047', 70);
        setVerdict(`ABYSSAL KRAKEN DEFEATED! GRAND JACKPOT +${jackpot.toLocaleString()} TOKENS!`, true);
        jackpot = 25000;
      }
    }

    if (!krakenDefeated || krakenHp > 0) {
      if (totalWin >= totalBet * 8) {
        hitStopFrames = 5;
        triggerShake();
        AUDIO.play('bigwin', 0.95);
        setVerdict(`ABYSSAL MEGA PAYOUT! +${totalWin.toLocaleString()} TOKENS (${winningPaylines.length} LINES)!`, true);
      } else {
        AUDIO.play('win', 0.85);
        setVerdict(`BIOLUME WIN: +${totalWin.toLocaleString()} TOKENS (${winningPaylines.length} PAYLINES)`);
      }
    }
    spawnParticles(430, 140, '#22d3ee', 34);
    spawnFloating(`+${totalWin.toLocaleString()}`, '#fde047', 430, 145);
  } else {
    setVerdict('TAP ANY REEL TO LOCK FOR NEXT SPIN OR NUDGE REEL 3 [N]');
  }

  saveState();
  updateUI();

  if (autoSpin) {
    setTimeout(() => { if (autoSpin && !spinning) spin(); }, 950);
  }
}

function nudgeCenterReel() {
  AUDIO.unlock();
  if (spinning || !nudgeAvailable) return;
  nudgeAvailable = false;
  // Shift Reel 2 (center reel) down by 1 symbol and re-evaluate!
  grid[2].pop();
  grid[2].unshift(randomSym(2));
  AUDIO.play('reel_stop', 0.9);
  spawnParticles(430, 135, '#f472b6', 18);
  evaluateSpin();
}

// Touch / Click directly on Reels Canvas: tap column to Hold, swipe down to Spin
let touchStartY = null;
reelsCanvas.addEventListener('pointerdown', e => {
  AUDIO.unlock();
  touchStartY = e.clientY;
});
reelsCanvas.addEventListener('pointerup', e => {
  if (touchStartY !== null && e.clientY - touchStartY > 45 && !spinning) {
    touchStartY = null;
    spin();
    return;
  }
  touchStartY = null;
  if (spinning) return;
  const rect = reelsCanvas.getBoundingClientRect();
  const relX = (e.clientX - rect.left) / rect.width;
  const col = Math.min(4, Math.max(0, Math.floor(relX * 5)));
  toggleHold(col);
});

document.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toUpperCase();
  if (k === 'M') { AUDIO.toggle(); return; }
  AUDIO.unlock();
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); spin(); }
  else if (k === 'N') nudgeCenterReel();
  else if (['1','2','3','4','5'].includes(k)) toggleHold(parseInt(k, 10) - 1);
});

// Touch & Gamepad Support (touch-controls / touchstart / getGamepads)
document.getElementById('controls-area').classList.add('touch-controls');
reelsCanvas.addEventListener('touchstart', () => { AUDIO.unlock(); }, { passive: true });
let gpPrev = [];
function pollSlotsGamepad() {
  requestAnimationFrame(pollSlotsGamepad);
  if (!navigator.getGamepads) return;
  const pads = navigator.getGamepads();
  const gp = pads && pads[0];
  if (!gp) return;
  const pressed = i => gp.buttons[i] && gp.buttons[i].pressed && !gpPrev[i];
  if (pressed(0)) { AUDIO.unlock(); spin(); }
  if (pressed(1)) nudgeCenterReel();
  if (pressed(2)) toggleHold(0);
  if (pressed(3)) toggleHold(2);
  gpPrev = gp.buttons.map(b => b.pressed);
}
requestAnimationFrame(pollSlotsGamepad);

initGrid();
loadSave();
renderZoneRibbon();
updateUI();
requestAnimationFrame(renderLoop);
</script>
