<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="basaltGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="rosinLava" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="riverCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="holoSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="75%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="hexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#020617"/>

  <!-- DIE-CUT HEXAGONAL CONTAINER -->
  <g transform="translate(400, 400)" filter="url(#hexGlow)">
    <!-- White Die-Cut Hexagon Border -->
    <polygon points="0,-375 324.7,-187.5 324.7,187.5 0,375 -324.7,187.5 -324.7,-187.5" fill="#ffffff"/>
    <polygon points="0,-365 316,-182.5 316,182.5 0,365 -316,182.5 -316,-182.5" fill="none" stroke="url(#rosinLava)" stroke-width="5"/>
    <polygon points="0,-352 304.8,-176 304.8,176 0,352 -304.8,176 -304.8,-176" fill="url(#basaltGlow)" stroke="#334155" stroke-width="2"/>

    <!-- Concentric Sacred Hexagonal Grids -->
    <polygon points="0,-320 277,-160 277,160 0,320 -277,160 -277,-160" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,6"/>
    <polygon points="0,-270 233.8,-135 233.8,135 0,270 -233.8,135 -233.8,-135" fill="none" stroke="url(#holoSilver)" stroke-width="2"/>

    <!-- Basalt Columns (Cluster of 7 Isometric Hexagonal Prisms) -->
    <!-- Center Column -->
    <g transform="translate(0, 0)">
      <!-- Top Face -->
      <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="#334155" stroke="url(#rosinLava)" stroke-width="3"/>
      <!-- Inner Terpene Pool in Central Column -->
      <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" fill="url(#rosinLava)" opacity="0.85"/>
      <circle cx="0" cy="0" r="14" fill="#ffffff" opacity="0.9"/>
      <circle cx="0" cy="0" r="8" fill="#f59e0b"/>
    </g>

    <!-- 6 Surrounding Basalt Columns with Molten Live Rosin Fissures -->
    <!-- Angle 0 (Right) -->
    <g transform="translate(130, 0)">
      <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
      <path d="M -20 -15 Q 10 0 35 20" stroke="url(#rosinLava)" stroke-width="3" fill="none"/>
    </g>
    <!-- Angle 60 (Bottom Right) -->
    <g transform="translate(65, 112.5)">
      <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
      <path d="M -15 -25 Q 0 10 25 15" stroke="url(#rosinLava)" stroke-width="3" fill="none"/>
    </g>
    <!-- Angle 120 (Bottom Left) -->
    <g transform="translate(-65, 112.5)">
      <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
      <path d="M 20 -20 Q -10 5 -30 25" stroke="url(#rosinLava)" stroke-width="3" fill="none"/>
    </g>
    <!-- Angle 180 (Left) -->
    <g transform="translate(-130, 0)">
      <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
      <path d="M 25 10 Q -5 -15 -35 -5" stroke="url(#rosinLava)" stroke-width="3" fill="none"/>
    </g>
    <!-- Angle 240 (Top Left) -->
    <g transform="translate(-65, -112.5)">
      <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
      <path d="M 15 25 Q -10 0 -20 -30" stroke="url(#rosinLava)" stroke-width="3" fill="none"/>
    </g>
    <!-- Angle 300 (Top Right) -->
    <g transform="translate(65, -112.5)">
      <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
      <path d="M -25 20 Q 5 -5 30 -20" stroke="url(#rosinLava)" stroke-width="3" fill="none"/>
    </g>

    <!-- Churning Columbia River Rapids Waves along Lower Arc -->
    <g opacity="0.6">
      <path d="M -260 220 C -180 200 -120 250 -40 230 C 40 210 120 260 200 230 C 240 215 260 225 270 230" fill="none" stroke="url(#riverCyan)" stroke-width="4"/>
      <path d="M -240 250 C -160 230 -100 270 -20 250 C 60 230 140 280 220 250 C 250 240 260 245 270 250" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="10,6"/>
    </g>

    <!-- Hexagonal Crest Typography -->
    <text x="0" y="-235" font-family="'Cinzel', 'Trajan Pro', Georgia, serif" font-size="16" font-weight="bold" fill="url(#rosinLava)" text-anchor="middle" letter-spacing="5">COLUMBIA RIVER BASALT</text>
    <text x="0" y="-212" font-family="'Cinzel', 'Trajan Pro', Georgia, serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="4">GEOLOGICAL TERPENE MATRIX</text>

    <!-- Star Flanks -->
    <text x="-160" y="2" font-family="sans-serif" font-size="14" fill="#f59e0b">★</text>
    <text x="150" y="2" font-family="sans-serif" font-size="14" fill="#f59e0b">★</text>

    <text x="0" y="210" font-family="'Cinzel', 'Trajan Pro', Georgia, serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">10015 SW HALL BLVD</text>
    <text x="0" y="232" font-family="'Montserrat', sans-serif" font-size="10" font-weight="bold" fill="url(#rosinLava)" text-anchor="middle" letter-spacing="5">FORGED IN FIRE • CURED IN COLD</text>
  </g>
</svg>