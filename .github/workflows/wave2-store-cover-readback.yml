name: Wave 2 storefront cover readback
on:
  push:
    branches: [qa/wave2-store-cover-readback]
permissions:
  contents: read
jobs:
  covers:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            store
            holidays
            static/front
            static/front-door.css
      - run: |
          python -m pip install 'playwright==1.55.0' 'Pillow==11.3.0'
          python -m playwright install --with-deps chromium
      - name: Inspect the real store and holiday cards
        shell: python
        run: |
          from pathlib import Path
          import json, functools, http.server, threading
          from playwright.sync_api import sync_playwright
          products = [["/static/front/store/anodized-empires-collector-vault-cover.webp","https://andrewcog.gumroad.com/l/anodized-empires-and-anomalies-collector-vault"],["/static/front/store/northstar-12pack-watertight-stl-vault-cover.webp","https://andrewcog.gumroad.com/l/northstar-12pack-watertight-stl-vault"],["/static/front/store/northstar-2026-free-mega-sampler-cover.webp","https://andrewcog.gumroad.com/l/northstar-2026-free-mega-sampler"],["/static/front/store/northstar-godot4-6game-core-bundle-cover.webp","https://andrewcog.gumroad.com/l/northstar-godot4-6game-core-bundle"],["/static/front/store/northstar-godot4-9game-clean-vault-cover.webp","https://andrewcog.gumroad.com/l/northstar-godot4-9game-clean-vault"],["/static/front/store/northstar-idg-5game-html5-arcade-cover.webp","https://andrewcog.gumroad.com/l/northstar-idg-5game-html5-webgl-arcade-pack"]]
          eye = ["/static/front/nsp_signal_eye_v15.webp","https://andrewcog.gumroad.com/"]
          out = Path("screens")
          out.mkdir()
          handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory=".")
          with http.server.ThreadingHTTPServer(("127.0.0.1",0),handler) as srv, sync_playwright() as pw:
              threading.Thread(target=srv.serve_forever,daemon=True).start()
              browser=pw.chromium.launch()
              try:
                  for width in (390,768,1280):
                      page=browser.new_page(viewport={"width":width,"height":900}, device_scale_factor=1)
                      try:
                          for route in ("store","holidays"):
                              page.goto(f"http://127.0.0.1:{srv.server_port}/{route}/",wait_until="domcontentloaded")
                              for src,url in (products+[eye] if route=="store" else [products[2]]):
                                  item=page.locator(f'a[href="{url}"] img[src="{src}"]') if route=="store" else page.locator(f'article:has(a[href="{url}"]) img[src="{src}"]')
                                  assert item.count()==1,(route,src,item.count())
                                  item.scroll_into_view_if_needed()
                                  result=item.evaluate("""async im => { await im.decode();const r=im.getBoundingClientRect();return {natural:[im.naturalWidth,im.naturalHeight],width:r.width,height:r.height,left:r.left,right:r.right,fit:getComputedStyle(im).objectFit,alt:im.alt};}""")
                                  print(json.dumps([width,route,src,result]),flush=True)
                                  assert result["natural"]==([720,720] if src==eye[0] else [1280,720])
                                  assert result["width"]>70 and result["height"]>40 and result["left"]>=-1 and result["right"]<=width+1
                                  assert result["fit"]=="contain" or abs(result["width"]/result["height"] - result["natural"][0]/result["natural"][1])<0.04,(src,result)
                                  card=item.locator("xpath=ancestor::*[self::article or self::a][1]")
                                  card.screenshot(path=out/f"{route}-{width}-{Path(src).stem}.png",timeout=15000,animations="disabled")
                      finally:
                          page.close()
              finally:
                  browser.close()
                  srv.shutdown()
          print("PASS 24 buyer-facing cover placements, decoded dimensions, destinations and crop geometry")
      - name: Assemble the eight rendered cards at each width for visual review
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import base64, io
          for width in (390,768,1280):
              cards=sorted(Path("screens").glob(f"*-{width}-*.png"))
              assert len(cards)==8
              sheet=Image.new("RGB",(960,620),"#17171b")
              for i,card in enumerate(cards):
                  with Image.open(card) as im:
                      tile=ImageOps.contain(im.convert("RGB"),(230,300))
                      sheet.paste(tile,((i%4)*240+(240-tile.width)//2,(i//4)*310))
              out=io.BytesIO()
              sheet.save(out,format="JPEG",quality=72)
              data=base64.b64encode(out.getvalue()).decode()
              for index in range(0,len(data),2048):
                  print(f"SHEET-{width}-{index:06}-{data[index:index+2048]}")
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storefront-cover-readback
          path: screens/
          retention-days: 5
