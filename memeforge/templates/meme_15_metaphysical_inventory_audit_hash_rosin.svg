<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Flemish Renaissance Oil Glazes & Candlelight -->
    <radialGradient id="candlelightGlow" cx="45%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#3b2010"/>
      <stop offset="40%" stop-color="#231309"/>
      <stop offset="75%" stop-color="#120904"/>
      <stop offset="100%" stop-color="#050201"/>
    </radialGradient>

    <!-- Rich Flemish Damask & Velvet Robes -->
    <linearGradient id="burgundyVelvet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="emeraldDamask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <linearGradient id="brassScales" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <filter id="oilShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Canvas Base -->
  <rect width="800" height="1000" fill="url(#candlelightGlow)"/>

  <!-- Ornate Gilded Renaissance Frame -->
  <rect x="30" y="30" width="740" height="940" fill="none" stroke="#78350f" stroke-width="8"/>
  <rect x="38" y="38" width="724" height="924" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <rect x="46" y="46" width="708" height="908" fill="none" stroke="#3e1c0d" stroke-width="2"/>

  <!-- HEADER -->
  <g transform="translate(400, 95)" text-anchor="middle">
    <text font-family="'Cinzel', 'Georgia', serif" font-weight="900" font-size="24" fill="#fbbf24" letter-spacing="4">
      MUSEUM APOTHECARIVM : COMPVTO INVENTARII
    </text>
    <line x1="-280" y1="14" x2="280" y2="14" stroke="#b45309" stroke-width="2"/>
    <text font-family="'Georgia', serif" font-style="italic" font-size="12" fill="#d97706" y="32">
      After Marinus van Reymerswale (c. 1540, Re-audited for Metrc Discrepancy Reconciliation)
    </text>
  </g>

  <!-- MAIN OIL PAINTING SCENE -->
  <g transform="translate(65, 150)">
    <rect x="0" y="0" width="670" height="660" fill="#1c0f07" stroke="#451a03" stroke-width="3"/>

    <!-- Oak Desk & Shelves Background -->
    <!-- Apothecary Shelves behind figures with Herb Jars and Parchment Rolls -->
    <rect x="20" y="20" width="630" height="16" fill="#451a03"/>
    <rect x="20" y="100" width="630" height="16" fill="#451a03"/>
    <!-- Jars on Top Shelf -->
    <g fill="#78350f" stroke="#240c01" stroke-width="1.5">
      <rect x="60" y="-12" width="30" height="32" rx="3" fill="#064e3b"/>
      <rect x="110" y="-15" width="25" height="35" rx="3" fill="#b45309"/>
      <rect x="520" y="-15" width="35" height="35" rx="3" fill="#1e1b4b"/>
      <rect x="575" y="-10" width="28" height="30" rx="3" fill="#78350f"/>
    </g>

    <!-- Heavy Oak Counting Table Surface -->
    <path d="M 0 460 L 670 460 L 670 660 L 0 660 Z" fill="#2d160a" stroke="#170903" stroke-width="2"/>
    <line x1="0" y1="460" x2="670" y2="460" stroke="#78350f" stroke-width="3"/>

    <!-- LEFT FIGURE: DISPENSARY VAULT MANAGER (Holding Brass Balance) -->
    <g transform="translate(160, 260)">
      <!-- Fur Collar & Emerald Damask Robe -->
      <path d="M -90 190 L -60 40 Q 0 20 60 40 L 90 190 Z" fill="url(#emeraldDamask)" stroke="#0f291e" stroke-width="2.5"/>
      <path d="M -50 40 Q 0 80 50 40 L 60 90 Q 0 130 -60 90 Z" fill="#451a03"/> <!-- Fur Stole -->

      <!-- Head & Neck -->
      <ellipse cx="0" cy="0" rx="34" ry="42" fill="#e8cbb0" stroke="#3b1d11" stroke-width="1.5"/>
      
      <!-- Eccentric Puffed Renaissance Scholar Cap (Crimson with Velvet Folds) -->
      <path d="M -55 -20 Q 0 -85 55 -20 Q 70 -50 30 -75 Q -30 -75 -70 -50 Z" fill="#991b1b" stroke="#450a0a" stroke-width="2"/>
      <ellipse cx="0" cy="-20" rx="45" ry="14" fill="#7f1d1d"/>

      <!-- Wireframe Pince-Nez Spectacles perched on crooked nose -->
      <circle cx="-12" cy="-2" r="10" fill="#ffffff" fill-opacity="0.25" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="16" cy="-2" r="10" fill="#ffffff" fill-opacity="0.25" stroke="#fbbf24" stroke-width="2"/>
      <path d="M -2 -4 Q 2 -10 6 -4" fill="none" stroke="#fbbf24" stroke-width="2"/>

      <!-- Hyper-Focused Skeptical Eyes & Wrinkles -->
      <circle cx="-12" cy="-2" r="3" fill="#29180c"/>
      <circle cx="16" cy="-2" r="3" fill="#29180c"/>
      <path d="M -25 -14 Q -12 -22 0 -14" fill="none" stroke="#451a03" stroke-width="1.5"/>
      <path d="M 5 -14 Q 18 -22 30 -14" fill="none" stroke="#451a03" stroke-width="1.5"/>

      <!-- Hand delicately holding the string of the Analytical Brass Balance -->
      <path d="M 70 80 Q 85 100 80 130" fill="none" stroke="#e8cbb0" stroke-width="14" stroke-linecap="round"/>
      <circle cx="80" cy="130" r="8" fill="#e8cbb0"/>

      <!-- ANALYTICAL BRASS BALANCE (Weighing Live Rosin Jar) -->
      <g transform="translate(80, 130)">
        <line x1="0" y1="0" x2="0" y2="40" stroke="url(#brassScales)" stroke-width="3"/>
        <line x1="-55" y1="40" x2="55" y2="35" stroke="url(#brassScales)" stroke-width="4"/> <!-- Balance Beam -->
        <circle cx="0" cy="40" r="6" fill="url(#brassScales)"/>

        <!-- Left Pan (Holding 1.00g weights) -->
        <line x1="-55" y1="40" x2="-75" y2="95" stroke="#fef08a" stroke-width="1"/>
        <line x1="-55" y1="40" x2="-35" y2="95" stroke="#fef08a" stroke-width="1"/>
        <ellipse cx="-55" cy="95" rx="24" ry="6" fill="url(#brassScales)"/>
        <!-- Tiny Brass Weights on Pan -->
        <rect x="-62" y="85" width="6" height="8" fill="#fbbf24"/>
        <rect x="-54" y="87" width="5" height="6" fill="#fbbf24"/>

        <!-- Right Pan (Holding glistening Void Kush Rosin Jar) -->
        <line x1="55" y1="35" x2="35" y2="90" stroke="#fef08a" stroke-width="1"/>
        <line x1="55" y1="35" x2="75" y2="90" stroke="#fef08a" stroke-width="1"/>
        <ellipse cx="55" cy="90" rx="24" ry="6" fill="url(#brassScales)"/>

        <!-- Glistening Hexagonal Rosin Jar (Void Kush 0.04g Discrepancy) -->
        <rect x="42" y="68" width="26" height="20" rx="3" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
        <ellipse cx="55" cy="68" rx="13" ry="4" fill="#fbbf24"/>
        <!-- Amber Rosin Core inside Jar -->
        <circle cx="55" cy="78" r="6" fill="#f59e0b"/>
      </g>
    </g>

    <!-- RIGHT FIGURE: LEAD METRC AUDITOR (Writing with Goose Quill) -->
    <g transform="translate(480, 270)">
      <!-- Burgundy Velvet Scholar Robe -->
      <path d="M -90 180 L -60 30 Q 0 10 60 30 L 90 180 Z" fill="url(#burgundyVelvet)" stroke="#2e1065" stroke-width="2.5"/>

      <!-- Head hunched over the ledger -->
      <ellipse cx="-15" cy="0" rx="32" ry="40" fill="#ebd2bc" stroke="#3b1d11" stroke-width="1.5"/>
      
      <!-- Folded Dark Velvet Beret / Cap -->
      <path d="M -55 -25 Q 0 -60 45 -25 L 35 -10 L -45 -10 Z" fill="#1e1b4b" stroke="#0f172a" stroke-width="2"/>

      <!-- Anxious, Wide-Eyed Stare at Ledger -->
      <circle cx="-25" cy="-2" r="5" fill="#ffffff" stroke="#3b1d11" stroke-width="1.5"/>
      <circle cx="-25" cy="-2" r="2.5" fill="#000000"/>
      <circle cx="-5" cy="-2" r="5" fill="#ffffff" stroke="#3b1d11" stroke-width="1.5"/>
      <circle cx="-5" cy="-2" r="2.5" fill="#000000"/>

      <!-- Right Arm Extended with Goose Quill Pen -->
      <path d="M -40 70 L -70 140" stroke="#ebd2bc" stroke-width="12" stroke-linecap="round"/>
      <!-- Long White Goose Quill Feather Pen -->
      <path d="M -70 140 C -85 100 -110 50 -130 10 C -120 40 -100 90 -75 145 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <polygon points="-75,145 -78,155 -72,148" fill="#1e293b"/> <!-- Ink Nib -->
    </g>

    <!-- THE MASSIVE METRC RECONCILIATION LEDGER (On Table) -->
    <g transform="translate(340, 480)">
      <!-- Bound Leather Book Open -->
      <polygon points="-160,110 0,90 160,110 150,-10 0,-25 -150,-10" fill="#78350f" stroke="#3e1c0d" stroke-width="2.5"/>
      <!-- Sheepskin Parchment Pages (Left & Right Spreads) -->
      <polygon points="-155,100 -5,82 -5,-15 -145,-5" fill="#fcf6ea" stroke="#451a03" stroke-width="1"/>
      <polygon points="5,82 155,100 145,-5 5,-15" fill="#fcf6ea" stroke="#451a03" stroke-width="1"/>

      <!-- Script Lines & Red Column Dividers in Ledger -->
      <line x1="-135" y1="15" x2="-20" y2="20" stroke="#451a03" stroke-width="1" stroke-dasharray="3,2"/>
      <line x1="-135" y1="35" x2="-20" y2="40" stroke="#451a03" stroke-width="1" stroke-dasharray="3,2"/>
      <line x1="-135" y1="55" x2="-20" y2="60" stroke="#451a03" stroke-width="1" stroke-dasharray="3,2"/>

      <!-- Ledger Header Text -->
      <text font-family="'Cinzel', serif" font-weight="bold" font-size="7.5" fill="#991b1b" x="-75" y="8" text-anchor="middle">METRC UID #1A40103</text>
      <text font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#047857" x="75" y="8" text-anchor="middle">VOID KUSH: -0.04g !</text>

      <line x1="20" y1="20" x2="135" y2="25" stroke="#991b1b" stroke-width="1.2"/>
      <line x1="20" y1="40" x2="135" y2="45" stroke="#451a03" stroke-width="1" stroke-dasharray="3,2"/>
      <line x1="20" y1="60" x2="135" y2="65" stroke="#451a03" stroke-width="1" stroke-dasharray="3,2"/>

      <!-- Wax Seal Stamp on Ledger Rib -->
      <circle cx="0" cy="85" r="9" fill="#991b1b" stroke="#450a0a" stroke-width="1"/>
      <text font-family="'Cinzel', serif" font-size="5" fill="#fef08a" x="0" y="87" text-anchor="middle">OLCC</text>
    </g>

    <!-- Table Accoutrements: Candle in Brass Stick, Gold Coins, Abacus -->
    <g transform="translate(60, 480)">
      <!-- Brass Candlestick with Single Flickering Flame -->
      <rect x="15" y="30" width="10" height="45" fill="url(#brassScales)"/>
      <polygon points="10,75 30,75 25,65 15,65" fill="url(#brassScales)"/>
      <rect x="17" y="10" width="6" height="20" fill="#fef3c7"/> <!-- Wax candle -->
      <!-- Flame -->
      <path d="M 20 10 Q 25 -5 20 -15 Q 15 -5 20 10 Z" fill="#f59e0b"/>
      <circle cx="20" cy="-2" r="3" fill="#fef08a"/>
      <!-- Radiating Glow -->
      <circle cx="20" cy="-2" r="25" fill="#fbbf24" opacity="0.2"/>

      <!-- Stack of Gilded Oregon Cannabis Coins on Table -->
      <ellipse cx="65" cy="85" rx="14" ry="5" fill="#b45309" stroke="#78350f" stroke-width="1"/>
      <ellipse cx="65" cy="81" rx="14" ry="5" fill="#f59e0b" stroke="#78350f" stroke-width="1"/>
      <ellipse cx="65" cy="77" rx="14" ry="5" fill="#fbbf24" stroke="#78350f" stroke-width="1"/>
    </g>

    <!-- SKEPTICAL VAULT RAVEN (Perched on Book Shelf) -->
    <g transform="translate(560, 115)">
      <!-- Raven Silhouette in tiny velvet leather waistcoat -->
      <path d="M 15 20 Q 30 0 50 15 Q 65 30 55 55 Q 40 60 30 50 Q 20 55 15 40 Z" fill="#0f172a"/>
      <!-- Red waistcoat -->
      <path d="M 25 25 L 45 25 L 40 45 L 25 45 Z" fill="#991b1b"/>
      <polygon points="52,22 68,25 55,32" fill="#fbbf24"/> <!-- Beak -->
      <circle cx="45" cy="18" r="2.5" fill="#ffffff"/>
      <circle cx="46" cy="18" r="1.2" fill="#000000"/>
      <!-- Wire spectacles on Raven -->
      <circle cx="45" cy="18" r="4" fill="none" stroke="#fbbf24" stroke-width="1"/>
    </g>
  </g>

  <!-- MEME CAPTION SCROLL -->
  <g transform="translate(400, 850)">
    <path d="M -345 -20 L -315 -40 L 315 -40 L 345 -20 L 315 35 L -315 35 Z" fill="#221108" filter="url(#oilShadow)"/>
    <path d="M -335 -16 L -310 -34 L 310 -34 L 335 -16 L 310 30 L -310 30 Z" fill="#fbf7ec" stroke="#221108" stroke-width="1.5"/>
    <text font-family="'Cinzel', 'Georgia', serif" font-weight="900" font-size="15" fill="#221108" text-anchor="middle" y="-6">
      "ME AND THE SHIFT LEAD RECONCILING 0.04 GRAMS OF UNACCOUNTED"
    </text>
    <text font-family="'Cinzel', 'Georgia', serif" font-weight="900" font-size="15" fill="#991b1b" text-anchor="middle" y="16">
      VOID KUSH LIVE ROSIN AT 2:14 AM BEFORE SUBMITTING METRC
    </text>
  </g>

  <!-- SUBFOOTER METRICS & CREDENTIALS -->
  <g transform="translate(400, 930)" text-anchor="middle">
    <text font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#fef08a" letter-spacing="2">
      THE OLCC AUDIT PROTOCOL • THE CDC DISPENSARY • 10015 SW HALL BLVD
    </text>
    <text font-family="'Georgia', serif" font-style="italic" font-size="10" fill="#d97706" y="18">
      Analytical Balance Precision • Zero Tolerance Inventory Compliance • Tigard, Oregon
    </text>
  </g>
</svg>
