name: Deploy curated NorthStar Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build curated artifact
        run: python tools/build_pages_artifact.py --output "$GITHUB_WORKSPACE/output/pages-artifact"
      - name: Verify curated artifact
        run: python tools/verify_pages_artifact.py --artifact "$GITHUB_WORKSPACE/output/pages-artifact"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: output/pages-artifact
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
