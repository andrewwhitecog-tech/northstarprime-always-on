  <meta charset="utf-8">

  <title>Screening Room — NorthStar Prime</title>
  <link rel="canonical" href="https://app.northstarprime.net/idc/screening-room">

  <style>
    :root {
      --void: #060913;
      --panel-border: rgba(237, 202, 131, 0.22);
      --gold: #edca83;
      --cyan: #38bdf8;
      --muted: #94a3b8;
    }
    body {
      background: radial-gradient(ellipse at 50% 20%, rgba(237,202,131,0.08), transparent 45%),
                  radial-gradient(ellipse at 80% 80%, rgba(56,189,248,0.06), transparent 50%),
                  var(--void);
      color: #f1f5f9;
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      box-sizing: border-box;
      text-align: center;
    }
    .transit-card {
      max-width: 520px;
      width: 100%;
      background: rgba(13, 19, 34, 0.85);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 3rem 2rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .transit-star {
      font-size: 2.5rem;
      color: var(--gold);
      display: block;
      margin-bottom: 1rem;
    }
    .transit-tag {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 0.6rem;
    }
    h1 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      margin: 0 0 1rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }
    p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
      margin: 0 0 2rem;
    }
    .btn-enter {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.8rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.92rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-decoration: none;
      background: var(--gold);
      color: #060913;
    }
  </style>
