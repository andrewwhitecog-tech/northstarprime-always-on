<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GLYPHBREAKER : XBLA TOURNAMENT EDITION 2.0</title>
<style>
:root {
  --x-green: #5dc312;
  --x-dark-green: #2a6808;
  --x-silver: #d9dfde;
  --x-dark: #07090d;
  --x-cyan: #2fe6ff;
  --x-gold: #efc76b;
  --x-crimson: #ff2a5f;
  --x-purple: #d883ff;
  --x-text-glow: rgba(93, 195, 18, 0.45);
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body {
  background: radial-gradient(circle at 50% 10%, #151a24 0%, #07090d 65%, #020305 100%);
  color: #fff;
  font-family: "Segoe UI", "Trebuchet MS", Arial, sans-serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* CRT Scanline Overlay */
.crt-overlay {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
  background-size: 100% 3px, 6px 100%;
  pointer-events: none;
  z-index: 999;
  opacity: 0.65;
  transition: opacity 0.3s;
}
.crt-overlay.disabled { opacity: 0; }

/* Top Bar Header */
header {
  height: 56px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 24px;
  background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 100%);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  z-index: 100;
  flex-shrink: 0;
}
.gamertag-badge {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(0, 0, 0, 0.45);
  padding: 5px 16px 5px 8px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.15);
}
.avatar-orb {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, #5dc312, #2a6808);
  border: 2px solid #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 14px; color: #fff;
}
.gamertag-name { font-size: 13px; font-weight: 700; color: #fff; }
.gamerscore { font-size: 12px; color: #5dc312; font-weight: 800; display: flex; align-items: center; gap: 4px; }
.g-icon {
  background: #5dc312; color: #000;
  width: 13px; height: 13px;
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 900;
}

.ring-of-light {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: #111;
  border: 2px solid #333;
  position: relative;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 14px rgba(93, 195, 18, 0.4);
}
.ring-quadrant {
  position: absolute;
  width: 9px; height: 9px;
  background: #5dc312;
  border-radius: 2px;
  box-shadow: 0 0 8px #5dc312;
}
.quadrant-1 { top: 3px; left: 3px; }
.xbox-nexus-x { font-size: 13px; font-weight: 900; color: #fff; opacity: 0.85; z-index: 2; }

.system-status { display: flex; gap: 12px; align-items: center; font-size: 11px; }
.status-pill {
  background: rgba(0, 0, 0, 0.4);
  padding: 4px 12px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.1);
  color: #d9dfde;
}
.status-pill.active {
  background: rgba(93, 195, 18, 0.15);
  border-color: #5dc312;
  color: #5dc312;
  font-weight: 700;
  box-shadow: 0 0 10px rgba(93, 195, 18, 0.3);
}

.crypto-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(47, 230, 255, 0.12);
  border: 1px solid #2fe6ff;
  color: #2fe6ff;
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  text-decoration: none;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: all 0.2s;
}
.crypto-btn:hover { background: rgba(47, 230, 255, 0.25); box-shadow: 0 0 12px rgba(47, 230, 255, 0.4); }

/* Main Arena Viewport */
#arena-viewport {
  position: relative;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  overflow: hidden;
}
canvas#gameCanvas {
  display: block;
  width: min(800px, calc(100vw - 16px));
  height: auto;
  max-height: calc(100vh - 110px);
  aspect-ratio: 4/3;
  object-fit: contain;
  touch-action: none;
  border: 2px solid rgba(239, 199, 107, 0.4);
  border-radius: 8px;
  box-shadow: 0 0 35px rgba(216, 131, 255, 0.2), 0 20px 60px #000;
  background: #04060a;
}

/* Controller HUD Footer */
footer.ctrl-hud {
  height: 44px;
  background: rgba(6, 9, 12, 0.9);
  backdrop-filter: blur(8px);
  border-top: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 16px;
  font-size: 11px;
  color: #a5f3fc;
  letter-spacing: 1px;
  z-index: 100;
  flex-shrink: 0;
}
.btn-prompt { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
.btn-icon {
  width: 18px; height: 18px;
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 10px; color: #000;
  box-shadow: 0 0 6px rgba(0,0,0,0.5);
}
.btn-a { background: #5dc312; color: #000; }
.btn-b { background: #ff2a5f; color: #fff; }
.btn-x { background: #2fe6ff; color: #000; }
.btn-y { background: #ffe45c; color: #000; }
.btn-trig { background: #333; color: #fff; border: 1px solid #777; border-radius: 4px; padding: 1px 4px; font-size: 9px; }

/* Achievement Toast Notification */
#achievementToast {
  position: fixed;
  bottom: -90px;
  left: 50%;
  transform: translateX(-50%);
  width: 440px;
  height: 68px;
  background: linear-gradient(90deg, #1b2416 0%, #0d120a 100%);
  border: 2px solid #5dc312;
  border-radius: 34px;
  box-shadow: 0 0 25px rgba(93, 195, 18, 0.6), 0 10px 30px rgba(0,0,0,0.8);
  display: flex;
  align-items: center;
  padding: 0 18px;
  gap: 14px;
  z-index: 1000;
  transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  pointer-events: none;
}
#achievementToast.show { bottom: 60px; }
.achieve-orb {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #88ff3b, #2a6808);
  border: 2px solid #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 18px; color: #fff;
  flex-shrink: 0;
  box-shadow: 0 0 10px #5dc312;
}
.achieve-text { display: flex; flex-direction: column; overflow: hidden; }
.achieve-title { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #5dc312; font-weight: 800; }
.achieve-desc { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; text-overflow: ellipsis; }
.achieve-score { margin-left: auto; font-size: 14px; font-weight: 900; color: #5dc312; display: flex; align-items: center; gap: 4px; }
</style>
</head>
<body>

<div id="crtOverlay" class="crt-overlay"></div>

<header>
  <div class="gamertag-badge">
    <div class="avatar-orb">A</div>
    <div class="gamertag-name">ANDRE COG</div>
    <div class="gamerscore"><span class="g-icon">G</span> <span id="gsTally">126,100</span></div>
  </div>

  <div class="ring-of-light">
    <div class="ring-quadrant quadrant-1"></div>
    <div class="xbox-nexus-x">X</div>
  </div>

  <div class="system-status">
    <span id="ctrlStatusBadge" class="status-pill">[KEYBOARD / MOUSE READY]</span>
    <button id="crtToggleBtn" class="status-pill" style="cursor:pointer; background:rgba(255,255,255,0.06);">[CRT: ON]</button>
    <a href="/crypto?game=glyphbreaker-xbla&pane=arcade-pane" target="_blank" class="crypto-btn">SpaceCash Attest</a>
  </div>
</header>

<div id="arena-viewport">
  <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<footer class="ctrl-hud">
  <span class="btn-prompt"><span class="btn-trig">L-STICK</span> STEER PADDLE</span>
  <span class="btn-prompt"><span class="btn-icon btn-a">A</span> / <span class="btn-trig">RT</span> LAUNCH / FIRE</span>
  <span class="btn-prompt"><span class="btn-icon btn-x">X</span> / <span class="btn-trig">LB</span> PARRY DASH</span>
  <span class="btn-prompt"><span class="btn-icon btn-y">Y</span> / <span class="btn-trig">LT</span> SINGULARITY CATCH</span>
  <span class="btn-prompt"><span class="btn-icon btn-b">B</span> / <span class="btn-trig">RB</span> HARMONIC EMP</span>
  <span class="btn-prompt"><span class="btn-trig">BACK</span> CRT SHADER</span>
</footer>

<!-- Achievement Toast -->
<div id="achievementToast">
  <div class="achieve-orb">X</div>
  <div class="achieve-text">
    <span class="achieve-title">Achievement Unlocked</span>
    <span id="achieveName" class="achieve-desc">First Fracture</span>
  </div>
  <div class="achieve-score"><span class="g-icon">G</span> <span id="achievePts">10</span></div>
</div>

<script>
// ============================================================================
// GLYPHBREAKER : XBLA TOURNAMENT EDITION 2.0
// High-Octane Breakout AI + Gamepad API + Dual-Rumble Haptics
// 200G Achievement Engine + Web Audio 432Hz Synthesizer + Zero Emojis
// ============================================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let baseGamerscore = 126100;
let earnedGamerscore = 0;
const gsTallyEl = document.getElementById('gsTally');
const ctrlStatusBadge = document.getElementById('ctrlStatusBadge');
const crtOverlay = document.getElementById('crtOverlay');
const crtToggleBtn = document.getElementById('crtToggleBtn');

let crtEnabled = true;
crtToggleBtn.addEventListener('click', () => {
  crtEnabled = !crtEnabled;
  crtOverlay.classList.toggle('disabled', !crtEnabled);
  crtToggleBtn.innerText = crtEnabled ? '[CRT: ON]' : '[CRT: OFF]';
});

// --- 200G Achievement Manifest ---
const ACHIEVEMENTS = [
  { id: 'first_fracture', name: 'First Fracture', desc: 'Shatter your first illuminated glyph stone.', points: 10, unlocked: false },
  { id: 'singularity_catch', name: 'Singularity Catch', desc: 'Catch and hold a high-velocity ball with Singularity tractor beam.', points: 25, unlocked: false },
  { id: 'parry_reflex', name: 'Parry Reflex', desc: 'Deflect a descending hazard laser with frame-perfect paddle parry.', points: 30, unlocked: false },
  { id: 'seal_breaker', name: 'Seal Breaker', desc: 'Clear 3 complete glyph seal layers in a single run.', points: 35, unlocked: false },
  { id: 'multiball_overdrive', name: 'Multiball Overdrive', desc: 'Juggle 4 or more quantum harmonic balls simultaneously.', points: 40, unlocked: false },
  { id: 'glyph_sovereign', name: 'Glyph Sovereign', desc: 'Achieve a tournament score of 50,000 resonance points.', points: 60, unlocked: false }
];

function loadAchievements() {
  try {
    const saved = localStorage.getItem('xbla_glyphbreaker_achievements');
    if (saved) {
      const ids = JSON.parse(saved);
      ACHIEVEMENTS.forEach(a => {
        if (ids.includes(a.id)) {
          a.unlocked = true;
          earnedGamerscore += a.points;
        }
      });
      gsTallyEl.innerText = (baseGamerscore + earnedGamerscore).toLocaleString();
    }
  } catch (e) {}
}
loadAchievements();

function saveAchievements() {
  try {
    const unlockedIds = ACHIEVEMENTS.filter(a => a.unlocked).map(a => a.id);
    localStorage.setItem('xbla_glyphbreaker_achievements', JSON.stringify(unlockedIds));
  } catch (e) {}
}

function unlockAchievement(id) {
  const ach = ACHIEVEMENTS.find(a => a.id === id);
  if (!ach || ach.unlocked) return;
  ach.unlocked = true;
  earnedGamerscore += ach.points;
  gsTallyEl.innerText = (baseGamerscore + earnedGamerscore).toLocaleString();
  saveAchievements();

  // Play authentic achievement chimes (587.33 Hz -> 880 Hz sine glissando)
  playAchievementChime();
  triggerGamepadRumble(120, 0.35, 0.65);
  setTimeout(() => triggerGamepadRumble(120, 0.45, 0.75), 180);

  // Show Toast
  const toast = document.getElementById('achievementToast');
  document.getElementById('achieveName').innerText = ach.name;
  document.getElementById('achievePts').innerText = ach.points;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 4500);
}

// --- Web Audio Synthesizer (Offline-First) ---
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playAchievementChime() {
  initAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  try {
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc1.type = 'sine'; osc2.type = 'triangle';
    osc1.frequency.setValueAtTime(587.33, now); // D5
    osc1.frequency.exponentialRampToValueAtTime(880.00, now + 0.18); // A5
    osc2.frequency.setValueAtTime(880.00, now + 0.18);
    osc2.frequency.exponentialRampToValueAtTime(1174.66, now + 0.45); // D6
    g.gain.setValueAtTime(0.35, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
    osc1.connect(g); osc2.connect(g); g.connect(audioCtx.destination);
    osc1.start(now); osc1.stop(now + 0.22);
    osc2.start(now + 0.18); osc2.stop(now + 0.7);
  } catch (e) {}
}

function playSynthTone(freq, dur, type = 'sine', gain = 0.15, slide = null) {
  initAudio();
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(10, slide), audioCtx.currentTime + dur);
    g.gain.setValueAtTime(gain, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

// Gamepad API & Dual-Rumble Haptics
let gamepadConnected = false;
let prevGpButtons = {};

window.addEventListener('gamepadconnected', () => {
  gamepadConnected = true;
  ctrlStatusBadge.innerText = '[XBOX 360 CONTROLLER ACTIVE]';
  ctrlStatusBadge.classList.add('active');
  triggerGamepadRumble(150, 0.45, 0.25);
});

window.addEventListener('gamepaddisconnected', () => {
  gamepadConnected = false;
  ctrlStatusBadge.innerText = '[KEYBOARD / MOUSE READY]';
  ctrlStatusBadge.classList.remove('active');
});

function triggerGamepadRumble(durationMs, strongMag, weakMag) {
  try {
    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of gamepads) {
      if (gp && gp.vibrationActuator && gp.vibrationActuator.playEffect) {
        gp.vibrationActuator.playEffect('dual-rumble', {
          startDelay: 0,
          duration: durationMs,
          weakMagnitude: weakMag || 0,
          strongMagnitude: strongMag || 0
        }).catch(() => {});
      }
    }
  } catch (e) {}
}

// Visual FX Engine
const FX = { shake: 0, sx: 0, sy: 0, flash: 0, flashCol: '255,255,255' };
function fxShake(m) { FX.shake = Math.max(FX.shake, Math.min(18, m)); }
function fxFlash(a, col) { if (a >= FX.flash) { FX.flash = Math.min(0.6, a); FX.flashCol = col || '255,255,255'; } }
function fxUpdate() {
  if (FX.shake > 0.15) {
    FX.sx = (Math.random() * 2 - 1) * FX.shake;
    FX.sy = (Math.random() * 2 - 1) * FX.shake;
    FX.shake *= 0.86;
  } else {
    FX.shake = 0; FX.sx = 0; FX.sy = 0;
  }
  FX.flash *= 0.85;
  if (FX.flash < 0.012) FX.flash = 0;
}

// Game State Constants & Variables
const STATE = { MENU: 0, PLAY: 1, DEAD: 2 };
let state = STATE.MENU;
let highScore = parseInt(localStorage.getItem('glyphbreaker_hi')) || 0;

const BRICK_W = 70, BRICK_H = 30;
const PADDLE_W_DEFAULT = 110, PADDLE_H = 18, BALL_R = 6;

let paddle, balls, bricks, powerups, particles, floatingTexts;
let score = 0, lives = 3, level = 1, comboCount = 0;
let parryCooldown = 0, parryActive = 0;
let caughtBall = null, catchCooldown = 0;
let empCooldown = 0;

function addFloatingText(x, y, text, color = '#efc76b', size = 13) {
  floatingTexts.push({ x, y, text, color, size, life: 1.0, vy: -1.1 });
}

function initGame() {
  paddle = { x: W / 2 - PADDLE_W_DEFAULT / 2, y: H - 50, w: PADDLE_W_DEFAULT, h: PADDLE_H, vx: 0 };
  balls = [{ x: W / 2, y: H - 70, vx: 4, vy: -5, r: BALL_R, launched: false }];
  bricks = [];
  powerups = [];
  particles = [];
  floatingTexts = [];
  score = 0;
  lives = 3;
  level = 1;
  comboCount = 0;
  parryCooldown = 0;
  parryActive = 0;
  caughtBall = null;
  catchCooldown = 0;
  empCooldown = 0;

  spawnBricks(level);
}

function spawnBricks(lvl) {
  bricks = [];
  const rows = Math.min(7, 3 + lvl);
  const cols = 9;
  const startX = (W - (cols * (BRICK_W + 8))) / 2;
  const startY = 70;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const bx = startX + c * (BRICK_W + 8);
      const by = startY + r * (BRICK_H + 6);
      const hits = (r === 0 || r === 1) ? 2 : 1;
      const hue = [45, 185, 290, 140, 20][r % 5];
      bricks.push({ x: bx, y: by, w: BRICK_W, h: BRICK_H, hits, maxHits: hits, hue });
    }
  }
}

// Keyboard Listeners
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  initAudio();
  if (['Space', 'ArrowLeft', 'ArrowRight', 'ShiftLeft', 'KeyZ', 'KeyQ'].includes(e.code)) e.preventDefault();

  if (e.code === 'Space') {
    if (state === STATE.MENU) { initGame(); state = STATE.PLAY; }
    else if (state === STATE.DEAD) { state = STATE.MENU; }
    else if (state === STATE.PLAY && balls[0] && !balls[0].launched) {
      balls[0].launched = true;
      playSynthTone(440, 0.1, 'triangle', 0.2, 880);
    }
  }
  if (state === STATE.PLAY) {
    if (e.code === 'ShiftLeft') triggerParry();
    if (e.code === 'KeyZ') triggerCatch();
    if (e.code === 'KeyQ') triggerEMP();
  }
});
document.addEventListener('keyup', e => keys[e.code] = false);

// Gamepad Polling
function pollGamepad() {
  const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
  if (!gamepads || !gamepads[0]) return;
  const gp = gamepads[0];

  // Left Stick Horizontal Paddle Steering
  const ax0 = gp.axes[0] || 0;
  if (Math.abs(ax0) > 0.15) {
    paddle.x += ax0 * 11;
  }

  // Buttons
  const btnA = gp.buttons[0] && gp.buttons[0].pressed;
  const btnB = gp.buttons[1] && gp.buttons[1].pressed;
  const btnX = gp.buttons[2] && gp.buttons[2].pressed;
  const btnY = gp.buttons[3] && gp.buttons[3].pressed;
  const btnLB = gp.buttons[4] && gp.buttons[4].pressed;
  const btnRB = gp.buttons[5] && gp.buttons[5].pressed;
  const btnLT = (gp.buttons[6] && gp.buttons[6].pressed) || (gp.buttons[6] && gp.buttons[6].value > 0.3);
  const btnRT = (gp.buttons[7] && gp.buttons[7].pressed) || (gp.buttons[7] && gp.buttons[7].value > 0.3);
  const btnStart = gp.buttons[9] && gp.buttons[9].pressed;
  const btnBack = gp.buttons[8] && gp.buttons[8].pressed;

  if (btnStart && !prevGpButtons.start) {
    initAudio();
    if (state === STATE.MENU) { initGame(); state = STATE.PLAY; }
    else if (state === STATE.DEAD) { state = STATE.MENU; }
  }

  if (btnBack && !prevGpButtons.back) {
    crtToggleBtn.click();
  }

  if (state === STATE.PLAY) {
    if ((btnRT || btnA) && balls[0] && !balls[0].launched) {
      balls[0].launched = true;
      playSynthTone(440, 0.1, 'triangle', 0.2, 880);
      triggerGamepadRumble(60, 0.15, 0.25);
    }
    if ((btnX || btnLB) && !prevGpButtons.x && !prevGpButtons.lb) {
      triggerParry();
    }
    if ((btnY || btnLT) && !prevGpButtons.y && !prevGpButtons.lt) {
      triggerCatch();
    }
    if ((btnB || btnRB) && !prevGpButtons.b && !prevGpButtons.rb) {
      triggerEMP();
    }
  }

  prevGpButtons = { a: btnA, b: btnB, x: btnX, y: btnY, lb: btnLB, rb: btnRB, lt: btnLT, rt: btnRT, start: btnStart, back: btnBack };
}

function triggerParry() {
  if (parryCooldown > 0) return;
  parryCooldown = 80;
  parryActive = 14;
  playSynthTone(1200, 0.2, 'sine', 0.25, 2400);
  fxFlash(0.3, '47,230,255');
  fxShake(6);
  triggerGamepadRumble(120, 0.45, 0.55);
}

function triggerCatch() {
  if (catchCooldown > 0) return;
  catchCooldown = 300;
  playSynthTone(700, 0.2, 'sine', 0.2, 1100);
  triggerGamepadRumble(90, 0.25, 0.4);
  unlockAchievement('singularity_catch');
  addFloatingText(paddle.x + paddle.w / 2, paddle.y - 20, "SINGULARITY CATCH", "#ffe45c", 14);
}

function triggerEMP() {
  if (empCooldown > 0 || score < 500) return;
  empCooldown = 450;
  score -= 200;
  playSynthTone(90, 0.5, 'sawtooth', 0.35, 30);
  fxShake(14);
  fxFlash(0.5, '216,131,255');
  triggerGamepadRumble(300, 0.85, 0.7);

  // Damage all bricks on screen
  for (let i = bricks.length - 1; i >= 0; i--) {
    bricks[i].hits--;
    if (bricks[i].hits <= 0) {
      shatterBrick(i);
    }
  }
}

function shatterBrick(idx) {
  const b = bricks[idx];
  bricks.splice(idx, 1);
  score += 150 * (1 + comboCount * 0.2);
  comboCount++;
  if (score > highScore) { highScore = score; localStorage.setItem('glyphbreaker_hi', highScore); }

  playSynthTone(440 + (b.hue % 400), 0.15, 'sine', 0.2, 1200);
  fxShake(3);
  triggerGamepadRumble(50, 0.1, 0.25);
  unlockAchievement('first_fracture');

  // Chance to spawn Powerup
  if (Math.random() < 0.22) {
    const type = Math.random() < 0.45 ? 'multi' : Math.random() < 0.75 ? 'wide' : 'life';
    powerups.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, type, vy: 2.2 });
  }
}

// Main Simulation Loop
function update() {
  pollGamepad();
  fxUpdate();

  if (state !== STATE.PLAY) return;

  // Keyboard Steer
  if (keys['ArrowLeft']) paddle.x -= 9;
  if (keys['ArrowRight']) paddle.x += 9;

  // Clamp Paddle
  paddle.x = Math.max(10, Math.min(W - paddle.w - 10, paddle.x));

  // Timers
  if (parryCooldown > 0) parryCooldown--;
  if (parryActive > 0) parryActive--;
  if (catchCooldown > 0) catchCooldown--;
  if (empCooldown > 0) empCooldown--;

  // Update Balls
  for (let i = balls.length - 1; i >= 0; i--) {
    const ball = balls[i];
    if (!ball.launched) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 2;
      continue;
    }

    ball.x += ball.vx;
    ball.y += ball.vy;

    // Walls
    if (ball.x - ball.r < 8) { ball.x = 8 + ball.r; ball.vx = Math.abs(ball.vx); playSynthTone(600, 0.05, 'triangle', 0.1); }
    if (ball.x + ball.r > W - 8) { ball.x = W - 8 - ball.r; ball.vx = -Math.abs(ball.vx); playSynthTone(600, 0.05, 'triangle', 0.1); }
    if (ball.y - ball.r < 8) { ball.y = 8 + ball.r; ball.vy = Math.abs(ball.vy); playSynthTone(600, 0.05, 'triangle', 0.1); }

    // Paddle Rebound
    if (ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x >= paddle.x - 4 && ball.x <= paddle.x + paddle.w + 4 && ball.vy > 0) {
      
      if (parryActive > 0) {
        // Supercharged Parry!
        ball.vy = -Math.abs(ball.vy) * 1.35;
        ball.vx *= 1.2;
        unlockAchievement('parry_reflex');
        addFloatingText(paddle.x + paddle.w / 2, paddle.y - 25, "PARRY BOOST!", "#2fe6ff", 16);
        playSynthTone(1400, 0.25, 'sine', 0.3, 2800);
        triggerGamepadRumble(140, 0.45, 0.7);
      } else {
        const offset = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        ball.vx = offset * 7.5;
        ball.vy = -Math.abs(ball.vy);
        playSynthTone(340, 0.08, 'sine', 0.15, 520);
        triggerGamepadRumble(40, 0.06, 0.2);
      }
    }

    // Brick Collisions
    for (let j = bricks.length - 1; j >= 0; j--) {
      const b = bricks[j];
      if (ball.x + ball.r >= b.x && ball.x - ball.r <= b.x + b.w &&
          ball.y + ball.r >= b.y && ball.y - ball.r <= b.y + b.h) {
        
        ball.vy = -ball.vy;
        b.hits--;
        if (b.hits <= 0) {
          shatterBrick(j);
        } else {
          playSynthTone(520, 0.08, 'triangle', 0.15, 880);
          triggerGamepadRumble(40, 0.1, 0.15);
        }
        break;
      }
    }

    // Ball Out of Bounds
    if (ball.y > H + 20) {
      balls.splice(i, 1);
    }
  }

  // Check Multiball Achievement
  if (balls.length >= 4) unlockAchievement('multiball_overdrive');

  // Check Lives Lost
  if (balls.length === 0) {
    lives--;
    comboCount = 0;
    playSynthTone(150, 0.35, 'sawtooth', 0.3, 30);
    fxShake(12);
    fxFlash(0.4, '255,42,95');
    triggerGamepadRumble(350, 0.7, 0.5);

    if (lives <= 0) {
      state = STATE.DEAD;
    } else {
      balls = [{ x: paddle.x + paddle.w / 2, y: paddle.y - BALL_R - 2, vx: 4, vy: -5, r: BALL_R, launched: false }];
    }
  }

  // Update Powerups
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += p.vy;

    // Caught by paddle
    if (p.y >= paddle.y && p.y <= paddle.y + paddle.h &&
        p.x >= paddle.x && p.x <= paddle.x + paddle.w) {
      
      playSynthTone(880, 0.15, 'sine', 0.25, 1760);
      triggerGamepadRumble(80, 0.2, 0.4);
      addFloatingText(p.x, p.y - 15, p.type.toUpperCase(), "#5dc312", 14);

      if (p.type === 'wide') {
        paddle.w = Math.min(200, paddle.w + 35);
      } else if (p.type === 'multi') {
        if (balls[0]) {
          balls.push({ x: balls[0].x, y: balls[0].y, vx: -balls[0].vx, vy: balls[0].vy, r: BALL_R, launched: true });
          balls.push({ x: balls[0].x, y: balls[0].y, vx: balls[0].vx * 0.8, vy: -Math.abs(balls[0].vy), r: BALL_R, launched: true });
        }
      } else if (p.type === 'life') {
        lives++;
      }
      powerups.splice(i, 1);
    } else if (p.y > H + 20) {
      powerups.splice(i, 1);
    }
  }

  // Check Wave Clear
  if (bricks.length === 0) {
    level++;
    addFloatingText(W / 2, H / 2, `SEAL LAYER ${level} CRACKED`, "#5dc312", 22);
    if (level >= 3) unlockAchievement('seal_breaker');
    spawnBricks(level);
    balls = [{ x: paddle.x + paddle.w / 2, y: paddle.y - BALL_R - 2, vx: 4, vy: -5, r: BALL_R, launched: false }];
  }

  // Check Score Sovereign Achievement
  if (score >= 50000) unlockAchievement('glyph_sovereign');
}

// Render Loop
function draw() {
  ctx.save();
  ctx.translate(FX.sx, FX.sy);

  // Background
  ctx.fillStyle = '#05030a';
  ctx.fillRect(0, 0, W, H);

  // Ambient Grid
  ctx.strokeStyle = 'rgba(216, 131, 255, 0.05)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  if (state === STATE.MENU) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#efc76b';
    ctx.font = 'bold 36px "Segoe UI", sans-serif';
    ctx.fillText("GLYPHBREAKER : XBLA 2.0", W / 2, H / 2 - 50);

    ctx.fillStyle = '#5dc312';
    ctx.font = '700 16px "Segoe UI", sans-serif';
    ctx.fillText("XBOX 360 LIVE ARCADE TOURNAMENT EDITION", W / 2, H / 2 - 16);

    ctx.fillStyle = '#d9dfde';
    ctx.font = '14px monospace';
    ctx.fillText("PRESS (A) OR [SPACE] TO COMMENCE RUN", W / 2, H / 2 + 35);
    ctx.fillText("HIGH SCORE: " + highScore.toLocaleString(), W / 2, H / 2 + 75);
    ctx.restore();
    return;
  }

  // Draw Bricks
  for (const b of bricks) {
    ctx.fillStyle = `hsl(${b.hue}, 85%, ${b.hits === 2 ? 65 : 45}%)`;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeRect(b.x, b.y, b.w, b.h);
  }

  // Draw Powerups
  for (const p of powerups) {
    ctx.fillStyle = p.type === 'wide' ? '#5eead4' : p.type === 'multi' ? '#d883ff' : '#ff8d9e';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw Paddle
  ctx.fillStyle = parryActive > 0 ? '#2fe6ff' : '#5dc312';
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
  ctx.strokeRect(paddle.x, paddle.y, paddle.w, paddle.h);

  // Draw Balls
  for (const ball of balls) {
    ctx.fillStyle = '#2fe6ff';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw HUD Overlay
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px "Segoe UI", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`SCORE: ${Math.round(score).toLocaleString()}`, 20, 30);
  ctx.fillText(`LIVES: ${lives}`, 20, 52);
  ctx.fillText(`SEAL: ${level}`, 20, 74);

  // Floating Texts
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy;
    ft.life -= 0.02;
    ctx.fillStyle = ft.color;
    ctx.globalAlpha = Math.max(0, ft.life);
    ctx.font = `bold ${ft.size}px "Segoe UI", sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.globalAlpha = 1;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }

  // Flash Screen
  if (FX.flash > 0) {
    ctx.fillStyle = `rgba(${FX.flashCol},${FX.flash})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (state === STATE.DEAD) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff2a5f';
    ctx.font = 'bold 38px "Segoe UI", sans-serif';
    ctx.fillText("CONTINUITY SEVERED", W / 2, H / 2 - 20);
    ctx.fillStyle = '#fff';
    ctx.font = '15px monospace';
    ctx.fillText("PRESS (A) OR [SPACE] TO RETURN TO DOCK", W / 2, H / 2 + 25);
  }

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
